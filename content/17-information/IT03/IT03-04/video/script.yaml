title: 詐欺・フィッシングの見分け方
scenes:
  - board: whiteboard
    steps:
      - say: 「詐欺の見分け方」です。詐欺の手口は年々たくみになっていて、知識がないと、だれでもだまされる可能性があります。よくある手口のパターンを見ていきましょう。
        show:
          - { type: title, text: よくある手口 }
      - say: 1つ目は、急がせることです。「今すぐ対応しないと、アカウントが停止されます」「24時間以内に払わないと、法的な手続きをとります」。あせらせて、冷静な判断をうばうのがねらいです。
        show:
          - { type: box, color: pink, w: 1100, title: ① 急がせる, text: "「今すぐ」「24時間以内に」→ あせらせて判断をうばう" }
      - say: 2つ目は、えらい人や有名な会社のふりをすることです。アマゾン、楽天、アップル、銀行、税務署、警察、宅配業者などです。ロゴやデザインは、本物そっくりです。
        show:
          - { type: box, color: yellow, w: 1100, title: ② 権威のふり, text: "Amazon・銀行・税務署・警察・宅配業者などを名乗る。見た目は本物そっくり" }
      - say: 3つ目は、ギフトカードでの支払いを求めることです。電話やメールで、ギフト券で払ってください、と言ってきたら、詐欺です。正式な機関が、この払い方を求めることはありません。
        show:
          - { type: box, color: blue, w: 1100, title: ③ ギフトカードで払わせる, text: "ギフト券で払って ＝ 詐欺。正式な機関は絶対に求めない" }

  - board: whiteboard
    steps:
      - say: 具体的な、チェックポイントです。
        show:
          - { type: title, text: チェックポイント }
      - say: メールの送り主のアドレスを確かめましょう。名前はアマゾンでも、アドレスを見ると、オーの代わりにゼロが入った、にせものだったりします。
        show:
          - { type: text, text: "① 送り主のアドレスを確かめる（例：amaz**0**n-support@random.com）" }
      - say: リンクは、クリックする前に、どこに飛ぶのかを確かめましょう。パソコンなら、カーソルを乗せると、行き先が表示されます。
        show:
          - { type: text, text: "② リンクの行き先をクリック前に確かめる" }
      - say: そして、いちばん確実なのは、メールのリンクから行かないことです。公式サイトには、ブックマークや公式アプリから行きましょう。あやしい電話は、一度切って、公式の番号に自分からかけ直します。
        show:
          - { type: text, text: "③ 公式サイトにはブックマーク・公式アプリから。あやしい電話は切って、公式の番号にかけ直す" }
      - say: 何より大事なのは、急いで対処しなければ、という気持ちを、いったん止めることです。おかしいと思ったら、一呼吸おいて、家族や、公式の窓口に相談しましょう。
        show:
          - { type: box, color: yellow, w: 1100, text: "最大の防御：「急がなきゃ」という気持ちをいったん止める" }
