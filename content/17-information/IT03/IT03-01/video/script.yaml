title: サイバー脅威の種類と手口
scenes:
  - board: slide
    steps:
      - say: 第3章、「セキュリティとプライバシー」です。
        show:
          - { type: title, text: 第3章　セキュリティとプライバシー }
      - say: ネットの危険の種類と、パスワード、暗号化、そして詐欺の見分け方を学びます。
        show:
          - type: list
            items: ["サイバー脅威の種類と手口", "パスワードと認証の現在", "暗号化とHTTPS", "詐欺・フィッシングの見分け方"]
      - say: サイバー攻撃は、特別な人だけがねらわれるものではありません。手口を知っておくことが、自分の財産と情報を守る、いちばんの防御です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "ネットの危険の手口を知り、自分の情報とお金を守れるようにする" }

  - board: whiteboard
    steps:
      - say: マルウェアは、悪いことをするために作られたソフトウェアの、まとめた呼び名です。ウイルスなどがふくまれます。
        show:
          - { type: title, text: マルウェア }
          - { type: text, text: "**マルウェア** ＝ 悪意を持って作られたソフト（ウイルスなど）" }
      - say: 感染すると、個人情報をぬすまれたり、パソコンを乗っとられたり、ほかのコンピュータへ広げられたりします。
        show:
          - { type: text, color: pink, text: "被害：個人情報をぬすむ・乗っとる・ほかへ広げる" }
      - say: 主な感染のきっかけは、あやしいファイルを開くこと、あやしいリンクをクリックすること、そして、アップデートしていない、弱点のあるソフトを使い続けることです。
        show:
          - { type: box, color: yellow, w: 1100, title: 感染のきっかけ, text: "あやしいファイル・あやしいリンク・アップデートしていないソフト" }

  - board: whiteboard
    steps:
      - say: ランサムウェアは、ファイルを暗号化して使えなくし、元にもどしてほしければ身代金を払え、と要求するマルウェアです。病院や会社がねらわれ、業務が止まる被害も起きています。
        show:
          - { type: title, text: ランサムウェアとフィッシング }
          - { type: box, color: pink, w: 1100, title: ランサムウェア, text: "ファイルを暗号化して「元にもどしたければ身代金を払え」" }
      - say: 対策として大事なのが、バックアップです。大事なファイルの写しを、別の場所にとっておけば、人質にとられても、取りもどせます。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "対策：大事なファイルのバックアップを別の場所に" }
      - say: フィッシングは、銀行やSNS、通販サイトなどのふりをした、にせのメールやにせのサイトで、IDとパスワードをだましとる手口です。「アカウントが停止されます」「不正ログインを検知しました」と、急がせて、考える力をうばうのが特徴です。
        show:
          - { type: box, color: yellow, w: 1100, title: フィッシング, text: "にせメール・にせサイトでIDとパスワードをだましとる。「停止されます」と急がせる" }
