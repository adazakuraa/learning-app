questions:
  - q: ファイルを暗号化して使えなくし、「元に戻したければ身代金を払え」と要求する不正なソフトを何というでしょう？
    a: [ランサムウェア]
  - q: 銀行や通販サイトなどをよそおった偽のメールや偽サイトで、IDやパスワードを盗む手口を何というでしょう？
    a: [フィッシング, フィッシング詐欺]
    show: フィッシング
  - q: パスワードに加えて、スマホに届くコードなど、もう1つの確認を求める仕組みを何というでしょう？
    a: [二段階認証, 2段階認証, 多要素認証, 二要素認証]
    show: 二段階認証
  - q: パスワードを使わずに、顔認証や指紋などで安全にログインする新しい方式を何というでしょう？
    a: [パスキー]
