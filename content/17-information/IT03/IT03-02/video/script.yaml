title: パスワードと認証の現在
scenes:
  - board: whiteboard
    steps:
      - say: 「パスワードと認証」です。パスワードは、古くからある、今も大切な、本人確認の手段です。でも、多くの人の使い方は、危険です。
        show:
          - { type: title, text: 悪いパスワード・強いパスワード }
      - say: 悪いパスワードの典型は、短い、辞書にある単語、名前と誕生日、キーボードの並び、そして、いくつものサービスでの使い回しです。
        show:
          - { type: box, color: pink, w: 1100, title: 悪い例, text: "短い・辞書の単語・名前＋誕生日・qwerty や 123456・使い回し" }
      - say: 特に危ないのが、使い回しです。どこか一つのサービスから漏れると、同じパスワードで、ほかのサービスにも、次々と入られてしまいます。一本の合いかぎで、家も車も会社も開いてしまうようなものです。
        added: true
        show:
          - { type: text, color: gray, text: "使い回し ＝ 一本の合いかぎで、家も車も会社も開く状態" }
      - say: 強いパスワードは、長いこと。12文字以上が理想です。大文字、小文字、数字、記号をまぜた、意味のない文字の並びで、サービスごとに変えることです。
        show:
          - { type: box, color: green, w: 1100, title: 強い例, text: "12文字以上・文字の種類をまぜる・意味のない並び・サービスごとに変える" }

  - board: whiteboard
    steps:
      - say: でも、全部のサービスで、ちがう強いパスワードを覚えるのは、人間には不可能です。そこで役に立つのが、パスワードマネージャーです。ひとつのマスターパスワードで、すべてのパスワードを管理し、自動で入力もしてくれます。
        show:
          - { type: title, text: パスワードを守る道具 }
          - { type: box, color: blue, w: 1100, title: パスワードマネージャー, text: "マスターパスワード一つで全部を管理・自動入力" }
      - say: 二段階認証は、パスワードに加えて、もう一つの確認を求めるしくみです。知っているもの、つまりパスワードに、持っているもの、つまりスマートフォンを組み合わせます。SMSで届くコードや、認証アプリ、物理的なキーなどがあります。
        show:
          - { type: box, color: yellow, w: 1100, title: 二段階認証, text: "知っているもの（パスワード）＋ 持っているもの（スマホ）" }
      - say: パスキーは、最近広がっている、新しい方式です。パスワードを使わず、顔認証や指紋で本人確認をします。にせサイトでは使えないので、フィッシングに強く、パスワードが漏れる心配もありません。
        show:
          - { type: box, color: green, w: 1100, title: パスキー, text: "パスワード不要。顔・指紋で認証。フィッシングに強い次世代の方式" }
