title: コンピュータの三層構造
scenes:
  - board: slide
    steps:
      - say: 情報の最初の章、「コンピュータの基礎」です。
        show:
          - { type: title, text: 第1章　コンピュータの基礎 }
      - say: 毎日使っているパソコンやスマートフォンが、中でどう動いているのかを学びます。
        show:
          - type: list
            items: ["コンピュータの三層構造", "デジタルとは何か", "OSとアプリの関係", "ファイル・クラウド・同期"]
      - say: しくみがわかると、機械を買うときに何を見ればいいか、調子が悪いときに何をすればいいかが、わかるようになります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "パソコン・スマホのしくみを知り、選び方や使い方に生かす" }

  - board: whiteboard
    steps:
      - say: コンピュータは、大きく3つの部品で動いています。CPU、メモリ、ストレージです。料理にたとえると、わかりやすくなります。
        show:
          - { type: title, text: 3つの部品 }
          - type: svg
            w: 1100
            h: 200
            markup: |
              <g stroke-width="3"><rect x="10" y="20" width="320" height="140" rx="16" stroke="#f4a3b8"/><rect x="390" y="20" width="320" height="140" rx="16" stroke="#f3d77a"/><rect x="770" y="20" width="320" height="140" rx="16" stroke="#8fc4ff"/></g>
              <g stroke="none" text-anchor="middle"><text x="170" y="75" font-size="32" fill="#f4a3b8">CPU</text><text x="170" y="125" font-size="24" fill="#f4a3b8">料理人（脳）</text><text x="550" y="75" font-size="32" fill="#f3d77a">メモリ</text><text x="550" y="125" font-size="24" fill="#f3d77a">作業台</text><text x="930" y="75" font-size="32" fill="#8fc4ff">ストレージ</text><text x="930" y="125" font-size="24" fill="#8fc4ff">冷蔵庫・本棚</text></g>
      - say: CPUは、脳にあたる部品で、計算や判断、命令の実行をすべて行います。料理人ですね。性能が高いほど、複雑な処理を速くこなせます。「Core i9」や「M3」などとよばれる部分です。
        show:
          - { type: text, color: pink, text: "**CPU**：計算・判断・実行。性能が高いほど速い（Core i9、M3 など）" }
      - say: メモリは、作業台です。今使っているアプリや、開いているタブは、すべてメモリの上に広げられています。作業台がせまいと、たくさんの料理を同時に作れませんね。タブを開きすぎると重くなるのは、メモリが足りなくなるからです。「16GB」などの数字が、メモリの大きさです。
        show:
          - { type: text, color: yellow, text: "**メモリ（RAM）**：作業台。足りないと重くなる（16GB など）" }
      - say: ストレージは、冷蔵庫や本棚です。写真や動画、アプリなどを、電源を切っても残るように保存しておく場所です。
        show:
          - { type: text, color: blue, text: "**ストレージ**：電源を切っても残る保存場所（写真・アプリ・OS）" }

  - board: whiteboard
    steps:
      - say: ストレージには、SSDと、HDDがあります。
        show:
          - { type: title, text: SSD と HDD }
      - say: SSDは、読み書きが速く、衝撃にも強いのが特徴です。HDDは、大容量で安いのですが、遅くてこわれやすいです。最近のパソコンやスマートフォンは、ほとんどがSSDです。
        show:
          - { type: box, color: green, w: 1100, title: SSD, text: "速い・衝撃に強い。最近の機械はほぼこれ" }
          - { type: box, color: gray, w: 1100, title: HDD, text: "大容量で安い。ただし遅く、こわれやすい" }
      - say: パソコンを選ぶときは、この3つの数字を見比べるのが基本です。作業台、つまりメモリが小さいと、CPUがどんなに速くても、もたつきます。
        added: true
        show:
          - { type: text, color: yellow, text: "パソコン選び：CPU・メモリ・ストレージの3つを見比べる" }
