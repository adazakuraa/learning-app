questions:
  - q: コンピュータの「脳」にあたり、計算や命令の実行をになう部品を何というか。
    a: [CPU]
  - q: 今使っているデータを一時的に置く「作業台」にあたる部品を何というか。
    a: [メモリ, RAM]
    show: メモリ（RAM）
  - q: 1バイトは何ビットか。
    a: ['8', 8ビット]
    show: 8ビット
  - q: パソコンやスマホの基本的な動作を管理するソフトウェア（WindowsやiOSなど）を、アルファベット2文字で何というか。
    a: [OS]
  - q: ファイル名の末尾についている「.jpg」「.pdf」のような部分を何というか。
    a: [拡張子]
