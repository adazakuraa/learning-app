title: 情報とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、情報がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 情報とは
      - say: 情報では、コンピュータの基礎、インターネットとネットワーク、セキュリティとプライバシー、AIサービスの使い方と仕組みを学びます。
        read: 情報では、コンピュータの基礎、インターネットとネットワーク、セキュリティとプライバシー、エーアイサービスの使い方と仕組みを学びます。
        show:
          - type: box
            w: 1100
            text: 情報では、コンピュータの基礎、インターネットとネットワーク、セキュリティとプライバシー、AIサービスの使い方と仕組みを学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で4章です。第1章はコンピュータの基礎、第2章はインターネットとネットワーク、第3章はセキュリティとプライバシー、第4章はAIサービスの使い方と理解。
        read: この科目は、全部で4章です。第1章はコンピュータの基礎、第2章はインターネットとネットワーク、第3章はセキュリティとプライバシー、第4章はエーアイサービスの使い方と理解。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　コンピュータの基礎
              - 第2章　インターネットとネットワーク
              - 第3章　セキュリティとプライバシー
              - 第4章　AIサービスの使い方と理解
            at:
              - 80
              - 150
  - board: whiteboard
    steps:
      - say: では、情報を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、デジタル機器を使いこなせる。スマホやパソコンの仕組みがわかると、トラブルのときにも落ち着いて対処できます。
        show:
          - type: box
            w: 1100
            text: |-
              **デジタル機器を使いこなせる**
              スマホやパソコンの仕組みがわかると、トラブルのときにも落ち着いて対処できます。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、詐欺や被害から身を守れる。フィッシング詐欺や乗っ取りの手口を知っていれば、被害の多くは防げます。
        show:
          - type: box
            w: 1100
            text: |-
              **詐欺や被害から身を守れる**
              フィッシング詐欺や乗っ取りの手口を知っていれば、被害の多くは防げます。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、AIと上手に付き合える。AIの得意なことと苦手なことを知ると、便利に使いながら、間違いに振り回されずにすみます。
        read: みっつ目は、エーアイと上手に付き合える。エーアイの得意なことと苦手なことを知ると、便利に使いながら、間違いに振り回されずにすみます。
        show:
          - type: box
            w: 1100
            text: |-
              **AIと上手に付き合える**
              AIの得意なことと苦手なことを知ると、便利に使いながら、間違いに振り回されずにすみます。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、怪しいメールやSMSが届いたとき、パスワードや設定を見直すとき、AIを仕事や勉強に使うとき、などに役立ちます。
        read: たとえば、怪しいメールやエスエムエスが届いたとき、パスワードや設定を見直すとき、エーアイを仕事や勉強に使うとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 怪しいメールやSMSが届いたとき
              - パスワードや設定を見直すとき
              - AIを仕事や勉強に使うとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、用語は実際の画面や機器と結びつける。そして、自分のスマホの設定を確かめながら学ぶ。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・用語は**実際の画面や機器**と結びつける
              ・自分のスマホの設定を確かめながら学ぶ
            color: pink
            at:
              - 80
              - 420
