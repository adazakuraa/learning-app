questions:
  - q: インターネット上の「住所」にあたる番号を何というでしょう？
    a: [IPアドレス]
  - q: 自宅のネットワークとインターネットをつなぐ機器を何というでしょう？
    a: [ルーター]
  - q: ウェブサイトがブラウザに保存する小さなデータで、ログイン状態の保持などに使われるものを何というでしょう？
    a: [Cookie, クッキー]
    show: Cookie（クッキー）
  - q: URLの「https」の最後の s は何の略でしょう？
    a: [Secure, セキュア]
    show: Secure（安全な）
