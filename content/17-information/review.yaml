questions:
  - {u: IT01-01, p: 45, q: "写真やアプリを長く保存する、コンピュータの「本棚」にあたる記憶装置を何というでしょう？SSDやHDDがその例です。", a: [ストレージ]}
  - {u: IT01-02, p: 45, q: "情報の最小単位で、0か1かを表すものを何というでしょう？", a: [ビット]}
  - {u: IT01-03, p: 45, q: "WindowsやiOSのように、コンピュータの基本的な動作を管理するソフトを何というでしょう？", a: [OS, オペレーティングシステム]}
  - {u: IT01-04, p: 40, q: "ファイル名の最後についている「.jpg」や「.pdf」のような部分を何というでしょう？", a: [拡張子]}
  - {u: IT02-01, p: 40, q: "インターネット上の住所にあたる番号を、人が読みやすい「google.com」のような名前に変換したものを何というでしょう？", a: [ドメイン名, ドメイン]}
  - {u: IT02-02, p: 40, q: "一度読み込んだウェブページのデータを一時保存し、次から速く表示する仕組みを何というでしょう？", a: [キャッシュ]}
  - {u: IT02-03, p: 45, q: "携帯電話会社の基地局を経由する通信に対し、ルーターの電波で接続する無線通信の規格を何というでしょう？", a: [WiFi, Wi-Fi, ワイファイ]}
  - {u: IT03-01, p: 45, q: "ウイルスなど、悪意を持って作られたソフトウェアをまとめて何というでしょう？", a: [マルウェア]}
  - {u: IT03-02, p: 40, q: "パスワードを使わずに、顔認証や指紋で安全にログインする新しい方式を何というでしょう？", a: [パスキー]}
  - {u: IT03-03, p: 40, q: "ブラウザとサーバーの通信を暗号化する仕組みで、URLの先頭に表示されるものは何でしょう？", a: [HTTPS]}
  - {u: IT03-04, p: 45, q: "銀行や通販サイトをよそおった偽のメールや偽サイトで、IDやパスワードを盗む手口を何というでしょう？", a: [フィッシング, フィッシング詐欺]}
  - {u: IT04-01, p: 40, q: "チェスや画像認識など特定の作業に特化したAIに対し、人間のように何でもこなせるAIを、アルファベット3文字で何というでしょう？", a: [AGI]}
  - {u: IT04-02, p: 45, q: "生成AIが、事実ではない内容をもっともらしく作り出してしまう現象を何というでしょう？", a: [ハルシネーション]}
  - {u: IT04-04, p: 45, q: "生成AIに入力する指示文や質問文のことを何というでしょう？", a: [プロンプト]}
  - {u: IT04-05, p: 40, q: "AIで本物そっくりに作られた、人物の偽の画像や動画を何というでしょう？", a: [ディープフェイク]}
