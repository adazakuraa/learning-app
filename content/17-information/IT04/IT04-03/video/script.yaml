title: メモリ・パーソナライズ・文脈生成
scenes:
  - board: whiteboard
    steps:
      - say: 「AIと、自分の情報の扱い」です。まず、コンテキストウィンドウ。これは、LLMが一度に読める、文章の量のことです。
        show:
          - { type: title, text: コンテキストウィンドウ }
          - { type: text, text: "**コンテキストウィンドウ** ＝ AIが一度に読める文章の量" }
      - say: 会話の中で、AIが前に言ったことを覚えているのは、それがこの窓の中にあるからです。会話が長くなりすぎると、古い部分が窓からはみ出して、忘れられてしまいます。
        show:
          - type: svg
            w: 1100
            h: 160
            markup: |
              <g stroke="#9aa3ad"><rect x="20" y="50" width="120" height="60"/><rect x="160" y="50" width="120" height="60"/></g>
              <g stroke="#8fc4ff"><rect x="300" y="50" width="120" height="60"/><rect x="440" y="50" width="120" height="60"/><rect x="580" y="50" width="120" height="60"/><rect x="720" y="50" width="120" height="60"/></g>
              <rect x="285" y="30" width="570" height="100" rx="10" stroke="#f3d77a" stroke-width="4"/>
              <g stroke="none" font-size="22"><text x="20" y="150" fill="#9aa3ad">はみ出した古い会話（忘れる）</text><text x="470" y="20" fill="#f3d77a">窓の中（覚えている）</text></g>

  - board: whiteboard
    steps:
      - say: メモリ機能は、会話をこえて、情報を覚えておく機能です。名前や仕事、好み、過去の会話の要点などを、次の会話に持ちこみます。
        show:
          - { type: title, text: メモリとデータの扱い }
          - { type: box, color: blue, w: 1100, title: メモリ機能, text: "会話をこえて覚える（名前・好み・過去の要点）。内容は確認・削除できる設定がある" }
      - say: 便利な一方で、何が記憶されているかを、確認したり、消したりできることが大切です。多くのサービスに、そのための設定があります。
        show:
          - { type: text, size: s, color: gray, text: "何を覚えているか、ときどき設定で確認しよう" }
      - say: 入力したデータの扱いは、サービスによってちがいます。多くの無料サービスでは、会話がAIの改善や学習に使われる場合があります。仕事の秘密や、個人情報、パスワードを、AIに入力するのは、慎重にしましょう。
        show:
          - { type: box, color: pink, w: 1100, title: 入力に注意, text: "会話が学習に使われる場合がある → 秘密・個人情報・パスワードは入れない" }

  - board: whiteboard
    steps:
      - say: パーソナライズは、使い続けるほど、自分の好みや文体に合わせた答えが出てくる機能です。
        show:
          - { type: title, text: パーソナライズの落とし穴 }
          - { type: text, text: "**パーソナライズ**：使うほど自分好みの答えになる" }
      - say: 便利ですが、注意も必要です。AIが、あなたの聞きたいことを返してくれるからといって、それが正しい情報だとは限りません。自分の考えに都合のいい答えばかり聞いていると、考えがかたよってしまいます。ときには、反対の意見も聞いてみる、という使い方がおすすめです。
        show:
          - { type: box, color: yellow, w: 1100, text: "「聞きたい答え」≠「正しい答え」→ ときには反対の意見も聞いてみる" }
