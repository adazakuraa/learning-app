title: AIの社会的影響と向き合い方
scenes:
  - board: whiteboard
    steps:
      - say: 最後は、「AIの社会への影響」です。AIは、すでに社会や暮らしに、さまざまな影響をあたえています。
        show:
          - { type: title, text: 仕事への影響 }
      - say: まず、仕事への影響です。文章づくり、翻訳、プログラミング、画像づくり、お客さんの問い合わせ対応など、多くの頭脳労働を、AIが代わりにできるようになってきました。
        show:
          - { type: text, text: "文章・翻訳・プログラミング・画像・問い合わせ対応 → AIが代わりにできるように" }
      - say: AIに仕事をうばわれる、という不安がある一方で、AIを使いこなせる人の価値が高まる、という変化も起きています。電卓が登場したとき、計算の仕事がなくなったのではなく、電卓を使ってもっと大きな仕事をする人が求められたのと、似ています。
        show:
          - { type: box, color: yellow, w: 1100, text: "「AIを使いこなす人」の価値が高まる。電卓が登場したときと同じ" }

  - board: whiteboard
    steps:
      - say: AIのかたより、バイアスの問題もあります。AIは、学習したデータのかたよりを、そのまま映し出します。
        show:
          - { type: title, text: バイアスと著作権 }
          - { type: box, color: pink, w: 1100, title: バイアス, text: "学習データのかたよりを映す。採用AIが女性を低く評価、顔認識の精度が人種で差" }
      - say: 実際に、採用のAIが女性を不当に低く評価したり、顔認識のAIが、特定の人種で精度が低かったりした例があります。AIが判断したからといって、公平とは限らないのです。
        show:
          - { type: text, color: yellow, text: "「AIが判断した」＝「公平」とは限らない" }
      - say: 著作権の問題もあります。生成AIは、大量の作品から学習しています。だれの作品を、許可なく学習に使ってよいのか。AIがつくったものの著作権は、だれのものか。法律の整備が追いついておらず、世界中で、裁判や議論が続いています。
        show:
          - { type: box, color: blue, w: 1100, title: 著作権, text: "無断で学習に使ってよいか？ AIの作品の権利はだれのもの？ → 世界中で議論中" }

  - board: whiteboard
    steps:
      - say: 規制の動きも進んでいます。EUは、AI規制法を世界に先がけて成立させ、リスクの大きさに応じて、AIを規制します。日本やアメリカでも、議論が進んでいます。
        show:
          - { type: title, text: これからのAIとのつきあい方 }
          - { type: text, text: "EU：**AI規制法**（リスクの大きさに応じて規制）。日本・アメリカでも議論が進む" }
      - say: AIは、使い方しだいで、大きな助けにも、害にもなる道具です。しくみと限界を知ったうえで、自分の頭で考えながら、じょうずに使いこなしていきましょう。これで、情報はおしまいです。おつかれさまでした。
        added: true
        show:
          - { type: box, color: yellow, w: 1100, text: "しくみと限界を知り、自分の頭で考えながら使いこなす" }
