title: 今のAIは何ができて何ができないか
scenes:
  - board: slide
    steps:
      - say: 第4章、「AIサービスの使い方と理解」です。
        show:
          - { type: title, text: 第4章　AIサービスの使い方と理解 }
      - say: AIは何ができて、何ができないのか。どんなしくみで動いているのか。そして、上手な使い方と、社会への影響を学びます。
        show:
          - type: list
            size: s
            items: ["今のAIは何ができて何ができないか", "LLMの仕組みをユーザー目線で理解する", "メモリ・パーソナライズ・文脈生成", "生成AIへの効果的な質問の仕方", "AI画像・音声・動画の生成と見分け方", "AIの社会的影響と向き合い方"]
      - say: AIを、こわがりすぎず、信じすぎず。じょうずな道具として使いこなせるようになりましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "AIのしくみと限界を知り、道具として正しく使いこなす" }

  - board: whiteboard
    steps:
      - say: AIというと、人間のような知性を持った機械を、イメージしがちです。でも、今のAIは、それとは大きくちがいます。
        show:
          - { type: title, text: 弱いAI と 強いAI }
      - say: 今のAIは、特定の作業を、統計的なパターンで処理するシステムです。チェス専用、画像認識専用、文章づくり専用のように、ひとつのことを、とても上手にこなします。これを、弱いAIともいいます。
        show:
          - { type: box, color: blue, w: 1100, title: 弱いAI（今あるAI）, text: "特定の作業をパターンで処理する。ひとつのことがとても上手" }
      - say: 一方、何でも人間のようにこなせる、強いAI、AGIは、今のところ、まだ存在しません。
        show:
          - { type: box, color: gray, w: 1100, title: 強いAI（AGI）, text: "何でも人間のようにできるAI。今はまだ存在しない" }

  - board: whiteboard
    steps:
      - say: 今のAIが得意なことと、苦手なことを比べてみましょう。
        show:
          - { type: title, text: 得意なこと・苦手なこと }
      - say: 得意なのは、文章の作成、要約、翻訳、校正。画像や音声、動画の生成。顔認証のようなパターン認識。大量のデータからの傾向の発見。そして、チェスや囲碁などのゲームです。
        show:
          - type: list
            at: [80, 140]
            w: 540
            items: ["文章の作成・要約・翻訳・校正", "画像・音声・動画の生成", "パターン認識（顔認証など）", "大量のデータから傾向を見つける", "チェス・囲碁"]
      - say: 苦手なのは、事実を確実に正しく言うこと。もっともらしいうそをつくことがあります。学習した時点より新しい情報も知りません。ただし、ウェブ検索ができるサービスもあります。本当の意味での理解や、意識、感情も持っていません。そして、複雑な現実の世界で、体を使って作業することも、まだ苦手です。
        show:
          - type: list
            at: [660, 140]
            w: 560
            items: ["事実を確実に言う（もっともらしいうそ）", "最新の情報（検索できるものもある）", "本当の理解・意識・感情", "現実の世界での複雑な作業"]

  - board: whiteboard
    steps:
      - say: シンギュラリティとは、AIが人間の知性をこえ、自分で自分を改良し続けることで、知性が爆発的に高まる、という仮説上の転換点です。レイ・カーツワイルが、2045年ごろと予測して広まりました。ただ、本当に来るのか、いつ来るのかは、専門家の間でも、意見が大きく分かれています。
        show:
          - { type: title, text: シンギュラリティと量子コンピュータ }
          - { type: box, color: yellow, w: 1100, title: シンギュラリティ, text: "AIが人間をこえ、知性が爆発的に高まる仮説上の転換点（2045年ごろ説）。専門家の意見は割れている" }
      - say: 量子コンピュータも、よく話題になる技術です。ふつうのコンピュータは、0か1で計算しますが、量子コンピュータは、0でもあり1でもある、重ね合わせという状態を使って、特定の計算を、とても速くします。
        show:
          - { type: box, color: blue, w: 1100, title: 量子コンピュータ, text: "「0でも1でもある状態（重ね合わせ）」で、特定の計算をとても速くする" }
      - say: ただし、何でも速いわけではありません。暗号の解読や、分子のシミュレーションなど、向いている問題が限られていて、まだ研究の段階です。
        show:
          - { type: text, size: s, color: gray, text: "得意な問題は限られる（暗号解読・分子シミュレーションなど）。まだ研究段階" }
