title: AI画像・音声・動画の生成と見分け方
scenes:
  - board: whiteboard
    steps:
      - say: 「AIによる、画像、音声、動画の生成」です。生成AIは、文章だけでなく、画像や音声、動画もつくれます。便利な一方で、にせものの問題を、深刻にしています。
        show:
          - { type: title, text: 生成AIとにせもの }
      - say: 画像生成AIは、文字の説明から、画像をつくります。存在しない人物の写真や、起きていないできごとの、証拠写真のようなものまでつくれてしまいます。
        show:
          - { type: box, color: blue, w: 1100, title: 画像生成, text: "存在しない人物の「写真」、起きていないことの「証拠写真」もつくれる" }
      - say: 音声クローンは、数秒から数分の声のサンプルから、その人そっくりの声をつくる技術です。家族の声をまねた、詐欺の電話も、実際に報告されています。
        show:
          - { type: box, color: pink, w: 1100, title: 音声クローン, text: "数秒〜数分の声からそっくりの声に。家族の声をまねた詐欺電話も" }
      - say: ディープフェイクは、実在する人の顔や声を使って、動画を合成する技術です。政治家や有名人の、にせの動画や、にせの発言に、悪用されています。
        show:
          - { type: box, color: yellow, w: 1100, title: ディープフェイク, text: "実在の人の顔・声で動画を合成。政治家・有名人のにせ動画に悪用" }

  - board: whiteboard
    steps:
      - say: 見分けるヒントとして、AIの画像は、手や指の形が不自然なことがあります。ただ、技術の進歩で、見た目だけで見分けるのは、どんどんむずかしくなっています。
        show:
          - { type: title, text: どう身を守るか }
          - { type: text, text: "ヒント：手・指の形が不自然なことがある（ただし、見分けるのはどんどん困難に）" }
      - say: 大事なのは、この映像は本物か、と疑う習慣です。そして、信頼できる、複数の情報源で確かめること。家族から、お金をたのむ電話があったら、一度切って、本人の番号にかけ直しましょう。家族で、合言葉を決めておくのも、有効です。
        show:
          - { type: box, color: yellow, w: 1100, title: 身を守る習慣, text: "「本物か？」と疑う・複数の情報源で確かめる・お金の電話はかけ直す・家族で合言葉" }
