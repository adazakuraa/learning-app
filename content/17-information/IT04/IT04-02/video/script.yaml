title: LLMの仕組みをユーザー目線で理解する
scenes:
  - board: whiteboard
    steps:
      - say: 「LLM」、大規模言語モデルです。ChatGPTや、Claude、Geminiなど、文章を生み出すAIの、中心になっている技術です。
        show:
          - { type: title, text: LLM（大規模言語モデル） }
          - { type: text, text: "**LLM** ＝ 大量の文章で学習し、「次に来る言葉」を予測するシステム" }
      - say: 使う人の目線では、大量の文章で学習した、次に来る言葉を予測するシステム、と理解しておくのが、いちばん実用的です。
        show:
          - type: svg
            w: 1100
            h: 200
            markup: |
              <rect x="20" y="60" width="420" height="80" rx="12" stroke="#8fc4ff"/>
              <path d="M460 100 H560 M545 88 L560 100 L545 112" stroke="#9aa3ad"/>
              <g stroke="#f3d77a"><rect x="600" y="10" width="200" height="50" rx="8"/><rect x="600" y="75" width="200" height="50" rx="8"/><rect x="600" y="140" width="200" height="50" rx="8"/></g>
              <g stroke="none" font-size="24"><text x="40" y="110" fill="#8fc4ff">今日はとても天気が…</text><text x="620" y="45" fill="#f3d77a">いい　70%</text><text x="620" y="110" fill="#f3d77a">悪い　20%</text><text x="620" y="175" fill="#f3d77a">変だ　10%</text><text x="830" y="110" fill="#9be0b0">→ 選んでつなげる</text></g>
      - say: スマホの予測変換を、ものすごく賢くしたようなものです。それらしい続きを選ぶことを、くり返して、文章をつくります。人間のように考えているのではなく、膨大なパターンから、統計的に、それらしい続きを生み出しているのです。
        show:
          - { type: text, color: gray, text: "スマホの予測変換を、ものすごく賢くしたイメージ" }

  - board: whiteboard
    steps:
      - say: このしくみから、ハルシネーションが起きる理由が見えてきます。
        show:
          - { type: title, text: ハルシネーション }
      - say: LLMは、もっともらしい続きを生み出すシステムなので、事実かどうかに関係なく、なめらかな文章を作ります。存在しない論文や、まちがった数字を、自信たっぷりに答えることがあるのです。これを、ハルシネーション、幻覚といいます。
        show:
          - { type: box, color: pink, w: 1100, title: ハルシネーション（幻覚）, text: "存在しない論文・まちがった数字を、自信たっぷりに答える" }
      - say: もっともらしく聞こえることと、正しいことは、別の問題なのです。
        show:
          - { type: text, size: l, color: yellow, text: "「もっともらしい」≠「正しい」" }

  - board: whiteboard
    steps:
      - say: 使う人として、知っておきたいポイントです。
        show:
          - { type: title, text: 使うときの注意 }
      - say: 事実の確認が必要なことは、AIだけで判断しない。学習した時点より新しいできごとは知らない。数字や統計、人や物の名前は、特にまちがいが多い。そして、わからないときでも、知りません、と言わずに、答えを作り出してしまうことがある。この4つです。
        show:
          - type: list
            items: ["事実の確認が必要なことは、AIだけで判断しない", "学習した時点より新しいことは知らない", "数字・統計・名前は特に要注意", "わからなくても答えを作り出すことがある"]
      - say: AIは、とても優秀だけれど、ときどき自信満々にまちがえる助手、と考えて、大事なことは、必ず自分で確かめましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1100, text: "AI ＝ 優秀だが、ときどき自信満々にまちがえる助手 → 大事なことは自分で確かめる" }
