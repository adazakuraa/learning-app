title: 生成AIへの効果的な質問の仕方
scenes:
  - board: whiteboard
    steps:
      - say: 「AIへの質問のしかた」です。AIへの指示を、プロンプトといいます。プロンプトの書き方で、答えの質は大きく変わります。
        show:
          - { type: title, text: プロンプトのコツ }
      - say: 人に仕事をたのむときと同じです。だれに、何を、どんな形で、を伝えるほど、ほしいものが返ってきます。基本のポイントを、5つ見ていきましょう。
        added: true
        show:
          - { type: text, color: gray, text: "人に仕事をたのむのと同じ：だれに・何を・どんな形で" }
      - say: 1つ目、役割をあたえる。「あなたは経験豊富な編集者です」「中学生に教えるように説明して」と指定すると、答えの調子やレベルが変わります。
        show:
          - { type: text, color: pink, text: "① 役割をあたえる：「あなたは編集者です」「中学生に教えるように」" }
      - say: 2つ目、背景を伝える。「私は30代の事務職で、プレゼンの準備をしています」と伝えると、的確な答えになります。
        show:
          - { type: text, color: yellow, text: "② 背景を伝える：「30代の事務職で、プレゼン準備中です」" }
      - say: 3つ目、出力の形を指定する。「箇条書きで3つに」「500字以内で」「表で」などです。
        show:
          - { type: text, color: green, text: "③ 形を指定する：「箇条書きで3つ」「500字以内」「表で」" }
      - say: 4つ目、具体的な例を見せる。こういう文体で、と例文を見せると、合わせてくれます。5つ目、段階的に進める。むずかしい作業は、まず構成案を作って、次にこの部分をくわしく、と、ステップを分けたほうが、よい結果になります。
        show:
          - { type: text, color: blue, text: "④ 例を見せる：「こういう文体で」と例文をそえる" }
          - { type: text, color: gray, text: "⑤ 段階的に：構成案 → 部分ごとにくわしく" }

  - board: whiteboard
    steps:
      - say: 悪い例と、よい例を比べてみましょう。
        show:
          - { type: title, text: 悪い例とよい例 }
      - say: 悪い例は、「メールを書いて」。これでは、だれに、何のメールか、わかりません。
        show:
          - { type: box, color: pink, w: 1100, title: 悪い例, text: "「メールを書いて」" }
      - say: よい例は、こうです。「取引先への、納期延長のおわびメールを書いてください。相手はA社の田中部長、延長は1週間、原因は部品の調達の遅れです。ていねいだけれど簡潔に、300字以内でお願いします」。だれに、何を、どんな調子で、どのくらいの長さで、が全部伝わっていますね。
        show:
          - { type: box, color: green, w: 1100, title: よい例, text: "「取引先への納期延長のおわびメールを書いてください。相手はA社の田中部長、延長は1週間、原因は部品調達の遅れ。ていねいだが簡潔に、300字以内で」" }
