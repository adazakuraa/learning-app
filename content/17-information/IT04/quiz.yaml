questions:
  - q: ChatGPTやClaudeのような、大量の文章で学習したAIを、アルファベット3文字で何というか。
    a: [LLM]
    explain: 大規模言語モデル（Large Language Model）。
  - q: AIが、事実ではない内容をもっともらしく作り出してしまう現象を何というか。
    a: [ハルシネーション]
  - q: AIへの指示文や質問文のことを何というか。
    a: [プロンプト]
  - q: AIが人間の知性を超え、自分で改善を繰り返して知性が爆発的に高まる転換点を何というか。
    a: [シンギュラリティ, 技術的特異点]
    r: [ぎじゅつてきとくいてん]
    show: シンギュラリティ
