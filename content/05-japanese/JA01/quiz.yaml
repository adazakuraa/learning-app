questions:
  - q: 「山」「川」「日」のように、ものの形をそのまま絵にして作った漢字を何文字というか。
    a: [象形, 象形文字]
    show: 象形文字
  - q: 「上」「下」「一」のように、形に表しにくい考えを記号で示した漢字を何文字というか。
    a: [指事, 指事文字]
    show: 指事文字
  - q: 「休（人＋木）」のように、2つ以上の文字を組み合わせて新しい意味を表した漢字を何文字というか。
    a: [会意, 会意文字]
    show: 会意文字
  - q: 音を表す部分と意味を表す部分を組み合わせた漢字で、漢字全体の約9割を占めるものを何文字というか。
    a: [形声, 形声文字]
    show: 形声文字
