title: 国語とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、国語がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 国語とは
      - say: 国語では、漢字の成り立ち、文法の基礎、日本の文学史を学びます。ふだん何気なく使っている日本語を、仕組みから見直す科目です。
        show:
          - type: box
            w: 1100
            text: 国語では、漢字の成り立ち、文法の基礎、日本の文学史を学びます。ふだん何気なく使っている日本語を、仕組みから見直す科目です。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で3章です。第1章は漢字の成り立ち、第2章は文法の基礎、第3章は日本の文学史。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　漢字の成り立ち
              - 第2章　文法の基礎
              - 第3章　日本の文学史
            at:
              - 80
              - 150
  - board: whiteboard
    steps:
      - say: では、国語を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、正しく伝わる文章が書ける。文の組み立てや品詞の働きがわかると、誤解されにくい、わかりやすい文章が書けるようになります。
        show:
          - type: box
            w: 1100
            text: |-
              **正しく伝わる文章が書ける**
              文の組み立てや品詞の働きがわかると、誤解されにくい、わかりやすい文章が書けるようになります。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、漢字が覚えやすくなる。漢字の多くは、意味を表す部分と音を表す部分の組み合わせです。成り立ちを知ると、初めて見る漢字も推測できます。
        show:
          - type: box
            w: 1100
            text: |-
              **漢字が覚えやすくなる**
              漢字の多くは、意味を表す部分と音を表す部分の組み合わせです。成り立ちを知ると、初めて見る漢字も推測できます。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、日本の文化の背景がわかる。古典や近代文学の有名作品は、今のことわざや言い回し、ドラマや漫画にも息づいています。
        show:
          - type: box
            w: 1100
            text: |-
              **日本の文化の背景がわかる**
              古典や近代文学の有名作品は、今のことわざや言い回し、ドラマや漫画にも息づいています。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、メールやレポートを書くとき、読めない漢字に出会ったとき、名作の書き出しや作者名が話題になったとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - メールやレポートを書くとき
              - 読めない漢字に出会ったとき
              - 名作の書き出しや作者名が話題になったとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、文法は例文で確かめながら覚える。そして、文学史は「作者・作品・時代」をセットで。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・文法は**例文で確かめながら**覚える
              ・文学史は「作者・作品・時代」をセットで
            color: pink
            at:
              - 80
              - 420
