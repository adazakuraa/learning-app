questions:
  - q: '次の文の太字の部分の品詞を答えてください。「高原の風が**さわやかだ**。」'
    a: [形容動詞]
  - q: '次の文の太字の部分の品詞を答えてください。「**ああ**、見事な景色だ。」'
    a: [感動詞]
  - q: '次の文の太字の部分の品詞を答えてください。「**大きな**犬を飼う。」'
    a: [連体詞]
  - q: '次の文の太字の部分の品詞を答えてください。「この薬はとても**苦い**。」'
    a: [形容詞]
  - q: '次の文の太字の部分の品詞を答えてください。「では、開会式を始め**ます**。」'
    a: [助動詞]
  - q: '次の文の太字の部分の品詞を答えてください。「この問題集は**とても**難しい。」'
    a: [副詞]
  - q: '次の文の太字の部分の品詞を答えてください。「お父さん**は**お元気ですか。」'
    a: [助詞]
  - q: '次の文の太字の部分の品詞を答えてください。「**私**は知っています。」'
    a: [名詞]
  - q: '次の文の太字の部分の品詞を答えてください。「夕べはラーメンを**食べ**た。」'
    a: [動詞]
  - q: '次の文の太字の部分の品詞を答えてください。「雨が降った。**だから**、大会は中止だ。」'
    a: [接続詞]
  - q: '次の文の主語・述語・目的語を、この順に「、」で区切って答えてください。目的語がないときは「なし」と書いてください。「私は 毎日 リンゴを 食べる。」'
    a: ['私は食べるリンゴを']
    show: '主語：私は　述語：食べる　目的語：リンゴを'
  - q: '次の文の主語・述語・目的語を、この順に「、」で区切って答えてください。目的語がないときは「なし」と書いてください。「犬が 激しく 吠えた。」'
    a: ['犬が吠えたなし']
    show: '主語：犬が　述語：吠えた　目的語：なし'
    explain: '「激しく」は述語をくわしく説明する修飾語。'
  - q: '次の文の主語・述語・目的語を、この順に「、」で区切って答えてください。目的語がないときは「なし」と書いてください。「お母さんが 妹に 人形を 買った。」'
    a: ['お母さんが買った妹に人形を']
    show: '主語：お母さんが　述語：買った　目的語：妹に、人形を'
    explain: '「誰に」「何を」は、日本語ではどちらも目的語の扱いになる。'
  - q: '次の文の主語・述語・目的語を、この順に「、」で区切って答えてください。目的語がないときは「なし」と書いてください。「図書室で 彼は 難しい 本を 読んでいる。」'
    a: ['彼は読んでいる本を']
    show: '主語：彼は　述語：読んでいる　目的語：本を'
    explain: '「難しい」は本にかかる修飾語、「図書室で」は場所を表す修飾語。'
  - q: '次の文の主語・述語・目的語を、この順に「、」で区切って答えてください。目的語がないときは「なし」と書いてください。「満開の 桜が とても 美しい。」'
    a: ['桜が美しいなし']
    show: '主語：桜が　述語：美しい　目的語：なし'
    explain: '「満開の」は桜にかかる修飾語。状態を表す文なので目的語はない。'
