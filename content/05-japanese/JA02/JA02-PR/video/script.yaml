title: 練習問題
scenes:
  - board: slide
    steps:
      - say: 第2章、「文法の基礎」の、練習問題です。問題が出たら、動画を一時停止して、考えてみてください。
        show:
          - { type: title, text: 第2章　練習問題 }
          - { type: text, text: "問題が出たら、一時停止して考えてみよう" }

  - board: whiteboard
    steps:
      - say: 問題1。下線が引かれている単語の、品詞を答えてください。
        pause: 4
        show:
          - { type: title, text: 問題1　下線部の品詞は？ }
          - { type: image, src: 1000003131.webp, at: [120, 125], w: 660 }
      - say: 答えです。1、さわやかだ、は、形容動詞。2、ああ、は、感動詞。3、大きな、は、連体詞。4、苦い、は、形容詞。5、ます、は、助動詞。
        show:
          - { type: box, color: yellow, at: [930, 110], w: 300, text: "(1) 形容動詞\n(2) 感動詞\n(3) 連体詞\n(4) 形容詞\n(5) 助動詞" }
      - say: 6、とても、は、副詞。7、は、は、助詞。8、私、は、名詞。9、食べ、は、動詞。10、だから、は、接続詞です。3の、大きな、が連体詞なのは、活用しないからでしたね。
        show:
          - { type: box, color: green, at: [930, 400], w: 300, text: "(6) 副詞\n(7) 助詞\n(8) 名詞\n(9) 動詞\n(10) 接続詞" }

  - board: whiteboard
    steps:
      - say: 問題2。次の文の、主語、述語、目的語を答えてください。目的語がない文もあります。まずは、第1問から第3問です。
        pause: 5
        show:
          - { type: title, text: 問題2　主語・述語・目的語は？ }
          - { type: text, size: l, text: "第1問：私は 毎日 リンゴを 食べる。" }
          - { type: text, size: l, text: "第2問：犬が 激しく 吠えた。" }
          - { type: text, size: l, text: "第3問：お母さんが 妹に 人形を 買った。" }
      - say: 答えです。第1問。主語は、私は。述語は、食べる。目的語は、リンゴを、です。毎日は、修飾語です。
        show:
          - { type: text, color: yellow, text: "1：主語「私は」　述語「食べる」　目的語「リンゴを」" }
      - say: 第2問。主語は、犬が。述語は、吠えた。目的語は、ありません。激しく、は、述語をくわしく説明する、修飾語です。
        show:
          - { type: text, color: yellow, text: "2：主語「犬が」　述語「吠えた」　目的語なし（「激しく」は修飾語）" }
      - say: 第3問。主語は、お母さんが。述語は、買った。目的語は、妹に、と、人形を、です。だれに、何を、の両方が、目的語のあつかいになります。
        show:
          - { type: text, color: yellow, text: "3：主語「お母さんが」　述語「買った」　目的語「妹に」「人形を」" }

  - board: whiteboard
    steps:
      - say: 続いて、第4問と第5問です。
        pause: 4
        show:
          - { type: title, text: 問題2（続き） }
          - { type: text, size: l, text: "第4問：図書室で 彼は 難しい 本を 読んでいる。" }
          - { type: text, size: l, text: "第5問：満開の 桜が とても 美しい。" }
      - say: 第4問。主語は、彼は。述語は、読んでいる。目的語は、本を、です。難しい、は、本にかかる修飾語。図書室で、は、場所を表す修飾語です。
        show:
          - { type: text, color: yellow, text: "4：主語「彼は」　述語「読んでいる」　目的語「本を」" }
          - { type: text, size: s, color: gray, text: "「難しい」→ 本を説明、「図書室で」→ 場所を表す修飾語" }
      - say: 第5問。主語は、桜が。述語は、美しい。目的語は、ありません。状態を表す文だからです。満開の、は、桜にかかる修飾語です。おつかれさまでした。
        show:
          - { type: text, color: yellow, text: "5：主語「桜が」　述語「美しい」　目的語なし（状態を表す文）" }
          - { type: text, size: s, color: gray, text: "「満開の」→ 桜にかかる修飾語" }
