title: 現代の文学
scenes:
  - board: whiteboard
    steps:
      - say: 「現代の文学」です。昭和の文学は、戦争、敗戦、高度経済成長という、激動の時代を背景に、さまざまな展開を見せました。
        show:
          - { type: title, text: 太宰治 }
      - say: 太宰治は、『走れメロス』、『斜陽』、『人間失格』などを書き、自分の弱さや罪、ほろびへのあこがれを、独特の文体で描きました。「恥の多い生涯を送って来ました」という、『人間失格』の書き出しは、日本文学屈指の書き出しとして知られています。
        show:
          - { type: box, color: pink, w: 1100, title: 太宰治, text: "『走れメロス』『斜陽』『人間失格』。自分の弱さ・罪をつづる" }
          - { type: text, size: l, color: yellow, text: "「恥の多い生涯を送って来ました」" }
      - say: 4度の自殺未遂ののち、最後は玉川上水で、入水自殺しました。38歳でした。破滅的な人生と文学が重なり、今も熱心なファンを持っています。
        show:
          - { type: text, color: gray, text: "4度の自殺未遂ののち、38歳で入水自殺" }

  - board: whiteboard
    steps:
      - say: 川端康成は、『雪国』、『伊豆の踊子』などで、日本的な美の世界を描き、1968年、日本人で初めて、ノーベル文学賞を受賞しました。受賞から4年後、遺書もなく、ガスによって亡くなります。自殺とされていますが、事故だったという説もあります。72歳でした。
        show:
          - { type: title, text: 川端康成と三島由紀夫 }
          - { type: box, color: blue, w: 1100, title: 川端康成, text: "『雪国』『伊豆の踊子』。日本的な美。1968年、日本人初のノーベル文学賞" }
      - say: 三島由紀夫は、『金閣寺』、『潮騒』、『豊饒の海』などを書き、圧倒的な文章力と美意識で知られます。民兵組織、楯の会をつくり、1970年に、自衛隊の市ヶ谷駐屯地で演説したあと、割腹自殺しました。
        show:
          - { type: box, color: yellow, w: 1100, title: 三島由紀夫, text: "『金閣寺』『潮騒』『豊饒の海』。1970年、自衛隊の駐屯地で演説後に自決" }

  - board: whiteboard
    steps:
      - say: ほかにも、2人目のノーベル文学賞受賞者となった、大江健三郎。歴史小説、『竜馬がゆく』で知られる、司馬遼太郎。原爆を、『黒い雨』で描いた、井伏鱒二などが有名です。
        show:
          - { type: title, text: その他の現代の作家 }
          - { type: text, color: green, text: "**大江健三郎**：2人目のノーベル文学賞" }
          - { type: text, color: yellow, text: "**司馬遼太郎**：『竜馬がゆく』などの歴史小説" }
          - { type: text, color: pink, text: "**井伏鱒二**：原爆を描いた『黒い雨』" }
      - say: 気になった作品があったら、ぜひ一冊、手にとってみてください。教科書で読んだ作品も、大人になってから読むと、まったくちがって見えるはずです。これで、国語はおしまいです。おつかれさまでした。
        added: true
        show:
          - { type: box, color: blue, w: 1000, text: "気になった作品を一冊、手にとってみよう" }
