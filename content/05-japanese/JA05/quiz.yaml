questions:
  - q: 日本最古の歌集で、元号「令和」の出典にもなったものは何か。
    a: [万葉集]
  - q: 光源氏を主人公とした、世界最古級の長編小説『源氏物語』の作者は誰か。
    a: [紫式部]
  - q: 「祇園精舎の鐘の声、諸行無常の響きあり」で始まる軍記物語は何か。
    a: [平家物語]
    r: [へいけものがたり]
  - q: 「古池や蛙飛びこむ水の音」をよみ、『奥の細道』を残した俳人は誰か。
    a: [松尾芭蕉, 芭蕉]
    show: 松尾芭蕉
  - q: 『吾輩は猫である』『坊っちゃん』『こころ』などを書いた作家は誰か。
    a: [夏目漱石, 漱石]
    show: 夏目漱石
