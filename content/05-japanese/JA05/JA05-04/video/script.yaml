title: 近代の文学
scenes:
  - board: whiteboard
    steps:
      - say: 「近代の文学」です。明治維新のあと、西洋の小説や思想が、たくさん入ってきて、日本の文学は大きく変わりました。
        show:
          - { type: title, text: 夏目漱石と森鴎外 }
      - say: 夏目漱石は、近代日本文学を代表する作家で、『吾輩は猫である』、『坊っちゃん』、『こころ』などを残しました。イギリスへの留学を経験しましたが、西洋と日本の間で、引きさかれるような感覚を、一生かかえ、天に従い、私心を捨てる、則天去私という境地を、めざしていました。神経衰弱に苦しみ、胃潰瘍の悪化で、49歳で亡くなります。
        show:
          - { type: box, color: yellow, w: 1100, title: 夏目漱石, text: "『吾輩は猫である』『坊っちゃん』『こころ』。西洋と日本の間で悩み「**則天去私**」をめざす" }
      - say: 森鴎外は、軍医として、陸軍のトップにまで上りつめながら、『舞姫』、『高瀬舟』などを書いた、異色の文学者でした。漱石とならぶ、近代文学の二大巨頭ですが、内面を見つめる漱石とは対照的に、歴史や知性、格調を重んじる作風でした。
        show:
          - { type: box, color: blue, w: 1100, title: 森鴎外, text: "陸軍の軍医のトップ。『舞姫』『高瀬舟』。歴史・知性・格調を重んじる" }

  - board: whiteboard
    steps:
      - say: 芥川龍之介は、『羅生門』、『藪の中』、『河童』など、短編の名手で、人間のエゴや、真実のあいまいさを、するどく描きました。晩年は、「ぼんやりとした不安」という言葉を残し、35歳で、自ら命を絶ちました。
        show:
          - { type: title, text: 芥川・子規 }
          - { type: box, color: pink, w: 1100, title: 芥川龍之介, text: "短編の名手（羅生門・藪の中）。人間のエゴ、真実のあいまいさを描く" }
      - say: 正岡子規は、俳人で、「柿くへば、鐘が鳴るなり、法隆寺」などが有名です。
        show:
          - { type: text, size: l, color: green, text: "柿くへば　鐘が鳴るなり　法隆寺（正岡子規）" }

  - board: whiteboard
    steps:
      - say: ほかにも、多くの作家が活躍しました。
        show:
          - { type: title, text: その他の近代の作家 }
      - say: 話し言葉で小説を書く、言文一致で、近代文学を始めた二葉亭四迷。紅露時代と呼ばれるほどの人気をほこった、『金色夜叉』の尾崎紅葉と、『五重塔』の幸田露伴。まずしさの中であえぐ女性を描いた、『たけくらべ』の樋口一葉。そして、ものごとを美化せず、ありのままに描く、自然主義の島崎藤村や、田山花袋です。
        show:
          - { type: text, color: blue, text: "**二葉亭四迷**：近代文学を始めた（話し言葉で書く「言文一致」）" }
          - { type: text, color: yellow, text: "**尾崎紅葉**（金色夜叉）・**幸田露伴**（五重塔）→「紅露時代」" }
          - { type: text, color: pink, text: "**樋口一葉**（たけくらべ）：まずしさの中の女性を描く" }
          - { type: text, color: green, text: "**自然主義**（島崎藤村・田山花袋）：ありのままを描く" }
      - say: 二葉亭四迷が始めた、話し言葉で書く文章は、今、私たちがふつうに書いている文章の、ルーツなのです。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "言文一致 ＝ 今の私たちの書き言葉のルーツ" }
