title: 中世文学
scenes:
  - board: whiteboard
    steps:
      - say: 「中世の文学」です。鎌倉時代は、戦乱の時代で、すべてはうつりかわり、はかない、という無常観が、文学の底に流れるようになりました。
        show:
          - { type: title, text: 無常観の時代 }
          - { type: box, color: gray, w: 1100, text: "**無常観**：すべてはうつりかわり、はかない" }
      - say: 平家物語は、「祇園精舎の鐘の声、諸行無常の響きあり」という書き出しで知られる、軍記物語です。平氏の栄えと、ほろびを描き、琵琶法師によって、語りつがれました。
        show:
          - { type: box, color: pink, w: 1100, title: 平家物語, text: "「祇園精舎の鐘の声、諸行無常の響きあり」。平氏の栄えとほろび。琵琶法師が語りつぐ" }

  - board: whiteboard
    steps:
      - say: 鴨長明の方丈記は、火事、地震、ききんなど、次々と起こる災害を目の当たりにした作者が、「ゆく河の流れは絶えずして」と、無常をつづった随筆です。
        show:
          - { type: title, text: 方丈記と徒然草 }
          - { type: box, color: blue, w: 1100, title: 方丈記（鴨長明）, text: "「ゆく河の流れは絶えずして」。災害を見て無常をつづる" }
      - say: 作者は、最後に、およそ3メートル四方、たたみ5枚ほどの、小さな庵に引きこもりました。物をほとんど持たない生き方の、先がけともいわれます。今でいう、ミニマリストですね。
        show:
          - { type: text, color: gray, text: "最後は約3m四方の小さな庵で暮らす ＝ ミニマリストの先がけ" }
      - say: 兼好法師の徒然草は、「つれづれなるままに」で始まる随筆で、人生や自然、無常について考えをつづっています。
        show:
          - { type: box, color: green, w: 1100, title: 徒然草（兼好法師）, text: "「つれづれなるままに」。人生・自然・無常への思い" }

  - board: whiteboard
    steps:
      - say: 徒然草には、こんな一節があります。「花は盛りに、月はくまなきをのみ見るものかは」。桜は満開のときだけを、月はくもりのない満月だけを、見るものだろうか。いや、そうではない。
        show:
          - { type: title, text: うつろいの美 }
          - { type: text, size: l, color: yellow, text: "「花は盛りに、月は隈なきをのみ見るものかは」" }
          - { type: text, text: "桜は満開だけを、月は満月だけを見るものだろうか。いや、そうではない" }
      - say: 完ぺきな美しさより、うつりかわる中の美しさを愛でる。この感性は、日本の美意識の、中心を表しています。散りゆく桜を、美しいと感じる心ですね。
        show:
          - { type: text, color: green, text: "完ぺきな美より、うつりかわる美を愛でる ＝ 日本の美意識" }
      - say: 「〇〇だろうか、いや、そうではない」という表現を、反語といいます。言いたいことを、わざと疑問の形で言うことで、反対の意味を、強く伝える技法で、今でもよく使われます。
        show:
          - { type: box, color: blue, w: 1100, title: 反語, text: "「〜だろうか（いや、そうではない）」。疑問の形で、反対の意味を強く伝える" }
