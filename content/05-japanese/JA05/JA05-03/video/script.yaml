title: 近世の文学
scenes:
  - board: whiteboard
    steps:
      - say: 「近世の文学」です。江戸時代は、出版の文化が発展し、町の人々、庶民が、文学を楽しむ時代になりました。
        show:
          - { type: title, text: 松尾芭蕉 }
          - { type: text, color: gray, text: "江戸時代：出版文化が発展し、庶民が文学を楽しむ" }
      - say: 松尾芭蕉は、俳句、当時は俳諧と呼ばれたものを、芸術にまで高めた人物です。「古池や、蛙飛び込む、水の音」は、世界で最も有名な、日本語の詩のひとつです。静けさの中の、一瞬の音を切りとった句で、わびさびの美しさを、体現しています。
        show:
          - { type: text, size: l, color: green, text: "古池や　蛙（かわず）飛び込む　水の音" }
          - { type: text, text: "静けさの中の一瞬の音 →「わびさび」の美" }
      - say: 晩年は、東北や北陸を旅して、俳句をよみ続け、その記録が、奥の細道として残っています。旅の途中でよんだ、「夏草や、兵どもが、夢のあと」は、かつての戦場の、今の静けさに、歴史の無常を重ねた名句です。
        show:
          - { type: text, size: l, color: yellow, text: "夏草や　兵（つわもの）どもが　夢の跡" }
          - { type: text, size: s, color: gray, text: "『奥の細道』：かつての戦場の静けさに、歴史の無常を重ねる" }

  - board: whiteboard
    steps:
      - say: 小林一茶も、俳人です。「やせ蛙、まけるな一茶、これにあり」。やせたカエルよ、負けるな。一茶がついているぞ。小さな生き物への、やさしいまなざしが、印象的ですね。
        show:
          - { type: title, text: 一茶・西鶴・近松 }
          - { type: box, color: green, w: 1100, title: 小林一茶, text: "「やせ蛙 まけるな一茶 これにあり」。小さな生き物へのやさしいまなざし" }
      - say: 井原西鶴は、浮世草子という、当時の小説で、町人の恋や欲、お金を、リアルに描きました。『好色一代男』、『日本永代蔵』などが有名です。
        show:
          - { type: box, color: yellow, w: 1100, title: 井原西鶴, text: "**浮世草子**（当時の小説）。町人の恋・欲・お金をリアルに（好色一代男・日本永代蔵）" }
      - say: 近松門左衛門は、人形浄瑠璃などの脚本家で、心中、つまり、男女がともに命を絶つことを題材にした、『曾根崎心中』などが、大ヒットしました。
        show:
          - { type: box, color: pink, w: 1100, title: 近松門左衛門, text: "人形浄瑠璃の脚本家。『曾根崎心中』が大ヒット" }

  - board: whiteboard
    steps:
      - say: 滝沢馬琴は、『南総里見八犬伝』という、全98巻の、とても長い伝奇小説を書き上げました。
        show:
          - { type: title, text: 滝沢馬琴 }
          - { type: box, color: blue, w: 1100, title: 南総里見八犬伝（全98巻）, text: "28年かけて完成。失明後も、息子の妻に口で伝えて書かせ続けた" }
      - say: 28年をかけて完成したこの作品は、晩年、馬琴が目が見えなくなってからも、息子の妻に、口で伝えて書きとらせながら、書き続けたもので、その執念も、語り草になっています。
        show:
          - { type: text, color: gray, text: "作品だけでなく、その執念も語り草に" }
