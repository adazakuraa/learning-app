title: 古代の文学
scenes:
  - board: slide
    steps:
      - say: 第3章、「日本の文学史」です。
        show:
          - { type: title, text: 第3章　日本の文学史 }
      - say: 奈良・平安の古代から、昭和の現代まで、日本の文学の流れを、時代ごとにたどります。
        show:
          - type: list
            items: ["古代の文学", "中世文学", "近世の文学", "近代の文学", "現代の文学"]
      - say: 文学は、その時代の人々が、何を感じ、何に悩んでいたかを映す鏡です。歴史の流れと重ねながら見ていくと、ぐっと身近になります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "時代ごとの代表作を知り、歴史と重ねて文学の流れをつかむ" }

  - board: whiteboard
    steps:
      - say: 奈良時代、8世紀に生まれた万葉集は、日本最古の歌集です。天皇から、農民まで、さまざまな身分の人の歌が、おさめられています。
        show:
          - { type: title, text: 奈良時代：万葉集 }
          - { type: box, color: green, w: 1100, title: 万葉集（8世紀）, text: "日本最古の歌集。天皇から農民まで、さまざまな人の歌" }
      - say: 漢字の音を借りて、日本語を書き表す、万葉仮名で書かれています。そして、今の元号、令和の出典でもあります。
        show:
          - { type: text, text: "**万葉仮名**：漢字の音を借りて日本語を書く（例：「山」を「也末」と書く）" }
          - { type: text, color: yellow, text: "元号「令和」の出典" }

  - board: whiteboard
    steps:
      - say: 平安時代は、ひらがなとカタカナが生まれ、日本語の表現が、一気に豊かになった時代です。
        show:
          - { type: title, text: 平安時代：かな文学の花 }
          - { type: text, color: blue, text: "ひらがな・カタカナが生まれ、日本語の表現が豊かに" }
      - say: 905年には、天皇の命令でつくられた、古今和歌集が編まれました。こうした歌集を、勅撰和歌集といいます。
        show:
          - { type: box, color: blue, w: 1100, title: 古今和歌集（905年）, text: "天皇の命令でつくられた **勅撰和歌集**" }
      - say: 紫式部の源氏物語は、光源氏の恋を中心に、人間の喜びや悲しみを描いた長編で、世界最古の長編小説とも言われます。
        show:
          - { type: box, color: pink, w: 1100, title: 源氏物語（紫式部）, text: "光源氏の恋と人間の喜怒哀楽。世界最古の長編小説とも" }
      - say: 同じころ、清少納言が、枕草子を書きました。「春はあけぼの」で始まるこの随筆、つまりエッセイは、季節や自然、宮廷の暮らしへの、するどい感性をつづっています。
        show:
          - { type: box, color: yellow, w: 1100, title: 枕草子（清少納言）, text: "「春はあけぼの」。季節・自然・宮廷生活へのするどい感性の随筆" }
