questions:
  - {u: JA01-01, p: 55, q: "漢字の約9割を占め、「晴」の「青」のように音を表す部分と、意味を表す部分を組み合わせた文字を何文字というでしょう？", a: [形声文字, 形声]}
  - {u: JA01-01, p: 50, q: "「休」が人と木からできているように、2つ以上の文字を組み合わせて新しい意味を表した漢字を何文字というでしょう？", a: [会意文字, 会意]}
  - {u: JA01-02, p: 40, q: "「にんべん」「さんずい」のように、漢字を分類するときの目印になる共通部分を何というでしょう？", a: [部首]}
  - {u: JA02-01, p: 50, q: "文の成分で、「何が」「誰が」にあたる部分を何というでしょう？", a: [主語]}
  - {u: JA02-02, p: 40, q: "文を、意味がわかり発音として不自然にならないところで、できるだけ短く区切ったまとまりを何というでしょう？", a: [文節]}
  - {u: JA02-03, p: 40, q: "「書かない・書きます・書く」のように、後に続く言葉によって語の形が変わることを何というでしょう？", a: [活用]}
  - {u: JA02-04, p: 45, q: "「大きな」「この」のように、活用せず名詞だけを修飾する品詞を何というでしょう？", a: [連体詞]}
  - {u: JA05-01, p: 55, q: "「春はあけぼの」で始まる、清少納言の随筆は何でしょう？", a: [枕草子]}
  - {u: JA05-02, p: 45, q: "「ゆく河の流れは絶えずして」で始まり、災害の体験から無常を説いた鴨長明の随筆は何でしょう？", a: [方丈記]}
  - {u: JA05-03, p: 40, q: "全98巻にもなる伝奇小説『南総里見八犬伝』を書いた江戸時代の作家は誰でしょう？", a: [滝沢馬琴, 曲亭馬琴]}
  - {u: JA05-03, p: 40, q: "人形浄瑠璃の脚本家として、『曽根崎心中』など心中物を書いたのは誰でしょう？", a: [近松門左衛門]}
  - {u: JA05-04, p: 45, q: "「たけくらべ」を書き、五千円札の肖像にもなった明治の女性作家は誰でしょう？", a: [樋口一葉]}
  - {u: JA05-05, p: 45, q: "「金閣寺」「潮騒」などを書き、圧倒的な文章力と美意識で知られる作家は誰でしょう？", a: [三島由紀夫]}
