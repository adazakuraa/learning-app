title: プレートと地震・火山
scenes:
  - board: slide
    steps:
      - say: 第2章、「世界の地形と気候」です。
        show:
          - { type: title, text: 第2章　世界の地形と気候 }
      - say: プレートと地震、山脈と川、気候の分け方、海流、そして砂漠を学びます。
        show:
          - type: list
            items: ["プレートと地震・火山", "世界の山脈・河川・平野", "気候帯の分類", "海流と気候", "砂漠"]
      - say: 地形と気候は、その土地の暮らし、農業、文化、そして歴史の、土台になっています。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "暮らし・文化・歴史の土台になる地形と気候を知る" }

  - board: whiteboard
    steps:
      - say: 地球の表面は、十数枚の、プレートという岩の板に分かれていて、それぞれが、1年に数センチという、とてもゆっくりした速さで動いています。この考え方を、プレートテクトニクスといいます。
        show:
          - { type: title, text: プレートテクトニクス }
          - { type: image, src: 1000003152.webp, at: [80, 120], w: 700 }
          - { type: text, at: [820, 150], w: 400, text: "十数枚のプレートが年に数cm動く" }
      - say: きっかけは、気象学者のウェゲナーが、南アメリカの東の海岸と、アフリカの西の海岸の形が、ぴったり合うことに気づき、かつてはひとつの大陸だったのでは、と主張したことでした。
        show:
          - { type: box, at: [820, 280], w: 400, color: yellow, text: "**ウェゲナー**：南米とアフリカの海岸の形がぴったり合う" }

  - board: whiteboard
    steps:
      - say: プレートどうしがぶつかったり、離れたりする所に、地震や火山、山脈が集まります。太平洋をぐるりと取り囲む、環太平洋火山帯も、プレートの境目と一致しています。
        show:
          - { type: title, text: 環太平洋火山帯と日本 }
          - { type: image, src: 1000002925.webp, at: [60, 120], w: 520 }
          - { type: image, src: 1000002924.webp, at: [620, 120], w: 480 }
      - say: 日本列島は、4つのプレートがぶつかる場所にあります。北アメリカプレートと太平洋プレートの間で、東日本大震災が起こりました。これから起こるといわれる、南海トラフ地震の震源域は、フィリピン海プレートとユーラシアプレートの間にあります。
        show:
          - { type: text, at: [60, 580], w: 1160, color: pink, text: "東日本大震災：北アメリカ × 太平洋　／　南海トラフ：フィリピン海 × ユーラシア" }
