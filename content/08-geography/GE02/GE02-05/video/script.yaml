title: 砂漠
scenes:
  - board: whiteboard
    steps:
      - say: 「砂漠」です。砂漠かどうかは、見た目ではなく、雨の量で決まります。1年間の降水量が、250ミリメートル以下の地域を、砂漠と呼びます。砂ではなく、岩や砂利ばかりの景色でも、雨が少なければ、砂漠なのです。
        show:
          - { type: title, text: 砂漠とは }
          - { type: box, color: yellow, w: 1100, text: "**砂漠** ＝ 年間降水量 250mm 以下（岩や砂利ばかりでも砂漠）" }
          - { type: image, src: 1000002931.webp, at: [180, 270], w: 820 }

  - board: whiteboard
    steps:
      - say: 砂漠ができる理由は、いくつかあります。いちばん典型的なのは、亜熱帯高圧帯による砂漠です。北緯と南緯の20度から30度あたりには、高気圧があって、雨をほとんど降らせないため、砂漠ができます。サハラ砂漠、アラビアの砂漠、オーストラリアの砂漠は、どれもこのしくみです。
        show:
          - { type: title, text: 砂漠ができる理由 }
          - { type: box, color: pink, w: 1100, title: ① 亜熱帯高圧帯, text: "緯度20〜30°の高気圧で雨が降らない（サハラ・アラビア・オーストラリア）" }
      - say: 大陸の内陸にできる砂漠もあります。海から遠く、しめった風が届かないためで、モンゴルから中国にかけて広がる、ゴビ砂漠がその例です。
        show:
          - { type: box, color: yellow, w: 1100, title: ② 内陸, text: "海から遠く、しめった風が届かない（ゴビ砂漠）" }
      - say: 山脈の風下にできる砂漠もあります。山をこえる空気は、途中で雨を降らせて水分を失い、乾いた風になって吹き下ろします。これを、雨陰といいます。南米のアタカマ砂漠は、アンデス山脈の雨陰に加え、沖を流れる寒流の影響でできた、世界有数の乾いた砂漠です。
        show:
          - { type: box, color: blue, w: 1100, title: ③ 山脈の風下（雨陰）・寒流, text: "山をこえると乾いた風に（アタカマ砂漠：アンデスの雨陰 ＋ 寒流）" }

  - board: whiteboard
    steps:
      - say: そして、砂漠は広がっています。家畜の放牧のしすぎや、農地の開発による、砂漠化は、特にサハラ砂漠の南のふち、サヘル地帯や、アジアで、深刻な問題になっています。
        show:
          - { type: title, text: 砂漠化 }
          - { type: box, color: pink, w: 1100, text: "**砂漠化**：放牧のしすぎ・農地開発で砂漠が広がる（サヘル地帯・アジア）" }
