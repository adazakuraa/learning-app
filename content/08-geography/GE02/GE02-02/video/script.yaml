title: 世界の山脈・河川・平野
scenes:
  - board: whiteboard
    steps:
      - say: 「世界の山脈、川、平野」です。世界の主な山脈は、プレートがぶつかった場所につくられます。アジアのヒマラヤ山脈、ヨーロッパのアルプス山脈、南北アメリカ大陸の西側に連なる、ロッキー山脈と、アンデス山脈が代表です。ヒマラヤ山脈のエベレストは、標高8849メートル、世界一の高さです。
        show:
          - { type: title, text: 世界の山脈 }
          - { type: image, src: 1000002926.webp, at: [60, 120], w: 700 }
          - type: list
            at: [790, 140]
            w: 440
            size: s
            items: ["ヒマラヤ（エベレスト 8849m）", "アルプス", "ロッキー", "アンデス"]

  - board: whiteboard
    steps:
      - say: 大きな川は、文明の始まりの地と、深く結びついています。ナイル川はエジプト文明、チグリス川とユーフラテス川はメソポタミア文明、インダス川はインダス文明、黄河は中国文明の舞台でした。今でも、世界の大都市の多くは、大きな川の近くにあります。
        show:
          - { type: title, text: 川と文明 }
          - { type: image, src: 1000002927.webp, at: [60, 120], w: 700 }
          - type: list
            at: [790, 140]
            w: 440
            size: s
            items: ["ナイル川 → エジプト", "チグリス・ユーフラテス川 → メソポタミア", "インダス川 → インダス", "黄河 → 中国"]
      - say: 水があり、土が肥えていて、船で物を運べる。川は、人が集まって暮らすための、すべてをそなえていたのです。
        added: true
        show:
          - { type: text, at: [80, 520], w: 1120, color: gray, text: "水・肥えた土・船の道 ＝ 川は人が集まる条件をそなえていた" }

  - board: whiteboard
    steps:
      - say: 流れる水の量が世界最大の、アマゾン川は、南アメリカのブラジルを流れ、その量は、世界の川全体の、およそ2割をしめます。流域には、地球最大の熱帯雨林があり、地球の肺とも呼ばれますが、農地をつくるための森林破壊が、深刻な問題になっています。
        show:
          - { type: title, text: アマゾン川と平野 }
          - { type: box, color: green, w: 1100, title: アマゾン川, text: "流量は世界の川の約2割。流域に地球最大の熱帯雨林（地球の肺）。森林破壊が深刻" }
      - say: 平野は、農業の舞台です。インドのガンジス平野、中国の華北平原、アメリカのグレートプレーンズ、ウクライナの黒土地帯など、世界の主な穀倉地帯は、大きな平野と重なっています。
        show:
          - { type: box, color: yellow, w: 1100, title: 平野 ＝ 穀倉地帯, text: "ガンジス平野・華北平原・グレートプレーンズ・ウクライナの黒土地帯" }
