title: 気候帯の分類
scenes:
  - board: whiteboard
    steps:
      - say: 「気候の分け方」です。気候を体系的に分けたのが、気候学者のケッペンで、その分け方が、今も世界の標準として使われています。大きく、5つの気候帯に分かれます。
        show:
          - { type: title, text: ケッペンの気候区分 }
          - { type: image, src: 1000002928.webp, at: [80, 115], w: 620 }
          - type: list
            at: [740, 140]
            items: ["A 熱帯", "B 乾燥帯", "C 温帯", "D 冷帯（亜寒帯）", "E 寒帯"]

  - board: whiteboard
    steps:
      - say: 熱帯は、赤道の近くの気候で、一年中暑く雨が多い熱帯雨林と、雨季と乾季に分かれるサバンナがあります。東南アジア、中央アフリカ、アマゾン川の流域が代表です。
        show:
          - { type: title, text: 5つの気候帯 }
          - { type: text, color: pink, text: "**A 熱帯**：一年中暑い。熱帯雨林・サバンナ（東南アジア・中央アフリカ・アマゾン）" }
      - say: 乾燥帯は、雨の少ない気候で、砂漠と、草原のステップに分かれます。サハラ砂漠、アラビア半島、オーストラリアの内陸などです。
        show:
          - { type: text, color: yellow, text: "**B 乾燥帯**：雨が少ない。砂漠・ステップ（サハラ・アラビア半島・オーストラリア内陸）" }
      - say: 温帯は、四季があり、比較的すごしやすい気候で、日本の多くもここに入ります。冷帯は、ロシアやカナダなど、北の大陸の内陸で、冬がとても厳しく、タイガという針葉樹の森が広がります。寒帯は、北極や南極の周りの、とても寒い気候です。
        show:
          - { type: text, color: green, text: "**C 温帯**：四季がありすごしやすい（日本・中国東部・ヨーロッパ・北米東部）" }
          - { type: text, color: blue, text: "**D 冷帯**：冬が厳しく、針葉樹の森 **タイガ**（ロシア・カナダ）" }
          - { type: text, color: gray, text: "**E 寒帯**：北極・南極の周りのとても寒い気候" }
