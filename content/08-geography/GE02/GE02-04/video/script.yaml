title: 海流と気候
scenes:
  - board: whiteboard
    steps:
      - say: 「海流と気候」です。暖流は、赤道に近い暖かい海水を、北や南へ運び、海沿いの気候を暖かくします。寒流は、反対に、海沿いをすずしく、乾燥させます。
        show:
          - { type: title, text: 暖流と寒流 }
          - { type: image, src: 1000002929.webp, at: [80, 120], w: 640 }
          - { type: text, at: [760, 150], w: 460, color: pink, text: "**暖流**：海沿いを暖かくする" }
          - { type: text, at: [760, 230], w: 460, color: blue, text: "**寒流**：海沿いをすずしく・乾燥させる" }
      - say: いちばん有名なのが、ヨーロッパを暖める、北大西洋海流です。ロンドンは、北海道よりも北にあるのに、冬でも比較的暖かいのは、この暖流のおかげです。
        show:
          - { type: box, at: [760, 330], w: 460, color: yellow, text: "**北大西洋海流**：ロンドンは北海道より北なのに冬も比較的暖かい" }

  - board: whiteboard
    steps:
      - say: 日本の近くにも、大切な海流があります。黒潮、日本海流は、太平洋を北へ流れる暖流。親潮、千島海流は、北から南へ流れる寒流です。暖流と寒流がぶつかる潮目は、栄養が豊かで、三陸沖が、世界有数の漁場になっているのは、このためです。
        show:
          - { type: title, text: 日本の近くの海流 }
          - { type: image, src: 1000002930.webp, at: [60, 120], w: 500 }
          - { type: text, at: [600, 140], w: 620, color: pink, text: "**黒潮**（日本海流）：北へ流れる暖流" }
          - { type: text, at: [600, 230], w: 620, color: blue, text: "**親潮**（千島海流）：南へ流れる寒流" }
          - { type: box, at: [600, 330], w: 620, color: yellow, text: "ぶつかる **潮目** → 三陸沖は世界有数の漁場" }
