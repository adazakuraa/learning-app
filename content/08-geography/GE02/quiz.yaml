questions:
  - q: 地球の表面をおおう岩盤の板が動き、地震や火山を起こすという理論を何というか。
    a: [プレートテクトニクス]
  - q: 世界でいちばん高い山はどこか。
    a: [エベレスト, チョモランマ]
    show: エベレスト（標高8849m）
  - q: 赤道付近の、一年中気温が高く雨が多い気候帯を何というか。
    a: [熱帯]
  - q: 日本の太平洋側を北上する暖流を何というか。
    a: [黒潮, 日本海流]
    show: 黒潮（日本海流）
  - q: 山を越えた風が、乾いた熱い風となって吹き下ろす現象を何というか。
    a: [フェーン現象]
