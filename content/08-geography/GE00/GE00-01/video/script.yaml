title: 地理とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、地理がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 地理とは
      - say: 地理では、地図の見方、世界と日本の地形・気候、資源や産業、人口や都市、そして各地域の特徴を学びます。
        show:
          - type: box
            w: 1100
            text: 地理では、地図の見方、世界と日本の地形・気候、資源や産業、人口や都市、そして各地域の特徴を学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で10章です。第1章は地図と地球の基礎、第2章は世界の地形と気候、第3章は世界の資源・農業・経済、第4章は世界の人口と都市、第5章はアジア、第6章はヨーロッパ・ロシア、第7章はアフリカ・南北アメリカ・オセアニア、第8章は日本の地形と自然、第9章は日本の地域と産業、第10章は現代世界の地理的課題。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　地図と地球の基礎
              - 第2章　世界の地形と気候
              - 第3章　世界の資源・農業・経済
              - 第4章　世界の人口と都市
              - 第5章　アジア
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第6章　ヨーロッパ・ロシア
              - 第7章　アフリカ・南北アメリカ・オセアニア
              - 第8章　日本の地形と自然
              - 第9章　日本の地域と産業
              - 第10章　現代世界の地理的課題
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、地理を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、世界の「なぜ」がわかる。なぜこの国は豊かなのか、なぜ食べ物の値段が変わるのか。地形や気候、資源から考えると理由が見えてきます。
        show:
          - type: box
            w: 1100
            text: |-
              **世界の「なぜ」がわかる**
              なぜこの国は豊かなのか、なぜ食べ物の値段が変わるのか。地形や気候、資源から考えると理由が見えてきます。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、災害に備えられる。日本の地形や気候の特徴を知ることは、地震や水害などの災害から身を守ることにつながります。
        show:
          - type: box
            w: 1100
            text: |-
              **災害に備えられる**
              日本の地形や気候の特徴を知ることは、地震や水害などの災害から身を守ることにつながります。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、旅行やビジネスに役立つ。時差、気候、その地域の産業や文化。知っていると、旅行や仕事の計画が立てやすくなります。
        show:
          - type: box
            w: 1100
            text: |-
              **旅行やビジネスに役立つ**
              時差、気候、その地域の産業や文化。知っていると、旅行や仕事の計画が立てやすくなります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、ハザードマップで自分の住む場所を確かめるとき、輸入品の値上がりなど、経済ニュースを見るとき、海外旅行の計画を立てるとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - ハザードマップで自分の住む場所を確かめるとき
              - 輸入品の値上がりなど、経済ニュースを見るとき
              - 海外旅行の計画を立てるとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、地図を見ながら学ぶ。そして、地形・気候・産業を「だからこうなる」でつなげる。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・**地図を見ながら**学ぶ
              ・地形・気候・産業を「だからこうなる」でつなげる
            color: pink
            at:
              - 80
              - 420
