title: 東アジア
scenes:
  - board: slide
    steps:
      - say: 第5章、「アジア」です。
        show:
          - { type: title, text: 第5章　アジア }
      - say: 東アジア、東南アジア、南アジア、中東、中央アジアを、順にめぐります。
        show:
          - type: list
            items: ["東アジア", "東南アジア", "南アジア", "中東・西アジア", "中央アジア"]
      - say: 世界の人口の半分以上が暮らし、経済の中心にもなりつつあるアジア。日本の近所の国々を知りましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "日本をふくむアジアの国々の特徴と、つながりを知る" }

  - board: whiteboard
    steps:
      - say: 東アジアは、日本、中国、韓国、台湾、モンゴルからなる地域で、漢字や儒教など、共通する文化の背景を持っています。
        show:
          - { type: title, text: 東アジア }
          - { type: image, src: 1000002936.webp, at: [80, 115], w: 640 }
          - { type: text, at: [760, 150], w: 460, text: "日本・中国・韓国・台湾・モンゴル" }
          - { type: text, at: [760, 270], w: 460, color: yellow, text: "共通の背景：漢字・儒教" }

  - board: whiteboard
    steps:
      - say: 中国は、面積が世界で4番目ほど、人口はおよそ14億人という、巨大な国です。広い国土には、砂漠、草原、高原、平野と、さまざまな地形や気候があります。世界の工場として、ものづくりを担うことで、経済が成長しましたが、近年は、技術や軍事でも存在感を増し、アメリカとの覇権争いが、21世紀の国際政治の、最大のテーマになっています。
        show:
          - { type: title, text: 中国 }
          - { type: box, color: pink, w: 1100, text: "面積は世界4位ほど、人口 約14億人。「**世界の工場**」として成長 → 今はアメリカと覇権を争う" }
  - board: whiteboard
    steps:
      - say: 中国の名所です。万里の長城、兵馬俑、紫禁城、そして、山水画のような武陵源。
        show:
          - { type: title, text: "中国の名所" }
          - { type: image, src: 1000003105.webp, at: [124, 130], w: 452, caption: "万里の長城" }
          - { type: image, src: 1000003107.webp, at: [769, 130], w: 322, caption: "兵馬俑" }
          - { type: image, src: 1000003108.webp, at: [176, 412], w: 348, caption: "紫禁城" }
          - { type: image, src: 1000003106.webp, at: [756, 412], w: 348, caption: "武陵源" }

  - board: whiteboard
    steps:
      - say: 大都市、上海の夜景と、チベットのポタラ宮です。
        show:
          - { type: title, text: "中国の名所" }
          - { type: image, src: 1000003109.webp, at: [80, 130], w: 540, caption: "上海" }
          - { type: image, src: 1000003110.webp, at: [660, 130], w: 540, caption: "ポタラ宮（チベット）" }

  - board: whiteboard
    steps:
      - say: 韓国は、朝鮮半島の南半分をしめる国で、面積は日本のおよそ4分の1、人口は、およそ5200万人です。1960年代には、日本の政府開発援助、ODAも受ける貧しい国でしたが、半導体、造船、自動車、電子機器などの産業を育てて、急速に発展し、今では先進国の一員です。
        read: 韓国は、朝鮮半島の南半分をしめる国で、面積は日本のおよそ4分の1、人口は、およそ5200万人です。1960年代には、日本の政府開発援助、オーディーエーも受ける貧しい国でしたが、半導体、造船、自動車、電子機器などの産業を育てて、急速に発展し、今では先進国の一員です。
        show:
          - { type: title, text: 韓国と台湾 }
          - { type: box, color: blue, w: 1100, title: 韓国, text: "面積は日本の約1/4、人口 約5200万人。援助を受ける国から、半導体・造船・自動車で先進国へ" }
      - say: 台湾は、中国大陸から、およそ180キロメートル離れた島で、面積は九州とほぼ同じです。半導体の製造で、世界で最も大切な地位をしめていて、世界の半導体の、およそ6割が台湾でつくられています。中国は、台湾を自分の国の一部だと主張していて、台湾海峡の緊張は、今の世界の、最大の火種のひとつです。
        show:
          - { type: box, color: green, w: 1100, title: 台湾, text: "九州ほどの島。世界の半導体の約6割を製造。中国との緊張は世界最大の火種のひとつ" }
  - board: whiteboard
    steps:
      - say: 台湾の名所、九份です。山の斜面に、ちょうちんの明かりがともる、レトロな町並みが人気です。
        added: true
        show:
          - { type: title, text: "台湾の名所" }
          - { type: image, src: 1000003111.webp, at: [181, 130], w: 697, caption: "九份（台湾）" }
