title: 東南アジア
scenes:
  - board: whiteboard
    steps:
      - say: 「東南アジア」です。東南アジアは、中国とインドという、2つの大きな文明の間にあり、その両方の影響を受けながら、独自の文化を育ててきた地域です。11の国が、ASEAN、東南アジア諸国連合をつくっています。
        read: 「東南アジア」です。東南アジアは、中国とインドという、2つの大きな文明の間にあり、その両方の影響を受けながら、独自の文化を育ててきた地域です。11の国が、アセアン、東南アジア諸国連合をつくっています。
        show:
          - { type: title, text: 東南アジア }
          - { type: image, src: 1000002937.webp, at: [80, 115], w: 560 }
          - { type: text, at: [690, 150], w: 530, text: "中国とインドの間。両方の影響を受け独自の文化" }
          - { type: text, at: [690, 260], w: 530, color: yellow, text: "**ASEAN**（東南アジア諸国連合）：11か国" }
      - say: 地理的には、タイ、ベトナム、ミャンマーなどの大陸部と、インドネシア、フィリピンなどの島の部分に分かれます。大陸部は、メコン川などの大河が流れる農業地帯で、米づくりがさかんです。島の部分は火山が多く、インドネシアは、世界で最も多くの活火山を持つ国のひとつです。
        show:
          - { type: text, at: [690, 360], w: 530, color: green, text: "大陸部：メコン川・米づくり" }
          - { type: text, at: [690, 440], w: 530, color: pink, text: "島の部分：火山が多い（インドネシア）" }

  - board: whiteboard
    steps:
      - say: インドネシアは、人口およそ2億7000万人、世界4位の大国で、1万7000以上の島からなります。石油やニッケルなどの資源も豊富です。そして、シンガポールは、面積が東京23区とほぼ同じという、とても小さな都市国家ですが、港、金融、物流の拠点として、一人あたりのGDPが、日本を大きく上回る、豊かな国です。
        read: インドネシアは、人口およそ2億7000万人、世界4位の大国で、1万7000以上の島からなります。石油やニッケルなどの資源も豊富です。そして、シンガポールは、面積が東京23区とほぼ同じという、とても小さな都市国家ですが、港、金融、物流の拠点として、一人あたりのジーディーピーが、日本を大きく上回る、豊かな国です。
        show:
          - { type: title, text: インドネシアとシンガポール }
          - { type: box, color: green, w: 1100, title: インドネシア, text: "人口 約2億7000万人（世界4位）、1万7000以上の島。資源が豊富" }
          - { type: box, color: blue, w: 1100, title: シンガポール, text: "東京23区ほどの都市国家。港・金融・物流の拠点で、一人あたりGDPは日本を大きく上回る" }
  - board: whiteboard
    steps:
      - say: 名所です。インドネシアの、仏教遺跡ボロブドゥールと、ヒンドゥー教のプランバナン寺院。そして、シンガポールのマリーナベイサンズです。
        show:
          - { type: title, text: "インドネシアとシンガポールの名所" }
          - { type: image, src: 1000003098.webp, at: [179, 130], w: 342, caption: "ボロブドゥール（インドネシア）" }
          - { type: image, src: 1000003099.webp, at: [754, 130], w: 352, caption: "プランバナン寺院（インドネシア）" }
          - { type: image, src: 1000003100.webp, at: [138, 412], w: 424, caption: "マリーナベイサンズ（シンガポール）" }

  - board: whiteboard
    steps:
      - say: タイのワット・ポー、ワット・アルン、古都アユタヤ。そして、ベトナムの町並みです。仏教の寺院が、町の風景にとけこんでいます。
        show:
          - { type: title, text: "タイ・ベトナムの名所" }
          - { type: image, src: 1000003101.webp, at: [177, 130], w: 345, caption: "ワット・ポー（タイ）" }
          - { type: image, src: 1000003102.webp, at: [772, 130], w: 315, caption: "ワット・アルン（タイ）" }
          - { type: image, src: 1000003103.webp, at: [126, 412], w: 447, caption: "アユタヤ（タイ）" }
          - { type: image, src: 1000003104.webp, at: [751, 412], w: 358, caption: "ベトナムの町並み" }
