title: 南アジア
scenes:
  - board: whiteboard
    steps:
      - say: 「南アジア」です。南アジアは、ヒマラヤ山脈を北のかべとして、インドとそのまわりの国々からなる地域です。
        show:
          - { type: title, text: 南アジア }
          - { type: image, src: 1000002940.webp, at: [80, 115], w: 520 }
      - say: インドは、2023年に中国を抜いて、世界で最も人口の多い国になりました。面積は日本のおよそ9倍、人口はおよそ14億3000万人です。北にはガンジス平野という広い農業地帯、南にはデカン高原が広がります。気候は、季節風、モンスーンの影響を強く受け、雨季と乾季がはっきり分かれます。
        show:
          - { type: text, at: [650, 140], w: 570, text: "**インド**：人口 約14億3000万人（世界1位）、面積は日本の約9倍" }
          - { type: text, at: [650, 250], w: 570, color: green, text: "北：ガンジス平野　南：デカン高原　モンスーンで雨季・乾季" }

  - board: whiteboard
    steps:
      - say: インドでは、何百もの言葉が話され、宗教も、ヒンドゥー教、イスラム教、シク教、仏教、キリスト教などが、共存しています。IT産業の発展がめざましく、バンガロールは、インドのシリコンバレーと呼ばれます。ただし、都市と農村、豊かな人とまずしい人の格差は、まだ大きいままです。
        read: インドでは、何百もの言葉が話され、宗教も、ヒンドゥー教、イスラム教、シク教、仏教、キリスト教などが、共存しています。アイティー産業の発展がめざましく、バンガロールは、インドのシリコンバレーと呼ばれます。ただし、都市と農村、豊かな人とまずしい人の格差は、まだ大きいままです。
        show:
          - { type: title, text: 多様なインド }
          - { type: box, color: yellow, w: 1100, text: "何百もの言葉、多くの宗教が共存。IT産業がさかん（バンガロール ＝ インドのシリコンバレー）。格差は大きい" }
      - say: パキスタンとバングラデシュは、1947年のインドの独立のときに、イギリス領インドから分かれた、イスラム教の国です。パキスタンは、核兵器を持ち、インドとの間に、カシミール問題という、解決していない領土の争いをかかえています。バングラデシュは、洪水や、海面の上昇の危険に、いつもさらされています。
        show:
          - { type: box, color: pink, w: 1100, title: パキスタン, text: "1947年に分離したイスラム教国。核兵器を持ち、インドとカシミールをめぐって対立" }
          - { type: box, color: blue, w: 1100, title: バングラデシュ, text: "洪水・海面上昇の危険にさらされる" }
  - board: whiteboard
    steps:
      - say: インドの名所です。白く美しい霊廟、タージ・マハル。ガンジス川で人々が身を清める聖地、ベナレス。岩をほってつくられた、エローラ遺跡です。
        show:
          - { type: title, text: "インドの名所" }
          - { type: image, src: 1000003095.webp, at: [85, 130], w: 529, caption: "タージ・マハル" }
          - { type: image, src: 1000003096.webp, at: [773, 130], w: 314, caption: "ベナレス（ガンジス川）" }
          - { type: image, src: 1000003097.webp, at: [173, 412], w: 353, caption: "エローラ遺跡" }
