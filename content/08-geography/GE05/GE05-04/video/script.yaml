title: 中東・西アジア
scenes:
  - board: whiteboard
    steps:
      - say: 「中東と西アジア」です。中東は、ふつう、アラビア半島のまわりの地域を指します。この地域の、いちばんの地理的な特徴は、石油と、乾いた気候です。アラビア半島のほとんどは砂漠で、農業が難しく、石油の収入なしには成り立たない国が多くあります。
        show:
          - { type: title, text: 中東 }
          - { type: image, src: 1000002941.webp, at: [80, 115], w: 520 }
          - { type: text, at: [650, 150], w: 570, text: "特徴：**石油** と乾いた気候" }
      - say: サウジアラビア、アラブ首長国連邦、クウェートなどの産油国は、石油の収入で、近代的なまちづくりを進め、ドバイのような、砂漠の中の超近代都市をつくり上げました。
        show:
          - { type: image, src: 1000003091.webp, at: [650, 240], w: 440, caption: "ドバイ（アラブ首長国連邦）" }

  - board: whiteboard
    steps:
      - say: イスラエル・パレスチナ問題は、この地域の中心的な紛争です。1948年に、ユダヤ人がイスラエルを建国したとき、もともとそこに住んでいた、パレスチナの人々が、土地を追われました。3つの宗教の聖地、エルサレムをめぐる対立もからみ、解決の糸口が見えないまま、今に至っています。
        show:
          - { type: title, text: 中東の対立 }
          - { type: box, color: pink, w: 1100, title: イスラエル・パレスチナ問題, text: "1948年イスラエル建国 → パレスチナの人々が土地を追われる。聖地エルサレムの対立も" }
      - say: イランとサウジアラビアは、イスラム世界の、2つの大きな勢力として対立しています。イランはシーア派、サウジアラビアはスンニ派を代表し、この宗派の対立は、中東各地の紛争に影響しています。
        show:
          - { type: box, color: blue, w: 1100, title: イラン vs サウジアラビア, text: "シーア派 vs スンニ派。中東各地の紛争に影響" }
      - say: トルコは、NATO、北大西洋条約機構の加盟国でありながら、イスラム世界にも属するという、独特の立場の国です。ヨーロッパとアジアを結ぶ、ボスポラス海峡をおさえる、大事な場所にあります。
        read: トルコは、ナトー、北大西洋条約機構の加盟国でありながら、イスラム世界にも属するという、独特の立場の国です。ヨーロッパとアジアを結ぶ、ボスポラス海峡をおさえる、大事な場所にあります。
        show:
          - { type: box, color: green, w: 1100, title: トルコ, text: "NATO加盟国でイスラム世界にも属する。ヨーロッパとアジアを結ぶ **ボスポラス海峡**" }
  - board: whiteboard
    steps:
      - say: トルコの名所です。キリスト教の大聖堂からモスクになった、アヤソフィア。そして、きのこのような岩が立ちならぶ、カッパドキアです。
        show:
          - { type: title, text: "トルコの名所" }
          - { type: image, src: 1000003094.webp, at: [95, 130], w: 509, caption: "アヤソフィア（イスタンブール）" }
          - { type: image, src: 1000003093.webp, at: [737, 130], w: 386, caption: "カッパドキア" }
