title: 中央アジア
scenes:
  - board: whiteboard
    steps:
      - say: 「中央アジア」です。中央アジアの国々は、どれも旧ソビエト連邦の一部で、1991年のソ連の崩壊のあとに独立しました。近くにあるカスピ海は、世界最大の湖です。
        show:
          - { type: title, text: 中央アジア }
          - { type: image, src: 1000002942.webp, at: [80, 115], w: 560 }
          - { type: text, at: [690, 150], w: 530, text: "旧ソ連の国々。1991年に独立" }
          - { type: text, at: [690, 240], w: 530, color: blue, text: "**カスピ海**：世界最大の湖" }
      - say: この地域の最大の地理的な特徴は、海のない内陸国であることです。海に出られないことは、貿易のうえで大きな不利で、物を輸出入するために、いくつもの国を通らなければなりません。運ぶお金がかかり、経済の発展のかべになっています。
        show:
          - { type: box, at: [690, 340], w: 530, color: pink, text: "**海のない内陸国** → 貿易に不利（いくつもの国を通る）" }

  - board: whiteboard
    steps:
      - say: かつては、シルクロードの幹線が通り、東と西の交易の、要所として栄えました。今でも、中国、ロシア、ヨーロッパ、中東を結ぶ、通り道として大切で、中国の一帯一路構想の、中心の地域でもあります。カザフスタンは、石油、天然ガス、ウランなどの資源が豊富です。
        show:
          - { type: title, text: シルクロードの道 }
          - { type: box, color: yellow, w: 1100, text: "かつて **シルクロード** の要所 → 今も東西を結ぶ通り道（中国の「**一帯一路**」の中心）" }
          - { type: text, color: green, text: "カザフスタン：石油・天然ガス・ウランが豊富" }
