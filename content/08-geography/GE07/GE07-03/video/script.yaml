title: 中南米
scenes:
  - board: whiteboard
    steps:
      - say: 「中南米」です。中南米は、ポルトガル語の国、ブラジルと、スペイン語の国々に、大きく分かれます。大航海時代に、ポルトガルとスペインが、この地域を植民地にしたためです。
        show:
          - { type: title, text: 中南米 }
          - { type: image, src: 1000002949.webp, at: [60, 115], w: 460 }
          - { type: text, at: [560, 130], w: 670, text: "ブラジル：ポルトガル語　その他の多く：スペイン語" }
          - { type: text, at: [560, 235], w: 670, size: s, color: gray, text: "大航海時代にポルトガル・スペインの植民地になったため" }
      - say: ブラジルは、南米最大の国です。アマゾン川の流域に、地球最大の熱帯雨林をかかえ、大豆、砂糖、コーヒー、牛肉の、世界的な生産国でもあります。メキシコは、アメリカと長い国境で接していて、アメリカ向けの、自動車や電気製品を組み立てる工場が、国境沿いにならびます。移民の問題でも、アメリカとの関係が、いつも注目されます。
        show:
          - { type: box, at: [560, 310], w: 670, color: green, title: ブラジル, text: "南米最大。アマゾン。大豆・砂糖・コーヒー・牛肉" }
          - { type: box, at: [560, 480], w: 670, color: yellow, title: メキシコ, text: "アメリカ向けの工場・移民の問題" }
  - board: whiteboard
    steps:
      - say: ブラジルの名所です。リオのカーニバル。世界三大瀑布のひとつ、イグアスの滝。そして、リオの街を見守る、コルコバードの丘のキリスト像です。
        show:
          - { type: title, text: "ブラジルの名所" }
          - { type: image, src: 1000003052.webp, at: [191, 130], w: 317, caption: "リオのカーニバル" }
          - { type: image, src: 1000003051.webp, at: [773, 130], w: 314, caption: "イグアスの滝" }
          - { type: image, src: 1000003050.webp, at: [148, 412], w: 404, caption: "コルコバードの丘" }
  - board: whiteboard
    steps:
      - say: メキシコの、マヤ文明の遺跡、チチェン・イッツァと、首都メキシコシティです。
        show:
          - { type: title, text: "メキシコの名所" }
          - { type: image, src: 1000003053.webp, at: [80, 130], w: 540, caption: "チチェン・イッツァ" }
          - { type: image, src: 1000003054.webp, at: [660, 130], w: 540, caption: "メキシコシティ" }
  - board: whiteboard
    steps:
      - say: ボリビアの、空をうつす鏡のような、ウユニ塩湖。ペルーの、ナスカの地上絵、インカ帝国の空中都市マチュピチュ、そして、しま模様の山、レインボーマウンテンです。
        show:
          - { type: title, text: "ボリビア・ペルーの名所" }
          - { type: image, src: 1000003055.webp, at: [179, 130], w: 342, caption: "ウユニ塩湖（ボリビア）" }
          - { type: image, src: 1000003056.webp, at: [754, 130], w: 351, caption: "ナスカの地上絵（ペルー）" }
          - { type: image, src: 1000003057.webp, at: [176, 412], w: 347, caption: "マチュピチュ（ペルー）" }
          - { type: image, src: 1000003058.webp, at: [773, 412], w: 314, caption: "レインボーマウンテン" }
