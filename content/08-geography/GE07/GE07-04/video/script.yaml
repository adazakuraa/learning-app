title: オセアニア
scenes:
  - board: whiteboard
    steps:
      - say: 「オセアニア」です。オセアニアは、オーストラリア、ニュージーランドと、太平洋に散らばる島々からなる地域です。
        show:
          - { type: title, text: オセアニア }
          - { type: image, src: 1000002950.webp, at: [80, 115], w: 520 }
      - say: オーストラリアは、国土の、およそ7割が乾燥した地域で、シドニー、メルボルン、ブリスベン、パースという、主な都市は、すべて海沿いにあります。内陸は、広い乾燥地帯で、カンガルー、コアラ、ウォンバットなどの有袋類のような、ほかの大陸とまったくちがう、独自の生き物が暮らしています。
        show:
          - { type: box, at: [650, 140], w: 570, color: yellow, title: オーストラリア, text: "国土の約7割が乾燥。大都市はみな海沿い。カンガルー・コアラなど独自の **有袋類**" }
      - say: 大陸が、ほかの大陸から長く離れていたので、生き物が独自の進化をとげたのです。生物で学んだ、進化の話とつながりますね。
        added: true
        show:
          - { type: text, at: [650, 380], w: 570, color: gray, text: "ほかの大陸から長く離れ、独自に進化した" }
  - board: whiteboard
    steps:
      - say: オーストラリアの名所です。大地にそびえる一枚岩、ウルル。シドニーのオペラハウス。コアラ。そして、グレートバリアリーフにある、ハート形のサンゴ礁、ハート・リーフです。
        show:
          - { type: title, text: "オーストラリアの名所" }
          - { type: image, src: 1000003046.webp, at: [171, 130], w: 358, caption: "ウルル（エアーズ・ロック）" }
          - { type: image, src: 1000003047.webp, at: [756, 130], w: 348, caption: "シドニー・オペラハウス" }
          - { type: image, src: 1000003048.webp, at: [175, 412], w: 349, caption: "コアラ" }
          - { type: image, src: 1000003049.webp, at: [765, 412], w: 329, caption: "ハート・リーフ" }

  - board: whiteboard
    steps:
      - say: ニュージーランドは、火山や温泉、アルプスのような山々、氷河がけずってできたフィヨルドなどの地形で有名です。羊の数が、人口のおよそ6倍という、農業と牧畜の国で、映画、ロード・オブ・ザ・リングの撮影地としても知られます。
        show:
          - { type: title, text: ニュージーランドと太平洋の島々 }
          - { type: box, color: green, w: 1100, title: ニュージーランド, text: "火山・温泉・サザンアルプス・フィヨルド。羊は人口の約6倍" }
      - say: 太平洋の島々の多くは、海面からの高さが低く、地球温暖化による海面の上昇で、しずんでしまう危機にさらされています。
        show:
          - { type: box, color: pink, w: 1100, title: 太平洋の島々, text: "海抜が低い → 温暖化による海面上昇でしずむ危機" }
