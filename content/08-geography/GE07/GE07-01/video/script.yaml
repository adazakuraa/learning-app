title: アフリカの地理と課題
scenes:
  - board: slide
    steps:
      - say: 第7章、「アフリカ、南北アメリカ、オセアニア」です。
        show:
          - { type: title, text: 第7章　アフリカ・南北アメリカ・オセアニア }
      - say: アフリカ、アメリカ合衆国、中南米、オセアニアを、順にめぐります。
        show:
          - type: list
            items: ["アフリカの地理と課題", "アメリカ合衆国", "中南米", "オセアニア"]
      - say: 植民地の歴史、移民の国、豊かな自然。それぞれの地域が、今の姿になった理由を、地理から考えます。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "それぞれの地域が今の姿になった理由を、地理と歴史から考える" }

  - board: whiteboard
    steps:
      - say: アフリカ大陸の面積は、およそ3030万平方キロメートル。アメリカ合衆国、中国、インド、ヨーロッパの主な国々、日本を合わせても、すっぽり収まるほどの広さです。メルカトル図法の地図では、小さく見えてしまうのですね。
        show:
          - { type: title, text: 巨大なアフリカ }
          - { type: image, src: 1000002948.webp, at: [80, 115], w: 480 }
          - { type: text, at: [610, 150], w: 610, text: "面積 約3030万km²" }
          - { type: box, at: [610, 240], w: 610, color: yellow, text: "アメリカ・中国・インド・ヨーロッパ・日本を合わせても収まる広さ" }
      - say: 気候は、赤道を中心に、対称にならんでいます。赤道の近くに熱帯雨林、その外側にサバンナ、さらに外側に、サハラ砂漠などの砂漠、という帯のような構造です。
        show:
          - { type: text, at: [610, 400], w: 610, color: green, text: "赤道から：熱帯雨林 → サバンナ → 砂漠（対称な帯）" }

  - board: whiteboard
    steps:
      - say: アフリカがかかえる、最大の問題のひとつが、植民地の時代に引かれた、まっすぐな国境です。19世紀の後半、ヨーロッパの強国がアフリカを分け合ったとき、民族や言葉、文化の分布を無視して、定規で引いたような国境が引かれました。
        show:
          - { type: title, text: 定規で引かれた国境 }
          - { type: box, color: pink, w: 1100, text: "19世紀後半、ヨーロッパの強国が民族を無視して、定規で引いたような国境を引いた" }
      - say: その結果、ひとつの民族が、いくつもの国に分けられたり、対立する民族が、同じ国に押しこめられたりしました。このゆがみが、今も続く民族の紛争や内戦の、根本の原因のひとつです。
        show:
          - { type: text, text: "→ 民族が分断され、対立する民族が同じ国に → 今も続く紛争・内戦の原因" }

  - board: whiteboard
    steps:
      - say: 資源は豊かです。コンゴのコバルト、南アフリカのダイヤモンド、ナイジェリアの石油、ザンビアの銅。でも、資源の収入が、汚職や争いに変わってしまう、資源ののろいの問題も深刻です。
        show:
          - { type: title, text: 資源と未来 }
          - { type: box, color: yellow, w: 1100, text: "資源が豊か（コバルト・ダイヤモンド・石油・銅）。でも「**資源ののろい**」も深刻" }
      - say: 近年は、人口の増加と経済の成長がめざましく、アフリカの世紀、という言葉も聞かれるようになっています。世界で最も若い大陸が、これからの世界を大きく変えていくかもしれません。
        show:
          - { type: box, color: green, w: 1100, text: "人口増加と経済成長 →「アフリカの世紀」（世界で最も若い大陸）" }
