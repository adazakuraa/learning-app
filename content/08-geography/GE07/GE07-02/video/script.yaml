title: アメリカ合衆国
scenes:
  - board: whiteboard
    steps:
      - say: 「アメリカ合衆国」です。アメリカは、面積が世界で3番目ほど、人口も世界3位、GDPは世界1位という、超大国です。
        read: 「アメリカ合衆国」です。アメリカは、面積が世界で3番目ほど、人口も世界3位、ジーディーピーは世界1位という、超大国です。
        show:
          - { type: title, text: アメリカ合衆国 }
          - { type: image, src: 1000003059.webp, at: [60, 115], w: 470 }
          - { type: text, at: [570, 130], w: 660, text: "面積・人口は世界3位ほど、GDPは世界1位" }
      - say: 地形は、大きく3つに分かれます。西のロッキー山脈、中央の大平原、グレートプレーンズ、東のアパラチア山脈と、その東の平野です。
        show:
          - { type: text, at: [570, 210], w: 660, color: green, text: "西：ロッキー山脈　中央：グレートプレーンズ　東：アパラチア山脈" }
      - say: 50の州それぞれに、個性があります。テキサス州は、石油、農業、IT産業。カリフォルニア州は、シリコンバレーのIT産業と、ハリウッドの映画産業、そして農業。ニューヨーク州は、世界の金融の中心、ウォール街を持ち、たくさんの移民が共に暮らす、アメリカの縮図のような場所です。
        read: 50の州それぞれに、個性があります。テキサス州は、石油、農業、アイティー産業。カリフォルニア州は、シリコンバレーのアイティー産業と、ハリウッドの映画産業、そして農業。ニューヨーク州は、世界の金融の中心、ウォール街を持ち、たくさんの移民が共に暮らす、アメリカの縮図のような場所です。
        show:
          - { type: text, at: [570, 330], w: 660, size: s, color: yellow, text: "テキサス：石油・農業・IT" }
          - { type: text, at: [570, 400], w: 660, size: s, color: yellow, text: "カリフォルニア：シリコンバレー・ハリウッド" }
          - { type: text, at: [570, 470], w: 660, size: s, color: yellow, text: "ニューヨーク：ウォール街・移民の街" }
  - board: whiteboard
    steps:
      - say: アメリカの名所です。世界初の国立公園、イエローストーン。地学でも学んだ、グランドキャニオン。世界三大瀑布のひとつ、ナイアガラの滝。そして、ニューヨークの自由の女神です。
        show:
          - { type: title, text: "アメリカの名所" }
          - { type: image, src: 1000003060.webp, at: [177, 130], w: 346, caption: "イエローストーン国立公園" }
          - { type: image, src: 1000003062.webp, at: [754, 130], w: 351, caption: "グランドキャニオン" }
          - { type: image, src: 1000003065.webp, at: [157, 412], w: 386, caption: "ナイアガラの滝" }
          - { type: image, src: 1000003066.webp, at: [858, 412], w: 143, caption: "自由の女神" }
  - board: whiteboard
    steps:
      - say: 大都市の顔、ニューヨークのタイムズスクエアと、砂漠の中のエンターテインメントの街、ラスベガスです。
        show:
          - { type: title, text: "アメリカの都市" }
          - { type: image, src: 1000003061.webp, at: [80, 130], w: 540, caption: "タイムズスクエア（ニューヨーク）" }
          - { type: image, src: 1000003063.webp, at: [660, 130], w: 540, caption: "ラスベガス" }
