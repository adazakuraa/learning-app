title: 人口増加と少子高齢化
scenes:
  - board: whiteboard
    steps:
      - say: 「人口の増加と少子高齢化」です。世界の人口は、1800年ごろには、およそ10億人でしたが、2023年に、80億人をこえました。およそ200年で、8倍になったのです。その背景には、医療や衛生、農業の技術の進歩があります。
        show:
          - { type: title, text: 200年で8倍 }
          - type: svg
            w: 1000
            h: 220
            markup: |
              <path d="M60 190 H960" stroke="#9aa3ad"/>
              <path d="M80 175 Q600 170 760 110 Q880 50 940 25" stroke="#f3d77a" stroke-width="4"/>
              <g stroke="none" font-size="22"><text x="60" y="215" fill="#9aa3ad">1800年 約10億人</text><text x="760" y="25" fill="#f3d77a">2023年 80億人</text></g>
          - { type: text, color: gray, text: "背景：医療・衛生・農業技術の進歩" }

  - board: whiteboard
    steps:
      - say: でも、増え方は、地域によってまったくちがいます。アフリカは、これからも急に増えると予測されていますが、日本、韓国、イタリア、ドイツなどの先進国では、少子化が進み、人口が減りはじめています。
        show:
          - { type: title, text: 少子化 }
          - { type: text, color: green, text: "アフリカ：これからも急増" }
          - { type: text, color: pink, text: "日本・韓国・イタリア・ドイツ：少子化で減少へ" }
      - say: 日本の合計特殊出生率、つまり、1人の女性が一生のうちに産む子どもの数の平均は、およそ1.2で、人口を保つのに必要とされる、2.07を、大きく下回っています。
        show:
          - { type: box, color: yellow, w: 1100, text: "**合計特殊出生率**（女性1人が一生に産む子の平均）：日本は約1.2 ← 人口維持には2.07が必要" }

  - board: whiteboard
    steps:
      - say: 経済の発展と、出生率には、深い関係があります。一般に、国が豊かになると、出生率は下がります。女性の教育の水準が上がって社会に出るようになり、子育てのお金がかかるようになり、農業中心から都市の暮らしに変わると、子どもをたくさん持つ理由が、うすれるからです。
        show:
          - { type: title, text: 豊かになると子どもが減る }
          - type: list
            items: ["女性の教育が進み、社会に出る", "子育てのお金がかかる", "農業から都市の暮らしへ（子どもが働き手でなくなる）"]
      - say: 日本が直面している少子高齢化は、これから、アジアや東ヨーロッパの国々も、順番に経験していくことになります。日本の取り組みは、世界のお手本にも、反面教師にもなりうるのです。
        show:
          - { type: box, at: [80, 400], w: 1100, color: blue, text: "日本の少子高齢化は、これからアジア・東欧も順に経験する（日本は先頭を走っている）" }
