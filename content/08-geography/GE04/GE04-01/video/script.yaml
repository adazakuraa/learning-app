title: 世界の人口分布
scenes:
  - board: slide
    steps:
      - say: 第4章、「世界の人口と都市」です。
        show:
          - { type: title, text: 第4章　世界の人口と都市 }
      - say: 人がどこに住んでいるか。そして、人口の増加と、少子高齢化を学びます。
        show:
          - type: list
            items: ["世界の人口分布", "人口増加と少子高齢化"]
      - say: 人口は、経済、社会保障、国の力を左右する、いちばん基本的なデータです。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "国の未来を左右する人口の動きをつかむ" }

  - board: whiteboard
    steps:
      - say: 2024年時点で、世界の人口は、およそ82億人です。人が最も集まっているのは、南アジアと東アジアです。インドは、2023年に中国を抜いて、世界で最も人口の多い国になりました。
        show:
          - { type: title, text: 世界と日本の人口 }
          - { type: text, size: l, text: "世界の人口：約 **82億人**（2024年）" }
          - { type: text, color: yellow, text: "最も多いのは南アジア・東アジア。2023年に **インド** が中国を抜いて1位" }
      - say: 日本の人口は、およそ1億2000万人。国土の面積は、世界で61番目と、決して広くありませんが、人口は世界で十数番目です。さらに、人口の多くが、東京から大阪、福岡へと続く、太平洋ベルトと呼ばれる、細長い地域に集中しています。
        show:
          - { type: box, color: blue, w: 1100, text: "日本：約1億2000万人。面積は世界61位だが、人口は世界十数位。多くが **太平洋ベルト** に集中" }
