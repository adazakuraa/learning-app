title: 領土問題と地政学
scenes:
  - board: whiteboard
    steps:
      - say: 「領土問題と地政学」です。地政学とは、地理と政治の関係を研究する学問です。どの国がどこにあるか、どんな資源を持つか、どんな地形か、が、その国の外交や安全保障のあり方を、大きく左右する、という考え方です。
        show:
          - { type: title, text: 地政学 }
          - { type: box, color: yellow, w: 1100, text: "**地政学** ＝ 位置・資源・地形が、国の外交や安全保障を左右する" }
      - say: 例えば、ロシアのウクライナ侵攻の背景には、NATOが東へ広がることへの警戒と、不凍港を求めるロシアの動きの、2つがあります。
        read: 例えば、ロシアのウクライナ侵攻の背景には、ナトーが東へ広がることへの警戒と、不凍港を求めるロシアの動きの、2つがあります。
        show:
          - { type: text, color: pink, text: "例：ウクライナ侵攻 ← NATO の東への拡大への警戒 ＋ 不凍港を求める動き" }

  - board: whiteboard
    steps:
      - say: 南シナ海では、中国が人工の島をつくって軍事基地にし、フィリピン、ベトナム、マレーシアなどと、主権を争っています。中国が面している海は、日本やフィリピン、東南アジアの国々にかこまれていて、自由に使える海が少ない、という地理的な事情があるのです。
        show:
          - { type: title, text: 南シナ海 }
          - { type: box, color: blue, w: 1100, text: "中国が人工島を軍事基地化 → フィリピン・ベトナム・マレーシアなどと主権争い" }
          - { type: text, color: gray, text: "背景：中国の面する海は他国にかこまれ、自由に使える海が少ない" }
      - say: 地図を広げて、その国の立場から世界をながめてみると、ニュースの見え方が変わってきます。
        added: true
        show:
          - { type: text, color: green, text: "その国の立場から地図をながめると、ニュースの見え方が変わる" }
