title: 水資源と食料問題
scenes:
  - board: whiteboard
    steps:
      - say: 最後は、「水資源と食料の問題」です。地球の上の水の、およそ97.5パーセントは海水で、淡水は、およそ2.5パーセントしかありません。さらに、その大部分は、南極や北極の氷や、地下の深い所にあり、人間が使える淡水は、地球の水全体の、およそ0.01パーセントという計算になります。
        show:
          - { type: title, text: 使える水はわずか }
          - type: svg
            w: 1000
            h: 140
            markup: |
              <g stroke="none"><rect x="40" y="30" width="895" height="60" fill="#8fc4ff" fill-opacity="0.5"/><rect x="935" y="30" width="25" height="60" fill="#9be0b0"/></g>
              <g stroke="none" font-size="22"><text x="380" y="68" fill="#1b2a24">海水 約97.5％</text><text x="520" y="125" fill="#9be0b0">淡水 約2.5％（使えるのは約0.01％）</text></g>
      - say: お風呂の水を地球の水とすると、使える淡水は、スプーン1杯にもならない量です。そして、農業用の水が、世界の淡水の使用量の、およそ7割をしめるので、食料の生産と、水の問題は、切り離せません。
        show:
          - { type: text, color: gray, text: "お風呂の水を地球の水とすると、使える淡水はスプーン1杯にも満たない" }
          - { type: box, color: yellow, w: 1000, text: "淡水の使用の約7割が農業 → 食料と水は切り離せない" }

  - board: whiteboard
    steps:
      - say: いくつもの国を流れる、国際河川をめぐる争いも、現実の問題です。ナイル川は、エチオピア、スーダン、エジプトを流れますが、上流のエチオピアが大きなダムをつくったことで、エジプトが、死活問題だ、と強く抗議しました。メコン川でも、中国が上流にダムをつくったことで、下流の国々の水の量や、魚に影響が出ています。
        show:
          - { type: title, text: 国際河川と水戦争 }
          - { type: box, color: blue, w: 1100, title: ナイル川, text: "上流のエチオピアがダム建設 → 下流のエジプトが「死活問題」と抗議" }
          - { type: box, color: green, w: 1100, title: メコン川, text: "上流の中国のダム → 下流の国々の水量・漁業に影響" }
      - say: 水をめぐる争い、水戦争は、21世紀の現実のリスクとして、国際社会で議論されています。地形、気候、資源、人口。地理で学んだすべてが、こうした問題につながっているのです。これで、地理はおしまいです。おつかれさまでした。
        show:
          - { type: box, color: pink, w: 1100, text: "「**水戦争**」は21世紀の現実のリスク。地理の知識すべてが、こうした問題につながっている" }
