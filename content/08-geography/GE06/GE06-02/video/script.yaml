title: 北・東ヨーロッパ
scenes:
  - board: whiteboard
    steps:
      - say: 「北ヨーロッパと東ヨーロッパ」です。北ヨーロッパの国々は、人口は合わせて、およそ2700万人と少ないですが、社会福祉、教育、男女の平等、幸福度などの、国際的なランキングで、いつも上位をしめています。
        show:
          - { type: title, text: 北ヨーロッパ }
          - { type: image, src: 1000002944.webp, at: [80, 115], w: 520 }
          - { type: text, at: [650, 150], w: 570, text: "人口は合わせて約2700万人" }
          - { type: box, at: [650, 250], w: 570, color: green, text: "福祉・教育・男女平等・幸福度で常に上位" }

  - board: whiteboard
    steps:
      - say: 東ヨーロッパには、かつての社会主義の国々がならびます。1989年の冷戦の終わりのあと、2000年代に次々とEUに加わり、西ヨーロッパからの投資を受けて、経済が発展してきました。
        read: 東ヨーロッパには、かつての社会主義の国々がならびます。1989年の冷戦の終わりのあと、2000年代に次々とイーユーに加わり、西ヨーロッパからの投資を受けて、経済が発展してきました。
        show:
          - { type: title, text: 東ヨーロッパ }
          - { type: image, src: 1000002945.webp, at: [80, 115], w: 620 }
          - { type: text, at: [740, 150], w: 480, text: "かつての社会主義の国々" }
          - { type: box, at: [740, 250], w: 480, color: blue, text: "冷戦後、2000年代にEUへ → 西欧の投資で発展" }

  - board: whiteboard
    steps:
      - say: バルカン半島は、さまざまな民族や宗教が入りまじった地域です。半島の西側は、かつて、ユーゴスラビアという、ひとつの国でしたが、いろいろな民族、言葉、文化をかかえていたため、1990年代にユーゴスラビアがばらばらになるとき、激しい紛争が起きました。
        show:
          - { type: title, text: バルカン半島 }
          - { type: image, src: 1000002946.webp, at: [80, 115], w: 500 }
          - { type: text, at: [630, 150], w: 590, text: "民族・宗教が入りまじる。西側はかつて **ユーゴスラビア**" }
          - { type: box, at: [630, 270], w: 590, color: pink, text: "1990年代のユーゴスラビア解体で激しい紛争" }
      - say: 第一次世界大戦のきっかけになったこともあり、ヨーロッパの火薬庫、と呼ばれた歴史は、今も地域の政治の不安定さに、影を落としています。
        show:
          - { type: text, at: [630, 420], w: 590, color: gray, text: "「ヨーロッパの火薬庫」と呼ばれた歴史" }
