title: EU
scenes:
  - board: whiteboard
    steps:
      - say: 「EU」、ヨーロッパ連合です。EUは、2024年時点で27か国が加盟する、国の集まりでありながら、国をこえた組織です。第二次世界大戦のあと、ヨーロッパで二度と戦争を起こさないために、経済を結びつけよう、という考えから始まりました。
        read: 「イーユー」、ヨーロッパ連合です。イーユーは、2024年時点で27か国が加盟する、国の集まりでありながら、国をこえた組織です。第二次世界大戦のあと、ヨーロッパで二度と戦争を起こさないために、経済を結びつけよう、という考えから始まりました。
        show:
          - { type: title, text: EU（ヨーロッパ連合） }
          - { type: box, color: yellow, w: 1100, text: "27か国が加盟する、国をこえた組織。「二度と戦争を起こさないため」に経済を結びつけた" }
      - say: 加盟国の間では、人、物、サービス、お金が、自由に行き来できます。2026年時点で、21か国が、共通のお金、ユーロを使い、両替なしに国境をこえられます。シェンゲン協定の国々の間では、パスポートのチェックなしに移動できます。
        show:
          - { type: text, color: blue, text: "人・物・サービス・お金が自由に行き来" }
          - { type: text, color: green, text: "**ユーロ**：21か国が共通のお金（2026年）" }
          - { type: text, color: pink, text: "**シェンゲン協定**：パスポートのチェックなしで移動" }
      - say: 第1章の地図で見たように、小さな国がたくさん集まるヨーロッパでは、国境をこえるたびに、両替や検問があったら、とても不便ですよね。
        added: true
        show:
          - { type: text, color: gray, text: "小さな国が多いヨーロッパでは、国境のたびの両替・検問はとても不便" }

  - board: whiteboard
    steps:
      - say: 2016年に、イギリスがEUからの離脱、ブレグジットを決めたことは、世界をおどろかせました。移民の問題、自分の国のことを自分で決めたい、という主権の問題、EUへの負担金などへの不満が、離脱を後押ししましたが、離脱のあとのイギリス経済への影響は深刻で、失敗だった、という評価も広がっています。
        read: 2016年に、イギリスがイーユーからの離脱、ブレグジットを決めたことは、世界をおどろかせました。移民の問題、自分の国のことを自分で決めたい、という主権の問題、イーユーへの負担金などへの不満が、離脱を後押ししましたが、離脱のあとのイギリス経済への影響は深刻で、失敗だった、という評価も広がっています。
        show:
          - { type: title, text: ブレグジット }
          - { type: box, color: pink, w: 1100, text: "2016年に離脱を決定：移民・主権・負担金への不満 → 離脱後の経済への影響は深刻（「失敗だった」との評価も）" }
