title: ロシアの地理
scenes:
  - board: whiteboard
    steps:
      - say: 「ロシアの地理」です。ロシアの面積は、およそ1710万平方キロメートルで、世界一。日本のおよそ45倍という、想像をこえる広さです。
        show:
          - { type: title, text: ロシア }
          - { type: text, size: l, text: "面積 約1710万km²（世界一）＝ 日本の約 **45倍**" }
      - say: 国土の大部分には、一年中こおったままの土地、永久凍土が広がります。しかし、この広い土地には、石油、天然ガス、石炭、鉄鉱石、ダイヤモンドなど、ばく大な資源がねむっていて、ロシアが資源大国として、世界に影響力を持つ土台になっています。
        show:
          - { type: box, color: blue, w: 1100, text: "大部分が **永久凍土**。でも石油・天然ガス・石炭・鉄鉱石・ダイヤモンドの **資源大国**" }

  - board: whiteboard
    steps:
      - say: ロシアは、歴史的に、暖かい海への出口を、求め続けてきた国です。北は凍る北極海、東は太平洋の外れ、南は山脈や砂漠がかべになっていて、一年中使える港、不凍港を手に入れることが、長年の課題でした。ウクライナへの侵攻も、黒海やクリミア半島への出口、という文脈で理解できる部分があります。
        show:
          - { type: title, text: 不凍港を求めて }
          - { type: box, color: yellow, w: 1100, text: "北は凍る海、南は山と砂漠 → 一年中使える港（**不凍港**）が長年の課題。黒海・クリミアへの出口" }
  - board: whiteboard
    steps:
      - say: ロシアの名所です。モスクワの赤の広場とクレムリン。そして、サンクトペテルブルクの、エルミタージュ美術館です。
        show:
          - { type: title, text: "ロシアの名所" }
          - { type: image, src: 1000003067.webp, at: [80, 130], w: 540, caption: "赤の広場とクレムリン（モスクワ）" }
          - { type: image, src: 1000003068.webp, at: [660, 130], w: 540, caption: "エルミタージュ美術館（サンクトペテルブルク）" }
