title: 地球の形と大きさ
scenes:
  - board: slide
    steps:
      - say: 地理の最初の章、「地図と地球の基礎」です。
        show:
          - { type: title, text: 第1章　地図と地球の基礎 }
      - say: 地球の大きさ、緯度と経度、時差、そして地図の読み方を学びます。
        show:
          - type: list
            items: ["地球の形と大きさ", "緯度・経度と時差", "地図の読み方"]
      - say: 海外旅行の時差、天気予報の地図、ニュースに出てくる国の場所。地理の基礎があると、世界がぐっと身近になります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "地球と地図の基本を知り、世界の位置関係をつかむ" }

  - board: whiteboard
    steps:
      - say: 地球は、ほぼ球の形をしています。地球のまわりの長さは、およそ4万キロメートル、半径は、およそ6400キロメートルです。
        show:
          - { type: title, text: 地球の大きさ }
          - { type: text, size: l, text: "まわり 約 **4万km**　半径 約 **6400km**" }
      - say: 4万キロメートルは、東京から大阪までの、およそ80往復分。新幹線で走り続けても、まる1週間以上かかる距離です。
        added: true
        show:
          - { type: text, color: gray, text: "4万km ＝ 新幹線で走り続けても1週間以上" }

  - board: whiteboard
    steps:
      - say: 地球の表面の、およそ7割は海で、陸地は、およそ3割しかありません。陸地は、6つの大陸に分かれます。大きい順に、ユーラシア、アフリカ、北アメリカ、南アメリカ、南極、オーストラリアです。
        show:
          - { type: title, text: 6つの大陸と3つの大洋 }
          - { type: image, src: 1000002917.webp, at: [80, 120], w: 700 }
          - type: list
            at: [820, 130]
            size: s
            items: ["ユーラシア", "アフリカ", "北アメリカ", "南アメリカ", "南極", "オーストラリア"]
      - say: 海は、大きく3つの大洋に分かれます。太平洋、大西洋、インド洋です。
        show:
          - { type: text, at: [80, 540], w: 1120, color: blue, text: "海が約7割、陸が約3割。3つの大洋：**太平洋・大西洋・インド洋**" }
