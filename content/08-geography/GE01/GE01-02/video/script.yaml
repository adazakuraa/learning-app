title: 緯度・経度と時差
scenes:
  - board: whiteboard
    steps:
      - say: 「緯度、経度と時差」です。地球の上の位置を表すために、緯度と経度という、目もりがあります。
        show:
          - { type: title, text: 緯度 }
      - say: 緯度は、赤道から、どれだけ北、または南にあるかを表す数字です。赤道が0度で、北極点が北緯90度、南極点が南緯90度です。
        show:
          - { type: image, src: 1000002918.webp, at: [80, 120], w: 640 }
          - { type: text, at: [760, 160], w: 460, text: "**緯度**：赤道（0°）から北・南にどれだけか" }
          - { type: text, at: [760, 280], w: 460, color: yellow, text: "北極点 ＝ 北緯90°　南極点 ＝ 南緯90°" }

  - board: whiteboard
    steps:
      - say: 経度は、イギリスのロンドンにある、グリニッジ天文台を通る線を基準にして、どれだけ東、または西にあるかを表す数字です。基準の0度の線を、本初子午線といい、東西それぞれ、180度まであります。
        show:
          - { type: title, text: 経度 }
          - { type: image, src: 1000002919.webp, at: [80, 120], w: 600 }
          - { type: text, at: [720, 160], w: 500, text: "**経度**：本初子午線（0°、ロンドン）から東・西にどれだけか" }
          - { type: text, at: [720, 300], w: 500, color: yellow, text: "東経・西経それぞれ180°まで" }

  - board: whiteboard
    steps:
      - say: 経度は、時差と直結しています。地球は、24時間で360度まわるので、1時間で15度、動く計算になります。つまり、経度が15度東に行くと、時刻は1時間進み、15度西に行くと、1時間おくれます。
        show:
          - { type: title, text: 時差の計算 }
          - { type: box, color: yellow, w: 1100, text: "360° ÷ 24時間 ＝ **1時間で15°**　→ 東へ15°で1時間進む" }
      - say: 日本の標準時は、東経135度を基準にしています。この線が通るのが、兵庫県の明石市です。ロンドンとの差は、135わる15で、9時間。日本はロンドンより、9時間進んでいます。日本が正午のとき、ロンドンは、午前3時です。
        show:
          - { type: text, text: "日本の標準時：**東経135°**（兵庫県 明石市）" }
          - { type: text, color: green, text: "135 ÷ 15 ＝ 9時間 → 日本が正午のとき、ロンドンは午前3時" }

  - board: whiteboard
    steps:
      - say: 日付変更線は、経度180度のあたりに引かれた線で、この線をこえると、日付が変わります。西から東へこえると1日もどし、東から西へこえると、1日進めます。
        show:
          - { type: title, text: 日付変更線 }
          - { type: image, src: 1000002920.webp, at: [80, 120], w: 620 }
          - { type: text, at: [740, 180], w: 480, color: pink, text: "**日付変更線**（経度180°付近）をこえると日付が変わる" }
      - say: 日本からハワイに行くと、出発した日より前の日付に着くことがあるのは、このためです。
        added: true
        show:
          - { type: text, at: [740, 330], w: 480, color: gray, text: "日本 → ハワイで、前の日付に着くことも" }
