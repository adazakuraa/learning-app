questions:
  - q: 地球の表面のうち、海洋がしめる割合はおよそ何割でしょう？
    a: ['7', 7割, 約7割]
    show: 約7割
  - q: 経度0度の基準となる、ロンドン郊外の天文台を通る線を何というでしょう？
    a: [本初子午線]
  - q: 経度が何度ちがうと、時差が1時間になるでしょう？
    a: ['15', 15度]
    show: 15度
    explain: 地球は24時間で360度回るので、360÷24＝15度で1時間。
  - q: 地図上で、同じ標高の地点を結んだ線を何というでしょう？
    a: [等高線]
    explain: 線の間隔がせまいほど急な斜面。
