title: 地図の読み方
scenes:
  - board: whiteboard
    steps:
      - say: 「地図の読み方」です。地図には、実際の距離を何分の一にちぢめているか、を示す、縮尺があります。2万5千分の1の地図では、地図の上の1センチメートルが、実際の250メートルにあたります。
        show:
          - { type: title, text: 縮尺と等高線 }
          - { type: text, text: "**縮尺** 1/25000：地図の1cm ＝ 実際の250m" }
      - say: 地形図でいちばん大事なのが、等高線です。同じ高さの点を結んだ線で、線の間がせまいほど、急な斜面。広いほど、ゆるやかな斜面です。
        show:
          - { type: image, src: 1000002922.webp, at: [80, 200], w: 700 }
          - { type: text, at: [820, 230], w: 400, color: yellow, text: "**等高線**：同じ高さを結ぶ線" }
          - { type: text, at: [820, 330], w: 400, color: pink, text: "せまい → 急な斜面" }
          - { type: text, at: [820, 400], w: 400, color: green, text: "広い → ゆるやか" }

  - board: whiteboard
    steps:
      - say: よく見る世界地図は、メルカトル図法という地図です。経線と緯線が直角に交わる、ごばんの目のような地図です。ただし、大きなゆがみがあり、北や南に行くほど、面積が実際より大きく見えます。
        show:
          - { type: title, text: メルカトル図法のゆがみ }
          - { type: image, src: 1000002923.webp, at: [80, 120], w: 620 }
          - { type: text, at: [740, 160], w: 480, text: "**メルカトル図法**：北・南に行くほど大きく見える" }
      - say: グリーンランドは、世界最大の島で、メルカトル図法の地図では、アフリカ大陸と同じくらいに見えます。でも、実際の面積は、アフリカの、およそ14分の1しかありません。
        show:
          - { type: box, at: [740, 300], w: 480, color: pink, text: "グリーンランドはアフリカと同じくらいに見えるが、実際は約14分の1" }
      - say: 地図は、目的に合わせて、何かを正しく、何かをゆがめてつくられています。地図をうのみにせず、どんな図法かを意識してみましょう。
        added: true
        show:
          - { type: text, at: [80, 560], w: 1120, color: gray, text: "地図は何かを正しく、何かをゆがめている → 図法を意識する" }
