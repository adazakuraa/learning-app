title: 世界の農業と食料
scenes:
  - board: whiteboard
    steps:
      - say: 「世界の農業と食料」です。農業の形は、気候、地形、歴史によって、地域ごとに大きくちがいます。
        show:
          - { type: title, text: 小麦ととうもろこし }
      - say: 小麦は、アメリカ、カナダ、ロシア、ウクライナ、オーストラリアが、主な生産国です。特に、アメリカ中部のグレートプレーンズと、ウクライナの黒土地帯は、世界のパンかご、と呼ばれる穀倉地帯です。ロシアのウクライナ侵攻で、世界の小麦の値段が急に上がったのは、この地域の大切さを示しています。
        show:
          - { type: box, color: yellow, w: 1100, title: 小麦, text: "アメリカ・カナダ・ロシア・ウクライナ・オーストラリア。ウクライナ侵攻で世界の小麦価格が急騰" }
      - say: とうもろこしは、アメリカが世界最大の生産国で、食べ物としてだけでなく、家畜のえさや、バイオ燃料の原料にも使われます。肉を食べることは、実は、えさになる穀物を、間接的にたくさん使っている、ということでもあります。牛肉1キログラムをつくるには、およそ10キログラムもの穀物が必要だといわれます。
        show:
          - { type: box, color: green, w: 1100, title: とうもろこし, text: "アメリカが最大。食べ物・家畜のえさ・バイオ燃料。肉を食べる ＝ 穀物を間接的に大量に使う" }

  - board: whiteboard
    steps:
      - say: 食料の生産と消費の、地域の差は深刻です。アフリカのサハラ砂漠より南の地域や、南アジアの一部では、慢性的な食料不足が続いています。一方、先進国では、食料のおよそ3分の1が、捨てられています。
        show:
          - { type: title, text: 食料は「ない」のではなく「届かない」 }
          - { type: box, color: pink, at: [80, 140], w: 540, title: 足りない地域, text: "サハラ以南のアフリカ・南アジアの一部で慢性的な不足" }
          - { type: box, color: blue, at: [660, 140], w: 540, title: 余っている地域, text: "先進国では食料の約3分の1が捨てられる" }
      - say: 食料がないのではなく、届かない。分け方の問題こそが、飢えの本質なのです。
        show:
          - { type: box, at: [80, 360], w: 1120, color: yellow, text: "飢えの本質 ＝「食料がない」のではなく「届かない」（分け方の問題）" }
