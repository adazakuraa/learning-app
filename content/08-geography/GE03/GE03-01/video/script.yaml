title: 石油・天然ガスの分布
scenes:
  - board: slide
    steps:
      - say: 第3章、「世界の資源、農業、経済」です。
        show:
          - { type: title, text: 第3章　世界の資源・農業・経済 }
      - say: 石油と天然ガス、鉱物資源、農業と食料、そして国と国の豊かさのちがいを学びます。
        show:
          - type: list
            items: ["石油・天然ガスの分布", "鉱物資源とレアメタル", "世界の農業と食料", "経済格差"]
      - say: ガソリン代、スマホの部品、パンの値段。私たちの暮らしは、遠い国の資源と、深くつながっています。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "資源や食料のかたよりと、暮らし・国際政治とのつながりを知る" }

  - board: whiteboard
    steps:
      - say: 今の文明を支えるエネルギーの中心が、石油と天然ガスです。でも、これらの資源は、特定の地域に、かたよって存在しています。
        show:
          - { type: title, text: 石油のかたより }
          - { type: image, src: 1000002932.webp, at: [80, 115], w: 420 }
      - say: 世界の確認されている埋蔵量の、およそ半分が、中東、つまり、サウジアラビア、イラク、イラン、クウェート、アラブ首長国連邦に集中しています。産油国がつくる組織が、OPEC、石油輸出国機構です。加盟国が足並みをそろえて、生産量を調整し、石油の値段に影響をあたえます。
        read: 世界の確認されている埋蔵量の、およそ半分が、中東、つまり、サウジアラビア、イラク、イラン、クウェート、アラブ首長国連邦に集中しています。産油国がつくる組織が、オペック、石油輸出国機構です。加盟国が足並みをそろえて、生産量を調整し、石油の値段に影響をあたえます。
        show:
          - { type: text, at: [550, 150], w: 670, text: "埋蔵量の約半分が **中東** に集中" }
          - { type: box, at: [550, 240], w: 670, color: yellow, text: "**OPEC**（石油輸出国機構）：生産量を調整し、値段に影響" }

  - board: whiteboard
    steps:
      - say: 1970年代に、中東の産油国が、石油の輸出を制限した、オイルショックでは、日本でも、トイレットペーパーの買いしめ騒ぎが起きるほど、経済が混乱しました。石油を持つ国が、持たない国をゆさぶれる、というしくみは、今の国際政治の、大事な軸のひとつです。
        show:
          - { type: title, text: 石油と国際政治 }
          - { type: box, color: pink, w: 1100, text: "1970年代 **オイルショック**：トイレットペーパーの買いしめ騒ぎ。石油を持つ国が持たない国をゆさぶれる" }
      - say: 近年は、ロシアやアメリカ、カナダなどの生産も増えて、中東だけに集中する構図は、変わりつつあります。新しい採掘の技術による、シェール革命で、アメリカが、世界最大の産油国になったことは、国際政治の力のバランスにも、影響をあたえています。
        show:
          - { type: box, color: green, w: 1100, text: "**シェール革命**：新しい採掘技術でアメリカが世界最大の産油国に → 力のバランスが変化" }
