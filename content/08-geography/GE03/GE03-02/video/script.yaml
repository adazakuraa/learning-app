title: 鉱物資源とレアメタル
scenes:
  - board: whiteboard
    steps:
      - say: 「鉱物資源とレアメタル」です。石油のほかにも、今の産業を支える鉱物資源は、特定の地域にかたよっています。アメリカ、中国、ロシア、オーストラリア、アフリカの一部に多く、ヨーロッパや日本では、ほとんどとれません。
        show:
          - { type: title, text: 鉱物資源のかたより }
          - { type: image, src: 1000002933.webp, at: [80, 115], w: 1100 }
      - say: 鉄鉱石は、オーストラリア、ブラジル、中国が主な産出国で、日本は、その大半を、オーストラリアとブラジルから輸入しています。銅は、チリが世界最大の産出国です。
        show:
          - { type: text, at: [80, 560], w: 1120, color: yellow, text: "鉄鉱石：オーストラリア・ブラジル・中国　／　銅：チリが世界最大" }

  - board: whiteboard
    steps:
      - say: 近年、特に大切になっているのが、レアメタル、つまり希少な金属です。スマートフォン、電気自動車、再生可能エネルギーの機械などに、欠かせない金属で、リチウム、コバルト、ニッケル、ネオジムなどがあります。
        show:
          - { type: title, text: レアメタルと紛争鉱物 }
          - { type: box, color: blue, w: 1100, title: レアメタル, text: "スマホ・電気自動車・再エネ機器に欠かせない（リチウム・コバルト・ニッケル・ネオジム）" }
      - say: リチウムは、南米のアンデス山脈のあたりに集中しています。コバルトは、アフリカのコンゴ民主共和国が、世界の生産の、およそ7割をしめます。
        show:
          - { type: text, text: "リチウム：アンデス山脈周辺　／　コバルト：コンゴ民主共和国が約7割" }
      - say: 紛争の起きている地域でとられた鉱物が、世界の市場に流れこむと、武装した勢力の資金源になります。これを、紛争鉱物の問題といいます。わたしたちのスマホの中の金属も、無関係ではないのです。
        show:
          - { type: box, color: pink, w: 1100, title: 紛争鉱物, text: "紛争地域の鉱物が市場に流れ、武装勢力の資金源に → スマホを使う私たちも無関係ではない" }
