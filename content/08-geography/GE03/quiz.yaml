    a: [OPEC, オペック]
    show: OPEC
  - q: スマホや電気自動車に欠かせない、産出量の少ない金属をまとめて何というか。
    a: [レアメタル, 希少金属]
    r: [きしょうきんぞく]
    show: レアメタル
  - q: 豊かな先進国が北半球に多く、貧しい国が南に多いことから生まれた格差の問題を何というか。
    a: [南北問題]
  - q: ブラジル・ロシア・インド・中国・南アフリカの頭文字をとった、新興国のグループを何というか。
    a: [BRICS, ブリックス]
    show: BRICS
