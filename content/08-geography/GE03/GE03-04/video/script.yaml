title: 経済格差
scenes:
  - board: whiteboard
    steps:
      - say: 「経済格差」です。なぜ、豊かな国と、貧しい国があるのでしょう。理由は、ひとつではありません。植民地にされた歴史、海に出やすいか、気候や資源といった地理の条件、そして、制度や教育の水準などが、からみ合っています。
        show:
          - { type: title, text: 豊かさのちがい }
          - { type: image, src: 1000002934.webp, at: [80, 120], w: 660 }
          - { type: text, at: [780, 150], w: 440, text: "色がこいほど GDP が大きい" }
          - type: list
            at: [780, 250]
            w: 440
            size: s
            items: ["植民地の歴史", "地理の条件（海・気候・資源）", "制度", "教育"]

  - board: whiteboard
    steps:
      - say: 資源があれば豊か、とも言えません。石油でうるおうはずのナイジェリアが、貧しさからぬけ出せないように、資源の収入が、一部の権力者に集まり、汚職や争いを生む、資源ののろい、という現象もあります。
        show:
          - { type: title, text: 資源ののろいと南北問題 }
          - { type: box, color: pink, w: 1100, title: 資源ののろい, text: "資源の収入が一部の権力者に集まり、汚職や争いを生む（ナイジェリアの石油）" }
      - say: 先進国と途上国の関係を、南北問題と呼びます。豊かな国が北半球に、貧しい国が南半球に多いことから来た呼び方です。でも、1970年代から80年代に急成長した、韓国、台湾、シンガポール、香港のアジアNIEsや、2000年代以降に成長した、ブラジル、ロシア、インド、中国、南アフリカのBRICSなどによって、南北の構図は、複雑になっています。
        read: 先進国と途上国の関係を、南北問題と呼びます。豊かな国が北半球に、貧しい国が南半球に多いことから来た呼び方です。でも、1970年代から80年代に急成長した、韓国、台湾、シンガポール、香港のアジアニーズや、2000年代以降に成長した、ブラジル、ロシア、インド、中国、南アフリカのブリックスなどによって、南北の構図は、複雑になっています。
        show:
          - { type: box, color: blue, w: 1100, title: 南北問題, text: "豊かな北・貧しい南 → アジアNIEs（韓国・台湾・シンガポール・香港）、BRICS の成長で複雑に" }
      - say: 日本は、資源のほとんどを輸入にたよりながら、ものづくりで付加価値をつけて輸出する形で、経済大国になりました。資源がなくても豊かになれる例として、よく挙げられます。
        show:
          - { type: box, color: green, w: 1100, text: "日本：資源を輸入し、ものづくりで価値をつけて輸出 → 資源がなくても豊かになれた例" }
