title: 日本の気候
scenes:
  - board: whiteboard
    steps:
      - say: 「日本の気候」です。日本は、南北に長く、山地も多いので、地域によって気候が大きくちがいます。沖縄と北海道以外は、温帯に入ります。
        show:
          - { type: title, text: 季節風のしくみ }
          - { type: text, text: "南北に長く山が多い → 地域で気候が大きくちがう（沖縄・北海道以外は温帯）" }
      - say: 気候を理解するうえで欠かせないのが、季節風、モンスーンのしくみです。大陸と海とでは、温まりやすさ、冷えやすさがちがいます。夏は、大陸のほうが早く温まるので、大陸の上の空気がのぼって低気圧になり、海から大陸へ、しめった風が吹きこみます。冬はその逆で、大陸から海へ、冷たく乾いた風が吹き出します。
        show:
          - { type: image, src: 1000002954.webp, at: [80, 240], w: 400 }
          - { type: text, at: [550, 250], w: 670, color: pink, text: "夏：大陸が早く温まる → 海から大陸へ **南東の湿った風**" }
          - { type: text, at: [550, 370], w: 670, color: blue, text: "冬：大陸が早く冷える → 大陸から海へ **北西の冷たい風**" }

  - board: whiteboard
    steps:
      - say: 夏の日本には、太平洋から南東の季節風が吹きこみ、温かくしめった空気が、たくさんの雨をもたらし、むし暑い夏になります。冬は、大陸から北西の季節風が吹き出します。乾いた冷たい風が、日本海を渡る間に水分を吸い上げ、山脈にぶつかって、日本海側に大雪を降らせます。山をこえた風は乾いて、太平洋側には、晴れた冬をもたらします。
        show:
          - { type: title, text: 冬の日本海側と太平洋側 }
          - { type: image, src: 1000002955.webp, at: [80, 115], w: 720 }
          - { type: box, at: [840, 140], w: 380, color: blue, text: "冬：日本海側は雪、太平洋側は晴れ" }
      - say: 梅雨は、太平洋からのしめった空気と、オホーツク海からの冷たい空気が、ぶつかって前線をつくり、長雨をもたらすものです。
        show:
          - { type: image, src: 1000002956.webp, at: [840, 300], w: 380 }

  - board: whiteboard
    steps:
      - say: 地域ごとの特徴です。岡山、広島、香川などの瀬戸内地方は、中国山地と四国山地にはさまれているので、冬の雪も、夏の雨もとどきにくく、一年を通して暖かく、晴れの日が多い気候です。北海道は、梅雨がほとんどなく、冷帯のため、夏でもすずしくすごしやすい気候です。沖縄と南西諸島は、亜熱帯の気候で、年平均気温がおよそ23度と高く、サンゴ礁が広がります。
        show:
          - { type: title, text: 地域ごとの気候 }
          - { type: box, color: yellow, w: 1100, title: 瀬戸内, text: "2つの山地にはさまれ、雪も雨もとどきにくい → 温暖で晴れが多い" }
          - { type: box, color: blue, w: 1100, title: 北海道, text: "冷帯。梅雨がほとんどなく、夏もすずしい" }
          - { type: box, color: pink, w: 1100, title: 沖縄・南西諸島, text: "亜熱帯。年平均 約23℃、サンゴ礁" }
