title: 日本列島の成り立ち
scenes:
  - board: slide
    steps:
      - say: 第8章、「日本の地形と自然」です。
        show:
          - { type: title, text: 第8章　日本の地形と自然 }
      - say: 日本列島の成り立ち、山や平野、川、そして日本の気候を学びます。
        show:
          - type: list
            items: ["日本列島の成り立ち", "日本の山地・平野・河川", "日本の気候"]
      - say: 地震や火山の多さ、雪国と晴れの国。日本の自然のくせを知ることは、防災にも、暮らしの知恵にもつながります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "日本の自然のしくみを知り、防災と暮らしに生かす" }

  - board: whiteboard
    steps:
      - say: 日本列島は、4つのプレートがぶつかり合う場所にあります。プレートが沈みこむ海溝のあたりには、地震が集中し、沈みこんだプレートがとけて、マグマになってふき出す場所に、火山ができます。
        show:
          - { type: title, text: 地震と火山の国 }
          - { type: image, src: 1000003153.webp, at: [80, 115], w: 1000 }
      - say: 日本には、およそ110の活火山があり、これは、世界全体のおよそ7パーセントにあたります。陸地の面積は、世界のわずか0.3パーセントほどなので、とても多いことがわかります。富士山も活火山で、最後の噴火は、1707年の宝永噴火です。
        show:
          - { type: box, at: [80, 560], w: 1100, color: pink, text: "活火山 約110（世界の約7％）。富士山も活火山（最後の噴火は1707年 **宝永噴火**）" }
