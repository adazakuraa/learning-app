title: 日本の交通と観光
scenes:
  - board: whiteboard
    steps:
      - say: 「日本の交通」です。日本の交通の基盤は、世界トップレベルです。新幹線は、1964年の東海道新幹線の開業をきっかけに、今では、北海道、東北、上越、北陸、東海道、山陽、九州、西九州の、各新幹線がのびていて、主な都市を、高速で結んでいます。
        show:
          - { type: title, text: 新幹線とトンネル・橋 }
          - { type: box, color: blue, w: 1100, title: 新幹線, text: "1964年 **東海道新幹線** から。今は北海道〜九州まで各地を高速で結ぶ" }
      - say: 本州と北海道を結ぶ、青函トンネルは、世界最長級の海底トンネルです。瀬戸内海をわたる、本州と四国の連絡橋は、3つのルートがあります。瀬戸大橋、明石海峡大橋、そして、しまなみ海道です。明石海峡大橋は、完成した1998年当時、つり橋として世界最長でした。
        show:
          - { type: box, color: green, w: 1100, title: 青函トンネル, text: "本州と北海道を結ぶ、世界最長級の海底トンネル" }
          - { type: box, color: yellow, w: 1100, title: 本州四国連絡橋, text: "瀬戸大橋・明石海峡大橋（完成時は世界最長のつり橋）・しまなみ海道" }
