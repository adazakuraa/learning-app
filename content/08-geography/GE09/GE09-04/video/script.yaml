title: 中国・四国・九州・沖縄
scenes:
  - board: whiteboard
    steps:
      - say: 「中国、四国、九州、沖縄」です。中国地方は、鳥取、島根、岡山、広島、山口の5県で、日本海側の山陰と、瀬戸内海側の山陽とで、気候が大きくちがいます。山陰は、冬に雪が多く、人口が少ない一方、山陽は、暖かく、工業や都市が発展しています。
        show:
          - { type: title, text: 中国・四国 }
          - { type: image, src: 1000002962.webp, at: [80, 115], w: 380 }
          - { type: box, at: [510, 140], w: 710, color: blue, title: 山陰（日本海側）, text: "冬に雪が多い。人口が少ない" }
          - { type: box, at: [510, 300], w: 710, color: pink, title: 山陽（瀬戸内海側）, text: "暖かい。工業・都市が発展" }
      - say: 瀬戸内海は、本州、四国、九州にかこまれた、おだやかな内海で、暖かく雨の少ない気候を生かして、みかんやレモンなどの、柑橘類の生産がさかんです。
        show:
          - { type: text, at: [510, 470], w: 710, color: yellow, text: "**瀬戸内海**：温暖少雨 → みかん・レモンなど柑橘類" }

  - board: whiteboard
    steps:
      - say: 九州は、福岡、佐賀、長崎、熊本、大分、宮崎、鹿児島の7県で、阿蘇山、桜島、雲仙岳など、活火山が多く、温泉も豊富です。熊本の阿蘇カルデラは、世界最大級のカルデラ、つまり、火山の活動でできた、巨大なくぼ地です。
        show:
          - { type: title, text: 九州と沖縄 }
          - { type: image, src: 1000002963.webp, at: [80, 115], w: 380 }
          - { type: box, at: [510, 140], w: 710, color: pink, title: 九州, text: "阿蘇山・桜島・雲仙岳など活火山が多く、温泉も豊富。阿蘇は世界最大級の **カルデラ**" }
      - say: 沖縄は、南西諸島からなる島の地域で、本土とはちがう、亜熱帯の気候と、独自の文化を持っています。かつては、琉球王国という独立した国で、三線、エイサー、泡盛、沖縄料理など、独自の文化が今も生きています。
        show:
          - { type: box, at: [510, 340], w: 710, color: green, title: 沖縄, text: "亜熱帯。かつての **琉球王国**。三線・エイサー・泡盛など独自の文化" }
