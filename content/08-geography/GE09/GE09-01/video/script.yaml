title: 北海道・東北
scenes:
  - board: whiteboard
    steps:
      - say: 「北海道と東北」です。北海道は、明治時代に、屯田兵と呼ばれる、農業もする兵士が送りこまれて、開拓が進められました。それより前は、アイヌ民族の土地でした。
        show:
          - { type: title, text: 北海道 }
          - { type: text, text: "明治時代に **屯田兵** が開拓。それ以前は **アイヌ民族** の土地" }
      - say: 広い平野と、すずしい気候を生かした、大規模な農業が特徴で、じゃがいも、小麦、砂糖の原料になるてんさい、玉ねぎの生産量は、全国1位です。
        show:
          - { type: box, color: yellow, w: 1100, text: "大規模農業：じゃがいも・小麦・てんさい・玉ねぎが全国1位" }

  - board: whiteboard
    steps:
      - say: 東北地方は、青森、岩手、宮城、秋田、山形、福島の6県で、日本の米どころです。北上川や最上川などが流れる、盆地や平野で、米づくりがさかんで、山形のさくらんぼ、青森のりんごなど、果物の栽培も発達しています。
        show:
          - { type: title, text: 東北地方 }
          - { type: image, src: 1000002957.webp, at: [80, 115], w: 440 }
          - { type: text, at: [570, 150], w: 650, text: "日本の米どころ（北上川・最上川の盆地・平野）" }
          - { type: text, at: [570, 250], w: 650, color: pink, text: "山形のさくらんぼ・青森のりんご" }
      - say: 三陸海岸は、親潮と黒潮がぶつかる、よい漁場で、かき、ほたて、わかめの養殖がさかんです。
        show:
          - { type: box, at: [570, 350], w: 650, color: blue, text: "**三陸海岸**：親潮と黒潮がぶつかる好漁場。かき・ほたて・わかめの養殖" }
