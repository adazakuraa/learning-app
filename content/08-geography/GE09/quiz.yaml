questions:
  - q: 明治時代、北海道の開拓と警備のために送り込まれた軍人農民を何というか。
    a: [屯田兵]
  - q: トヨタ自動車などがあり、日本最大の工業生産額をほこる工業地帯を何というか。
    a: [中京工業地帯]
  - q: 江戸時代、商業の中心として「天下の台所」と呼ばれた都市はどこか。
    a: [大阪]
  - q: 日本の食料自給率（カロリーベース）は約何%か。
    a: ['38', 38%, 約38%]
    show: 約38%
  - q: 原料を輸入し、製品にして輸出する日本の貿易のかたちを何というか。
    a: [加工貿易]
