title: 日本地図
scenes:
  - board: slide
    steps:
      - say: 第9章、「日本の地域と産業」です。
        show:
          - { type: title, text: 第9章　日本の地域と産業 }
      - say: 日本地図を確認したあと、北海道から沖縄まで地方ごとにめぐり、産業、交通、世界遺産を学びます。
        show:
          - type: list
            size: s
            items: ["日本地図", "北海道・東北", "関東・首都圏", "中部・近畿", "中国・四国・九州・沖縄", "日本の農業・工業・貿易", "日本の交通と観光", "日本の世界遺産"]
      - say: ふるさとや旅行先、ニュースに出てくる地名。日本の各地の個性を知ると、旅も、ニュースも、もっと楽しくなります。
        added: true
        show:
          - { type: box, at: [60, 470], color: yellow, w: 1000, title: この章の目的, text: "日本各地の個性と産業を知る" }

  - board: whiteboard
    steps:
      - say: まずは、日本地図で、都道府県の位置を確認しておきましょう。日本は、47の都道府県に分かれています。
        show:
          - { type: title, text: 日本の都道府県 }
          - { type: image, src: 1000002958.webp, at: [180, 115], w: 760 }

  - board: whiteboard
    steps:
      - say: こちらは、県庁所在地です。県の名前と、県庁所在地の名前がちがうものだけを、のせています。北海道は札幌市、宮城県は仙台市、神奈川県は横浜市、愛知県は名古屋市、兵庫県は神戸市、などです。
        show:
          - { type: title, text: 県名とちがう県庁所在地 }
          - { type: image, src: 1000002960.webp, at: [80, 115], w: 540 }
          - type: list
            at: [680, 150]
            size: s
            items: ["北海道 → 札幌市", "宮城県 → 仙台市", "神奈川県 → 横浜市", "愛知県 → 名古屋市", "兵庫県 → 神戸市", "沖縄県 → 那覇市"]
