title: 中部・近畿
scenes:
  - board: whiteboard
    steps:
      - say: 「中部と近畿」です。中部地方は、新潟、富山、石川、福井、山梨、長野、岐阜、静岡、愛知の9県で、さまざまな顔を持っています。
        show:
          - { type: title, text: 中部地方 }
      - say: 日本海側の北陸、富山、石川、福井は、雪の多い地域で、冬の雪が豊かな水をもたらし、水力発電や、米づくりの土台になっています。石川県の金沢は、江戸時代の加賀藩の城下町、加賀百万石として栄え、工芸や食文化が発展しました。
        show:
          - { type: box, color: blue, w: 1100, title: 北陸, text: "豪雪 → 豊かな水 → 水力発電・米づくり。金沢は「加賀百万石」の城下町" }
      - say: 長野と山梨は、内陸の盆地で、りんご、もも、ぶどうなどの果物づくりがさかんです。そして、愛知県を中心とする中京工業地帯は、日本で最も工業の生産額が大きい工業地帯です。トヨタ自動車を中心に、自動車産業が集まっています。
        show:
          - { type: box, color: green, w: 1100, title: 長野・山梨, text: "内陸の盆地。りんご・もも・ぶどう" }
          - { type: box, color: yellow, w: 1100, title: 中京工業地帯（愛知など）, text: "工業生産額が日本一。自動車産業が集まる" }

  - board: whiteboard
    steps:
      - say: 近畿地方は、大阪、京都、兵庫、奈良、滋賀、和歌山、三重で、古くから日本の中心だった地域です。大阪は、江戸時代から、天下の台所と呼ばれる、経済と商業の中心です。京都は、794年から千年以上、日本の都だった古い都で、神社や寺、伝統工芸、食文化など、日本の伝統文化が集まっています。
        show:
          - { type: title, text: 近畿地方 }
          - { type: image, src: 1000002961.webp, at: [80, 115], w: 460 }
          - { type: box, at: [590, 140], w: 630, color: pink, title: 大阪, text: "江戸時代から「**天下の台所**」。経済・商業の中心" }
          - { type: box, at: [590, 320], w: 630, color: yellow, title: 京都, text: "794年から千年以上の都。神社・寺・伝統工芸・食文化" }
