title: 情報源の評価
scenes:
  - board: slide
    steps:
      - say: 第5章、「情報を評価する」です。
        show:
          - { type: title, text: 第5章　情報を評価する }
      - say: 情報の出どころ、数字の読み方、ニュースの見方、そしてSNSの情報の広がり方を学びます。
        show:
          - type: list
            items: ["情報源の評価", "統計と数字の読み方", "メディアリテラシー", "SNSと情報の生態系"]
      - say: 毎日あびるほどの情報の中から、信頼できるものを選びとる力をつけましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "あふれる情報から、信頼できるものを選びとる力をつける" }

  - board: whiteboard
    steps:
      - say: 情報を評価するうえで、いちばん基本の問いは、だれが、何の根拠で、何の目的で、これを言っているのか、です。
        show:
          - { type: title, text: 一次情報と二次情報 }
          - { type: text, size: l, color: yellow, text: "だれが・何の根拠で・何の目的で？" }
      - say: 一次情報と、二次情報を区別しましょう。一次情報は、できごとの直接の記録や、当事者の発言、研究の元の論文です。二次情報は、それを、解釈したり、まとめたり、報道したりしたものです。
        show:
          - { type: box, color: green, w: 1100, title: 一次情報, text: "直接の記録・当事者の発言・研究の元の論文" }
          - { type: box, color: blue, w: 1100, title: 二次情報, text: "一次情報を解釈・要約・報道したもの" }
      - say: 二次情報が、一次情報を正しく伝えているとは、限りません。伝言ゲームのように、伝わるうちに、中身が変わってしまうことがあります。「研究によれば」という報道を見たら、できるだけ元の研究を確かめる習慣が大切です。
        show:
          - { type: text, color: gray, text: "伝言ゲームのように中身が変わることも → できるだけ一次情報にあたる" }

  - board: whiteboard
    steps:
      - say: 情報源の信頼性は、こんな観点で評価します。
        show:
          - { type: title, text: 信頼性のチェック }
      - say: 専門性。その分野の専門家か、その機関は信頼できるか。かたよりの可能性。利害関係や、考え方のかたよりはないか。根拠の透明性。証拠や出典が、示されているか。そして、検証。ほかの専門家によって、確かめられているか。
        show:
          - { type: text, color: green, text: "① **専門性**：その分野の専門家か？ 機関は信頼できるか？" }
          - { type: text, color: pink, text: "② **かたより**：利害関係や考え方のかたよりはないか？" }
          - { type: text, color: blue, text: "③ **透明性**：証拠・出典は示されているか？" }
          - { type: text, color: yellow, text: "④ **検証**：ほかの専門家に確かめられているか？（査読）" }
