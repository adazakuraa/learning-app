title: 統計と数字の読み方
scenes:
  - board: whiteboard
    steps:
      - say: 「統計と数字の読み方」です。数字は、客観的に見えるので、説得力があります。でも、背景を知らないと、正しく評価できません。
        show:
          - { type: title, text: 数と割合 }
      - say: 例えば、「A国では、B国の2倍の交通事故が起きている」。でも、A国の人口が、B国の3倍だったらどうでしょう。一人あたりで見ると、A国のほうが、事故は少ないことになります。
        show:
          - type: svg
            w: 1000
            h: 220
            markup: |
              <g stroke="none"><rect x="60" y="20" width="120" height="160" fill="#f4a3b8" fill-opacity="0.6"/><rect x="220" y="100" width="120" height="80" fill="#8fc4ff" fill-opacity="0.6"/>
              <rect x="560" y="113" width="120" height="67" fill="#f4a3b8" fill-opacity="0.6"/><rect x="720" y="80" width="120" height="100" fill="#8fc4ff" fill-opacity="0.6"/></g>
              <g stroke="none" font-size="22" text-anchor="middle"><text x="120" y="210" fill="#f4a3b8">A国</text><text x="280" y="210" fill="#8fc4ff">B国</text><text x="620" y="210" fill="#f4a3b8">A国</text><text x="780" y="210" fill="#8fc4ff">B国</text><text x="200" y="15" fill="currentColor">事故の数</text><text x="700" y="40" fill="currentColor">人口あたりの事故</text></g>
      - say: 数で比べるか、割合で比べるか。どちらがふさわしいかは、何を知りたいかによって決まります。
        show:
          - { type: box, color: yellow, w: 1000, text: "数（絶対数）で比べる？ 割合で比べる？ → 何を知りたいかで決まる" }

  - board: whiteboard
    steps:
      - say: アンケートや、世論調査の数字にも、注意が必要です。
        show:
          - { type: title, text: アンケートの読み方 }
      - say: 質問のしかたが、答えを誘導していることがあります。「子どもたちの未来を守るため、この政策に賛成しますか」と聞かれたら、賛成と答えやすくなりますね。
        show:
          - { type: box, color: pink, w: 1100, title: 質問のしかた, text: "「子どもたちの未来を守るため、賛成しますか？」→ 答えを誘導している" }
      - say: また、答えた人がかたよっていることもあります。インターネットの調査は、特定の人たちに、かたよりがちです。
        show:
          - { type: box, color: blue, w: 1100, title: 答えた人, text: "ネット調査は特定の人たちにかたよりがち" }
      - say: 何パーセントが支持、という数字を見たら、まず、どんな質問を、だれに、どんな方法で聞いたのかを、確かめましょう。
        show:
          - { type: text, color: yellow, text: "「〇〇％が支持」→ どんな質問を、だれに、どんな方法で？" }
