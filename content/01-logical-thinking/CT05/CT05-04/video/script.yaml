title: SNSと情報の生態系
scenes:
  - board: whiteboard
    steps:
      - say: 「SNSと情報」です。アメリカのマサチューセッツ工科大学、MITの研究で、ツイッターでは、うその情報、フェイクニュースが、本当のニュースよりも、およそ6倍速く、広く拡散することがわかりました。
        show:
          - { type: title, text: フェイクニュースの広がり }
          - { type: box, color: pink, w: 1100, text: "MITの研究：フェイクニュースは本当のニュースより **約6倍速く** 広がる" }
      - say: 理由のひとつは、めずらしさです。うそのほうが、おどろきがあります。もうひとつは、感情です。いかりや、こわさを引き起こす内容は、つい人に伝えたくなるのです。
        show:
          - { type: text, text: "理由① **めずらしさ**：うそのほうが「おどろき」がある" }
          - { type: text, text: "理由② **感情**：いかり・こわさを引き起こす → 伝えたくなる" }

  - board: whiteboard
    steps:
      - say: フェイクニュースにだまされない、基本の方法です。
        show:
          - { type: title, text: だまされないために }
      - say: ひとつ目。強い感情がわいたときほど、立ち止まる。シェアする前に、確かめましょう。ふたつ目。元の情報を確かめる。みっつ目。おたがいに独立した、いくつもの情報源で確かめる。
        show:
          - { type: box, color: yellow, w: 1100, title: ① 感情が強いほど立ち止まる, text: "シェアする前に確かめる" }
          - { type: box, color: green, w: 1100, title: ② 元の情報を確かめる, text: "だれが最初に言ったのか" }
          - { type: box, color: blue, w: 1100, title: ③ いくつもの情報源で確かめる, text: "おたがいに独立した情報源で" }
      - say: シェアのボタンを押す前の、数秒の確認が、うその情報を広げないための、いちばん確実なブレーキになります。
        added: true
        show:
          - { type: text, color: gray, text: "シェア前の数秒の確認 ＝ いちばん確実なブレーキ" }
