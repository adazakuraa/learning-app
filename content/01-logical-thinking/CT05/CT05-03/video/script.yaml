title: メディアリテラシー
scenes:
  - board: whiteboard
    steps:
      - say: 「メディアリテラシー」です。ニュースは、現実をそのまま伝えているのではありません。何を選び、どう解釈し、何を強調するかによって、現実についての、ひとつの物語をつくっています。
        show:
          - { type: title, text: ニュースは「選ばれた物語」 }
          - { type: text, text: "ニュース ＝ 選択・解釈・強調でつくられた「現実についての物語」" }
      - say: そもそも、何がニュースになるか、という判断自体に、かたよりがあります。対立、スキャンダル、めずらしいこと、有名人の話は、報道されやすい。一方、地道な制度の改善や、遠い国のききん、ゆっくりした進歩は、報道されにくいのです。
        show:
          - { type: box, color: pink, at: [80, 260], w: 540, title: 報道されやすい, text: "対立・スキャンダル・めずらしいこと・有名人" }
          - { type: box, color: blue, at: [660, 260], w: 540, title: 報道されにくい, text: "地道な改善・遠い国のききん・ゆっくりした進歩" }
      - say: 報道されていることが、大事なことだ、という思いこみは、まちがいなのです。
        show:
          - { type: text, at: [80, 480], color: yellow, text: "「報道されている ＝ 大事なこと」ではない" }

  - board: whiteboard
    steps:
      - say: 見出しにも注意が必要です。見出しと、本文の中身が、ずれていることがあります。
        show:
          - { type: title, text: 見出しのわな }
      - say: 「〇〇で健康リスクが増大」という見出しでも、読んでみると、増え方は統計的にごくわずかだったり、小さな研究ひとつの話だったりします。見出しだけで判断して、シェアされがちなSNSでは、特に問題になります。
        show:
          - { type: box, color: pink, w: 1100, text: "「〇〇で健康リスク増大」→ 読むと、ごくわずかな差・小さな研究ひとつ" }
      - say: また、論文に書いてあるからといって、正しいとは限りません。実験のやり方や、結論の出し方がまちがっていたり、対象が限られていたりすることがあります。
        show:
          - { type: text, color: gray, text: "論文にあるから正しい、とも限らない（方法・対象を確かめる）" }

  - board: whiteboard
    steps:
      - say: エコーチェンバーとは、同じ意見の人ばかりの中にいて、自分の考えが、こだまのように、強められていく状態です。
        added: true
        show:
          - { type: title, text: エコーチェンバーからぬけ出す }
          - { type: text, text: "**エコーチェンバー**：同じ意見ばかりにかこまれ、考えが強まっていく状態" }
      - say: ぬけ出すには、自分とちがう見方のメディアや、論者を、わざと定期的に読むことが有効です。読んで不快に感じるメディアを、ときどき読むことは、自分の視野を確かめることにつながります。
        show:
          - { type: box, color: green, w: 1100, text: "対策：ちがう見方のメディアをわざと読む。「不快に感じるもの」もときどき読む" }
