title: ロジカルシンキングとは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、ロジカルシンキングがどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: ロジカルシンキングとは
      - say: ロジカルシンキング（批判的思考）は、主張や情報を、根拠と論理にもとづいて評価し、自分の頭で筋道を立てて考えるための技術です。
        show:
          - type: box
            w: 1100
            text: ロジカルシンキング（批判的思考）は、主張や情報を、根拠と論理にもとづいて評価し、自分の頭で筋道を立てて考えるための技術です。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で7章です。第1章は批判的思考、第2章は論理の基本、第3章は誤謬、第4章は認知バイアスと自己批判、第5章は情報を評価する、第6章は議論を分析・評価する、第7章は実践的な批判的思考。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　批判的思考
              - 第2章　論理の基本
              - 第3章　誤謬
              - 第4章　認知バイアスと自己批判
              - 第5章　情報を評価する
              - 第6章　議論を分析・評価する
              - 第7章　実践的な批判的思考
            at:
              - 80
              - 150
  - board: whiteboard
    steps:
      - say: では、ロジカルシンキングを学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、だまされにくくなる。ネットのうわさ、広告、もっともらしい統計。主張と根拠を分けて見るくせがつくと、根拠の弱い話に気づけます。
        show:
          - type: box
            w: 1100
            text: |-
              **だまされにくくなる**
              ネットのうわさ、広告、もっともらしい統計。主張と根拠を分けて見るくせがつくと、根拠の弱い話に気づけます。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、自分の思い込みに気づける。人は誰でも、信じたいことを信じる傾向（認知バイアス）を持っています。仕組みを知ると、自分の判断を見直せます。
        show:
          - type: box
            w: 1100
            text: |-
              **自分の思い込みに気づける**
              人は誰でも、信じたいことを信じる傾向（認知バイアス）を持っています。仕組みを知ると、自分の判断を見直せます。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、話し合いが前に進む。相手の主張を正しく理解し、どこで意見が分かれているかを整理できると、議論が感情的なぶつかり合いになりにくくなります。
        show:
          - type: box
            w: 1100
            text: |-
              **話し合いが前に進む**
              相手の主張を正しく理解し、どこで意見が分かれているかを整理できると、議論が感情的なぶつかり合いになりにくくなります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、ニュースやSNSの情報を見るとき、仕事で提案したり、反論したりするとき、大きな買い物や進路など、重要な決断をするとき、などに役立ちます。
        read: たとえば、ニュースやエスエヌエスの情報を見るとき、仕事で提案したり、反論したりするとき、大きな買い物や進路など、重要な決断をするとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - ニュースやSNSの情報を見るとき
              - 仕事で提案したり、反論したりするとき
              - 大きな買い物や進路など、重要な決断をするとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、用語を覚えるより、身近な例に当てはめて考えてみる。そして、自分の意見にも同じ物差しを当てる。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・用語を覚えるより、**身近な例に当てはめて**考えてみる
              ・自分の意見にも同じ物差しを当てる
            color: pink
            at:
              - 80
              - 420
