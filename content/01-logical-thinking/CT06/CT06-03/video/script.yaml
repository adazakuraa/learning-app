title: 議論の強さを評価する
scenes:
  - board: whiteboard
    steps:
      - say: 「議論の強さを評価する」です。根拠が、主張をどれだけ支えているかを評価するのが、議論の強さの評価です。
        show:
          - { type: title, text: 反証を考える }
      - say: まず、反証の可能性を考えます。もし、自分の主張がまちがっているなら、どんな証拠が見つかるはずか。これを考えることが、科学的な、批判的思考の基本です。
        show:
          - { type: box, color: yellow, w: 1100, text: "「もし主張がまちがいなら、どんな証拠が見つかるはず？」" }

  - board: whiteboard
    steps:
      - say: 次に、ほかの説明を考えます。AとBに関係が見られたとき、ほかの説明はないか、と問います。
        show:
          - { type: title, text: ほかの説明はないか }
      - say: BはAではなく、Cが原因ではないか。AもBも、Dが原因ではないか。ただの偶然ではないか。こうしたほかの説明を、積極的に考えます。ほかの説明をすべて退けられて、はじめて、AがBの原因だ、と言えるのです。
        show:
          - type: list
            items: ["B の原因は A ではなく C では？", "A も B も、D が原因では？（第三の原因）", "ただの偶然では？"]
          - { type: box, at: [80, 400], w: 1100, color: green, text: "ほかの説明をすべて退けられて、はじめて「A が B の原因」と言える" }

  - board: whiteboard
    steps:
      - say: そして、証拠がないことは、ないことの証拠ではありません。
        show:
          - { type: title, text: 証拠がない ≠ ない }
      - say: 「〇〇の証拠がない。だから〇〇はない」は、まちがいです。ただ証拠が見つかっていない、見つけるのがむずかしい、という可能性があります。
        show:
          - { type: box, color: pink, w: 1100, text: "「証拠がない。だからない」は × → まだ見つかっていないだけかもしれない" }
      - say: 深海の生き物も、見つかる前から、ずっと深海にいたのです。
        added: true
        show:
          - { type: text, color: gray, text: "深海の生き物も、発見される前からずっといた" }
