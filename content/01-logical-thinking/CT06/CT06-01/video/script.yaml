title: 主張を特定する
scenes:
  - board: slide
    steps:
      - say: 第6章、「議論を分析・評価する」です。
        show:
          - { type: title, text: 第6章　議論を分析・評価する }
      - say: 議論を、主張、前提、強さという3つの面から、分解して評価する方法を学びます。
        show:
          - type: list
            items: ["主張を特定する", "前提を明示化する", "議論の強さを評価する"]
      - say: 会議でも、ニュースでも、家族の話し合いでも、議論を分解できると、すれちがいの原因が見えてきます。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "議論を分解し、すれちがいの原因を見つけられるようにする" }

  - board: whiteboard
    steps:
      - say: 議論を評価するには、まず、何が主張されているのかを、正確につかむことが必要です。これは、思ったよりむずかしい作業です。
        show:
          - { type: title, text: かくれた主張 }
      - say: 多くの議論では、主張が、はっきり言われるより、前提として、かくれています。「最近の若者は、礼儀がない」という発言には、「昔の若者には、礼儀があった」という、かくれた比較がふくまれています。
        show:
          - { type: text, text: "「最近の若者は礼儀がない」" }
          - { type: text, color: yellow, text: "→ かくれた主張：「昔の若者には礼儀があった」（本当？）" }

  - board: whiteboard
    steps:
      - say: 主張の種類を、区別しましょう。種類によって、評価の物差しがちがいます。
        show:
          - { type: title, text: 主張の3つの種類 }
      - say: 事実の主張、例えば、東京の人口は1400万人だ。これは、証拠で評価します。価値の主張、例えば、この歌手には才能がある。これは、何をもって才能とするか、基準をはっきりさせて評価します。政策の主張、例えば、消費税を上げるべきだ。これは、事実、価値、実行できるか、を合わせて評価します。
        show:
          - { type: box, color: blue, w: 1100, title: 事実の主張, text: "「東京の人口は1400万人だ」→ 証拠で評価" }
          - { type: box, color: pink, w: 1100, title: 価値の主張, text: "「この歌手は才能がある」→ 基準をはっきりさせて評価" }
          - { type: box, color: green, w: 1100, title: 政策の主張, text: "「消費税を上げるべきだ」→ 事実・価値・実行可能性を合わせて評価" }

  - board: whiteboard
    steps:
      - say: 主張を、正確に言いかえる習慣が役に立ちます。「あなたが言っているのは、〇〇ということですか」と確かめると、誤解を防げます。自分の主張を、一文で言いかえる練習も、考えをはっきりさせます。
        show:
          - { type: title, text: 言いかえと限定 }
          - { type: box, color: yellow, w: 1100, text: "「あなたが言っているのは〇〇ということですか？」と確かめる" }
      - say: そして、言いすぎに注意しましょう。「〇〇な人は〇〇だ」「いつも〇〇する」という言い方は、一般化のしすぎかもしれません。「いくつかの場合に」「傾向として」「一部の人が」と、限定した言い方に変えると、確かめられる主張になります。
        show:
          - { type: text, color: pink, text: "×「〇〇な人は〇〇だ」「いつも〇〇する」" }
          - { type: text, color: green, text: "○「傾向として」「一部の人が」「いくつかの場合に」" }
