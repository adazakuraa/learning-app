title: 批判的思考の定義と目的
scenes:
  - board: slide
    steps:
      - say: 論理的思考の最初の章、「批判的思考」です。
        show:
          - { type: title, text: 第1章　批判的思考 }
      - say: 批判的思考とは何か。そして、よい論証とはどういうものかを学びます。
        show:
          - type: list
            items: ["批判的思考の定義と目的", "良い論証とは何か"]
      - say: ネットのうわさ、広告、ニュース、そして自分の思いこみ。あふれる情報にふり回されず、自分の頭で考えるための、土台になる考え方です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "情報にふり回されず、自分の頭で考えるための土台をつくる" }

  - board: whiteboard
    steps:
      - say: 批判的思考という言葉には、誤解があります。批判的思考は、批判する、反対する、文句を言う、ということではありません。
        show:
          - { type: title, text: 批判的思考とは }
          - { type: text, color: pink, text: "× 批判する・反対する・文句を言う" }
      - say: 主張や推論を、根拠と論理にもとづいて、評価する考え方のことです。
        show:
          - { type: box, color: green, w: 1100, text: "○ 主張や推論を、**根拠** と **論理** にもとづいて評価する考え方" }
      - say: たとえば、「この健康食品で必ずやせる」という広告を見たとき、すぐ信じるのでも、頭ごなしに否定するのでもなく、本当かな、根拠は何だろう、と一度立ち止まって考える。それが批判的思考です。
        added: true
        show:
          - { type: text, color: gray, text: "例：「必ずやせる」広告 → 信じこむでも否定するでもなく「根拠は？」と立ち止まる" }

  - board: whiteboard
    steps:
      - say: 批判的思考の中心は、問いを立てることです。
        show:
          - { type: title, text: 問いを立てる }
      - say: これは本当か。根拠は何か。ほかの見方はないか。だれが言っているのか。そして、自分はなぜそう思うのか。こうした問いを、他人の考えにも、自分の考えにも向けます。
        show:
          - type: list
            items: ["これは本当か？", "根拠は何か？", "ほかの見方はないか？", "だれが言っているのか？", "自分はなぜそう思うのか？"]
          - { type: box, at: [700, 200], w: 500, color: yellow, text: "他人の考えにも、**自分の考えにも** 向ける" }

  - board: whiteboard
    steps:
      - say: 大事な点が2つあります。
        show:
          - { type: title, text: 大事な2つのポイント }
      - say: ひとつ目。批判的思考は、感情や直感を、捨てることではありません。感情は、大切な情報をふくんでいます。目的は、感情が考えをゆがめていないかに、気づくことです。
        show:
          - { type: box, color: blue, w: 1100, title: ① 感情を捨てるのではない, text: "感情は大切な情報。感情が考えをゆがめていないかに気づくことが目的" }
      - say: ふたつ目。批判的思考は、正しい答えを出すことより、よりよい問いを立て、よりていねいに考える、その過程に価値があります。
        show:
          - { type: box, color: green, w: 1100, title: ② 答えより過程, text: "よりよい問いを立て、よりていねいに考える過程に価値がある" }
