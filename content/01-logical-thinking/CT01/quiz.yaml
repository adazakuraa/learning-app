questions:
  - q: 「主張や推論を、根拠・論理に基づいて評価する思考プロセス」を何というでしょう？
    a: [批判的思考, クリティカルシンキング]
    explain: 「批判する・反対する」ことではない。
  - q: 「主張」と、それを支える「根拠」から成るものを何というでしょう？
    a: [論証]
  - q: 「すべての人間はいつか死ぬ」「ソクラテスは人間である」「ゆえにソクラテスはいつか死ぬ」。このような推論の形を何というでしょう？
    a: [三段論法]
  - q: 論証を評価する2つの軸は「論理が妥当か」と、もう1つは何でしょう？
    a: [根拠が正しいか, 根拠が実際に正しいか, 根拠が真か, 前提が正しいか]
    show: 根拠が実際に正しいか
