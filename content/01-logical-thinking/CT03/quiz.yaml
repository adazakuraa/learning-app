questions:
  - q: 論理や推論における間違い・エラーのことを何というか。
    a: [誤謬]
  - q: 相手の主張を実際より弱い・極端な形に歪めて攻撃する誤謬を何というか。
    a: [藁人形論法, わら人形論法, ストローマン]
    show: 藁人形論法
  - q: 実際には複数の選択肢があるのに「AかBか」に限定してしまう誤謬を何というか。
    a: [虚偽の二分法, 誤った二分法]
    show: 虚偽の二分法
  - q: 「気温が高いほど水難事故が増える」のように、第三の要因によって見かけ上の関係が生まれるものを何というか。
    a: [疑似相関, 擬似相関, 見せかけの相関]
    show: 疑似相関
    explain: 「相関は因果を意味しない」は統計の最重要原則。
  - q: 成功した例・生き残った例だけを見て一般化してしまう偏りを何というか。
    a: [生存者バイアス]
