title: 非形式的誤謬②
scenes:
  - board: whiteboard
    steps:
      - say: 非形式的誤謬の、続きです。循環論法は、証明したいことを、前提として使ってしまう誤りです。
        show:
          - { type: title, text: 循環論法・誤った二分法 }
      - say: 例えば、「この本に書いてあることは正しい。なぜなら、この本に、そう書いてあるからだ」。前提と結論が、同じ中身になっていて、何も証明していません。
        show:
          - { type: box, color: pink, w: 1100, title: 循環論法, text: "「この本は正しい。なぜなら、この本にそう書いてあるから」→ 前提 ＝ 結論" }
      - say: 誤った二分法は、本当はたくさんの選択肢があるのに、AかBかの、2つにしぼってしまう誤りです。「この政策に賛成しないなら、国を愛していないのか」。賛成しない理由は、ほかにいくらでもありますね。
        show:
          - { type: box, color: blue, w: 1100, title: 誤った二分法, text: "「賛成しないなら、国を愛していないのか」→ 選択肢は2つだけではない" }

  - board: whiteboard
    steps:
      - say: すべり坂論法は、Aを認めたら、Bになり、BはCになり、と、連鎖して、最後には悪い結果になる、と主張するのに、それぞれのステップが、本当に起きるのかを示さない誤りです。
        show:
          - { type: title, text: すべり坂論法 }
          - type: svg
            w: 1100
            h: 220
            markup: |
              <path d="M20 30 L1060 200" stroke="#9aa3ad"/>
              <g stroke="#f3d77a"><circle cx="120" cy="46" r="26"/><circle cx="400" cy="92" r="26"/><circle cx="680" cy="138" r="26"/></g><circle cx="960" cy="184" r="26" stroke="#f4a3b8"/>
              <g stroke="none" font-size="26" text-anchor="middle"><text x="120" y="55" fill="#f3d77a">A</text><text x="400" y="101" fill="#f3d77a">B</text><text x="680" y="147" fill="#f3d77a">C</text><text x="960" y="193" fill="#f4a3b8">！</text><text x="540" y="40" fill="#9aa3ad">本当にそうなる？</text></g>
      - say: 「スマホを1台買い与えたら、ゲームばかりして、勉強しなくなり、学校をやめて、人生がだめになる」。一つひとつの矢印が、本当に起こるのか、確かめる必要があります。
        show:
          - { type: box, color: yellow, w: 1100, text: "例：「スマホを与えたら → 勉強しない → 退学 → 人生が終わる」→ 各ステップの根拠は？" }

  - board: whiteboard
    steps:
      - say: 誤った原因の推定。Aのあとに、Bが起きた。だからAが、Bの原因だ、という誤りです。時間の前後関係を、原因と結果の関係と、取りちがえています。
        show:
          - { type: title, text: 誤った原因の推定 }
          - { type: box, color: pink, w: 1100, text: "「Aのあとに Bが起きた。だから Aが原因」→ 前後関係 ≠ 因果関係" }
      - say: 例えば、「ワクチンを打ったあとに、子どもが自閉症と診断された。だから、ワクチンが原因だ」。自閉症は、ワクチンを打つ年ごろに、気づかれやすい、という時期の重なりがあるだけで、大規模な研究では、因果関係は否定されています。
        added: true
        show:
          - { type: text, text: "例：「ワクチンのあとに自閉症と診断 → ワクチンが原因」" }
          - { type: text, size: s, color: gray, text: "気づかれやすい時期が重なっただけ。大規模な研究で因果関係は否定されている" }
      - say: 雨ごいをしたら雨が降った、というのも同じですね。雨ごいをしなくても、雨はいずれ降ったかもしれないのです。
        added: true
        show:
          - { type: text, color: gray, text: "雨ごいのあとに雨 → 雨ごいの効果？" }
