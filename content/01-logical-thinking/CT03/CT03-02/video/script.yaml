title: 非形式的誤謬①
scenes:
  - board: whiteboard
    steps:
      - say: 非形式的誤謬は、論理の形ではなく、中身や、文脈、前提の問題で生まれるまちがいです。まずは、根拠が、主張と関係していない、というタイプを見ていきます。
        show:
          - { type: title, text: 非形式的誤謬 }
          - { type: text, text: "**非形式的誤謬** ＝ 中身・文脈・前提の問題で生まれるまちがい" }

  - board: whiteboard
    steps:
      - say: 人身攻撃。「あの人は信用できない人物だ。だから、その主張はまちがいだ」。話す人の信頼性は、ひとつの手がかりにはなりますが、主張が正しいかどうかは、その人の人柄とは、別の問題です。
        show:
          - { type: title, text: 人身攻撃・権威への訴え }
          - { type: box, color: pink, w: 1100, title: 人身攻撃, text: "「あの人は信用できない。だから主張はまちがい」→ 主張の正しさは人柄とは別" }
      - say: 権威への訴え。「専門家がそう言っている」だけで、主張を正しいとすること。専門家の意見は、大事な証拠です。でも、専門家もまちがえますし、専門家どうしで、意見が分かれていることもあります。
        show:
          - { type: box, color: blue, w: 1100, title: 権威への訴え, text: "「専門家が言っている」だけで正しいとする → 専門家もまちがえる・意見が分かれることも" }

  - board: whiteboard
    steps:
      - say: 感情への訴え。こわさや、いかりをあおって、論理的な根拠なしに、主張を受け入れさせることです。感情は、道徳の判断には大切ですが、根拠の代わりには、なりません。
        show:
          - { type: title, text: 感情・わら人形・多数 }
          - { type: box, color: yellow, w: 1100, title: 感情への訴え, text: "こわさ・いかりをあおって受け入れさせる → 感情は根拠の代わりにならない" }
      - say: わら人形論法。相手の主張を、実際より弱く、極端な形にゆがめて、攻撃することです。「移民の受け入れを制限すべきだという人は、移民がきらいな排外主義者だ」のような、単純化がその例です。本物の相手ではなく、自分で作ったわら人形をたたいているのです。
        show:
          - { type: box, color: pink, w: 1100, title: わら人形論法, text: "相手の主張をゆがめて、弱い形にしてから攻撃する" }
      - say: 多数への訴え。「みんなそう思っている」で、正しいとすること。多数決で、真実が決まるわけではありません。かつては、みんなが、太陽が地球のまわりを回っていると、信じていましたね。
        show:
          - { type: box, color: green, w: 1100, title: 多数への訴え, text: "「みんなそう思っている」→ 多数決で真実は決まらない（天動説も多数派だった）" }
