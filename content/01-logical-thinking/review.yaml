questions:
  - {u: CT01-01, p: 70, q: "主張や推論を、根拠と論理にもとづいて評価する思考を何というでしょう？", a: [批判的思考, クリティカルシンキング]}
  - {u: CT01-02, p: 60, q: "「主張」とそれを支える「根拠」から成るもので、三段論法もその一つの形であるものを何というでしょう？", a: [論証]}
  - {u: CT02-01, p: 65, q: "「すべての人は死ぬ。ソクラテスは人だ。ゆえにソクラテスは死ぬ」のように、前提が真なら結論も必ず真になる推論を何というでしょう？", a: [演繹, 演繹的推論, 演繹法]}
  - {u: CT02-01, p: 60, q: "結論が確率的にしか支持されず、科学の多くが使う、観察した事例から一般的な結論を導く推論を何というでしょう？", a: [帰納, 帰納的推論, 帰納法]}
  - {u: CT02-02, p: 45, q: "地面が濡れているのを見て「夜に雨が降った」と考えるように、事実を最もよく説明できる仮説を選ぶ推論を何というでしょう？", a: [アブダクション]}
  - {u: CT03-01, p: 50, q: "「雨なら地面が濡れる。地面が濡れている。ゆえに雨だ」のように、論理の形そのものが誤っている誤謬を何というでしょう？", a: [形式的誤謬]}
  - {u: CT03-02, p: 55, q: "「移民規制派は排外主義者だ」のように、相手の主張を極端に歪めてから攻撃する誤謬を何というでしょう？", a: [藁人形論法, わら人形論法, ストローマン]}
  - {u: CT03-03, p: 50, q: "「Aを認めるとBになり、Bを認めるとCになり…」と、根拠を示さずに最悪の結果まで連鎖させる誤謬を何というでしょう？", a: [滑り坂論法, すべり坂論法]}
  - {u: CT03-04, p: 55, q: "成功した人や生き残った例ばかりを観察して一般化してしまう偏りを何というでしょう？", a: [生存者バイアス]}
  - {u: CT03-04, p: 60, q: "「気温が高いほど水難事故が増える」のように、第三の要因によって生まれる見かけの相関を何というでしょう？", a: [疑似相関, 擬似相関]}
  - {u: CT04-01, p: 60, q: "自分の信念を支持する情報を重視し、反する情報を軽視してしまう傾向を何というでしょう？", a: [確証バイアス]}
  - {u: CT04-03, p: 50, q: "本人は誠実なつもりでも、望む結論を先に決めて、それに合う根拠を集めてしまう推論を何というでしょう？", a: [動機づけられた推論, 動機付けられた推論]}
  - {u: CT05-01, p: 55, q: "研究の原論文や当事者の発言のように、出来事を直接記録した情報を何というでしょう？", a: [一次情報]}
  - {u: CT05-03, p: 55, q: "自分と似た意見ばかりが返ってくる、閉じた情報環境を何というでしょう？", a: [エコーチェンバー]}
  - {u: CT05-04, p: 40, q: "MITの研究で、フェイクニュースは真のニュースより約何倍速く広がるとされたでしょう？", a: ['6', 6倍, 約6倍]}
  - {u: CT06-02, p: 50, q: "「ビジネスで成功した、だから良い市長になる」という議論に潜む、「当然そうだ」とされている見えない前提を何というでしょう？", a: [隠れた前提, 暗黙の前提]}
  - {u: CT07-01, p: 45, q: "相手の主張を弱く歪める藁人形の反対で、相手の立場の最強の議論を考えてみる実践を何というでしょう？", a: [スティールマン]}
  - {u: CT07-02, p: 50, q: "「わからない」「間違っているかもしれない」と言える、自分の知識の限界を認める姿勢を何というでしょう？", a: [知的謙虚さ]}
