title: 批判的思考と人間関係
scenes:
  - board: whiteboard
    steps:
      - say: 最後は、「批判的思考と人間関係」です。批判的思考の知識を持つと、相手の論理のまちがいを、指摘したくなりがちです。でも、それは、いちばん役に立たない使い方のひとつです。
        show:
          - { type: title, text: 論破は役に立たない }
          - { type: text, color: pink, text: "相手のまちがいを指摘したくなる → いちばん役に立たない使い方" }
      - say: 批判的思考の目的は、真実を求めることで、議論に勝つことではありません。逆に、自分が批判的な問いを向けられても、それは、自分を否定したり、言い負かそうとしたりしている、とは限りません。
        show:
          - { type: box, color: green, w: 1100, text: "目的は真実を求めること。議論に勝つことではない" }
      - say: 相手のまちがいを指摘して論破しても、相手の考えは変わるどころか、身構えて、かえって変わりにくくなります。人は、論理で反論できないと感じても、感情では、受け入れられないからです。
        show:
          - { type: box, color: yellow, w: 1100, text: "論破 → 相手は身構え、かえって考えを変えにくくなる（感情では受け入れられない）" }

  - board: whiteboard
    steps:
      - say: そして、批判的思考は、自分に向けることが、いちばん大切です。他人のまちがいより、自分の考えのまちがいを見つけるほうが、ずっとむずかしく、価値があります。
        show:
          - { type: title, text: まず自分に向ける }
          - { type: box, color: blue, w: 1100, text: "批判的思考は、まず自分に向ける。それがいちばんむずかしく、価値がある" }
      - say: 問いを立て、根拠をたしかめ、自分の考えを見直し、相手の考えにも敬意を持つ。そうした習慣が、よりよい判断と、よりよい人間関係につながります。これで、論理的思考はおしまいです。おつかれさまでした。
        added: true
        show:
          - { type: text, color: yellow, text: "問いを立てる・根拠を確かめる・自分を見直す・相手に敬意を" }
