title: 自分の意見を批判的に検討する
scenes:
  - board: slide
    steps:
      - say: 論理的思考の最後の章、「実践的な批判的思考」です。
        show:
          - { type: title, text: 第7章　実践的な批判的思考 }
      - say: 学んだことを、自分の意見、不確かな判断、そして人間関係に、どう生かすかを考えます。
        show:
          - type: list
            items: ["自分の意見を批判的に検討する", "不確実性と判断", "批判的思考と人間関係"]
      - say: 批判的思考は、知っているだけでは意味がありません。毎日の考え方と、人とのつきあい方に生かしてこそ、力になります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "批判的思考を、毎日の判断と人間関係に生かす" }

  - board: whiteboard
    steps:
      - say: 批判的思考の、最も大切な実践のひとつが、自分の意見を、自分で批判的に見直すことです。
        show:
          - { type: title, text: スティールマン }
      - say: スティールマンは、相手の、いちばん強い議論を考える、という実践です。もし自分が反対の立場だったら、いちばん強い議論は何か、を誠実に考えます。前に学んだ、相手を弱く見せる、わら人形論法の、ちょうど逆ですね。
        show:
          - { type: box, color: yellow, w: 1100, text: "**スティールマン**：相手のいちばん強い議論を考える（わら人形論法の逆）" }
      - say: これは、相手に同意することではありません。反対の立場の、いちばん強い議論を理解したうえで、それでも自分の主張が正しいかを、問うのです。これができる人は、相手から信頼され、議論も中身のあるものになります。
        show:
          - { type: text, text: "同意ではない。最強の反論を理解したうえで、自分の主張を問い直す" }

  - board: whiteboard
    steps:
      - say: 自分への問いかけとして、役に立つものがあります。
        show:
          - { type: title, text: 自分への問いかけ }
      - say: この意見を信じるようになったのは、なぜか。習慣や、環境、感情的な体験のせいではないか。そして、この意見がまちがっているとしたら、どんな証拠があるはずか。
        show:
          - { type: text, color: blue, text: "「この意見を信じるようになったのはなぜ？」（習慣・環境・感情のせいでは？）" }
          - { type: text, color: green, text: "「まちがっているとしたら、どんな証拠があるはず？」" }
      - say: 意見を変えることは、はずかしいことではありません。新しい証拠や議論に、誠実に応えている証拠です。この考え方こそが、批判的思考の土台です。
        show:
          - { type: box, color: yellow, w: 1100, text: "意見を変えるのは恥ではなく、新しい証拠に誠実に応えた証拠" }
