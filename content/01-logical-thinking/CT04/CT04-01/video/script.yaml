title: 自分の思考を疑う
scenes:
  - board: slide
    steps:
      - say: 第4章、「認知バイアスと自己批判」です。
        show:
          - { type: title, text: 第4章　認知バイアスと自己批判 }
      - say: 他人ではなく、自分の考えのくせに目を向けます。
        show:
          - type: list
            items: ["自分の思考を疑う", "感情と思考の関係", "動機づけられた推論"]
      - say: 批判的思考で、いちばんむずかしいのは、他人の議論を評価することではなく、自分自身の考えを、批判的に見ることです。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "自分の考えのくせ（バイアス）に気づけるようになる" }

  - board: whiteboard
    steps:
      - say: 確証バイアスは、自分がすでに信じていることを、支える証拠ばかりを重く見て、反する証拠を、軽く見てしまう傾向です。
        show:
          - { type: title, text: 確証バイアス }
          - { type: box, color: yellow, w: 1100, text: "**確証バイアス**：信じていることを支える証拠ばかり重く見る" }
      - say: これは、わざとではなく、自動的に起こります。信じたいから信じる、というより、信じているから、関係する情報が目に入りやすく、大事に見える、というしくみです。
        show:
          - { type: text, text: "わざとではない：信じている → その情報が目に入りやすい・大事に見える" }
      - say: 例えば、血液型占いを信じていると、当たったときの記憶ばかりが残り、外れたことは、忘れてしまいます。
        added: true
        show:
          - { type: text, color: gray, text: "例：占いを信じていると、当たったことばかり覚えている" }

  - board: whiteboard
    steps:
      - say: 後知恵バイアスは、結果を知ったあとで、最初からそうなると思っていた、と感じる傾向です。「あの経済危機が来るのは、明らかだった」というような感覚です。
        show:
          - { type: title, text: 後知恵バイアス・過信効果 }
          - { type: box, color: blue, w: 1100, title: 後知恵バイアス, text: "結果を知ったあとで「最初からわかっていた」と感じる" }
      - say: 過信効果は、自分の判断や知識、予測する力を、実際より高く見つもる傾向です。自分は正しく判断できる、という確信は、批判的思考の、最大のかべのひとつです。
        show:
          - { type: box, color: pink, w: 1100, title: 過信効果, text: "自分の判断・知識・予測力を高く見つもりすぎる" }
      - say: これらのバイアスは、完全にはなくせません。でも、バイアスを知っておき、今、何かのバイアスが働いていないか、と自分に問いかけることで、影響を小さくできます。
        show:
          - { type: text, color: yellow, text: "対策：バイアスを知り、「今、働いていないか？」と問いかける" }
