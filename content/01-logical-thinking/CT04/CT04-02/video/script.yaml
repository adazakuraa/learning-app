title: 感情と思考の関係
scenes:
  - board: whiteboard
    steps:
      - say: 「感情と思考の関係」です。感情を捨てて、論理的に考えろ、というアドバイスをよく聞きますが、これは、半分まちがいです。感情は考えをゆがめますが、完全に取りのぞくべきでもないのです。
        show:
          - { type: title, text: 感情は必要な情報 }
          - { type: text, color: pink, text: "「感情を捨てて論理的に」は半分まちがい" }
      - say: ある研究では、感情を処理する脳の部分が傷ついた患者が、論理的な推論は完ぺきにできるのに、日常の決断が、極端に苦手になりました。お昼に何を食べるかさえ、決められなくなったのです。
        show:
          - { type: box, color: blue, w: 1100, text: "感情の脳の部分が傷ついた患者：論理は完ぺき、でも日常の決断ができなくなった" }
      - say: これは大事なことだ、これはいやだ、という感情の反応がないと、何が大事かを判断することが、むずかしいのです。感情は、決断に必要な情報を、くれているのです。
        show:
          - { type: text, color: yellow, text: "感情 ＝ 「何が大事か」を教えてくれる情報" }

  - board: whiteboard
    steps:
      - say: 批判的思考での、感情とのつきあい方は、感情を捨てることではなく、感情の影響に、気づくことです。
        show:
          - { type: title, text: 感情の影響に気づく }
          - { type: box, color: green, w: 1100, text: "感情を捨てるのではなく、**感情の影響に気づく**" }
      - say: 「今、怒っているから、相手の意見を、不当に低く見ていないか」。「今、不安だから、危険を大きく見つもりすぎていないか」。こうした問いかけが、役に立ちます。
        show:
          - { type: text, text: "「怒っているから、相手の意見を低く見ていないか？」" }
          - { type: text, text: "「不安だから、危険を大きく見つもっていないか？」" }
      - say: 特に、強いいかりや、こわさを感じたときこそ、その感情が判断をゆがめているかもしれない、と意識しましょう。一晩おいてから返事をする、というのも、昔からの知恵ですね。
        show:
          - { type: text, color: gray, text: "強い感情のときこそ要注意（一晩おいてから返事をする）" }
