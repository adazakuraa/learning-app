questions:
  - q: 自分の信念を支持する証拠を重視し、反する証拠を軽視する傾向を何というでしょう？
    a: [確証バイアス]
  - q: 結果を知った後で「最初からそうなると思っていた」と感じる傾向を何というでしょう？
    a: [後知恵バイアス]
  - q: 自分の判断・知識・予測能力を過大評価する傾向を何というでしょう？
    a: [過信効果, 過信バイアス]
    show: 過信効果
  - q: 「結論を先に決めて、それを支持する根拠を探す」推論パターンを何というでしょう？
    a: [動機づけられた推論, 動機付けられた推論]
    show: 動機づけられた推論
  - q: 批判的思考で大切なのは、感情を「排除する」ことではなく、感情の影響に（　　）ことである。（　　）に入る言葉は何でしょう？
    a: [気づく, 気付く]
    show: 気づく
