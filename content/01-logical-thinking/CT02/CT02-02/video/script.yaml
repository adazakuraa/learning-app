title: アブダクション
scenes:
  - board: whiteboard
    steps:
      - say: 演繹と帰納に加えて、日常で最もよく使われている、3つ目の推論が、アブダクションです。観察された事実を、いちばんうまく説明できる仮説を選ぶ、という推論です。
        show:
          - { type: title, text: アブダクション }
          - { type: box, color: yellow, w: 1100, text: "**アブダクション** ＝ 事実をいちばんうまく説明できる仮説を選ぶ" }
      - say: 名探偵の推理を、思いうかべてください。手がかりから、いちばん筋の通る犯人を、しぼりこんでいきますね。あれが、アブダクションです。
        added: true
        show:
          - { type: text, color: gray, text: "名探偵の推理と同じ" }

  - board: whiteboard
    steps:
      - say: 例えば、朝起きたら、地面がぬれていたとします。考えられる説明は、いろいろあります。
        show:
          - { type: title, text: 地面がぬれている }
          - type: list
            items: ["① 夜に雨が降った", "② だれかが水をまいた", "③ 水道管が破裂した", "④ 夜つゆが降りた"]
      - say: アブダクションでは、ぬれ方や、空の様子、近所の様子などの証拠から、いちばん説明力の高い仮説を選びます。家の前だけでなく、町じゅうがぬれていたら、雨でしょう。
        show:
          - { type: box, at: [640, 160], w: 580, color: blue, text: "町じゅうがぬれている・空がくもっている → ①雨 がいちばん説明できる" }
      - say: 水道管が破裂した可能性を、完全には否定できません。でも、それを示す証拠がほかにないなら、わざわざこの説を選ぶ理由はありません。
        show:
          - { type: text, at: [640, 350], w: 580, size: s, color: gray, text: "③も否定はできないが、示す証拠がなければ選ぶ理由はない" }

  - board: whiteboard
    steps:
      - say: 科学も、アブダクションをよく使います。いちばんうまく説明できる理論を、採用するのです。ただし、今の時点での最善の説明は、新しい証拠で、くつがえることがあります。
        show:
          - { type: title, text: よいアブダクションの条件 }
          - { type: text, text: "アブダクション ＝ 確実ではなく「今の時点での最善」" }
      - say: よいアブダクションの条件は3つです。説明力が高いこと。ひとつの仮説で、より多くの事実を説明できること。単純であること。必要以上に、仮説を重ねないこと。そして、整合性。ほかの知識と、矛盾しないことです。
        show:
          - { type: box, color: yellow, w: 1100, title: ① 説明力, text: "ひとつの仮説で、より多くの事実を説明できる" }
          - { type: box, color: green, w: 1100, title: ② 単純さ, text: "必要以上に仮説を重ねない" }
          - { type: box, color: blue, w: 1100, title: ③ 整合性, text: "ほかの知識と矛盾しない" }
