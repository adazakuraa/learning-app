questions:
  - q: 前提が真ならば結論も必ず真になる推論を何というか。
    a: [演繹, 演繹的推論, 演繹法]
    show: 演繹（的推論）
  - q: 「これまで見たカラスはすべて黒かった。だからすべてのカラスは黒い」。このように観察から一般的な結論を導く推論を何というか。
    a: [帰納, 帰納的推論, 帰納法]
    show: 帰納（的推論）
  - q: 帰納的推論の結論は「必ず正しい」とは言えない。では何を与えるものか。（　　）的な支持。
    a: [確率, 確率的]
    show: 確率（的な支持）
  - q: 「観察された事実を最もよく説明できる仮説を採用する」推論を何というか。
    a: [アブダクション]
