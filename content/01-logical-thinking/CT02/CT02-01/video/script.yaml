title: 演繹と帰納
scenes:
  - board: slide
    steps:
      - say: 第2章、「論理の基本」です。
        show:
          - { type: title, text: 第2章　論理の基本 }
      - say: 人がものごとを推し量る、推論の3つの型、演繹、帰納、アブダクションを学びます。
        show:
          - type: list
            items: ["演繹と帰納", "アブダクション"]
      - say: 推論の型を知ると、その主張が、どのくらい確かなのかを見きわめられるようになります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "推論の型を知り、主張がどのくらい確かかを見きわめる" }

  - board: whiteboard
    steps:
      - say: 推論には、主に2つの種類があります。
        show:
          - { type: title, text: 演繹的推論 }
      - say: 演繹的推論は、前提が本当なら、結論も必ず本当になる推論です。結論が、前提から、論理的に導かれます。
        show:
          - { type: box, color: blue, w: 1100, text: "**演繹**：前提が本当なら、結論も **必ず** 本当" }
      - say: 例えば、「すべての人は、いずれ死ぬ。ソクラテスは人である。だから、ソクラテスもいずれ死ぬ」。ルールから、個別のことを導く推論です。
        show:
          - { type: text, text: "例：すべての人はいずれ死ぬ → ソクラテスは人 → ソクラテスもいずれ死ぬ" }
          - { type: text, size: s, color: gray, text: "一般のルール → 個別のこと" }

  - board: whiteboard
    steps:
      - say: 帰納的推論は、観察や証拠から、一般的な結論を導く推論です。
        show:
          - { type: title, text: 帰納的推論 }
          - { type: box, color: green, w: 1100, text: "**帰納**：観察・証拠から、一般的な結論を導く（**おそらく** 本当）" }
      - say: 例えば、「これまで見たカラスは、すべて黒かった。だから、すべてのカラスは黒い」。でも、これは必ず正しいとは言えません。白いカラスが一羽でも見つかれば、くずれてしまいます。
        show:
          - { type: text, text: "例：見たカラスはすべて黒い → すべてのカラスは黒い" }
          - { type: text, color: pink, text: "白いカラスが一羽見つかればくずれる" }
      - say: それでも、強い証拠があれば、おそらく本当だ、と確率的に支えることができます。科学の多くは、この帰納にもとづいています。
        show:
          - { type: text, size: s, color: gray, text: "個別の観察 → 一般のルール。科学の多くは帰納" }

  - board: whiteboard
    steps:
      - say: この2つを区別するのが大切なのは、評価の物差しがちがうからです。
        show:
          - { type: title, text: 評価の物差しがちがう }
      - say: 演繹は、形が正しいか、そして、前提が本当か、が問われます。帰納は、証拠が、結論をどれだけ強く支えるか。証拠の量は十分か、かたよりはないか、が問われます。
        show:
          - { type: box, color: blue, w: 1100, title: 演繹, text: "形は正しいか？ ＋ 前提は本当か？" }
          - { type: box, color: green, w: 1100, title: 帰納, text: "証拠はどれだけ強く支えるか？（量は十分？ かたよりは？）" }
      - say: だから、100パーセント確実ではないから信じない、という態度は、帰納に対しては、ふさわしくありません。帰納は、もともと、確率的な支えを出すものだからです。天気予報が、降水確率で表されるのと同じですね。
        show:
          - { type: text, color: yellow, text: "「100％でないから信じない」は帰納にはふさわしくない（天気予報の確率と同じ）" }
