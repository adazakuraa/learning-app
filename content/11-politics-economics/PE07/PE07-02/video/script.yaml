title: 国会・内閣・裁判所の仕組み
scenes:
  - board: whiteboard
    steps:
      - say: 「国会、内閣、裁判所」です。国会の主な仕事は、法律をつくること、予算を決めること、内閣総理大臣を指名することです。
        show:
          - { type: title, text: 国会 }
          - { type: box, color: yellow, w: 1100, text: "**国会**の仕事：法律をつくる・予算を決める・首相を指名する" }
      - say: 国会は、衆議院と参議院からなる、二院制です。2つの院で話し合うことで、慎重な審議ができます。ただし、予算、条約、首相の指名では、衆議院の考えが優先されます。これを、衆議院の優越といいます。衆議院は任期が短く、解散もあるので、国民の考えを、より反映しやすいと考えられているからです。
        show:
          - { type: box, color: blue, w: 1100, text: "**衆議院** と **参議院** の二院制。予算・条約・首相指名は衆議院が優先（**衆議院の優越**）" }

  - board: whiteboard
    steps:
      - say: 内閣は、行政を担う機関で、内閣総理大臣と、国務大臣でつくられます。首相は、国会の議決で指名されます。国会の信頼のうえに内閣が成り立つ、このしくみを、議院内閣制といいます。
        show:
          - { type: title, text: 内閣と裁判所 }
          - { type: box, color: green, w: 1100, title: 内閣, text: "首相 ＋ 国務大臣。首相は国会が指名（**議院内閣制**）" }
      - say: 裁判所は、最高裁判所と、高等、地方、家庭、簡易の、下級裁判所からなります。最高裁判所は、憲法の番人として、法律が憲法に違反していないかの、最終的な判断を下します。
        show:
          - { type: box, color: pink, w: 1100, title: 裁判所, text: "最高裁判所 ＋ 下級裁判所（高等・地方・家庭・簡易）。最高裁は「**憲法の番人**」" }
