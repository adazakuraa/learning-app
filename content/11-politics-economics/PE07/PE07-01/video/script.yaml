title: 日本国憲法の基本原則
scenes:
  - board: slide
    steps:
      - say: 第7章、「日本の政治制度」です。
        show:
          - { type: title, text: 第7章　日本の政治制度 }
      - say: 日本国憲法の基本原則と、国会、内閣、裁判所のしくみを学びます。
        show:
          - type: list
            items: ["日本国憲法の基本原則", "国会・内閣・裁判所の仕組み"]
      - say: 憲法改正や、首相の選び方など、ニュースで話題になる政治の話を、しくみから理解しましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "憲法と国のしくみを知り、政治のニュースを理解する" }

  - board: whiteboard
    steps:
      - say: 日本国憲法は、1946年に公布され、翌年に施行された憲法で、3つの基本原則があります。国民主権、基本的人権の尊重、平和主義です。
        show:
          - { type: title, text: 3つの基本原則 }
      - say: 国民主権は、政治の最終的な決定権が、国民にある、という原則です。天皇は、日本国の象徴とされ、政治の権限は持ちません。
        show:
          - { type: box, color: yellow, w: 1100, title: ① 国民主権, text: "政治の最終決定権は国民に。天皇は「日本国の **象徴**」（政治の権限は持たない）" }
      - say: 基本的人権としては、思想や表現、信教の自由などの自由権、生存権や教育を受ける権利などの社会権、選挙の参政権、裁判を受ける権利などの請求権が、保障されています。
        show:
          - { type: box, color: blue, w: 1100, title: ② 基本的人権の尊重, text: "自由権（思想・表現・信教）・社会権（生存権・教育）・参政権・請求権" }
      - say: 平和主義は、戦争の放棄、戦力を持たないこと、交戦権を認めないことを定めた、第9条にもとづく原則です。自衛隊や、日米安保条約との関係をめぐって、長く議論が続いています。
        show:
          - { type: box, color: green, w: 1100, title: ③ 平和主義（第9条）, text: "戦争の放棄・戦力の不保持・交戦権の否認。自衛隊・日米安保との関係で議論が続く" }

  - board: whiteboard
    steps:
      - say: 憲法の役割について、大切な視点があります。憲法は、国が国民に命令するルールではなく、国民が、国をしばるルールです。国の権力の乱用を防ぐためにつくられたもので、これを、立憲主義といいます。
        show:
          - { type: title, text: 立憲主義 }
          - type: svg
            w: 1000
            h: 160
            markup: |
              <rect x="40" y="40" width="250" height="80" rx="12" stroke="#9be0b0"/><rect x="700" y="40" width="250" height="80" rx="12" stroke="#f4a3b8"/>
              <path d="M300 80 H690 M675 68 L690 80 L675 92" stroke="#f3d77a" stroke-width="4"/>
              <g stroke="none" font-size="26" text-anchor="middle"><text x="165" y="90" fill="#9be0b0">国民</text><text x="825" y="90" fill="#f4a3b8">国家権力</text><text x="495" y="60" fill="#f3d77a">憲法でしばる</text></g>
          - { type: box, color: yellow, w: 1000, text: "**立憲主義**：憲法は「国民が国家をしばるルール」" }
      - say: 日本国憲法は、施行されてから、一度も改正されていません。改正には、国会での3分の2以上の賛成と、国民投票での過半数が必要な、硬性憲法だからです。
        added: true
        show:
          - { type: text, color: gray, text: "一度も改正されていない **硬性憲法**（国会の3分の2以上 ＋ 国民投票の過半数が必要）" }
