title: 政治思想とは何か
scenes:
  - board: slide
    steps:
      - say: 政治・経済の最後の章、「さまざまな政治思想」です。
        show:
          - { type: title, text: 第10章　様々な政治思想 }
      - say: 保守主義、リベラリズム、リバタリアニズム、社会民主主義など、主な政治思想と、日本の特徴、そして、それをどう使うかを学びます。
        show:
          - type: list
            at: [60, 135]
            w: 560
            size: s
            items: ["政治思想とは何か", "保守主義", "リベラリズム（自由主義）", "リバタリアニズム", "共産主義と社会民主主義"]
          - type: list
            at: [640, 135]
            w: 600
            size: s
            items: ["ファシズムと権威主義", "ナショナリズムとポピュリズム", "緑の政治・フェミニスト政治・アナーキズム", "日本の政治思想の特徴", "政治思想をどう使うか"]
      - say: どの思想が正しいかを決めるのではなく、それぞれが何を大切にしているのかを知ることで、ちがう意見の人とも、話ができるようになります。
        added: true
        show:
          - { type: box, at: [60, 430], color: yellow, w: 1000, title: この章の目的, text: "各思想が何を大切にしているかを知り、ちがう意見とも話せるようになる" }

  - board: whiteboard
    steps:
      - say: 政治思想とは、社会はどうあるべきか、国は何をすべきか、についての、まとまった考え方です。ふだん、右派、左派、保守、リベラル、という言葉が使われますが、その意味は、時代や国によって大きくちがい、単純な二つの対立ではとらえきれません。
        show:
          - { type: title, text: 右と左の由来 }
          - { type: text, text: "**政治思想** ＝ 社会はどうあるべきか、についてのまとまった考え方" }
      - say: 右と左の由来は、フランス革命のころの議会です。王の権力を支持する保守派が、議長席の右側に、革命を支持する改革派が、左側に座ったことから来ています。
        show:
          - type: svg
            w: 1000
            h: 180
            markup: |
              <rect x="420" y="20" width="160" height="60" rx="10" stroke="#9aa3ad"/><text x="500" y="58" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">議長</text>
              <path d="M150 140 Q500 80 850 140" stroke="#9aa3ad" stroke-dasharray="6 6"/>
              <g stroke="none" font-size="22" text-anchor="middle"><text x="800" y="170" fill="#f4a3b8">右側：王を支持（保守）</text><text x="200" y="170" fill="#8fc4ff">左側：革命を支持（改革）</text></g>
      - say: 今では、おおまかに、左派は、平等や分け合うこと、変化を重視し、右派は、自由や伝統、秩序を重視する、という傾向がありますが、これだけでは、不十分です。
        show:
          - { type: text, color: gray, text: "左派 ＝ 平等・再分配・変化　右派 ＝ 自由・伝統・秩序（でもこれだけでは不十分）" }

  - board: whiteboard
    steps:
      - say: 政治の立場を理解するには、少なくとも2つの軸が必要です。経済の軸は、平等と分け合うことを重視するか、経済の自由と市場を重視するか。社会の軸は、秩序や伝統、規律を重視するか、個人の自由や多様性、変化を重視するか、です。
        show:
          - { type: title, text: 2つの軸 }
          - { type: image, src: 1000003215.webp, at: [80, 120], w: 520 }
          - { type: text, at: [650, 150], w: 570, color: blue, text: "**経済の軸**：平等と再分配 ⇔ 経済の自由と市場" }
          - { type: text, at: [650, 260], w: 570, color: pink, text: "**社会の軸**：秩序・伝統・規律 ⇔ 個人の自由・多様性" }
      - say: この2つの軸で考えると、それだけで、4つのグループが生まれます。もちろん、これ以外にも、いろいろな軸があり、たくさんの政治思想が生まれています。
        show:
          - { type: box, at: [650, 380], w: 570, color: yellow, text: "2つの軸 → 4つのグループ。ほかにも多くの軸がある" }
