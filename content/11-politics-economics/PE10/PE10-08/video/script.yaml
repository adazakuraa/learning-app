title: 緑の政治・フェミニスト政治・アナーキズム
scenes:
  - board: whiteboard
    steps:
      - say: 「緑の政治、フェミニスト政治、アナーキズム」です。主な思想のほかにも、今の政治に影響をあたえている立場があります。
        show:
          - { type: title, text: 緑の政治 }
      - say: 緑の政治は、環境問題と、持続可能性を、政治の中心におく立場です。地球の生態系の限界の中で、社会をつくる、という視点から、経済成長を何より優先する考えを批判し、脱炭素、再生可能エネルギー、資源を循環させる経済を、主張します。
        show:
          - { type: box, color: green, w: 1100, text: "**緑の政治**：環境と持続可能性が中心。成長至上主義を批判し、脱炭素・再エネ・循環経済を主張" }

  - board: whiteboard
    steps:
      - say: フェミニスト政治は、性差別や、ジェンダーの不平等の、構造的な問題を、政治の課題として取り上げる立場で、いろいろな考え方があります。法の上での平等や、機会の平等を求める、自由主義フェミニズム。性差別と階級の搾取の結びつきを問題にする、社会主義フェミニズム。男性中心の社会、家父長制を、根本から変えようとする、ラディカル・フェミニズム。そして、人種や階級、性別が、重なり合って生む差別に注目する、インターセクショナル・フェミニズムです。
        show:
          - { type: title, text: フェミニスト政治 }
          - { type: text, color: pink, text: "**自由主義フェミニズム**：法の平等・機会の平等" }
          - { type: text, color: pink, text: "**社会主義フェミニズム**：性差別と階級の搾取の結びつき" }
          - { type: text, color: pink, text: "**ラディカル・フェミニズム**：家父長制（男性中心の社会）を根本から変える" }
          - { type: text, color: pink, text: "**インターセクショナル・フェミニズム**：人種・階級・性別の重なりによる差別" }

  - board: whiteboard
    steps:
      - say: アナーキズム、無政府主義は、国家の権力そのものが不当であり、強制的な支配がなくても、自由な個人や共同体が、協力して社会をつくれる、という立場です。
        show:
          - { type: title, text: アナーキズム }
          - { type: box, color: blue, w: 1100, text: "**アナーキズム**：国家権力そのものが不当。支配なしでも自由な個人・共同体が協力できる" }
      - say: 暴力的なイメージがありますが、多くのアナーキストは、暴力を使わないことや、助け合いを重視します。国家、資本主義、家父長制といった、あらゆる権力の構造を、批判的に見る視点を持っています。
        show:
          - { type: text, color: gray, text: "暴力のイメージがあるが、多くは非暴力・助け合いを重視。あらゆる権力構造を批判的に見る" }
