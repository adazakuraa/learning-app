questions:
  - q: 急激な変化より、伝統・慣習・秩序を守ることを重視する立場を何というか。
    a: [保守主義]
  - q: 個人の自由を最大化し、国家の介入を最小限にすべきだとする立場を何というか。
    a: [リバタリアニズム, 自由至上主義]
    r: [じゆうしじょうしゅぎ]
    show: リバタリアニズム
  - q: 資本主義を維持しながら、強力な福祉国家や再分配で格差を小さくしようとする立場を何というか。
    a: [社会民主主義]
  - q: ムッソリーニのイタリアやナチス・ドイツが代表例の、極右の全体主義的イデオロギーを何というか。
    a: [ファシズム]
