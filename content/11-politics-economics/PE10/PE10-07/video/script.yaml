title: ナショナリズムとポピュリズム
scenes:
  - board: whiteboard
    steps:
      - say: 「ナショナリズムとポピュリズム」です。ナショナリズムは、国民や民族の、共同体、自分たちで決めること、利益を重視する立場です。ひとつではなく、いろいろな形があります。
        show:
          - { type: title, text: 2つのナショナリズム }
          - { type: text, text: "**ナショナリズム** ＝ 国民・民族の共同体・自決・利益を重視（いろいろな形がある）" }
      - say: 市民的ナショナリズムは、国籍や、法への忠誠、共通の価値観にもとづく、国民の一体感を重視します。フランスの価値観を受け入れれば、だれでもフランス人になれる、というフランスの共和主義が、その例です。
        show:
          - { type: box, color: blue, w: 1100, title: 市民的ナショナリズム, text: "国籍・法・共通の価値観で結びつく（「価値観を受け入れればだれでもフランス人」）" }
      - say: 民族的ナショナリズムは、血のつながり、文化、言葉などの、民族の特徴による共同体を重視します。歴史的に、民族浄化や、外国人を排除する動きと、結びついてきた面があります。
        show:
          - { type: box, color: pink, w: 1100, title: 民族的ナショナリズム, text: "血統・文化・言語で結びつく。歴史的に民族浄化・排外主義と結びついた面も" }

  - board: whiteboard
    steps:
      - say: ポピュリズムは、清らかな人民と、腐敗したエリート、という対立の図式を前提に、人民の意思を、直接実現しようと主張する、政治のスタイルです。移民やグローバル化、エリートに反対する、右派のポピュリズムと、富裕層や大企業、エリートに反対する、左派のポピュリズムがあります。
        show:
          - { type: title, text: ポピュリズム }
          - { type: box, color: yellow, w: 1100, text: "**ポピュリズム**：「清らかな人民 vs 腐敗したエリート」。右派（移民・グローバル化に反対）と左派（富裕層・大企業に反対）" }
      - say: 今のポピュリズムの台頭、例えば、トランプ現象や、イギリスのEU離脱の背景には、グローバル化による格差の拡大、製造業のおとろえ、文化の変化への不安、そして、これまでの政治エリートへの不信があります。
        read: 今のポピュリズムの台頭、例えば、トランプ現象や、イギリスのイーユー離脱の背景には、グローバル化による格差の拡大、製造業のおとろえ、文化の変化への不安、そして、これまでの政治エリートへの不信があります。
        show:
          - { type: text, color: gray, text: "背景：格差の拡大・製造業のおとろえ・文化の変化への不安・エリートへの不信（トランプ現象、ブレグジット）" }

  - board: whiteboard
    steps:
      - say: 強みは、これまでのエリートの政治が、見すごしてきた人々の声を、すくい上げることと、政治への参加の意識を高めることです。弱みは、複雑な問題を単純にしすぎること、多数派の意思で、少数派の権利をふみにじる危険、そして、人民の声を代弁する、と主張する指導者に、権力が集中して、民主主義がむしばまれるおそれがあることです。
        show:
          - { type: title, text: 強みと弱み }
          - { type: box, color: green, w: 1100, title: 強み, text: "見すごされてきた人の声をすくう・政治への参加意識を高める" }
          - { type: box, color: pink, w: 1100, title: 弱み, text: "問題を単純化・少数派をふみにじる危険・指導者への権力集中" }
