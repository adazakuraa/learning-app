title: ファシズムと権威主義
scenes:
  - board: whiteboard
    steps:
      - say: 「ファシズムと権威主義」です。ファシズムは、20世紀の前半にあらわれた、極右の全体主義の考え方です。イタリアのムッソリーニ、ヒトラーのナチス・ドイツが、代表例です。
        show:
          - { type: title, text: ファシズム }
          - { type: text, text: "**ファシズム**：20世紀前半の極右・全体主義（ムッソリーニのイタリア、ヒトラーのドイツ）" }
      - say: 特徴は、国家や民族の統一と力を、最優先にし、個人の権利は二の次にすること。カリスマ的な指導者への服従。軍事力や暴力の賛美。ユダヤ人や共産主義者、少数民族などを、スケープゴートにして迫害すること。そして、民主主義や議会政治を、軽べつすることです。
        show:
          - type: list
            items: ["国家・民族が最優先、個人の権利は二の次", "カリスマ的指導者への服従", "軍事力・暴力の賛美", "スケープゴートをつくって迫害", "民主主義・議会を軽べつ"]

  - board: whiteboard
    steps:
      - say: 権威主義は、ファシズムより広い考え方で、少数の人による、強い力での支配と、政治的な反対の、おさえこみを特徴とします。中国、ロシア、北朝鮮、サウジアラビアなどが、当てはまります。
        show:
          - { type: title, text: 権威主義 }
          - { type: box, color: pink, w: 1100, text: "**権威主義**：少数による強権的な支配・反対意見のおさえこみ（中国・ロシア・北朝鮮・サウジアラビアなど）" }
      - say: 権威主義は、歴史の中で、何度もくり返されてきました。経済の危機や、社会の不安が、強い指導者を求める気持ちを生むこと。民主的な手続きを使って、権威主義的な指導者が選ばれる場合があること。ヒトラーも、選挙を通じて権力をにぎりました。そして、歯止めがなければ、権力は、自分を強めながら集中していく傾向があることが、理由として挙げられます。
        show:
          - type: list
            items: ["経済危機・社会不安が「強い指導者」を求めさせる", "民主的な手続きで選ばれることも（ヒトラー）", "歯止めがないと権力は集中していく"]
      - say: 民主主義は、放っておけば守られるものではありません。権力分立や、自由な報道といった、歯止めのしくみを、守り続けることが大切なのです。
        added: true
        show:
          - { type: box, at: [80, 470], w: 1100, color: yellow, text: "民主主義は放っておけば守られるものではない。歯止めのしくみを守り続ける" }
