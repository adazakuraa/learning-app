title: 政治思想をどう使うか
scenes:
  - board: whiteboard
    steps:
      - say: 最後は、「政治思想をどう使うか」です。政治思想を学ぶ目的は、どの思想が正しいかを、決めることではありません。
        show:
          - { type: title, text: ちがいの根っこ }
      - say: 何が最も大切か。自由か、平等か、安全か。人間の本性をどう見るか。協力的か、競争的か。社会の変化をどう見るか。進歩か、危険か。こうした、根本的な価値観のちがいが、ちがう政治思想を生み出しているのです。
        show:
          - type: list
            items: ["何が最も大切か？（自由・平等・安全）", "人間の本性は？（協力的・競争的）", "社会の変化は？（進歩・危険）"]

  - board: whiteboard
    steps:
      - say: それぞれの思想の、論理の筋道を理解することが大切です。どの党を支持するか、という結論より、自分は〇〇を大切にするから、〇〇という政策が大事だと思う、という考え方のほうが、民主主義の市民として、ずっと生産的です。
        show:
          - { type: title, text: 結論より理由 }
          - { type: text, color: gray, text: "×「〇〇党を支持する」だけ" }
          - { type: box, color: green, w: 1100, text: "○「私は〇〇を大切にするから、〇〇という政策が大事だと思う」" }
      - say: そして、すべての思想には、強みと弱みがあります。この思想だけが正しく、ほかはまちがいだ、という確信は危険です。歴史は、ただひとつの正しい思想を実現しようとして、多くの悲劇が生まれたことを示しています。
        show:
          - { type: box, color: pink, w: 1100, text: "「この思想だけが正しい」という確信は危険（歴史上の多くの悲劇）" }

  - board: whiteboard
    steps:
      - say: ちがう思想の強みを組み合わせ、現実の状況に応じて判断する、柔らかさ。それが、政治的な成熟のひとつの形です。
        show:
          - { type: title, text: 自分の価値観を問い直す }
          - { type: box, color: yellow, w: 1100, text: "ちがう思想の強みを組み合わせ、状況に応じて判断する柔らかさ ＝ 政治的な成熟" }
      - say: 政治思想は、どんな社会に住みたいか、何が大切か、という、自分の価値観を問い直す、きっかけになります。これで、政治・経済はおしまいです。おつかれさまでした。
        show:
          - { type: text, color: green, text: "「どんな社会に住みたいか」「何が大切か」を問い直すきっかけに" }
