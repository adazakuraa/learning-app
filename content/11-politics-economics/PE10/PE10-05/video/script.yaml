title: 共産主義と社会民主主義
scenes:
  - board: whiteboard
    steps:
      - say: 「共産主義と社会民主主義」です。マルクス主義、共産主義は、工場や土地のような、生産の手段を、個人が持つこと自体をなくして、社会全体で持つべきだ、と主張する、より急進的な左派です。
        show:
          - { type: title, text: 共産主義 }
          - { type: box, color: pink, w: 1100, text: "**共産主義**：工場・土地などの生産手段を個人が持たず、社会全体で持つべき" }
      - say: 20世紀の共産主義の国、ソ連や中国、キューバでは、大規模な失政や、人権の侵害が起き、理想と現実の、大きなずれを示しました。
        show:
          - { type: text, color: gray, text: "20世紀の共産主義国（ソ連・中国・キューバ）：大規模な失政・人権侵害 → 理想と現実のずれ" }
      - say: 格差や貧困の問題に、真剣に向き合う一方で、高い税や規制が、経済の効率や成長をさまたげ、大きな政府が、非効率を生み、歴史的には、権威主義の体制と結びついてきた、という弱みがあります。
        show:
          - { type: box, color: green, at: [80, 380], w: 540, title: 強み, text: "格差・貧困に真剣に向き合う・弱い立場の人を守る" }
          - { type: box, color: pink, at: [660, 380], w: 540, title: 弱み, text: "効率・成長をさまたげる・非効率・権威主義と結びついてきた" }

  - board: whiteboard
    steps:
      - say: 社会民主主義は、資本主義の経済は残しながら、強い福祉国家と、再分配の政策によって、不平等を正す、という立場です。共産主義とリベラリズムの中間に位置し、20世紀の北欧や西欧で実現しました。
        show:
          - { type: title, text: 社会民主主義 }
          - { type: box, color: blue, w: 1100, text: "**社会民主主義**：資本主義は残し、福祉国家と再分配で不平等を正す（北欧・西欧）" }
      - say: 市場経済は効率的だけれど、放っておくと、不平等や貧困、搾取を生む。だから、国が、税や再分配、規制で、市場を修正すべき。そして、すべての人に、医療、教育、最低限の生活を保障すべきだ、と主張します。
        show:
          - type: list
            items: ["市場は効率的。でも放っておくと不平等を生む", "国が税・再分配・規制で修正する", "全員に医療・教育・最低限の生活を保障"]
      - say: 北欧は、その代表例で、高い税率、強い労働者の保護、充実した福祉、そして人々の間の高い信頼、という組み合わせで、高い幸福度、小さな格差、高い生産性を実現しています。
        show:
          - { type: box, at: [80, 440], w: 1100, color: green, text: "北欧：高い税・労働者保護・充実した福祉・高い信頼 → 高い幸福度・小さな格差・高い生産性" }
