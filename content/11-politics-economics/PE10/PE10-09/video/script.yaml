title: 日本の政治思想の特徴
scenes:
  - board: whiteboard
    steps:
      - say: 「日本の政治思想の特徴」です。日本の政治思想は、欧米と同じ軸では、理解しにくい特徴があります。
        show:
          - { type: title, text: 自民党の特徴 }
      - say: 自民党、自由民主党は、名前に、自由、民主、と入っていますが、思想的には、保守主義、ナショナリズム、そして、実利を重んじる経済の考え方の、まざり合ったものです。
        show:
          - { type: text, text: "**自民党**：保守主義・ナショナリズム・経済的な実用主義のまざり合い" }
      - say: 戦後の高度成長期には、政府が産業政策を積極的に引っぱる、開発主義の国家として機能しました。欧米の、小さな政府の保守主義とは、ちがいます。党の中にもいろいろな派閥があり、憲法改正や防衛力の強化を重視する、タカ派から、対話や協調を重視する、ハト派まで、はばが広いのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "政府が産業を引っぱる「開発主義」→ 欧米の「小さな政府」保守とはちがう。党内はタカ派からハト派まで幅広い" }

  - board: whiteboard
    steps:
      - say: 立憲民主党などの野党は、欧米のリベラルや、社会民主主義に近い立場をとることが多いですが、日本では、リベラルが、憲法を守る、安保に反対する、という、安全保障の立場と結びつく傾向があります。
        show:
          - { type: title, text: 欧米とのねじれ }
          - { type: box, color: blue, w: 1100, text: "野党：欧米のリベラル・社会民主主義に近い。日本の「リベラル」は「護憲・安保反対」と結びつきやすい" }
      - say: 欧米では、右派は、市場の自由化や、小さな政府ですが、日本では、自民党の長い政権が、規制、補助金、公共事業という、大きな政府的な政策をとってきました。また、左派が、憲法9条を守り、アメリカに反対する、という構図も、欧米の左右の軸とはちがいます。日本の政治を見るときは、欧米の物差しを、そのまま当てはめないことが大切です。
        show:
          - { type: text, color: pink, text: "欧米の右派 ＝ 小さな政府。日本の自民党 ＝ 規制・補助金・公共事業（大きな政府的）" }
          - { type: text, color: green, text: "日本の左派 ＝ 9条を守る・アメリカに反対（欧米の左右とはちがう軸）" }
