title: 保守主義
scenes:
  - board: whiteboard
    steps:
      - say: 「保守主義」です。保守主義は、急な変化より、伝統や慣習、秩序を守ることを重視する立場です。
        show:
          - { type: title, text: 保守主義の考え方 }
          - { type: box, color: yellow, w: 1100, text: "**保守主義** ＝ 急な変化より、伝統・慣習・秩序を守ることを重視" }
      - say: 中心にあるのは、人間の理性は完ぺきではなく、長い年月の経験や慣習には、理屈では説明できない知恵が、積み重なっている、という人間観です。今の制度は、過去の試行錯誤の産物であり、理論だけで、急に変えるのは危険だ、という慎重さがあります。
        show:
          - { type: text, text: "人間の理性は不完全。慣習には理屈をこえた知恵がつまっている → 急に変えるのは危険" }
      - say: 具体的には、伝統的な家族や宗教、地域の共同体を大切にし、急な変更より、少しずつの改革を好み、強い国防や、法と秩序を重視し、経済では、市場のはたらきを、比較的信頼します。
        show:
          - type: list
            items: ["伝統的な家族・宗教・共同体を大切に", "急な変更より、少しずつの改革", "強い国防・法と秩序", "経済では市場を比較的信頼"]

  - board: whiteboard
    steps:
      - say: 強みは、現実的な人間観です。理想をかかげた改革が、しばしば失敗してきた、という歴史の証拠があります。また、社会の連帯や、共同体の価値に、目を向けます。
        show:
          - { type: title, text: 強みと弱み }
          - { type: box, color: green, w: 1100, title: 強み, text: "現実的な人間観（理想の改革はしばしば失敗）・共同体や連帯の価値に目を向ける" }
      - say: 弱みは、今のままを守ろうとすることで、不正や差別、不平等を、残してしまう場合があることです。また、守るべき伝統とは、だれの伝統なのか、という問題もあります。少数派から見ると、伝統が、おさえつけることの言いわけに使われることもあるのです。
        show:
          - { type: box, color: pink, w: 1100, title: 弱み, text: "現状維持が不正・差別を残すことも。「だれの伝統か？」（少数派をおさえる理由になることも）" }
