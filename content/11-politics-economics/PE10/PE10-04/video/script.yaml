title: リバタリアニズム
scenes:
  - board: whiteboard
    steps:
      - say: 「リバタリアニズム」です。リバタリアニズムは、個人の自由を最大にし、国の関わりを最小にする立場で、古典的自由主義を、つきつめた形です。
        show:
          - { type: title, text: リバタリアニズムの主張 }
          - { type: box, color: yellow, w: 1100, text: "**リバタリアニズム** ＝ 個人の自由を最大に、国の関わりを最小に" }
      - say: 個人は、自分の体、財産、選択について、最大限の自由を持つべき。国の正当な役割は、外からの侵略や、犯罪、詐欺から守ることに限られる、という、最小国家論。そして、無理やりの再分配、つまり税金は、一種の強盗であり、正当化できない、とまで主張します。
        show:
          - type: list
            items: ["自分の体・財産・選択に最大限の自由", "国の役割は、侵略・犯罪・詐欺から守るだけ（**最小国家論**）", "強制的な再分配（税）は一種の「強盗」"]

  - board: whiteboard
    steps:
      - say: 経済のリバタリアニズムは、市場の自由、規制の緩和、小さな政府、民営化を支持します。社会のリバタリアニズムは、社会的な自由も重視し、麻薬や売春の合法化、同性婚の支持など、個人の私的な選択に、政府が口を出すことに、全般的に反対します。
        show:
          - { type: title, text: 経済と社会の両面で }
          - { type: box, color: blue, w: 1100, title: 経済の面, text: "市場の自由・規制緩和・小さな政府・民営化" }
          - { type: box, color: green, w: 1100, title: 社会の面, text: "私的な選択に政府は口を出さない（麻薬・売春の合法化、同性婚の支持など）" }

  - board: whiteboard
    steps:
      - say: 強みは、個人の自己決定を、最大限尊重すること。そして、政府の権力のふくらみや、お役所仕事を、批判する視点をくれることです。
        show:
          - { type: title, text: 強みと弱み }
          - { type: box, color: green, w: 1100, title: 強み, text: "自己決定を最大限尊重・政府の肥大化やお役所仕事への批判の視点" }
      - say: 弱みは、独占や外部性、公共財といった、市場の失敗への対処が、不十分なこと。格差や貧困を、自己責任として、放っておきがちなこと。そして、自由な選択が、実際には、生まれた家庭や、教育の機会によって、大きく制約されている、という問題を、見落としがちなことです。
        show:
          - { type: box, color: pink, w: 1100, title: 弱み, text: "市場の失敗への対処が不十分・格差を自己責任で放置・「選択の自由」が環境に左右されることを見落とす" }
