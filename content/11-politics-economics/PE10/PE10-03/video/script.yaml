title: リベラリズム（自由主義）
scenes:
  - board: whiteboard
    steps:
      - say: 「リベラリズム」、自由主義です。リベラリズムは、個人の自由と権利、理性を重視する立場で、近代の政治思想の、中心的な流れです。ジョン・ロック、ジョン・スチュアート・ミル、カントが、その源です。
        show:
          - { type: title, text: 2つのリベラリズム }
          - { type: text, text: "**リベラリズム** ＝ 個人の自由・権利・理性を重視（ロック・ミル・カント）" }
      - say: 注意が必要なのは、リベラル、という言葉の意味が、国によって大きくちがうことです。
        show:
          - { type: text, color: pink, text: "注意：「リベラル」の意味は国によって大きくちがう" }
      - say: 古典的自由主義は、17世紀から19世紀に発展した、本来のリベラリズムで、個人の自由、財産権、小さな政府、法の支配、市場経済を重視します。今では、保守や、リバタリアンに近い立場として、分類されることが多いです。
        show:
          - { type: box, color: blue, w: 1100, title: 古典的自由主義（17〜19世紀）, text: "自由・財産権・小さな政府・市場経済 → 今では保守・リバタリアンに近い" }
      - say: 現代リベラリズムは、20世紀以降に発展した形で、個人の自由を本当に守るために、国が、教育や医療、貧困対策に、積極的に関わる、という立場です。アメリカや日本で、リベラルというと、ふつうはこちらを指し、個人の権利、多様性、社会にだれもを包みこむことを、強調します。
        show:
          - { type: box, color: green, w: 1100, title: 現代リベラリズム（20世紀〜）, text: "自由を守るために国が教育・医療・貧困対策に関わる。アメリカ・日本の「リベラル」" }

  - board: whiteboard
    steps:
      - say: 中心となる主張は、個人の自由と権利が最も大切で、国はそれを守るためにある。人間は理性的で、話し合いと改革で、社会をよくできる。寛容、多様性、個人の自律を重んじる、というものです。
        show:
          - { type: title, text: 主張と強み・弱み }
          - type: list
            items: ["個人の自由と権利が最も大切。国はそれを守るためにある", "話し合いと改革で社会をよくできる", "寛容・多様性・個人の自律"]
      - say: 強みは、個人の権利と自由の保障、民主主義と法の支配の土台、少数派の権利への配慮です。弱みは、個人を強調しすぎると、共同体や連帯が弱まるおそれがあること、そして、自分たちの正義を、押しつけがちになることです。
        show:
          - { type: box, at: [80, 340], w: 540, color: green, title: 強み, text: "権利と自由の保障・民主主義の土台・少数派への配慮" }
          - { type: box, at: [660, 340], w: 540, color: pink, title: 弱み, text: "共同体・連帯が弱まる・正義の押しつけになりやすい" }
