title: 政治・経済とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、政治・経済がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 政治・経済とは
      - say: 政治・経済では、市場や景気の仕組み、日本と世界の経済、民主主義や憲法、国際政治、さまざまな政治思想を学びます。
        show:
          - type: box
            w: 1100
            text: 政治・経済では、市場や景気の仕組み、日本と世界の経済、民主主義や憲法、国際政治、さまざまな政治思想を学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で10章です。第1章はミクロ経済、第2章はマクロ経済、第3章は日本経済、第4章は国際経済、第5章は現代の経済的課題、第6章は民主主義と政治の基本、第7章は日本の政治制度、第8章は基本的人権と法、第9章は国際政治、第10章は様々な政治思想。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　ミクロ経済
              - 第2章　マクロ経済
              - 第3章　日本経済
              - 第4章　国際経済
              - 第5章　現代の経済的課題
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第6章　民主主義と政治の基本
              - 第7章　日本の政治制度
              - 第8章　基本的人権と法
              - 第9章　国際政治
              - 第10章　様々な政治思想
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、政治・経済を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、ニュースが理解できる。物価、金利、円安、選挙、国際問題。毎日のニュースのほとんどは、政治と経済の話です。
        show:
          - type: box
            w: 1100
            text: |-
              **ニュースが理解できる**
              物価、金利、円安、選挙、国際問題。毎日のニュースのほとんどは、政治と経済の話です。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、お金や仕事の判断に役立つ。景気や物価の仕組みを知ると、給料、貯金、投資などの判断がしやすくなります。
        show:
          - type: box
            w: 1100
            text: |-
              **お金や仕事の判断に役立つ**
              景気や物価の仕組みを知ると、給料、貯金、投資などの判断がしやすくなります。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、社会に参加できる。選挙や制度の仕組みを知ることは、自分の意見を社会に届けるための第一歩です。
        show:
          - type: box
            w: 1100
            text: |-
              **社会に参加できる**
              選挙や制度の仕組みを知ることは、自分の意見を社会に届けるための第一歩です。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、選挙で投票先を考えるとき、物価や円安のニュースを見るとき、税金や社会保障の制度を理解するとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 選挙で投票先を考えるとき
              - 物価や円安のニュースを見るとき
              - 税金や社会保障の制度を理解するとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、用語はニュースの具体例と結びつける。そして、「誰が得をして、誰が損をするか」で考える。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・用語は**ニュースの具体例**と結びつける
              ・「誰が得をして、誰が損をするか」で考える
            color: pink
            at:
              - 80
              - 420
