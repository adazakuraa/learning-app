title: GDPと経済成長
scenes:
  - board: slide
    steps:
      - say: 第2章、「マクロ経済」です。
        show:
          - { type: title, text: 第2章　マクロ経済 }
      - say: 国全体の経済を、GDP、物価、お金、税金という面から見ていきます。
        read: 国全体の経済を、ジーディーピー、物価、お金、税金という面から見ていきます。
        show:
          - type: list
            items: ["GDPと経済成長", "インフレとデフレ", "金融と中央銀行", "財政と税"]
      - say: 物価高、円安、金利、増税。ニュースで毎日のように聞く言葉の意味と、そのつながりがわかるようになります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "物価・金利・税など、経済ニュースの言葉とつながりを知る" }

  - board: whiteboard
    steps:
      - say: GDP、国内総生産は、一定の期間に、国内で生み出された、すべての、もの、やサービスの、付加価値の合計です。経済の大きさや、豊かさを測る、最も基本的な物差しです。
        read: ジーディーピー、国内総生産は、一定の期間に、国内で生み出された、すべての、もの、やサービスの、付加価値の合計です。経済の大きさや、豊かさを測る、最も基本的な物差しです。
        show:
          - { type: title, text: GDP と付加価値 }
          - { type: box, color: yellow, w: 1100, text: "**GDP**（国内総生産）＝ 国内で生み出された付加価値の合計" }
      - say: 付加価値とは、それぞれの段階で、新しく加わった価値のことです。農家が100円の小麦をつくり、製粉会社が、150円の小麦粉に加工し、パン屋が、250円のパンにします。付加価値は、100円、50円、100円で、合計250円。最後のパンの値段と同じになります。
        show:
          - type: svg
            w: 1100
            h: 200
            markup: |
              <g stroke-width="3"><rect x="20" y="40" width="280" height="90" rx="12" stroke="#9be0b0"/><rect x="410" y="40" width="280" height="90" rx="12" stroke="#f3d77a"/><rect x="800" y="40" width="280" height="90" rx="12" stroke="#f4a3b8"/></g>
              <path d="M305 85 H405 M695 85 H795" stroke="#9aa3ad"/>
              <g stroke="none" text-anchor="middle"><text x="160" y="80" font-size="24" fill="#9be0b0">小麦 100円</text><text x="550" y="80" font-size="24" fill="#f3d77a">小麦粉 150円</text><text x="940" y="80" font-size="24" fill="#f4a3b8">パン 250円</text>
              <text x="160" y="112" font-size="18" fill="#9be0b0">付加価値 100</text><text x="550" y="112" font-size="18" fill="#f3d77a">付加価値 50</text><text x="940" y="112" font-size="18" fill="#f4a3b8">付加価値 100</text>
              <text x="550" y="180" font-size="24" fill="currentColor">100＋50＋100 ＝ 250円（パンの値段と同じ）</text></g>

  - board: whiteboard
    steps:
      - say: 経済成長率は、前の年と比べて、GDPがどれだけ増えたかの割合です。先進国は、だいたい1から3パーセント、新興国は、5から8パーセントほどです。
        read: 経済成長率は、前の年と比べて、ジーディーピーがどれだけ増えたかの割合です。先進国は、だいたい1から3パーセント、新興国は、5から8パーセントほどです。
        show:
          - { type: title, text: 経済成長とGDPの弱点 }
          - { type: text, text: "**経済成長率**：先進国 1〜3％、新興国 5〜8％ほど" }
      - say: GDPには、弱点もあります。家事やボランティアのように、お金のやりとりがない活動は、数えられません。環境の破壊や、健康の被害も、マイナスとして数えられず、災害からの復興の工事で、GDPが上がることさえあります。また、格差も表しません。一部の人に富が集中していても、数字はよく見えてしまうのです。
        read: ジーディーピーには、弱点もあります。家事やボランティアのように、お金のやりとりがない活動は、数えられません。環境の破壊や、健康の被害も、マイナスとして数えられず、災害からの復興の工事で、ジーディーピーが上がることさえあります。また、格差も表しません。一部の人に富が集中していても、数字はよく見えてしまうのです。
        show:
          - { type: box, color: pink, w: 1100, title: GDP の弱点, text: "家事・ボランティアは数えない／環境破壊はマイナスにならない（復興でむしろ増える）／格差を表さない" }
