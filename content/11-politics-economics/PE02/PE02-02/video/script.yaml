title: インフレとデフレ
scenes:
  - board: whiteboard
    steps:
      - say: 「インフレとデフレ」です。インフレーション、インフレは、物の値段、物価が、上がり続ける現象です。
        show:
          - { type: title, text: インフレの2つのタイプ }
          - { type: text, text: "**インフレ** ＝ 物価が上がり続ける" }
      - say: インフレには、主に2つの原因があります。ディマンドプル・インフレは、景気がよくなり、物を買いたい人が増えて、値段が上がるタイプで、よいインフレといわれます。
        show:
          - { type: box, color: green, w: 1100, title: ディマンドプル・インフレ（よいインフレ）, text: "景気がよく、買いたい人が増えて値段が上がる" }
      - say: コストプッシュ・インフレは、原材料や、エネルギーの値段が上がり、つくるコストが上がって、値段に上乗せされるタイプで、悪いインフレといわれます。2022年以降の日本の物価高は、主にこちらで、円安も重なりました。
        show:
          - { type: box, color: pink, w: 1100, title: コストプッシュ・インフレ（悪いインフレ）, text: "原材料・エネルギーが値上がりし、値段に上乗せ（2022年以降の日本。円安も重なる）" }

  - board: whiteboard
    steps:
      - say: デフレーション、デフレは、物価が下がり続ける現象です。物が安くなるならいいのでは、と思いがちですが、デフレは、経済にとって危険です。
        show:
          - { type: title, text: デフレスパイラル }
          - { type: text, text: "**デフレ** ＝ 物価が下がり続ける（安くなるのに危険？）" }
      - say: 物価が下がると、企業の売り上げと利益が減り、給料が減り、物を買わなくなり、さらに物価が下がる。この悪い循環を、デフレスパイラルといいます。日本は、1990年代の後半から2010年代にかけて、長いデフレに苦しみました。
        show:
          - type: svg
            w: 1000
            h: 280
            markup: |
              <circle cx="500" cy="140" r="110" stroke="#9aa3ad" stroke-dasharray="8 6"/>
              <g stroke="none" font-size="22" text-anchor="middle"><text x="500" y="22" fill="#f4a3b8">物価が下がる</text><text x="760" y="150" fill="#f4a3b8">売上・利益が減る</text><text x="500" y="275" fill="#f4a3b8">給料が減る</text><text x="240" y="150" fill="#f4a3b8">物を買わない</text></g>
              <path d="M590 70 L610 90 L585 92" stroke="#9aa3ad"/>
      - say: そのため、ほどよいインフレ、年2パーセントほどが、経済の成長には必要だとされ、多くの中央銀行が、2パーセントの物価上昇を、目標にしています。
        show:
          - { type: box, color: yellow, w: 1000, text: "ほどよいインフレ（年2％ほど）が目標：多くの中央銀行の「**2％目標**」" }

  - board: whiteboard
    steps:
      - say: 反対に、ハイパーインフレは、手がつけられないほどの、急激な物価の上昇です。1923年のドイツでは、1か月で、物価がおよそ300倍になったこともあり、2000年代のジンバブエでも起きました。政府が、赤字をうめるために、お札を大量に刷ったことが原因で、経済も社会も、くずれてしまいます。
        show:
          - { type: title, text: ハイパーインフレ }
          - { type: box, color: pink, w: 1100, text: "**ハイパーインフレ**：1923年ドイツ（1か月で約300倍）・2000年代ジンバブエ。お札の刷りすぎが原因" }
      - say: お金は、刷れば刷るほど、価値が下がる。お金の価値は、信用で成り立っているのです。
        added: true
        show:
          - { type: text, color: gray, text: "お金は刷りすぎると価値が下がる ＝ お金の価値は「信用」" }
