title: 財政と税
scenes:
  - board: whiteboard
    steps:
      - say: 「財政と税」です。財政とは、政府の収入、つまり税金などと、支出、つまり公共サービスや社会保障などのことです。収入が支出を上回ると、財政黒字。下回ると、財政赤字です。赤字が出ると、それを補うために、国債という、国の借金の証書を発行します。
        show:
          - { type: title, text: 財政 }
          - { type: box, color: blue, w: 1100, text: "**財政** ＝ 政府の収入（税）と支出（公共サービス・社会保障）。赤字は **国債**（国の借金）で補う" }

  - board: whiteboard
    steps:
      - say: 税には、いくつかの種類があります。直接税は、払う人が直接納める税で、所得税、法人税、相続税などです。所得が高いほど、税率が高くなる、累進課税なので、お金持ちから、そうでない人へ、お金を分け直すはたらきがあります。
        show:
          - { type: title, text: 直接税と間接税 }
          - { type: box, color: green, w: 1100, title: 直接税（所得税・法人税・相続税）, text: "所得が高いほど税率が高い（**累進課税**）→ 分け直すはたらき" }
      - say: 間接税は、買い物のときに、値段にふくまれる形で払う税で、消費税、酒税、たばこ税などです。消費税は、全員に同じ税率がかかるので、収入の低い人ほど、収入に対する負担の割合が、高くなる性質があります。
        show:
          - { type: box, color: pink, w: 1100, title: 間接税（消費税・酒税・たばこ税）, text: "全員同じ税率 → 収入の低い人ほど負担の割合が高くなる" }

  - board: whiteboard
    steps:
      - say: 財政政策は、政府の支出と、税金の調整で、景気を安定させる政策です。不景気のときは、公共事業などで支出を増やして、景気を元気にします。景気がよすぎるときは、増税や支出の削減で、過熱をおさえます。
        show:
          - { type: title, text: 財政政策 }
          - { type: text, color: blue, text: "不景気 → 支出を増やす（公共事業など）・減税" }
          - { type: text, color: pink, text: "好景気（過熱）→ 支出を減らす・増税" }
      - say: 日銀の金利の調整が金融政策、政府の支出と税の調整が財政政策。この2つが、景気を調整する、車の両輪です。
        added: true
        show:
          - { type: box, color: yellow, w: 1100, text: "景気調整の両輪：**金融政策**（日銀の金利）と **財政政策**（政府の支出と税）" }
