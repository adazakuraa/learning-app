title: 金融と中央銀行
scenes:
  - board: whiteboard
    steps:
      - say: 「金融と中央銀行」です。お金は、どうやって生まれるのでしょう。中央銀行がお札を発行する、というのが、ひとつの答えです。でも実は、銀行がお金を貸すことでも、お金が生まれています。これを、信用創造といいます。
        show:
          - { type: title, text: 信用創造 }
          - { type: text, text: "お金は、銀行が貸すことでも生まれる ＝ **信用創造**" }
      - say: Aさんが、銀行に100万円預けると、銀行は、そのうち1割の10万円を手元に残し、90万円をBさんに貸します。Bさんが、その90万円を別の銀行に預けると、その銀行も1割を残して、81万円をCさんに貸す。これがくり返されると、最初の100万円が、100、90、81と増えていき、理論上は、最大1000万円もの預金が、世の中に出回ることになります。
        show:
          - type: svg
            w: 1100
            h: 220
            markup: |
              <g fill-opacity="0.5" stroke="none"><rect x="40" y="20" width="100" height="180" fill="#f3d77a"/><rect x="190" y="38" width="100" height="162" fill="#f3d77a"/><rect x="340" y="54" width="100" height="146" fill="#f3d77a"/><rect x="490" y="69" width="100" height="131" fill="#f3d77a"/><rect x="640" y="82" width="100" height="118" fill="#f3d77a"/></g>
              <g stroke="none" font-size="22" text-anchor="middle" fill="currentColor"><text x="90" y="215">100</text><text x="240" y="215">90</text><text x="390" y="215">81</text><text x="540" y="215">72.9</text><text x="690" y="215">…</text></g>
              <text x="790" y="110" font-size="24" fill="#9be0b0" stroke="none">合計 → 最大1000万円</text>
      - say: 今のお金の大部分は、銀行が貸すことで生み出された、信用なのです。
        show:
          - { type: box, color: yellow, w: 1000, text: "今のお金の大部分 ＝ 銀行の貸し出しで生まれた「**信用**」" }

  - board: whiteboard
    steps:
      - say: 日本の中央銀行である日本銀行は、物価の安定と、金融のしくみの安定を目的としています。主な道具は、政策金利、つまり、お金を借りるときの利息の調整です。
        show:
          - { type: title, text: 日本銀行と金利 }
          - { type: box, color: blue, w: 1100, text: "**日本銀行**：物価の安定・金融システムの安定。道具は **政策金利** の調整" }
      - say: 金利を下げると、お金を借りやすくなり、企業の投資や、人々の買い物が増えて、景気が元気になります。反対に、金利を上げると、景気が冷えて、インフレがおさえられます。
        show:
          - { type: text, color: green, text: "金利を下げる → 借りやすい → 投資・消費が増える → 景気が元気に" }
          - { type: text, color: pink, text: "金利を上げる → 借りにくい → 景気が冷える → インフレがおさまる" }
      - say: 住宅ローンの金利が上がる、下がる、というニュースも、この日銀の金利の動きと、つながっているのです。
        added: true
        show:
          - { type: text, color: gray, text: "住宅ローンの金利も、日銀の金利とつながっている" }
