  - q: 日本の中央銀行を何というでしょう？
    a: [日本銀行, 日銀]
    r: [にほんぎんこう]
    show: 日本銀行
  - q: 所得が多い人ほど高い税率をかける仕組みを何というでしょう？
    a: [累進課税, 累進課税制度]
    show: 累進課税（制度）
  - q: 政府が税収の不足をおぎなうために発行する借金の証書を何というでしょう？
    a: [国債]
