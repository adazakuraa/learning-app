questions:
  - q: 一定期間に国内で新たに生み出された付加価値の合計を、アルファベット3文字で何というか。
    a: [GDP]
  - q: 原材料費やエネルギー代が上がることで起こるインフレを何というか。
    a: [コストプッシュインフレ, コストプッシュ・インフレ, コストプッシュ]
    show: コストプッシュ・インフレ
  - q: 日本の中央銀行を何というか。
    a: [日本銀行, 日銀]
    r: [にほんぎんこう]
    show: 日本銀行
  - q: 所得が多い人ほど高い税率をかける仕組みを何というか。
    a: [累進課税, 累進課税制度]
    show: 累進課税（制度）
  - q: 政府が税収の不足をおぎなうために発行する借金の証書を何というか。
    a: [国債]
