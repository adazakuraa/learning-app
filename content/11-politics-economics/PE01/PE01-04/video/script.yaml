title: 労働市場と賃金
scenes:
  - board: whiteboard
    steps:
      - say: 「働くことと賃金」です。最低賃金は、政府が決める、給料の下限で、働く人を守るのが目的です。
        show:
          - { type: title, text: 最低賃金をめぐる議論 }
          - { type: box, color: yellow, w: 1100, text: "**最低賃金** ＝ 政府が決める給料の下限（働く人を守る）" }
      - say: 最低賃金を上げると、雇う側の負担が増えて、かえって雇われる人が減ってしまう、という主張があります。一方で、雇用への影響は小さい、という実際のデータにもとづく研究もあり、経済学者の間でも、議論が続いています。
        show:
          - { type: box, color: pink, at: [80, 260], w: 540, title: 心配する意見, text: "上げると雇う側の負担が増え、雇われる人が減る" }
          - { type: box, color: green, at: [660, 260], w: 540, title: 研究の結果も, text: "実際には雇用への影響は小さい、というデータもある" }

  - board: whiteboard
    steps:
      - say: この問題に限らず、経済の問題は、直感が正しいとは限りません。また、社会全体で実験をすることも難しいので、正しい答えを出すのが、とても難しいのです。
        show:
          - { type: title, text: 経済の難しさ }
          - { type: box, color: blue, w: 1100, text: "直感が正しいとは限らない ＋ 社会で実験しにくい → 答えを出すのが難しい" }
      - say: だからこそ、ひとつの意見をうのみにせず、データと、ちがう立場の意見の両方を見ることが、大切になります。
        added: true
        show:
          - { type: text, color: gray, text: "ひとつの意見をうのみにせず、データと反対意見も見る" }
