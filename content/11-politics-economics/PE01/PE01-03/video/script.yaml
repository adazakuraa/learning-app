title: 市場の失敗
scenes:
  - board: whiteboard
    steps:
      - say: 「市場の失敗」です。神の見えざる手は、多くの場合うまくはたらきますが、うまくいかない場面もあります。これを市場の失敗と呼び、政府が手を出す必要が出てきます。4つの例を見ていきましょう。
        show:
          - { type: title, text: ① 独占・寡占 }
          - { type: text, text: "**市場の失敗** ＝ 市場だけではうまくいかない → 政府の出番" }
      - say: ひとつ目は、独占と寡占です。競争相手がいなくなると、企業は、値段を自由に決められます。競争がなければ、品質も上がらず、消費者が損をします。独占禁止法は、これを防ぐための法律です。複数の企業が、話し合って値段を決める、カルテルも禁止されています。
        show:
          - { type: box, color: pink, w: 1100, text: "競争相手がいない → 値段を自由に決められ、品質も上がらない → **独占禁止法**（カルテルも禁止）" }

  - board: whiteboard
    steps:
      - say: ふたつ目は、外部性です。取引が、関係ない人にあたえる影響のことです。工場が川をよごして、近くの住民が被害を受ける。これは、負の外部性です。市場にまかせても解決しないので、政府が、税金や規制で対処する必要があります。
        show:
          - { type: title, text: ② 外部性 }
          - { type: box, color: pink, w: 1100, title: 負の外部性, text: "工場が川をよごす → 住民に被害 → 政府が税・規制で対処" }
      - say: 反対に、ワクチンを打つと、自分だけでなく、まわりの人も、感染症にかかりにくくなります。これは、正の外部性です。この場合は、政府が補助金などを出して、すすめる必要があります。
        show:
          - { type: box, color: green, w: 1100, title: 正の外部性, text: "ワクチン → まわりもかかりにくくなる → 政府が補助金ですすめる" }

  - board: whiteboard
    steps:
      - say: みっつ目は、公共財です。国防、灯台、公園のように、だれかが使っても、ほかの人が使えなくなるわけではなく、お金を払わない人を、しめ出すこともできないもの。民間の企業がつくっても、ただ乗りする人ばかりで、もうかりません。だから、政府が税金でつくる必要があるのです。
        show:
          - { type: title, text: ③ 公共財 }
          - { type: box, color: blue, w: 1100, text: "国防・灯台・公園：みんなで使えて、払わない人もしめ出せない → ただ乗りされる → 税金でつくる" }

  - board: whiteboard
    steps:
      - say: よっつ目は、情報の非対称性です。売り手と買い手の、持っている情報がちがうときにも、市場はうまくいきません。有名なのが、中古車のレモン問題です。
        show:
          - { type: title, text: ④ 情報の非対称性 }
      - say: 売り手は、車の状態をよく知っていますが、買い手はくわしく知りません。だから買い手は、リスクを感じて、高いお金を出そうとしません。すると、状態のよい、少し高い車は売れにくくなり、売る人が減ります。結果、市場には、質の悪い車ばかりが出回ってしまうのです。レモンは、英語の俗語で、欠陥品のことです。
        show:
          - type: svg
            w: 1100
            h: 160
            markup: |
              <g stroke-width="3"><rect x="10" y="40" width="240" height="80" rx="12" stroke="#9aa3ad"/><rect x="290" y="40" width="240" height="80" rx="12" stroke="#9aa3ad"/><rect x="570" y="40" width="240" height="80" rx="12" stroke="#9aa3ad"/><rect x="850" y="40" width="240" height="80" rx="12" stroke="#f4a3b8"/></g>
              <path d="M252 80 H288 M532 80 H568 M812 80 H848" stroke="#9aa3ad"/>
              <g stroke="none" font-size="18" text-anchor="middle"><text x="130" y="75" fill="#e8eef5">買い手は状態を</text><text x="130" y="100" fill="#e8eef5">知らない</text><text x="410" y="75" fill="#e8eef5">高いお金を</text><text x="410" y="100" fill="#e8eef5">出さない</text><text x="690" y="75" fill="#e8eef5">よい車は</text><text x="690" y="100" fill="#e8eef5">売られなくなる</text><text x="970" y="75" fill="#f4a3b8">悪い車ばかりに</text><text x="970" y="100" fill="#f4a3b8">（レモン市場）</text></g>
