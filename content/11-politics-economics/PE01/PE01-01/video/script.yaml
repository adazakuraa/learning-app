title: 経済とは何か・希少性と選択
scenes:
  - board: slide
    steps:
      - say: 政治・経済の最初の章、「ミクロ経済」です。
        show:
          - { type: title, text: 第1章　ミクロ経済 }
      - say: 経済とは何か。値段はどう決まるのか。市場がうまくいかないのはどんなときか。そして、働くことと賃金について学びます。
        show:
          - type: list
            items: ["経済とは何か・希少性と選択", "需要と供給・市場価格", "市場の失敗", "労働市場と賃金"]
      - say: 毎日の買い物、仕事選び、物の値段。私たちの暮らしは、経済のしくみの中にあります。ニュースの経済の話が、自分ごととして見えるようになりましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "値段や市場のしくみを知り、経済のニュースを自分ごととして読む" }

  - board: whiteboard
    steps:
      - say: 経済学とは、限りのある資源を、人々にどう分けるかを研究する学問です。出発点は、希少性です。人間の欲しいものは限りがないのに、資源には限りがある。だから、何かを手に入れるには、何かをあきらめなければなりません。
        show:
          - { type: title, text: 希少性と選択 }
          - { type: box, color: yellow, w: 1100, text: "**経済学** ＝ 限りある資源をどう分けるか。欲望は無限、資源は有限 → 何かをあきらめる" }

  - board: whiteboard
    steps:
      - say: 機会費用は、経済学で最も大切な考え方のひとつで、ある選択をしたとき、あきらめた、いちばんよい選択肢の価値のことです。
        show:
          - { type: title, text: 機会費用 }
          - { type: box, color: blue, w: 1100, text: "**機会費用** ＝ 選ばなかった、いちばんよい選択肢の価値" }
      - say: 例えば、大学に行くコストは、授業料だけではありません。その4年間、働いていればもらえたはずの給料も、コストにふくまれるのです。
        show:
          - type: svg
            w: 1000
            h: 160
            markup: |
              <rect x="40" y="30" width="300" height="100" rx="14" stroke="#8fc4ff"/><rect x="620" y="30" width="340" height="100" rx="14" stroke="#f4a3b8" stroke-dasharray="8 6"/>
              <g stroke="none" font-size="24" text-anchor="middle"><text x="190" y="75" fill="#8fc4ff">大学に行く</text><text x="190" y="108" font-size="18" fill="#8fc4ff">授業料</text><text x="790" y="75" fill="#f4a3b8">働いていたら…</text><text x="790" y="108" font-size="18" fill="#f4a3b8">もらえた給料 ＝ 機会費用</text></g>
      - say: 休日に、ゴロゴロして過ごすことの機会費用は、その時間でできたかもしれない、何か別の楽しいことです。何かを選ぶたびに、見えないコストがかかっているのです。
        added: true
        show:
          - { type: text, color: gray, text: "何かを選ぶたびに、見えないコストがかかっている" }

  - board: whiteboard
    steps:
      - say: 経済学は、大きく、ミクロ経済学とマクロ経済学に分かれます。ミクロ経済学は、一人ひとりの消費者や、企業、市場の行動を分析します。マクロ経済学は、GDPや物価、失業率など、経済全体を分析します。
        show:
          - { type: title, text: ミクロとマクロ }
          - { type: box, color: green, at: [80, 140], w: 540, title: ミクロ経済学, text: "消費者・企業・市場（虫の目）" }
          - { type: box, color: blue, at: [660, 140], w: 540, title: マクロ経済学, text: "GDP・物価・失業率など経済全体（鳥の目）" }
      - say: 経済学は、こうすべき、を決める学問ではなく、こうなる、を予測する学問です。ただ、どうすべきか、という価値の判断も、少しはふくまれます。経済学者の意見が分かれるのは、事実の見方だけでなく、価値観のちがいによることもあるのです。
        show:
          - { type: text, at: [80, 360], w: 1120, color: gray, text: "経済学は「こうなる」を予測する。意見が分かれるのは、価値観のちがいのことも" }
