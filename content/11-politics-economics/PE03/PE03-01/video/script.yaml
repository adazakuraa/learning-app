title: 戦後日本経済の歩み
scenes:
  - board: slide
    steps:
      - say: 第3章、「日本経済」です。
        show:
          - { type: title, text: 第3章　日本経済 }
      - say: 戦後の日本経済の歩みと、今の財政の問題を学びます。
        show:
          - type: list
            items: ["戦後日本経済の歩み", "日本の財政問題"]
      - say: 焼け野原からの復活、バブル、そして失われた30年。私たちが生きてきた時代の、経済の流れをつかみましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "戦後日本経済の流れと、今の課題をつかむ" }

  - board: whiteboard
    steps:
      - say: 戦争に負けた直後の日本は、産業の土台が、こわれていました。でも、1950年の朝鮮戦争で、軍事物資などの注文が増えた、朝鮮特需をきっかけに、経済が活気づきます。そして、1955年から1973年までの、およそ20年間、年平均10パーセント前後の成長を続ける、高度経済成長をなしとげました。
        show:
          - { type: title, text: 高度経済成長 }
          - type: svg
            w: 1100
            h: 180
            markup: |
              <path d="M40 140 H1060" stroke="#9aa3ad"/>
              <path d="M60 135 L180 125 L300 95 L420 60 L540 35 L560 32 L640 70 L760 60 L880 30 L900 28 L940 80 L1060 85" stroke="#f3d77a" stroke-width="4"/>
              <g stroke="none" font-size="18" text-anchor="middle"><text x="120" y="170" fill="#9aa3ad">1950 特需</text><text x="400" y="170" fill="#9be0b0">高度成長 1955〜73</text><text x="620" y="170" fill="#9aa3ad">石油危機</text><text x="880" y="170" fill="#f4a3b8">バブル</text><text x="1010" y="170" fill="#8fc4ff">失われた30年</text></g>
      - say: 暮らしは急速に豊かになりましたが、一方で、水俣病や、四日市ぜんそくなどの、公害の問題が深刻になりました。
        show:
          - { type: text, color: pink, text: "豊かになる一方、**公害**（水俣病・四日市ぜんそく）が深刻に" }

  - board: whiteboard
    steps:
      - say: 1973年と79年の、オイルショックで、高度成長は終わりましたが、その後も、安定成長を続けました。ちなみに日本は、高度成長期の1968年には、すでに世界第2位の経済大国になっていました。
        show:
          - { type: title, text: バブル経済 }
          - { type: text, text: "1973・79年 **オイルショック** → 安定成長へ（1968年にはすでに世界第2位の経済大国）" }
      - say: 1980年代後半のバブル経済は、土地や株の値段が、実際の価値をこえて、ふくらんだ時期です。土地の値段は必ず上がる、という土地神話が信じられ、土地を担保にお金を借りて、さらに土地や株を買う、という循環が生まれました。
        show:
          - { type: box, color: yellow, w: 1100, title: バブル経済（1980年代後半）, text: "「土地は必ず上がる」→ 借金して土地・株を買う → 値段が実力以上にふくらむ" }
      - say: 1989年から90年の、日銀の急な利上げや、不動産への融資の規制をきっかけに、1990年代のはじめにバブルははじけ、土地や株の値段が急落しました。
        show:
          - { type: text, color: pink, text: "日銀の急な利上げ・融資の規制 → 1990年代はじめにバブル崩壊" }

  - board: whiteboard
    steps:
      - say: バブル崩壊のあとの、失われた30年は、不良債権の処理の遅れ、デフレ、少子化、企業の借金のしすぎが重なり、経済の停滞が長く続いた時期です。この間に、多くの産業で、中国や韓国に追いぬかれました。
        show:
          - { type: title, text: 失われた30年 }
          - { type: box, color: blue, w: 1100, text: "不良債権処理の遅れ・デフレ・少子化・過剰債務 → 長い停滞。多くの産業で中国・韓国に追いぬかれる" }
