title: 日本の財政問題
scenes:
  - board: whiteboard
    steps:
      - say: 「日本の財政問題」です。問題の中心は、少子高齢化と、社会保障の費用の急増です。
        show:
          - { type: title, text: 少子高齢化 }
          - { type: text, text: "中心にある問題：**少子高齢化** と社会保障費の急増" }
      - say: 日本の人口は、2008年をピークに減り続けていて、2070年には、およそ8700万人になると推計されています。65歳以上の割合は、今およそ29パーセントで、世界最高の水準。2040年代には、およそ35パーセントになると予測されています。
        show:
          - type: svg
            w: 1000
            h: 200
            markup: |
              <path d="M40 170 H960" stroke="#9aa3ad"/>
              <path d="M60 120 Q300 40 400 40 Q700 60 940 130" stroke="#8fc4ff" stroke-width="4"/>
              <circle cx="400" cy="40" r="8" fill="#f3d77a" stroke="none"/>
              <g stroke="none" font-size="20"><text x="370" y="25" fill="#f3d77a">2008年 ピーク</text><text x="830" y="160" fill="#8fc4ff">2070年 約8700万人</text></g>
          - { type: text, color: yellow, text: "65歳以上：今 約29％（世界最高水準）→ 2040年代 約35％" }
      - say: 支える働き手が減り、支えられる高齢者が増える。年金や医療の費用が増える一方で、税や保険料を払う人は減っていくのです。
        added: true
        show:
          - { type: text, color: gray, text: "支える人が減り、支えられる人が増える" }

  - board: whiteboard
    steps:
      - say: 国の借金、国債が増え続ける中、消費税の増税、社会保障の削減、移民の受け入れなどが、選択肢として議論されていますが、どれも、政治的に難しい決断をともないます。
        show:
          - { type: title, text: 国の借金をどう見るか }
          - { type: text, text: "選択肢：消費税の増税・社会保障の削減・移民の受け入れ → どれも難しい決断" }
      - say: 一方で、国の借金の見方には、慎重な議論が必要です。日本の国債は、およそ9割が国内で持たれていて、外国から借りていたギリシャのような国とは、状況がちがいます。
        show:
          - { type: box, color: green, w: 1100, text: "日本の国債は約9割が国内で保有 → 外国から借りたギリシャ（2015年に返済できず）とはちがう" }
      - say: とはいえ、これは、将来の世代に、借金を先送りしているような状態であり、財政の悪化が続けば、いずれ信用を失うリスクがあることは、否定できません。
        show:
          - { type: box, color: pink, w: 1100, text: "それでも将来世代への先送り。悪化が続けば信用を失うリスクも" }
