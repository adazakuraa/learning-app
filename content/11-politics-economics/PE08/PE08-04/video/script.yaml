title: 現代の人権問題
scenes:
  - board: whiteboard
    steps:
      - say: 「現代の人権問題」です。憲法がつくられたときには、考えられていなかった、新しい人権の問題が、今、重要になっています。
        show:
          - { type: title, text: プライバシーと忘れられる権利 }
      - say: プライバシー権は、私生活を公開されない権利から発展して、今では、自分に関する情報を、自分でコントロールする権利として、議論されています。SNSや、ビッグデータ、AIの監視カメラの広がりで、個人情報の問題は、深刻になっています。
        read: プライバシー権は、私生活を公開されない権利から発展して、今では、自分に関する情報を、自分でコントロールする権利として、議論されています。エスエヌエスや、ビッグデータ、エーアイの監視カメラの広がりで、個人情報の問題は、深刻になっています。
        show:
          - { type: box, color: blue, w: 1100, title: プライバシー権, text: "私生活を公開されない権利 → 自分の情報を自分でコントロールする権利（SNS・ビッグデータ・AIカメラ）" }
      - say: 忘れられる権利は、インターネット上の、自分に関する情報の削除を求める権利で、EUでは認められています。過去の失敗が、永久にネットに残ってしまう問題と、表現の自由や、知る権利とのバランスが、問われています。
        read: 忘れられる権利は、インターネット上の、自分に関する情報の削除を求める権利で、イーユーでは認められています。過去の失敗が、永久にネットに残ってしまう問題と、表現の自由や、知る権利とのバランスが、問われています。
        show:
          - { type: box, color: green, w: 1100, title: 忘れられる権利, text: "ネット上の自分の情報の削除を求める（EUで認められる）。表現の自由・知る権利とのバランス" }

  - board: whiteboard
    steps:
      - say: 知る権利は、国民が、政府の持つ情報を知ることができる権利で、情報公開制度の根拠となっています。政府の決め方が、かくされないための、大切な権利です。
        show:
          - { type: title, text: 知る権利と環境権 }
          - { type: box, color: yellow, w: 1100, title: 知る権利, text: "政府の情報を知る権利 → **情報公開制度**。政府の決め方をかくさせない" }
      - say: 環境権は、よい環境の中で暮らす権利です。憲法に、はっきりとは書かれていませんが、日当たりを守る日照権などが、認められています。
        show:
          - { type: box, color: green, w: 1100, title: 環境権, text: "よい環境で暮らす権利。憲法に明記はないが、**日照権** などが認められている" }
      - say: 社会が変われば、守るべき人権も変わっていく。人権は、時代とともに育っていくものなのです。
        added: true
        show:
          - { type: text, color: gray, text: "人権は、時代とともに育っていく" }
