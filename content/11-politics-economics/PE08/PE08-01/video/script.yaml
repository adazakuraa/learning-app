title: 基本的人権の種類
scenes:
  - board: slide
    steps:
      - say: 第8章、「基本的人権と法」です。
        show:
          - { type: title, text: 第8章　基本的人権と法 }
      - say: 基本的人権の種類、法律の種類、裁判のしくみ、そして、今の時代の新しい人権を学びます。
        show:
          - type: list
            items: ["基本的人権の種類", "法の種類", "裁判の仕組み", "現代の人権問題"]
      - say: 契約、トラブル、裁判員。法律の知識は、自分の身を守り、社会に参加するための、大切な道具です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "自分を守り、社会に参加するための法の知識を持つ" }

  - board: whiteboard
    steps:
      - say: 基本的人権は、日本国憲法で、侵すことのできない、永久の権利、と定められています。
        show:
          - { type: title, text: 社会権 }
          - { type: text, text: "基本的人権 ＝「侵すことのできない永久の権利」" }
      - say: 社会権は、人間らしい生活を送れるように、国に、積極的に関わることを求める権利です。憲法25条の、健康で文化的な最低限度の生活を営む、生存権。教育を受ける権利。働く権利。そして、労働基本権です。
        show:
          - { type: box, color: yellow, w: 1100, title: 生存権（第25条）, text: "「健康で文化的な最低限度の生活を営む権利」" }
          - { type: text, color: blue, text: "教育を受ける権利・勤労の権利" }
      - say: 労働基本権は、労働組合をつくる団結権、会社と話し合う団体交渉権、ストライキなどを行う団体行動権の、3つです。働く人一人ひとりは弱い立場なので、まとまって会社と対等に話せるように、認められているのです。
        show:
          - { type: box, color: green, w: 1100, title: 労働基本権, text: "団結権（組合をつくる）・団体交渉権（話し合う）・団体行動権（ストライキ）" }

  - board: whiteboard
    steps:
      - say: 憲法に定められた、国民の義務は、子どもに教育を受けさせる義務、働く義務、税金を納める義務の、3つだけです。
        show:
          - { type: title, text: 国民の三大義務 }
          - { type: text, color: pink, text: "義務は3つだけ：子どもに教育を受けさせる義務・勤労の義務・納税の義務" }
      - say: なお、基本的人権は、義務を果たしたごほうびではなく、人として生まれながらに持っているものです。義務を果たさない人の人権は守らなくていい、ということには、ならないのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "人権は義務のごほうびではなく、生まれながらに持つもの" }
