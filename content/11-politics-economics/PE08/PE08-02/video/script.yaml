title: 法の種類
scenes:
  - board: whiteboard
    steps:
      - say: 「法の種類」です。民法は、個人や企業どうしの関係を決める法律で、契約、損害の賠償、相続などをあつかいます。物の売り買いのような、毎日の生活の法律関係は、ほとんど民法で決まっています。
        show:
          - { type: title, text: 民法と刑法 }
          - { type: box, color: blue, w: 1100, title: 民法, text: "個人・企業どうしの関係（契約・損害賠償・相続）。日常の法律関係のほとんど" }
      - say: 刑法は、犯罪と刑罰を定める法律です。殺人、窃盗、詐欺などを、犯罪として定め、罰を決めています。刑法は、国が、条件つきで国民の自由をうばえることを定めたもの、と言うこともできます。だからこそ、何が犯罪かは、あらかじめ法律で決めておかなければならないのです。これを、罪刑法定主義といいます。
        show:
          - { type: box, color: pink, w: 1100, title: 刑法, text: "犯罪と刑罰を定める。何が犯罪かは前もって法律で決める（**罪刑法定主義**）" }

  - board: whiteboard
    steps:
      - say: 商法や会社法は、企業の活動に関する法律です。行政法は、国と国民の関係を決める法律のまとまりで、税法、建築基準法、道路交通法などがふくまれます。
        show:
          - { type: title, text: そのほかの法 }
          - { type: box, color: green, w: 1100, title: 商法・会社法, text: "企業の活動に関する法律" }
          - { type: box, color: yellow, w: 1100, title: 行政法, text: "国と国民の関係（税法・建築基準法・道路交通法など）" }
      - say: 法律は、遠いものではなく、買い物から、運転、相続まで、毎日の暮らしを、すみずみまで支えているのです。
        added: true
        show:
          - { type: text, color: gray, text: "買い物・運転・相続… 法律は毎日の暮らしを支えている" }
