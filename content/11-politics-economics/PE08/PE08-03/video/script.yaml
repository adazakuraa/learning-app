title: 裁判の仕組み
scenes:
  - board: whiteboard
    steps:
      - say: 「裁判のしくみ」です。民事裁判は、個人や企業どうしの争い、例えば、お金の貸し借り、離婚、損害の賠償などを解決する手続きです。訴えた原告と、訴えられた被告が争い、裁判所が判決を下します。相手を罰するのではなく、権利や義務の関係を、はっきりさせるものです。
        show:
          - { type: title, text: 民事裁判と刑事裁判 }
          - { type: box, color: blue, w: 1100, title: 民事裁判, text: "個人・企業どうしの争い（お金・離婚・損害賠償）。原告 vs 被告。罰ではなく権利関係を決める" }
      - say: 刑事裁判は、犯罪の疑いがある被告人を、検察官が訴え、有罪か無罪かを判断する手続きです。疑わしきは罰せず、が基本で、証拠がなければ、有罪にはできません。
        show:
          - { type: box, color: pink, w: 1100, title: 刑事裁判, text: "検察官が被告人を訴え、有罪・無罪を判断。「**疑わしきは罰せず**」" }

  - board: whiteboard
    steps:
      - say: 一つの事件について、3回まで裁判を受けられます。三審制といいます。例えば、地方裁判所の判決に不服なら、控訴して高等裁判所へ。それでも不服なら、上告して最高裁判所へ、という流れです。
        show:
          - { type: title, text: 三審制と裁判員制度 }
          - type: svg
            w: 1000
            h: 150
            markup: |
              <g stroke-width="3"><rect x="20" y="40" width="240" height="70" rx="12" stroke="#9be0b0"/><rect x="380" y="40" width="240" height="70" rx="12" stroke="#8fc4ff"/><rect x="740" y="40" width="240" height="70" rx="12" stroke="#f3d77a"/></g>
              <path d="M265 75 H375 M360 65 L375 75 L360 85 M625 75 H735 M720 65 L735 75 L720 85" stroke="#9aa3ad"/>
              <g stroke="none" font-size="24" text-anchor="middle"><text x="140" y="85" fill="#9be0b0">地方裁判所</text><text x="500" y="85" fill="#8fc4ff">高等裁判所</text><text x="860" y="85" fill="#f3d77a">最高裁判所</text><text x="320" y="135" font-size="18" fill="#9aa3ad">控訴</text><text x="680" y="135" font-size="18" fill="#9aa3ad">上告</text></g>
      - say: 裁判員制度は、2009年から始まった制度で、重大な刑事事件の、最初の裁判に、ふつうの市民が参加し、裁判官といっしょに、有罪か無罪か、そして刑の重さを決めます。裁判員を務めるのは国民の義務で、正当な理由がなければ、断れません。
        show:
          - { type: box, color: yellow, w: 1100, title: 裁判員制度（2009年〜）, text: "重大な刑事事件の第一審に市民が参加し、裁判官と有罪・無罪と刑を決める" }

  - board: whiteboard
    steps:
      - say: 日本の刑事裁判の有罪率は、およそ99.9パーセントで、ほかの国と比べて、とても高いことが、問題として指摘されています。検察が、有罪にできると確信した事件だけを起訴するためですが、起訴されたら、ほぼ有罪、という状況は、えん罪のリスクを考えると、問題でもあります。
        show:
          - { type: title, text: 有罪率99.9％ }
          - { type: box, color: pink, w: 1100, text: "有罪率 約99.9％：確実な事件だけ起訴するため。でも「起訴 ＝ ほぼ有罪」はえん罪のリスクも" }
