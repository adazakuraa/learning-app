title: 民主主義とは何か
scenes:
  - board: slide
    steps:
      - say: 第6章、「民主主義と政治の基本」です。
        show:
          - { type: title, text: 第6章　民主主義と政治の基本 }
      - say: 民主主義とは何か。国家とは何か。権力をどう分けるか。そして、選挙のしくみを学びます。
        show:
          - type: list
            items: ["民主主義とは何か", "国家の三要素と主権", "権力分立と三権分立", "選挙制度と投票"]
      - say: 当たり前に思える民主主義が、どんなしくみで、何を守っているのか。選挙で一票を投じるときの、土台になる知識です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "民主主義のしくみを知り、一票の意味を考える土台をつくる" }

  - board: whiteboard
    steps:
      - say: 民主主義とは、政治の権力は国民にある、という考え方です。当たり前に感じますが、人類の歴史のほとんどは、王や皇帝、独裁者による支配でした。今でも、自由で公正な民主主義の国と評価されるのは、世界の半分以下です。
        show:
          - { type: title, text: 民主主義 }
          - { type: box, color: yellow, w: 1100, text: "**民主主義** ＝ 政治の権力は国民にある（今でも、自由で公正な民主主義国は世界の半分以下）" }
      - say: 民主主義には2種類あります。直接民主制は、市民が直接、政治の決定に参加する形で、古代ギリシャで行われましたが、人口の少ない、小さな社会でしか、うまくいきません。間接民主制は、市民が代表者を選挙で選び、代表者が決める形で、今のほとんどの民主主義の国が、これを採用しています。
        show:
          - { type: box, color: blue, at: [80, 300], w: 540, title: 直接民主制, text: "市民が直接決める（古代ギリシャ）。小さな社会向け" }
          - { type: box, color: green, at: [660, 300], w: 540, title: 間接民主制, text: "代表者を選んで決めてもらう（今の多くの国）" }

  - board: whiteboard
    steps:
      - say: 民主主義の本質は、多数決で決める、だけではありません。多数派が、少数派の権利をふみにじる、多数派の暴政を防ぐために、基本的人権の保障、法の支配、権力の分立、というしくみが必要です。
        show:
          - { type: title, text: 多数決だけではない }
          - { type: box, color: pink, w: 1100, text: "多数派が少数派をふみにじる「**多数派の暴政**」を防ぐ → **人権の保障・法の支配・権力分立**" }
      - say: イギリスの首相チャーチルは、民主主義は最悪の政治の形だ、ただし、これまでに試された、ほかのすべての形をのぞけば、と言いました。民主主義は不完全だけれど、ほかよりはましだ、という意味です。
        show:
          - { type: box, color: gray, w: 1100, text: "チャーチル：「民主主義は最悪の政治形態だ。ただし、ほかのすべての形態をのぞけば」" }
