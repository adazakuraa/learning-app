title: 権力分立と三権分立
scenes:
  - board: whiteboard
    steps:
      - say: 「権力分立」です。権力が一か所に集まると、必ずといっていいほど、腐敗や乱用が起きます。そこで、権力を分けて、おたがいに見張り、制限し合うしくみが、権力分立です。フランスの思想家モンテスキューは、著書『法の精神』で、三権分立をまとめました。
        show:
          - { type: title, text: 三権分立 }
          - type: svg
            w: 1000
            h: 330
            markup: |
              <g stroke-width="3"><rect x="350" y="10" width="300" height="90" rx="14" stroke="#f3d77a"/><rect x="40" y="220" width="300" height="90" rx="14" stroke="#8fc4ff"/><rect x="660" y="220" width="300" height="90" rx="14" stroke="#f4a3b8"/></g>
              <path d="M420 100 L260 220 M580 100 L740 220 M340 265 H660" stroke="#9aa3ad"/>
              <g stroke="none" text-anchor="middle"><text x="500" y="52" font-size="28" fill="#f3d77a">立法：国会</text><text x="500" y="85" font-size="18" fill="#f3d77a">法律をつくる</text><text x="190" y="262" font-size="28" fill="#8fc4ff">行政：内閣</text><text x="190" y="295" font-size="18" fill="#8fc4ff">国を運営する</text><text x="810" y="262" font-size="28" fill="#f4a3b8">司法：裁判所</text><text x="810" y="295" font-size="18" fill="#f4a3b8">争いを裁く</text></g>
      - say: 立法権は、法律をつくる権力で、国会が担います。行政権は、法律にもとづいて国を運営する権力で、内閣が担います。司法権は、法律を当てはめて争いを解決する権力で、裁判所が担います。
        show:
          - { type: text, color: gray, text: "モンテスキュー『法の精神』" }

  - board: whiteboard
    steps:
      - say: 三つの権力は、おたがいをチェックし合います。日本では、衆議院は、内閣不信任決議で、内閣の責任を問うことができ、反対に、内閣は、衆議院を解散することができます。
        show:
          - { type: title, text: おたがいのチェック }
          - { type: text, color: yellow, text: "国会（衆議院）→ 内閣：**内閣不信任決議**　／　内閣 → 衆議院：**解散**" }
      - say: 内閣は、最高裁判所の長官を指名し、そのほかの裁判官を任命します。問題のある裁判官をやめさせる、弾劾裁判は、国会が行います。そして、裁判所は、国会がつくった法律が、憲法に違反していないかを審査します。これを、違憲立法審査権といいます。
        show:
          - { type: text, color: blue, text: "内閣 → 裁判所：最高裁長官を指名、裁判官を任命" }
          - { type: text, color: blue, text: "国会 → 裁判官：**弾劾裁判**（問題のある裁判官をやめさせる）" }
          - { type: text, color: pink, text: "裁判所 → 国会・内閣：**違憲立法審査権**（法律が憲法に反していないか）" }

  - board: whiteboard
    steps:
      - say: 権力分立の考えは、人間は権力を持つと、悪用する、という、人間への疑いから生まれています。人の善意より、しくみを信頼する。これが、今の民主主義の、根っこにある考え方です。
        show:
          - { type: title, text: 善意より、しくみ }
          - { type: box, color: yellow, w: 1100, text: "「人は権力を持つと悪用する」→ 人の善意より、しくみを信頼する" }
