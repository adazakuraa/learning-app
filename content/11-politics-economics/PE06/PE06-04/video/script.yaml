title: 選挙制度と投票
scenes:
  - board: whiteboard
    steps:
      - say: 「選挙制度」です。選挙は民主主義の根っこですが、どんな制度を選ぶかで、政治の形が大きく変わります。
        show:
          - { type: title, text: 小選挙区制と比例代表制 }
      - say: 小選挙区制は、ひとつの選挙区から、ひとりだけを選ぶ制度です。1位だけが当選するので、大きな政党に有利で、二大政党制になりやすく、政権が安定しやすい反面、少数の意見が反映されにくくなります。イギリスやアメリカが採用しています。
        show:
          - { type: box, color: blue, w: 1100, title: 小選挙区制（イギリス・アメリカ）, text: "1区1人。大政党に有利 → 二大政党・政権が安定。少数意見は反映されにくい" }
      - say: 比例代表制は、政党の得票の割合に応じて、議席を分ける制度です。いろいろな意見を、はば広く反映できますが、小さな政党が乱立して、政権が不安定になりやすい面があります。オランダやイスラエルなどが採用しています。
        show:
          - { type: box, color: green, w: 1100, title: 比例代表制（オランダ・イスラエル）, text: "得票の割合で議席を分ける。民意を広く反映。小党が乱立し不安定になりやすい" }

  - board: whiteboard
    steps:
      - say: 日本の衆議院は、小選挙区と、比例代表を組み合わせた、並立制で、小選挙区289議席と、比例代表176議席です。
        show:
          - { type: title, text: 日本の制度と死票 }
          - { type: text, color: yellow, text: "日本の衆議院：**小選挙区比例代表並立制**（小選挙区289 ＋ 比例代表176）" }
      - say: 選挙制度が、政治を左右する典型が、死票の問題です。小選挙区制では、2位以下の候補への票は、すべて死票、つまり議席に結びつかない票になります。例えば、40パーセントほどの支持しかなくても、1位であれば当選できます。過半数の人が反対した候補でも、当選しうるのです。
        show:
          - type: svg
            w: 1000
            h: 160
            markup: |
              <g stroke="none"><rect x="40" y="40" width="400" height="60" fill="#f3d77a" fill-opacity="0.7"/><rect x="440" y="40" width="350" height="60" fill="#9aa3ad" fill-opacity="0.5"/><rect x="790" y="40" width="250" height="60" fill="#9aa3ad" fill-opacity="0.3"/></g>
              <g stroke="none" font-size="22"><text x="150" y="80" fill="#1b2a24">Aさん 40％ 当選</text><text x="500" y="80" fill="#e8eef5">Bさん 35％</text><text x="840" y="80" fill="#e8eef5">Cさん 25％</text><text x="460" y="140" fill="#f4a3b8">60％が死票</text></g>
      - say: どの制度も、完ぺきではありません。安定か、民意の反映か。何を大事にするかの、トレードオフがあるのです。
        show:
          - { type: box, color: gray, w: 1000, text: "完ぺきな制度はない。安定か、民意の反映か、のトレードオフ" }
