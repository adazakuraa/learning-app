questions:
  - q: 国家の三要素は、領土、国民と、もう1つは何か。
    a: [主権]
  - q: 沿岸から200海里までの、漁業や資源の権利が認められる水域を何というか。
    a: [排他的経済水域, EEZ]
    show: 排他的経済水域（EEZ）
  - q: 『法の精神』で三権分立を体系化したフランスの思想家は誰か。
    a: [モンテスキュー]
  - q: 1つの選挙区から1人だけを選ぶ選挙制度を何というか。
    a: [小選挙区制]
  - q: 選挙で落選した候補者に投じられ、議席に結びつかなかった票を何というか。
    a: [死票]
