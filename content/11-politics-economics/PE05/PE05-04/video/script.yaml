title: ゲーム理論
scenes:
  - board: slide
    steps:
      - say: 第5章、「現代の経済的課題」です。
        show:
          - { type: title, text: 第5章　現代の経済的課題 }
      - say: 相手の出方を読み合う状況を分析する、ゲーム理論を学びます。
        show:
          - type: list
            items: ["ゲーム理論"]
      - say: 一人ひとりが自分にとって最善を選ぶと、なぜか全員が損をしてしまう。社会の多くの問題に、このしくみがかくれています。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "「みんなが合理的なのに、みんなが損する」しくみを知る" }

  - board: whiteboard
    steps:
      - say: ゲーム理論は、何人かの決める人、プレイヤーが、おたがいの行動を意識しながら、決める状況を分析する、数学の理論です。経済学、政治学、生物学、軍事の戦略など、はば広い分野で使われています。
        show:
          - { type: title, text: 囚人のジレンマ }
          - { type: text, text: "**ゲーム理論**：相手の行動を意識しながら決める状況を分析する" }
      - say: 最も有名な例が、囚人のジレンマです。2人の容疑者、AとBが、連絡をとれない状態で、自白するか、黙秘するかを選びます。
        show:
          - { type: image, src: 1000003214.webp, at: [80, 190], w: 600 }
      - say: 2人とも黙秘すれば、それぞれ懲役2年。2人とも自白すれば、それぞれ懲役5年。片方だけが自白すると、自白した側は釈放され、黙秘した側が、懲役10年になります。
        show:
          - { type: text, at: [730, 210], w: 480, color: green, text: "2人とも黙秘 → 2年ずつ" }
          - { type: text, at: [730, 280], w: 480, color: pink, text: "2人とも自白 → 5年ずつ" }
          - { type: text, at: [730, 350], w: 480, color: yellow, text: "片方だけ自白 → 自白した側は釈放、黙秘した側は10年" }

  - board: whiteboard
    steps:
      - say: Aの立場で考えてみましょう。Bが黙秘するなら、自分も黙秘で2年、自白すれば釈放。Bが自白するなら、黙秘で10年、自白で5年。どちらの場合も、自白したほうが得です。Bも同じように考えるので、2人とも自白します。
        read: エーの立場で考えてみましょう。ビーが黙秘するなら、自分も黙秘で2年、自白すれば釈放。ビーが自白するなら、黙秘で10年、自白で5年。どちらの場合も、自白したほうが得です。ビーも同じように考えるので、2人とも自白します。
        show:
          - { type: title, text: 合理的なのに損をする }
          - { type: text, color: blue, text: "Bが黙秘なら → 自白（釈放）のほうが得" }
          - { type: text, color: blue, text: "Bが自白なら → 自白（5年）のほうが得（黙秘だと10年）" }
          - { type: text, color: yellow, text: "→ どちらでも自白が得 → 2人とも自白" }
      - say: 結果、2人とも5年。2人で協力して黙秘していれば、2年ずつですんだのに、それより悪い結果になってしまうのです。
        show:
          - { type: box, color: pink, w: 1100, text: "結果：2人とも5年。協力すれば2年ずつだったのに、より悪い結果に" }

  - board: whiteboard
    steps:
      - say: 囚人のジレンマは、現実の多くの問題を説明します。
        show:
          - { type: title, text: 身のまわりのジレンマ }
      - say: 軍拡競争。両方の国が軍備を減らせば、どちらも得をするのに、自分だけ減らすと危険なので、減らせない。環境問題。各国が排出を減らせば、全員が得をするのに、自分の国だけ減らすと損をする。値下げ競争も、同じ構図です。
        show:
          - { type: box, color: blue, w: 1100, title: 軍拡競争, text: "おたがい減らせば得。でも自分だけ減らすと危険 → 減らせない" }
          - { type: box, color: green, w: 1100, title: 環境問題, text: "みんなで減らせば得。でも自分だけ減らすと損 → 減らせない" }
      - say: 抜け出すには、くり返しつき合う関係や、約束を守らせるルール、信頼が大切になります。国際的な条約や、取り決めは、そのためにあるのです。
        added: true
        show:
          - { type: text, color: yellow, text: "抜け出すカギ：くり返しの関係・約束を守らせるルール・信頼（国際条約）" }
