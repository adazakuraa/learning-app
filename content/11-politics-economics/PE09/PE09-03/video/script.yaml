title: 日本の外交と安全保障
scenes:
  - board: whiteboard
    steps:
      - say: 「日本の外交と安全保障」です。日本の安全保障の基本は、日米安保条約です。1951年に結ばれ、1960年に改定されました。アメリカが日本を守る義務を負い、日本はアメリカ軍に基地を提供する、という、非対称な同盟関係です。
        show:
          - { type: title, text: 日米安保条約 }
          - { type: box, color: blue, w: 1100, text: "**日米安保条約**（1951年、1960年改定）：アメリカが日本を守る ⇔ 日本が基地を提供" }
      - say: 日本にあるアメリカ軍の基地は、沖縄に集中していて、その割合は、およそ7割にのぼります。地元の負担が、長年の課題になっています。
        show:
          - { type: text, color: pink, text: "在日米軍基地の約7割が沖縄に集中 → 地元の負担が長年の課題" }

  - board: whiteboard
    steps:
      - say: 自衛隊は、1954年につくられた、日本の実質的な防衛組織で、憲法9条との関係をめぐって、合憲か違憲か、の議論が続いています。政府の見解は、自衛のための必要最小限の実力組織は、9条が禁じる戦力には当たらない、というものです。
        show:
          - { type: title, text: 自衛隊と集団的自衛権 }
          - { type: box, color: green, w: 1100, title: 自衛隊（1954年〜）, text: "政府見解：自衛のための必要最小限の実力は、9条の「戦力」に当たらない" }
      - say: 2015年に成立した安全保障関連法で、集団的自衛権、つまり、同盟国が攻撃されたときに、いっしょに反撃する権利を、限られた条件で使えるようになりました。それまでの、集団的自衛権は憲法上使えない、という政府の見解からの、大きな転換で、賛否が分かれています。
        show:
          - { type: box, color: yellow, w: 1100, title: 安全保障関連法（2015年）, text: "**集団的自衛権**（同盟国への攻撃にいっしょに反撃）を限定的に認める → 大転換、賛否が分かれる" }
