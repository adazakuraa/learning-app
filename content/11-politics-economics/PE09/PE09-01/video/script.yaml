title: 国際社会の仕組み
scenes:
  - board: slide
    steps:
      - say: 第9章、「国際政治」です。
        show:
          - { type: title, text: 第9章　国際政治 }
      - say: 国際社会のしくみ、国際連合、そして日本の外交と安全保障を学びます。
        show:
          - type: list
            items: ["国際社会の仕組み", "国際連合の役割と限界", "日本の外交と安全保障"]
      - say: 戦争や紛争のニュースを見たとき、なぜ止められないのか、という疑問に、しくみの面から答えられるようになります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "国際社会のしくみを知り、紛争のニュースを読みとく" }

  - board: whiteboard
    steps:
      - say: 国内には、警察や裁判所、刑務所があり、ルールを破った人を、強制的に罰することができます。でも、国際社会には、そのような世界の警察がありません。この状態を、国際社会のアナーキー、つまり無政府状態と呼びます。
        show:
          - { type: title, text: 世界には警察がない }
          - { type: box, color: pink, w: 1100, text: "国際社会には「世界の警察」がない ＝ **アナーキー**（無政府状態）" }
      - say: とはいえ、国際社会は、まったくルールのない、弱肉強食の世界というわけではなく、国際法というルールが、はたらいています。ただし、強制する力が弱く、大国が違反しても、罰するのが難しい、という問題があります。
        show:
          - { type: box, color: blue, w: 1100, text: "**国際法** というルールはある。でも強制力が弱く、大国の違反は罰しにくい" }

  - board: whiteboard
    steps:
      - say: 国際関係の考え方には、大きく2つのアプローチがあります。
        show:
          - { type: title, text: リアリズムとリベラリズム }
      - say: リアリズム、現実主義は、国はいつも、自分の国の利益と安全を、最優先に行動する、と考え、軍事力や経済力といった力が、国際政治を決める、とします。だから、国の代表に、ふつうの倫理を求めるのは、かえって危険だ、と考えます。
        show:
          - { type: box, color: pink, w: 1100, title: リアリズム（現実主義）, text: "国は自国の利益と安全が最優先。力（軍事・経済）が国際政治を決める" }
      - say: 一方、リベラリズム、自由主義は、国際機関や貿易、民主主義の広がりが、国どうしの協力をうながし、戦争を防げる、と考えます。
        show:
          - { type: box, color: green, w: 1100, title: リベラリズム（自由主義）, text: "国際機関・貿易・民主主義の広がりが協力をうながし、戦争を防げる" }
      - say: 現実は、この2つの間にあり、どちらの見方も必要です。
        show:
          - { type: text, color: yellow, text: "現実はその間。両方の見方が必要" }
