title: 国際連合の役割と限界
scenes:
  - board: whiteboard
    steps:
      - say: 「国際連合」です。国際連合、国連は、第二次世界大戦のあとの、1945年につくられた国際機関です。総会は、すべての加盟国が参加する会議で、一国一票です。決議には、多くの場合、法的に従わせる力はありませんが、国際的な世論をつくる、大事な役割を果たします。
        show:
          - { type: title, text: 国連の総会 }
          - { type: box, color: blue, w: 1100, text: "**国連**（1945年〜）。**総会** は全加盟国が一国一票。拘束力は弱いが国際世論をつくる" }

  - board: whiteboard
    steps:
      - say: 安全保障理事会、安保理は、平和と安全について話し合う機関で、アメリカ、イギリス、フランス、ロシア、中国の5つの常任理事国と、10の非常任理事国で構成されます。常任理事国は、拒否権を持っていて、一国でも反対すると、決議は通りません。
        show:
          - { type: title, text: 安保理と拒否権 }
          - { type: box, color: yellow, w: 1100, text: "**安保理**：常任理事国5（米・英・仏・露・中）＋ 非常任理事国10。常任理事国は **拒否権** を持つ" }
      - say: 拒否権は、国連の最大の問題のひとつです。ウクライナ侵攻をめぐる決議にロシアが、ガザでの停戦を求める決議にアメリカが、拒否権を使ったように、大国が当事者のときには、安保理が、うまくはたらかなくなってしまいます。
        show:
          - { type: box, color: pink, w: 1100, text: "大国が当事者だと動けない（例：ウクライナ侵攻でロシア、ガザ停戦でアメリカが拒否権）" }

  - board: whiteboard
    steps:
      - say: 国連平和維持活動、PKOは、紛争のあった地域に、各国から部隊や要員を送って、平和を保つ活動です。日本も、カンボジアなどに、自衛隊を送ってきました。
        read: 国連平和維持活動、ピーケーオーは、紛争のあった地域に、各国から部隊や要員を送って、平和を保つ活動です。日本も、カンボジアなどに、自衛隊を送ってきました。
        show:
          - { type: title, text: PKO }
          - { type: box, color: green, w: 1100, text: "**PKO**（国連平和維持活動）：紛争地域に各国の部隊・要員を送り平和を保つ（日本もカンボジアなどへ）" }
