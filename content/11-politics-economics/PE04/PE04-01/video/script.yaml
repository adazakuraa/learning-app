title: 貿易と比較優位
scenes:
  - board: slide
    steps:
      - say: 第4章、「国際経済」です。
        show:
          - { type: title, text: 第4章　国際経済 }
      - say: なぜ国どうしで貿易をするのか。そして、円高、円安のしくみを学びます。
        show:
          - type: list
            items: ["貿易と比較優位", "為替レートの仕組み"]
      - say: スーパーに並ぶ輸入品の値段や、海外旅行の費用。国と国とのお金のやりとりは、私たちの暮らしに直結しています。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "貿易と為替のしくみを知り、物の値段や暮らしとのつながりを理解する" }

  - board: whiteboard
    steps:
      - say: 国々は、なぜ貿易をするのでしょう。最も大切な理論が、比較優位です。何でも得意な国でなくても、相対的に、より得意なものに集中して、交換し合えば、おたがいが得をする、という考えです。
        show:
          - { type: title, text: 比較優位 }
          - { type: box, color: yellow, w: 1100, text: "**比較優位**：それぞれが「より得意なもの」に集中して交換すれば、おたがい得をする" }
      - say: 例えば、A国は、ワインも布も、B国よりうまくつくれるとします。これを絶対優位といいます。それでも、A国がワインに、B国が布に集中して、交換したほうが、2つの国の生産量の合計が増えて、両方が得をする場合があるのです。
        show:
          - { type: text, text: "A国はワインも布もB国より得意（**絶対優位**）" }
          - { type: text, color: green, text: "それでも A国 → ワイン、B国 → 布 に集中して交換すると、合計が増える" }
      - say: 弁護士が、事務員よりタイピングが速くても、タイピングは事務員にまかせて、弁護士は弁護の仕事に集中したほうが、全体としては得ですよね。それと同じ考え方です。
        added: true
        show:
          - { type: text, color: gray, text: "タイピングが速い弁護士も、タイピングは事務員にまかせて本業に集中したほうが得" }

  - board: whiteboard
    steps:
      - say: 比較優位の考え方は、自由貿易を支持する根拠になっています。でも、問題点もあります。競争力のない国内の産業が打撃を受けて、失業が生まれる。食料や半導体のように、安全保障のために守るべき産業がある。途上国の育ちざかりの産業は、競争にさらす前に育てる必要がある、という議論もあります。
        show:
          - { type: title, text: 自由貿易と保護貿易 }
          - type: list
            items: ["国内産業が打撃を受け、失業が生まれる", "食料・半導体など安全保障で守るべき産業がある", "途上国の育ちざかりの産業は守って育てる必要"]
      - say: そのため、政府が手を出す保護貿易を主張する考えも、根強くあります。保護貿易では、輸入品に関税をかけて、国内の産業を守りますが、そのぶん、消費者は高い値段を払うことになります。WTO、世界貿易機関は、関税を下げて、自由貿易を進めるための国際機関です。
        read: そのため、政府が手を出す保護貿易を主張する考えも、根強くあります。保護貿易では、輸入品に関税をかけて、国内の産業を守りますが、そのぶん、消費者は高い値段を払うことになります。ダブリューティーオー、世界貿易機関は、関税を下げて、自由貿易を進めるための国際機関です。
        show:
          - { type: box, color: pink, w: 1100, text: "**保護貿易**：輸入品に **関税** → 国内産業は守られるが、消費者は高く払う" }
          - { type: text, color: blue, text: "**WTO**（世界貿易機関）：関税を下げ、自由貿易を進める" }
