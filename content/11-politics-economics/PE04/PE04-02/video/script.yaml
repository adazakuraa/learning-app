title: 為替レートの仕組み
scenes:
  - board: whiteboard
    steps:
      - say: 「為替レート」です。為替レートは、ちがう通貨を交換するときの比率です。
        show:
          - { type: title, text: 円高と円安 }
      - say: 円高は、円の価値が上がることです。1ドル100円が、1ドル80円になる。前は100円必要だった1ドルが、80円で買えるようになるのです。円高になると、輸入品が安くなり、消費者には有利です。でも、輸出品は、外国から見て高くなるので、輸出企業には不利です。
        show:
          - { type: box, color: blue, w: 1100, title: 円高（1ドル＝100円 → 80円）, text: "円の価値が上がる。輸入品が安くなる（消費者に有利）、輸出に不利" }
      - say: 円安は、円の価値が下がることです。1ドル100円が、1ドル150円になる。輸出企業に有利で、外国で安く売れます。でも、輸入のコストが上がるので、エネルギーや食料の輸入が多い日本では、暮らしのコストが上がります。
        show:
          - { type: box, color: pink, w: 1100, title: 円安（1ドル＝100円 → 150円）, text: "円の価値が下がる。輸出に有利、輸入品が高くなる（エネルギー・食料の多い日本は生活費増）" }
      - say: 1ドルが、100円から150円になると、数字が大きくなるので、円が強くなったように感じますが、逆です。1ドルを手に入れるのに、たくさんの円が必要になった、つまり、円の価値が下がったのです。
        added: true
        show:
          - { type: text, color: gray, text: "数字が大きくなる ＝ 円安（1ドルを買うのに、より多くの円が必要）" }

  - board: whiteboard
    steps:
      - say: 為替レートも、需要と供給で決まります。円を買いたい人が多ければ円高、ドルを買いたい人が多ければ、円安になります。動かす主な要因は、金利のちがい、つまり、金利の高い国の通貨が買われやすい、ということや、貿易の収支、経済の見通し、中央銀行の政策などです。
        show:
          - { type: title, text: 為替を動かすもの }
          - { type: text, text: "円を買う人が多い → 円高　ドルを買う人が多い → 円安" }
          - { type: text, color: yellow, text: "要因：**金利差**（金利の高い通貨が買われる）・貿易収支・経済の見通し・中央銀行の政策" }
      - say: 2022年から2024年の大きな円安は、日本とアメリカの金利の差が、主な原因です。アメリカは、インフレ対策で、金利を急に上げました。一方、日本は、景気を支えるために、低い金利を続けたので、金利の高いドルが買われ、円が売られたのです。
        show:
          - { type: box, color: pink, w: 1100, text: "2022〜24年の円安：アメリカは利上げ、日本は低金利 → ドルが買われ円が売られた" }
      - say: 円安で、輸出企業のもうけは増えましたが、エネルギーや食料を輸入にたよる日本では、暮らしのコストが上がりました。
        show:
          - { type: text, color: gray, text: "輸出企業はもうかるが、輸入にたよる暮らしは苦しくなる" }
