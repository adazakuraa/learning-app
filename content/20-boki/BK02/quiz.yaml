questions:
  - q: 得意先が振り出した小切手を受け取ったとき、何という勘定科目で処理するでしょう？
    a: [現金]
  - q: 帳簿の現金残高と実際の現金が合わないとき、差額を一時的に処理する勘定科目は何でしょう？
    a: [現金過不足]
  - q: 決算日まで原因がわからなかった現金の不足額は、何という勘定科目に振り替えるでしょう？
    a: [雑損]
  - q: 自社が小切手を振り出したとき、減少する勘定科目は何でしょう？
    a: [当座預金]
  - q: 決算日に当座預金が貸方残高のとき、振り替える負債の勘定科目は何でしょう？（借入金以外）
    a: [当座借越]
  - q: 少額の支払いのために担当者に渡しておく現金を何というでしょう？
    a: [小口現金]
