title: 現金
scenes:
  - board: slide
    steps:
      - say: 第2章は、「現金と預金」です。お金の記録の基本を学びます。
        show:
          - type: title
            text: 第2章　現金と預金
          - type: list
            items:
              - 現金
              - 現金過不足
              - 普通預金・定期預金・当座預金
              - 当座借越
              - 小口現金
  - board: whiteboard
    steps:
      - say: 簿記の現金は、お札や硬貨だけではありません。銀行に持っていけば、すぐにお金に換えられる紙も、現金として扱います。これを通貨代用証券といいます。
        read: ぼきの現金は、お札や硬貨だけではありません。銀行に持っていけば、すぐにお金に換えられる紙も、現金として扱います。これを通貨代用証券といいます。
        show:
          - type: title
            text: 簿記の「現金」
      - say: 代表的なのは、他人が振り出した小切手、送金小切手、郵便為替証書の3つです。
        read: 代表的なのは、他人がふりだしたこぎって、送金こぎって、郵便為替証書の3つです。
        show:
          - type: list
            items:
              - "**他人振出小切手**（取引先が書いた小切手）"
              - "**送金小切手**（銀行が発行）"
              - "**郵便為替証書**（郵便局で換金）"
            at:
              - 80
              - 170
      - say: 価値はお金と同じなので、受け取ったら「現金」で記録します。「小切手」という勘定科目はありません。
        read: 価値はお金と同じなので、受け取ったら「現金」で記録します。「こぎって」という勘定科目はありません。
        show:
          - type: tag
            text: 受け取ったら「現金」
            color: yellow
            at:
              - 880
              - 52
  - board: whiteboard
    steps:
      - say: 例です。商品を5万円で売って、代金は得意先が振り出した小切手で受け取りました。
        read: 例です。商品を5万円で売って、代金は得意先がふりだしたこぎってで受け取りました。
        show:
          - type: title
            text: 仕訳の例
      - say: 他人振出の小切手なので、現金の増加です。
        read: 他人ふりだしのこぎってなので、現金の増加です。
        show:
          - type: svg
            w: 1100
            h: 120
            at:
              - 90
              - 170
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="116" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V118" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">現金</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">50,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">売上</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">50,000</text>
      - say: 注意したいのは、自分の会社が振り出した小切手です。自分の小切手は、自分の当座預金からお金が出ていくので、当座預金で処理します。次の次の単元で、くわしく学びます。
        read: 注意したいのは、自分の会社がふりだしたこぎってです。自分のこぎっては、自分の当座預金からお金が出ていくので、当座預金で処理します。次の次の単元で、くわしく学びます。
        show:
          - type: box
            w: 560
            text: ・受け取った → **現金**
            title: 他人振出の小切手
            color: green
            at:
              - 60
              - 360
          - type: box
            w: 560
            text: ・渡した → **当座預金**の減少
            title: 自社振出の小切手
            color: pink
            at:
              - 660
              - 360
