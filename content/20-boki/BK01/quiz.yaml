questions:
  - q: 簿記で、ある日の財産の状態を表す表を何というでしょう？
    a: [貸借対照表, 'B/S', バランスシート]
  - q: 簿記で、ある期間のもうけを表す表を何というでしょう？
    a: [損益計算書, 'P/L']
  - q: 資産・負債・純資産の関係を表す「資産 ＝ 負債 ＋（　　）」。（　　）に入る言葉は何でしょう？
    a: [純資産]
  - q: 仕訳で、左側のことを何というでしょう？
    a: [借方, かりかた]
  - q: 費用が発生したとき、仕訳の借方と貸方のどちらに書くでしょう？
    a: [借方, かりかた, 左]
  - q: 仕訳の金額を、勘定科目ごとの勘定に書き写すことを何というでしょう？
    a: [転記]
