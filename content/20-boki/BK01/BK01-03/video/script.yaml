title: 仕訳のルール（借方と貸方）
scenes:
  - board: whiteboard
    steps:
      - say: いよいよ、簿記でいちばん大切な、仕訳です。仕訳とは、取引を左と右に分けて、勘定科目と金額で記録することです。
        read: いよいよ、ぼきでいちばん大切な、しわけです。しわけとは、取引を左と右に分けて、勘定科目と金額で記録することです。
        show:
          - type: title
            text: 仕訳とは
      - say: 左側を借方、右側を貸方といいます。お金を借りる、貸すという意味は、今はありません。ただの左と右の呼び名です。
        read: 左側をかりかた、右側をかしかたといいます。お金を借りる、貸すという意味は、今はありません。ただの左と右の呼び名です。
        show:
          - type: box
            w: 560
            text: ・左側
            title: 借方（かりかた）
            color: blue
            at:
              - 60
              - 180
          - type: box
            w: 560
            text: ・右側
            title: 貸方（かしかた）
            color: pink
            at:
              - 660
              - 180
      - say: 覚え方です。ひらがなの「り」は、最後を左にはらうので左。「し」は、右にはらうので右。かりかたは左、かしかたは右です。
        show:
          - type: box
            w: 1100
            text: |-
              か**り**かた → 「り」は左にはらう → **左**
              か**し**かた → 「し」は右にはらう → **右**
            color: yellow
            at:
              - 80
              - 380
        added: true
  - board: whiteboard
    steps:
      - say: なぜ左右に分けるのでしょうか。取引には、必ず2つの面があるからです。
        show:
          - type: title
            text: 取引には2つの面がある
      - say: たとえば、銀行から現金10万円を借りた。現金が10万円増えた、という面と、借金が10万円増えた、という面があります。
        show:
          - type: svg
            w: 900
            h: 134
            at:
              - 180
              - 200
            anim: fade
            markup: <rect x="2" y="2" width="421" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="212.5" y="74" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">現金が増えた</text><rect x="477" y="2" width="421" height="126" rx="14" fill="#f4a3b8" fill-opacity="0.15" stroke="#f4a3b8" stroke-width="3"/><text x="687.5" y="74" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="middle">借入金が増えた</text>
      - say: この2つを、左右に分けて同時に記録します。2つの面を記録するので、後で計算ミスがあっても、左右の合計が合わずに気づけます。
        show:
          - type: svg
            w: 1100
            h: 120
            at:
              - 90
              - 380
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="116" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V118" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">現金</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">100,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">借入金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">100,000</text>
  - board: whiteboard
    steps:
      - say: では、どちらに書くのか。ここで、前の単元のビーエスとピーエルの形を思い出してください。
        show:
          - type: title
            text: ホームポジション
      - say: 資産と費用は、表の左側にありました。だから、増えたら左、借方に書きます。負債、純資産、収益は右側にあったので、増えたら右、貸方に書きます。
        read: 資産と費用は、表の左側にありました。だから、増えたら左、かりかたに書きます。負債、純資産、収益は右側にあったので、増えたら右、かしかたに書きます。
        show:
          - type: svg
            w: 900
            h: 330
            at:
              - 190
              - 160
            anim: fade
            markup: <rect x="0" y="3" width="435" height="159" rx="12" fill="#8fc4ff" fill-opacity="0.18" stroke="#8fc4ff" stroke-width="3"/><text x="217.5" y="92.5" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="middle">資産</text><rect x="0" y="168" width="435" height="159" rx="12" fill="#c9a6f5" fill-opacity="0.18" stroke="#c9a6f5" stroke-width="3"/><text x="217.5" y="257.5" font-size="30" fill="#c9a6f5" stroke="none" text-anchor="middle">費用</text><rect x="465" y="3" width="435" height="104" rx="12" fill="#f4a3b8" fill-opacity="0.18" stroke="#f4a3b8" stroke-width="3"/><text x="682.5" y="65" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="middle">負債</text><rect x="465" y="113" width="435" height="104" rx="12" fill="#9be0b0" fill-opacity="0.18" stroke="#9be0b0" stroke-width="3"/><text x="682.5" y="175" font-size="30" fill="#9be0b0" stroke="none" text-anchor="middle">純資産</text><rect x="465" y="223" width="435" height="104" rx="12" fill="#f3a76a" fill-opacity="0.18" stroke="#f3a76a" stroke-width="3"/><text x="682.5" y="285" font-size="30" fill="#f3a76a" stroke="none" text-anchor="middle">収益</text>
      - say: この、増えたときに書く側を、ホームポジションといいます。減ったときは、その反対側に書きます。
        show:
          - type: box
            w: 1100
            text: 増えたら**ホームポジション**、減ったら**反対側**
            color: yellow
            at:
              - 80
              - 540
  - board: whiteboard
    steps:
      - say: 例で練習しましょう。商品5万円を仕入れて、現金で払いました。
        read: 例で練習しましょう。商品5万円をしいれれて、現金で払いました。
        show:
          - type: title
            text: 仕訳の練習
      - say: 仕入は費用なので、発生したら左。現金は資産で、減ったので右です。
        read: しいれは費用なので、発生したら左。現金は資産で、減ったので右です。
        show:
          - type: svg
            w: 1100
            h: 120
            at:
              - 90
              - 170
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="116" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V118" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">仕入</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">50,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">現金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">50,000</text>
      - say: 次に、商品を8万円で売って、現金を受け取りました。現金は資産が増えたので左。売上は収益なので右です。
        show:
          - type: svg
            w: 1100
            h: 120
            at:
              - 90
              - 340
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="116" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V118" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">現金</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">80,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">売上</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">80,000</text>
      - say: 迷ったら、まず現金がどう動いたかから考えると簡単です。現金が増えたら左、減ったら右。そして、資産と費用は左、それ以外は右、と覚えましょう。
        show:
          - type: box
            w: 1100
            text: 迷ったら**現金**から。**資産と費用は左**、それ以外は右
            color: yellow
            at:
              - 80
              - 520
