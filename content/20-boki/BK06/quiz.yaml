questions:
  - q: 土地を買ったときの仲介手数料は、何という勘定科目に含めるでしょう？
    a: [土地]
  - q: 取得原価1,200,000円、残存価額0円、耐用年数6年の車両の、定額法による1年分の減価償却費はいくらでしょう？
    a: ['200000', '200,000', '200000円', '200,000円']
  - q: 間接法で減価償却をするとき、貸方に書く勘定科目は何でしょう？（例：備品の場合）
    a: [備品減価償却累計額, 減価償却累計額]
  - q: 固定資産を帳簿価額より高く売ったときの差額を処理する収益の勘定科目は何でしょう？
    a: [固定資産売却益]
  - q: 固定資産の価値を高める改良のための支出を何というでしょう？
    a: [資本的支出]
