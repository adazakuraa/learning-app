<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 244" width="660" height="244" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><rect x="0.5" y="0.5" width="659" height="243" rx="12" fill="#fbfaf6" stroke="#d6d3cc"/><text x="330" y="26" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="bold">売却価額と帳簿価額をくらべる</text><g transform="translate(0,34)"><rect x="30" y="40" width="160" height="120" rx="8" fill="#2f6fc4" fill-opacity="0.13" stroke="#2f6fc4" stroke-width="2"/><text x="110" y="94" font-size="18" fill="#2f6fc4" text-anchor="middle" font-weight="bold">取得原価</text><text x="110" y="118" font-size="18" fill="#2f6fc4" text-anchor="middle" font-weight="bold">1,200,000</text><rect x="210" y="40" width="160" height="50" rx="8" fill="#c94b50" fill-opacity="0.13" stroke="#c94b50" stroke-width="2"/><text x="290" y="70" font-size="15" fill="#c94b50" text-anchor="middle" font-weight="bold">累計額 400,000</text><rect x="210" y="100" width="160" height="60" rx="8" fill="#2f6fc4" fill-opacity="0.13" stroke="#2f6fc4" stroke-width="2"/><text x="290" y="124.33333333333333" font-size="16" fill="#2f6fc4" text-anchor="middle" font-weight="bold">帳簿価額</text><text x="290" y="146.33333333333331" font-size="16" fill="#2f6fc4" text-anchor="middle" font-weight="bold">800,000</text><rect x="430" y="100" width="200" height="60" rx="8" fill="#2f8f55" fill-opacity="0.13" stroke="#2f8f55" stroke-width="2"/><text x="530" y="135.66666666666666" font-size="17" fill="#2f8f55" text-anchor="middle" font-weight="bold">売却 900,000</text><text x="530" y="82" font-size="15" fill="#d07a1e" text-anchor="middle" font-weight="bold">＞ 帳簿価額なら売却益</text><text x="330" y="195" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">売却益 ＝ 900,000 − 800,000 ＝ 100,000</text></g></svg>
