questions:
  - q: 売掛金残高500,000円に2％の貸倒引当金を設定する。貸倒引当金の残高が3,000円のとき、繰入額はいくらでしょう？
    a: ['7000', '7,000', '7000円', '7,000円']
  - q: 前期に発生した売掛金が貸し倒れたとき、まず取り崩す勘定科目は何でしょう？
    a: [貸倒引当金]
  - q: 期首商品20,000円、当期仕入300,000円、期末商品30,000円のとき、売上原価はいくらでしょう？
    a: ['290000', '290,000', '290000円', '290,000円']
  - q: 期末に使っていない郵便切手や収入印紙を振り替える資産の勘定科目は何でしょう？
    a: [貯蔵品]
  - q: 当期に支払った保険料のうち、来期の分を振り替える資産の勘定科目は何でしょう？
    a: [前払保険料, 前払費用]
  - q: まだ支払っていない当期分の利息を見越し計上するとき、貸方に書く勘定科目は何でしょう？
    a: [未払利息, 未払費用]
