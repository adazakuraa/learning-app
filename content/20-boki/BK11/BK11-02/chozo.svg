<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 204" width="660" height="204" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><rect x="0.5" y="0.5" width="659" height="203" rx="12" fill="#fbfaf6" stroke="#d6d3cc"/><text x="330" y="26" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="bold">使っていない分は来期の資産</text><g transform="translate(0,34)"><rect x="30" y="40" width="280" height="90" rx="8" fill="#7d4fc0" fill-opacity="0.13" stroke="#7d4fc0" stroke-width="2"/><text x="170" y="79" font-size="18" fill="#7d4fc0" text-anchor="middle" font-weight="bold">使った切手・印紙</text><text x="170" y="103" font-size="18" fill="#7d4fc0" text-anchor="middle" font-weight="bold">→ 当期の費用のまま</text><rect x="350" y="40" width="280" height="90" rx="8" fill="#2f6fc4" fill-opacity="0.13" stroke="#2f6fc4" stroke-width="2"/><text x="490" y="79" font-size="18" fill="#2f6fc4" text-anchor="middle" font-weight="bold">残った切手・印紙</text><text x="490" y="103" font-size="18" fill="#2f6fc4" text-anchor="middle" font-weight="bold">→ 貯蔵品（資産）へ</text></g></svg>
