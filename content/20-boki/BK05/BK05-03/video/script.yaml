title: 仮払金・仮受金
scenes:
  - board: whiteboard
    steps:
      - say: 出張に行く社員に、旅費として5万円を渡しました。実際にいくら使うかは、帰ってくるまでわかりません。
        show:
          - type: title
            text: 仮払金
      - say: こういうとき、いったん仮払金という資産で記録しておきます。
        read: こういうとき、いったんかりばらい金という資産で記録しておきます。
        show:
          - type: svg
            w: 1100
            h: 120
            at:
              - 90
              - 200
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="116" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V118" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">仮払金</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">50,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">現金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">50,000</text>
      - say: 帰ってきて、旅費に4万2千円使った、と報告を受け、残りの8千円を受け取りました。仮払金を消して、旅費交通費にします。
        read: 帰ってきて、旅費に4万2千円使った、と報告を受け、残りの8千円を受け取りました。かりばらい金を消して、旅費交通費にします。
        show:
          - type: svg
            w: 1100
            h: 176
            at:
              - 90
              - 360
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="172" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V174" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">旅費交通費</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">42,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">仮払金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">50,000</text><text x="20" y="150" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">現金</text><text x="530" y="150" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">8,000</text><text x="570" y="150" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start"></text><text x="1080" y="150" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end"></text>
  - board: whiteboard
    steps:
      - say: 反対に、内容がわからない入金があったときは、仮受金という負債で記録します。
        read: 反対に、内容がわからない入金があったときは、かりうけ金という負債で記録します。
        show:
          - type: title
            text: 仮受金
          - type: svg
            w: 1100
            h: 120
            at:
              - 90
              - 170
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="116" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V118" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">普通預金</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">100,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">仮受金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">100,000</text>
      - say: あとで、売掛金の回収だったとわかったら、仮受金を消して売掛金を減らします。
        read: あとで、うりかけきんの回収だったとわかったら、かりうけ金を消してうりかけきんを減らします。
        show:
          - type: svg
            w: 1100
            h: 120
            at:
              - 90
              - 330
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="116" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V118" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">仮受金</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">100,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">売掛金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">100,000</text>
      - say: 仮払金は、払ったけど中身が決まっていないお金。仮受金は、もらったけど中身がわからないお金。どちらも、確定したら消える一時的な科目です。
        read: かりばらい金は、払ったけど中身が決まっていないお金。かりうけ金は、もらったけど中身がわからないお金。どちらも、確定したら消える一時的な科目です。
        show:
          - type: box
            w: 1100
            text: |-
              **仮払金**＝払ったが中身未定（資産）
              **仮受金**＝もらったが中身不明（負債）
            color: yellow
            at:
              - 80
              - 490
