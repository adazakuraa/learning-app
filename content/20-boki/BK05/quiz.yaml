questions:
  - q: 元金300,000円、年利率4％で6か月貸し付けたとき、受け取る利息はいくらでしょう？
    a: ['6000', '6,000', '6000円', '6,000円']
  - q: 商品以外の物を買い、代金を後で払うときに使う負債の勘定科目は何でしょう？
    a: [未払金]
  - q: 出張旅費の概算額を渡したときに使う資産の勘定科目は何でしょう？
    a: [仮払金]
  - q: 給料から差し引いた所得税を処理する負債の勘定科目は何でしょう？
    a: [所得税預り金, 預り金]
  - q: 社会保険料のうち、会社が負担する分を処理する費用の勘定科目は何でしょう？
    a: [法定福利費]
  - q: 店舗を借りるときに支払った敷金を処理する資産の勘定科目は何でしょう？
    a: [差入保証金]
