<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 184" width="680" height="184" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><rect x="0.5" y="0.5" width="679" height="183" rx="12" fill="#fbfaf6" stroke="#d6d3cc"/><text x="340" y="26" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="bold">年利率4％ → 1年で12,000円、6か月なら半分</text><g transform="translate(0,34)"><rect x="30" y="40" width="310" height="50" rx="8" fill="#d07a1e" fill-opacity="0.13" stroke="#d07a1e" stroke-width="2"/><text x="185" y="59.333333333333336" font-size="16" fill="#d07a1e" text-anchor="middle" font-weight="bold">6か月分の利息</text><text x="185" y="81.33333333333334" font-size="16" fill="#d07a1e" text-anchor="middle" font-weight="bold">6,000円</text><rect x="340" y="40" width="310" height="50" rx="8" fill="#6b7280" fill-opacity="0.13" stroke="#6b7280" stroke-width="2"/><text x="495" y="70.33333333333333" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="bold">残り6か月</text><path d="M30 30 V100" stroke="#1f2328" stroke-width="2" stroke-dasharray="4 3"/><text x="30" y="24" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">貸付</text><path d="M340 30 V100" stroke="#1f2328" stroke-width="2" stroke-dasharray="4 3"/><text x="340" y="24" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">返済</text><path d="M650 30 V100" stroke="#1f2328" stroke-width="2" stroke-dasharray="4 3"/><text x="650" y="24" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">1年</text></g></svg>
