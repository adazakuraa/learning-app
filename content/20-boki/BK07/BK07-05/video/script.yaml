title: 租税公課
scenes:
  - board: whiteboard
    steps:
      - say: 会社が払う税金のうち、もうけにかかる税金と消費税以外、たとえば、固定資産税、印紙税、自動車税などは、租税公課という費用で処理します。
        read: 会社が払う税金のうち、もうけにかかる税金と消費税以外、たとえば、固定資産税、印紙税、自動車税などは、そぜいこうかという費用で処理します。
        show:
          - type: title
            text: 租税公課
          - type: list
            items:
              - もうけにかかる税 → **法人税等**
              - 消費税 → **仮払・仮受消費税**
              - 固定資産税・印紙税・自動車税 → **租税公課**
              - 社員から預かった所得税 → **所得税預り金**
  - board: whiteboard
    steps:
      - say: 収入印紙を買ったら、印紙税を払ったのと同じなので、租税公課です。
        read: 収入印紙を買ったら、印紙税を払ったのと同じなので、そぜいこうかです。
        show:
          - type: title
            text: 仕訳の例
          - type: svg
            w: 1100
            h: 120
            at:
              - 90
              - 160
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="116" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V118" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">租税公課</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">10,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">現金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">10,000</text>
      - say: 郵便切手は税金ではないので、通信費です。ちがいに気をつけましょう。
        show:
          - type: svg
            w: 1100
            h: 120
            at:
              - 90
              - 320
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="116" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V118" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">通信費</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">5,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">現金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">5,000</text>
      - say: なお、決算のときに、使っていない印紙や切手が残っていたら、貯蔵品という資産に振り替えます。決算の章で学びます。
        read: なお、決算のときに、使っていない印紙や切手が残っていたら、ちょぞうひんという資産に振り替えます。決算の章で学びます。
        show:
          - type: box
            w: 1100
            text: 決算で未使用の印紙・切手 → **貯蔵品**
            color: yellow
            at:
              - 80
              - 480
