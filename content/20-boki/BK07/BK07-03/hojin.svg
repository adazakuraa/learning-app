<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 184" width="680" height="184" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><rect x="0.5" y="0.5" width="679" height="183" rx="12" fill="#fbfaf6" stroke="#d6d3cc"/><text x="340" y="26" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="bold">法人税等：中間で前払い、決算で精算</text><g transform="translate(0,34)"><rect x="30" y="40" width="310" height="50" rx="8" fill="#2f6fc4" fill-opacity="0.13" stroke="#2f6fc4" stroke-width="2"/><text x="185" y="59.333333333333336" font-size="16" fill="#2f6fc4" text-anchor="middle" font-weight="bold">中間納付</text><text x="185" y="81.33333333333334" font-size="16" fill="#2f6fc4" text-anchor="middle" font-weight="bold">仮払法人税等 20万</text><rect x="340" y="40" width="310" height="50" rx="8" fill="#c94b50" fill-opacity="0.13" stroke="#c94b50" stroke-width="2"/><text x="495" y="59.333333333333336" font-size="16" fill="#c94b50" text-anchor="middle" font-weight="bold">決算で確定 45万</text><text x="495" y="81.33333333333334" font-size="16" fill="#c94b50" text-anchor="middle" font-weight="bold">残り25万は未払法人税等</text><path d="M30 30 V100" stroke="#1f2328" stroke-width="2" stroke-dasharray="4 3"/><text x="30" y="24" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">期首</text><path d="M340 30 V100" stroke="#1f2328" stroke-width="2" stroke-dasharray="4 3"/><text x="340" y="24" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">中間</text><path d="M650 30 V100" stroke="#1f2328" stroke-width="2" stroke-dasharray="4 3"/><text x="650" y="24" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">決算</text></g></svg>
