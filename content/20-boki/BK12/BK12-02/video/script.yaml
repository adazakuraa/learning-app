title: 損益計算書と貸借対照表の作成
scenes:
  - board: whiteboard
    steps:
      - say: 財務諸表を作るときは、勘定科目の名前と、表に書く名前がちがうものがあります。外部の人が読みやすいように、内容がわかる名前にするのです。
        show:
          - type: title
            text: 表示名のちがい
          - type: list
            items:
              - 売上 → **売上高**
              - 仕入 → **売上原価**
              - 繰越商品 → **商品**
              - 前払保険料など → **前払費用**
              - 未払利息など → **未払費用**
  - board: whiteboard
    steps:
      - say: 貸借対照表では、貸倒引当金と減価償却累計額は、対応する資産から差し引く形で書きます。売掛金50万円なら、貸倒引当金1万円を引いて、49万円と表示します。
        read: 貸借対照表では、かしだおれ引当金とげんかしょうきゃく累計額は、対応する資産から差し引く形で書きます。うりかけきん50万円なら、かしだおれ引当金1万円を引いて、49万円と表示します。
        show:
          - type: title
            text: 貸借対照表の書き方
          - type: box
            w: 1100
            text: |-
              売掛金 500,000
              　貸倒引当金 △10,000 → **490,000**
            color: blue
            at:
              - 80
              - 180
      - say: もう1つのポイントは、繰越利益剰余金です。決算整理前の残高に、当期純利益を足した金額を書きます。足し忘れがとても多いので注意しましょう。
        read: もう1つのポイントは、くりこし利益じょうよきんです。決算整理前の残高に、当期純利益を足した金額を書きます。足し忘れがとても多いので注意しましょう。
        show:
          - type: box
            w: 1100
            text: 繰越利益剰余金 ＝ 整理前の残高 ＋ **当期純利益**
            color: yellow
            at:
              - 80
              - 380
