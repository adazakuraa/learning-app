title: 証ひょうからの仕訳
scenes:
  - board: whiteboard
    steps:
      - say: 証ひょうとは、取引があったことを証明する書類です。請求書、領収書、納品書、振込依頼書、通帳の写しなどがあります。
        read: しょうひょうとは、取引があったことを証明する書類です。請求書、領収書、納品書、振込依頼書、通帳の写しなどがあります。
        show:
          - type: title
            text: 証ひょうとは
      - say: 試験では、証ひょうを見て、当社の立場で仕訳を書きます。最初に確認するのは、だれがだれに出した書類か、です。
        read: 試験では、しょうひょうを見て、当社の立場でしわけを書きます。最初に確認するのは、だれがだれに出した書類か、です。
        show:
          - type: tag
            text: だれが、だれに出した？
            color: yellow
            at:
              - 820
              - 52
  - board: whiteboard
    steps:
      - say: 例です。当社あてに届いた請求書。商品20個、2万円、消費税2千円、合計2万2千円。支払いは翌月末です。
        show:
          - type: title
            text: 当社あての請求書
          - type: svg
            w: 760
            h: 208
            at:
              - 80
              - 150
            anim: fade
            markup: <circle cx="50" cy="44" r="26" fill="none" stroke="#f3d77a" stroke-width="4"/><path d="M8 130 C8 88 92 88 92 130" fill="none" stroke="#f3d77a" stroke-width="4"/><text x="120" y="50" font-size="32" fill="#f3d77a" stroke="none" text-anchor="start">請求書　株式会社〇〇（当社）御中</text><text x="120" y="92" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">商品A 20個 × @1,000 ＝ 20,000円</text><text x="120" y="128" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">消費税 2,000円　合計 22,000円</text><text x="120" y="164" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">支払期限：翌月末</text>
      - say: 当社が商品を仕入れて、代金は後払いなので、仕入と買掛金です。消費税は仮払消費税に分けます。
        read: 当社が商品をしいれれて、代金は後払いなので、しいれとかいかけきんです。消費税はかりばらい消費税に分けます。
        show:
          - type: svg
            w: 1100
            h: 176
            at:
              - 90
              - 380
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="172" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V174" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">仕入</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">20,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">買掛金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">22,000</text><text x="20" y="150" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">仮払消費税</text><text x="530" y="150" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">2,000</text><text x="570" y="150" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start"></text><text x="1080" y="150" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end"></text>
  - board: whiteboard
    steps:
      - say: 一方、請求書の控えと書いてあれば、当社が相手に出した請求書のコピーです。当社は売った側になります。
        show:
          - type: title
            text: 請求書（控）
          - type: svg
            w: 1100
            h: 176
            at:
              - 90
              - 200
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="172" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V174" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">売掛金</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">33,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">売上</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">30,000</text><text x="20" y="150" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start"></text><text x="530" y="150" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end"></text><text x="570" y="150" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">仮受消費税</text><text x="1080" y="150" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">3,000</text>
      - say: 宛先が当社なら、相手が出した書類。控えなら、当社が出した書類。合計金額だけでなく、税抜の金額と消費税を分けて仕訳しましょう。
        read: 宛先が当社なら、相手が出した書類。控えなら、当社が出した書類。合計金額だけでなく、税抜の金額と消費税を分けてしわけしましょう。
        show:
          - type: box
            w: 1100
            text: |-
              宛先が当社 → 相手が発行　「（控）」→ 当社が発行
              **税抜金額と消費税を分ける**
            color: yellow
            at:
              - 80
              - 410
