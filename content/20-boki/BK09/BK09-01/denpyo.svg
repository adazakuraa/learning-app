<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 194" width="660" height="194" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><rect x="0.5" y="0.5" width="659" height="193" rx="12" fill="#fbfaf6" stroke="#d6d3cc"/><text x="330" y="26" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="bold">三伝票制</text><g transform="translate(0,34)"><rect x="20" y="40" width="190" height="90" rx="8" fill="#2f6fc4" fill-opacity="0.13" stroke="#2f6fc4" stroke-width="2"/><text x="115" y="69" font-size="15" fill="#2f6fc4" text-anchor="middle" font-weight="bold">入金伝票</text><text x="115" y="90" font-size="15" fill="#2f6fc4" text-anchor="middle" font-weight="bold">現金が増える</text><text x="115" y="111" font-size="15" fill="#2f6fc4" text-anchor="middle" font-weight="bold">（借方＝現金）</text><rect x="235" y="40" width="190" height="90" rx="8" fill="#c94b50" fill-opacity="0.13" stroke="#c94b50" stroke-width="2"/><text x="330" y="69" font-size="15" fill="#c94b50" text-anchor="middle" font-weight="bold">出金伝票</text><text x="330" y="90" font-size="15" fill="#c94b50" text-anchor="middle" font-weight="bold">現金が減る</text><text x="330" y="111" font-size="15" fill="#c94b50" text-anchor="middle" font-weight="bold">（貸方＝現金）</text><rect x="450" y="40" width="190" height="90" rx="8" fill="#2f8f55" fill-opacity="0.13" stroke="#2f8f55" stroke-width="2"/><text x="545" y="79.5" font-size="15" fill="#2f8f55" text-anchor="middle" font-weight="bold">振替伝票</text><text x="545" y="100.5" font-size="15" fill="#2f8f55" text-anchor="middle" font-weight="bold">現金が動かない</text></g></svg>
