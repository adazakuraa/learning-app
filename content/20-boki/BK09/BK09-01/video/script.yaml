title: 伝票（三伝票制）
scenes:
  - board: slide
    steps:
      - say: 第9章は、「伝票と証ひょう」です。伝票の書き方と、書類から仕訳を読み取る方法を学びます。
        read: 第9章は、「でんぴょうとしょうひょう」です。でんぴょうの書き方と、書類からしわけを読み取る方法を学びます。
        show:
          - type: title
            text: 第9章　伝票と証ひょう
          - type: list
            items:
              - 伝票（三伝票制）
              - 証ひょうからの仕訳
  - board: whiteboard
    steps:
      - say: 仕訳帳は1冊なので、1人しか書けません。伝票なら1取引1枚なので、何人もの担当者が同時に記録できます。
        read: しわけ帳は1冊なので、1人しか書けません。でんぴょうなら1取引1枚なので、何人もの担当者が同時に記録できます。
        show:
          - type: title
            text: 三伝票制
      - say: 3級は、入金伝票、出金伝票、振替伝票の3種類を使います。入金伝票は現金が増える取引、出金伝票は現金が減る取引、振替伝票は現金が動かない取引です。
        read: さんきゅうは、にゅうきんでんぴょう、しゅっきんでんぴょう、ふりかえでんぴょうの3種類を使います。にゅうきんでんぴょうは現金が増える取引、しゅっきんでんぴょうは現金が減る取引、ふりかえでんぴょうは現金が動かない取引です。
        show:
          - type: svg
            w: 1160
            h: 134
            at:
              - 60
              - 220
            anim: fade
            markup: <rect x="2" y="2" width="349.3333333333333" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="176.66666666666666" y="58" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">入金伝票</text><text x="176.66666666666666" y="90" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">現金が増える</text><rect x="405.3333333333333" y="2" width="349.3333333333333" height="126" rx="14" fill="#f4a3b8" fill-opacity="0.15" stroke="#f4a3b8" stroke-width="3"/><text x="580" y="58" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="middle">出金伝票</text><text x="580" y="90" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="middle">現金が減る</text><rect x="808.6666666666666" y="2" width="349.3333333333333" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="983.3333333333333" y="58" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">振替伝票</text><text x="983.3333333333333" y="90" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">現金が動かない</text>
      - say: 入金伝票の左は必ず現金なので、相手の右側の科目だけを書きます。出金伝票の右は必ず現金なので、左側の科目だけを書きます。
        read: にゅうきんでんぴょうの左は必ず現金なので、相手の右側の科目だけを書きます。しゅっきんでんぴょうの右は必ず現金なので、左側の科目だけを書きます。
        show:
          - type: box
            w: 1100
            text: |-
              入金伝票：左は必ず現金 → **相手の科目だけ**書く
              出金伝票：右は必ず現金 → **相手の科目だけ**書く
            color: yellow
            at:
              - 80
              - 420
  - board: whiteboard
    steps:
      - say: よく出るのが、一部が現金の取引です。商品10万円を売って、3万円は現金、残りは掛けにしました。書き方は2つあります。
        show:
          - type: title
            text: 一部が現金の取引
      - say: 1つ目は、取引を分ける方法。入金伝票に売上3万円、振替伝票に売掛金と売上7万円を書きます。
        read: 1つ目は、取引を分ける方法。にゅうきんでんぴょうに売上3万円、ふりかえでんぴょうにうりかけきんと売上7万円を書きます。
        show:
          - type: box
            w: 1100
            text: ① 分ける：入金伝票「売上 30,000」＋振替伝票「売掛金／売上 70,000」
            color: blue
            at:
              - 80
              - 200
      - say: 2つ目は、いったん全部を掛けとみなす方法。振替伝票に売掛金と売上10万円、入金伝票に売掛金3万円を書きます。すぐに一部を回収した、と考えるのです。
        read: 2つ目は、いったん全部を掛けとみなす方法。ふりかえでんぴょうにうりかけきんと売上10万円、にゅうきんでんぴょうにうりかけきん3万円を書きます。すぐに一部を回収した、と考えるのです。
        show:
          - type: box
            w: 1100
            text: ② 全部掛け：振替伝票「売掛金／売上 100,000」＋入金伝票「売掛金 30,000」
            color: green
            at:
              - 80
              - 330
      - say: 試験では、片方の伝票が示されて、もう片方を答えます。入金伝票の科目が売上なら1つ目、売掛金なら2つ目の方法です。
        read: 試験では、片方のでんぴょうが示されて、もう片方を答えます。にゅうきんでんぴょうの科目が売上なら1つ目、うりかけきんなら2つ目の方法です。
        show:
          - type: text
            text: 入金伝票の科目で、どちらの方法か判断
            color: yellow
            at:
              - 80
              - 480
