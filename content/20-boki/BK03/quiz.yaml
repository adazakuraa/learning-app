questions:
  - q: 三分法で、商品を仕入れたときに使う勘定科目は何でしょう？
    a: [仕入]
  - q: 商品を代金後払いで仕入れたときに使う負債の勘定科目は何でしょう？
    a: [買掛金]
  - q: 当社負担の引取運賃は、何という勘定科目に含めるでしょう？
    a: [仕入]
  - q: 商品を売るときに当社が負担した運賃を処理する費用の勘定科目は何でしょう？
    a: [発送費]
  - q: 商品の注文時に内金を支払ったときに使う資産の勘定科目は何でしょう？
    a: [前払金]
  - q: クレジットカード払いで商品を売ったとき、カード会社への手数料を処理する勘定科目は何でしょう？
    a: [支払手数料]
