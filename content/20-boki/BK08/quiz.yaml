questions:
  - q: 仕訳帳と総勘定元帳をまとめて何というでしょう？
    a: [主要簿]
  - q: 得意先ごとの売掛金の増減を記録する補助簿を何というでしょう？
    a: [売掛金元帳, 得意先元帳]
  - q: 商品の種類ごとに、受入・払出・残高を記録する補助簿を何というでしょう？
    a: [商品有高帳]
  - q: 先に仕入れた商品から先に払い出したとみなして単価を決める方法を何というでしょう？
    a: [先入先出法]
  - q: 残高10個@100円の商品に、20個@130円を仕入れた。移動平均法の新しい単価はいくらでしょう？
    a: ['120', '120円', '@120']
