title: 商品有高帳（先入先出法）
scenes:
  - board: whiteboard
    steps:
      - say: 商品有高帳は、商品の種類ごとに、受け入れ、払い出し、残高を、数量、単価、金額で記録する帳簿です。
        read: 商品ありだかちょうは、商品の種類ごとに、受け入れ、払い出し、残高を、数量、単価、金額で記録する帳簿です。
        show:
          - type: title
            text: 商品有高帳
      - say: 大事なルールは、金額をすべて原価、つまり仕入単価で書くことです。売った値段は書きません。
        read: 大事なルールは、金額をすべて原価、つまりしいれ単価で書くことです。売った値段は書きません。
        show:
          - type: tag
            text: すべて原価で書く
            color: pink
            at:
              - 880
              - 52
      - say: 同じ商品でも、仕入れた時期で単価がちがうことがあります。そこで、払い出す単価の決め方が必要になります。
        read: 同じ商品でも、しいれれた時期で単価がちがうことがあります。そこで、払い出す単価の決め方が必要になります。
        show:
          - type: text
            text: 単価がちがう商品が混ざる → **単価の決め方**が必要
            color: yellow
            at:
              - 80
              - 300
  - board: whiteboard
    steps:
      - say: 1つ目の方法が、先入先出法です。先に仕入れたものから、先に払い出したとみなします。
        read: 1つ目の方法が、さきいれさきだしほうです。先にしいれれたものから、先に払い出したとみなします。
        show:
          - type: title
            text: 先入先出法
      - say: 例です。前月から10個、単価100円。4月5日に20個、単価130円を仕入れ、4月10日に25個を売りました。
        read: 例です。前月から10個、単価100円。4月5日に20個、単価130円をしいれれ、4月10日に25個を売りました。
        show:
          - type: list
            items:
              - 4月1日　前月繰越 10個 @100
              - 4月5日　仕入 20個 @130
              - 4月10日　売上 25個
            at:
              - 80
              - 170
      - say: 先に入った単価100円の10個を出して、足りない15個は、単価130円から出します。払出金額は、千円たす1950円で、2950円です。残高は、単価130円の5個で650円です。
        show:
          - type: box
            w: 1100
            text: |-
              払出：10個×@100 ＝ 1,000　＋　15個×@130 ＝ 1,950
              → 売上原価 **2,950**　　残高：5個×@130 ＝ **650**
            color: green
            at:
              - 80
              - 360
  - board: whiteboard
    steps:
      - say: 売上高は、25個かける売価200円で5000円。売上総利益は、5000ひく2950で、2050円です。
        show:
          - type: title
            text: 売上総利益
          - type: box
            w: 1100
            text: 売上高 5,000 − 売上原価 2,950 ＝ **売上総利益 2,050**
            color: yellow
            at:
              - 80
              - 180
      - say: 先入先出法では、単価がちがう残高は、行を分けて書きます。まとめないように注意しましょう。
        read: さきいれさきだしほうでは、単価がちがう残高は、行を分けて書きます。まとめないように注意しましょう。
        show:
          - type: text
            text: 単価がちがうものは**行を分ける**
            color: pink
            at:
              - 80
              - 330
