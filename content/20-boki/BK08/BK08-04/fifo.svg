<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 224" width="660" height="224" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><rect x="0.5" y="0.5" width="659" height="223" rx="12" fill="#fbfaf6" stroke="#d6d3cc"/><text x="330" y="26" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="bold">先入先出法：古いものから先に出す</text><g transform="translate(0,34)"><rect x="40" y="50" width="180" height="90" rx="8" fill="#2f6fc4" fill-opacity="0.13" stroke="#2f6fc4" stroke-width="2"/><text x="130" y="89" font-size="18" fill="#2f6fc4" text-anchor="middle" font-weight="bold">古い商品</text><text x="130" y="113" font-size="18" fill="#2f6fc4" text-anchor="middle" font-weight="bold">10個 @100</text><rect x="240" y="50" width="180" height="90" rx="8" fill="#2f6fc4" fill-opacity="0.13" stroke="#2f6fc4" stroke-width="2"/><text x="330" y="89" font-size="18" fill="#2f6fc4" text-anchor="middle" font-weight="bold">新しい商品</text><text x="330" y="113" font-size="18" fill="#2f6fc4" text-anchor="middle" font-weight="bold">20個 @130</text><path d="M430 95 L500 95" stroke="#c94b50" stroke-width="2.5" fill="none"/><path d="M490.0950818741206,99.78462087522354 L500 95 L490.0950818741206,90.21537912477646" stroke="#c94b50" stroke-width="2.5" fill="none"/><rect x="510" y="50" width="130" height="90" rx="8" fill="#c94b50" fill-opacity="0.13" stroke="#c94b50" stroke-width="2"/><text x="575" y="89" font-size="18" fill="#c94b50" text-anchor="middle" font-weight="bold">25個</text><text x="575" y="113" font-size="18" fill="#c94b50" text-anchor="middle" font-weight="bold">払出</text><text x="330" y="175" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">先に入った@100の10個から出し、足りない15個は@130から</text></g></svg>
