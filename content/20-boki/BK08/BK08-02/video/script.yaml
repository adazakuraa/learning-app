title: 現金出納帳・仕入帳・売上帳
scenes:
  - board: whiteboard
    steps:
      - say: 補助記入帳の代表、現金出納帳です。現金の収入、支出、残高を、日付順に書いていきます。
        read: 補助記入帳の代表、現金すいとうちょうです。現金の収入、支出、残高を、日付順に書いていきます。
        show:
          - type: title
            text: 現金出納帳
          - type: list
            items:
              - 4月1日　前月繰越　収入 50,000　残高 50,000
              - 4月3日　売上　収入 30,000　残高 80,000
              - 4月8日　文房具代　支出 2,000　残高 78,000
              - 4月20日　買掛金支払　支出 40,000　残高 38,000
      - say: 最後の残高は、総勘定元帳の現金勘定の残高と一致します。当座預金出納帳も、同じ形です。
        read: 最後の残高は、総勘定もとちょうの現金勘定の残高と一致します。当座預金すいとうちょうも、同じ形です。
        show:
          - type: tag
            text: 残高 ＝ 現金勘定の残高
            color: yellow
            at:
              - 820
              - 52
  - board: whiteboard
    steps:
      - say: 仕入帳と売上帳には、取引先、品名、数量、単価、金額を書きます。返品は、差し引いて書きます。
        read: しいれ帳と売上帳には、取引先、品名、数量、単価、金額を書きます。返品は、差し引いて書きます。
        show:
          - type: title
            text: 仕入帳・売上帳
      - say: 最後に、総仕入高から仕入戻し高を引いて、純仕入高を計算します。売上帳なら、総売上高から売上戻り高を引いて、純売上高です。
        read: 最後に、総しいれ高からしいれ戻し高を引いて、純しいれ高を計算します。売上帳なら、総売上高から売上戻り高を引いて、純売上高です。
        show:
          - type: box
            w: 1100
            text: 総仕入高 10,000 − 仕入戻し高 2,000 ＝ **純仕入高 8,000**
            color: yellow
            at:
              - 80
              - 230
      - say: よくあるミスは、返品を足してしまうことと、総額のまま答えてしまうことです。返品は差し引く、と覚えておきましょう。
        show:
          - type: text
            text: 返品は**差し引く**
            color: pink
            at:
              - 80
              - 380
