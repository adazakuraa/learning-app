title: 売掛金元帳・買掛金元帳・手形記入帳
scenes:
  - board: whiteboard
    steps:
      - say: 売掛金元帳は、得意先ごとに、売掛金の増減と残高を書く帳簿です。得意先元帳ともいいます。
        read: うりかけきんもとちょうは、得意先ごとに、うりかけきんの増減と残高を書く帳簿です。得意先もとちょうともいいます。
        show:
          - type: title
            text: 売掛金元帳
      - say: 総勘定元帳の売掛金は、全体の合計。売掛金元帳は、その内訳です。だから、各得意先の残高を合計すると、総勘定元帳の売掛金と一致します。
        read: 総勘定もとちょうのうりかけきんは、全体の合計。うりかけきんもとちょうは、その内訳です。だから、各得意先の残高を合計すると、総勘定もとちょうのうりかけきんと一致します。
        show:
          - type: svg
            w: 1160
            h: 134
            at:
              - 60
              - 230
            anim: fade
            markup: <rect x="2" y="2" width="248.5" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="126.25" y="58" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">A商店</text><text x="126.25" y="90" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">35,000</text><path d="M260.5 65 L294.5 65 M282.5 55 L294.5 65 L282.5 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="304.5" y="2" width="248.5" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="428.75" y="58" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">B商店</text><text x="428.75" y="90" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">50,000</text><path d="M563 65 L597 65 M585 55 L597 65 L585 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="607" y="2" width="248.5" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="731.25" y="58" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">C商店</text><text x="731.25" y="90" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">30,000</text><path d="M865.5 65 L899.5 65 M887.5 55 L899.5 65 L887.5 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="909.5" y="2" width="248.5" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="1033.75" y="58" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">売掛金合計</text><text x="1033.75" y="90" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">115,000</text>
      - say: 書き方は、勘定と同じです。売掛金は資産なので、増えたら借方、減ったら貸方。買掛金元帳は、仕入先ごとの買掛金です。
        read: 書き方は、勘定と同じです。うりかけきんは資産なので、増えたらかりかた、減ったらかしかた。かいかけきんもとちょうは、しいれ先ごとのかいかけきんです。
        show:
          - type: text
            text: 書き方は**勘定と同じ**
            color: yellow
            at:
              - 80
              - 440
  - board: whiteboard
    steps:
      - say: 受取手形記入帳と支払手形記入帳は、手形ごとに、番号、振出人、振出日、満期日、金額などを記録します。
        read: 受取てがた記入帳と支払てがた記入帳は、てがたごとに、番号、ふりだし人、ふりだし日、満期日、金額などを記録します。
        show:
          - type: title
            text: 手形記入帳
      - say: 最後の欄は、てん末です。期日に入金された、などの結末を書きます。試験では、記入帳から仕訳を逆算させる問題が出ます。てん末に書かれた日付が、手形が決済された日です。
        read: 最後の欄は、てん末です。期日に入金された、などの結末を書きます。試験では、記入帳からしわけを逆算させる問題が出ます。てん末に書かれた日付が、てがたが決済された日です。
        show:
          - type: box
            w: 1100
            text: 「**てん末**」欄 ＝ 手形がどうなったか（決済日など）
            color: yellow
            at:
              - 80
              - 250
