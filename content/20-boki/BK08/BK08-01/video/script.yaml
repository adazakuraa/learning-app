title: 主要簿と補助簿
scenes:
  - board: slide
    steps:
      - say: 第8章は、「帳簿」です。第2問でよく出る、補助簿のつけ方を学びます。
        show:
          - type: title
            text: 第8章　帳簿
          - type: list
            items:
              - 主要簿と補助簿
              - 現金出納帳・仕入帳・売上帳
              - 売掛金元帳・買掛金元帳・手形記入帳
              - 商品有高帳（先入先出法）
              - 商品有高帳（移動平均法）
  - board: whiteboard
    steps:
      - say: 帳簿は、主要簿と補助簿に分かれます。主要簿は、すべての取引を記録する、仕訳帳と総勘定元帳の2つです。
        read: 帳簿は、主要簿と補助簿に分かれます。主要簿は、すべての取引を記録する、しわけ帳と総勘定もとちょうの2つです。
        show:
          - type: title
            text: 帳簿の種類
          - type: box
            w: 560
            text: |-
              ・仕訳帳
              ・総勘定元帳
            title: 主要簿
            color: blue
            at:
              - 60
              - 160
          - type: box
            w: 560
            text: |-
              ・補助記入帳（現金出納帳・仕入帳など）
              ・補助元帳（売掛金元帳・商品有高帳など）
            title: 補助簿
            color: orange
            at:
              - 660
              - 160
      - say: 総勘定元帳の売掛金を見ても、合計しかわかりません。どの得意先からいくら回収できていないかを知るには、得意先ごとの帳簿が必要です。こうした、くわしい情報を補うのが補助簿です。
        read: 総勘定もとちょうのうりかけきんを見ても、合計しかわかりません。どの得意先からいくら回収できていないかを知るには、得意先ごとの帳簿が必要です。こうした、くわしい情報を補うのが補助簿です。
        show:
          - type: text
            text: 主要簿だけでは足りない情報を**補う**
            color: yellow
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: 試験では、この取引はどの補助簿に記入するか、という問題がよく出ます。コツは、まず仕訳を書くことです。
        read: 試験では、この取引はどの補助簿に記入するか、という問題がよく出ます。コツは、まずしわけを書くことです。
        show:
          - type: title
            text: どの補助簿に書く？
      - say: 商品5万円を仕入れ、2万円は現金、残りは掛けにしました。仕訳に出てくる科目から、仕入帳、現金出納帳、買掛金元帳がわかります。
        read: 商品5万円をしいれれ、2万円は現金、残りは掛けにしました。しわけに出てくる科目から、しいれ帳、現金すいとうちょう、かいかけきんもとちょうがわかります。
        show:
          - type: svg
            w: 1100
            h: 176
            at:
              - 90
              - 170
            anim: fade
            markup: <rect x="2" y="2" width="1096" height="172" rx="10" fill="none" stroke="#9aa3ad" stroke-width="2"/><path d="M2 56 H1098 M550 2 V174" stroke="#9aa3ad" stroke-width="2"/><text x="176" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">借方</text><text x="451" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="726" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">貸方</text><text x="1001" y="38" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="middle">金額</text><text x="20" y="94" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start">仕入</text><text x="530" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">50,000</text><text x="570" y="94" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">現金</text><text x="1080" y="94" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">20,000</text><text x="20" y="150" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="start"></text><text x="530" y="150" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end"></text><text x="570" y="150" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="start">買掛金</text><text x="1080" y="150" font-size="30" fill="#eef0ea" stroke="none" text-anchor="end">30,000</text>
      - say: そしてもう1つ。商品が動いたら、必ず商品有高帳にも記入します。返品のときも同じです。これがいちばん忘れやすいポイントです。
        read: そしてもう1つ。商品が動いたら、必ず商品ありだかちょうにも記入します。返品のときも同じです。これがいちばん忘れやすいポイントです。
        show:
          - type: list
            items:
              - 仕入 → **仕入帳**
              - 現金 → **現金出納帳**
              - 買掛金 → **買掛金元帳**
              - 商品が動いた → **商品有高帳**（忘れやすい！）
            at:
              - 90
              - 360
