title: 試験の形式と合格戦略
scenes:
  - board: slide
    steps:
      - say: 最後の第13章は、「試験対策」です。ここまで学んだことを、本番で点数にする方法をまとめます。
        show:
          - type: title
            text: 第13章　試験対策
          - type: list
            items:
              - 試験の形式と合格戦略
              - 第1問（仕訳）攻略
              - 第2問攻略
              - 第3問（決算）攻略
  - board: whiteboard
    steps:
      - say: 試験は60分。第1問の仕訳が45点、第2問が20点、第3問の決算が35点です。
        read: 試験は60分。第1問のしわけが45点、第2問が20点、第3問の決算が35点です。
        show:
          - type: title
            text: 配点と時間配分
      - say: おすすめの順番は、第1問を15分から20分、次に第3問を25分から30分、最後に第2問です。第2問は年によって難しさがばらつくので、後に回します。
        show:
          - type: svg
            w: 1000
            h: 134
            at:
              - 130
              - 230
            anim: fade
            markup: <rect x="2" y="2" width="296" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="150" y="58" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">第1問　仕訳</text><text x="150" y="90" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">15〜20分</text><path d="M308 65 L342 65 M330 55 L342 65 L330 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="352" y="2" width="296" height="126" rx="14" fill="#f3a76a" fill-opacity="0.15" stroke="#f3a76a" stroke-width="3"/><text x="500" y="58" font-size="26" fill="#f3a76a" stroke="none" text-anchor="middle">第3問　決算</text><text x="500" y="90" font-size="26" fill="#f3a76a" stroke="none" text-anchor="middle">25〜30分</text><path d="M658 65 L692 65 M680 55 L692 65 L680 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="702" y="2" width="296" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="850" y="58" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">第2問</text><text x="850" y="90" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">残りの時間</text>
      - say: 合格の戦略は、第1問で40点以上、第3問で25点以上。そうすれば、第2問は半分でも合格ラインに届きます。
        show:
          - type: box
            w: 1100
            text: 第1問 **40点以上** ＋ 第3問 **25点以上** → 第2問は半分でOK
            color: yellow
            at:
              - 80
              - 440
  - board: whiteboard
    steps:
      - say: 受け方は2つ。テストセンターでいつでも受けられるネット試験と、年3回の統一試験です。ネット試験は、その場で結果がわかります。勘定科目は、どちらも選択肢から選びます。
        show:
          - type: title
            text: ネット試験と統一試験
          - type: box
            w: 560
            text: |-
              ・テストセンターで**随時**
              ・その場で結果がわかる
            title: ネット試験
            color: blue
            at:
              - 60
              - 180
          - type: box
            w: 560
            text: |-
              ・年3回（2月・6月・11月）
              ・紙に記入
            title: 統一試験
            color: gray
            at:
              - 660
              - 180
  - board: whiteboard
    steps:
      - say: 勉強法です。仕訳を毎日10問から20問。決算整理の8つを説明できるようにする。過去問や予想問題を、時間を計って3回から5回分。間違えた理由をノートに書く。
        read: 勉強法です。しわけを毎日10問から20問。決算整理の8つを説明できるようにする。過去問や予想問題を、時間を計って3回から5回分。間違えた理由をノートに書く。
        show:
          - type: title
            text: 合格のための勉強法
          - type: list
            items:
              - 仕訳を**毎日**10〜20問
              - 決算整理の8つを**説明できる**ように
              - 過去問・予想問題を**時間を計って**
              - 間違えた**理由**をメモ
      - say: 本番では、わからない問題は後回し。第3問には部分点があるので、わかるところから埋めましょう。最後の5分は見直しです。
        show:
          - type: box
            w: 1100
            text: わからない問題は**後回し**、第3問は**部分点**を狙う
            color: yellow
            at:
              - 80
              - 470
