title: 宗教とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、宗教がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 宗教とは
      - say: 宗教は、世界の多くの人の生き方、文化、そして国際政治にまで深く関わっています。この科目では、主な宗教の考え方と歴史、そして現代社会との関係を学びます。
        show:
          - type: box
            w: 1100
            text: 宗教は、世界の多くの人の生き方、文化、そして国際政治にまで深く関わっています。この科目では、主な宗教の考え方と歴史、そして現代社会との関係を学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で7章です。第1章は宗教とは何か、第2章はユダヤ教、第3章はキリスト教、第4章はイスラム教、第5章はヒンドゥー教とその他の宗教、第6章はエルサレムと宗教対立、第7章は宗教と現代社会。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　宗教とは何か
              - 第2章　ユダヤ教
              - 第3章　キリスト教
              - 第4章　イスラム教
              - 第5章　ヒンドゥー教とその他の宗教
              - 第6章　エルサレムと宗教対立
              - 第7章　宗教と現代社会
            at:
              - 80
              - 150
  - board: whiteboard
    steps:
      - say: では、宗教を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、世界のニュースがわかる。中東の紛争や、各国の祝日・習慣の背景には、宗教が関わっていることが多くあります。知っているとニュースの意味が見えてきます。
        show:
          - type: box
            w: 1100
            text: |-
              **世界のニュースがわかる**
              中東の紛争や、各国の祝日・習慣の背景には、宗教が関わっていることが多くあります。知っているとニュースの意味が見えてきます。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、異なる文化を尊重できる。食べ物の決まりや祈りの習慣など、相手の信仰を知っていれば、旅行や仕事で誤解やトラブルを避けられます。
        show:
          - type: box
            w: 1100
            text: |-
              **異なる文化を尊重できる**
              食べ物の決まりや祈りの習慣など、相手の信仰を知っていれば、旅行や仕事で誤解やトラブルを避けられます。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、日本の文化を見直せる。初詣にお盆、クリスマス。日本人の宗教観の特徴も、ほかの宗教とくらべるとよくわかります。
        show:
          - type: box
            w: 1100
            text: |-
              **日本の文化を見直せる**
              初詣にお盆、クリスマス。日本人の宗教観の特徴も、ほかの宗教とくらべるとよくわかります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、海外のニュースや歴史を理解するとき、外国の人と仕事や交流をするとき、旅行で寺院・教会・モスクを訪れるとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 海外のニュースや歴史を理解するとき
              - 外国の人と仕事や交流をするとき
              - 旅行で寺院・教会・モスクを訪れるとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、教えの細かい違いより、何を大切にしている宗教かをつかむ。そして、地図と年表を一緒に思い浮かべる。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・教えの細かい違いより、**何を大切にしている宗教か**をつかむ
              ・地図と年表を一緒に思い浮かべる
            color: pink
            at:
              - 80
              - 420
