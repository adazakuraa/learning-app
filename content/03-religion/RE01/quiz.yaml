questions:
  - q: 信者の数が世界でいちばん多い宗教は何か。
    a: [キリスト教]
    explain: 約24億人。次いでイスラム教（約19億人）、ヒンドゥー教（約12億人）。
  - q: 神はただひとりだけ、と考える信仰を何というか。
    a: [一神教]
    explain: ユダヤ教・キリスト教・イスラム教が代表。3つとも「アブラハムの神」を信じている。
  - q: 日本人が神社にもお寺にも行くのは、たくさんの神を認める（　　）的な感覚のあらわれである。（　　）に入る言葉を答えよ。
    a: [多神教]
    explain: 「八百万の神」という言葉もある。
