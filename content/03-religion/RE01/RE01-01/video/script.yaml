title: 宗教とは
scenes:
  - board: slide
    steps:
      - say: 宗教の最初の章、「宗教とは何か」です。
        show:
          - { type: title, text: 第1章　宗教とは何か }
      - say: 宗教とは何か。世界にどう広がっているのか。そして、一神教と多神教のちがいを学びます。
        show:
          - type: list
            items: ["宗教とは", "世界の宗教の分布", "一神教と多神教"]
      - say: 世界のニュースや歴史、文化の多くは、宗教を知らないと理解できません。信じる、信じないとは別に、教養として、世界を読みとく道具を手に入れましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "信仰とは別に、世界を読みとく教養として宗教を知る" }

  - board: whiteboard
    steps:
      - say: 宗教とは、目に見えない、超自然的な存在への信仰と、それにもとづく実践、そして共同体のことです。
        show:
          - { type: title, text: 宗教とは }
          - { type: box, color: yellow, w: 1100, text: "**宗教** ＝ 目に見えない超自然的な存在への信仰 ＋ 実践（祈り・儀式）＋ 共同体" }

  - board: whiteboard
    steps:
      - say: 人間が宗教を持つ理由は、主に3つあります。
        show:
          - { type: title, text: 人はなぜ宗教を持つのか }
      - say: ひとつ目は、死への問いです。死んだらどうなるのか。宗教は、この問いに答えを示してきました。
        show:
          - { type: box, color: blue, w: 1100, title: ① 死への問い, text: "死んだらどうなるのか？ に答えを示す" }
      - say: ふたつ目は、苦しみへの意味づけです。理不尽な苦しみを、試練や、業、つまり行いの結果として、意味のあるものとして受け入れる枠組みをあたえます。
        show:
          - { type: box, color: pink, w: 1100, title: ② 苦しみへの意味づけ, text: "理不尽な苦しみを「試練」「業（ごう）」として受け入れる枠組み" }
      - say: みっつ目は、共同体の結びつきです。同じ信仰や儀式、価値観を分かち合うことで、社会をまとめる、接着剤の役割を果たしてきました。お祭りで、地域の人が一つになるのも、その名残りですね。
        show:
          - { type: box, color: green, w: 1100, title: ③ 共同体の結びつき, text: "同じ信仰・儀式・価値観で社会をまとめる「接着剤」（お祭りも）" }
