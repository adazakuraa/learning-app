title: 世界の宗教の分布
scenes:
  - board: whiteboard
    steps:
      - say: 「世界の宗教の分布」です。信者の数は、キリスト教がおよそ24億人、イスラム教がおよそ19億人、ヒンドゥー教がおよそ12億人、仏教がおよそ5億人です。
        show:
          - { type: title, text: 世界の宗教 }
          - { type: image, src: 1000002997.webp, at: [ 60, 120 ], w: 700 }
          - type: list
            at: [ 800, 150 ]
            items: [ "キリスト教 約24億人", "イスラム教 約19億人", "ヒンドゥー教 約12億人", "仏教 約5億人" ]

  - board: whiteboard
    steps:
      - say: 宗教の広がり方には、歴史的な理由があります。
        show:
          - { type: title, text: 広がりには歴史がある }
      - say: キリスト教が南北アメリカに広まったのは、大航海時代の植民地支配と、宣教師の布教によるものです。イスラム教が、中東から東南アジアまで広まったのは、7世紀から8世紀の軍事的な拡大と、商人たちによる布教によるものです。
        show:
          - { type: box, color: blue, w: 1100, title: キリスト教 → アメリカ大陸, text: "大航海時代の植民地支配と布教" }
          - { type: box, color: green, w: 1100, title: イスラム教 → 中東〜東南アジア, text: "7〜8世紀の軍事的拡大と、商人による布教" }
      - say: インドネシアは、世界で最もイスラム教徒が多い国ですが、これは、海の交易でやってきた商人たちが、広めたものなのです。
        added: true
        show:
          - { type: text, color: gray, text: "インドネシア（イスラム教徒が世界最多）は、商人が広めた" }

  - board: whiteboard
    steps:
      - say: 無宗教の人も、世界の人口のおよそ16パーセントに達していて、特に、日本やヨーロッパで増えています。
        show:
          - { type: title, text: 無宗教と文化 }
          - { type: text, text: "無宗教：世界人口の約16％。日本・ヨーロッパで増えている" }
      - say: ただし、初もうでや、クリスマスのように、無宗教でも、文化として宗教的な行事を行う人は多く、信仰と文化の境目は、あいまいです。
        show:
          - { type: box, color: yellow, w: 1100, text: "初もうで・クリスマス → 信仰と文化の境目はあいまい" }
  - gen: why
    board: whiteboard
    steps:
      - say: では、なぜ、無宗教の人が増えているのでしょうか。理由は、ひとつではありませんが、おもに4つの流れが指摘されています。
        show:
          - { type: title, text: なぜ無宗教が増えているのか }
      - say: ひとつ目は、科学と教育の広まりです。自然のしくみや病気の原因が、科学で説明できるようになり、宗教に答えを求める場面が、少なくなりました。
        show:
          - { type: box, color: blue, w: 1100, title: ① 科学と教育の広まり, text: 自然現象や病気を科学で説明できる → 宗教に答えを求める場面が減る }
      - say: ふたつ目は、社会が豊かで、安全になったことです。医療や年金、保険などの制度が整うと、病気や老後への不安を、宗教ではなく、社会のしくみで支えられるようになります。
        show:
          - { type: box, color: green, w: 1100, title: ② 豊かで安全な社会, text: 医療・年金・保険などの制度が、不安をやわらげる → 宗教への依存が減る }
  - gen: why
    board: whiteboard
    steps:
      - say: みっつ目は、都市化と、個人主義の広がりです。地域や家族のつながりがうすれ、教会やお寺に通う習慣が、親から子へ、受けつがれにくくなりました。
        show:
          - { type: title, text: なぜ無宗教が増えているのか（つづき） }
          - { type: box, color: pink, w: 1100, title: ③ 都市化と個人主義, text: 地域・家族のつながりがうすれる → 信仰が世代を超えて受けつがれにくい }
      - say: よっつ目は、宗教団体への不信です。不祥事や、宗教が争いの原因になってきた歴史が、宗教そのものへの、距離感につながっている、とも言われます。
        added: true
        show:
          - { type: box, color: yellow, w: 1100, title: ④ 宗教団体への不信, text: 不祥事や、宗教がからむ争いへの失望 → 組織や宗教から距離を置く人が増える }
      - say: ただし、世界全体で見ると、信者の多い地域ほど、人口が増えているため、宗教を持つ人の割合は、今後も、大きくは減らない、という予測もあります。
        added: true
        show:
          - { type: text, color: gray, text: 先進国では無宗教が増える一方、世界全体では宗教人口の割合は大きくは減らないという予測もある }
