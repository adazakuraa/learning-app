title: 一神教と多神教
scenes:
  - board: whiteboard
    steps:
      - say: 「一神教と多神教」です。宗教の根本的なちがいのひとつが、神がひとりか、たくさんいるか、です。
        show:
          - { type: title, text: 一神教 }
      - say: 一神教は、神はただひとりだけ、という信仰で、ユダヤ教、キリスト教、イスラム教が代表です。実は、この3つは、アブラハムの神という、同じ神を信じています。
        show:
          - { type: box, color: blue, w: 1100, text: "**一神教**：神はただひとり（ユダヤ教・キリスト教・イスラム教 → 同じ「アブラハムの神」）" }
          - type: svg
            w: 1000
            h: 180
            markup: |
              <circle cx="500" cy="40" r="30" stroke="#f3d77a"/>
              <path d="M480 65 L200 130 M500 70 V130 M520 65 L800 130" stroke="#9aa3ad"/>
              <g stroke="none" font-size="24" text-anchor="middle"><text x="500" y="48" fill="#f3d77a">神</text><text x="200" y="165" fill="#8fc4ff">ユダヤ教</text><text x="500" y="165" fill="#8fc4ff">キリスト教</text><text x="800" y="165" fill="#8fc4ff">イスラム教</text></g>
      - say: 一神教では、唯一の神以外をあがめてはならない、という、ほかを受け入れない面が出やすく、これが、ほかの宗教との対立を生む、ひとつの原因になります。
        show:
          - { type: text, color: pink, text: "ほかの神をあがめてはならない → ほかの宗教と対立しやすい面も" }

  - board: whiteboard
    steps:
      - say: 多神教は、たくさんの神を認める信仰です。ヒンドゥー教、古代ギリシャやローマの宗教、そして、日本の神道が代表です。
        show:
          - { type: title, text: 多神教と仏教 }
          - { type: box, color: green, w: 1100, text: "**多神教**：たくさんの神を認める（ヒンドゥー教・古代ギリシャ・ローマ・神道）" }
      - say: ほかの神がいてもよい、という発想なので、一般に、宗教どうしの対立が起きにくい傾向があります。日本人が、神社にもお寺にも行くのは、多神教的な感覚のあらわれです。八百万の神、という言葉もありますね。
        show:
          - { type: text, color: yellow, text: "神社にもお寺にも行く日本人 ＝ 多神教的な感覚（八百万の神）" }
      - say: 仏教は、この分け方に、うまく当てはまりません。特定の神をあがめるというより、悟りや解脱をめざす、教えの体系として、独自の位置をしめています。
        show:
          - { type: box, color: gray, w: 1100, title: 仏教, text: "神をあがめるより、悟り・解脱をめざす「教え」の体系" }
  - gen: diff
    board: whiteboard
    steps:
      - say: では、この、神の数のちがいは、具体的に、宗教のあり方の、どんなちがいにつながるのでしょうか。4つの点で、くらべてみましょう。ひとつ目は、神と世界の関係です。
        show:
          - { type: title, text: ちがい① 神と世界の関係 }
      - say: 一神教では、神は、世界をつくった、ただひとりの存在で、人間は、その神に従う立場です。多神教では、山や海、太陽など、自然のあちこちに神がいて、世界は、神々といっしょに、成り立っています。
        show:
          - { type: box, color: blue, at: [ 60, 200 ], w: 560, title: 一神教, text: 神は、世界をつくった唯一の存在。人間は、神に従う立場 }
          - { type: box, color: green, at: [ 660, 200 ], w: 560, title: 多神教, text: 山・海・太陽など、自然のあちこちに神がいる。神々といっしょに世界がある }
  - gen: diff
    board: whiteboard
    steps:
      - say: ふたつ目は、教えの中心です。一神教では、聖書やコーランなど、聖典の言葉を、どう信じるかが、重く見られます。多神教では、お祭りや儀式など、何をするかが中心で、信じる内容は、あまり問われません。
        show:
          - { type: title, text: ちがい② 教えの中心 }
          - { type: box, color: blue, at: [ 60, 200 ], w: 560, title: 一神教, text: 聖典の教え（教義）を、正しく信じることが大切 }
          - { type: box, color: green, at: [ 660, 200 ], w: 560, title: 多神教, text: 祭り・儀式・習慣など、「行うこと」が中心。信じる内容は問われにくい }
  - gen: diff
    board: whiteboard
    steps:
      - say: みっつ目は、ほかの宗教との関係です。一神教では、ほかの神を認めにくいので、信者を増やす布教や、改宗が、大切にされます。多神教では、ほかの神も、受け入れやすく、日本の、神仏習合のように、混ざり合うことがあります。
        show:
          - { type: title, text: ちがい③ ほかの宗教との関係 }
          - { type: box, color: blue, at: [ 60, 200 ], w: 560, title: 一神教, text: ほかの神を認めにくい。布教・改宗が大切にされる }
          - { type: box, color: green, at: [ 660, 200 ], w: 560, title: 多神教, text: ほかの神も取り入れやすい。日本の神仏習合のように混ざり合う }
  - gen: diff
    board: whiteboard
    steps:
      - say: よっつ目は、世界の見方です。一神教には、神が世界を始め、いつか終わらせる、という、直線的な歴史の見方があり、最後の審判の考え方もあります。多神教では、季節のように、くり返す世界の見方が、多く見られます。
        show:
          - { type: title, text: ちがい④ 世界の見方 }
          - { type: box, color: blue, at: [ 60, 200 ], w: 560, title: 一神教, text: 始まりと終わりがある直線的な歴史。最後の審判 }
          - { type: box, color: green, at: [ 660, 200 ], w: 560, title: 多神教, text: 季節のようにくり返す世界（循環）。輪廻の考え方も }
  - gen: diff
    board: whiteboard
    steps:
      - say: ただし、これは、あくまで、大まかな傾向です。多神教の社会でも争いはありましたし、一神教の国でも、ほかの宗教に、寛容な時代がありました。ちがいを、単純に善悪で語らないことが、大切です。
        added: true
        show:
          - { type: title, text: ただし、単純にはいえない }
          - { type: box, color: pink, w: 1100, text: 大まかな傾向にすぎない。多神教でも争いはあり、一神教にも寛容な時代があった（例：イスラム支配下のスペイン） }
