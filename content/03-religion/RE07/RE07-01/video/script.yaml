title: 宗教を持たない人々
scenes:
  - board: slide
    steps:
      - say: 宗教の最後の章、「宗教と現代社会」です。
        show:
          - { type: title, text: 第7章　宗教と現代社会 }
      - say: 宗教を持たない、という立場について、整理します。
        show:
          - type: list
            items: ["宗教を持たない人々"]
      - say: 自分は無宗教だ、と思っている人も多いでしょう。でも、その中身は、実はいくつかに分かれます。自分の立場を、言葉にしてみましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "「宗教を持たない」立場を整理し、自分の立場を言葉にする" }

  - board: whiteboard
    steps:
      - say: 無宗教、無神論、不可知論は、似ているようで、ちがいます。
        show:
          - { type: title, text: 3つの立場 }
      - say: 無宗教は、特定の宗教に属していない、という意味で、神の存在を否定しているわけではありません。日本人の多くは、これに近く、信仰は特にないけれど、初もうでには行く、という形で、文化的な宗教行事は行います。
        show:
          - { type: box, color: blue, w: 1100, title: 無宗教, text: "特定の宗教に属さない。神を否定するわけではない（初もうでには行く）" }
      - say: 無神論は、神は存在しない、と積極的に主張する立場です。理性や科学、証拠にもとづく世界の見方を重視し、宗教による説明を否定します。
        show:
          - { type: box, color: pink, w: 1100, title: 無神論, text: "「神は存在しない」と積極的に主張。理性・科学・証拠を重視" }
      - say: 不可知論は、神が存在するかどうかは、知ることができない、という立場で、肯定も、否定もしません。
        show:
          - { type: box, color: green, w: 1100, title: 不可知論, text: "「神がいるかどうかは知ることができない」。肯定も否定もしない" }
      - say: 信じる人も、信じない人も、それぞれの立場を知り、たがいに尊重し合うこと。それが、多様な人が共に暮らす現代社会で、大切な姿勢です。これで、宗教はおしまいです。おつかれさまでした。
        added: true
        show:
          - { type: text, color: yellow, text: "信じる人も信じない人も、たがいの立場を知り、尊重し合う" }
