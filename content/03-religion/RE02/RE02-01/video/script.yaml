title: ユダヤ教の誕生と歴史
scenes:
  - board: slide
    steps:
      - say: 第2章、「ユダヤ教」です。
        show:
          - { type: title, text: 第2章　ユダヤ教 }
      - say: ユダヤ教の誕生と歴史、教え、迫害の歴史、そして聖地エルサレムを学びます。
        show:
          - type: list
            items: [ "ユダヤ教の誕生と歴史", "ユダヤ教の教えと聖典", "ユダヤ人の迫害の歴史", "エルサレムとユダヤ教" ]
      - say: ユダヤ教は、キリスト教とイスラム教の、ルーツにあたる宗教です。そして、今の中東の問題を理解するうえでも、欠かせません。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "キリスト教・イスラム教のルーツと、中東問題の背景を知る" }

  - board: whiteboard
    steps:
      - say: ユダヤ教は、世界で最も古い一神教のひとつで、紀元前2000年ごろのアブラハムを、始まりの人とします。
        show:
          - { type: title, text: ユダヤ教とは }
          - { type: text, text: "世界最古の一神教のひとつ。始祖は **アブラハム**（紀元前2000年ごろ）" }
      - say: 中心にあるのは、神ヤハウェが、イスラエルの民、つまりユダヤ人を選び、特別な契約を結んだ、という選民思想です。また、いつか救世主があらわれる、という信仰もあります。
        show:
          - { type: box, color: yellow, w: 1100, title: 選民思想, text: "神 **ヤハウェ** がユダヤ人を選び、特別な契約を結んだ" }
          - { type: box, color: blue, w: 1100, title: 救世主（メシア）, text: "いつか救世主があらわれる" }

  - board: whiteboard
    steps:
      - say: 歴史の中で、ユダヤ人は、くり返し苦難を経験しました。
        show:
          - { type: title, text: 苦難の歴史 }
      - say: エジプトでの奴隷の生活から、モーセに率いられてぬけ出した、出エジプト。バビロニアに国をほろぼされ、バビロンに連れて行かれた、バビロン捕囚。そして、西暦70年に、ローマ帝国にエルサレムを破壊されたあと、世界各地に散らばった、ディアスポラです。
        show:
          - type: svg
            w: 1100
            h: 160
            markup: |
              <path d="M40 70 H1060" stroke="#9aa3ad"/>
              <g fill="#f3d77a" stroke="none"><circle cx="180" cy="70" r="10"/><circle cx="550" cy="70" r="10"/><circle cx="920" cy="70" r="10"/></g>
              <g stroke="none" text-anchor="middle"><text x="180" y="45" font-size="24" fill="#f3d77a">出エジプト</text><text x="550" y="45" font-size="24" fill="#f3d77a">バビロン捕囚</text><text x="920" y="45" font-size="24" fill="#f3d77a">ディアスポラ</text>
              <text x="180" y="110" font-size="18" fill="#9aa3ad">モーセに率いられ</text><text x="180" y="135" font-size="18" fill="#9aa3ad">奴隷からぬけ出す</text><text x="550" y="110" font-size="18" fill="#9aa3ad">国をほろぼされ</text><text x="550" y="135" font-size="18" fill="#9aa3ad">バビロンへ</text><text x="920" y="110" font-size="18" fill="#9aa3ad">西暦70年 ローマが破壊</text><text x="920" y="135" font-size="18" fill="#9aa3ad">世界各地へ散らばる</text></g>
      - say: こうした苦難の歴史が、ユダヤ人の、強い民族的、宗教的なアイデンティティを育てました。
        show:
          - { type: text, color: yellow, text: "苦難の歴史 → 強い民族的・宗教的アイデンティティ" }
      - say: ディアスポラのあと、ユダヤ人は、およそ2000年の間、自分たちの国を持たず、ヨーロッパ各地で、少数派として暮らしました。この歴史が、自分たちの国をつくろうという、シオニズム、イスラエル建国の運動へと、つながっていきます。
        show:
          - { type: box, color: pink, w: 1100, text: "約2000年、国を持たず少数派として暮らす → **シオニズム**（イスラエル建国運動）へ" }
  - gen: map
    board: whiteboard
    steps:
      - say: ここまでの歴史を、地図でたどってみましょう。ユダヤ人の故郷は、地中海の東のはし、今のイスラエルのあたりで、エルサレムは、その中心です。
        show:
          - { type: title, text: 地図でたどる、ユダヤ人の歴史 }
          - { type: image, src: map-history.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: base }
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M737.4,319.4L734.6,325.4L728.8,322.8L725.4,335.5L729.4,337.6L725.3,340.2L724.6,345.2L732.2,342.7L732.6,350L724.6,379.9L723,375L714,347.7L718.6,341.5L717.5,340.4L721.8,331.6L725.1,317.1L727.4,312.3L727.9,312.1L733.3,312.1L734.7,308.7L739.1,308.5L739.3,316.4L737.1,319.3Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <circle cx="729" cy="336.8" r="10" fill="#f3d77a" stroke="#0b1c2c" stroke-width="2.5"/>
            id: ov1
          - { type: text, text: エルサレム, at: [ 893, 463 ], size: s, color: yellow, anim: fade }
          - { type: text, text: 地中海, at: [ 575, 429 ], size: s, color: gray, anim: fade }
      - say: まず、出エジプト。エジプトで奴隷として働かされていたユダヤ人は、モーセに率いられて、シナイ半島を通り、故郷のカナンの地へ向かったとされます。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M755.9,514.3L691.9,514.3L629.4,514.3L564.5,514.3L564.5,449.4L564.5,384.7L559.7,369.8L563.8,358.2L561.3,350.2L567.2,341.1L588.6,340.8L604.2,345.8L620.1,351.4L627.6,354.3L640.1,348.3L646.7,342.9L660.9,341.4L672.4,343.8L676.8,353.1L680.5,347L693.4,351.4L706,352.5L714,347.7L723,375L724.6,379.9L720,387.3L716.5,401.2L712.2,410.7L708.4,413.9L703,408L695.8,399.9L684.3,373.4L682.6,375L689.2,394.6L699.2,413L711.4,441.1L717.3,450.9L722.5,461L737,480.6L733.8,483.7L734.3,495.1L753.1,510.8Z" fill="#9be0b0" fill-opacity="0.55" stroke="#9be0b0" stroke-width="1.5"/>
              <path d="M674.2 355.6 L687.1 372.5 L704.8 394.7 L719.4 365 L725.8 342.4" stroke="#9be0b0" stroke-width="5" stroke-dasharray="12 9"/>
              <path d="M712.5 357.4 L725.8 342.4 L729.2 362.2" stroke="#9be0b0" stroke-width="5"/>
            id: ov2
          - { type: text, text: エジプト, at: [ 753, 544 ], size: s, color: green, anim: fade, id: l21 }
          - { type: text, text: シナイ半島, at: [ 824, 553 ], size: s, color: green, anim: fade, id: l22 }
      - say: 次に、バビロン捕囚。紀元前6世紀、新バビロニアにほろぼされ、多くの人が、バビロン、今のイラクにある都市へ、連れて行かれました。
        hide:
          - ov2
          - l21
          - l22
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M793.5,329.9L787,306.5L822.7,286.3L828.8,262.5L827.3,247.9L836.1,243L844.3,230.4L851.2,227.2L870.1,229.9L875.7,235L883.4,231.6L893.9,255.6L904.4,261.5L905.7,273.1L897.6,279.9L893.8,295.1L905,313.5L924.8,324L933.1,338.5L930.4,352.2L935.6,352.2L935.7,362.1L944.6,372L935.1,371L924.2,369.5L912.4,387.3L882.4,385.8L836.9,348.3L812.9,335.1Z" fill="#8fc4ff" fill-opacity="0.55" stroke="#8fc4ff" stroke-width="1.5"/>
              <path d="M729 336.8 L753.2 284.7 L798.4 259.1 L838.7 282.8 L875.8 321.5" stroke="#8fc4ff" stroke-width="5"/>
              <path d="M869.6 302.5 L875.8 321.5 L857.1 314.5" stroke="#8fc4ff" stroke-width="5"/>
              <circle cx="877.4" cy="323.4" r="9" fill="#8fc4ff" stroke="#0b1c2c" stroke-width="2.5"/>
            id: ov3
          - { type: text, text: バビロン, at: [ 907, 479 ], size: s, color: blue, anim: fade, id: l3 }
      - say: そして、ディアスポラ。西暦70年に、ローマ帝国がエルサレムを破壊すると、ユダヤ人は、ローマ、北アフリカ、スペインなど、地中海の各地へ、さらに、ヨーロッパ全体へと、散らばっていきました。
        hide:
          - ov3
          - l3
          - ov1
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M737.4,319.4L734.6,325.4L728.8,322.8L725.4,335.5L729.4,337.6L725.3,340.2L724.6,345.2L732.2,342.7L732.6,350L724.6,379.9L723,375L714,347.7L718.6,341.5L717.5,340.4L721.8,331.6L725.1,317.1L727.4,312.3L727.9,312.1L733.3,312.1L734.7,308.7L739.1,308.5L739.3,316.4L737.1,319.3Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <path d="M729 336.8 L483.9 214.7 L362.9 132.6" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M372.9 149.9 L362.9 132.6 L382.7 135.5" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M729 336.8 L483.9 304.2 L209.7 255.1 L83.9 218.8" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M98.8 232.2 L83.9 218.8 L103.6 215.4" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M729 336.8 L643.5 348.1" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M662.5 354.4 L643.5 348.1 L660.3 337.1" stroke="#f4a3b8" stroke-width="5"/>
              <circle cx="729" cy="336.8" r="10" fill="#f3d77a" stroke="#0b1c2c" stroke-width="2.5"/>
            id: ov4
          - { type: text, text: ローマ, at: [ 483, 229 ], size: s, color: pink, anim: fade }
          - { type: text, text: スペイン, at: [ 164, 305 ], size: s, color: pink, anim: fade }
          - { type: text, text: 北アフリカ, at: [ 463, 511 ], size: s, color: pink, anim: fade }
