      - say: もう少し、拡大してみます。エルサレムは、地中海の海岸から、およそ50キロメートル、内陸に入った、標高700メートルをこえる丘の上にあります。すぐ東には、死海があります。
        hide:
          - w0
          - w1
        show:
          - { type: image, src: map-jerusalem-near.svg, at: &a2 [ 140, 140 ], w: 1000, anim: fade, id: n0 }
          - type: svg
            at: *a2
            w: 1000
            h: 520
            anim: fade
            markup: <circle cx="512.1" cy="241.8" r="11" fill="#f3d77a" stroke="#0b1c2c" stroke-width="2.5"/>
            id: n1
          - { type: text, text: エルサレム, at: [ 668, 368 ], size: s, color: yellow, anim: fade }
          - { type: text, text: 地中海, at: [ 489, 284 ], size: s, color: gray, anim: fade }
          - { type: text, text: 死海, at: [ 694, 417 ], size: s, color: blue, anim: fade }
          - { type: text, text: ヨルダン, at: [ 731, 450 ], size: s, color: white, anim: fade }
          - { type: text, text: エジプト, at: [ 469, 614 ], size: s, color: white, anim: fade }
      - say: このせまい範囲に、ユダヤ教、キリスト教、イスラム教、3つの宗教の聖地が、集まっているのです。
        show:
          - { type: text, color: yellow, text: 地中海から約50km・標高700m超の丘の上 ／ 3つの宗教の聖地が集まる, at: [ 100, 668 ], size: s }

  - board: whiteboard
    steps:
      - say: 神殿が建っていた丘、神殿の丘には、今、イスラム教の聖地、岩のドームが建っています。
        show:
          - { type: title, text: 重なり合う聖地 }
          - type: svg
            w: 1000
            h: 220
            markup: |
              <path d="M100 200 Q500 40 900 200" stroke="#9aa3ad"/>
              <path d="M420 120 Q500 50 580 120 Z" stroke="#f3d77a"/><rect x="430" y="120" width="140" height="40" stroke="#f3d77a"/>
              <rect x="300" y="160" width="400" height="40" stroke="#8fc4ff"/>
              <g stroke="none" font-size="22" text-anchor="middle"><text x="500" y="30" fill="#f3d77a">岩のドーム（イスラム教）</text><text x="500" y="188" fill="#8fc4ff">嘆きの壁（ユダヤ教）</text></g>
      - say: ユダヤ教、キリスト教、イスラム教の聖地が、このせまい場所に重なり合っている。それが、エルサレム問題の複雑さの、根本の原因になっています。くわしくは、第6章で学びます。
        show:
          - { type: box, color: pink, w: 1000, text: "3つの宗教の聖地が、せまい場所に重なり合う → エルサレム問題の根本（第6章で）" }
