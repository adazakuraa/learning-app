title: エルサレムとユダヤ教
scenes:
  - board: whiteboard
    steps:
      - say: 「エルサレムとユダヤ教」です。エルサレムは、ユダヤ教にとって、最も神聖な都市です。紀元前10世紀に、ユダヤ人のソロモン王が、神殿を建てた場所で、神が宿る場所とされました。
        show:
          - { type: title, text: 神殿と嘆きの壁 }
          - { type: text, text: "紀元前10世紀：**ソロモン王** が神殿を建てる → 神が宿る場所" }
      - say: 今、エルサレムに残る、嘆きの壁は、のちに建て直された、第二神殿の外壁の一部です。ユダヤ人は、ここに集まり、破壊された神殿をしのんで、祈ります。
        show:
          - { type: box, color: yellow, w: 1100, title: 嘆きの壁, text: "第二神殿の外壁の一部。破壊された神殿をしのんで祈る場所" }
  - gen: map
    board: whiteboard
    steps:
      - say: ところで、エルサレムは、どこにあるのでしょうか。世界地図の中では、アジアの西のはし、地中海の東の岸に近い場所です。
        show:
          - { type: title, text: エルサレムはどこ？ }
          - { type: image, src: map-jerusalem-wide.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: w0 }
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
