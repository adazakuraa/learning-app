          - { type: text, text: エルサレム, at: [ 316, 357 ], size: s, color: yellow, anim: fade }
          - { type: text, text: 地中海, at: [ 323, 364 ], size: s, color: gray, anim: fade }
          - { type: text, text: エジプト, at: [ 343, 541 ], size: s, color: white, anim: fade }
