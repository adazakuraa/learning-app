questions:
  - q: ユダヤ教で、ユダヤ人が信じる唯一の神の名前は何でしょう？
    a: [ヤハウェ, ヤーウェ]
    show: ヤハウェ
  - q: 「神がユダヤ人を選び、特別な契約を結んだ」という、ユダヤ教の核心となる考えを何というでしょう？
    a: [選民思想]
  - q: 西暦70年にローマ帝国がエルサレムを破壊したあと、ユダヤ人が世界各地に散らばったことを何というでしょう？
    a: [ディアスポラ]
  - q: ユダヤ人が自分たちの国をつくろうとした、イスラエル建国運動を何というでしょう？
    a: [シオニズム]
  - q: エルサレムにある、第二神殿の外壁の一部で、ユダヤ人が祈りをささげる場所を何というでしょう？
    a: [嘆きの壁]
