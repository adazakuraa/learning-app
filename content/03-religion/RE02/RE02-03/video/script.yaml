title: ユダヤ人の迫害の歴史
scenes:
  - board: whiteboard
    steps:
      - say: 「ユダヤ人の迫害の歴史」です。ユダヤ人は、歴史を通じて、くり返し迫害されてきました。その背景には、いくつもの理由が重なっています。
        show:
          - { type: title, text: 中世の偏見 }
      - say: 中世のヨーロッパでは、キリスト教が社会を支配していて、イエスを十字架にかけたのは、ユダヤ人だ、という偏見が広まっていました。
        show:
          - { type: box, color: pink, w: 1100, title: 宗教的な偏見, text: "「イエスを十字架にかけたのはユダヤ人だ」" }
      - say: また、ユダヤ人は、土地を持つことや、多くの職業につくことを、禁じられていました。そのため、キリスト教徒には好まれなかった、お金の貸し借りの仕事、金融業につくことが多く、ユダヤ人はお金に汚い、という偏見も生まれました。
        show:
          - { type: box, color: yellow, w: 1100, title: 職業からの偏見, text: "土地・多くの職業を禁じられる → 金融業につく →「お金に汚い」という偏見" }
      - say: 職業をしばっておきながら、その職業を理由に差別する。偏見が、偏見を生む構造ですね。
        added: true
        show:
          - { type: text, color: gray, text: "職業をしばっておいて、その職業を理由に差別する ＝ 偏見が偏見を生む" }

  - board: whiteboard
    steps:
      - say: 近代になると、ヨーロッパで民族主義が高まる中、ユダヤ人はよそ者だ、という排斥の動きが、激しくなります。
        show:
          - { type: title, text: ホロコースト }
          - { type: text, text: "近代：民族主義の高まり →「ユダヤ人はよそ者」という排斥" }
      - say: そして20世紀、ナチス・ドイツが、組織的に、およそ600万人のユダヤ人を殺害する、ホロコーストが起きました。
        show:
          - { type: box, color: pink, w: 1100, title: ホロコースト, text: "ナチス・ドイツが組織的に約600万人のユダヤ人を殺害" }
      - say: 偏見は、放っておくと、ここまで大きな悲劇につながりうる。そのことを、歴史は教えてくれています。
        added: true
        show:
          - { type: text, color: yellow, text: "偏見を放っておくと、大きな悲劇につながりうる" }
