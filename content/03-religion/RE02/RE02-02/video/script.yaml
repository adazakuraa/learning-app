title: ユダヤ教の教えと聖典
scenes:
  - board: whiteboard
    steps:
      - say: 「ユダヤ教の教えと聖典」です。ユダヤ教の特徴は、信じることより、実践を重視する点です。何を信じるかより、律法、つまり神があたえた決まりを、どう守るかが問われます。
        show:
          - { type: title, text: 信仰より実践 }
          - { type: box, color: yellow, w: 1100, text: "何を信じるかより、**律法**（神があたえた決まり）をどう守るかが大切" }
      - say: 例えば、毎週の安息日には仕事をせずに休むことや、食べてよいもの、いけないものの決まりなどがあります。
        added: true
        show:
          - { type: text, color: gray, text: "例：安息日（毎週の休みの日）には働かない・食べ物の決まり" }
      - say: また、ユダヤ人であることは、母親がユダヤ人であれば、自動的に認められる、という民族的な面も強く、信仰を持たなくても、ユダヤ人として生きることができます。
        show:
          - { type: box, color: blue, w: 1100, text: "母親がユダヤ人ならユダヤ人 → 民族としての面も強い" }

  - board: whiteboard
    steps:
      - say: 聖典は、ヘブライ語聖書、タナハです。キリスト教でいう、旧約聖書にあたります。特に、最初の5つの書、トーラー、つまり律法が重視されます。
        show:
          - { type: title, text: 聖典 }
          - { type: box, color: green, w: 1100, title: ヘブライ語聖書（タナハ）, text: "キリスト教でいう「旧約聖書」。最初の5つの書 ＝ **トーラー**（律法）が特に重要" }
      - say: また、律法の解釈をまとめた、タルムードも、大切にされています。旧約という呼び方は、新しい約束、新約を持つ、キリスト教の側からの呼び名なのです。
        show:
          - { type: box, color: yellow, w: 1100, title: タルムード, text: "律法の解釈をまとめたもの" }
          - { type: text, size: s, color: gray, text: "「旧約」は、新約を持つキリスト教側からの呼び名" }
