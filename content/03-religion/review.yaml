questions:
  - {u: RE01-01, p: 50, q: "宗教が果たしてきた役割の一つで、同じ信仰や儀式を共有することで社会をまとめる働きを何というでしょう？「共同体の〇〇」", a: [結束]}
  - {u: RE01-02, p: 65, q: "信者数は約24億人で、世界で最も信者の多い宗教は何でしょう？", a: [キリスト教]}
  - {u: RE01-03, p: 60, q: "ユダヤ教・キリスト教・イスラム教のように、神はただ一人だとする信仰を何というでしょう？", a: [一神教]}
  - {u: RE02-01, p: 50, q: "紀元前2000年ごろの人物で、ユダヤ教の始祖とされ、三つの一神教共通の祖でもあるのは誰でしょう？", a: [アブラハム]}
  - {u: RE02-01, p: 50, q: "バビロニアに故郷を滅ぼされ、ユダヤ人がバビロンに連れ去られたできごとを何というでしょう？", a: [バビロン捕囚]}
  - {u: RE02-02, p: 40, q: "ヘブライ語聖書の最初の5つの書で、ユダヤ教で特に重視される律法を何というでしょう？", a: [トーラー]}
  - {u: RE02-03, p: 60, q: "ナチス・ドイツが行った、約600万人ともいわれるユダヤ人の大量虐殺を何というでしょう？", a: [ホロコースト]}
  - {u: RE02-04, p: 55, q: "第二神殿の外壁の一部で、ユダヤ人が破壊された神殿を悼んで祈る、エルサレムの場所を何というでしょう？", a: [嘆きの壁]}
  - {u: RE03-01, p: 50, q: "キリスト教の3つの大きなグループは、カトリック、正教会と、何でしょう？", a: [プロテスタント]}
  - {u: RE04-01, p: 60, q: "洞窟で瞑想中に天使ジブリールから啓示を受け、イスラム教を始めた人物は誰でしょう？", a: [ムハンマド, マホメット]}
  - {u: RE04-02, p: 45, q: "イスラム教の宗派で、アリーとその子孫を正統な指導者とし、イランで多数派を占めるのは何派でしょう？", a: [シーア派, シーア]}
  - {u: RE04-03, p: 40, q: "西洋の近代国家で確立された、宗教と政治を切り離す原則を何というでしょう？", a: [政教分離]}
  - {u: RE05-01, p: 55, q: "ヒンドゥー教で、生まれ変わりをくり返す輪廻のサイクルから抜け出すことを何というでしょう？", a: [解脱]}
  - {u: RE05-02, p: 35, q: "インドのパンジャブ地方で15世紀に生まれ、約2500万人の信者がいる宗教は何でしょう？", a: [シク教]}
  - {u: RE05-02, p: 30, q: "紀元前7世紀ごろイランで生まれ、「最後の審判」などの考えに影響を与えたとされる宗教は何でしょう？", a: [ゾロアスター教]}
  - {u: RE06-01, p: 40, q: "エルサレム旧市街にある、イエスが処刑されたとされる場所に建つキリスト教の教会を何というでしょう？", a: [聖墳墓教会]}
  - {u: RE06-02, p: 50, q: "第一次大戦中、イギリスが同じ土地をアラブ人・ユダヤ人・フランスに別々に約束した外交を何というでしょう？", a: [三枚舌外交]}
  - {u: RE07-01, p: 45, q: "「神は存在するかどうか知ることはできない」とし、肯定も否定もしない立場を何というでしょう？", a: [不可知論]}
