title: イスラム教と現代世界
scenes:
  - board: whiteboard
    steps:
      - say: 「イスラム教と現代世界」です。イスラム教と現代世界を考えるとき、イスラム原理主義や、テロリズムと、イスラム教を、切り分けて理解することが大切です。
        show:
          - { type: title, text: イスラム教 ≠ テロ }
          - { type: box, color: yellow, w: 1100, text: "大多数のイスラム教徒はふつうの市民で、テロを支持していない" }
      - say: 大多数のイスラム教徒は、ふつうの市民であり、テロリズムを支持していません。アルカイダや、ISのような過激派組織は、イスラム教徒全体の中で、ごく一部です。
        show:
          - { type: text, color: gray, text: "アルカイダ・IS などの過激派は、ごく一部" }

  - board: whiteboard
    steps:
      - say: 一方で、政治と宗教を分ける、政教分離が当たり前の西洋社会と、宗教と、政治や法律が一体であるイスラム社会の間には、しくみの上での、まさつがあることも事実です。
        show:
          - { type: title, text: 政教分離とイスラム法 }
          - { type: box, color: blue, at: [80, 140], w: 540, title: 西洋社会, text: "**政教分離**が当たり前" }
          - { type: box, color: green, at: [660, 140], w: 540, title: イスラム社会, text: "宗教と政治・法律が一体" }
      - say: シャリーア、つまりイスラム法を、国の法律の土台にしている国もあり、民主主義や人権、女性の権利などをめぐって、価値観の対立が続いています。
        show:
          - { type: text, at: [80, 340], w: 1120, text: "**シャリーア**（イスラム法）を国の法の土台にする国も → 民主主義・人権・女性の権利をめぐる対立" }
      - say: どちらが正しいかを、すぐに決めつけるのではなく、それぞれの社会が、どんな歴史と価値観の上に成り立っているのかを、理解しようとすることが、大切です。
        added: true
        show:
          - { type: box, at: [80, 480], w: 1100, color: yellow, text: "決めつけず、それぞれの歴史と価値観を理解しようとする" }
