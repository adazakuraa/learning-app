title: その他の主要宗教
scenes:
  - board: whiteboard
    steps:
      - say: 「その他の主要な宗教」です。シク教は、15世紀に、インドのパンジャブ地方で生まれた宗教で、およそ2500万人の信者がいます。カースト制度を否定し、平等を大切にします。男性の信者が、ターバンを巻き、短い剣を身につけることで知られています。
        show:
          - { type: title, text: シク教とゾロアスター教 }
          - { type: box, color: blue, w: 1100, title: シク教, text: "15世紀インド。約2500万人。カーストを否定し平等を重視。ターバンと剣" }
      - say: ゾロアスター教は、紀元前7世紀ごろ、今のイランで生まれた宗教で、今の信者は、ごくわずかです。でも、善と悪の対立や、最後の審判、といった考えが、ユダヤ教、キリスト教、イスラム教に影響をあたえたとされ、信者の数以上に、影響力の大きな宗教です。
        show:
          - { type: box, color: yellow, w: 1100, title: ゾロアスター教, text: "古代イラン。信者はわずか。でも「善悪の対立」「**最後の審判**」が一神教に影響" }

  - board: whiteboard
    steps:
      - say: 儒教と道教は、宗教か哲学か、境目があいまいですが、中国や東アジアの文化と価値観に、深い影響をあたえています。
        show:
          - { type: title, text: 儒教と道教 }
      - say: 儒教は、孔子を始祖とする思想の体系です。礼、仁、義という道徳観は、目上の人を敬う、といった形で、日本の文化にも、色こく残っています。
        show:
          - { type: box, color: green, w: 1100, title: 儒教（孔子）, text: "「礼・仁・義」の道徳。目上を敬うなど、日本文化にも色こく残る" }
      - say: 道教は、老子や荘子の思想が中心で、無理をしない、自然のままの生き方、無為自然を目指します。
        show:
          - { type: box, color: blue, w: 1100, title: 道教（老子・荘子）, text: "無理をせず自然のままに生きる「**無為自然**」" }
      - say: きちんとした秩序を重んじる儒教と、肩の力をぬいて自然に任せる道教。東アジアの人々は、この2つを、うまく使い分けてきたともいわれます。
        added: true
        show:
          - { type: text, color: gray, text: "秩序の儒教と、自然体の道教。東アジアでは使い分けられてきた" }
