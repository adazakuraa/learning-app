title: キリスト教と現代世界
scenes:
  - board: slide
    steps:
      - say: 第3章、「キリスト教」です。
        show:
          - { type: title, text: 第3章　キリスト教 }
      - say: 世界最大の宗教、キリスト教のなりたちと、今の世界での姿を学びます。
        show:
          - type: list
            items: ["キリスト教と現代世界"]
      - say: クリスマスやイースター、西洋の美術や音楽、法律の考え方。私たちの身のまわりにも、キリスト教の影響は、たくさんあります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "西洋文明の土台、キリスト教の姿を知る" }

  - board: whiteboard
    steps:
      - say: キリスト教は、およそ24億人の信者を持つ、世界最大の宗教です。カトリック、プロテスタント、正教会という、3つの大きなグループに分かれていて、教えや儀式、組織がちがいます。
        show:
          - { type: title, text: キリスト教とは }
          - type: svg
            w: 1000
            h: 160
            markup: |
              <path d="M500 20 V60 M500 60 L180 110 M500 60 V110 M500 60 L820 110" stroke="#9aa3ad"/>
              <g stroke="none" font-size="26" text-anchor="middle"><text x="500" y="15" fill="#f3d77a">キリスト教（約24億人）</text><text x="180" y="145" fill="#8fc4ff">カトリック</text><text x="500" y="145" fill="#9be0b0">プロテスタント</text><text x="820" y="145" fill="#f4a3b8">正教会</text></g>
      - say: キリスト教は、ユダヤ教から生まれ、イエス・キリストを、救世主とみなしています。だから、ユダヤ教の聖典である旧約聖書と、イエスの言葉と行いを記した、新約聖書を、ともに聖典としています。
        show:
          - { type: box, color: yellow, w: 1000, text: "ユダヤ教から生まれる。**イエス** ＝ 救世主。聖典 ＝ **旧約聖書** ＋ **新約聖書**" }
      - say: キリスト教は、ヨーロッパ文明の根っこをつくり、さまざまな分野に、深い影響をあたえました。クリスマスや、イースターも、もとはキリスト教の行事です。
        show:
          - { type: text, color: gray, text: "クリスマス・イースターも、もとはキリスト教の行事" }

  - board: whiteboard
    steps:
      - say: 今、先進国を中心に、脱キリスト教化が進んでいます。特に、西ヨーロッパでは、教会に通う人が、大きく減りました。
        show:
          - { type: title, text: 現代のキリスト教 }
          - { type: text, color: blue, text: "先進国（特に西ヨーロッパ）：教会に通う人が激減" }
      - say: 一方、アフリカや中南米、アジアでは、信者が増えていて、キリスト教の中心は、南半球へ移りつつあります。
        show:
          - { type: text, color: green, text: "アフリカ・中南米・アジア：信者が増加 → 中心は南半球へ" }
      - say: また、アメリカでは、宗教と政治が強く結びついていて、人工妊娠中絶や、同性婚などの社会問題に、宗教的な立場が、大きく影響しています。アメリカの選挙のニュースを見るときの、大事な背景です。
        show:
          - { type: box, color: pink, w: 1100, text: "アメリカ：宗教と政治が強く結びつく（中絶・同性婚の議論に影響）" }
