title: エルサレムをめぐる争いの歴史
scenes:
  - board: whiteboard
    steps:
      - say: 「エルサレムをめぐる争いの歴史」です。エルサレムは、古代から、何度も支配者が変わってきました。
        show:
          - { type: title, text: 支配者が変わり続けた都市 }
      - say: 紀元前10世紀に、ソロモン王が神殿を建てましたが、西暦70年に、ローマが神殿を破壊し、ユダヤ人は、エルサレムを追われて、散らばりました。
        show:
          - { type: text, color: blue, text: "紀元前10世紀：ソロモン王の神殿 → 西暦70年：ローマが破壊、ユダヤ人は離散" }
      - say: 7世紀に、イスラム勢力がエルサレムを征服すると、岩のドームが建てられました。11世紀から13世紀には、十字軍が、キリスト教の聖地を取りもどす、とかかげて、一時エルサレムを占領しましたが、イスラム軍が取りもどしました。
        show:
          - { type: text, color: yellow, text: "7世紀：イスラム勢力が征服、岩のドームを建設" }
          - { type: text, color: pink, text: "11〜13世紀：十字軍が一時占領 → イスラム軍が取りもどす" }

  - board: whiteboard
    steps:
      - say: 今の混乱の出発点は、第一次世界大戦中の、イギリスの外交です。
        show:
          - { type: title, text: イギリスの三枚舌外交 }
      - say: エルサレムをふくむ、パレスチナなど中東の土地について、イギリスは、アラブ人には、独立国家を認めると約束し、ユダヤ人には、パレスチナにユダヤ人の郷土をつくることを支持すると約束し、さらにフランスとは、中東を分け合う秘密の協定を結びました。
        show:
          - type: svg
            w: 1100
            h: 240
            markup: |
              <rect x="420" y="10" width="260" height="70" rx="12" stroke="#f3d77a"/>
              <path d="M480 80 L200 150 M550 80 V150 M620 80 L900 150" stroke="#9aa3ad"/>
              <rect x="60" y="150" width="280" height="80" rx="12" stroke="#9be0b0"/><rect x="410" y="150" width="280" height="80" rx="12" stroke="#8fc4ff"/><rect x="760" y="150" width="280" height="80" rx="12" stroke="#f4a3b8"/>
              <g stroke="none" font-size="22" text-anchor="middle"><text x="550" y="53" fill="#f3d77a">イギリス</text><text x="200" y="185" fill="#9be0b0">アラブ人へ</text><text x="200" y="215" font-size="18" fill="#9be0b0">「独立国家を認める」</text><text x="550" y="185" fill="#8fc4ff">ユダヤ人へ</text><text x="550" y="215" font-size="18" fill="#8fc4ff">「郷土づくりを支持」</text><text x="900" y="185" fill="#f4a3b8">フランスと</text><text x="900" y="215" font-size="18" fill="#f4a3b8">「中東を分け合う」密約</text></g>
      - say: 同じ土地を、いくつもの相手に約束した、三枚舌外交。これが、今に続く混乱の出発点です。
        show:
          - { type: box, color: yellow, w: 1100, text: "同じ土地をいくつもの相手に約束 ＝「**三枚舌外交**」→ 今の混乱の出発点" }
  - gen: map
    board: whiteboard
    steps:
      - say: ここで、今のイスラエルと、エルサレムの場所を、地図で確認しておきましょう。
        show:
          - { type: title, text: イスラエルとエルサレムの範囲 }
          - { type: image, src: map-israel.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: m0 }
      - say: 黄色い部分が、イスラエルです。緑色の、ヨルダン川西岸と、ガザ地区は、パレスチナ人が多く住む地域です。エルサレムは、イスラエルとヨルダン川西岸の、境目あたりにあります。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M562.3,32.3L560.5,39.9L559.1,44.7L559.1,51L561.3,54.3L564.2,61.2L566,68.1L562.3,73.7L562.7,79.8L563.8,84.6L566.7,90.4L561.3,100.8L555.5,110.6L554,116.2L548.9,116.8L536.2,122.5L534.8,124.1L532.6,127.4L532.2,129.9L530.4,156.7L523.5,156.1L515.2,150.3L513.8,145.1L511.2,143.4L505.4,142.8L494.2,140.1L481.5,149L476,163.5L474.6,170.3L470.2,184.8L472.1,193.5L472.8,204.8L473.9,214.1L472.8,219.7L470.2,222.7L471,224.8L473.1,225.6L480,223.2L487.6,225.6L494.9,230.4L495.3,233.4L490.2,235.3L478.2,242.5L469.9,250.9L467.7,258.7L461.9,275.3L462.6,278.6L465.5,280.6L485.1,278.8L502.5,272.2L515.9,265.1L520.3,265.5L517.4,283.7L515.2,294.8L515.9,296.8L519.2,306.4L513.4,324L507.2,338.4L504.7,345.1L498.5,360.2L492.4,377.7L489.1,389.8L489.8,394.1L488,416.2L489.1,422.4L481.8,441.4L480,450.9L477.1,463.6L472.1,490.6L465.2,499.4L461.5,489.4L453.9,460.8L448.1,441L440.5,416.6L427.5,386.8L426.4,379.7L423.5,369.3L414.4,342.1L407.1,322.5L398.8,297.4L409.3,287.6L409.3,279.2L427.1,259.9L426.7,258.1L422,253L422.7,252.1L442.3,216.2L455,180.5L467,130.6L475.3,105.2L482.6,88.3L485.8,74.4L497.4,73.3L505.8,74.8L516.3,75.4L524.6,70L528.6,54.3L533.3,51.8L535.5,55.6L538,51.4L548.9,44.5L554,39.9L559.4,34.4Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <path d="M422,253L426.7,258.1L427.1,259.9L409.3,279.2L409.3,287.6L398.8,297.4L395.5,287.6L394.1,283.9L412.9,265.1ZM530.4,156.7L532.6,175.5L528.6,191.6L528.3,205.6L531.2,231.6L525,242.7L521.7,255.6L520.3,265.5L515.9,265.1L502.5,272.2L485.1,278.8L465.5,280.6L462.6,278.6L461.9,275.3L467.7,258.7L469.9,250.9L478.2,242.5L490.2,235.3L495.3,233.4L494.9,230.4L487.6,225.6L480,223.2L473.1,225.6L471,224.8L470.2,222.7L472.8,219.7L473.9,214.1L472.8,204.8L472.1,193.5L470.2,184.8L474.6,170.3L476,163.5L481.5,149L494.2,140.1L505.4,142.8L511.2,143.4L513.8,145.1L515.2,150.3L523.5,156.1Z" fill="#9be0b0" fill-opacity="0.55" stroke="#9be0b0" stroke-width="1.5"/>
              <circle cx="497" cy="229.9" r="10" fill="#f4a3b8" stroke="#0b1c2c" stroke-width="2.5"/>
            id: m1
          - { type: text, text: イスラエル, at: [ 665, 509 ], size: s, color: yellow, anim: fade }
          - { type: text, text: ヨルダン川西岸, at: [ 664, 290 ], size: s, color: green, anim: fade }
          - { type: text, text: ガザ地区, at: [ 369, 411 ], size: s, color: green, anim: fade }
          - { type: text, text: エルサレム, at: [ 657, 374 ], size: s, color: pink, anim: fade }
          - { type: text, text: 地中海, at: [ 504, 236 ], size: s, color: gray, anim: fade }
      - say: エルサレムの中は、1949年の停戦ラインより西が、西エルサレム、東が、旧市街をふくむ、東エルサレムです。1967年の戦争で、イスラエルは、この東側も、占領しました。
        hide:
          - m0
          - m1
        show:
          - { type: image, src: map-jerusalem-city.svg, at: &a2 [ 140, 140 ], w: 1000, anim: fade, id: z0 }
          - type: svg
            at: *a2
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M247.4 421 L468.4 421 L474.7 223 L483.2 49.6 L247.4 49.6 Z" fill="#8fc4ff" fill-opacity="0.3" stroke="#8fc4ff" stroke-width="3"/>
              <path d="M468.4 421 L647.4 421 L731.6 322 L710.5 123.9 L605.3 49.6 L483.2 49.6 L474.7 223 Z" fill="#f4a3b8" fill-opacity="0.3" stroke="#f4a3b8" stroke-width="3"/>
              <path d="M490.5 239.1 L521.1 239.1 L521.1 211.9 L490.5 211.9 Z" fill="#f3d77a" fill-opacity="0.6" stroke="#f3d77a" stroke-width="3"/>
              <path d="M472.6 421 L476.8 223 L483.2 49.6" stroke="#e8eef5" stroke-width="3" stroke-dasharray="12 9"/>
            id: z1
          - { type: text, text: 西エルサレム, at: [ 429, 388 ], size: s, color: blue, anim: fade }
          - { type: text, text: 東エルサレム, at: [ 661, 487 ], size: s, color: pink, anim: fade }
          - { type: text, text: 旧市街, at: [ 667, 353 ], size: s, color: yellow, anim: fade }
          - { type: text, text: 停戦ライン（1949年）, at: [ 362, 214 ], size: s, color: white, anim: fade }
          - { type: text, text: ※概念図（おおよその位置・縮尺は正確ではありません）, at: [ 345, 586 ], size: s, color: gray, anim: fade }

  - board: whiteboard
    steps:
      - say: 1948年に、イスラエルが建国されると、エルサレムをめぐる戦争が、くり返されます。
        show:
          - { type: title, text: イスラエル建国後 }
      - say: 1948年の第一次中東戦争で、イスラエルは西エルサレムを、1967年の第三次中東戦争で、旧市街をふくむ東エルサレムを占領し、今は、エルサレム全体を実効支配しています。
        show:
          - { type: text, color: blue, text: "1948年 第一次中東戦争：西エルサレムを占領" }
          - { type: text, color: pink, text: "1967年 第三次中東戦争：旧市街をふくむ東エルサレムを占領 → 全体を実効支配" }
      - say: 国際社会の多くは、これを認めていません。エルサレムがだれのものか、という問題は、今の中東問題の、核心のひとつなのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "国際社会の多くは認めていない。「エルサレムの地位」は中東問題の核心" }
