title: 健康保険と医療費
scenes:
  - board: whiteboard
    steps:
      - say: 「健康保険と医療費」です。病院の窓口で払うのは、原則、医療費の3割です。
        show:
          - type: title
            text: 窓口負担は3割
          - type: svg
            w: 800
            h: 380
            at:
              - 140
              - 170
            anim: fade
            markup: <rect x="63.33333333333334" y="50" width="140" height="280" rx="6" fill="#9aa3ad" fill-opacity="0.8" stroke="none"/><text x="133.33333333333334" y="38" font-size="26" fill="#9aa3ad" stroke="none" text-anchor="middle">1万円</text><text x="133.33333333333334" y="366" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">医療費</text><rect x="330" y="246" width="140" height="84" rx="6" fill="#f4a3b8" fill-opacity="0.8" stroke="none"/><text x="400" y="234" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="middle">3,000円</text><text x="400" y="366" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">自分の負担</text><rect x="596.6666666666667" y="134" width="140" height="196" rx="6" fill="#8fc4ff" fill-opacity="0.8" stroke="none"/><text x="666.6666666666667" y="122" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">7,000円</text><text x="666.6666666666667" y="366" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">健康保険</text><path d="M0 330 H800" stroke="#9aa3ad" stroke-width="2"/>
        added: true
      - say: 子どもや高齢の人は、負担がもっと少なくなります。
        show:
          - type: box
            w: 1100
            text: 子ども・高齢者は1〜2割など、負担が軽い
            color: green
            at:
              - 80
              - 580
  - board: whiteboard
    steps:
      - say: では、入院や手術で、医療費が100万円かかったら、30万円を払うのでしょうか。
        show:
          - type: title
            text: 高額療養費制度
          - type: svg
            w: 520
            h: 140
            at:
              - 80
              - 150
            anim: fade
            markup: <circle cx="50" cy="44" r="26" fill="none" stroke="#f3d77a" stroke-width="4"/><path d="M8 130 C8 88 92 88 92 130" fill="none" stroke="#f3d77a" stroke-width="4"/><text x="120" y="50" font-size="32" fill="#f3d77a" stroke="none" text-anchor="start">医療費が100万円かかった</text><text x="120" y="92" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">3割なら30万円…？</text>
        added: true
      - say: いいえ。高額療養費制度があるので、1か月の自己負担には上限があります。年収がおよそ370万円から770万円の人なら、上限は、およそ9万円です。
        show:
          - type: svg
            w: 600
            h: 360
            at:
              - 600
              - 170
            anim: fade
            markup: <rect x="80" y="50" width="140" height="260" rx="6" fill="#9aa3ad" fill-opacity="0.8" stroke="none"/><text x="150" y="38" font-size="26" fill="#9aa3ad" stroke="none" text-anchor="middle">30万円</text><text x="150" y="346" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">3割負担</text><rect x="380" y="232" width="140" height="78" rx="6" fill="#9be0b0" fill-opacity="0.8" stroke="none"/><text x="450" y="220" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">約9万円</text><text x="450" y="346" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">実際の負担</text><path d="M0 310 H600" stroke="#9aa3ad" stroke-width="2"/>
        added: true
      - say: 事前に手続きをするか、マイナ保険証を使えば、窓口での支払いも、最初から上限までで済みます。ただし、個室のベッド代や食事代は、対象外です。
        show:
          - type: box
            w: 1100
            text: マイナ保険証なら窓口で上限まで。**差額ベッド代・食事代は対象外**
            color: yellow
            at:
              - 80
              - 560
  - board: whiteboard
    steps:
      - say: 会社員なら、病気やけがで仕事を休んだとき、傷病手当金が出ます。休んで4日目から、給料のおよそ3分の2が、最長1年6か月もらえます。
        show:
          - type: title
            text: 会社員の手当
          - type: svg
            w: 1120
            h: 134
            at:
              - 80
              - 180
            anim: fade
            markup: <rect x="2" y="2" width="336" height="126" rx="14" fill="#9aa3ad" fill-opacity="0.15" stroke="#9aa3ad" stroke-width="3"/><text x="170" y="74" font-size="26" fill="#9aa3ad" stroke="none" text-anchor="middle">連続3日休む</text><path d="M348 65 L382 65 M370 55 L382 65 L370 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="392" y="2" width="336" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="560" y="74" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">4日目から支給</text><path d="M738 65 L772 65 M760 55 L772 65 L760 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="782" y="2" width="336" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="950" y="55" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">給料の約3分の2</text><text x="950" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">最長1年6か月</text>
      - say: 出産のときは、健康保険から、出産育児一時金として、50万円が出ます。
        show:
          - type: box
            w: 1100
            text: 出産育児一時金：**1人50万円**
            color: pink
            at:
              - 80
              - 380
