title: 配偶者の扶養に入っている人の保障と権利
scenes:
  - board: whiteboard
    steps:
      - say: 「配偶者の扶養に入っている人の保障と権利」です。会社員の夫や妻の扶養に入っていて、自分は働いていない人も、たくさんの保障を受けられます。
        show:
          - type: title
            text: 扶養に入っている人の保障
          - type: svg
            w: 520
            h: 172
            at:
              - 80
              - 150
            anim: fade
            markup: <circle cx="50" cy="44" r="26" fill="none" stroke="#f3d77a" stroke-width="4"/><path d="M8 130 C8 88 92 88 92 130" fill="none" stroke="#f3d77a" stroke-width="4"/><text x="120" y="50" font-size="32" fill="#f3d77a" stroke="none" text-anchor="start">Gさん（40歳）</text><text x="120" y="92" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">夫は会社員</text><text x="120" y="128" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">自分は専業主婦で、夫の扶養に入っている</text>
        added: true
      - say: 扶養に入れるのは、会社員や公務員の配偶者で、年収が130万円未満の人です。手続きは、配偶者の勤め先を通して行います。
        show:
          - type: box
            w: 1100
            text: 条件の目安：会社員・公務員の配偶者で、**年収130万円未満**
            color: yellow
            at:
              - 80
              - 340
  - board: whiteboard
    steps:
      - say: 受けられる保障を、見ていきましょう。まず、自分で保険料を払わずに、健康保険に入れます。病院の窓口負担は、3割です。
        show:
          - type: title
            text: 自分で保険料を払わずに入れる
          - type: svg
            w: 900
            h: 200
            at:
              - 190
              - 170
            anim: fade
            markup: <rect x="0" y="0" width="900" height="90" rx="10" fill="#f4a3b8" fill-opacity="0.22" stroke="#f4a3b8" stroke-width="3"/><text x="450" y="41" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="middle">健康保険</text><text x="450" y="73" font-size="22" fill="#eef0ea" stroke="none" text-anchor="middle">窓口負担3割・高額療養費も使える</text><rect x="0" y="100" width="900" height="90" rx="10" fill="#f3d77a" fill-opacity="0.22" stroke="#f3d77a" stroke-width="3"/><text x="450" y="141" font-size="30" fill="#f3d77a" stroke="none" text-anchor="middle">国民年金（第3号被保険者）</text><text x="450" y="173" font-size="22" fill="#eef0ea" stroke="none" text-anchor="middle">払ったことになり、将来、老齢基礎年金がもらえる</text>
      - say: そして、国民年金にも、保険料を払わずに入れます。これを、第3号被保険者といいます。払ったのと同じ扱いになるので、将来、自分の年金がもらえます。
        show:
          - type: box
            w: 1100
            text: 第3号被保険者：保険料なしで、**払ったのと同じ扱い**
            color: yellow
            at:
              - 80
              - 400
  - board: whiteboard
    steps:
      - say: ほかにも、受けられる保障があります。
        show:
          - type: title
            text: ほかにも使える保障
      - say: 障害が残ったときの障害年金。配偶者が亡くなったときの遺族年金。出産したときは、50万円の出産育児一時金も受け取れます。
        show:
          - type: svg
            w: 1120
            h: 134
            at:
              - 80
              - 180
            anim: fade
            markup: <rect x="2" y="2" width="336" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="170" y="55" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">障害年金</text><text x="170" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">障害が残ったとき</text><rect x="392" y="2" width="336" height="126" rx="14" fill="#f4a3b8" fill-opacity="0.15" stroke="#f4a3b8" stroke-width="3"/><text x="560" y="55" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="middle">遺族年金</text><text x="560" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">配偶者が亡くなったとき</text><rect x="782" y="2" width="336" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="950" y="55" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">出産育児一時金</text><text x="950" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">1人50万円</text>
      - say: そして、忘れがちなのが、健康診断です。40歳から74歳の人には、配偶者の健康保険から、特定健診の案内が届きます。無料か、少ない負担で受けられます。
        show:
          - type: box
            w: 1100
            text: "**40〜74歳：特定健診**（配偶者の健康保険から案内が届く）"
            color: yellow
            at:
              - 80
              - 380
      - say: がん検診は、住んでいる市区町村が行っています。会社員と違って、自分から申し込まないと受けないことが多いので、案内を見逃さないようにしましょう。
        show:
          - type: box
            w: 1100
            text: "**がん検診**：市区町村が実施。**自分から申し込む**"
            color: orange
            at:
              - 80
              - 490
  - board: whiteboard
    steps:
      - say: 一方で、受けられないものもあります。病気で休んだときの傷病手当金、失業手当、育児休業給付などは、自分が会社の保険に入っている人のためのものなので、対象外です。
        show:
          - type: title
            text: 受けられないもの
          - type: list
            items:
              - 傷病手当金・出産手当金
              - 失業手当・育児休業給付
              - 自分の厚生年金（2階部分）
      - say: 自分名義の老後資金は、iDeCoやNISAで準備できます。
        read: 自分名義の老後資金は、イデコやニーサで準備できます。
        show:
          - type: box
            w: 1100
            text: 自分の老後資金：**iDeCo（月2.3万円まで）・NISA**
            color: green
            at:
              - 80
              - 350
  - board: whiteboard
    steps:
      - say: 最後に、とても大切な手続きの話です。配偶者が会社をやめたときや、65歳になったときは、自分の健康保険と年金を、切りかえる必要があります。
        show:
          - type: title
            text: 手続きが必要なとき
          - type: list
            items:
              - 配偶者が**退職・自営業**になった → 国民健康保険・国民年金へ
              - 配偶者が**65歳**になった → 自分が60歳未満なら国民年金へ
              - 自分の年収が**130万円以上**になった → 扶養から外れる
              - "**離婚** → 国民健康保険・国民年金へ。年金分割は2年以内に請求"
      - say: たとえば、夫が定年で退職したとき、手続きを忘れると、自分の年金に、払っていない期間ができてしまいます。わからないときは、年金事務所や、市区町村の窓口に相談しましょう。
        show:
          - type: svg
            w: 900
            h: 172
            at:
              - 80
              - 420
            anim: fade
            markup: <circle cx="50" cy="44" r="26" fill="none" stroke="#f3d77a" stroke-width="4"/><path d="M8 130 C8 88 92 88 92 130" fill="none" stroke="#f3d77a" stroke-width="4"/><text x="120" y="50" font-size="32" fill="#f3d77a" stroke="none" text-anchor="start">夫が定年退職</text><text x="120" y="92" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">→ 14日以内に、自分の保険と年金の手続き</text><text x="120" y="128" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">わからなければ年金事務所へ</text>
        added: true
