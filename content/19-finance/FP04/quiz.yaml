questions:
  - q: 1か月の医療費の自己負担に上限を設ける制度を何というか。
    a: [高額療養費制度, 高額療養費]
    show: 高額療養費制度
  - q: 会社員が病気で仕事を休んだとき、健康保険から出る、給料の約3分の2の手当を何というか。
    a: [傷病手当金]
  - q: 介護保険に加入して保険料を払い始めるのは何歳からか。
    a: ['40', 40歳]
    show: 40歳
  - q: 失業したとき、基本手当（失業手当）の手続きをする窓口はどこか。
    a: [ハローワーク]
  - q: 会社員の配偶者の扶養に入り、保険料を払わずに国民年金に加入している人を、第何号被保険者というか。
    a: ['3', 第3号, 3号]
    show: 第3号被保険者
