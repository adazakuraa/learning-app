title: 介護保険
scenes:
  - board: whiteboard
    steps:
      - say: 「介護保険」です。40歳になると、全員が介護保険に入り、保険料を払い始めます。
        show:
          - type: title
            text: 介護保険のしくみ
          - type: svg
            w: 1120
            h: 134
            at:
              - 80
              - 190
            anim: fade
            markup: <rect x="2" y="2" width="336" height="126" rx="14" fill="#9aa3ad" fill-opacity="0.15" stroke="#9aa3ad" stroke-width="3"/><text x="170" y="55" font-size="26" fill="#9aa3ad" stroke="none" text-anchor="middle">40歳</text><text x="170" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">加入・保険料スタート</text><path d="M348 65 L382 65 M370 55 L382 65 L370 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="392" y="2" width="336" height="126" rx="14" fill="#f3a76a" fill-opacity="0.15" stroke="#f3a76a" stroke-width="3"/><text x="560" y="55" font-size="26" fill="#f3a76a" stroke="none" text-anchor="middle">65歳以上</text><text x="560" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">介護が必要なら利用</text><path d="M738 65 L772 65 M760 55 L772 65 L760 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="782" y="2" width="336" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="950" y="55" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">自己負担</text><text x="950" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">原則1割</text>
      - say: 使えるのは、主に65歳以上で、介護が必要になった人です。サービスを使ったときの自己負担は、原則1割です。
        show:
          - type: box
            w: 1100
            text: サービスの自己負担：**原則1割**（所得により2〜3割）
            color: yellow
            at:
              - 80
              - 390
  - board: whiteboard
    steps:
      - say: 使うためには、まず市区町村に申請して、どのくらい介護が必要かの認定を受けます。
        show:
          - type: title
            text: 使うまでの流れ
          - type: svg
            w: 1120
            h: 134
            at:
              - 80
              - 180
            anim: fade
            markup: <rect x="2" y="2" width="238.5" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="121.25" y="55" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">相談</text><text x="121.25" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">地域包括支援センター</text><path d="M250.5 65 L284.5 65 M272.5 55 L284.5 65 L272.5 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="294.5" y="2" width="238.5" height="126" rx="14" fill="#9aa3ad" fill-opacity="0.15" stroke="#9aa3ad" stroke-width="3"/><text x="413.75" y="74" font-size="26" fill="#9aa3ad" stroke="none" text-anchor="middle">申請・調査</text><path d="M543 65 L577 65 M565 55 L577 65 L565 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="587" y="2" width="238.5" height="126" rx="14" fill="#f3a76a" fill-opacity="0.15" stroke="#f3a76a" stroke-width="3"/><text x="706.25" y="55" font-size="26" fill="#f3a76a" stroke="none" text-anchor="middle">要介護認定</text><text x="706.25" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">要支援1〜要介護5</text><path d="M835.5 65 L869.5 65 M857.5 55 L869.5 65 L857.5 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="879.5" y="2" width="238.5" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="998.75" y="55" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">ケアプラン</text><text x="998.75" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">ケアマネジャー</text>
      - say: たとえば、親の物忘れが進んできたと感じたら、まず、親が住んでいる地域の、地域包括支援センターに相談しましょう。無料で、手続きの方法を教えてくれます。
        show:
          - type: svg
            w: 520
            h: 172
            at:
              - 80
              - 380
            anim: fade
            markup: <circle cx="50" cy="44" r="26" fill="none" stroke="#f3d77a" stroke-width="4"/><path d="M8 130 C8 88 92 88 92 130" fill="none" stroke="#f3d77a" stroke-width="4"/><text x="120" y="50" font-size="32" fill="#f3d77a" stroke="none" text-anchor="start">親の物忘れが心配</text><text x="120" y="92" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">→ 親が住む地域の</text><text x="120" y="128" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">　地域包括支援センターへ（無料）</text>
        added: true
  - board: whiteboard
    steps:
      - say: 介護にかかるお金は、平均で、月およそ9万円。期間は、およそ5年という調査があります。大きな出費なので、早めに知っておくことが大切です。
        show:
          - type: title
            text: 介護のお金の目安
          - type: svg
            w: 1100
            h: 150
            at:
              - 80
              - 180
            anim: fade
            markup: <text x="244" y="49" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">1か月</text><rect x="260" y="20" width="487.5" height="44" rx="6" fill="#f3a76a" fill-opacity="0.8" stroke="none"/><text x="761.5" y="49" font-size="26" fill="#f3a76a" stroke="none" text-anchor="start">約9万円</text><text x="244" y="119" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">期間</text><rect x="260" y="90" width="270.83333333333337" height="44" rx="6" fill="#8fc4ff" fill-opacity="0.8" stroke="none"/><text x="544.8333333333334" y="119" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="start">約5年</text>
