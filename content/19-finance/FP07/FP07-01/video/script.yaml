title: 税金の全体像
scenes:
  - board: slide
    steps:
      - say: 第7章、「税金」です。所得税と住民税の仕組み、年末調整、確定申告、身近な税金を学びます。
        show:
          - type: title
            text: 第7章　税金
          - type: list
            items:
              - 税金の全体像
              - 所得税のしくみ
              - 住民税と手取り
              - 年末調整
              - 確定申告
              - 消費税・固定資産税など
  - board: whiteboard
    steps:
      - say: 「税金の全体像」です。税金には、国に払う国税と、都道府県や市区町村に払う地方税があります。
        show:
          - type: title
            text: 国税と地方税
          - type: box
            w: 560
            text: |-
              ・所得税
              ・消費税（一部）
              ・相続税・贈与税
            title: 国税
            color: blue
            at:
              - 60
              - 160
          - type: box
            w: 560
            text: |-
              ・住民税
              ・固定資産税
              ・自動車税
            title: 地方税
            color: green
            at:
              - 660
              - 160
  - board: whiteboard
    steps:
      - say: 会社員の給料からは、税金だけでなく、社会保険料も引かれます。
        show:
          - type: title
            text: 給料から引かれるもの
      - say: たとえば、月給30万円の人。社会保険料がおよそ4万5千円、所得税と住民税が、あわせておよそ1万7千円。手取りは、およそ24万円になります。
        show:
          - type: svg
            w: 520
            h: 208
            at:
              - 80
              - 150
            anim: fade
            markup: <circle cx="50" cy="44" r="26" fill="none" stroke="#f3d77a" stroke-width="4"/><path d="M8 130 C8 88 92 88 92 130" fill="none" stroke="#f3d77a" stroke-width="4"/><text x="120" y="50" font-size="32" fill="#f3d77a" stroke="none" text-anchor="start">月給30万円の会社員（例）</text><text x="120" y="92" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">社会保険料 約4.5万円</text><text x="120" y="128" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">所得税＋住民税 約1.7万円</text><text x="120" y="164" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">→ 手取り 約24万円</text>
          - type: svg
            w: 1100
            h: 220
            at:
              - 80
              - 360
            anim: fade
            markup: <text x="244" y="49" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">社会保険料</text><rect x="260" y="20" width="121.875" height="44" rx="6" fill="#f4a3b8" fill-opacity="0.8" stroke="none"/><text x="395.875" y="49" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="start">約4.5万円</text><text x="244" y="119" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">税金</text><rect x="260" y="90" width="46.041666666666664" height="44" rx="6" fill="#f3a76a" fill-opacity="0.8" stroke="none"/><text x="320.0416666666667" y="119" font-size="26" fill="#f3a76a" stroke="none" text-anchor="start">約1.7万円</text><text x="244" y="189" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">手取り</text><rect x="260" y="160" width="650" height="44" rx="6" fill="#9be0b0" fill-opacity="0.8" stroke="none"/><text x="924" y="189" font-size="26" fill="#9be0b0" stroke="none" text-anchor="start">約24万円</text>
        added: true
      - say: 意外にも、税金より、社会保険料のほうが大きいことが多いのです。
        show:
          - type: box
            w: 1100
            text: 税金より**社会保険料のほうが大きい**ことが多い
            color: yellow
            at:
              - 80
              - 590
  - board: whiteboard
    steps:
      - say: 税金を安くする基本は、控除を漏れなく使うことです。控除とは、税金の計算のときに、差し引けるもののことです。
        show:
          - type: title
            text: 控除を使う
          - type: box
            w: 1100
            text: "**控除**＝税金の計算で差し引けるもの。漏れなく使う"
            color: yellow
            at:
              - 80
              - 170
