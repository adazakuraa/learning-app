questions:
  - q: 所得が多い人ほど高い税率がかかる、所得税の仕組みを何というか。
    a: [累進課税]
  - q: 住民税は、所得のおよそ何%か。
    a: ['10', 10%]
    show: 約10%
  - q: 会社員の1年分の所得税を、12月に会社がまとめて精算する手続きを何というか。
    a: [年末調整]
  - q: 家族の医療費が1年で10万円をこえたとき、確定申告で使える控除を何というか。
    a: [医療費控除]
  - q: ふるさと納税で、上限内なら実質の自己負担はいくらか。
    a: [2000円, '2000', 2000]
    show: 2,000円
