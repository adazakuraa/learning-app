title: 年金はいくら？いつから？
scenes:
  - board: whiteboard
    steps:
      - say: 「年金はいくら？いつから？」です。国民年金は、40年間すべて払うと、年およそ83万円。月にすると、およそ7万円です。
        show:
          - type: title
            text: 年金額の目安
          - type: svg
            w: 1100
            h: 150
            at:
              - 80
              - 180
            anim: fade
            markup: <text x="284" y="49" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">国民年金（満額）</text><rect x="300" y="20" width="185.6521739130435" height="44" rx="6" fill="#f3d77a" fill-opacity="0.8" stroke="none"/><text x="499.6521739130435" y="49" font-size="26" fill="#f3d77a" stroke="none" text-anchor="start">月 約7万円</text><text x="284" y="119" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">会社員夫婦（例）</text><rect x="300" y="90" width="610" height="44" rx="6" fill="#8fc4ff" fill-opacity="0.8" stroke="none"/><text x="924" y="119" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="start">月 20万円台</text>
      - say: 厚生年金は、働いた期間と給料で決まります。自分の見込み額は、毎年届く、ねんきん定期便や、ねんきんネットで確認できます。
        show:
          - type: box
            w: 1100
            text: 自分の見込み額：**ねんきん定期便・ねんきんネット**
            color: green
            at:
              - 80
              - 380
  - board: whiteboard
    steps:
      - say: 年金は、原則65歳からですが、60歳から75歳のあいだで、もらい始める時期を選べます。
        show:
          - type: title
            text: もらい始める時期を選べる
      - say: 早くもらうと、1か月あたり0.4パーセント減ります。60歳からなら、24パーセント減。逆に、遅らせると、1か月あたり0.7パーセント増え、75歳からなら、84パーセントも増えます。しかも、その額が一生続きます。
        show:
          - type: svg
            w: 900
            h: 420
            at:
              - 140
              - 160
            anim: fade
            markup: <rect x="50.62499999999999" y="237.82608695652175" width="123.75000000000001" height="132.17391304347825" rx="6" fill="#f4a3b8" fill-opacity="0.8" stroke="none"/><text x="112.5" y="225.82608695652175" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="middle">76%</text><text x="112.5" y="406" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">60歳</text><rect x="275.625" y="196.08695652173913" width="123.75000000000001" height="173.91304347826087" rx="6" fill="#f3d77a" fill-opacity="0.8" stroke="none"/><text x="337.5" y="184.08695652173913" font-size="26" fill="#f3d77a" stroke="none" text-anchor="middle">100%</text><text x="337.5" y="406" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">65歳</text><rect x="500.625" y="123.04347826086956" width="123.75000000000001" height="246.95652173913044" rx="6" fill="#9be0b0" fill-opacity="0.8" stroke="none"/><text x="562.5" y="111.04347826086956" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">142%</text><text x="562.5" y="406" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">70歳</text><rect x="725.625" y="50" width="123.75000000000001" height="320" rx="6" fill="#9be0b0" fill-opacity="0.8" stroke="none"/><text x="787.5" y="38" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">184%</text><text x="787.5" y="406" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">75歳</text><path d="M0 370 H900" stroke="#9aa3ad" stroke-width="2"/>
  - board: whiteboard
    steps:
      - say: どちらが得かは、何歳まで生きるかで変わります。65歳からと70歳からを比べると、受け取る合計は、およそ82歳でぬき返されます。
        show:
          - type: title
            text: どちらが得？
          - type: svg
            w: 1000
            h: 420
            at:
              - 140
              - 170
            anim: draw
            markup: <path d="M60 370 H840 M60 370 V20" stroke="#9aa3ad" stroke-width="2" fill="none"/><text x="60" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">65歳</text><text x="255" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">70歳</text><text x="450" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">75歳</text><text x="645" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">80歳</text><text x="840" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">85歳</text><path d="M60.0 370.0 L255.0 294.4 L450.0 218.9 L645.0 143.3 L840.0 67.8" stroke="#f3d77a" stroke-width="5" fill="none"/><text x="852" y="60.77777777777777" font-size="24" fill="#f3d77a" stroke="none" text-anchor="start">65歳から</text><path d="M60.0 370.0 L255.0 370.0 L450.0 262.7 L645.0 155.4 L840.0 48.1" stroke="#9be0b0" stroke-width="5" fill="none"/><text x="852" y="71.13333333333333" font-size="24" fill="#9be0b0" stroke="none" text-anchor="start">70歳から</text>
        added: true
      - say: 年金のいちばんの強みは、長生きしても、一生もらえることです。健康や貯金、働き続けられるかを考えて、選びましょう。
        show:
          - type: box
            w: 1100
            text: 年金は**一生もらえる**＝長生きへの保険
            color: yellow
            at:
              - 80
              - 600
