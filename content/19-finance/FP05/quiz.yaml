questions:
  - q: 日本の公的年金で、1階部分にあたる、20歳から60歳の全員が入る年金は何でしょう？
    a: [国民年金, 基礎年金]
    show: 国民年金（基礎年金）
  - q: 会社員や公務員が入る、2階部分の年金は何でしょう？
    a: [厚生年金]
  - q: 年金を受け取り始める時期を75歳まで遅らせると、65歳からと比べて何%増えるでしょう？
    a: ['84', 84%]
    show: 84%
  - q: 病気やけがで生活や仕事に支障が出たときに受け取れる年金を何というでしょう？
    a: [障害年金]
  - q: 自分の年金の見込み額を確認できる、毎年届くお知らせを何というでしょう？
    a: [ねんきん定期便]
