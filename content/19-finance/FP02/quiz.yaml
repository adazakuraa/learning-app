questions:
  - q: 家計を見直すとき、まず手をつけるべきなのは固定費と変動費のどちらか。
    a: [固定費]
  - q: 生活防衛資金の目安は、生活費の何か月分か。「3〜（　）か月分」
    a: ['6', 6か月]
    show: 3〜6か月分
  - q: 給料が入ったら、先に貯金の分を別の口座に移しておく方法を何というか。
    a: [先取り貯蓄]
  - q: 銀行が破綻しても、預金保険で守られるのは、1金融機関あたり元本いくらまでか。
    a: [1000万円, '1000', 1000万]
    show: 1,000万円（とその利息）
  - q: 毎月の支払いが一定になるが、手数料が年15%前後かかるカードの払い方を何というか。
    a: [リボ払い, リボルビング払い]
    show: リボ払い
