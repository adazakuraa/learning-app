questions:
  - q: 利息にもさらに利息がつく増え方を何というでしょう？
    a: [複利]
  - q: 年6%で運用すると、お金はおよそ何年で2倍になるでしょう？（72の法則）
    a: ['12', 12年]
    show: 約12年
    explain: 72÷6＝12。
  - q: 物価が上がり続け、お金の価値が下がることを何というでしょう？
    a: [インフレ, インフレーション]
    show: インフレ
  - q: 預金の金利が0.5%、物価上昇率が2%のとき、実質金利は何%でしょう？
    a: ['-1.5', −1.5%, マイナス1.5]
    show: −1.5%
  - q: 1ドル＝100円から1ドル＝150円になることを、円高・円安のどちらというでしょう？
    a: [円安]
