title: FP・お金の教養とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、FP・お金の教養がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: FP・お金の教養とは
      - say: FP・お金の教養では、家計、貯蓄、保険、年金、税金、住まい、投資、ローン、相続まで、大人なら知っておきたいお金の基礎を、ひととおり学びます。
        show:
          - type: box
            w: 1100
            text: FP・お金の教養では、家計、貯蓄、保険、年金、税金、住まい、投資、ローン、相続まで、大人なら知っておきたいお金の基礎を、ひととおり学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で13章です。第1章はお金と人生設計の基本、第2章は家計管理と貯蓄、第3章は金利・インフレ・お金の時間価値、第4章は社会保険、第5章は年金、第6章は民間保険、第7章は税金、第8章は住まい、第9章は資産運用の基礎、第10章はローン・信用・詐欺、第11章は人生の出来事とお金、第12章は相続・贈与・老後・介護、第13章はお金の教養の総まとめ。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　お金と人生設計の基本
              - 第2章　家計管理と貯蓄
              - 第3章　金利・インフレ・お金の時間価値
              - 第4章　社会保険
              - 第5章　年金
              - 第6章　民間保険
              - 第7章　税金
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第8章　住まい
              - 第9章　資産運用の基礎
              - 第10章　ローン・信用・詐欺
              - 第11章　人生の出来事とお金
              - 第12章　相続・贈与・老後・介護
              - 第13章　お金の教養の総まとめ
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、FP・お金の教養を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、お金の不安が減る。年金や老後資金、保険。仕組みを知ると、漠然とした不安が、具体的な計画に変わります。
        show:
          - type: box
            w: 1100
            text: |-
              **お金の不安が減る**
              年金や老後資金、保険。仕組みを知ると、漠然とした不安が、具体的な計画に変わります。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、損をしにくくなる。手数料の高い商品、必要以上の保険、詐欺。仕組みを知ることが、いちばんの防御です。
        show:
          - type: box
            w: 1100
            text: |-
              **損をしにくくなる**
              手数料の高い商品、必要以上の保険、詐欺。仕組みを知ることが、いちばんの防御です。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、使える制度を逃さない。NISA、iDeCo、高額療養費、児童手当。知らないと使えない制度がたくさんあります。
        read: みっつ目は、使える制度を逃さない。ニーサ、イデコ、高額療養費、児童手当。知らないと使えない制度がたくさんあります。
        show:
          - type: box
            w: 1100
            text: |-
              **使える制度を逃さない**
              NISA、iDeCo、高額療養費、児童手当。知らないと使えない制度がたくさんあります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、保険やローンを選ぶとき、税金や年金の手続きをするとき、貯金や投資の計画を立てるとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 保険やローンを選ぶとき
              - 税金や年金の手続きをするとき
              - 貯金や投資の計画を立てるとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、自分の家計に当てはめながら学ぶ。そして、制度は変わるので、最新の公式情報も確認する。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・自分の家計に**当てはめながら**学ぶ
              ・制度は変わるので、最新の公式情報も確認する
            color: pink
            at:
              - 80
              - 420
