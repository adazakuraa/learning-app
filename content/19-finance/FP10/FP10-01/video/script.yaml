title: リボ払いと分割払いの落とし穴
scenes:
  - board: slide
    steps:
      - say: 第10章、「ローン・信用・詐欺」です。借金の落とし穴、信用情報、詐欺の手口、そして困ったときの相談先を学びます。
        show:
          - type: title
            text: 第10章　ローン・信用・詐欺
          - type: list
            items:
              - リボ払いの落とし穴
              - 借入と奨学金
              - 信用情報
              - 詐欺と悪質商法
              - 借金で困ったとき
  - board: whiteboard
    steps:
      - say: 「リボ払いと分割払いの落とし穴」です。リボ払いは、いくら買い物をしても、毎月の支払いが一定になる払い方です。楽に見えますが、手数料は、年15パーセント前後もかかります。
        show:
          - type: title
            text: リボ払いのしくみ
          - type: tag
            text: 手数料 年15%前後
            color: pink
            at:
              - 1000
              - 52
      - say: 毎月の支払いが少ないと、そのほとんどが手数料にあてられ、元の借金、元金が、なかなか減りません。
        show:
          - type: svg
            w: 900
            h: 300
            at:
              - 190
              - 260
            anim: fade
            markup: <rect x="0" y="0" width="900" height="90" rx="10" fill="#f3d77a" fill-opacity="0.22" stroke="#f3d77a" stroke-width="3"/><text x="450" y="55" font-size="30" fill="#f3d77a" stroke="none" text-anchor="middle">毎月の支払い 1万円</text><rect x="180" y="100" width="540" height="90" rx="10" fill="#f4a3b8" fill-opacity="0.22" stroke="#f4a3b8" stroke-width="3"/><text x="450" y="141" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="middle">うち手数料（はじめは約3,750円）</text><text x="450" y="173" font-size="22" fill="#eef0ea" stroke="none" text-anchor="middle">30万円の残高に年15%</text><rect x="180" y="200" width="540" height="90" rx="10" fill="#8fc4ff" fill-opacity="0.22" stroke="#8fc4ff" stroke-width="3"/><text x="450" y="241" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="middle">うち元金（はじめは約6,250円）</text><text x="450" y="273" font-size="22" fill="#eef0ea" stroke="none" text-anchor="middle">なかなか減らない</text>
  - board: whiteboard
    steps:
      - say: たとえば、30万円を、毎月1万円のリボ払いで返すと、終わるまでにおよそ3年、手数料はおよそ8万円です。その間に、また買い物をすると、残高は、ほとんど減りません。
        show:
          - type: title
            text: 返し終わるまで
          - type: svg
            w: 1000
            h: 420
            at:
              - 140
              - 170
            anim: draw
            markup: <path d="M60 370 H840 M60 370 V20" stroke="#9aa3ad" stroke-width="2" fill="none"/><text x="60" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">0か月</text><text x="216" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">8</text><text x="372" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">16</text><text x="528" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">24</text><text x="684" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">32</text><text x="840" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">38</text><path d="M60.0 51.3 L216.0 106.5 L372.0 168.1 L528.0 236.1 L684.0 310.5 L840.0 370.0" stroke="#f4a3b8" stroke-width="5" fill="none"/><text x="852" y="378" font-size="24" fill="#f4a3b8" stroke="none" text-anchor="start">リボ残高</text>
        added: true
      - say: 支払いは一括払いが基本です。すでにリボの残高があれば、多めに払って、早く減らしましょう。自動リボの設定にも注意です。
        show:
          - type: box
            w: 1100
            text: "**一括払いが基本**。残高は多めに払って早く減らす"
            color: yellow
            at:
              - 80
              - 610
