title: 借入と奨学金
scenes:
  - board: whiteboard
    steps:
      - say: 「借入と奨学金」です。借りるときは、借りる額だけでなく、利息を含めた返す合計と、無理なく返せるかを、必ず確認します。
        show:
          - type: title
            text: 借りる前の確認
      - say: 金利は、借入の種類によって、大きく違います。住宅ローンは年1パーセント前後、カードローンやキャッシングは、年15パーセント前後になることもあります。
        show:
          - type: svg
            w: 1100
            h: 290
            at:
              - 80
              - 200
            anim: fade
            markup: <text x="314" y="49" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">住宅ローン</text><rect x="330" y="20" width="32.22222222222222" height="44" rx="6" fill="#9be0b0" fill-opacity="0.8" stroke="none"/><text x="376.22222222222223" y="49" font-size="26" fill="#9be0b0" stroke="none" text-anchor="start">年0.5〜2%程度</text><text x="314" y="119" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">自動車・教育ローン</text><rect x="330" y="90" width="96.66666666666666" height="44" rx="6" fill="#8fc4ff" fill-opacity="0.8" stroke="none"/><text x="440.66666666666663" y="119" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="start">年1〜5%程度</text><text x="314" y="189" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">カードローン</text><rect x="330" y="160" width="483.33333333333337" height="44" rx="6" fill="#f3a76a" fill-opacity="0.8" stroke="none"/><text x="827.3333333333334" y="189" font-size="26" fill="#f3a76a" stroke="none" text-anchor="start">年3〜18%程度</text><text x="314" y="259" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">リボ・キャッシング</text><rect x="330" y="230" width="580" height="44" rx="6" fill="#f4a3b8" fill-opacity="0.8" stroke="none"/><text x="924" y="259" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="start">年15〜18%程度</text>
  - board: whiteboard
    steps:
      - say: 法律のルールもあります。金利の上限は、借りる額によって、年15から20パーセント。消費者金融などから借りられるのは、年収の3分の1までです。
        show:
          - type: title
            text: 法律のルール
          - type: list
            items:
              - "**利息制限法**：金利の上限は年15〜20%"
              - "**総量規制**：消費者金融などは**年収の3分の1まで**"
              - それより高い金利の「ヤミ金」には絶対に借りない
  - board: whiteboard
    steps:
      - say: 奨学金を返すのが苦しくなったら、滞納する前に、日本学生支援機構に相談しましょう。毎月の返済額を減らす、減額返還や、返済を待ってもらう、返還期限猶予が、申請できます。
        show:
          - type: title
            text: 奨学金が返せないとき
          - type: svg
            w: 1120
            h: 134
            at:
              - 80
              - 220
            anim: fade
            markup: <rect x="2" y="2" width="336" height="126" rx="14" fill="#f4a3b8" fill-opacity="0.15" stroke="#f4a3b8" stroke-width="3"/><text x="170" y="74" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="middle">返済が苦しい</text><path d="M348 65 L382 65 M370 55 L382 65 L370 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="392" y="2" width="336" height="126" rx="14" fill="#f3d77a" fill-opacity="0.15" stroke="#f3d77a" stroke-width="3"/><text x="560" y="74" font-size="26" fill="#f3d77a" stroke="none" text-anchor="middle">滞納する前に相談</text><path d="M738 65 L772 65 M760 55 L772 65 L760 75" stroke="#9aa3ad" stroke-width="4" fill="none"/><rect x="782" y="2" width="336" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="950" y="74" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">減額返還・猶予</text>
