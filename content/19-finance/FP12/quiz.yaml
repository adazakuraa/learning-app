questions:
  - q: 相続人が配偶者と子ども2人のとき、配偶者の法定相続分はいくつか。
    a: [2分の1, '1/2']
    show: 2分の1
  - q: 借金が多いときに、相続をしないための手続きを何というか。期限は3か月以内。
    a: [相続放棄]
  - q: 相続税の基礎控除。法定相続人が3人なら、いくらまで相続税がかからないか。
    a: [4800万円, '4800', 4800万]
    show: 4,800万円
    explain: 3000万円＋600万円×3人＝4800万円。
  - q: 贈与税は、もらう人1人あたり年いくらまでかからないか。
    a: [110万円, '110', 110万]
    show: 110万円
  - q: 元気なうちに、将来の財産管理をしてくれる人を自分で選んでおく制度を何というか。
    a: [任意後見, 任意後見制度]
    show: 任意後見
