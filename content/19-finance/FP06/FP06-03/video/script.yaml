title: 損害保険
scenes:
  - board: whiteboard
    steps:
      - say: 「損害保険」です。家や車、そして、他人に与えた損害に備える保険です。
        show:
          - type: title
            text: 主な損害保険
          - type: svg
            w: 1120
            h: 134
            at:
              - 80
              - 190
            anim: fade
            markup: <rect x="2" y="2" width="238.5" height="126" rx="14" fill="#f3a76a" fill-opacity="0.15" stroke="#f3a76a" stroke-width="3"/><text x="121.25" y="55" font-size="26" fill="#f3a76a" stroke="none" text-anchor="middle">火災保険</text><text x="121.25" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">火事・風水害</text><rect x="294.5" y="2" width="238.5" height="126" rx="14" fill="#f4a3b8" fill-opacity="0.15" stroke="#f4a3b8" stroke-width="3"/><text x="413.75" y="55" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="middle">地震保険</text><text x="413.75" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">地震・津波</text><rect x="587" y="2" width="238.5" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="706.25" y="55" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">自動車保険</text><text x="706.25" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">事故</text><rect x="879.5" y="2" width="238.5" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="998.75" y="55" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">個人賠償責任</text><text x="998.75" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">日常の事故の賠償</text>
  - board: whiteboard
    steps:
      - say: 火災保険は、火事だけでなく、台風や大雨の被害にも備えられます。ただし、地震による火事や倒壊は、火災保険では出ません。地震保険は、火災保険とセットで入ります。
        show:
          - type: title
            text: 火災保険と地震保険
          - type: box
            w: 1100
            text: 地震による火事・倒壊は**火災保険では出ない** → **地震保険**（火災保険とセット）
            color: pink
            at:
              - 80
              - 160
      - say: ハザードマップで、自宅の水害のリスクを確認して、補償を選びましょう。
        show:
          - type: box
            w: 1100
            text: "**ハザードマップ**で水害リスクを確認して選ぶ"
            color: blue
            at:
              - 80
              - 280
  - board: whiteboard
    steps:
      - say: ぜひ知っておきたいのが、個人賠償責任保険です。
        show:
          - type: title
            text: 個人賠償責任保険
      - say: たとえば、子どもが自転車で、歩いている人にぶつかり、大けがをさせてしまった。こうした事故で、およそ1億円の賠償を命じられた例もあります。
        show:
          - type: svg
            w: 520
            h: 172
            at:
              - 80
              - 150
            anim: fade
            markup: <circle cx="50" cy="44" r="26" fill="none" stroke="#f3d77a" stroke-width="4"/><path d="M8 130 C8 88 92 88 92 130" fill="none" stroke="#f3d77a" stroke-width="4"/><text x="120" y="50" font-size="32" fill="#f3d77a" stroke="none" text-anchor="start">自転車事故の例</text><text x="120" y="92" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">子どもが自転車で歩行者にぶつかった</text><text x="120" y="128" font-size="24" fill="#eef0ea" stroke="none" text-anchor="start">→ 約1億円の賠償を命じられた例も</text>
        added: true
      - say: 個人賠償責任保険なら、月に数百円で、億単位の補償が得られます。火災保険や、自動車保険の特約として、つけられることが多いです。
        show:
          - type: svg
            w: 1100
            h: 150
            at:
              - 80
              - 360
            anim: fade
            markup: <text x="244" y="49" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">保険料（月）</text><rect x="260" y="20" width="6.5" height="44" rx="6" fill="#9be0b0" fill-opacity="0.8" stroke="none"/><text x="280.5" y="49" font-size="26" fill="#9be0b0" stroke="none" text-anchor="start">数百円</text><text x="244" y="119" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">補償額</text><rect x="260" y="90" width="650" height="44" rx="6" fill="#f3d77a" fill-opacity="0.8" stroke="none"/><text x="924" y="119" font-size="26" fill="#f3d77a" stroke="none" text-anchor="start">1億円以上も</text>
  - board: whiteboard
    steps:
      - say: 車の保険では、強制加入の自賠責保険だけでは足りません。任意の自動車保険で、相手へのけがや物の補償は、無制限にしておくのが基本です。
        show:
          - type: title
            text: 自動車保険
          - type: box
            w: 560
            text: |-
              ・相手のけがだけ
              ・金額に上限あり
              ・物の損害は出ない
            title: 自賠責保険（強制）
            color: gray
            at:
              - 60
              - 160
          - type: box
            w: 560
            text: |-
              ・対人・対物は**無制限**に
              ・自分のけがや車も
            title: 任意の自動車保険
            color: blue
            at:
              - 660
              - 160
