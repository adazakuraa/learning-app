questions:
  - q: 保険が向いているのは、起きる確率が低く、損失が（　　）リスクである。（　　）に入る言葉を答えよ。
    a: [大きい]
  - q: 決まった期間だけ保障し、保険料が安い掛け捨ての生命保険を何というか。
    a: [定期保険]
  - q: 地震による火事や倒壊の損害に備えるには、火災保険とセットで何保険に入るか。
    a: [地震保険, 地震]
    show: 地震保険
  - q: 自転車事故などで他人にけがをさせたときに備える、月数百円で入れる保険を何というか。
    a: [個人賠償責任保険]
  - q: 住宅ローンを組んだ人が亡くなるとローンの残りがなくなる保険を何というか。
    a: [団体信用生命保険, 団信]
    show: 団体信用生命保険（団信）
