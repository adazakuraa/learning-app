title: お金の優先順位
scenes:
  - board: whiteboard
    steps:
      - say: 「お金の優先順位」です。お金の使い道には、順番があります。土台をつくってから、投資に進むのが基本です。
        show:
          - type: title
            text: お金のピラミッド
      - say: 下から順に、まず高い金利の借金を返す。次に、生活防衛資金をためる。そして、保険で大きなリスクに備え、最後に、投資で増やします。
        show:
          - type: svg
            w: 900
            h: 400
            at:
              - 190
              - 170
            anim: fade
            markup: <rect x="270" y="0" width="360" height="90" rx="10" fill="#9be0b0" fill-opacity="0.22" stroke="#9be0b0" stroke-width="3"/><text x="450" y="41" font-size="30" fill="#9be0b0" stroke="none" text-anchor="middle">④ 増やす</text><text x="450" y="73" font-size="22" fill="#eef0ea" stroke="none" text-anchor="middle">NISA・iDeCoで長期投資</text><rect x="180" y="100" width="540" height="90" rx="10" fill="#8fc4ff" fill-opacity="0.22" stroke="#8fc4ff" stroke-width="3"/><text x="450" y="141" font-size="30" fill="#8fc4ff" stroke="none" text-anchor="middle">③ 守る</text><text x="450" y="173" font-size="22" fill="#eef0ea" stroke="none" text-anchor="middle">必要な分だけ保険</text><rect x="90" y="200" width="720" height="90" rx="10" fill="#f3d77a" fill-opacity="0.22" stroke="#f3d77a" stroke-width="3"/><text x="450" y="241" font-size="30" fill="#f3d77a" stroke="none" text-anchor="middle">② 生活防衛資金</text><text x="450" y="273" font-size="22" fill="#eef0ea" stroke="none" text-anchor="middle">生活費の3〜6か月分</text><rect x="0" y="300" width="900" height="90" rx="10" fill="#f4a3b8" fill-opacity="0.22" stroke="#f4a3b8" stroke-width="3"/><text x="450" y="341" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="middle">① 高金利の借金を返す</text><text x="450" y="373" font-size="22" fill="#eef0ea" stroke="none" text-anchor="middle">リボ払い・カードローン</text>
  - board: whiteboard
    steps:
      - say: なぜ、借金を返すのが先なのでしょうか。
        show:
          - type: title
            text: なぜこの順番？
      - say: たとえば、年15パーセントの、リボ払いの残高があるとします。これを返すことは、年15パーセントで、確実にもうかるのと同じです。そんな投資は、まずありません。
        show:
          - type: svg
            w: 1100
            h: 150
            at:
              - 60
              - 190
            anim: fade
            markup: <text x="284" y="49" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">リボ払いを返す</text><rect x="300" y="20" width="610" height="44" rx="6" fill="#f4a3b8" fill-opacity="0.8" stroke="none"/><text x="924" y="49" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="start">確実に年15%分トク</text><text x="284" y="119" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">投資の期待リターン</text><rect x="300" y="90" width="203.33333333333331" height="44" rx="6" fill="#9be0b0" fill-opacity="0.8" stroke="none"/><text x="517.3333333333333" y="119" font-size="26" fill="#9be0b0" stroke="none" text-anchor="start">年数%（不確実）</text>
        added: true
      - say: また、預金がないまま投資をすると、急な出費のときに、値下がりしたタイミングで売ることになりがちです。だから、生活防衛資金が先なのです。
        show:
          - type: box
            w: 1100
            text: 預金なしで投資 → 急な出費で**値下がり中に売る**はめに
            color: yellow
            at:
              - 80
              - 400
  - board: whiteboard
    steps:
      - say: まとめです。借金を返す、ためる、守る、増やす。この順番を覚えておきましょう。投資は、当面使わないお金で行います。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 高金利の借金を返す
              - ② 生活防衛資金をためる
              - ③ 保険で大きなリスクに備える
              - ④ 当面使わないお金で投資
