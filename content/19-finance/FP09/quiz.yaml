questions:
  - q: 投資でいう「リスク」とは、危険ではなく何のことでしょう？
    a: [ぶれ幅, 振れ幅, 結果のぶれ幅, 値動きの振れ幅]
    show: 結果のぶれ幅
  - q: 毎月同じ金額で買い続け、安いときに多く、高いときに少なく買える方法を何というでしょう？
    a: [ドルコスト平均法]
  - q: 新NISAで、一生のうちに使える非課税の上限額はいくらでしょう？
    a: [1800万円, '1800', 1800万]
    show: 1,800万円
  - q: 自分で掛金を出して運用し、掛金が全額所得控除になるが原則60歳まで引き出せない制度を何というでしょう？
    a: [iDeCo, イデコ, 個人型確定拠出年金]
    show: iDeCo（個人型確定拠出年金）
  - q: 投資信託を持っているあいだ、毎年かかる手数料を何というでしょう？
    a: [信託報酬]
