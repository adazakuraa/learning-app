title: 長期・積立・分散
scenes:
  - board: whiteboard
    steps:
      - say: 「長期・積立・分散」です。投資の初心者でも実践しやすい、基本の戦略です。
        show:
          - type: title
            text: 長期・積立・分散
          - type: svg
            w: 1120
            h: 134
            at:
              - 80
              - 190
            anim: fade
            markup: <rect x="2" y="2" width="336" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="170" y="55" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">長期</text><text x="170" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">時間を味方に</text><rect x="392" y="2" width="336" height="126" rx="14" fill="#f3d77a" fill-opacity="0.15" stroke="#f3d77a" stroke-width="3"/><text x="560" y="55" font-size="26" fill="#f3d77a" stroke="none" text-anchor="middle">積立</text><text x="560" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">買う時期を分ける</text><rect x="782" y="2" width="336" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="950" y="55" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">分散</text><text x="950" y="95" font-size="20" fill="#9aa3ad" stroke="none" text-anchor="middle">国・資産を分ける</text>
  - board: whiteboard
    steps:
      - say: 積立のよいところを、例で見てみましょう。毎月1万円ずつ、同じ投資信託を買います。
        show:
          - type: title
            text: 毎月1万円ずつ買うと
        added: true
      - say: 値段が1万円の月は、1口。8千円に下がった月は、1.25口。1万2千円に上がった月は、0.83口。安いときに多く、高いときに少なく、自動で買えるのです。これを、ドルコスト平均法といいます。
        show:
          - type: svg
            w: 900
            h: 400
            at:
              - 140
              - 170
            anim: fade
            markup: <rect x="80" y="110" width="140" height="240" rx="6" fill="#8fc4ff" fill-opacity="0.8" stroke="none"/><text x="150" y="98" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">1口</text><text x="150" y="386" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">1月 1万円</text><rect x="380" y="50" width="140" height="300" rx="6" fill="#9be0b0" fill-opacity="0.8" stroke="none"/><text x="450" y="38" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">1.25口</text><text x="450" y="386" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">2月 8千円</text><rect x="680" y="150.8" width="140" height="199.2" rx="6" fill="#f4a3b8" fill-opacity="0.8" stroke="none"/><text x="750" y="138.8" font-size="26" fill="#f4a3b8" stroke="none" text-anchor="middle">0.83口</text><text x="750" y="386" font-size="24" fill="#eef0ea" stroke="none" text-anchor="middle">3月 1.2万円</text><path d="M0 350 H900" stroke="#9aa3ad" stroke-width="2"/>
        added: true
      - say: いつ買えばいいか、悩まなくてよいのが、積立の大きな利点です。
        show:
          - type: box
            w: 1100
            text: "**買う時期に悩まなくてよい**"
            color: yellow
            at:
              - 80
              - 600
  - board: whiteboard
    steps:
      - say: そして、長く続けるほど、複利の効果が大きくなります。毎月3万円を、年5パーセントで運用できたとすると、10年でおよそ466万円、20年でおよそ1233万円、30年では、およそ2500万円になります。
        show:
          - type: title
            text: 長く続けるほど増える
          - type: svg
            w: 1000
            h: 420
            at:
              - 140
              - 170
            anim: draw
            markup: <path d="M60 370 H840 M60 370 V20" stroke="#9aa3ad" stroke-width="2" fill="none"/><text x="60" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">0年</text><text x="190" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">5</text><text x="320" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">10</text><text x="450" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">15</text><text x="580" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">20</text><text x="710" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">25</text><text x="840" y="404" font-size="22" fill="#9aa3ad" stroke="none" text-anchor="middle">30年</text><path d="M60.0 370.0 L190.0 346.5 L320.0 322.9 L450.0 299.4 L580.0 275.8 L710.0 252.3 L840.0 228.8" stroke="#9aa3ad" stroke-width="5" fill="none"/><text x="852" y="221.76923076923077" font-size="24" fill="#9aa3ad" stroke="none" text-anchor="start">積み立てた元本 1,080万</text><path d="M60.0 370.0 L190.0 343.3 L320.0 309.1 L450.0 265.1 L580.0 208.8 L710.0 136.3 L840.0 43.5" stroke="#9be0b0" stroke-width="5" fill="none"/><text x="852" y="66.46923076923076" font-size="24" fill="#9be0b0" stroke="none" text-anchor="start">運用の結果 約2,500万</text>
        added: true
      - say: ただし、実際の成績は、年によって大きく変わります。株価が大きく下がる年もあります。そんなときに、慌てて売らずに続けた人が、長い目では報われてきました。
        show:
          - type: box
            w: 1100
            text: 下がったときに**慌てて売らない**ことが大切
            color: pink
            at:
              - 80
              - 610
