title: 相談先と信頼できる情報
scenes:
  - board: whiteboard
    steps:
      - say: 「相談先と信頼できる情報」です。お金の悩みは、内容によって、相談する専門家が違います。
        show:
          - type: title
            text: 悩みごとの相談先
          - type: list
            items:
              - 税金・確定申告 → **税務署・税理士**
              - 年金 → **年金事務所・社会保険労務士**
              - 借金・トラブル → **法テラス・弁護士・司法書士**
              - 契約・詐欺 → **消費者ホットライン188**
              - 家計全体 → **ファイナンシャルプランナー**
              - 介護 → **地域包括支援センター**
  - board: whiteboard
    steps:
      - say: ファイナンシャルプランナーに相談するときは、その人が、誰からお金をもらっているかを確認しましょう。相談料をもらう独立系の人と、商品の販売手数料で収入を得る人がいます。
        show:
          - type: title
            text: FPに相談するとき
          - type: box
            w: 560
            text: |-
              ・相談料を払う
              ・特定の商品に偏りにくい
            title: 独立系FP
            color: green
            at:
              - 60
              - 160
          - type: box
            w: 560
            text: |-
              ・相談は無料のことが多い
              ・商品の販売が前提のことも
            title: 金融機関・保険代理店
            color: pink
            at:
              - 660
              - 160
  - board: whiteboard
    steps:
      - say: 信頼できる情報は、金融庁、国税庁、日本年金機構などの、公式のサイトにあります。SNSの、必ずもうかる、という情報は、疑ってかかりましょう。
        read: 信頼できる情報は、金融庁、国税庁、日本年金機構などの、公式のサイトにあります。エスエヌエスの、必ずもうかる、という情報は、疑ってかかりましょう。
        show:
          - type: title
            text: 信頼できる情報源
          - type: list
            items:
              - "**金融庁・国税庁・日本年金機構**"
              - 厚生労働省・消費者庁
              - J-FLEC（金融経済教育推進機構）
          - type: box
            w: 1100
            text: SNSの「必ずもうかる」は**疑う**
            color: pink
            at:
              - 80
              - 400
      - say: この科目で学んだことは、自分の家計を見直す、きっかけです。制度は変わるので、最新の情報を確かめながら、役立ててください。
        show:
          - type: box
            w: 1100
            text: 学んだことを、**自分の家計の見直し**に役立てよう
            color: yellow
            at:
              - 80
              - 510
