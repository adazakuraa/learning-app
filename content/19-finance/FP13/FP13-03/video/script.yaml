title: 年代別のお金のチェックリスト
scenes:
  - board: whiteboard
    steps:
      - say: 「年代別のお金のチェックリスト」です。この科目で学んだことを、年代ごとに整理します。
        show:
          - type: title
            text: 20代・30代
      - say: 20代は、手取りと支出を知り、生活防衛資金をためる。NISAで、少しずつ積み立てを始める。クレジットカードは一括払いで、延滞をしない。
        read: 20代は、手取りと支出を知り、生活防衛資金をためる。ニーサで、少しずつ積み立てを始める。クレジットカードは一括払いで、延滞をしない。
        show:
          - type: box
            w: 1100
            text: "**20代**：生活防衛資金／NISAで少額積立／カードは一括・延滞しない"
            color: green
            at:
              - 80
              - 160
      - say: 30代は、結婚や出産のお金、必要な分だけの保険、住まいの判断、教育資金の準備です。
        show:
          - type: box
            w: 1100
            text: "**30代**：結婚・出産のお金／保険は必要な分だけ／住まい／教育資金"
            color: blue
            at:
              - 80
              - 280
  - board: whiteboard
    steps:
      - say: 40代は、老後のお金を見積もり、iDeCoも活用。親と、介護や相続の話もしておきます。
        read: 40代は、老後のお金を見積もり、イデコも活用。親と、介護や相続の話もしておきます。
        show:
          - type: title
            text: 40代・50代・60代〜
          - type: box
            w: 1100
            text: "**40代**：老後資金の見積もり／iDeCo／親と介護・相続の話"
            color: yellow
            at:
              - 80
              - 160
      - say: 50代は、ねんきん定期便で年金額を確認し、退職金や、60代以降の働き方を考えます。
        show:
          - type: box
            w: 1100
            text: "**50代**：年金額の確認／退職金／60代以降の働き方"
            color: orange
            at:
              - 80
              - 280
      - say: 60代からは、年金を受け取る時期を決め、退職金の運用は慎重に。介護、相続、エンディングノートの準備も進めます。
        show:
          - type: box
            w: 1100
            text: "**60代〜**：年金の受け取り時期／退職金は慎重に／介護・相続の準備"
            color: pink
            at:
              - 80
              - 400
  - board: whiteboard
    steps:
      - say: どの年代でも大切なのは、年に1回、家計とお金の計画を見直すこと。そして、詐欺に気をつけ、制度の変更を確認することです。
        show:
          - type: title
            text: どの年代でも
          - type: list
            items:
              - 年1回、**家計とお金の計画を見直す**
              - "**詐欺**に注意"
              - "**制度の変更**を確認"
