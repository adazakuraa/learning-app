questions:
  - q: 世の中の金利に合わせて返済額が変わる住宅ローンの金利タイプを何というか。
    a: [変動金利]
  - q: 年末の住宅ローン残高の0.7%が税金から差し引かれる制度を何というか。
    a: [住宅ローン控除, 住宅ローン減税]
    show: 住宅ローン控除
  - q: 住宅ローン控除で、年末の残高が3000万円なら、その年に最大いくら税金が安くなるか。
    a: [21万円, '21', 21万]
    show: 21万円
    explain: 3000万円×0.7%＝21万円。
  - q: 賃貸の退去時、日焼けや家具の跡などふつうの使用による傷みは、借りた人と大家のどちらの負担が原則か。
    a: [大家, 大家さん, 貸主]
    show: 大家（貸主）
  - q: 浸水や土砂災害のリスクを確認できる地図を何というか。
    a: [ハザードマップ]
