title: 不動産の基礎知識
scenes:
  - board: whiteboard
    steps:
      - say: 「不動産の基礎知識」です。不動産の価格は、何より、立地で決まります。駅からの距離、周りの環境、そして、将来その地域の人口がどうなるかを見ます。
        show:
          - type: title
            text: 価格を決めるのは立地
          - type: svg
            w: 1120
            h: 134
            at:
              - 80
              - 200
            anim: fade
            markup: <rect x="2" y="2" width="336" height="126" rx="14" fill="#8fc4ff" fill-opacity="0.15" stroke="#8fc4ff" stroke-width="3"/><text x="170" y="74" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="middle">駅からの距離</text><rect x="392" y="2" width="336" height="126" rx="14" fill="#9be0b0" fill-opacity="0.15" stroke="#9be0b0" stroke-width="3"/><text x="560" y="74" font-size="26" fill="#9be0b0" stroke="none" text-anchor="middle">周りの環境</text><rect x="782" y="2" width="336" height="126" rx="14" fill="#f3d77a" fill-opacity="0.15" stroke="#f3d77a" stroke-width="3"/><text x="950" y="74" font-size="26" fill="#f3d77a" stroke="none" text-anchor="middle">将来の人口</text>
  - board: whiteboard
    steps:
      - say: 土地の値段には、いくつかの目安があります。国が毎年出す公示地価。相続税の計算に使う路線価は、その約8割。固定資産税の計算に使う評価額は、約7割です。
        show:
          - type: title
            text: 土地の価格の目安
          - type: svg
            w: 1100
            h: 220
            at:
              - 80
              - 180
            anim: fade
            markup: <text x="304" y="49" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">公示地価</text><rect x="320" y="20" width="590" height="44" rx="6" fill="#f3d77a" fill-opacity="0.8" stroke="none"/><text x="924" y="49" font-size="26" fill="#f3d77a" stroke="none" text-anchor="start">基準</text><text x="304" y="119" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">路線価（相続税用）</text><rect x="320" y="90" width="472" height="44" rx="6" fill="#8fc4ff" fill-opacity="0.8" stroke="none"/><text x="806" y="119" font-size="26" fill="#8fc4ff" stroke="none" text-anchor="start">約8割</text><text x="304" y="189" font-size="26" fill="#eef0ea" stroke="none" text-anchor="end">固定資産税評価額</text><rect x="320" y="160" width="413" height="44" rx="6" fill="#9be0b0" fill-opacity="0.8" stroke="none"/><text x="747" y="189" font-size="26" fill="#9be0b0" stroke="none" text-anchor="start">約7割</text>
  - board: whiteboard
    steps:
      - say: 家を買う前、借りる前には、ハザードマップで、浸水や土砂災害のリスクを確認しましょう。建物が、1981年6月以降の、新しい耐震基準かどうかも、大切なポイントです。
        show:
          - type: title
            text: 買う前・借りる前のチェック
          - type: list
            items:
              - "**ハザードマップ**：浸水・土砂災害"
              - "**耐震基準**：1981年6月以降の新耐震か"
              - "**登記**：持ち主・ローンの担保を確認"
