- unit: math-ma08-03
  note: 練習問題④の解説：戊→戌（いぬ）
  find: '        （解説）単純に考えれば、10×12=120通りになりそうであるが、そうはならない。十干の1番目である「甲」は、はじめは十二支の子と合わせて「甲子」を作るが、2巡目では、十二支がまだ1周していないため、子ではなく、2個前の戊（いぬ）と、3巡目にはさらに2個前の申（さる）と、というように、2個前の十二支と結びつくことになる。このことから、「甲子」に戻ってくるのは、12 / 2 = 6巡目であることが分かる。十干が6巡してもとに戻るので、組み合わせは全部で、10 × 6 = 60通りである。なお、10と12の最小公倍数が60である。'
  replace: '        （解説）単純に考えれば、10×12=120通りになりそうであるが、そうはならない。十干の1番目である「甲」は、はじめは十二支の子と合わせて「甲子」を作るが、2巡目では、十二支がまだ1周していないため、子ではなく、2個前の戌（いぬ）と、3巡目にはさらに2個前の申（さる）と、というように、2個前の十二支と結びつくことになる。このことから、「甲子」に戻ってくるのは、12 / 2 = 6巡目であることが分かる。十干が6巡してもとに戻るので、組み合わせは全部で、10 × 6 = 60通りである。なお、10と12の最小公倍数が60である。'
