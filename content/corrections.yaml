  replace: "人間の体の多くの細胞は、数日から数年で入れ替わっています（脳の神経細胞のように、一生ほとんど入れ替わらない細胞もあります）。体をつくる原子も、食べ物や呼吸を通じて少しずつ入れ替わり、10年前の自分と今の自分は、物質としてはかなり別のものになっています。"
