- unit: math-ma03-02
  note: 練習問題③④の答えが抜けていた（問題文が重複していた）ため答えを補った
  find: "    \n    ③次のうち、（ア）x軸に平行、（イ）y軸に平行、になるものをそれぞれ選べ。\n    y=x , y=-4 , y=2x, x=12, 3x+4y=0, x=-y\n    ④ あなたの家のエアコンは古く、夏の電気代に悩まされています。そのまま使い続けると、買い替え費用は かからないが、1か月の電気代が 8,000円かかる。最新の省エネ機種に買い替えると、本体と工事費で最初に120,000円 かかるが、1か月の電気代は 3,000円 に下がる。最新機種に買い替えた場合、「何ヶ月」より長く使い続ければお得になるか。"
  replace: "    - ③\n        \n        （答）（ア）x軸に平行：y=-4　（イ）y軸に平行：x=12\n        \n        （解説）y=（数）の形はxが変わってもyが一定なので、x軸に平行な直線になる。x=（数）の形は、y軸に平行な直線になる。\n        \n    - ④\n        \n        （答）24か月\n        \n        （解説）使う月数をxとする。古いエアコンの費用は8000x円、新しいエアコンの費用は120000+3000x円。8000x=120000+3000xを解くとx=24。24か月より長く使えば、買い替えた方がお得になる。"
