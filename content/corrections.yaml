- unit: math-ma04-04
  note: 練習問題①の解説
  find: '        （解説）電車を利用する人とバスを利用する人の積集合（共通部分）を求めたい。両方使う人が1人もいないとすると、31+16=47となり、全体の41人より大きくなってしまう。そのため、溢れた6人（47-41）は、どちらも利用していると考えられる。'
  replace: '        （解説）電車またはバスを使う人（和集合）は、31+16-9=38人（両方使う9人を二重に数えないよう引く）。全体41人から引くと、どちらも使わない人は41-38=3人。'
