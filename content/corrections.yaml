  replace: '- 細胞呼吸は三段階あり、①解糖系（細胞質基質）→②クエン酸回路（**ミトコンドリア**）→③電子伝達系（ミトコンドリア）という順序で化学反応が進み、エネルギーが作られます。'
- unit: biology-bi07-02
  note: 爬虫類と哺乳類は、両生類に近い祖先から生まれた「陸で卵を産める仲間（有羊膜類）」から分かれた
