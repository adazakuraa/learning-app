  replace: '        （答）（1）1/45（2）28/45（3）17/45'
- unit: math-ma05-06
  note: 練習問題⑧(1)の解説
  find: '            1本目で当たる確率は、3/10である。1本当たりを引くと、残りのくじは全部で9本、当たりはそのうち1本になるので、2回目に当たる確率は1/9となる。つまり、3/10 × 1/9=1/30。'
  replace: '            1本目で当たる確率は、2/10である。1本当たりを引くと、残りのくじは全部で9本、当たりはそのうち1本になるので、2回目に当たる確率は1/9となる。つまり、2/10 × 1/9=2/90=1/45。'
- unit: math-ma05-06
  note: 練習問題⑧(2)の解説
  find: '            1本目で外れる確率は、7/10。1本外れを引くと、残りは全部で9本、当たりはそのうち2本なので、そこでも外れる確率は7/9。つまり、7/10 × 7/9=49/90。'
  replace: '            1本目で外れる確率は、8/10。1本外れを引くと、残りは全部で9本、外れはそのうち7本なので、そこでも外れる確率は7/9。つまり、8/10 × 7/9=56/90=28/45。'
- unit: math-ma05-06
  note: 練習問題⑧(3)の解説
  find: '            少なくとも1回は当たる、ということは、1本目でのみ当たるパターン、2本目でのみ当たるパターン、両方とも当たるパターンの全てを考えて足さなければならない。これは面倒なので、1本も当たらない確率（**余事象**と呼ぶ）を1（=100%）から引くことによって答えを求める。1本とも当たらない確率は（2）より、49/90である。つまり、答えは1 - 49/90 = 41/90。'
  replace: '            少なくとも1回は当たる、ということは、1本目でのみ当たるパターン、2本目でのみ当たるパターン、両方とも当たるパターンの全てを考えて足さなければならない。これは面倒なので、1本も当たらない確率（**余事象**と呼ぶ）を1（=100%）から引くことによって答えを求める。1本とも当たらない確率は（2）より、28/45である。つまり、答えは1 - 28/45 = 17/45。'
- unit: math-ma05-06
  note: 練習問題⑨：解説を正しい考え方に差し替え（答えは同じ）
  find: '        （解説）はじめに選んだ箱に宝物が入っている確率は単純に1/3である。悩ましいのは、もう1つを選んだ場合の確率である。ある条件があった場合の確率は**条件付き確率**の考え方を用いる。自分が選ばなかった2つの箱のうち、友人が選んだ箱が不正解である確率は1/2である。また、友人が選んだ箱が不正解で、かつ、もう1つの箱が正解である確率は1/3である。条件付き確率の公式を使えば、この確率は1/3 ÷ 1/2 =2/3である。つまり、開ける箱を変えたほうが、当たる確率が高い。'
  replace: '        （解説）はじめに選んだ箱に宝物が入っている確率は1/3である。つまり、選ばなかった2つの箱のどちらかに宝物が入っている確率は2/3である。友人は答えを知っていて、必ず不正解の箱を開けてみせる。そのため、選ばなかった側の2/3の確率は、開けられずに残った1つの箱にそのまま集まる。よって、箱を変えたときに宝物が入っている確率は2/3で、変えたほうが当たりやすい（モンティ・ホール問題として知られる）。'
- unit: math-ma05-06
  note: 練習問題⑩の解説の計算（答えは同じ）
  find: '        （解説）条件付き確率を用いる。まず、陽性になる確率を求める。病気になっていて陽性になるパターンと、病気になっていないのに陽性になるパターンがある。そもそも病気になる人が1%しかいないため、前者は1% × 99% = 0.01×0.99=0.099。後者は、0.99×0.01=0.099。合わせて、0.198。このうち、実際に病気になっていて陽性なのは、0.099である。よって、条件付き確率は、0.099/0.198=0.5。'
  replace: '        （解説）条件付き確率を用いる。まず、陽性になる確率を求める。病気になっていて陽性になるパターンと、病気になっていないのに陽性になるパターンがある。そもそも病気になる人が1%しかいないため、前者は1% × 99% = 0.01×0.99=0.0099。後者は、0.99×0.01=0.0099。合わせて、0.0198。このうち、実際に病気になっていて陽性なのは、0.0099である。よって、条件付き確率は、0.0099/0.0198=0.5。'
- unit: math-ma05-06
