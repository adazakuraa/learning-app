  note: ヒトの「門」は脊索動物門（脊椎動物はその中の亜門）
  find: '- **ヒト**の分類は、真核生物→動物界→脊椎動物門→哺乳綱→霊長目→ヒト科→ホモ属→ホモ・サピエンス（種）です。'
  replace: '- **ヒト**の分類は、真核生物→動物界→脊索動物門（脊椎動物亜門）→哺乳綱→霊長目→ヒト科→ホモ属→ホモ・サピエンス（種）です。'
- unit: biology-bi04-02
  note: 解糖系は細胞質基質、クエン酸回路・電子伝達系がミトコンドリア
