  note: エリクソンの年齢区分（目安）
  find: "    - 成人期（22〜40歳）："
  replace: "    - 成人前期（20〜40歳ごろ）："
- unit: psychology-ps05-03
  note: エリクソンの年齢区分（目安）
  find: "    - 壮年期（45〜60歳）："
  replace: "    - 壮年期（40〜65歳ごろ）："
- unit: psychology-ps05-03
  note: エリクソンの年齢区分（目安）
  find: "    - 老年期（60歳〜）："
  replace: "    - 老年期（65歳ごろ〜）："
- unit: psychology-ps06-02
  note: アッシュの実験の75%は「少なくとも1回同調した人」の割合
  find: "被験者の75%が間違った答えに同調しました。"
  replace: "被験者の約75%が、少なくとも1回は間違った答えに同調しました。"
- unit: psychology-ps07-01
  note: 「このマニュアル」が何か（DSM）を明示
  find: "- 現代の精神医学では、疾患によって定められている、症状の持続期間・機能障害の程度などの基準を満たすかで診断されます。"
  replace: "- 現代の精神医学では、**DSM**（アメリカ精神医学会の診断マニュアル）などで疾患ごとに定められた、症状の持続期間・機能障害の程度などの基準を満たすかで診断されます。"
- unit: psychology-ps07-03
  note: 回避性パーソナリティ障害の特徴を診断基準に合わせる
  find: "- **回避性**パーソナリティ障害は、問題が起きたときに立ち向かうのではなく回避することを特徴とします。批判を怖いと考えていることも多いです。"
  replace: "- **回避性**パーソナリティ障害は、批判や拒絶をおそれるあまり、人との関わりや新しいことを避けてしまうことを特徴とします。自分は劣っていると感じていることも多いです。"
- unit: psychology-ps07-03
  note: 改行の崩れ
  find: "- **演技性**パーソナリティ障害は、\n常に"
  replace: "- **演技性**パーソナリティ障害は、常に"
- unit: psychology-ps02-01
  note: 掲載されている図は「カフェウォール錯視」（チェルナー錯視の仲間）
  find: "チェルナーの錯視では"
  replace: "カフェウォール錯視（チェルナー錯視の仲間）では"
- unit: english-en01-03
  note: 「二重母音」は別の意味の用語（diphthong）なので、ここは「母音が2つ並ぶときのルール」
  find: "- **二重母音**のルール：母音が二つ並ぶとき、"
  replace: "- **母音が2つ並ぶ**ときのルール：母音が二つ並ぶとき、"
- unit: english-en03-02
  note: 例文の主語と訳がずれていた
  find: "    - he **didn't** answer my question.（彼女は私の質問に答えなかった）"
  replace: "    - She **didn't** answer my question.（彼女は私の質問に答えなかった）"
- unit: english-en04-01
  note: anになるのは「母音の音」で始まる語の前（an hour / a university）
  find: "次の単語が母音で始まる場合はの前はanになります。"
  replace: "次の単語が母音の「音」で始まる場合はanになります（an apple、an hour。universityは「ユ」の音なので a university）。"
- unit: english-en04-02
  note: 並び順を他の行（主格-目的格-所有格-所有代名詞）とそろえる
  find: "    - I - my - me - mine"
  replace: "    - I - me - my - mine"
- unit: english-en04-02
  note: 並び順の説明を追加
  find: "- 使い分けの例："
  replace: "    - （左から、主格 - 目的格 - 所有格 - 所有代名詞）\n- 使い分けの例："
- unit: english-en05-01
  note: 例文の誤り（「クジラ」全体ではなくシロナガスクジラ／冠詞）
  find: "    - Whale is **the biggest** animal.（クジラは最も大きい生き物だ）"
  replace: "    - The blue whale is **the biggest** animal.（シロナガスクジラは最も大きい動物だ）"
- unit: english-en05-01
  note: 文の途中で切れていた
  find: "長い形容詞なら、前にmost（the most comfortable）"
  replace: "長い形容詞なら、前にmostをつけます（the most comfortable）。"
- unit: english-en06-03
  note: 訳の誤記
  find: "（今午後雨が降るかもしれません）"
  replace: "（今日の午後、雨が降るかもしれません）"
- unit: english-en06-03
  note: 例文にmightが抜けていた
  find: "    - I join you later, but I'm not sure.（後で合流するかもしれません）"
  replace: "    - I **might** join you later, but I'm not sure.（後で合流するかもしれませんが、わかりません）"
- unit: english-en07-03
  note: 説明の言いすぎと誤字を修正
  find: "- 1つの文に2つ以上の動詞を入れたいときは、2つ目の動詞の前にに、「to」をつけなければいけない、というルールがあります。"
  replace: "- 動詞のあとにさらに動詞を続けたいときなどに、2つ目の動詞の前に「to」をつける方法があります。"
- unit: english-en07-03
  note: 強調するtoの位置（前置詞のtoではなく不定詞のto）
  find: "    - He went **to** the library to return some books."
  replace: "    - He went to the library **to** return some books."
- unit: english-en07-04
  note: 脱字
  find: "一方の動詞ing形にする"
  replace: "一方の動詞をing形にする"
- unit: english-en09-01
  note: when・whereは関係副詞
  find: "修飾するものが人の場合はwho, 時間ならwhen, 場所ならwhere, それ以外は、whichか thatを使います。省略されることもあります。"
  replace: "修飾するものが人の場合はwho、それ以外は、whichかthatを使います。省略されることもあります。時間ならwhen、場所ならwhereも使えます（この2つは正確には**関係副詞**と呼ばれます）。"
- unit: english-en10-01
  note: 改行の崩れ
  find: "No\n    problem."
  replace: "No problem."
- unit: english-en10-01
  note: 改行の崩れ
  find: "My\n    bad."
  replace: "My bad."
- unit: english-en10-01
  note: 改行の崩れ
  find: "Do you\n    mind"
  replace: "Do you mind"
- unit: english-en10-01
  note: 改行の崩れ
  find: "What\n    do you mean"
  replace: "What do you mean"
- unit: english-en10-01
  note: 改行の崩れ
  find: "That makes\n    sense."
  replace: "That makes sense."
- unit: english-en10-02
  note: 改行の崩れ
  find: "traffic\n    light."
  replace: "traffic light."
- unit: english-en10-05
  note: 改行の崩れ
  find: "subscribe（登録する）/\n    unsubscribe"
  replace: "subscribe（登録する）/ unsubscribe"
- unit: english-en10-05
  note: ゲームでのinventoryは「持ち物」
  find: "inventory（在庫）"
  replace: "inventory（持ち物）"
- unit: english-en11-02
  note: misleadの意味
  find: "mislead（誤解）"
  replace: "mislead（誤解させる）"
- unit: english-en11-02
  note: possibleは-ible（-ableの仲間）
  find: "possible（可能）"
  replace: "possible（可能な。-ibleも同じ仲間）"
- unit: politics-economics-pe02-03
  note: 信用創造の計算（手元に残すのは1割の9万円、貸すのは81万円）と、最終的な合計
  find: "Bさんが90万円を別の銀行に預けると、その銀行は1割（81万円）をCさんに貸し出す……このサイクルが繰り返されると、最初の100万円だったものが、100+90+81=271万円にも増えて、市場に流通することになります。"
  replace: "Bさんが90万円を別の銀行に預けると、その銀行も1割（9万円）を手元に残し、81万円をCさんに貸し出す……このサイクルが繰り返されると、最初の100万円だったものが、100+90+81+…と増えていき、理論上は最大1000万円ものお金（預金）が市場に流通することになります。"
- unit: politics-economics-pe02-03
  note: 誤記
  find: "逆に景気を冷え、"
  replace: "逆に景気が冷え、"
- unit: politics-economics-pe02-04
  note: 誤字
  find: "税率が高くかる"
  replace: "税率が高くなる"
- unit: politics-economics-pe03-01
  note: 世界第二位になったのは高度成長期の1968年
  find: "その後も「安定成長」を続け、1980年代には世界第二位の経済大国となりました。"
  replace: "その後も「安定成長」を続けました（日本は高度成長期の1968年に、すでにGNPで世界第二位の経済大国になっていました）。"
- unit: politics-economics-pe03-01
  note: バブル崩壊のきっかけ（1989〜90年の利上げと総量規制）
  find: "1990〜91年に日銀の急激な金利引き上げでバブルが崩壊し、資産価格が急落しました。"
  replace: "1989〜90年の日銀の急激な金利引き上げや、不動産向け融資の総量規制をきっかけに、1990年代初めにバブルが崩壊し、資産価格が急落しました。"
- unit: politics-economics-pe06-03
  note: 衆議院の解散は内閣の権限、不信任決議は衆議院
  find: "例えば日本では、国会は**内閣不信任決議**で内閣を倒し、**衆議院を解散**することができます。"
  replace: "例えば日本では、国会（衆議院）は**内閣不信任決議**で内閣の責任を問うことができ、反対に内閣は**衆議院を解散**することができます。"
- unit: politics-economics-pe06-03
  note: 裁判官をやめさせる弾劾裁判は国会が行う。内閣は裁判官を指名・任命する
  find: "一方の内閣は、義務違反などをした裁判官を罷免させることができます。"
  replace: "内閣は、最高裁判所の長官を指名し、その他の裁判官を任命します（問題のある裁判官をやめさせる**弾劾裁判**は、国会が行います）。"
- unit: politics-economics-pe07-02
  note: 違憲審査は下級裁判所も行う。最高裁は最終判断
  find: "最高裁は「憲法の番人」として、**違憲立法審査**を持ちます。"
  replace: "最高裁は「憲法の番人」として、**違憲立法審査**の最終的な判断を下します。"
- unit: politics-economics-pe09-02
  note: 拒否権の例をより正確・中立に
  find: "ロシアがウクライナ侵攻を、アメリカがイスラエルのガザ攻撃を拒否権で守るように、"
  replace: "ウクライナ侵攻をめぐる決議にロシアが、ガザでの停戦を求める決議にアメリカが拒否権を使ったように、"
- unit: politics-economics-pe09-02
  note: PKOは国連の要請で各国が部隊などを派遣する
  find: "紛争地域に国連軍を派遣して"
  replace: "紛争地域に、各国から部隊や要員を派遣して"
- unit: politics-economics-pe09-03
  note: 日本を守る義務は1960年の改定で明記された
  find: "**日米安保条約**（1951年）です。"
  replace: "**日米安保条約**（1951年に結ばれ、1960年に改定）です。"
- unit: politics-economics-pe10-03
  note: 文の途中で切れていた
  find: "    - 多様性・少数派の権利への配慮が"
  replace: "    - 多様性・少数派の権利への配慮"
- unit: politics-economics-pe10-04
  note: 文の断片が混入
  find: "小さな政府・民営化を支持します。場原理への信頼を示しました。"
  replace: "小さな政府・民営化を支持します。"
- unit: politics-economics-pe10-09
  note: 派閥の説明を中立的な表現に
  find: "タカ派（改憲・強い国防・歴史修正主義傾向）から、ハト派まで"
  replace: "タカ派（憲法改正や防衛力の強化を重視）から、ハト派（対話・協調を重視）まで"
- unit: politics-economics-pe05-04
  note: 表のとおり、片方だけ自白すると自白した側は釈放、黙秘した側が懲役10年
  find: "片方のみが自白した場合は、自白した側が懲役10年となり、不利な条件になります。"
  replace: "片方のみが自白した場合は、自白した側は釈放され、黙秘した側が懲役10年となります。"
