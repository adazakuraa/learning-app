- unit: chemistry-ch05-01
  note: 食塩はイオンでできた物質（極性分子ではない）。溶けるしくみを正確に
  find: '- 水に塩などの極性分子を入れると溶けるのは、水もまた、極性分子だからです。水分子の中の酸素（マイナス）が、極性分子のプラスに偏っている部分を引きつけるため、極性分子がイオンになってバラバラになります。これが「溶ける」という状態です。'
  replace: '- 食塩（塩化ナトリウム）のようなイオンでできた物質や、砂糖のような極性分子が水に溶けやすいのは、水が極性分子だからです。食塩の場合、水分子のマイナスに偏った酸素の側がNa⁺を、プラスに偏った水素の側がCl⁻を取り囲み、イオンがバラバラになって水の中に散らばります。これが「溶ける」という状態です。'
- unit: chemistry-ch06-03
  note: COOH の名称は「カルボキシ基」
  find: '- **カルボン酸**は、カルボン基（COOH）がくっついた有機化合物です。アルコールを酸化させると生成できます。'
  replace: '- **カルボン酸**は、カルボキシ基（COOH）がくっついた有機化合物です。アルコールを酸化させると生成できます。'
- unit: biology-bi01-02
  note: ヒトの「門」は脊索動物門（脊椎動物はその中の亜門）
  find: '- **ヒト**の分類は、真核生物→動物界→脊椎動物門→哺乳綱→霊長目→ヒト科→ホモ属→ホモ・サピエンス（種）です。'
  replace: '- **ヒト**の分類は、真核生物→動物界→脊索動物門（脊椎動物亜門）→哺乳綱→霊長目→ヒト科→ホモ属→ホモ・サピエンス（種）です。'
- unit: biology-bi04-02
  note: 解糖系は細胞質基質、クエン酸回路・電子伝達系がミトコンドリア
  find: '- 細胞呼吸は**ミトコンドリア**で行われ、三段階あります。①解糖系→②クエン酸回路→③電子伝達系という順序で化学反応が進み、エネルギーが作られます。'
  replace: '- 細胞呼吸は三段階あり、①解糖系（細胞質基質）→②クエン酸回路（**ミトコンドリア**）→③電子伝達系（ミトコンドリア）という順序で化学反応が進み、エネルギーが作られます。'
- unit: biology-bi07-02
  note: 爬虫類と哺乳類は、両生類に近い祖先から生まれた「陸で卵を産める仲間（有羊膜類）」から分かれた
  find: '- 脊椎動物の中では魚類が最も古く、そこから両生類が派生しました。その後、両生類から爬虫類と哺乳類が進化しています。鳥類は爬虫類の一部（恐竜）が進化したものです。'
  replace: '- 脊椎動物の中では魚類が最も古く、そこから両生類が派生しました。その後、両生類に近い祖先から、殻のある卵を陸上に産める仲間が生まれ、そこから爬虫類と哺乳類の系統が分かれました。鳥類は爬虫類の一部（恐竜）が進化したものです。'
- unit: biology-bi07-03
  note: 二足歩行はアウストラロピテクス以前の初期人類から始まっていたと考えられている
  find: '    - **二足歩行**：最初期の人類（**アウストラロピテクス**）は約400万年前に二足歩行を始めました。両手が自由になり道具使用が可能になりました。'
  replace: '    - **二足歩行**：約400万年前の**アウストラロピテクス**は、すでに二足歩行をしていました（さらに古い、最初期の人類から始まっていたと考えられています）。両手が自由になり道具使用が可能になりました。'
- unit: earth-science-es02-01
  note: マグマができる場所を具体的に（プレートの境界とホットスポット）
  find: '- **マグマ**が生まれる場所は主に2か所あります。**プレート**と**ホットスポット**です。'
  replace: '- **マグマ**が生まれる場所は主に2か所あります。**プレートの境界**（プレートが沈み込む場所や、海嶺のようにプレートが離れていく場所）と、**ホットスポット**です。'
- unit: earth-science-es03-02
  note: リアス海岸は川が削った谷（V字谷）に海水が入りこんでできる（図とも一致させる）
  find: '    - また、谷間が波などによって侵食されてできた海岸を**リアス海岸**と呼びます。東北の**三陸海岸**や長崎の大村湾などが有名です。'
  replace: '    - また、川が山地を削ってできた深い谷（V字谷）が沈み、海水が入りこんでできた、入り組んだ海岸を**リアス海岸**と呼びます。東北の**三陸海岸**や長崎の大村湾などが有名です。'
- unit: earth-science-es03-03
  note: 図ではフォッサマグナはオレンジ色で塗られている
  find: '以下の黄色い部分です。'
  replace: '以下のオレンジ色の部分です。'
- unit: earth-science-es04-02
  note: 1013hPa は 1m² あたり約10トン分の力（約101,300N）
  find: '    - 私たちは常に上から約1トン/m²の大気に押されていますが、'
  replace: '    - 私たちは常に上から約10トン/m²（1cm²あたり約1kg）の大気に押されていますが、'
- unit: earth-science-es05-02
  note: 干潮になるのは月の方向から90度ずれた両側
  find: '月から遠い両サイドが**干潮**になります。'
  replace: 'その間の、月の方向から90度ずれた両サイドが**干潮**になります。'
- unit: earth-science-es06-03
  note: 新月は太陽と同じ方向にあり、光っている面が地球を向かないため、ふつうは見えない
  find: '逆に、新月は昼しか見えません。'
  replace: '逆に、新月は太陽と同じ方向（昼の空）にありますが、光が当たっている面が地球の反対側を向いているため、ふつうは見えません。'
- unit: earth-science-es06-04
  note: 鉄より重い元素は超新星爆発に加え、中性子星の合体でも作られる
  find: '    - 金・銀・ウランなど鉄より重い元素は超新星爆発によって生み出されています。私たちの体を作る元素の多くは、かつて爆発した星が作ったものです。'
  replace: '    - 金・銀・ウランなど鉄より重い元素は、超新星爆発や、中性子星どうしの合体によって生み出されたと考えられています。私たちの体を作る炭素や酸素などの元素も、かつての星の中で作られ、宇宙にまき散らされたものです。'
- unit: earth-science-es07-01
  note: 関東大震災の死者・行方不明者は約10万5千人で、その多くが火災による
  find: '- 1923年の**関東大震災**では火災で約10万人が死亡しました。'
  replace: '- 1923年の**関東大震災**では、死者・行方不明者が約10万5千人にのぼり、その多くが火災によるものでした。'
- unit: information-it02-01
  note: 192.168.x.x は家庭内などのプライベートアドレスで、外部のサービスには見えない
  find: "    - 「192.168.0.1」のような形式です。自分のIPアドレスはサービスの提供者に見えています。\n- 「192.168.0.1」のような形式だと人間には分かりづらいので、"
  replace: "    - 「203.0.113.25」のように、数字を点で区切った形式です（より長いIPv6という形式もあります）。インターネット側の自分のIPアドレスは、アクセスしたサービスの提供者に見えています。\n    - なお「192.168.0.1」のような番号は、家の中などのネットワークだけで使われる番号です。\n- 数字の並びは人間には分かりづらいので、"
- unit: information-it03-03
  note: LINEで端末間暗号化されるのは「トーク」のメッセージ（Letter Sealing）
  find: "LINEのノートメッセージ・iMessageは端末間で直接暗号化されるため、Apple・LINEも内容を読めません。"
  replace: "LINEのトーク（Letter Sealing）やiMessageは端末間で暗号化されるため、LINEやAppleも内容を読めません。"
- unit: information-it03-04
  note: 箇条書きが結合していたのを分離
  find: "ロゴ・デザインは本物に見えます。ギフトカード支払い要求："
  replace: "ロゴ・デザインは本物に見えます。\n    - ギフトカード支払い要求："
- unit: information-it03-04
  note: 箇条書きが結合していたのを分離
  find: "メールのリンクからは行かない不審な電話は一度切って、公式の番号に自分でかけ直す怪しいと思ったら"
  replace: "メールのリンクからは行かない\n    - 不審な電話は一度切って、公式の番号に自分でかけ直す\n- 怪しいと思ったら"
- unit: information-it04-01
  note: 箇条書きの区切りの崩れを修正
  find: "    - 画像・音声・動画の生成パターン認識（顔認証・物体検出）\n    - 大量のデータからの傾向\n    - 抽出チェス・囲碁などのゲーム"
  replace: "    - 画像・音声・動画の生成\n    - パターン認識（顔認証・物体検出）\n    - 大量のデータからの傾向抽出\n    - チェス・囲碁などのゲーム"
- unit: information-it04-01
  note: 検索機能を持つAIもある
  find: "    - 最新情報へのアクセス（学習データのカットオフ以降の情報を知らない）"
  replace: "    - 最新情報へのアクセス（学習データのカットオフ以降の情報を知らない。ただしWeb検索機能を持つサービスもある）"
- unit: logical-thinking-ct02-01
  note: 演繹の例に前提「ソクラテスは人間である」を補う
  find: "「すべての人はいずれ死ぬ。ゆえに、ソクラテスもいずれ死ぬ」"
  replace: "「すべての人はいずれ死ぬ。ソクラテスは人である。ゆえに、ソクラテスもいずれ死ぬ」"
- unit: logical-thinking-ct02-01
  note: 演繹と帰納の評価基準の説明を正確に
  find: "演繹的論証は「根拠が真であるか」が問われ、帰納的論証は「根拠から結論を導く論理が正しいか」が問われます。"
  replace: "演繹的論証は「形式が妥当か（前提が真なら結論も必ず真になるか）」と「前提が実際に真か」が問われ、帰納的論証は「証拠が結論をどれだけ強く支持するか（証拠の量は十分か・偏りはないか）」が問われます。"
- unit: logical-thinking-ct03-04
  note: 強調記号の対応の崩れを修正
  find: "。**相関は因果を意味しない**」は統計の**最重要原則**です。"
  replace: "。「**相関は因果を意味しない**」は統計の**最重要原則**です。"
- unit: logical-thinking-ct06-02
  note: 誤字
  find: "この前提を明示化ことで"
  replace: "この前提を明示化することで"
- unit: philosophy-ph01-03
  note: イデアは頭の中ではなく、別の世界にある永遠の本質。魂が生まれる前に見たものを思い出す（想起）
  find: "頭の中にイデアがあり、それを投影しているからだ、という考え方です。"
  replace: "私たちの魂が、生まれる前にイデアの世界で「イチゴそのもの（イチゴのイデア）」を見ていて、それを思い出している（**想起**）からだ、という考え方です。"
- unit: philosophy-ph01-03
  note: フーコーの『狂気の歴史』の内容に合わせる（「神からの使い」は言いすぎ）
  find: "中世までの西欧社会では、精神病など狂気を持った人は神からの使いと考えられていましたが、それ以降は迫害の対象になりました。"
  replace: "中世からルネサンス期の西欧社会では、狂気はある種の知恵や神秘とも結びつけられ、社会の中に居場所がありましたが、17世紀以降は施設に閉じ込められ、排除される対象になりました。"
- unit: philosophy-ph03-01
  note: 決定論が否定的に見られる理由（量子力学）を明示
  find: "（ちなみに、これは物理学的な観点からは否定的に思われています）"
  replace: "（ただし現代物理学の量子力学では、ミクロの出来事は確率的にしか決まらないと考えられており、厳密な決定論には否定的な見方が多いです。とはいえ、偶然に左右されることが「自由」だというわけでもありません）"
- unit: philosophy-ph03-01
  note: リベットの実験の時間（意識の約0.35秒前、動作の約0.5秒前）
  find: "被験者が「手を動かそう」と意識した時点より約0.5秒前に、脳の神経が動き出すことが示されたのです。"
  replace: "被験者が「手を動かそう」と意識した時点より約0.35秒前（実際に動く約0.5秒前）に、脳の神経が動き出すことが示されたのです。"
- unit: philosophy-ph04-02
  note: コペルニクス的転回：物そのもの（物自体）を否定したわけではない
  find: "リンゴというものがもともと存在するのではなく、我々がそう認識することによって、リンゴが存在しているように見える、という逆転の発想です（**コペルニクス的転回**）。"
  replace: "「認識が対象に従う」のではなく「対象（私たちに現れる世界）が、私たちの認識のしかたに従う」という逆転の発想です（**コペルニクス的転回**）。なお、カントは物そのもの（**物自体**）がないと言ったわけではなく、それを私たちは直接知ることができない、と考えました。"
- unit: philosophy-ph05-03
  note: 「7〜10年で全細胞が入れ替わる」は俗説（一生ほぼ入れ替わらない細胞もある）
  find: "人間の体は7〜10年でほぼ全ての細胞が入れ替わると言われます。10年前の自分と今の自分は、原子レベルでは別の物質から構成されています。"
  replace: "人間の体の多くの細胞は、数日から数年で入れ替わっています（脳の神経細胞のように、一生ほとんど入れ替わらない細胞もあります）。体をつくる原子も、食べ物や呼吸を通じて少しずつ入れ替わり、10年前の自分と今の自分は、物質としてはかなり別のものになっています。"
