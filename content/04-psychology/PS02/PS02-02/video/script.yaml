title: 注意と意識
scenes:
  - board: whiteboard
    steps:
      - say: 「注意と意識」です。人間が一度に処理できる情報の量には、厳しい限界があります。目や耳、皮ふから、毎秒ものすごい量の情報が入ってきますが、意識にのぼるのは、そのごく一部です。限られた処理の力を、特定の情報に向けることを、注意といいます。
        show:
          - { type: title, text: 注意とは }
          - { type: box, color: yellow, w: 1100, text: "**注意** ＝ 限られた処理の力を、特定の情報に向けること" }
      - say: カクテルパーティー効果は、さわがしいパーティーでも、自分の名前が呼ばれると気づく、という現象です。意識して聞いていない会話も、脳は無意識に処理していて、自分に関係する情報だけを、えり分けているのです。
        show:
          - { type: box, color: blue, w: 1100, title: カクテルパーティー効果, text: "さわがしい中でも自分の名前には気づく → 脳は無意識に情報をえり分けている" }

  - board: whiteboard
    steps:
      - say: 無注意盲、つまり注意を向けていないものは、見えない、という現象もあります。
        show:
          - { type: title, text: 見えないゴリラ }
      - say: 有名な実験で、バスケットボールのパス練習の動画を見て、パスの回数を数えるように言われた人の多くは、その間に、コートを横切った、ゴリラの着ぐるみに、気づきませんでした。
        show:
          - type: svg
            w: 1000
            h: 220
            markup: |
              <rect x="40" y="20" width="560" height="190" rx="10" stroke="#9aa3ad"/>
              <g stroke="#e8eef5"><circle cx="120" cy="90" r="18"/><circle cx="260" cy="70" r="18"/><circle cx="450" cy="100" r="18"/></g>
              <path d="M140 90 Q200 40 245 70 M280 75 Q360 60 430 95" stroke="#f3d77a" stroke-dasharray="6 6"/>
              <g fill="#5a5f66" stroke="none"><circle cx="350" cy="160" r="22"/><rect x="330" y="180" width="40" height="30"/></g>
              <g stroke="none" font-size="22"><text x="640" y="80" fill="#f3d77a">パスを数える</text><text x="640" y="160" fill="#9aa3ad">→ ゴリラに気づかない</text></g>
      - say: 見ていれば気づくはず、という常識は、まちがいなのです。スマホを見ながら歩くと、目の前の人に気づかないのも、同じしくみです。
        show:
          - { type: text, color: yellow, text: "「見ていれば気づく」はまちがい（歩きスマホが危ない理由）" }

  - board: whiteboard
    steps:
      - say: 注意には、2つの種類があります。
        show:
          - { type: title, text: 2種類の注意 }
      - say: 意識的な注意は、トップダウン型で、目的に合わせて、自分から向ける注意です。自動的な注意は、ボトムアップ型で、大きな音や、自分の名前など、目立つものに、自動的に引きつけられる注意です。
        show:
          - { type: box, color: blue, w: 1100, title: 意識的な注意（トップダウン）, text: "目的に合わせて自分から向ける（探しものをする）" }
          - { type: box, color: pink, w: 1100, title: 自動的な注意（ボトムアップ）, text: "目立つものに自動的に引きつけられる（大きな音・自分の名前）" }
