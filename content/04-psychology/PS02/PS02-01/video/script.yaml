title: 感覚と知覚
scenes:
  - board: slide
    steps:
      - say: 第2章、「知覚と認知のしくみ」です。
        show:
          - { type: title, text: 第2章　知覚と認知の仕組み }
      - say: 私たちは、世界をどう見て、何に気づき、どう覚えているのか。そのしくみと限界を学びます。
        show:
          - type: list
            items: ["感覚と知覚", "注意と意識", "記憶の仕組みと限界", "忘却と記憶の歪み"]
      - say: 「自分の目で見た」「たしかに覚えている」。その確かさが、実は思ったほどではないことに、おどろくはずです。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "見ること・覚えることのしくみと限界を知る" }

  - board: whiteboard
    steps:
      - say: 目で光を受けとることと、何かを見ることは、ちがいます。前者は感覚、後者は知覚です。
        show:
          - { type: title, text: 感覚と知覚 }
          - { type: box, color: blue, w: 1100, title: 感覚, text: "光や音などの刺激を、神経の信号に変える" }
          - { type: box, color: yellow, w: 1100, title: 知覚, text: "その信号を、脳が解釈して意味のある情報にする" }
      - say: カメラでたとえると、レンズが光を受けとるのが感覚。写った画像を見て、これは犬だ、とわかるのが知覚です。
        added: true
        show:
          - { type: text, color: gray, text: "カメラのレンズ ＝ 感覚、写ったものが何かわかる ＝ 知覚" }

  - board: whiteboard
    steps:
      - say: このちがいが、いちばんわかりやすいのが、錯視です。ミュラー・リヤー錯視では、同じ長さの線が、ちがう長さに見えます。カフェウォール錯視では、まっすぐな横線が、かたむいて見えます。
        show:
          - { type: title, text: 錯視 }
          - { type: image, src: 1000002900.webp, at: [60, 130], w: 560 }
          - { type: image, src: 1000002901.webp, at: [660, 130], w: 520 }
      - say: これは、目がまちがっているのではありません。脳が、過去の経験や、まわりの状況、思いこみをもとに、解釈を加えているためなのです。
        show:
          - { type: box, at: [60, 560], w: 1120, color: yellow, text: "目のまちがいではなく、脳が経験・状況・思いこみで解釈を加えている" }

  - board: whiteboard
    steps:
      - say: 知覚は、ただ受けとることではなく、脳が積極的に、組み立てることです。有名な例が、ルビンの壺です。壺にも見えるし、向かい合う2人の顔にも見えます。
        show:
          - { type: title, text: ルビンの壺 }
          - { type: image, src: 1000002902.webp, at: [80, 120], w: 420 }
          - { type: text, at: [560, 160], w: 660, text: "壺？ それとも向かい合う顔？" }
      - say: どちらが正しいか、という問いに、答えはありません。脳が、2つの解釈の間を、ゆれ動いているのです。
        show:
          - { type: text, at: [560, 250], w: 660, color: yellow, text: "正解はない。脳が2つの解釈の間をゆれ動く" }
      - say: これは、日常にも当てはまります。同じできごとでも、人によって見え方がちがうのは、それぞれが、ちがう経験や期待、注意の向け方を持っているからです。客観的に見ることが、なぜ難しいのか。その答えが、知覚のしくみにあるのです。
        show:
          - { type: box, at: [560, 360], w: 660, color: green, text: "同じできごとでも、人によって見え方がちがう ＝ 知覚は一人ひとりの組み立て" }
