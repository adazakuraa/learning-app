title: 忘却と記憶の歪み
scenes:
  - board: whiteboard
    steps:
      - say: 「忘れることと、記憶のゆがみ」です。忘れるというのは、記憶が消えることではなく、取り出せなくなることが多いのです。適切なヒント、つまり手がかりがあれば、思い出せることが、よくあります。
        show:
          - { type: title, text: 忘却 }
          - { type: box, color: blue, w: 1100, text: "忘れる ＝ 消えるのではなく「取り出せない」ことが多い。手がかりで思い出せる" }
      - say: のどまで出かかっているのに、名前が出てこない。でも、頭の1文字を聞くと、すぐに思い出せる。あれですね。
        added: true
        show:
          - { type: text, color: gray, text: "例：名前が出てこない → 頭の1文字を聞くと思い出せる" }

  - board: whiteboard
    steps:
      - say: 誤情報効果は、あとからの情報が、記憶を書きかえてしまう現象です。
        show:
          - { type: title, text: 誤情報効果 }
      - say: 有名な実験では、自動車事故の映像を見せたあと、質問をしました。車が「ぶつかった」とき、どのくらいのスピードだったか、と聞いた場合と、車が「激突した」とき、と聞いた場合で、答えのスピードが変わったのです。
        show:
          - { type: text, color: blue, text: "「ぶつかった」ときのスピードは？ → 遅めに答える" }
          - { type: text, color: pink, text: "「激突した」ときのスピードは？ → 速めに答える" }
      - say: さらに、「激突」という言葉で聞かれた人は、実際にはなかった、割れたガラスを見た、と答える割合が増えました。質問の言葉ひとつで、記憶がつくりかえられてしまうのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "「激突」と聞かれた人は、なかった「割れたガラス」を見たと答えやすい" }

  - board: whiteboard
    steps:
      - say: ソース・モニタリング・エラーは、その情報をどこでえたかを、まちがえて覚える現象です。テレビで見たことを、自分の体験と混同したり、夢と現実を混同したりします。
        show:
          - { type: title, text: 目撃証言の危うさ }
          - { type: box, color: blue, w: 1100, title: ソース・モニタリング・エラー, text: "どこでえた情報かをまちがえる（テレビで見たこと ⇔ 自分の体験）" }
      - say: これらは、目撃証言の信頼性に、大きな問題を投げかけます。自信を持って証言しても、記憶は、あとからの情報や、取り調べの聞き方、気持ちの状態によって、書きかえられているかもしれないのです。
        show:
          - { type: box, color: pink, w: 1100, text: "自信満々の目撃証言でも、記憶が書きかえられている可能性がある" }
