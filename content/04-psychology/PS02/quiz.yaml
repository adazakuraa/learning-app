questions:
  - q: 騒がしいパーティの場でも、自分の名前が呼ばれると気づく現象を何というでしょう？
    a: [カクテルパーティ効果, カクテルパーティー効果]
    show: カクテルパーティ効果
  - q: 今まさに意識して操作している情報を一時的に保つ記憶を何というでしょう？
    a: [短期記憶, ワーキングメモリ, ワーキングメモリー]
    show: 短期記憶（ワーキングメモリー）
  - q: 短期記憶にいちどに保てる容量は「（　）〜9個」といわれます。（　）に入る数はいくつでしょう？
    a: ['5']
    show: 5〜9
  - q: 自転車の乗り方のように、体で覚えている記憶を何というでしょう？
    a: [手続き記憶]
  - q: 事故のあとに聞いた言葉などで、記憶が書き換えられてしまう現象を何というでしょう？
    a: [誤情報効果]
    r: [ごじょうほうこうか]
