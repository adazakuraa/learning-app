title: 地位・承認・排除への感受性
scenes:
  - board: whiteboard
    steps:
      - say: 「地位、承認、仲間はずれへの敏感さ」です。地位を気にする心、認められたい心、集団から外されることへのおそれは、進化の観点から、説明できます。
        show:
          - { type: title, text: 仲間はずれ ＝ 死 }
      - say: 昔の人間は、150人ほどの集団で暮らしていました。そこでは、集団から外されることは、死を意味しました。ひとりでは、狩りもできず、敵から身を守れず、食べ物も手に入らないからです。
        show:
          - { type: box, color: pink, w: 1100, text: "昔：集団から外される ＝ 狩りも、身を守ることもできない ＝ 死" }
      - say: だから、仲間から外されることへの強いおそれと、集団の中での地位を守ろうとする、強い気持ちが、進化したのです。
        show:
          - { type: text, color: yellow, text: "→ 仲間はずれへの強いおそれ・地位を守りたい気持ちが進化" }

  - board: whiteboard
    steps:
      - say: ダンバー数とは、人間が、安定した関係を保てる人数の上限は、およそ150人、という考えです。霊長類の、脳の大きさと、群れの大きさの関係から、導き出されました。
        show:
          - { type: title, text: ダンバー数 }
          - { type: box, color: blue, w: 1100, text: "**ダンバー数**：安定した関係を保てるのは約150人（脳の大きさと群れの大きさから）" }
      - say: 軍隊の中隊、村の共同体、宗教の集まりなど、多くの集団が、100人から200人ほどの大きさに、落ち着く傾向があります。SNSで、何千人の友だちがいても、本当に深い関係を保てるのは、ダンバー数の範囲なのです。
        show:
          - { type: text, color: gray, text: "SNSの友だちが何千人でも、深い関係は約150人まで" }

  - board: whiteboard
    steps:
      - say: 仲間はずれへのおそれは、今でも強くはたらいています。
        show:
          - { type: title, text: 仲間はずれは「痛い」 }
      - say: ある研究では、オンラインのボール投げゲームで、知らない相手から、ボールを回してもらえないだけで、体の痛みと同じ脳の部分が、はたらくことが示されました。仲間はずれにされる痛みは、たとえではなく、文字どおり、痛いのです。
        show:
          - { type: box, color: pink, w: 1100, text: "ボールを回してもらえないだけで、体の痛みと同じ脳の部分がはたらく → 文字どおり「痛い」" }
      - say: だからこそ、だれかを無視したり、仲間はずれにしたりすることは、相手に、本当の痛みをあたえているのだ、と知っておきたいですね。
        added: true
        show:
          - { type: text, color: yellow, text: "無視・仲間はずれは、相手に本当の痛みをあたえている" }
