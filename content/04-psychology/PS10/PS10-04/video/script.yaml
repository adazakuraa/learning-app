title: 感情・恐怖・嫌悪の進化的役割
scenes:
  - board: whiteboard
    steps:
      - say: 「感情の進化的な役割」です。感情は、でたらめな反応ではなく、役に立つはたらきを持つ、しくみです。
        show:
          - { type: title, text: 恐怖 }
      - say: 恐怖は、危険からすばやく逃げさせる、警報のしくみです。脳の扁桃体は、危険を感じると、意識して考えるより先に、体を反応させます。
        show:
          - { type: box, color: blue, w: 1100, text: "**恐怖** ＝ 警報システム。**扁桃体** が、考えるより先に体を反応させる" }
      - say: ヘビやクモ、高い所へのこわさが、すぐに身につくのは、それらが昔、本当に危険だったからです。一方、コンセントや自動車のような、今の危険へのこわさは、自然には身につきにくい。進化が、追いついていないのです。
        show:
          - { type: text, color: green, text: "ヘビ・クモ・高い所 → すぐこわくなる（昔の危険）" }
          - { type: text, color: pink, text: "コンセント・自動車 → こわさが身につきにくい（進化が追いつかない）" }

  - board: whiteboard
    steps:
      - say: 嫌悪は、よごれたもの、病気、くさったものを、さけさせる、防御のしくみです。くさった食べ物や、はいせつ物への嫌悪は、病原体への感染を防ぐ、適応です。
        show:
          - { type: title, text: 嫌悪と道徳 }
          - { type: box, color: green, w: 1100, text: "**嫌悪** ＝ くさったもの・病気をさける防御システム（感染を防ぐ）" }
      - say: おもしろいのは、嫌悪が、道徳にも広がることです。不正や裏切りへの、道徳的な嫌悪は、体の嫌悪と、同じ脳のしくみを使っています。あの人は汚い、あの行為は吐き気がする、という言い方は、たとえではなく、実際に、体の嫌悪と同じ反応が起きているのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "道徳的な嫌悪も同じ脳のしくみ →「汚いやり方」は、たとえではなく本当の反応" }

  - board: whiteboard
    steps:
      - say: 嫉妬にも、進化的な意味があります。男女で、嫉妬のパターンがちがう、という研究があります。
        show:
          - { type: title, text: 嫉妬 }
      - say: 男性は、パートナーの体の浮気に、強く反応しやすい。子どもが、自分の子ではないかもしれないからです。女性は、パートナーの心が離れることに、強く反応しやすい。資源や守りを失うかもしれないからです。前の単元の、親の投資理論から予想される、ちがいです。
        show:
          - { type: text, color: blue, text: "男性：体の浮気に強く反応（自分の子でない可能性）" }
          - { type: text, color: pink, text: "女性：心が離れることに強く反応（資源・守りを失う可能性）" }
          - { type: text, color: gray, text: "親の投資理論から予想されるちがい（あくまで傾向）" }
