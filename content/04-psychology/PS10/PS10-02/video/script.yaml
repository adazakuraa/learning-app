title: 社会的行動
scenes:
  - board: whiteboard
    steps:
      - say: 「協力の進化」です。人間は、なぜ協力するのでしょうか。進化の自然選択は、一人ひとりが生きのびて、子孫を残すことを最大にする方向に働きます。それなのに、なぜ、人を助ける心が進化したのでしょうか。
        show:
          - { type: title, text: 血縁選択 }
          - { type: text, color: gray, text: "自然選択は「自分が生き残る」方向に働く → なぜ人を助ける心が？" }
      - say: ひとつの説明が、血縁選択です。自分が生き残らなくても、血のつながった家族が生き残れば、自分と似た遺伝子が、生き残ることになります。
        show:
          - { type: box, color: yellow, w: 1100, title: 血縁選択, text: "家族を助ける → 自分と似た遺伝子が生き残る" }

  - board: whiteboard
    steps:
      - say: また、まったくの他人でも、今助ければ、あとで助けてもらえる、という、長い目で見たお互いさまの関係が、協力を進化させた、という説明もあります。互恵的利他主義といいます。情けは人のためならず、という感覚の、進化的な土台です。
        show:
          - { type: title, text: 互恵的利他主義 }
          - { type: box, color: green, w: 1100, title: 互恵的利他主義, text: "今助ける → あとで助けてもらえる（情けは人のためならず）" }
      - say: これがうまくいくには、くり返し付き合いがあること、裏切りを見破れること、裏切り者を罰せること、という条件が必要で、人間の社会は、これらを高度に発達させました。
        show:
          - type: list
            items: ["くり返し付き合いがある", "裏切りを見破れる", "裏切り者を罰せる"]

  - board: whiteboard
    steps:
      - say: フリーライダー、つまりただ乗りする人を見つける、特別なしくみが脳にある、という仮説があります。人間は、抽象的な論理の問題は苦手でも、約束を守らない、義務を果たさずに得だけする、といった、社会のずるを見つける問題は、とても得意なのです。
        show:
          - { type: title, text: ずるを見破る力 }
          - { type: box, color: pink, w: 1100, text: "抽象的な論理は苦手。でも「ずる」を見つける問題はとても得意" }
      - say: 協力し合う社会で生きるために、ずるを見破る力が、特に発達した、と考えられています。
        show:
          - { type: text, color: yellow, text: "協力社会で生きるため、ずるを見破る力が発達した" }
