title: 進化心理学とは
scenes:
  - board: slide
    steps:
      - say: 心理学の最後の章、「進化心理学」です。
        show:
          - { type: title, text: 第10章　進化心理学 }
      - say: 人間の心のくせは、なぜあるのか。協力、男女のちがい、感情、仲間はずれへのおそれを、進化の目で見ていきます。そして、この考え方の限界も学びます。
        show:
          - type: list
            size: s
            items: ["進化心理学とは", "社会的行動", "性差の進化的説明", "感情・恐怖・嫌悪の進化的役割", "地位・承認・排除への感受性", "進化心理学の限界と注意点"]
      - say: 生物で学んだ進化の考え方が、私たちの心の理解にもつながります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "心のくせを進化の目で見直し、その限界も知る" }

  - board: whiteboard
    steps:
      - say: 進化心理学は、人間の心や行動のパターンが、なぜあるのかを、人類の進化の観点から説明しようとする分野です。
        show:
          - { type: title, text: サバンナ向きの脳 }
          - { type: text, text: "**進化心理学**：心のくせが「なぜあるのか」を進化から説明する" }
      - say: 私たちの脳は、今のオフィスや都会のためにできたのではなく、200万年以上にわたる、サバンナでの、狩りと採集の生活に、合わせてできたものです。このずれ、ミスマッチが、今の人の、多くの問題を説明します。
        show:
          - type: svg
            w: 1000
            h: 160
            markup: |
              <path d="M40 120 H960" stroke="#9aa3ad"/>
              <rect x="40" y="60" width="880" height="60" fill="#9be0b0" fill-opacity="0.25" stroke="none"/><rect x="920" y="60" width="40" height="60" fill="#f4a3b8" fill-opacity="0.6" stroke="none"/>
              <g stroke="none" font-size="22"><text x="300" y="100" fill="#9be0b0">サバンナで狩りと採集（200万年以上）</text><text x="760" y="40" fill="#f4a3b8">今の都会の生活（ほんの一瞬）</text></g>
          - { type: box, color: yellow, w: 1000, text: "脳はサバンナ向き → 今の生活とのミスマッチ" }

  - board: whiteboard
    steps:
      - say: 中心にあるのは、今の人間の心の傾向は、昔の環境で、生きのびて子孫を残すのに有利だったから、残った、という考え方です。
        show:
          - { type: title, text: 甘いものがやめられない理由 }
      - say: 例えば、甘いものを強くほしがるのは、なぜでしょう。砂糖があふれる今では、太る原因になりますが、カロリーが貴重だったサバンナでは、甘い果物を見つけたら、たくさん食べる性質が、生きのびるのに有利だったのです。
        show:
          - { type: text, color: green, text: "サバンナ：甘い果物は貴重 → たくさん食べる性質が有利" }
          - { type: text, color: pink, text: "今：砂糖があふれる → 太る原因に" }
      - say: 高い所や、ヘビ、知らない人への警戒心も、昔の環境では、命を守る役割を持っていました。今では、多くの場合、反応しすぎになっています。
        show:
          - { type: text, color: gray, text: "高い所・ヘビ・知らない人への警戒 → 昔は命を守った。今は反応しすぎ" }
      - say: 心理学や文化、一人ひとりの歴史だけでは説明しきれない、なぜ人はこうするのか、という問いに、もうひとつの答えを出してくれる。それが、進化心理学の大切さです。
        show:
          - { type: box, color: yellow, w: 1100, text: "「なぜ人はこうするのか」に、もうひとつの答えを出してくれる" }
