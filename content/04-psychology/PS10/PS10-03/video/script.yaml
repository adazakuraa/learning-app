title: 性差の進化的説明
scenes:
  - board: whiteboard
    steps:
      - say: 「男女のちがいの、進化的な説明」です。進化心理学で、最も議論になるのが、男女の行動のちがいの説明です。
        show:
          - { type: title, text: 親の投資理論 }
      - say: 親の投資理論では、子どもへの投資、つまりコストが大きいほうの性、人間では、妊娠や授乳、子育てを担う女性は、相手選びに慎重になる。一方、投資が小さいほうの性、男性は、数で補う傾向がある、と考えます。
        show:
          - { type: box, color: pink, at: [80, 140], w: 540, title: 投資が大きい性（女性）, text: "妊娠・授乳・子育て → 相手選びに慎重" }
          - { type: box, color: blue, at: [660, 140], w: 540, title: 投資が小さい性（男性）, text: "コストが小さい → 数で補う傾向" }

  - board: whiteboard
    steps:
      - say: これが、相手の選び方のちがいを説明する、とされます。女性は、相手の資源を提供する力や、地位、誠実さを重視する傾向があり、男性は、若さや外見を重視する傾向がある、という研究結果があります。この傾向は、文化をこえて、ある程度共通に見られました。
        show:
          - { type: title, text: 相手選びの傾向 }
          - { type: text, color: pink, text: "女性：資源を提供する力・地位・誠実さを重視する傾向" }
          - { type: text, color: blue, text: "男性：若さ・外見を重視する傾向" }
          - { type: text, color: gray, text: "文化をこえて、ある程度共通に見られた" }
      - say: ただし、これは、平均的な傾向の話で、一人ひとりにあてはまるわけではありません。そして、そうあるべきだ、という意味でもありません。この点は、この章の最後の、限界の単元で、くわしく見ます。
        added: true
        show:
          - { type: box, color: yellow, w: 1100, text: "あくまで平均の傾向。一人ひとりには当てはまらず、「そうあるべき」でもない" }
