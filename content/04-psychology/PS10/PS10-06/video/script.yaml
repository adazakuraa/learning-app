title: 進化心理学の限界と注意点
scenes:
  - board: whiteboard
    steps:
      - say: 最後は、「進化心理学の限界と注意点」です。進化心理学は、強力な説明の枠組みですが、大きな限界と注意点があります。
        show:
          - { type: title, text: 4つの注意点 }
      - say: ひとつ目は、あとづけの説明の問題です。なぜ人間はXをするのか、という問いに、昔役に立ったから、と答えるのは、かんたんです。でも、それが正しいとは限りません。たしかめようのない、お話を作っているだけになる危険があります。
        show:
          - { type: box, color: blue, w: 1100, title: ① あとづけの説明, text: "「昔役に立ったから」は何にでも言える → たしかめようのないお話になる危険" }
      - say: ふたつ目は、自然主義的誤謬です。進化的に自然な傾向がある、という事実から、そうすべきだ、してもいい、という価値判断は、論理的に導けません。自然だから正しい、は、まちがいなのです。
        show:
          - { type: box, color: pink, w: 1100, title: ② 自然主義的誤謬, text: "「自然な傾向がある」→「そうしていい」は導けない。「自然だから正しい」は誤り" }

  - board: whiteboard
    steps:
      - say: みっつ目は、変われる力を、小さく見すぎることです。人間の行動は、進化の傾向に影響されますが、文化や教育、制度、一人ひとりの選択によって、大きく変わります。進化でそうなっているから、変えられない、という考えは、まちがいです。
        show:
          - { type: title, text: 変われる力と文化のちがい }
          - { type: box, color: green, w: 1100, title: ③ 変われる力を小さく見すぎ, text: "文化・教育・制度・選択で行動は大きく変わる。「進化だから変えられない」は誤り" }
      - say: よっつ目は、文化のちがいの無視です。初期の進化心理学の研究の多くは、調べた人がかたよっていて、それを人類共通の傾向として、一般化することへの批判があります。
        show:
          - { type: box, color: yellow, w: 1100, title: ④ 文化のちがいの無視, text: "調べた人がかたよっている研究を、人類共通として一般化する問題" }

  - board: whiteboard
    steps:
      - say: 進化心理学は、人間を理解する、大切な視点をくれます。でも、ただひとつの正解ではなく、ほかの説明と組み合わせて使うべき、ひとつの視点として使うのが、ふさわしいのです。
        show:
          - { type: title, text: ひとつの視点として }
          - { type: box, color: yellow, w: 1100, text: "進化心理学は「唯一の正解」ではなく、ほかの説明と組み合わせて使う「ひとつの視点」" }
      - say: これで、心理学はおしまいです。自分や人の心のくせを知ることが、少しでも、毎日を生きやすくする助けになればうれしいです。おつかれさまでした。
        added: true
        show:
          - { type: text, color: green, text: "心のくせを知って、毎日をもう少し生きやすく" }
