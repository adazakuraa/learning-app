title: 動機づけの理論
scenes:
  - board: whiteboard
    steps:
      - say: 「動機づけ」、つまり、やる気のしくみです。人が行動する理由を研究するのが、動機づけの心理学です。
        show:
          - { type: title, text: マズローの欲求階層説 }
      - say: マズローの欲求階層説は、最も有名な動機づけの理論で、人間の欲求を、ピラミッドのように、5つの段階に分けました。下から、食べる、寝るなどの、生理的欲求。身の安全を求める、安全欲求。仲間や愛情を求める、所属と愛の欲求。認められたい、承認欲求。そして、自分の可能性を発揮したい、自己実現欲求です。
        show:
          - { type: image, src: 1000002904.webp, at: [80, 120], w: 640 }
          - type: list
            at: [770, 150]
            size: s
            items: ["自己実現（可能性を発揮）", "承認（認められたい）", "所属と愛（仲間・愛情）", "安全（身の安全）", "生理的（食・睡眠）"]
      - say: とてもわかりやすい理論ですが、科学的な証拠は弱く、必ず下から順番に満たされる、というわけではありません。おなかがすいていても、芸術に没頭できる人もいます。それでも、人の欲求を整理する枠組みとしては、役に立ちます。
        show:
          - { type: text, at: [80, 580], w: 1120, color: gray, text: "科学的証拠は弱く、必ず下から順に満たされるわけではない。でも整理の枠組みとして便利" }

  - board: whiteboard
    steps:
      - say: おもしろいから、やりがいがあるから、という、内側からのやる気を、内発的動機づけといいます。反対に、お金がもらえるから、しかられるから、という、外側からのやる気を、外発的動機づけといいます。
        show:
          - { type: title, text: 内発的と外発的 }
          - { type: box, color: green, at: [80, 140], w: 540, title: 内発的動機づけ, text: "おもしろい・やりがいがある（内側から）" }
          - { type: box, color: blue, at: [660, 140], w: 540, title: 外発的動機づけ, text: "お金・ほめられる・しかられる（外側から）" }

  - board: whiteboard
    steps:
      - say: アンダーマイニング効果は、もともと楽しんでいたことに、外からごほうびをあたえると、内側からのやる気が下がってしまう現象です。
        show:
          - { type: title, text: アンダーマイニング効果 }
          - { type: box, color: pink, w: 1100, text: "**アンダーマイニング効果**：楽しんでいたことにごほうびをあげると、やる気が下がる" }
      - say: お絵かきが好きな子どもに、上手にかけたら、お菓子をあげる、と言い続けると、お菓子がないと、絵をかかなくなってしまいます。勉強しようと思ったときに、勉強しなさい、と言われると、やる気がなくなるのも、この効果によるものです。
        show:
          - { type: text, text: "例：お絵かきにお菓子 → お菓子がないとかかなくなる" }
          - { type: text, text: "例：やろうと思ったときに「勉強しなさい」→ やる気がなくなる" }
      - say: ごほうびや罰で、人を動かすことには、限界がある。人を育てたり、自分を動かしたりするときに、覚えておきたい発見です。
        show:
          - { type: text, color: yellow, text: "ごほうびと罰で人を動かすことには限界がある" }
