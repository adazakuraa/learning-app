title: ストレスと心身の関係
scenes:
  - board: whiteboard
    steps:
      - say: 「ストレスと心と体」です。ストレスとは、まわりからの要求に対応しようとするときの、心と体の反応です。もともとは、戦うか、逃げるか、という緊急事態に対応するしくみで、アドレナリンが出て、心拍数と血圧が上がり、消化が止まります。
        show:
          - { type: title, text: ストレス反応 }
          - { type: box, color: yellow, w: 1100, text: "もとは「戦うか逃げるか」のしくみ：アドレナリン・心拍↑・血圧↑・消化ストップ" }
      - say: 生物で学んだ、アドレナリンの、戦闘モードですね。
        added: true
        show:
          - { type: text, color: gray, text: "生物で学んだ「戦闘モード」" }

  - board: whiteboard
    steps:
      - say: 短いストレス反応は、生きのびるのに役立ちますが、長く続く、慢性的なストレスは、深刻な問題を引き起こします。
        show:
          - { type: title, text: 慢性ストレスの害 }
      - say: ストレスホルモンの、コルチゾールが、長い間出続けると、免疫が下がり、記憶に大切な、脳の海馬が縮み、心臓や血管の病気、うつ、不安の病気のリスクが高まります。ストレスは、心の問題だけでなく、体にも深刻な変化をもたらすのです。
        show:
          - { type: box, color: pink, w: 1100, text: "**コルチゾール** が出続ける → 免疫低下・海馬が縮む・心臓病・うつ・不安" }
          - { type: text, color: yellow, text: "ストレスは「心の問題」だけでなく、体の問題でもある" }

  - board: whiteboard
    steps:
      - say: ストレスへの対処を、コーピングといいます。2つの種類があります。
        show:
          - { type: title, text: コーピングと社会的サポート }
      - say: 問題焦点型は、ストレスの原因そのものに取り組む方法です。問題を解決する、環境を変える。情動焦点型は、ストレスでわいた気持ちを整える方法です。見方を変える、だれかに話す、気分転換をする。
        show:
          - { type: box, color: blue, at: [80, 140], w: 540, title: 問題焦点型, text: "原因に取り組む（問題を解決・環境を変える）" }
          - { type: box, color: green, at: [660, 140], w: 540, title: 情動焦点型, text: "気持ちを整える（見方を変える・話す・気分転換）" }
      - say: そして、信頼できる人間関係、社会的サポートは、ストレスを和らげる、最も強力なクッションのひとつです。孤独は、健康への悪影響が、喫煙に匹敵する、という研究もあります。つらいときは、ひとりでかかえこまず、だれかに話してみましょう。
        show:
          - { type: box, at: [80, 360], w: 1120, color: yellow, text: "信頼できる人間関係 ＝ 最強のクッション。孤独の害は喫煙なみ" }
