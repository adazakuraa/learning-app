title: 感情と認知の相互作用
scenes:
  - board: whiteboard
    steps:
      - say: 「感情と考えの関係」です。感情と考えは、分かれておらず、いつもおたがいに影響し合っています。
        show:
          - { type: title, text: 気分一致効果 }
      - say: 気分一致効果は、今の気分と一致する情報を、思い出したり、注意を向けたりしやすい現象です。悲しいときは、悲しい記憶が、うれしいときは、よい記憶が、うかびやすいのです。
        show:
          - { type: box, color: blue, w: 1100, text: "**気分一致効果**：悲しいときは悲しい記憶、うれしいときはよい記憶がうかぶ" }
      - say: うつの状態では、悲しい記憶ばかりがうかんで、さらに気分が落ちこむ、という悪循環が起きます。
        show:
          - type: svg
            w: 900
            h: 200
            markup: |
              <circle cx="450" cy="100" r="80" stroke="#f4a3b8" stroke-dasharray="8 6"/>
              <path d="M520 55 L530 75 L508 72" stroke="#f4a3b8"/>
              <g stroke="none" font-size="22" text-anchor="middle"><text x="450" y="15" fill="#f4a3b8">気分が落ちこむ</text><text x="450" y="200" fill="#f4a3b8">悲しい記憶がうかぶ</text></g>

  - board: whiteboard
    steps:
      - say: 感情が判断にあたえる影響は、想像以上に大きいことが知られています。晴れた日は、株価が上がりやすい。裁判官は、休けいのあとのほうが、仮釈放を認めやすい、といった研究があります。
        show:
          - { type: title, text: 感情は判断を動かす }
          - { type: text, text: "晴れた日は株価が上がりやすい（気分がよく楽観的に）" }
          - { type: text, text: "裁判官は休けい後のほうが仮釈放を認めやすい（つかれると保守的に）" }
      - say: 客観的に判断した、と思っていても、そのときの気持ちが、判断に影響しているのです。
        show:
          - { type: box, color: yellow, w: 1000, text: "「客観的に判断した」つもりでも、気持ちが影響している" }

  - board: whiteboard
    steps:
      - say: 感情の種類や強さ、続く時間を、調節することを、感情調節といいます。2つの方法があります。
        show:
          - { type: title, text: 感情調節 }
      - say: 認知的再評価は、できごとの受けとめ方を変える方法です。抑制は、感情を表に出さないように、おさえる方法です。研究では、前者の、受けとめ方を変えるほうが、心の健康によいとされています。
        show:
          - { type: box, color: green, at: [80, 140], w: 540, title: 認知的再評価 ○, text: "できごとの受けとめ方を変える" }
          - { type: box, color: gray, at: [660, 140], w: 540, title: 抑制 △, text: "感情を表に出さずにおさえる" }
      - say: 失敗を、チャンスととらえ直す。これは、ただの前向き思考ではなく、効果のある、感情調節の方法なのです。
        show:
          - { type: text, at: [80, 360], w: 1120, color: yellow, text: "「失敗をチャンスととらえ直す」＝ 効果のある感情調節" }
