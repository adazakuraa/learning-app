title: ヒューリスティックと判断の歪み
scenes:
  - board: whiteboard
    steps:
      - say: 「ヒューリスティックと判断のゆがみ」です。ヒューリスティックとは、完全に正確ではないけれど、たいていうまくいく、経験則や近道のことです。人間は、複雑な問題を完ぺきに分析する時間も力もないので、ヒューリスティックにたよります。多くの場合はうまくいきますが、バイアスを生むこともあります。
        show:
          - { type: title, text: ヒューリスティック }
          - { type: box, color: yellow, w: 1100, text: "**ヒューリスティック** ＝ たいていうまくいく「経験則・近道」。でもバイアスも生む" }

  - board: whiteboard
    steps:
      - say: フレーミング効果は、同じ内容でも、言い方によって、判断が変わる現象です。手術の成功率90パーセント、と、手術の死亡率10パーセントは、同じ情報ですが、前者のほうが、手術に同意する人が多くなります。
        show:
          - { type: title, text: フレーミング効果 }
          - { type: text, size: l, color: green, text: "「成功率 90％」→ 受けてみよう" }
          - { type: text, size: l, color: pink, text: "「死亡率 10％」→ こわい…" }
          - { type: box, color: yellow, w: 1000, text: "同じ内容でも、言い方（フレーム）で判断が変わる" }
      - say: ニュースの見出しの言葉選びが、世論を左右するのは、このためです。
        show:
          - { type: text, color: gray, text: "ニュースの言葉選びが世論を左右する" }

  - board: whiteboard
    steps:
      - say: サンクコスト、つまり、もう使ってしまって取りもどせないコストを、判断に入れてしまうまちがいを、サンクコストの誤謬といいます。
        show:
          - { type: title, text: サンクコストと計画錯誤 }
          - { type: box, color: pink, w: 1100, title: サンクコストの誤謬, text: "取りもどせないコストにこだわる（「ここまでやったから」「もったいないから」）" }
      - say: つまらない映画でも、チケット代がもったいないから、最後まで見てしまう。でも、合理的に判断すべきなのは、これからどうなるか、であって、今まで何を使ったかは、関係ないのです。
        show:
          - { type: text, color: green, text: "判断すべきは「これからどうなるか」。使ったものは関係ない" }
      - say: 計画錯誤は、自分の作業が終わるまでの時間や、費用を、少なく見積もってしまう傾向です。今回は慎重に見積もった、と思っても、実際には、楽観的すぎることがよくあります。
        show:
          - { type: box, color: blue, w: 1100, title: 計画錯誤, text: "時間・費用をいつも少なく見積もる（「今回こそ慎重に」でも楽観的）" }
