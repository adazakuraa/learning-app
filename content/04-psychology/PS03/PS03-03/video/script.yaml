title: 意思決定と合理性の限界
scenes:
  - board: whiteboard
    steps:
      - say: 「意思決定と合理性の限界」です。古い経済学では、人間は、合理的に、自分の利益を最大にするように行動する、と考えられていました。でも、心理学の研究は、それが大きくまちがっていることを示しました。
        show:
          - { type: title, text: プロスペクト理論 }
          - { type: text, color: gray, text: "古い経済学：人間は合理的に利益を最大化する → 心理学：そうではない" }
      - say: カーネマンが示した、プロスペクト理論は、人間の実際の決め方を説明する理論です。2つの大事な発見があります。
        show:
          - { type: text, text: "**プロスペクト理論**：人間の実際の決め方を説明する" }

  - board: whiteboard
    steps:
      - say: ひとつ目は、損失回避です。人は、同じ大きさの得より、損を、ずっと強く感じます。1万円もらう喜びより、1万円失う悲しみのほうが、およそ2倍大きいとされています。
        show:
          - { type: title, text: 損失回避 }
          - type: svg
            w: 1000
            h: 220
            markup: |
              <path d="M500 10 V210 M60 110 H940" stroke="#9aa3ad"/>
              <rect x="510" y="60" width="160" height="50" fill="#9be0b0" fill-opacity="0.6" stroke="none"/>
              <rect x="330" y="110" width="160" height="100" fill="#f4a3b8" fill-opacity="0.6" stroke="none"/>
              <g stroke="none" font-size="22"><text x="690" y="95" fill="#9be0b0">1万円得る喜び</text><text x="100" y="170" fill="#f4a3b8">1万円失う悲しみ（約2倍）</text></g>
      - say: これが、もったいない、という感覚のもとであり、変化より、今のままを好む傾向にも、つながっています。
        show:
          - { type: box, color: yellow, w: 1000, text: "損は得の約2倍強く感じる →「もったいない」・今のままを好む" }

  - board: whiteboard
    steps:
      - say: ふたつ目は、参照点依存性です。人は、絶対的な価値ではなく、今の状態や、期待からの変化で、価値を感じます。
        show:
          - { type: title, text: 参照点依存性 }
      - say: 年収500万円が700万円になれば、うれしい。でも、900万円から700万円になれば、悲しい。同じ700万円でも、感じ方がまったくちがうのです。
        show:
          - { type: text, color: green, text: "500万円 → 700万円：うれしい" }
          - { type: text, color: pink, text: "900万円 → 700万円：悲しい" }
          - { type: box, color: yellow, w: 1000, text: "同じ700万円でも、どこから変わったかで感じ方がちがう" }

  - board: whiteboard
    steps:
      - say: これらの発見は、経済学や、マーケティング、政策づくりを大きく変えました。人の行動を変えるには、正しい情報を伝えるだけでは足りません。そこで注目されたのが、ナッジです。ひじで、そっとつつく、という意味で、よい選択を、自然に選びやすくなるように、後押しする方法です。
        show:
          - { type: title, text: ナッジ }
          - { type: box, color: blue, w: 1100, text: "**ナッジ**（ひじでそっとつつく）：よい選択を自然に選びやすくする後押し" }
      - say: 典型的な例が、臓器提供のオプトアウト制です。申し出なければ、提供に同意したことになる、というしくみで、これを採用した国では、提供に同意する人の割合が、大きく上がりました。
        show:
          - { type: text, color: green, text: "例：臓器提供の **オプトアウト** 制（申し出なければ「同意」）" }
