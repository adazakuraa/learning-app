title: 認知バイアスの種類
scenes:
  - board: whiteboard
    steps:
      - say: 「認知バイアスの種類」です。認知バイアスは、人間が犯す、決まったパターンの考えのゆがみです。ただのまちがいではなく、同じ状況で、同じ方向にまちがえやすい、という点が大切です。代表的なものを見ていきましょう。
        show:
          - { type: title, text: 確証バイアス }
          - { type: text, text: "**認知バイアス** ＝ 同じ方向にまちがえやすい、決まったパターンの考えのゆがみ" }
      - say: 確証バイアスは、自分が信じていることを支える情報を集め、反する情報を、無視したり、軽く見たりする傾向です。血液型占いを信じる人は、やっぱりA型はきちょうめんだ、という例ばかりに目を向け、外れた例は、例外として片づけます。
        show:
          - { type: box, color: yellow, w: 1100, title: 確証バイアス, text: "信じていることを支える情報ばかり集める（血液型占いの「当たり」ばかり覚える）" }
      - say: SNSで、自分の意見に近い情報ばかりが表示される、フィルターバブルは、このバイアスを、さらに強めてしまいます。
        show:
          - { type: text, color: gray, text: "SNSのフィルターバブルがさらに強める" }

  - board: whiteboard
    steps:
      - say: アンカリング効果は、最初に見せられた数字が、判断に強く影響してしまう現象です。
        show:
          - { type: title, text: アンカリング効果 }
          - type: svg
            w: 1000
            h: 180
            markup: |
              <g stroke="none" font-size="44"><text x="80" y="80" fill="#9aa3ad">通常価格 20,000円</text><text x="80" y="160" fill="#f4a3b8">今なら 8,000円！</text></g>
              <path d="M70 65 H470" stroke="#9aa3ad" stroke-width="3"/>
              <g stroke="none" font-size="22" fill="#f3d77a"><text x="600" y="80">最初の数字（いかり ＝ アンカー）</text><text x="600" y="120">に引っぱられて安く感じる</text></g>
      - say: 通常価格2万円のところ、今なら8000円、という表示が効くのは、最初の2万円が、船のいかり、アンカーのように、判断をつなぎとめてしまうからです。交渉でも、最初に出した金額が、最終的な結果に、大きく影響します。
        show:
          - { type: box, color: blue, w: 1000, text: "**アンカリング**：最初の数字が判断をつなぎとめる（交渉では最初の金額が大事）" }

  - board: whiteboard
    steps:
      - say: 利用可能性ヒューリスティックは、思い出しやすい情報から、どのくらい起こるかを判断する傾向です。飛行機事故が大きく報道された直後は、飛行機がこわく感じますが、統計的には、車のほうが、はるかに危険です。身近なこと、最近のこと、感情がゆさぶられることは、大きく見積もられがちなのです。
        show:
          - { type: title, text: 利用可能性とハロー効果 }
          - { type: box, color: pink, w: 1100, title: 利用可能性ヒューリスティック, text: "思い出しやすいものを「よく起きる」と感じる（飛行機事故の報道 → 飛行機がこわい。実は車のほうが危険）" }
      - say: ハロー効果は、ひとつのよい特徴、または悪い特徴が、全体の評価に影響してしまう現象です。見た目がよい人は、性格もよいと思われやすい。第一印象が悪いと、全体の評価も下がる。採用面接の評価が、ハロー効果に左右されることも、研究で示されています。
        show:
          - { type: box, color: green, w: 1100, title: ハロー効果, text: "ひとつの特徴が全体の評価に影響（見た目がよい → 性格もよさそう）" }
