questions:
  - q: 速く、自動的で、直感的な思考を「システム1」という。遅く、意識的で、論理的な思考を何というでしょう？
    a: [システム2]
  - q: 「通常2万円が今なら8千円」のように、最初に見た数字が判断に影響する効果を何というでしょう？
    a: [アンカリング効果, アンカリング]
    show: アンカリング効果
  - q: 人は同じ大きさの利益より、損失をずっと強く感じる。これを何というでしょう？
    a: [損失回避]
  - q: 強制せずに、望ましい行動をそっと後押しする手法を、カタカナで何というでしょう？
    a: [ナッジ]
  - q: 「もったいないから」と、すでに払って取り戻せない費用にこだわって判断を誤ることを何というでしょう？
    a: [サンクコスト, サンクコストの誤謬, 埋没費用]
    show: サンクコスト（埋没費用）の誤謬
