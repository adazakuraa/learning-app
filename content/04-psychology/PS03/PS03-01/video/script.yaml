title: システム1とシステム2
scenes:
  - board: slide
    steps:
      - say: 第3章、「思考・判断・バイアス」です。
        show:
          - { type: title, text: 第3章　思考・判断・バイアス }
      - say: 人の考え方の2つのしくみ、思考のくせ、そして、損得の感じ方のゆがみを学びます。
        show:
          - type: list
            items: ["システム1とシステム2", "認知バイアスの種類", "意思決定と合理性の限界", "ヒューリスティックと判断の歪み"]
      - say: 買い物、投資、仕事の判断。毎日の決断で、損をしないためのヒントがつまった章です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "思考のくせを知り、毎日の判断で損をしないようにする" }

  - board: whiteboard
    steps:
      - say: ノーベル経済学賞を受賞した心理学者、ダニエル・カーネマンは、人間の考え方を、2つのシステムに分けて説明しました。
        show:
          - { type: title, text: 2つの思考システム }
      - say: システム1は、速くて、自動的で、直感的な、無意識の考え方です。顔を見分けたり、2たす2を計算したり、感情的に反応したりするのは、システム1です。エネルギーを使わず、努力なしに動きます。
        show:
          - { type: box, color: pink, at: [80, 140], w: 540, title: システム1（速い）, text: "自動的・直感的・無意識。顔の見分け、2＋2。努力いらず" }
      - say: システム2は、遅くて、意識的で、論理的な、努力が必要な考え方です。17かける24の計算や、むずかしい文章の理解、新しい状況での判断は、システム2の担当です。集中力が必要で、つかれると、はたらきにくくなります。
        show:
          - { type: box, color: blue, at: [660, 140], w: 540, title: システム2（遅い）, text: "意識的・論理的。17×24、むずかしい判断。つかれると働かない" }

  - board: whiteboard
    steps:
      - say: 大事なのは、私たちは、自分がシステム2で動いていると思っているけれど、実際には、ほとんどの判断を、システム1がしている、という点です。
        show:
          - { type: title, text: ほとんどはシステム1 }
          - { type: box, color: yellow, w: 1100, text: "自分はシステム2で考えているつもり → 実はほとんどの判断はシステム1" }
      - say: システム1は、とても速くて効率的ですが、まちがい、つまりバイアスを犯しやすいのです。システム2は、より正確ですが、遅く、つかれると働かなくなります。
        show:
          - { type: text, color: pink, text: "システム1：速いが、まちがえやすい（バイアス）" }
          - { type: text, color: blue, text: "システム2：正確だが、遅くて、つかれると働かない" }
      - say: 判断の質を上げるには、今の判断は、システム1の自動反応ではないか、と、意識的に立ち止まることが大切です。大きな買い物の前に、一晩寝かせるのは、システム2に出番をあたえる、よい方法ですね。
        show:
          - { type: box, color: green, w: 1100, text: "「これはシステム1の自動反応では？」と立ち止まる（大きな買い物は一晩寝かせる）" }
