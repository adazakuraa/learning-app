title: 心理学とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、心理学がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 心理学とは
      - say: 心理学は、人の心と行動の仕組みを、実験やデータにもとづいて科学的に調べる学問です。知覚や記憶、判断のくせ、感情、性格、人間関係までを学びます。
        show:
          - type: box
            w: 1100
            text: 心理学は、人の心と行動の仕組みを、実験やデータにもとづいて科学的に調べる学問です。知覚や記憶、判断のくせ、感情、性格、人間関係までを学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で10章です。第1章は心理学とは何か、第2章は知覚と認知の仕組み、第3章は思考・判断・バイアス、第4章は感情と動機づけ、第5章は自己と人格、第6章は社会と人間心理、第7章は異常心理と精神医学の基礎、第8章は犯罪心理学、第9章は幸福と人間の可能性、第10章は進化心理学。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　心理学とは何か
              - 第2章　知覚と認知の仕組み
              - 第3章　思考・判断・バイアス
              - 第4章　感情と動機づけ
              - 第5章　自己と人格
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第6章　社会と人間心理
              - 第7章　異常心理と精神医学の基礎
              - 第8章　犯罪心理学
              - 第9章　幸福と人間の可能性
              - 第10章　進化心理学
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、心理学を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、自分を理解できる。なぜやる気が出ないのか、なぜ不安になるのか。心の仕組みを知ると、自分の状態を落ち着いて見られます。
        show:
          - type: box
            w: 1100
            text: |-
              **自分を理解できる**
              なぜやる気が出ないのか、なぜ不安になるのか。心の仕組みを知ると、自分の状態を落ち着いて見られます。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、人との関わりがうまくなる。人が周りに合わせてしまう理由や、好感をもつ仕組みを知ると、人間関係のすれ違いを減らせます。
        show:
          - type: box
            w: 1100
            text: |-
              **人との関わりがうまくなる**
              人が周りに合わせてしまう理由や、好感をもつ仕組みを知ると、人間関係のすれ違いを減らせます。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、判断のミスを防げる。人の判断には決まったくせ（バイアス）があります。知っていれば、買い物や仕事の判断で失敗しにくくなります。
        show:
          - type: box
            w: 1100
            text: |-
              **判断のミスを防げる**
              人の判断には決まったくせ（バイアス）があります。知っていれば、買い物や仕事の判断で失敗しにくくなります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、勉強や仕事のやる気を保ちたいとき、職場や家庭の人間関係で悩んだとき、ストレスや心の不調に気づき、対処したいとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 勉強や仕事のやる気を保ちたいとき
              - 職場や家庭の人間関係で悩んだとき
              - ストレスや心の不調に気づき、対処したいとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、有名な実験は、何を確かめた実験かを一言で言えるようにする。そして、自分の経験に当てはめてみる。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・有名な実験は、**何を確かめた実験か**を一言で言えるようにする
              ・自分の経験に当てはめてみる
            color: pink
            at:
              - 80
              - 420
