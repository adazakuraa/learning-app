title: 科学としての心理学
scenes:
  - board: slide
    steps:
      - say: 心理学の最初の章、「心理学とは何か」です。
        show:
          - { type: title, text: 第1章　心理学とは何か }
      - say: 心理学は、科学として成り立つのか。そして、どんな歴史をたどってきたのかを学びます。
        show:
          - type: list
            items: ["科学としての心理学", "心理学の歴史と分野"]
      - say: 自分や他人の心のくせを知ることは、人間関係や仕事、そして自分自身とのつきあい方を、ぐっと楽にしてくれます。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "心理学がどんな学問かを知り、心のくせを知る準備をする" }

  - board: whiteboard
    steps:
      - say: 心理学は、科学として成り立っているのでしょうか。物理や化学とちがって、人間を相手にする心理学には、いろいろな難しさがあります。
        show:
          - { type: title, text: 心理学の難しさ }
      - say: まず、測ることの難しさです。知性、幸福度、攻撃性といったものは、直接は測れません。アンケートや、行動の観察、脳のスキャンなどを使いますが、それが本当に測りたいものかは、疑問が残ります。
        show:
          - { type: box, color: blue, w: 1100, title: ① 測るのが難しい, text: "知性・幸福度は直接測れない。アンケート・観察・脳スキャンで近づく" }
      - say: また、倫理の制約もあります。人を傷つけたり、だましたりする実験は、許されないので、できる実験に限りがあります。
        show:
          - { type: box, color: pink, w: 1100, title: ② 倫理の制約, text: "人を傷つける・だます実験はできない" }

  - board: whiteboard
    steps:
      - say: それでも心理学が役に立つのは、完ぺきではないにしても、感覚や直感、常識よりも、体系的に人間を理解しようとするからです。
        show:
          - { type: title, text: 疑いながら使う }
          - { type: box, color: green, w: 1100, text: "完ぺきではない。でも、直感や常識より体系的に人間を理解できる" }
      - say: 血液型で性格がわかる、犯罪者は顔でわかる、といった、科学的でない信念より、実験と統計にもとづく心理学の知見のほうが、人間の理解を、確かに深めてくれます。大切なのは、疑いながら使う、という姿勢です。
        show:
          - { type: text, color: gray, text: "×「血液型で性格がわかる」「犯罪者は顔でわかる」" }
          - { type: text, color: yellow, text: "○ 実験と統計にもとづく知見を「疑いながら使う」" }
