title: 心理学の歴史と分野
scenes:
  - board: whiteboard
    steps:
      - say: 「心理学の歴史」です。心理学は、哲学から独立した、比較的新しい科学です。はじめは、自分の意識を、内側から観察して分析しよう、という方向でした。でもその後、観察できない意識より、観察できる行動を研究すべきだ、という、行動主義が主流になりました。
        show:
          - { type: title, text: 行動主義とパブロフの犬 }
          - { type: text, text: "意識の内省 → 観察できる「行動」を研究する **行動主義** へ" }
      - say: 有名なのが、パブロフの犬の実験です。犬にエサをあげる前に、必ずベルを鳴らすことをくり返すと、犬は、ベルの音を聞いただけで、よだれをたらすようになりました。
        show:
          - { type: image, src: 1000003216.webp, at: [80, 200], w: 480 }
          - { type: text, at: [610, 230], w: 600, text: "ベル → エサ をくり返す → ベルだけでよだれ" }
      - say: これを、古典的条件づけといいます。本来は関係のないものでも、学習によって、反応と結びつけられる、ということを表しています。梅干しを見ただけで、つばが出てくるのも、同じしくみです。
        show:
          - { type: box, at: [610, 330], w: 600, color: yellow, text: "**古典的条件づけ**：関係のないものも、学習で反応と結びつく（梅干しを見るとつばが出る）" }

  - board: whiteboard
    steps:
      - say: スキナーは、ネズミやハトを使って、ある行動ができたら、エサというごほうびをあげる、オペラント条件づけの実験を行いました。そして、どんなごほうびのあげ方が、いちばん効果的かを調べました。
        show:
          - { type: title, text: スキナーのオペラント条件づけ }
          - { type: text, text: "行動できたらごほうび → どんなあげ方が効果的か？" }
      - say: 毎回ごほうびをあげると、覚えるのは速いけれど、ごほうびがなくなると、すぐにやめてしまいました。時々ごほうびをあげると、覚えるのは遅いけれど、ごほうびがなくなっても、なかなかやめませんでした。
        show:
          - { type: box, color: blue, at: [80, 220], w: 540, title: 毎回ごほうび, text: "覚えるのは速い。でも、なくなるとすぐやめる" }
          - { type: box, color: pink, at: [660, 220], w: 540, title: 時々ごほうび, text: "覚えるのは遅い。でも、なくなってもやめにくい" }
      - say: これは人間にも当てはまります。ギャンブルがやめられないのは、たまに当たる、という、この効果によるものだと考えられています。スマホの通知を、つい何度も見てしまうのも、似たしくみですね。
        show:
          - { type: text, at: [80, 440], color: yellow, text: "たまに当たる → やめられない（ギャンブル・スマホの通知）" }

  - board: whiteboard
    steps:
      - say: 1950年代から60年代には、コンピュータが登場し、人の心も、コンピュータのような情報処理のしくみだ、と考える、認知心理学がさかんになります。
        show:
          - { type: title, text: 認知心理学 }
          - { type: box, color: green, w: 1100, text: "**認知心理学**：心 ＝ 情報処理のしくみ。行動の背後にある思考・記憶・判断を研究" }
      - say: ただ行動を観察するだけでなく、行動を手がかりに、その背後にある、考え、記憶、判断のプロセスを、研究するようになったのです。
        show:
          - { type: text, color: gray, text: "行動主義（外から見える行動）→ 認知心理学（行動の裏の心のしくみ）" }
