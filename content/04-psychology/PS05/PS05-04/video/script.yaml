title: 防衛機制
scenes:
  - board: whiteboard
    steps:
      - say: 「防衛機制」です。フロイトが示した考えで、不安や葛藤、受け入れがたい気持ちから、自分の心を守るための、無意識のしくみです。
        show:
          - { type: title, text: 防衛機制 }
          - { type: box, color: yellow, w: 1100, text: "**防衛機制**：不安や受け入れがたい気持ちから心を守る、無意識のしくみ（フロイト）" }
      - say: 抑圧は、最も基本的な防衛機制で、受け入れがたい考えや記憶を、無意識の中に、おしこめます。否認は、つらい現実を、認めようとしないことです。重い病気を告げられた直後に、何かのまちがいだ、と思うのが、その例です。
        show:
          - { type: text, color: blue, text: "**抑圧**：受け入れがたい考え・記憶を無意識におしこめる" }
          - { type: text, color: blue, text: "**否認**：つらい現実を認めない（「何かのまちがいだ」）" }

  - board: whiteboard
    steps:
      - say: 投影は、自分の受け入れがたい気持ちを、相手のものだと感じることです。自分が相手をきらっているのに、相手が自分をきらっている、と感じます。
        show:
          - { type: title, text: いろいろな防衛機制 }
          - { type: text, color: pink, text: "**投影**：自分の気持ちを相手のものと感じる（きらっているのは自分なのに）" }
      - say: 合理化は、本当の理由をかくして、もっともらしい理由を、あとからつけることです。食べたいから食べたのに、今日は特別な日だから、と理屈をつける。考えと行動が矛盾していると、認知的不協和という、心の不快感が生まれるので、それを解消するために行われます。
        show:
          - { type: text, color: yellow, text: "**合理化**：もっともらしい理由をあとづけ（「今日は特別な日だから」）" }
      - say: 昇華は、受け入れられない欲求や怒りを、スポーツや芸術、仕事など、建設的な活動に向けることです。反動形成は、本当の気持ちと正反対の態度を、大げさにとることです。好きな人に、わざとそっけなくしてしまうのが、その例です。
        show:
          - { type: text, color: green, text: "**昇華**：怒りや欲求を、スポーツ・芸術・仕事に向ける" }
          - { type: text, color: gray, text: "**反動形成**：本心と正反対の態度（好きな人にそっけなくする）" }

  - board: whiteboard
    steps:
      - say: 防衛機制は、悪いものではありません。ほどよく使われるかぎり、心の安定に役立ちます。でも、使いすぎると、現実の見方がゆがみ、問題の解決を、さまたげてしまいます。
        show:
          - { type: title, text: ほどよく使う }
          - { type: box, color: yellow, w: 1100, text: "ほどよく使えば心の安定に役立つ。使いすぎると現実が見えなくなる" }
      - say: 今の自分は、合理化していないかな、と気づけるだけでも、一歩前進です。
        added: true
        show:
          - { type: text, color: gray, text: "「今、合理化していないかな？」と気づくだけでも一歩前進" }
