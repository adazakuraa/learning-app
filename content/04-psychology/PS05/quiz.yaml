questions:
  - q: 「自分は〇〇をうまくこなせる」という信念を何というか。
    a: [自己効力感]
  - q: 人格を5つの次元（開放性・誠実性・外向性・協調性・神経症傾向）で測る理論を何というか。
    a: [ビッグファイブ, ビッグファイブ理論]
    show: ビッグファイブ理論
  - q: 「食べたかったから食べた」のに「体に必要だから」ともっともな理由を後からつける防衛機制を何というか。
    a: [合理化]
  - q: 社会的に受け入れられない欲求や怒りを、スポーツや芸術など建設的な活動に向ける防衛機制を何というか。
    a: [昇華]
  - q: 防衛機制の概念を提唱した精神分析の創始者は誰か。
    a: [フロイト]
