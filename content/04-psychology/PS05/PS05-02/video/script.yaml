title: 人格理論
scenes:
  - board: whiteboard
    steps:
      - say: 「人格理論」です。人格、パーソナリティとは、その人らしさをつくる、安定した考え方、感じ方、行動のパターンです。これを科学的に表して、測ろうとするのが、人格理論です。
        show:
          - { type: title, text: ビッグファイブ }
      - say: 今、最も信頼性が高いとされるのが、ビッグファイブ理論です。人格を、5つの独立した物差しで測ります。
        show:
          - { type: text, color: blue, text: "**O 開放性**：新しい経験・アイデアへの好奇心" }
          - { type: text, color: green, text: "**C 誠実性**：自制心・計画性・目標に向かう力" }
          - { type: text, color: yellow, text: "**E 外向性**：社交性・積極性" }
          - { type: text, color: pink, text: "**A 協調性**：思いやり・協力・信頼" }
          - { type: text, color: gray, text: "**N 神経症傾向**：不安になりやすさ・感情の不安定さ" }
      - say: 開放性は、新しい経験や考えへの好奇心。誠実性は、自制心や計画性。外向性は、社交性や積極性。協調性は、思いやりや協力。神経症傾向は、不安になりやすさや、感情の不安定さです。血液型のような4つのタイプ分けではなく、5つの物差しの、それぞれの高さで、人を表すのが特徴です。
        show:
          - { type: box, color: yellow, w: 1100, text: "タイプ分けではなく、5つの物差しそれぞれの「高さ」で表す" }

  - board: whiteboard
    steps:
      - say: ビッグファイブは、文化をこえて、ある程度共通にあらわれ、遺伝の影響も大きいことが示されています。およそ50パーセントが、遺伝で説明できる、とされています。
        show:
          - { type: title, text: 遺伝と状況 }
          - { type: text, text: "文化をこえて共通。約50％が遺伝で説明できる" }
      - say: ただし、人格は、状況によっても大きく変わる、という批判もあります。職場ではおとなしいのに、友だちの前ではよくしゃべる。そんな経験は、だれにでもありますね。
        show:
          - { type: text, color: gray, text: "批判：人格は状況でも大きく変わる（職場と友だちの前でちがう）" }
