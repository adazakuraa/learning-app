title: 発達と人格の形成
scenes:
  - board: whiteboard
    steps:
      - say: 「発達と人格の形成」です。人格は、生まれつき決まっているのでしょうか。それとも、育ち方でつくられるのでしょうか。答えは、両方です。遺伝と環境が、複雑に影響し合っています。
        show:
          - { type: title, text: 愛着理論 }
          - { type: text, text: "人格は「生まれ」と「育ち」の両方。おたがいに影響し合う" }
      - say: 赤ちゃんのころの愛着は、人格づくりに、大きな影響を持つとされています。愛着理論では、赤ちゃんが、主に世話をする人との間に、安心できる、安定したきずなをつくることが、のちの人間関係や、感情の調節の、土台になると考えます。
        show:
          - { type: box, color: yellow, w: 1100, text: "**愛着理論**：世話をする人との安定したきずな → のちの人間関係・感情調節の土台" }

  - board: whiteboard
    steps:
      - say: エインズワースの研究では、愛着のスタイルを、3つに分けました。
        show:
          - { type: title, text: 3つの愛着スタイル }
      - say: 安全型は、世話をする人を、安全基地にして、不安なときはなぐさめを求め、安心すると、また探検に出かけられるタイプ。回避型は、世話をする人を無視して、感情をおさえるタイプ。アンビバレント型は、強い不安を示し、なぐさめを求めながら、こばむタイプです。
        show:
          - { type: box, color: green, w: 1100, title: 安全型, text: "世話をする人を安全基地に。不安なら甘え、安心すればまた探検" }
          - { type: box, color: blue, w: 1100, title: 回避型, text: "世話をする人を無視し、感情をおさえる" }
          - { type: box, color: pink, w: 1100, title: アンビバレント型, text: "強い不安。なぐさめを求めながら、こばむ" }
      - say: 子どものころの愛着のスタイルは、大人になってからの、人間関係や、恋愛のスタイルにも影響する、という研究があります。
        show:
          - { type: text, color: gray, text: "大人の人間関係・恋愛のスタイルにも影響する" }

  - board: whiteboard
    steps:
      - say: エリクソンの発達段階論は、人生を8つの段階に分け、それぞれの段階に、乗りこえるべき課題、心理社会的危機があるとしました。特に有名なのが、青年期の、アイデンティティ対、役割の混乱です。自分は何者か、という問いと向き合う時期です。
        show:
          - { type: title, text: エリクソンの発達段階 }
          - { type: text, color: yellow, text: "青年期：**アイデンティティ** 対 役割の混乱（自分は何者か）" }
      - say: 学童期、6歳から12歳ごろは、自分の得意、不得意を意識して、がんばることを学ぶ一方、できないことに、劣等感を覚えるようになります。成人前期、20歳から40歳ごろは、仕事や家庭での役割を担い、親密な人間関係を求めます。
        show:
          - { type: text, color: blue, text: "学童期（6〜12歳ごろ）：がんばることを学ぶ ⇔ 劣等感" }
          - { type: text, color: green, text: "成人前期（20〜40歳ごろ）：親密な関係を築く ⇔ 孤独" }
      - say: 壮年期、40歳から65歳ごろは、知識や技術を、次の世代に伝えていく時期です。老年期、65歳ごろからは、自分の人生をふり返り、受け入れることが、課題になります。
        show:
          - { type: text, color: pink, text: "壮年期（40〜65歳ごろ）：次の世代に伝える ⇔ 自分のことだけ" }
          - { type: text, color: gray, text: "老年期（65歳ごろ〜）：人生をふり返って受け入れる ⇔ 絶望" }
