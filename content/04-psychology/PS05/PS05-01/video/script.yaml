title: 自己概念と自尊心
scenes:
  - board: slide
    steps:
      - say: 第5章、「自己と人格」です。
        show:
          - { type: title, text: 第5章　自己と人格 }
      - say: 自分をどう見ているか。性格とは何か。性格はどうつくられるのか。そして、心を守るしくみを学びます。
        show:
          - type: list
            items: ["自己概念と自尊心", "人格理論", "発達と人格の形成", "防衛機制"]
      - say: 自分の性格や、自信のしくみを知ることは、自分をもう少し好きになる、手がかりになります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "自分の見方・性格・心を守るしくみを知る" }

  - board: whiteboard
    steps:
      - say: 自分とは何か、という問いへの答えが、自己概念です。わたしはやさしい、わたしは数学が得意、わたしは日本人だ、といった、自分についての信念の集まりです。
        show:
          - { type: title, text: 自己概念 }
          - { type: box, color: blue, w: 1100, text: "**自己概念** ＝ 自分についての信念の集まり（やさしい・数学が得意・日本人）" }
      - say: 自分にとって大事な分野の知識の枠組み、自己スキーマは強く、それに関係する情報は、すばやく処理され、記憶にも残りやすいのです。スポーツが大事な人は、スポーツの情報に、自然と目が向きますね。
        show:
          - { type: text, text: "**自己スキーマ**：大事な分野の情報は、目に入りやすく覚えやすい" }

  - board: whiteboard
    steps:
      - say: 自己効力感は、自分は、これをうまくやれる、という信念です。全体的な自己評価とはちがい、特定の分野や課題についての、具体的な自信です。自己効力感が高い人は、むずかしいことにも挑戦し、失敗しても、あきらめにくいことが知られています。
        show:
          - { type: title, text: 自己効力感と自尊心 }
          - { type: box, color: green, w: 1100, title: 自己効力感, text: "「これはうまくやれる」という具体的な自信 → 挑戦し、あきらめにくい" }
      - say: 一方、自尊心は、自分自身への、全体的な評価です。高すぎても問題があり、特に、批判にひどく傷つき、自分を守るために他人を下げる、防衛的な高い自尊心は、人間関係を悪くします。
        show:
          - { type: box, color: pink, w: 1100, title: 自尊心, text: "自分への全体的な評価。高すぎて防衛的だと、人間関係を悪くする" }
      - say: 研究では、自尊心が高いから成功する、というより、成功体験が、自尊心を高める、という関係のほうが強いとされています。小さな成功を、積み重ねることが、近道なのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "「自尊心 → 成功」より「成功体験 → 自尊心」。小さな成功を積み重ねる" }
