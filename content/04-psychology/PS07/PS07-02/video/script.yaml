title: 主要な精神疾患の概要
scenes:
  - board: whiteboard
    steps:
      - say: 「主な心の病気」です。双極性障害、いわゆる、そううつ病は、うつの状態と、そうの状態、つまり、異常に気分が高まり、衝動的な行動をとる状態を、くり返す病気です。そうのときは、本人は、絶好調だと感じるので、病気だと気づきにくいことがあります。
        show:
          - { type: title, text: 主な心の病気 }
          - { type: box, color: yellow, w: 1100, title: 双極性障害（そううつ病）, text: "うつ状態と、そう状態（異常な高まり・衝動的な行動）をくり返す。そうのときは気づきにくい" }
      - say: 統合失調症は、幻覚や、見張られているといった妄想、まとまらない考えなどを特徴とする病気で、およそ100人に1人がかかります。決して、めずらしい病気ではありません。
        show:
          - { type: box, color: blue, w: 1100, title: 統合失調症, text: "幻覚・妄想（見張られている）・まとまらない考え。約100人に1人" }
      - say: PTSD、心的外傷後ストレス障害は、とてもつらい体験のあと、フラッシュバックや、関係するものをさける行動、過剰な警戒などが、続く病気です。戦争、性暴力、事故、虐待などが原因になります。
        show:
          - { type: box, color: pink, w: 1100, title: PTSD（心的外傷後ストレス障害）, text: "つらい体験のあと、フラッシュバック・回避・過剰な警戒が続く" }

  - board: whiteboard
    steps:
      - say: 大切なのは、これらは、意志が弱いから起きるのではない、ということです。脳や神経に、生物学的な変化が起きているのです。
        show:
          - { type: title, text: 意志の弱さではない }
          - { type: box, color: yellow, w: 1100, text: "意志が弱いからではない。脳・神経に生物学的な変化が起きている" }
      - say: 体の病気と同じように、早く気づいて、専門家に相談し、治療を受けることが大切です。気になるときは、ためらわず、医療機関や相談窓口を頼りましょう。
        added: true
        show:
          - { type: text, color: green, text: "体の病気と同じ。早めに専門家に相談する" }
