title: 正常と異常の境界
scenes:
  - board: slide
    steps:
      - say: 第7章、「異常心理と精神医学の基礎」です。
        show:
          - { type: title, text: 第7章　異常心理と精神医学の基礎 }
      - say: 正常と異常の境目、主な心の病気、パーソナリティ障害、そして心理療法を学びます。
        show:
          - type: list
            items: ["正常と異常の境界", "主要な精神疾患の概要", "パーソナリティ障害", "心理療法の種類"]
      - say: 心の病気は、だれにでも起こりうるものです。正しい知識は、偏見をなくし、自分や身近な人を助ける力になります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "心の病気を正しく知り、偏見なく向き合えるようにする" }

  - board: whiteboard
    steps:
      - say: 正常と異常の境目は、どこにあるのでしょうか。心理学や精神医学では、ふつう、こんな基準で考えます。
        show:
          - { type: title, text: 異常の4つの基準 }
          - type: list
            items: ["① 統計的にめずらしい（大多数とちがう）", "② 苦しみ・生活への支障（本人が苦しむ）", "③ 社会の決まりから外れる", "④ 危険（自分や人を傷つけるおそれ）"]
      - say: でも、どの基準にも問題があります。統計的にめずらしい、なら、天才も異常になってしまいます。社会の決まりは、時代や文化で変わります。かつて、同性愛は、心の病気に分類されていました。
        show:
          - { type: box, at: [80, 400], w: 1100, color: pink, text: "問題：天才も「異常」？ 社会の決まりは時代で変わる（同性愛はかつて病気とされた）" }

  - board: whiteboard
    steps:
      - say: 今の精神医学では、アメリカ精神医学会の診断マニュアル、DSMなどで、病気ごとに決められた、症状が続く期間や、生活への支障の程度などの基準を満たすかどうかで、診断します。
        show:
          - { type: title, text: 診断マニュアルと課題 }
          - { type: box, color: blue, w: 1100, title: DSM（診断マニュアル）, text: "病気ごとに、症状の期間・生活への支障などの基準を決める → 診断がそろう" }
      - say: このマニュアルのおかげで、診断がそろい、研究や治療の、共通の土台ができました。
        show:
          - { type: text, color: green, text: "意義：診断のばらつきが減り、研究・治療の共通の土台ができた" }
      - say: 問題は、〇〇症、という診断がついたとたん、その人がラベルで見られるようになる、スティグマの効果や、ふつうの悩みまで、病気にしてしまう、医療化の傾向です。大切な人を亡くした悲しみまで、うつ病ではないか、と扱われると、ふつうの人生の経験が、病気にされてしまうおそれがあります。
        show:
          - { type: box, color: pink, w: 1100, title: 課題, text: "診断名がラベルになる（スティグマ）・ふつうの悩みまで病気にする（医療化）" }
