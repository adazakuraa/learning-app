title: パーソナリティ障害
scenes:
  - board: whiteboard
    steps:
      - say: 「パーソナリティ障害」です。その人の考え方や行動のパターンが、人間関係や感情の調節に、長く問題をもたらす状態です。まわりが困ることが多く、本人も、生きづらさをかかえています。
        show:
          - { type: title, text: パーソナリティ障害とは }
          - { type: box, color: yellow, w: 1100, text: "考え方・行動のパターンが、人間関係や感情に長く問題をもたらす。本人も生きづらい" }
      - say: 境界性パーソナリティ障害は、感情の不安定さ、見捨てられることへの強い恐怖、衝動的な行動、不安定な自己像が特徴です。子どものころの虐待や、ネグレクトとの関連が強いとされます。
        show:
          - { type: box, color: pink, w: 1100, title: 境界性, text: "感情が不安定・見捨てられる恐怖・衝動的。幼いころの虐待との関連" }
      - say: 自己愛性パーソナリティ障害は、自分を大きく見せる感覚や、他人を利用することが特徴です。表面の自信の裏に、もろい自尊心があり、批判に激しく反応します。
        show:
          - { type: box, color: blue, w: 1100, title: 自己愛性, text: "自分を大きく見せる・他人を利用。自信の裏にもろい自尊心" }

  - board: whiteboard
    steps:
      - say: 反社会性パーソナリティ障害は、他人の権利の無視、うそ、攻撃性、後悔のなさが特徴で、サイコパスと重なる部分があります。
        show:
          - { type: title, text: そのほかのタイプ }
          - { type: text, color: pink, text: "**反社会性**：他人の権利を無視・うそ・攻撃性・後悔しない" }
      - say: 回避性パーソナリティ障害は、批判や拒絶をおそれるあまり、人との関わりや、新しいことを、さけてしまうのが特徴です。依存性パーソナリティ障害は、自分で決められず、判断を他人にたよってしまいます。演技性パーソナリティ障害は、いつも注目されていないと気がすまず、感情の表現が大げさで、人の気を引くための、派手な言動が目立ちます。
        show:
          - { type: text, color: blue, text: "**回避性**：批判・拒絶をおそれ、人との関わりをさける" }
          - { type: text, color: green, text: "**依存性**：自分で決められず、他人にたよる" }
          - { type: text, color: yellow, text: "**演技性**：注目されたい。感情表現が大げさ" }
      - say: こうした特徴が少しあるだけで、すぐに障害と判断されるわけではありません。でも、人の性格を理解するうえで、役に立つ考え方です。
        show:
          - { type: box, color: gray, w: 1100, text: "特徴が少しあるだけで障害ではない。性格の理解に役立つ考え方" }
