title: 他者の存在が行動を変える
scenes:
  - board: slide
    steps:
      - say: 第6章、「社会と人間心理」です。
        show:
          - { type: title, text: 第6章　社会と人間心理 }
      - say: 人がまわりにいるだけで、行動はどう変わるのか。集団の圧力、ステレオタイプ、説得、そして好意のしくみを学びます。
        show:
          - type: list
            items: ["他者の存在が行動を変える", "同調と服従", "集団心理とステレオタイプ", "態度と説得・プロパガンダ", "対人関係と好意"]
      - say: ふつうの人が、なぜ集団の中で、思いもよらない行動をとるのか。歴史のできごとや、毎日の人間関係が、ちがって見えてきます。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "集団や他人が、私たちの行動をどう変えるかを知る" }

  - board: whiteboard
    steps:
      - say: 人間は、ほかの人がいるだけで、行動が変わります。
        show:
          - { type: title, text: 社会的促進と社会的抑制 }
      - say: 社会的促進は、ほかの人がいると、課題の成績が上がる現象です。自転車の選手は、ひとりで走るより、ペースを引っぱる人と走るほうが、速くなります。観客がいると、得意な技は、よりうまくできます。
        show:
          - { type: box, color: green, w: 1100, title: 社会的促進, text: "人がいると成績が上がる（得意なこと・慣れたこと）" }
      - say: 反対に、社会的抑制もあります。むずかしい課題や、慣れていない課題は、人がいると、成績が下がります。人前のスピーチで緊張するのも、そのひとつです。
        show:
          - { type: box, color: pink, w: 1100, title: 社会的抑制, text: "人がいると成績が下がる（むずかしいこと・慣れないこと。スピーチの緊張）" }

  - board: whiteboard
    steps:
      - say: 傍観者効果は、緊急事態で、まわりに人が多いほど、一人ひとりが助けに動かなくなる現象です。
        show:
          - { type: title, text: 傍観者効果 }
          - { type: box, color: yellow, w: 1100, text: "**傍観者効果**：まわりに人が多いほど、一人ひとりが助けなくなる" }
      - say: 1964年のニューヨークで、殺人事件が起きたとき、38人もの目撃者がいたのに、だれも通報しなかった、とされました。のちに、この話の細かい点には誤りがあるとわかりましたが、傍観者効果そのものは、実験でくり返し確かめられています。
        show:
          - { type: text, size: s, color: gray, text: "1964年ニューヨークの事件（細部には誤りがあったが、効果は実験で確認されている）" }
      - say: なぜ助けないのでしょうか。だれかが助けるだろう、自分が動く必要はない、という、責任の分散が起きるからです。
        show:
          - { type: text, color: pink, text: "原因：「だれかが助けるだろう」＝ **責任の分散**" }
      - say: この知識は、実際に役立ちます。助けを求めるときは、だれか助けて、ではなく、そこのあなた、救急車を呼んでください、と、具体的に一人を指名すると、助けてもらいやすくなります。
        show:
          - { type: box, color: green, w: 1100, text: "助けを求めるときは「そこのあなた、救急車を呼んで！」と一人を指名する" }
