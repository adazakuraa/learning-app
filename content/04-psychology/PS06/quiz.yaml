questions:
  - q: 緊急事態で周りに人が多いほど、一人ひとりが助けに入りにくくなる現象を何というでしょう？
    a: [傍観者効果]
  - q: 権威者に命じられると、普通の人でも他人に強い電気ショックを与え続けてしまうことを示した実験は、誰の服従実験でしょう？
    a: [ミルグラム]
  - q: 集団で議論すると、意見がもとの個人の意見より極端な方向に向かう現象を何というでしょう？
    a: [集団極化]
  - q: 何度も見たり会ったりするだけで、好感度が高まる効果を何というでしょう？
    a: [単純接触効果]
  - q: 何かをしてもらうと、お返しをしなければと感じる心理を何というでしょう？
    a: [返報性の原理, 返報性]
    show: 返報性の原理
