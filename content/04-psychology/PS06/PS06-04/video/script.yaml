title: 態度と説得・プロパガンダ
scenes:
  - board: whiteboard
    steps:
      - say: 「態度と説得」です。態度とは、ある対象への、好き、きらいといった、評価の傾向です。態度は、どうやって変わるのでしょうか。
        show:
          - { type: title, text: 認知的不協和 }
      - say: 人は、自分の態度や行動、信念の間に、矛盾があると、不快に感じ、それを解消しようとします。これを、認知的不協和といいます。
        show:
          - { type: box, color: yellow, w: 1100, text: "**認知的不協和**：態度・行動・信念の矛盾 → 不快 → 解消しようとする" }
      - say: たばこを吸う人が、たばこは有害だ、という情報にふれると、こんな方法で、不協和を解消します。たばこをやめる。たいして有害ではない、と考えを変える。自分は運動しているから大丈夫、と理屈をつける。
        show:
          - type: list
            items: ["① たばこをやめる", "②「たいして有害じゃない」と考えを変える", "③「運動しているから大丈夫」と理屈をつける"]
      - say: 本当は、ひとつ目が健康的ですが、人は、2つ目や3つ目を選びがちなのです。
        added: true
        show:
          - { type: text, color: gray, text: "人は②③を選びがち" }

  - board: whiteboard
    steps:
      - say: 説得のしくみを説明するモデルがあります。人が判断するとき、相手の主張をじっくり考えて評価する、中心ルートと、話し手の魅力や、専門家らしさ、まわりの反応といった、表面の手がかりで判断する、周辺ルートがあります。システム2と、システム1のようなものですね。
        show:
          - { type: title, text: 中心ルートと周辺ルート }
          - { type: box, color: blue, at: [80, 140], w: 540, title: 中心ルート, text: "主張の中身をじっくり考える（システム2）" }
          - { type: box, color: pink, at: [660, 140], w: 540, title: 周辺ルート, text: "話し手の魅力・肩書き・まわりの反応で判断（システム1）" }
      - say: 関心が高く、考える余裕があるときは、中心ルート。そうでないときは、周辺ルートが使われやすくなります。テレビCMに、人気タレントが出てくるのは、周辺ルートをねらっているのです。
        show:
          - { type: text, at: [80, 360], w: 1120, color: gray, text: "CMに人気タレント ＝ 周辺ルートをねらっている" }

  - board: whiteboard
    steps:
      - say: プロパガンダは、心理学の手法を使った、意図的な意見の操作です。感情への訴え、つまり、いかり、恐怖、ほこり。くり返し。権威の利用。単純化。そして、仲間意識の利用などが、使われます。
        show:
          - { type: title, text: プロパガンダ }
          - { type: box, color: pink, w: 1100, title: プロパガンダの手法, text: "感情（いかり・恐怖・ほこり）・くり返し・権威・単純化・仲間意識" }
      - say: メディアリテラシーの中心は、今、自分は、どの心のしくみを利用されているか、を意識することです。
        show:
          - { type: box, color: yellow, w: 1100, text: "「今、自分はどの心のしくみを利用されている？」と意識する" }
