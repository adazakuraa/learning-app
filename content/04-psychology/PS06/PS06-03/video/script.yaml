title: 集団心理とステレオタイプ
scenes:
  - board: whiteboard
    steps:
      - say: 「集団心理とステレオタイプ」です。人間は、自分が属する集団、内集団と、それ以外の外集団を区別し、内集団をひいきし、外集団を否定的に見る傾向があります。
        show:
          - { type: title, text: 内集団と外集団 }
          - { type: box, color: blue, w: 1100, text: "**内集団**（自分の集団）をひいきし、**外集団** を否定的に見る" }
      - say: タジフェルの実験では、絵の好みのような、まったく意味のない基準で、グループに分けただけで、人々は、自分のグループをひいきし始めました。わたしたち対あの人たち、という考え方は、きっかけがどんなにささいでも、自動的に生まれるのです。
        show:
          - { type: text, color: yellow, text: "意味のない基準で分けただけで、自分のグループをひいきし始める（タジフェル）" }
      - say: 運動会の、赤組と白組でも、すぐに熱くなりますよね。
        added: true
        show:
          - { type: text, color: gray, text: "運動会の赤組・白組でも熱くなる" }

  - board: whiteboard
    steps:
      - say: ステレオタイプは、ある集団についての、固定した、単純化された思いこみです。複雑な現実を、手短に処理するための、効率のよいしくみですが、一人ひとりのちがいを無視して、不当な偏見につながります。
        show:
          - { type: title, text: ステレオタイプと集団極化 }
          - { type: box, color: pink, w: 1100, title: ステレオタイプ, text: "集団への単純化された思いこみ。効率的だが、一人ひとりを無視し偏見につながる" }
      - say: 集団極化は、集団で話し合うと、意見が、元の一人ひとりの意見より、極端な方向に向かう現象です。少しリスクを好む集団は、話し合うと、より大きなリスクを好むようになり、慎重な集団は、より慎重になります。SNSの、エコーチェンバーとも関係しています。
        show:
          - { type: box, color: blue, w: 1100, title: 集団極化, text: "話し合うと、意見がより極端になる（SNSのエコーチェンバー）" }

  - board: whiteboard
    steps:
      - say: スケープゴートは、不満やいらだちを、本当の原因ではなく、弱い立場の人たちに向けてしまう心理です。
        show:
          - { type: title, text: スケープゴート }
          - { type: box, color: yellow, w: 1100, text: "**スケープゴート**：不満を、本当の原因ではなく弱い立場の人に向ける" }
      - say: 景気が悪いときに、移民や少数民族への攻撃が増えるのは、そのひとつの原因です。歴史上の多くの迫害にも、このしくみがはたらいていました。宗教で学んだ、ユダヤ人の迫害の歴史とも、つながりますね。
        show:
          - { type: text, color: gray, text: "不景気に移民・少数民族への攻撃が増える。歴史上の迫害にも（ユダヤ人の迫害）" }
