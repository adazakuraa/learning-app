title: 対人関係と好意
scenes:
  - board: whiteboard
    steps:
      - say: 「好意のしくみ」です。人は、どんな相手を好きになるのでしょうか。心理学の研究は、いくつかの要因を明らかにしています。
        show:
          - { type: title, text: 近さと類似性 }
      - say: ひとつ目は、近さです。物理的に近くにいる人ほど、好きになりやすい。同じ寮に住む、同じ職場にいる、いつもすれちがう。くり返し見るだけで、好感度が上がる、単純接触効果とも、関係しています。知らないものより、知っているもののほうが安全だ、という、進化的な理由が考えられています。
        show:
          - { type: box, color: green, w: 1100, title: ① 近さ（単純接触効果）, text: "近くにいる・くり返し会うだけで好きになりやすい" }
      - say: ふたつ目は、似ていることです。自分と似た価値観や背景を持つ人を、好きになりやすい。類は友を呼ぶ、は、心理学的に正しいのです。似た人は、自分の考えを支えてくれるので、心地よいのです。
        show:
          - { type: box, color: blue, w: 1100, title: ② 似ていること, text: "価値観・背景が似ている人を好きになりやすい（類は友を呼ぶ）" }

  - board: whiteboard
    steps:
      - say: みっつ目は、お返しの原理、返報性です。何かをしてもらうと、お返しをしなければ、という気持ちが生まれます。好意や、おくり物、自分の打ち明け話を受けると、相手にも、好意や、お返しや、打ち明け話を返したくなります。試食や無料サンプルは、これを利用した方法です。
        show:
          - { type: title, text: 返報性と見た目 }
          - { type: box, color: yellow, w: 1100, title: ③ 返報性（お返しの原理）, text: "してもらうと返したくなる（試食・無料サンプル）" }
      - say: よっつ目は、見た目です。見た目が魅力的な人は、性格や能力もよいと、評価されやすいのです。前に学んだ、ハロー効果ですね。採用、選挙、裁判の結果まで、見た目に影響されることが、研究で示されています。
        show:
          - { type: box, color: pink, w: 1100, title: ④ 見た目, text: "見た目がよいと性格・能力もよく見える（ハロー効果）。採用・選挙・裁判にも影響" }
