title: 犯罪者の心理と動機
scenes:
  - board: slide
    steps:
      - say: 第8章、「犯罪心理学」です。
        show:
          - { type: title, text: 第8章　犯罪心理学 }
      - say: 人はなぜ罪を犯すのか。そして、サイコパスとは何かを学びます。
        show:
          - type: list
            items: ["犯罪者の心理と動機", "サイコパスとダークトライアド"]
      - say: 犯罪を、ただ「悪い人がやること」で片づけず、その背景を知ることが、犯罪を減らす社会づくりや、身を守ることにつながります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "犯罪の背景を知り、減らす社会・身を守る知恵につなげる" }

  - board: whiteboard
    steps:
      - say: 犯罪は、なぜ起きるのでしょうか。原因はひとつではなく、生物学的、心理学的、社会的な要因が、重なり合っています。
        show:
          - { type: title, text: 3つの要因 }
      - say: 生物学的な要因としては、衝動をおさえる脳の前頭前野の活動が低いこと、退屈を感じやすく、刺激を求めやすいこと、遺伝の影響などが研究されています。ただし、素質がある、イコール、犯罪者になる、ではなく、環境との組み合わせが大切です。
        show:
          - { type: box, color: blue, w: 1100, title: 生物学的要因, text: "衝動をおさえる脳の働きが弱い・刺激を求めやすい・遺伝（ただし環境しだい）" }
      - say: 心理学的な要因としては、共感する力が低いこと、衝動をおさえにくいこと、不安定な愛着、自分は被害者だ、暴力は仕方ない、といった、考え方のゆがみなどがあります。
        show:
          - { type: box, color: green, w: 1100, title: 心理学的要因, text: "共感が低い・衝動をおさえにくい・不安定な愛着・考え方のゆがみ" }
      - say: そして、社会的な要因は、とても大きく、貧しさ、社会からの排除、暴力的な環境、悪い仲間とのつきあいが、リスクを高めます。アメリカの研究では、犯罪を最もよく予測するのは、その人の性格より、どの地域に住んでいるか、であることが示されています。
        show:
          - { type: box, color: pink, w: 1100, title: 社会的要因, text: "貧しさ・排除・暴力的な環境・悪い仲間。性格より「どこに住むか」が強い予測因子" }

  - board: whiteboard
    steps:
      - say: アメリカの社会学者マートンの緊張理論は、こう説明します。社会は、成功、つまりお金持ちになることを、みんなの目標として示しながら、そこにたどりつくための、正当な手段、教育や就職へのチャンスは、平等ではない。この矛盾が、犯罪を生む、というのです。
        show:
          - { type: title, text: マートンの緊張理論 }
          - type: svg
            w: 1000
            h: 200
            markup: |
              <rect x="680" y="20" width="280" height="70" rx="12" stroke="#f3d77a"/><text x="820" y="62" font-size="24" fill="#f3d77a" stroke="none" text-anchor="middle">成功（目標）</text>
              <path d="M60 170 L660 60" stroke="#9be0b0" stroke-width="3"/><path d="M60 180 L360 130" stroke="#9aa3ad" stroke-width="3"/><path d="M360 130 L380 160" stroke="#f4a3b8" stroke-dasharray="6 6"/>
              <g stroke="none" font-size="20"><text x="200" y="85" fill="#9be0b0">正当な手段（教育・就職）がある人</text><text x="120" y="200" fill="#f4a3b8">手段がない人 → 不正な道へ？</text></g>
      - say: 目標はあたえられているのに、手段があたえられていない人が、不正な手段をとってしまう。犯罪を減らすには、取りしまるだけでなく、正当な道を、みんなに開くことが大切だ、ということですね。
        show:
          - { type: box, color: yellow, w: 1000, text: "目標はあるのに手段がない → 不正な手段へ。正当な道をみんなに開くことが大切" }
