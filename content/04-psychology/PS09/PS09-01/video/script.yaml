title: 幸福についてのいくつかの研究
scenes:
  - board: slide
    steps:
      - say: 第9章、「幸福と人間の可能性」です。
        show:
          - { type: title, text: 第9章　幸福と人間の可能性 }
      - say: 幸せは、何で決まるのか。そして、つらいことから立ち直る力について学びます。
        show:
          - type: list
            items: ["幸福についてのいくつかの研究", "レジリエンスと成長"]
      - say: 心理学は、心の病気だけでなく、どうすればよりよく生きられるか、という問いにも、答えを出しつつあります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "研究からわかった、幸せと立ち直る力のヒントを知る" }

  - board: whiteboard
    steps:
      - say: お金と幸福。収入が上がると、幸福度も上がりますが、ある水準をこえると、その効果は小さくなります。年収7万5000ドルをこえると、日々の感情的な幸せは、ほぼ上がらなくなる、という研究がありましたが、のちの研究では、高収入でも幸福は上がり続ける、とも示されていて、議論があります。
        show:
          - { type: title, text: お金と人間関係 }
          - { type: box, color: yellow, w: 1100, title: お金, text: "収入が上がると幸福も上がる。でも、ある水準からは効果が小さくなる（議論あり）" }
      - say: 人間関係。幸福を最も強く予測するのは、よい人間関係です。ハーバード大学の、75年以上にわたる追跡研究では、よい人間関係が、健康と幸せに、最も強く結びついていました。反対に、孤独は、不幸の、最も強い予測因子のひとつです。
        show:
          - { type: box, color: green, w: 1100, title: 人間関係, text: "幸福の最強の予測因子。ハーバード大の75年以上の研究でも、よい人間関係が健康と幸せの鍵" }

  - board: whiteboard
    steps:
      - say: 快楽への慣れ。人間は、宝くじに当たる、昇進する、といったよいできごとにも、事故や失業といった悪いできごとにも、やがて慣れて、もとの幸福度にもどる傾向があります。これさえ手に入れば幸せになれる、という期待が外れるのは、このためです。
        show:
          - { type: title, text: 慣れと意味 }
          - { type: box, color: blue, w: 1100, title: 快楽への慣れ, text: "よいことにも悪いことにも慣れて、もとの幸福度にもどる" }
      - say: 意味と目的。快楽よりも、自分が何かの役に立ち、成長している、という感覚のほうが、長続きする幸福につながるとされています。
        show:
          - { type: box, color: pink, w: 1100, title: 意味と目的, text: "役に立っている・成長している感覚が、長続きする幸福につながる" }
