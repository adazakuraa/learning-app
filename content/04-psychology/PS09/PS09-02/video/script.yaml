title: レジリエンスと成長
scenes:
  - board: whiteboard
    steps:
      - say: 「レジリエンス」です。レジリエンスとは、困難やつらい体験に直面したとき、適応して、立ち直る力のことです。折れない心、というより、折れても、もどる心、と言ったほうが正確です。
        show:
          - { type: title, text: レジリエンス }
          - { type: box, color: yellow, w: 1100, text: "**レジリエンス** ＝「折れない心」より「折れても、もどる心」" }
          - type: svg
            w: 1000
            h: 160
            markup: |
              <path d="M40 60 H300 Q360 60 380 140 Q420 150 460 100 Q520 50 600 60 H960" stroke="#9be0b0" stroke-width="4"/>
              <g stroke="none" font-size="20"><text x="330" y="160" fill="#f4a3b8">落ちこむ</text><text x="620" y="45" fill="#9be0b0">もどる</text></g>

  - board: whiteboard
    steps:
      - say: レジリエンスを高める要因として、研究されているものがあります。
        show:
          - { type: title, text: レジリエンスを高めるもの }
      - say: こまったときに、たよれる人がいること。苦しいことに、意味を見いだせること。自分はできる、という自己効力感。気持ちを調節する力。そして、問題を解決する力です。
        show:
          - type: list
            items: ["たよれる人がいる（社会的サポート）", "苦しみに意味を見いだせる", "「自分はできる」という自己効力感", "気持ちを調節する力", "問題を解決する力"]
      - say: これらは、生まれつき決まっているものではなく、少しずつ育てることができます。この講座で学んだ、感情調節や、自己効力感の話が、ここでつながってきますね。
        added: true
        show:
          - { type: box, at: [700, 200], w: 500, color: green, text: "生まれつきではなく、育てられる" }
