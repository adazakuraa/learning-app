questions:
  - q: 「私はあなたよりも背が高い」。I am（　　）than you. （　　）に入る語は何でしょう？
    a: [taller]
  - q: 「英語より面白い」。（　　）interesting than English. 長い形容詞の比較級で（　　）に入る語は何でしょう？
    a: [more]
  - q: 「駅で」と言うとき、station の前に置く前置詞は何でしょう？（地点を表す）
    a: [at]
  - q: 「机の上に」と言うとき、the table の前に置く前置詞は何でしょう？（表面に接していることを表す）
    a: ['on']
