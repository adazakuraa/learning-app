title: 接続詞
scenes:
  - board: whiteboard
    steps:
      - say: 「接続詞」です。接続詞は、単語や、言葉のまとまり、文をつなぐ、andのような言葉のことです。
        read: 「接続詞」です。接続詞は、単語や、言葉のまとまり、文をつなぐ、アンドのような言葉のことです。
        show:
          - { type: title, text: よく使う接続詞 }
      - say: but、しかし。I wanted to go, but I was too tired. 行きたかったけれど、つかれすぎていた。or、または。Would you prefer tea or coffee? 紅茶とコーヒー、どちらがいいですか。so、だから。The window was open, so the room was cold. 窓が開いていたので、部屋が寒かった。because、なぜなら。I stayed home because I had a fever. 熱があったので、家にいた。
        read: バット、しかし。行きたかったけれど、つかれすぎていた。オア、または。紅茶とコーヒー、どちらがいいですか。ソー、だから。窓が開いていたので、部屋が寒かった。ビコーズ、なぜなら。熱があったので、家にいた。
        show:
          - { type: text, color: blue, text: "**but**（しかし）：I wanted to go, but I was too tired." }
          - { type: text, color: blue, text: "**or**（または）：Would you prefer tea or coffee?" }
          - { type: text, color: blue, text: "**so**（だから）：The window was open, so the room was cold." }
          - { type: text, color: blue, text: "**because**（なぜなら）：I stayed home because I had a fever." }

  - board: whiteboard
    steps:
      - say: when、〜のとき。if、もし〜なら。If you need help, just ask. 助けが必要なら、言ってね。although、〜だけれども。before、after、〜の前に、あとに。until、〜するまで。while、〜している間。
        read: ウェン、何々のとき。イフ、もし何々なら。イフ、ユー、ニード、ヘルプ、ジャスト、アスク。助けが必要なら、言ってね。オールゾウ、何々だけれども。ビフォー、アフター、何々の前に、あとに。アンティル、何々するまで。ホワイル、何々している間。
        show:
          - { type: title, text: 時・条件の接続詞 }
          - { type: text, color: green, text: "**when**（〜のとき）：When the alarm went off, I was still asleep." }
          - { type: text, color: green, text: "**if**（もし〜なら）：If you need help, just ask." }
          - { type: text, color: green, text: "**although**（〜だけれども）：Although it was raining, they went for a walk." }
          - { type: text, color: green, text: "**before / after**・**until**（〜まで）・**while**（〜の間）" }
      - say: 接続詞は、文と文の関係を示す、道しるべです。but が出たら、話が逆転する、soが出たら、結論が来る、と予想しながら読むと、長い文も、ぐっと読みやすくなります。
        read: 接続詞は、文と文の関係を示す、道しるべです。バットが出たら、話が逆転する、ソーが出たら、結論が来る、と予想しながら読むと、長い文も、ぐっと読みやすくなります。
        added: true
        show:
          - { type: box, color: yellow, w: 1100, text: "接続詞 ＝ 道しるべ。but → 逆転、so → 結論、と予想しながら読む" }
