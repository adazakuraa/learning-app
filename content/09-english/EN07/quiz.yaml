questions:
  - q: 「駅の近くに薬局がある」。There（　　）a pharmacy near the station. （　　）に入る語を答えてください。
    a: [is]
  - q: 「水分をとることは大切だ」。It is important（　　）stay hydrated. （　　）に入る語を答えてください。
    a: [to]
  - q: 動詞に -ing をつけて「〜すること」という名詞の働きをさせたものを何というでしょう？
    a: [動名詞]
  - q: 「雨だったので家にいた」。I stayed home（　　）it was raining. 理由を表す接続詞を答えてください。
    a: [because]
