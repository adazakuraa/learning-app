title: 母音と子音
scenes:
  - board: slide
    steps:
      - say: 英語の最初の章、「英語の基本」です。
        show:
          - { type: title, text: 第1章　英語の基本 }
      - say: 英語の音のしくみ、母音と子音、そして、よく使う発音のルールを学びます。
        show:
          - type: list
            items: ["母音と子音", "よく使う発音のルール"]
      - say: この講座の目標は、英語を見たり聞いたりしたときに、意味がとれるようになることです。なお、動画のナレーションはカタカナ読みなので、本当の発音は、辞書アプリなどの音声で確かめてください。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "英語の音のしくみを知り、知らない単語も読めるようにする" }
          - { type: text, size: s, color: gray, text: "※ナレーションはカタカナ読みです。本当の発音は辞書アプリの音声で確認しよう" }

  - board: whiteboard
    steps:
      - say: 英語の母音字は、a、e、i、o、uの、5文字です。それ以外の21文字が、子音字です。
        read: 英語の母音字は、エー、イー、アイ、オウ、ユーの、5文字です。それ以外の21文字が、子音字です。
        show:
          - { type: title, text: 母音と子音 }
          - { type: text, size: l, text: "母音字：**a e i o u**（5文字）　子音字：それ以外の21文字" }
      - say: 音節とは、単語を、リズムで区切ったまとまりのことです。1つの音節には、1つの母音が入ります。appleは、ap、pleの、2音節。umbrellaは、um、brel、laの、3音節です。
        read: 音節とは、単語を、リズムで区切ったまとまりのことです。1つの音節には、1つの母音が入ります。アップルは、アッ、プルの、2音節。アンブレラは、アン、ブレ、ラの、3音節です。
        show:
          - { type: text, color: blue, text: "**音節**：リズムで区切ったまとまり（1音節に母音1つ）" }
          - { type: text, size: l, color: green, text: "ap-ple（2音節）　um-brel-la（3音節）" }
      - say: 母音の読み方は、文字だけでは決まらず、まわりの文字との組み合わせで変わります。同じaでも、catはキャット、cakeはケイクと、まったくちがう音になります。
        read: 母音の読み方は、文字だけでは決まらず、まわりの文字との組み合わせで変わります。同じエーでも、キャットとケイクでは、まったくちがう音になります。
        show:
          - { type: text, color: yellow, text: "同じ a でも：cat（キャット）／ cake（ケイク）" }

  - board: whiteboard
    steps:
      - say: 子音の中で、特に注意が必要なのが、thと、vとfの音です。
        read: 子音の中で、特に注意が必要なのが、ティーエイチと、ブイとエフの音です。
        show:
          - { type: title, text: 注意したい子音 }
      - say: thは、舌を、軽く上下の歯ではさんで出す音です。vは、bとは別の音で、上の歯を、下くちびるに軽く当てて出します。fも同じように、上の歯を下くちびるに当てて、息だけを出します。
        read: ティーエイチは、舌を、軽く上下の歯ではさんで出す音です。ブイは、ビーとは別の音で、上の歯を、下くちびるに軽く当てて出します。エフも同じように、上の歯を下くちびるに当てて、息だけを出します。
        show:
          - { type: box, color: blue, w: 1100, title: th, text: "舌を軽く歯ではさむ（think, this）" }
          - { type: box, color: green, w: 1100, title: v / f, text: "上の歯を下くちびるに当てる（v は声を出す、f は息だけ）" }
      - say: vとbを区別しないと、very、とても、がberry、ベリーに聞こえてしまうこともあります。
        read: ブイとビーを区別しないと、とても、という意味のベリーが、果物のベリーに聞こえてしまうこともあります。
        added: true
        show:
          - { type: text, color: gray, text: "very（とても）と berry（ベリー）は別の音" }
