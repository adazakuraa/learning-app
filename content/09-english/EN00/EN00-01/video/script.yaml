title: 英語とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、英語がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 英語とは
      - say: 英語では、発音の基本、文の組み立て、時制、よく使う表現から、読解の基礎までを、中学〜高校の文法を中心に学び直します。
        read: 英語では、発音の基本、文の組み立て、時制、よく使う表現から、読解の基礎までを、中学から高校の文法を中心に学び直します。
        show:
          - type: box
            w: 1100
            text: 英語では、発音の基本、文の組み立て、時制、よく使う表現から、読解の基礎までを、中学〜高校の文法を中心に学び直します。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で11章です。第1章は英語の基本、第2章は基本の文構造、第3章は時制の基本、第4章は名詞・代名詞・冠詞、第5章は形容詞・副詞・前置詞、第6章は助動詞、第7章はよく使う文型と表現、第8章は受動態と比較表現、第9章は関係詞・間接疑問文、第10章は日常英語の語彙と表現、第11章は読解のための基礎。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　英語の基本
              - 第2章　基本の文構造
              - 第3章　時制の基本
              - 第4章　名詞・代名詞・冠詞
              - 第5章　形容詞・副詞・前置詞
              - 第6章　助動詞
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第7章　よく使う文型と表現
              - 第8章　受動態と比較表現
              - 第9章　関係詞・間接疑問文
              - 第10章　日常英語の語彙と表現
              - 第11章　読解のための基礎
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、英語を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、世界とつながれる。英語は、世界で最も多くの国で使われている言語です。旅行、仕事、ネットの情報など、使える場面が一気に広がります。
        show:
          - type: box
            w: 1100
            text: |-
              **世界とつながれる**
              英語は、世界で最も多くの国で使われている言語です。旅行、仕事、ネットの情報など、使える場面が一気に広がります。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、情報が増える。最新の情報や専門的な情報は、英語で書かれていることがとても多いです。読めれば、手に入る情報が何倍にもなります。
        show:
          - type: box
            w: 1100
            text: |-
              **情報が増える**
              最新の情報や専門的な情報は、英語で書かれていることがとても多いです。読めれば、手に入る情報が何倍にもなります。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、文法がわかると上達が速い。文の組み立てがわかると、単語をつなげるだけで言いたいことが言えるようになります。
        show:
          - type: box
            w: 1100
            text: |-
              **文法がわかると上達が速い**
              文の組み立てがわかると、単語をつなげるだけで言いたいことが言えるようになります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、海外旅行や、外国の人と話すとき、英語のニュースや説明書を読むとき、アプリや機械の英語の表示を理解するとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 海外旅行や、外国の人と話すとき
              - 英語のニュースや説明書を読むとき
              - アプリや機械の英語の表示を理解するとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、例文を声に出して読む。そして、1つの文法を覚えたら、自分の文を1つ作ってみる。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・例文を**声に出して**読む
              ・1つの文法を覚えたら、自分の文を1つ作ってみる
            color: pink
            at:
              - 80
              - 420
