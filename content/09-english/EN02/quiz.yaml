questions:
  - q: 「私は音楽が好きです」を英語にしてください。
    a: [I like music]
    show: I like music.
  - q: 英語の基本の語順は「主語＋（　　）＋目的語」。（　　）に入る言葉を答えてください。
    a: [動詞, V]
    show: 動詞（SVO）
  - q: 「彼は毎日学校へ歩いて行く」。He（　　）to school every day. （　　）に入る walk の正しい形を答えてください。
    a: [walks]
    explain: 主語が三人称・単数・現在なので s がつく（三単現のs）。
  - q: 「何歳ですか？」を英語で何というでしょう？How（　　）are you? （　　）に入る語を答えてください。
    a: [old]
