questions:
  - q: 炭素を含む化合物（糖やプラスチックなど）を何というでしょう？
    a: [有機物, 有機化合物]
    show: 有機物
  - q: お酒に含まれるアルコールの名前は何でしょう？
    a: [エタノール]
  - q: 二日酔いの主な原因となる物質は何でしょう？
    a: [アセトアルデヒド]
  - q: 石鹸のように、水になじむ部分と油になじむ部分の両方をもつ物質を何というでしょう？
    a: [界面活性剤]
  - q: 小さな分子（モノマー）がたくさんつながってできた巨大な分子を何というでしょう？
    a: [高分子, ポリマー, 高分子化合物]
    show: 高分子（ポリマー）
