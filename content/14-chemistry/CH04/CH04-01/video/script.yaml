title: エネルギーと化学反応
scenes:
  - board: slide
    steps:
      - say: ここから「なぜ反応は起きるのか」の章です。
        show:
          - { type: title, text: 第4章　なぜ反応は起きるのか }
      - say: この章では、化学反応が起きる理由を、エネルギー、乱雑さ、そして反応の速さという3つの見方から考えます。
        added: true
        show:
          - type: list
            items: ["エネルギーと化学反応", "エントロピーとは何か", "反応速度と触媒"]
      - say: 鉄はなぜ勝手にさびるのか。木はなぜ自然には燃えないのか。「なぜ」に答える、化学のいちばん深い話です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "「反応が起きる理由」を、エネルギーと乱雑さでイメージできるようになる" }

  - board: whiteboard
    steps:
      - say: 1本目は「エネルギーと化学反応」です。オクテット則の状態が安定なのは、それが、エネルギーがいちばん低い状態だからです。
        show:
          - { type: title, text: エネルギーの低い状態へ }
          - { type: text, text: "オクテット則の状態 ＝ エネルギーが低い ＝ **安定**" }
      - say: ボールが坂を転がって、いちばん低いところで止まるように、自然のものは、エネルギーの高い状態から、低い、つまり安定した状態へと、自然に変わっていきます。
        show:
          - type: svg
            w: 1000
            h: 260
            markup: |
              <path d="M40 60 Q300 60 500 200 T960 220" stroke="#9aa3ad"/>
              <circle cx="80" cy="40" r="20" stroke="#f3d77a"/><circle cx="700" cy="200" r="20" stroke="#8fc4ff"/>
              <path d="M120 40 Q350 70 660 190" stroke="#f3d77a" stroke-dasharray="8 8"/>
              <g stroke="none" font-size="24"><text x="40" y="110" fill="#f3d77a">エネルギー高い</text><text x="740" y="190" fill="#8fc4ff">低い（安定）</text></g>

  - board: whiteboard
    steps:
      - say: そうした変化のひとつが、化学反応です。化学反応では、必ずエネルギーの出入りがあります。
        show:
          - { type: title, text: 発熱反応 }
          - { type: text, text: "化学反応には、必ず **エネルギーの出入り** がある" }
      - say: 燃焼やカイロのような酸化で熱が出るのは、安定になって、いらなくなったエネルギーを、外に出しているからです。反応したあとのものは、元よりエネルギーが低い状態になっています。
        show:
          - { type: box, color: pink, w: 1000, title: 発熱反応, text: "安定になって余ったエネルギーを、熱として外へ出す（燃焼・カイロ）" }
      - say: 鉄を外に置いておくだけで、勝手にさびていくのは、さびたほうが、鉄にとって安定だからなのです。
        show:
          - { type: text, size: s, color: gray, text: "鉄が勝手にさびる ＝ さびたほうが安定だから" }

  - board: whiteboard
    steps:
      - say: 逆に、まわりからエネルギーをもらって進む変化もあります。これを、吸熱反応といいます。
        show:
          - { type: title, text: エネルギーを吸う変化 }
          - { type: box, color: blue, w: 1000, title: 吸熱, text: "まわりから熱をうばって進む（冷却パック）" }
      - say: たとえば、たたくと冷たくなる冷却パックは、中の硝酸アンモニウムが水にとけるときに、まわりから熱をうばいます。氷がとけて水になるときも、同じように熱を吸います。カチカチに固まった粒子のつながりを切るのに、エネルギーが必要だからです。
        show:
          - { type: text, text: "冷却パック（硝酸アンモニウムがとける）、氷がとける → 熱を吸う" }
          - { type: text, size: s, color: gray, text: "※ 氷がとけるのは化学反応ではなく状態変化だが、熱を吸う点は同じ" }

  - board: whiteboard
    steps:
      - say: 食べ物のカロリーも、化学反応で生まれるエネルギーです。糖質や脂質が、体の中で酸化、つまり、ゆっくり燃やされるときに出るエネルギーが、体を動かす源になっています。
        show:
          - { type: title, text: 食べ物のカロリー }
          - { type: box, color: yellow, w: 1000, text: "カロリー ＝ 糖質・脂質が体の中で酸化（ゆっくり燃焼）して出すエネルギー" }
