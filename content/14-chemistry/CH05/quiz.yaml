questions:
  - q: 水の沸点が予想よりずっと高い100℃になる理由である、水分子どうしの強い引力を何というでしょう？
    a: [水素結合]
  - q: 物質がそれ以上溶けきれない限界まで溶けた水溶液を何というでしょう？
    a: [飽和水溶液]
  - q: 水 90g に食塩 10g を溶かした。質量パーセント濃度は何%でしょう？
    a: ['10', 10%]
    show: 10%
    explain: 溶質10g ÷ 溶液（90＋10）g × 100 ＝ 10%。
  - q: 水に電気を流して、水素と酸素に分けるような変化を何というでしょう？
    a: [電気分解]
