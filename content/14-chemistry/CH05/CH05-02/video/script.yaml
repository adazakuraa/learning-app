title: 溶解と濃度
scenes:
  - board: whiteboard
    steps:
      - say: 「溶解と濃度」です。ものが液体にとける現象を、溶解といいます。
        show:
          - { type: title, text: 溶解と濃度 }
          - { type: text, size: l, text: "ものが液体にとける ＝ **溶解**" }
      - say: ただし、決まった量の液体にとける量には、限界があります。限界までとかした水溶液を、飽和水溶液といいます。いくら砂糖を入れても、底に残ってしまうのは、このためです。
        show:
          - { type: text, text: "とける量には限界がある → 限界までとかした液 ＝ **飽和水溶液**" }

  - board: whiteboard
    steps:
      - say: 温度が高いほど、水の分子の動きが激しくなるので、多くの固体をとかせます。熱いお茶のほうが、砂糖がよくとけますね。
        show:
          - { type: title, text: 温度ととけやすさ }
          - { type: text, color: pink, text: "固体：温度が高いほど、よくとける（熱いお茶に砂糖）" }
      - say: でも、気体は逆です。温度が高いと、気体が液体から飛び出そうとするので、とけにくくなります。コーラを温めると、気が抜けてしまうのは、このためです。
        show:
          - { type: text, color: blue, text: "気体：温度が高いほど、とけにくい（温めたコーラは気が抜ける）" }

  - board: whiteboard
    steps:
      - say: とけたものの割合、濃度の表し方で、いちばん基本的なのが、質量パーセント濃度です。とけているものの重さを、液全体の重さで割って、100をかけます。
        show:
          - { type: title, text: 質量パーセント濃度 }
          - { type: formula, size: l, color: yellow, tex: '\text{濃度（％）} = \frac{\text{とけているものの質量}}{\text{液全体の質量}} \times 100' }
      - say: 水100グラムに、食塩10グラムをとかしたとします。液全体は、110グラム。だから濃度は、10÷110×100で、およそ9.1パーセントです。
        show:
          - { type: formula, tex: '\frac{10}{100 + 10} \times 100 \approx 9.1\ \%' }
      - say: 液全体は、水だけの100グラムではなく、食塩も入れた110グラムで割ることに、注意しましょう。数学の練習問題で出てきた、お酒の濃度の問題と同じ考え方です。
        show:
          - { type: text, color: pink, size: s, text: "注意：割るのは「水」ではなく「液全体」（100g ではなく 110g）" }
