title: 金属の性質と利用
scenes:
  - board: slide
    steps:
      - say: ここから、化学の最後の章、「様々な元素の特徴」です。
        show:
          - { type: title, text: 第7章　様々な元素の特徴 }
      - say: この章では、身近な金属や気体の特徴と、化学の視点から見た環境問題を学びます。
        added: true
        show:
          - type: list
            items: ["金属の性質と利用", "気体の種類と性質", "化学と環境問題"]
      - say: 道具の材料選びから、地球温暖化まで。化学の知識を、社会の問題とつなげて考えていきましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "元素の特徴を知り、ものづくりや環境問題とつなげて考える" }

  - board: whiteboard
    steps:
      - say: 1本目は「金属の性質と利用」です。金属は、電気や熱を通す、光る、伸びる、広がる、という共通の性質を持っています。でも、元素によって、細かな性質は大きくちがいます。
        show:
          - { type: title, text: 金属の性質と利用 }
          - { type: text, text: "共通：電気・熱を通す、光沢、延性、展性　→ でも元素ごとに個性がある" }

  - board: whiteboard
    steps:
      - say: 鉄は、安くて丈夫なので、建物や機械に広く使われています。弱点は、さびやすいこと。鉄にクロムやニッケルを混ぜたステンレスは、さびにくくなっています。
        show:
          - { type: title, text: 主な金属 }
          - { type: box, color: gray, w: 1100, title: 鉄, text: "安くて丈夫（建物・機械）。さびやすい → ステンレスでさびにくく" }
      - say: 銅は、電気を通しやすさが、金属の中でもトップクラス。電線や電子回路に欠かせません。菌をおさえる力もあり、ドアノブなどに使われます。人類が最初に大量に使った金属のひとつでもあります。
        show:
          - { type: box, color: pink, w: 1100, title: 銅, text: "電気をよく通す（電線）。抗菌性（ドアノブ）。人類が古くから使う" }
      - say: アルミニウムは、軽くて加工しやすく、缶、飛行機、スマホの外側に使われます。表面にうすい酸化の膜を作るので、さびにくい性質もあります。
        show:
          - { type: box, color: blue, w: 1100, title: アルミニウム, text: "軽くて加工しやすい（缶・飛行機・スマホ）。表面の膜でさびにくい" }

  - board: whiteboard
    steps:
      - say: 合金は、いくつかの金属などをとかし合わせて、性質をよくしたものです。
        show:
          - { type: title, text: 合金 }
          - { type: text, size: l, text: "**合金** ＝ 金属どうしなどを混ぜて、性質をよくしたもの" }
      - say: 銅とスズの青銅、銅と亜鉛の黄銅、鉄とクロムとニッケルのステンレス、アルミと銅とマグネシウムのジュラルミンなどが代表です。10円玉は青銅、5円玉は黄銅でできています。
        show:
          - type: list
            items: ["青銅 ＝ 銅 ＋ スズ（10円玉）", "黄銅 ＝ 銅 ＋ 亜鉛（5円玉）", "ステンレス ＝ 鉄 ＋ クロム ＋ ニッケル", "ジュラルミン ＝ アルミ ＋ 銅 ＋ マグネシウム（飛行機）"]
