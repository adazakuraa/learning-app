title: 気体の種類と性質
scenes:
  - board: whiteboard
    steps:
      - say: 「気体の種類と性質」です。身近な気体の性質を整理しておきましょう。
        show:
          - { type: title, text: 気体の種類と性質 }
      - say: 酸素は、空気のおよそ21％。ものが燃えるのにも、呼吸にも必要です。
        show:
          - { type: box, color: pink, w: 1100, title: "酸素 O₂", text: "空気の約21％。燃焼・呼吸に必要" }
      - say: 窒素は、空気のおよそ78％。スナック菓子の袋には、中身の酸化を防ぐために、窒素がつめられています。マイナス196度の液体窒素は、冷凍保存に使われます。
        show:
          - { type: box, color: blue, w: 1100, title: "窒素 N₂", text: "空気の約78％。お菓子の袋（酸化防止）、液体窒素（−196℃）で冷凍保存" }

  - board: whiteboard
    steps:
      - say: 二酸化炭素は、水に少しとけて炭酸になります。植物の光合成の原料で、温室効果ガスでもあります。固体のドライアイスは、昇華して、そのまま気体になります。
        show:
          - { type: title, text: 二酸化炭素・水素・アンモニア }
          - { type: box, color: gray, w: 1100, title: "二酸化炭素 CO₂", text: "水にとけて炭酸。光合成の原料、温室効果ガス。ドライアイスは昇華" }
      - say: 水素は、いちばん軽い気体です。燃やすと水になるだけなので、排気がクリーンで、燃料電池の燃料として注目されています。ただし、とても燃えやすく、爆発の危険があるので、扱いには注意が必要です。
        show:
          - { type: box, color: yellow, w: 1100, title: "水素 H₂", text: "いちばん軽い。燃やすと水だけ（クリーン）。燃えやすく爆発に注意" }
      - say: アンモニアは、つんとくるにおいがあり、肥料や洗剤の原料です。体の中では、タンパク質が分解されるときにでき、肝臓で尿素に変えられて、体の外に出されます。
        show:
          - { type: box, color: green, w: 1100, title: "アンモニア NH₃", text: "刺激臭。肥料・洗剤の原料。体内では肝臓で尿素に変えて排出" }
