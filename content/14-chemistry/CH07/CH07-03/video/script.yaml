title: 化学と環境問題
scenes:
  - board: whiteboard
    steps:
      - say: 「化学と環境問題」です。今の環境問題の多くは、化学の視点で理解することができます。
        show:
          - { type: title, text: 化学と環境問題 }
      - say: 温室効果ガスとは、大気の中で赤外線を吸収して、地球の熱を宇宙に逃がしにくくする気体のことです。二酸化炭素、メタン、フロンなどがあります。
        show:
          - type: svg
            w: 1100
            h: 300
            markup: |
              <path d="M40 260 Q550 200 1060 260" stroke="#8fc4ff"/>
              <path d="M40 120 Q550 60 1060 120" stroke="#9aa3ad" stroke-dasharray="8 8"/>
              <circle cx="120" cy="40" r="30" stroke="#f3d77a"/>
              <path d="M150 60 L400 230" stroke="#f3d77a"/><path d="M420 230 L560 100" stroke="#f4a3b8"/><path d="M560 100 L700 220" stroke="#f4a3b8"/>
              <g stroke="none" font-size="22"><text x="600" y="60" fill="#9aa3ad">温室効果ガスの層</text><text x="720" y="210" fill="#f4a3b8">熱（赤外線）がもどされる</text><text x="440" y="290" fill="#8fc4ff">地球</text></g>
          - { type: text, text: "温室効果ガス：CO₂・メタン・フロン など" }
      - say: 産業革命のあと、石炭や石油などの化石燃料をたくさん燃やしたことで、二酸化炭素の濃度が上がり、地球温暖化が進んでいます。
        show:
          - { type: box, color: pink, w: 1000, text: "化石燃料を燃やす → CO₂ が増える → **地球温暖化**" }

  - board: whiteboard
    steps:
      - say: 酸性雨は、工場や自動車から出る、硫黄酸化物や窒素酸化物が、大気中の水と反応して、硫酸や硝酸になり、雨にとけこんで降る現象です。
        show:
          - { type: title, text: 酸性雨 }
          - { type: text, text: "硫黄酸化物（SOₓ）・窒素酸化物（NOₓ）＋ 水 → 硫酸・硝酸 → **酸性雨**" }
      - say: 第3章で学んだ、酸の話ですね。酸性雨は、森を枯らしたり、建物や銅像をとかしたりします。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "第3章「酸と塩基」とつながる。森を枯らす、銅像をとかす" }

  - board: whiteboard
    steps:
      - say: オゾン層の破壊は、フロンが空の高いところ、成層圏までのぼって、オゾンを分解してしまう現象です。オゾン層は、太陽からの有害な紫外線を吸収しています。こわれると、皮膚がんや、生き物への影響が心配されます。
        show:
          - { type: title, text: オゾン層 }
          - { type: text, text: "フロン → 成層圏でオゾン（O₃）を分解 → 有害な紫外線が届きやすくなる" }
      - say: 現在、オゾン層は、回復に向かっています。世界の国々が協力して、フロンを規制したからです。環境問題が、国際的な化学の規制によって改善に向かった、成功例として評価されています。
        show:
          - { type: box, color: green, w: 1000, text: "国際的なフロン規制 → オゾン層は回復傾向（成功例）" }
      - say: 化学は、環境問題を生む原因にもなりましたが、それを解決する力にもなります。原因を、原子や分子のレベルで正しく理解することが、その第一歩です。これで、化学の章はすべて終わりです。おつかれさまでした。
        added: true
        show:
          - { type: text, color: yellow, text: "化学は問題の原因にも、解決の力にもなる" }
