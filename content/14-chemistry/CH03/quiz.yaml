questions:
  - q: 物質が酸素と結びつくことを何というでしょう？
    a: [酸化]
  - q: 酸化物から酸素がうばわれることを何というでしょう？
    a: [還元]
  - q: 酸は、水に溶けると何イオンを出すでしょう？
    a: [水素イオン, H+]
    show: 水素イオン（H⁺）
  - q: 酸と塩基（アルカリ）が反応して、水ができる反応を何というでしょう？
    a: [中和, 中和反応]
    show: 中和（反応）
  - q: 金属どうしの結合で、電気や熱をよく通す性質のもとになる、自由に動き回る電子を何というでしょう？
    a: [自由電子]
