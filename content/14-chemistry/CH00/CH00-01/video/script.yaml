title: 化学とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、化学がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 化学とは
      - say: 化学では、物質が何からできていて、どのように変化するのかを、原子・分子のレベルから学びます。
        show:
          - type: box
            w: 1100
            text: 化学では、物質が何からできていて、どのように変化するのかを、原子・分子のレベルから学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で7章です。第1章は化学とは何か、第2章は原子・分子・元素、第3章は化学変化のしくみ、第4章はなぜ反応は起きるのか、第5章は水溶液と身近な化学、第6章は身近な物質の化学、第7章は様々な元素の特徴。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　化学とは何か
              - 第2章　原子・分子・元素
              - 第3章　化学変化のしくみ
              - 第4章　なぜ反応は起きるのか
              - 第5章　水溶液と身近な化学
              - 第6章　身近な物質の化学
              - 第7章　様々な元素の特徴
            at:
              - 80
              - 150
  - board: whiteboard
    steps:
      - say: では、化学を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、身近なものの正体がわかる。料理、洗剤、薬、プラスチック。身の回りのものは、すべて化学物質でできています。
        show:
          - type: box
            w: 1100
            text: |-
              **身近なものの正体がわかる**
              料理、洗剤、薬、プラスチック。身の回りのものは、すべて化学物質でできています。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、安全に暮らせる。「混ぜるな危険」の理由や、さびや燃焼の仕組みを知ると、家庭の事故を防げます。
        show:
          - type: box
            w: 1100
            text: |-
              **安全に暮らせる**
              「混ぜるな危険」の理由や、さびや燃焼の仕組みを知ると、家庭の事故を防げます。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、環境問題を理解できる。地球温暖化やプラスチックごみ、オゾン層。環境の問題は、化学の知識で理解が深まります。
        show:
          - type: box
            w: 1100
            text: |-
              **環境問題を理解できる**
              地球温暖化やプラスチックごみ、オゾン層。環境の問題は、化学の知識で理解が深まります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、洗剤や薬を正しく使うとき、料理の変化（焦げる・ふくらむ）を理解したいとき、環境やエネルギーのニュースを見るとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 洗剤や薬を正しく使うとき
              - 料理の変化（焦げる・ふくらむ）を理解したいとき
              - 環境やエネルギーのニュースを見るとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、化学式は、身近な物質から覚える。そして、「なぜ反応するのか」をイメージする。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・化学式は、**身近な物質から**覚える
              ・「なぜ反応するのか」をイメージする
            color: pink
            at:
              - 80
              - 420
