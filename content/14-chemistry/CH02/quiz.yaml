questions:
  - q: 原子のまわりを回っている、マイナスの電気をもつ粒子を何というでしょう？
    a: [電子]
  - q: 元素を性質ごとに整理した表を何というでしょう？
    a: [周期表]
  - q: 周期表の縦の列を何というでしょう？
    a: [族]
  - q: 二酸化炭素の化学式を答えてください。
    a: [CO2]
    show: CO₂
  - q: 水素 H₂ と酸素 O₂ から水ができる反応。2H₂ ＋ O₂ → （　　）H₂O。（　　）に入る数を答えてください。
    a: ['2']
    show: 2H₂ ＋ O₂ → 2H₂O
