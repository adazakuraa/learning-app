title: 動物の権利
scenes:
  - board: whiteboard
    steps:
      - say: 「動物の権利」です。これまでの倫理学は、人間だけを、道徳的な配慮の対象としてきました。でも、20世紀の後半から、人間以外の存在への、倫理的な義務が問われるようになりました。
        show:
          - { type: title, text: シンガーの主張 }
      - say: オーストラリアの哲学者シンガーは、苦痛を感じる力があれば、道徳的に配慮すべき存在だ、と論じました。
        show:
          - { type: box, color: yellow, w: 1100, text: "シンガー：苦痛を感じる力があれば、道徳的に配慮すべき存在" }
      - say: 人間が、動物の苦痛を軽く扱うことは、種差別、スペシーシズムであり、人種差別や性差別と、構造が同じだ、というのです。
        show:
          - { type: box, color: pink, w: 1100, text: "**種差別（スペシーシズム）**：動物の苦痛を軽く扱う ＝ 人種差別・性差別と同じ構造" }

  - board: whiteboard
    steps:
      - say: 動物は人間よりおとっているから、扱いがちがってよい、という反論があります。
        show:
          - { type: title, text: シンガーの問いかけ }
          - { type: text, color: gray, text: "反論：「動物は人間よりおとっているから、扱いがちがってよい」" }
      - say: これに対してシンガーは、人間の中にも、赤ちゃんや、重い障害のある人のように、知性や判断力が低い人がいる。その人たちの苦痛が、動物の苦痛より重要なのは、なぜか、と問いかけます。
        show:
          - { type: box, color: blue, w: 1100, text: "シンガー：知性が低い人もいる。その人たちの苦痛が動物より重要なのはなぜ？" }
      - say: シンガーの主張に、すべて賛成する必要はありません。でも、だれまでを、配慮の対象にするのか、という問いは、私たちの食事や、ペット、動物実験のあり方を、考え直すきっかけになります。これで、哲学はおしまいです。おつかれさまでした。
        added: true
        show:
          - { type: text, color: green, text: "「だれまでを配慮するか」→ 食事・ペット・動物実験を考え直すきっかけに" }
