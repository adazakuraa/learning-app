title: 人生に意味はあるか
scenes:
  - board: slide
    steps:
      - say: 第8章、「人生の意味と幸福」です。
        show:
          - { type: title, text: 第8章　人生の意味と幸福 }
      - say: 人生に意味はあるのか。幸福とは何か。死とどう向き合うか。そして、よく生きるとはどういうことかを考えます。
        show:
          - type: list
            items: ["人生に意味はあるか", "幸福とは何か", "死と有限性", "よく生きるとは"]
      - say: 哲学の、最も根本にある問いです。正解はありませんが、自分の生き方を考える、たくさんのヒントがあります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "自分の生き方を考えるヒントを手に入れる" }

  - board: whiteboard
    steps:
      - say: 人生に意味はあるか。この問いには、主に2つの立場があります。
        show:
          - { type: title, text: ニヒリズム }
      - say: ニヒリズムは、人生に、客観的な意味はない、という立場です。宇宙の大きさから見れば、人間の存在は、一瞬の点にすぎない。地球も太陽も、いずれ消えてしまい、私たちのすることは、すべて無に帰る。宇宙の目から見れば、何も重要ではない、という見方です。
        show:
          - { type: box, color: gray, w: 1100, text: "**ニヒリズム**：宇宙から見れば人間は一瞬の点。人生に客観的な意味はない" }

  - board: whiteboard
    steps:
      - say: 実存主義は、意味がない、というところから出発しながら、別の答えを出します。
        show:
          - { type: title, text: サルトルの実存主義 }
      - say: サルトルは、実存は本質に先立つ、と言いました。いすは、すわるため、という目的、つまり本質が先にあって、つくられます。でも人間は、まず存在して、そのあとで、自分の意味や価値を、自分でつくっていく存在だ、というのです。
        show:
          - type: svg
            w: 1100
            h: 180
            markup: |
              <rect x="20" y="30" width="200" height="60" rx="10" stroke="#9aa3ad"/><path d="M230 60 H320 M305 50 L320 60 L305 70" stroke="#9aa3ad"/><rect x="330" y="30" width="180" height="60" rx="10" stroke="#9aa3ad"/>
              <rect x="580" y="30" width="180" height="60" rx="10" stroke="#f3d77a"/><path d="M770 60 H860 M845 50 L860 60 L845 70" stroke="#9aa3ad"/><rect x="870" y="30" width="210" height="60" rx="10" stroke="#f3d77a"/>
              <g stroke="none" font-size="22" text-anchor="middle"><text x="120" y="68" fill="#9aa3ad">目的（本質）</text><text x="420" y="68" fill="#9aa3ad">いすができる</text><text x="670" y="68" fill="#f3d77a">まず存在</text><text x="975" y="68" fill="#f3d77a">意味を自分でつくる</text><text x="265" y="140" fill="#9aa3ad">いす</text><text x="830" y="140" fill="#f3d77a">人間</text></g>
      - say: 人生の意味は、どこかで見つけるものではなく、自分でつくるものだ、という立場です。
        show:
          - { type: box, color: yellow, w: 1100, text: "「**実存は本質に先立つ**」→ 人生の意味は、見つけるのではなく、つくるもの" }

  - board: whiteboard
    steps:
      - say: フランスの作家カミュは、不条理という考えを示しました。人間は意味を求めるのに、宇宙は何も答えてくれない。この不条理に向き合いながらも、生き続けること、反抗することが、人間の条件だ、としたのです。
        show:
          - { type: title, text: カミュの不条理 }
          - { type: box, color: blue, w: 1100, title: 不条理, text: "人間は意味を求める。でも宇宙は沈黙している" }
      - say: ギリシャ神話のシーシュポスは、重い岩を山頂までおし上げては、転がり落とされる、という罰を、永遠にくり返しています。カミュは、それでも、シーシュポスは幸福でなければならない、と言いました。意味のない運命の中でも、自分の手で岩をおし続ける、その姿に、生きる力を見たのです。
        show:
          - { type: box, color: pink, w: 1100, title: シーシュポスの神話, text: "岩をおし上げては落とされる罰を永遠に。「それでもシーシュポスは幸福でなければならない」" }
      - say: 意味は、外からあたえられるのではなく、自分が何に関わり、何に力を注ぐかで、つくられる。この見方は、自分の生き方を考えるうえで、役に立ちます。
        show:
          - { type: text, color: green, text: "意味は、自分が何に関わり、力を注ぐかでつくられる" }
