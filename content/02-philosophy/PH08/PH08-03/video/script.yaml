title: 死と有限性
scenes:
  - board: whiteboard
    steps:
      - say: 「死と有限性」です。死は、哲学がさけて通れないテーマです。プラトンは、哲学とは、死の練習だ、という言葉を残しているほどです。
        show:
          - { type: title, text: エピクロスの議論 }
          - { type: text, color: gray, text: "プラトン：「哲学とは死の練習だ」" }
      - say: 古代ギリシャのエピクロスは、死へのおそれをやわらげる、シンプルな議論を示しました。死は、私たちにとって、何ものでもない。なぜなら、私たちが存在するとき、死はなく、死があるとき、私たちは存在しないから。
        show:
          - { type: box, color: yellow, w: 1100, text: "「死は私たちにとって何ものでもない。私たちがいるとき死はなく、死があるとき私たちはいない」" }
      - say: 死んだあとの体験を、おそれる必要はない。なぜなら、それを体験する自分が、もういないからです。生まれる前の、何十億年を、私たちが苦しまなかったのと、同じだ、とも言われます。
        show:
          - { type: text, color: gray, text: "生まれる前の何十億年を苦しまなかったのと同じ" }

  - board: whiteboard
    steps:
      - say: 一方で、人生にかぎりがあるからこそ、時間が貴重になり、選ぶことに意味が生まれる、という見方もあります。いつまでも生きられるなら、今日やらなくても、明日やればいいことになりますね。
        added: true
        show:
          - { type: title, text: かぎりがあるから }
          - { type: box, color: green, w: 1100, text: "人生にかぎりがある → 時間が貴重になり、選ぶことに意味が生まれる" }
      - say: 死を考えることは、暗いことではなく、今をどう生きるかを、考えることにつながっているのです。
        added: true
        show:
          - { type: text, color: yellow, text: "死を考える ＝ 今をどう生きるかを考える" }
