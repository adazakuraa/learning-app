title: 幸福とは何か
scenes:
  - board: whiteboard
    steps:
      - say: 「幸福とは何か」。哲学者たちは、幸福を、3つのモデルで考えてきました。
        show:
          - { type: title, text: 快楽主義と経験機械 }
      - say: 快楽主義は、幸福とは、快楽を最大にし、苦痛を最小にすることだ、という立場です。功利主義も、ここに根ざしています。
        show:
          - { type: box, color: yellow, w: 1100, title: ① 快楽主義, text: "幸福 ＝ 快楽を最大に、苦痛を最小に" }
      - say: でも、経験機械という思考実験が、問題を示します。現実と区別できない、楽しい体験だけを、ずっと見せてくれる機械があったら、その中に入り続けますか。多くの人は、入らずに、本物の体験を選びます。快楽だけが大事なのではない、ということを示していますね。
        show:
          - { type: box, color: gray, w: 1100, title: 経験機械, text: "楽しい体験だけを見せる機械に一生入る？ → 多くの人は「本物」を選ぶ" }

  - board: whiteboard
    steps:
      - say: 欲求充足説は、自分の望みが満たされることが、幸福だ、という立場です。でも、本当の望みと、まちがった望みを、どう区別するかが問題です。たばこをやめられない人が、たばこを吸いたい、という望みを満たしても、それは幸福でしょうか。
        show:
          - { type: title, text: 欲求充足説と客観的リスト説 }
          - { type: box, color: blue, w: 1100, title: ② 欲求充足説, text: "幸福 ＝ 望みが満たされること。でも「まちがった望み」は？（たばこをやめられない人）" }
      - say: 客観的リスト説は、健康や、知識、人間関係、自分で決められること、など、それ自体が、幸福に役立つものがある、という立場です。本人が望んでいなくても、それを手に入れることが、幸福を増やすと考えます。
        show:
          - { type: box, color: green, w: 1100, title: ③ 客観的リスト説, text: "健康・知識・人間関係・自律など、それ自体が幸福をつくるものがある" }

  - board: whiteboard
    steps:
      - say: 今の幸福の研究は、これらを組み合わせて、人間関係の質、自分で決められること、目的意識、前向きな感情、達成感が、幸福につながることを示しています。
        show:
          - { type: title, text: 今の幸福研究 }
          - type: list
            items: ["人間関係の質", "自分で決められること（自律）", "目的意識", "前向きな感情", "達成感"]
      - say: 何が自分を幸せにするのか。直感だけにたよると、まちがえやすいのです。こうした分析を、自分の生活を見直す、手がかりにしてみてください。
        show:
          - { type: box, at: [660, 200], w: 540, color: yellow, text: "直感だけにたよらず、分析を手がかりに生活を見直す" }
