title: 他者を理解することはできるか
scenes:
  - board: slide
    steps:
      - say: 第6章、「他者と承認」です。
        show:
          - { type: title, text: 第6章　他者と承認 }
      - say: 他人を理解することはできるのか。人はなぜ、認められたいのか。そして、ケアの倫理を学びます。
        show:
          - type: list
            items: ["他者を理解することはできるか", "承認と尊厳", "ケアの倫理"]
      - say: 家族、友人、職場。人との関係の悩みを、少し引いた目で見られるようになる章です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "人と人との関係を、哲学の目で見つめ直す" }

  - board: whiteboard
    steps:
      - say: 他人の内側の体験を、直接知ることは、原理的に不可能です。これを、他我問題といいます。
        show:
          - { type: title, text: 他我問題 }
          - { type: box, color: yellow, w: 1100, text: "**他我問題**：他人の内側の体験は、原理的に直接知ることができない" }
      - say: わたしが痛いと感じるとき、その体験は、わたしだけが直接知っています。他人が「痛い」と言い、痛そうな顔をしても、その人が、本当にわたしと同じような感覚を持っているかを、確かめる方法はありません。
        show:
          - { type: text, text: "「痛い」という言葉や表情はわかる。でも、その「感じ」は確かめられない" }
      - say: 理屈の上では、ほかの人はみな、前の章で学んだ、内側のない哲学的ゾンビかもしれない、という可能性を、完全には消せないのです。
        show:
          - { type: text, size: s, color: gray, text: "理屈の上では、他人が哲学的ゾンビである可能性を完全には消せない" }

  - board: whiteboard
    steps:
      - say: 共感の限界も、大事なポイントです。
        show:
          - { type: title, text: 共感の限界 }
      - say: 共感は、相手の立場に立って、理解を深める力です。でも実際には、自分が同じ立場だったら、どう感じるか、を想像していることが多く、相手の本当の体験とは、ちがうことがあります。「気持ち、わかるよ」という言葉が、相手には、わかっていないと感じられるのは、よくあることです。
        show:
          - { type: box, color: pink, w: 1100, text: "共感 ≒「自分だったらどう感じるか」の想像 → 相手の本当の体験とはちがうことも" }
      - say: この限界を知ることは、わかったつもりに、気をつけることにつながります。他人を理解するとは、たどりつくゴールではなく、ずっと続けていく、過程なのです。
        show:
          - { type: box, color: green, w: 1100, text: "他者理解はゴールではなく、ずっと続ける過程。「わかったつもり」に気をつける" }
