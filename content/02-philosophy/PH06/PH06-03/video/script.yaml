title: ケアの倫理
scenes:
  - board: whiteboard
    steps:
      - say: 「ケアの倫理」です。心理学者ギリガンが提唱し、その後、フェミニズムの哲学で発展した、倫理の理論です。
        show:
          - { type: title, text: ギリガンの問題提起 }
      - say: ギリガンの出発点は、批判でした。コールバーグという心理学者の、道徳の発達の理論は、正義や権利、原則にもとづく判断を、道徳的に成熟したものとしていました。ギリガンは、この理論は、男性を基準につくられていて、女性の道徳的な考え方を、未発達と評価してしまっている、と批判したのです。
        show:
          - { type: box, color: blue, w: 1100, title: コールバーグの理論, text: "正義・権利・原則にもとづく判断 ＝ 道徳的に成熟" }
          - { type: box, color: pink, w: 1100, title: ギリガンの批判, text: "男性が基準。「関係・ケア」を重んじる考え方を「未発達」としている" }
      - say: 関係や、ケア、つまり世話や気づかいを大切にする道徳の視点は、おとったものではなく、もうひとつの、大切な道徳の価値観だ、というのです。
        show:
          - { type: text, color: green, text: "「関係・ケア」の視点は、おとったものではなく、もうひとつの大切な道徳" }

  - board: whiteboard
    steps:
      - say: ケアの倫理の特徴は、3つあります。
        show:
          - { type: title, text: ケアの倫理の特徴 }
      - say: 抽象的な原則より、具体的な関係と、その場の状況を重視すること。公正や権利より、ケアや、つながりを中心におくこと。そして、人を、孤立した一人ではなく、関係の中にいる存在として見ることです。
        show:
          - type: list
            items: ["抽象的な原則より、具体的な関係と状況", "公正・権利より、ケア・つながり", "人を、関係の中にいる存在として見る"]

  - board: whiteboard
    steps:
      - say: 例えば、重い病気の親の世話をするとき、功利主義なら、みんなの幸福が最大になるから、と説明するでしょう。でもケアの倫理では、この人が大切だから、という関係そのものが、道徳の根拠になります。
        show:
          - { type: title, text: 「この人が大切だから」 }
          - { type: text, color: blue, text: "功利主義：「幸福が最大になるから」世話をする" }
          - { type: text, color: green, text: "ケアの倫理：「この人が大切だから」世話をする" }
      - say: ケアの倫理は、みんなに公平に、という正義の倫理と、必ずしも対立するわけではありません。でも、道徳の、もうひとつの大事な面を、照らし出します。正しいことだけでなく、よい関係、という視点も、倫理の大切な次元なのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "「正しいこと」だけでなく「よい関係」も、倫理の大切な次元" }
