title: 功利主義
scenes:
  - board: slide
    steps:
      - say: 第4章、「倫理学の基本」です。
        show:
          - { type: title, text: 第4章　倫理学の基本 }
      - say: 何が正しい行いかを考える、2つの大きな理論、功利主義と義務論。そして、それがぶつかる、倫理的なジレンマを学びます。
        show:
          - type: list
            items: ["功利主義", "義務論", "倫理的ジレンマ"]
      - say: 「結果がよければいいのか」「ルールは絶対に守るべきか」。仕事でも家庭でも出会う、この迷いを整理する道具になります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "「結果」と「ルール」、2つの物差しで正しさを考える" }

  - board: whiteboard
    steps:
      - say: 功利主義は、ベンサムとミルがまとめた倫理の理論です。行為のよしあしは、結果で決まる。正しい行為とは、最大多数の最大幸福をもたらす行為だ、と考えます。
        show:
          - { type: title, text: 功利主義 }
          - { type: box, color: yellow, w: 1100, text: "**功利主義**：正しい行為 ＝「**最大多数の最大幸福**」をもたらす行為（結果で決まる）" }
      - say: わかりやすく、政策を決めるときにも、自然に使われる考え方です。この政策で、何人が幸せになり、何人が不幸になるか、という問いかけは、功利主義的な考え方です。
        show:
          - { type: text, text: "例：「この政策で、何人が幸せになり、何人が不幸になるか」" }
      - say: 功利主義には、2つの種類があります。ベンサムの量的功利主義は、幸福の量を重視します。ミルの質的功利主義は、幸福の質を重視し、食べたり眠ったりする快楽より、精神的な快楽のほうが、価値が大きいと考えました。「満足したブタより、不満足なソクラテスであるほうがよい」という言葉が有名です。
        show:
          - { type: box, color: blue, at: [80, 380], w: 540, title: 量的功利主義（ベンサム）, text: "幸福の「量」を重視" }
          - { type: box, color: green, at: [660, 380], w: 540, title: 質的功利主義（ミル）, text: "幸福の「質」を重視。「満足したブタより、不満足なソクラテス」" }

  - board: whiteboard
    steps:
      - say: でも、功利主義には、深刻な問題もあります。
        show:
          - { type: title, text: 功利主義の問題点 }
      - say: 1人を犠牲にすれば、5人を救える状況なら、1人を犠牲にすべきでしょうか。功利主義は、5人の幸福が、1人の幸福を上回る、と言いそうです。でも、多くの人は、これを道徳的に許せない、と感じます。
        show:
          - { type: box, color: pink, w: 1100, title: ① 少数の犠牲, text: "1人を犠牲にして5人を救うのは正しい？" }
      - say: また、幸福をどう計算するのか、という問題もあります。社会全体の幸福が増えるから、と、少数の人たちの権利を制限することを、正当化できてしまう危険があります。
        show:
          - { type: box, color: yellow, w: 1100, title: ② 少数者の権利, text: "「全体の幸福のため」と、少数者の権利を制限できてしまう" }
      - say: そして、分け方の問題です。幸福の合計が同じなら、一部の人に、幸福が集中していてもよいのでしょうか。
        show:
          - { type: box, color: blue, w: 1100, title: ③ 分け方, text: "合計が同じなら、一部の人に集中していてもよい？" }
      - say: 功利主義は、結果を考える、という大事な視点をくれますが、それだけが正しい倫理ではないのです。
        show:
          - { type: text, color: green, text: "結果を考える大事な視点。でも唯一の正しい倫理ではない" }
