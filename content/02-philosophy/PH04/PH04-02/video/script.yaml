title: 義務論
scenes:
  - board: whiteboard
    steps:
      - say: 「義務論」です。ドイツの哲学者カントは、功利主義とは、まったくちがう倫理の土台を考えました。カントにとって、行為のよしあしは、結果ではなく、動機、つまり、義務に従っているかどうかで決まります。
        show:
          - { type: title, text: 定言命法 }
          - { type: box, color: blue, w: 1100, text: "カント：行為のよしあしは、結果ではなく **動機**（義務に従っているか）で決まる" }
      - say: 中心となる考えが、定言命法です。「うそをつくな」のような、条件のない命令のことです。「健康になりたければ、運動しろ」のような、条件つきの命令は、目的がなければ、従う必要はありません。カントは、理由や目的を問わない道徳の命令に従うことこそ、正しいと考えました。
        show:
          - { type: text, color: gray, text: "条件つき：「健康になりたければ運動しろ」→ 目的がなければ従わなくてよい" }
          - { type: text, color: yellow, text: "**定言命法**：「うそをつくな」→ 条件なしに従うべき道徳の命令" }

  - board: whiteboard
    steps:
      - say: なぜ従うべきなのか。カントは、もし全員が同じことをしたら、どうなるか、を考えます。
        show:
          - { type: title, text: もし全員がしたら？ }
      - say: 都合の悪いときは、うそをついてよい、というルールを、全員が採用したら、どうなるでしょう。だれの言葉も信じられなくなり、言葉で気持ちを伝え合う、という習慣そのものが、くずれてしまいます。だから、うそは許されない、とカントは言います。
        show:
          - { type: box, color: pink, w: 1100, text: "全員が「都合が悪ければうそをつく」→ だれの言葉も信じられない → 言葉のやりとりが成り立たない" }
      - say: カントのもうひとつの教えが、人を、いつも目的として扱い、単なる道具として扱ってはならない、です。人間には尊厳があり、自分の得のために、人を利用してはならないのです。
        show:
          - { type: box, color: green, w: 1100, text: "人を **目的** として扱い、単なる **道具** として扱ってはならない（人間の尊厳）" }
      - say: カントの倫理は、権利や尊厳、義務という考えに、しっかりした根拠をあたえました。ただ、殺人犯から友人をかくまうためでも、うそは許されない、という、直感に反する結論になることもあります。
        show:
          - { type: text, color: gray, text: "問題点：友人を殺人犯から守るためのうそも許されない？" }

  - board: whiteboard
    steps:
      - say: カントは、ものの見え方、認識についても、大きな影響をあたえました。
        show:
          - { type: title, text: コペルニクス的転回 }
      - say: ふつう私たちは、リンゴがあるから、リンゴが見える、と考えます。でもカントは、私たちは、世界をそのまま見ているのではなく、心の中にある、メガネのようなフィルターを通して見ている、と考えました。そのフィルターを通した結果、目の前のものを、リンゴとしてとらえるのです。
        show:
          - type: svg
            w: 1100
            h: 180
            markup: |
              <circle cx="120" cy="90" r="60" stroke="#9aa3ad" stroke-dasharray="6 6"/>
              <path d="M200 90 H380" stroke="#9aa3ad"/>
              <g stroke="#f3d77a" stroke-width="4"><circle cx="460" cy="90" r="45"/><circle cx="600" cy="90" r="45"/><path d="M505 90 H555"/></g>
              <path d="M660 90 H840" stroke="#9aa3ad"/>
              <circle cx="930" cy="95" r="50" stroke="#f4a3b8"/><path d="M930 45 Q940 25 955 20" stroke="#9be0b0"/>
              <g stroke="none" font-size="20" text-anchor="middle"><text x="120" y="175" fill="#9aa3ad">物そのもの（物自体）</text><text x="530" y="175" fill="#f3d77a">心のメガネ（認識の形式）</text><text x="930" y="175" fill="#f4a3b8">「リンゴ」として見える</text></g>
      - say: 認識が対象に従うのではなく、私たちに見える世界のほうが、私たちの認識のしかたに従う。この逆転の発想を、コペルニクス的転回といいます。なお、カントは、物そのものがない、と言ったわけではありません。物そのもの、物自体は、私たちには、直接知ることができない、と考えたのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "**コペルニクス的転回**：見える世界のほうが、私たちの認識のしかたに従う（物自体は直接知れない）" }
