questions:
  - q: ベンサムとミルが体系化した、「行為の善悪は結果（幸福の量）で決まる」とする倫理理論を何というか。
    a: [功利主義]
  - q: 「最大多数の最大幸福」を唱えたのはベンサムだが、「満足した豚より不満足な人間のほうがよい」と、幸福の質を重視したのは誰か。
    a: [ミル, ジョン・スチュアート・ミル, jsミル]
    show: ミル
  - q: カントが説いた、「嘘をつくな」のような無条件の道徳的命令を何というか。
    a: [定言命法]
    r: [ていげんめいれい]
  - q: 暴走するトロッコの進路を変えて5人を救うか、1人を犠牲にするかを問う思考実験を何というか。
    a: [トロッコ問題]
