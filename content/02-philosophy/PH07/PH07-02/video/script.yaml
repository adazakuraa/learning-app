title: 自由とは何か
scenes:
  - board: whiteboard
    steps:
      - say: 「自由とは何か」です。哲学では、自由には2種類あると考えます。消極的自由と、積極的自由です。
        show:
          - { type: title, text: 2つの自由 }
      - say: 消極的自由は、ほかの人や、政府からの、じゃまや制約がない、という自由です。だれにもじゃまされずに、やりたいことができる、という感覚ですね。
        show:
          - { type: box, color: blue, w: 1100, title: 消極的自由（〜からの自由）, text: "他人や政府からじゃまされない自由" }
      - say: 積極的自由は、自分の人生の、本当の主人として生きる自由です。ただ制約がないだけでなく、実際に自分の力を発揮して、意味のある選択ができることです。
        show:
          - { type: box, color: green, w: 1100, title: 積極的自由（〜への自由）, text: "自分の人生の主人として、力を発揮し、意味ある選択ができる自由" }

  - board: whiteboard
    steps:
      - say: 例えば、だれからもじゃまされていなくても、貧しかったり、学ぶ機会がなかったりして、選べる道がほとんどない人は、本当に自由でしょうか。積極的自由の考え方では、それだけでは、本当の自由とはいえません。
        show:
          - { type: title, text: じゃまがないだけで自由？ }
          - { type: text, text: "じゃまはない。でも貧しさや学ぶ機会のなさで、選べる道がない → 本当に自由？" }
      - say: どこへ行ってもいいよ、と言われても、足をけがしていたら、どこへも行けませんね。積極的自由を得るには、貧しさや、学ぶ機会のなさ、だれかへの依存から、ぬけ出す必要があるのです。
        show:
          - { type: text, color: gray, text: "「どこへ行ってもいい」と言われても、足をけがしていたら行けない" }

  - board: whiteboard
    steps:
      - say: この区別で、今の政治の議論の多くが、整理できます。
        show:
          - { type: title, text: 政治の議論を整理する }
      - say: 規制をゆるめれば、自由になる、という考えは、消極的自由の立場です。一方、教育や医療、社会保障を充実させることで、本当の自由が実現する、という考えは、積極的自由の立場です。どちらが本当の自由か、という論争は、この2つの自由の考え方の対立なのです。
        show:
          - { type: box, color: blue, w: 1100, title: 消極的自由の立場, text: "規制をゆるめる・政府は小さく → 自由になる" }
          - { type: box, color: green, w: 1100, title: 積極的自由の立場, text: "教育・医療・社会保障を充実 → 本当の自由が実現" }
