title: 正義とは何か
scenes:
  - board: slide
    steps:
      - say: 第7章、「正義と自由」です。
        show:
          - { type: title, text: 第7章　正義と自由 }
      - say: 公正な社会とは何か。自由とは何か。そして、成功は本当に自分の手がらなのか、を考えます。
        show:
          - type: list
            items: ["正義とは何か", "自由とは何か", "功績と運"]
      - say: 税金や福祉、格差の問題。ニュースで見る政治の議論の、根っこにある考え方がわかるようになります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "政治の議論の根っこにある「正義」「自由」の考え方を知る" }

  - board: whiteboard
    steps:
      - say: 正義とは何か。現代で、最も影響力のある理論が、アメリカの哲学者ロールズの、正義論です。
        show:
          - { type: title, text: 無知のヴェール }
      - say: ロールズは、無知のヴェールという思考実験を考えました。社会のルールを決めるとき、自分がその社会で、どんな立場になるかを知らない状態で、考えてみるのです。性別も、人種も、才能も、生まれる家庭も、時代も、選べない状態です。
        show:
          - type: svg
            w: 1100
            h: 200
            markup: |
              <path d="M60 30 Q300 0 540 30 L540 170 Q300 140 60 170 Z" stroke="#9aa3ad" stroke-dasharray="8 6"/>
              <g stroke="none" font-size="22" fill="#9aa3ad"><text x="100" y="80">性別？ 才能？ 家庭？</text><text x="100" y="120">お金持ち？ 貧しい？</text></g>
              <path d="M570 100 H700 M685 88 L700 100 L685 112" stroke="#9aa3ad"/>
              <rect x="720" y="50" width="350" height="100" rx="14" stroke="#f3d77a"/>
              <g stroke="none" font-size="22" text-anchor="middle" fill="#f3d77a"><text x="895" y="95">どんなルールを</text><text x="895" y="128">選ぶ？</text></g>
      - say: ロールズは、この状態なら、人々は、最も不利な立場の人を、最大限守るような制度を選ぶだろう、と論じました。自分が、いちばん恵まれない立場に生まれるかもしれないなら、そういう人を守るしくみを、作りたいはずだからです。
        show:
          - { type: box, color: yellow, w: 1100, text: "自分がどこに生まれるかわからない → 最も不利な人を守る制度を選ぶはず" }
      - say: ケーキを切り分けるとき、切る人が最後に選ぶ、というルールにすると、公平に切ろうとしますよね。それと似た考え方です。
        added: true
        show:
          - { type: text, color: gray, text: "ケーキを切る人が最後に取る → 公平に切ろうとする、のと似ている" }

  - board: whiteboard
    steps:
      - say: ロールズの理論は、福祉国家や、格差を正す政策の、哲学的な根拠として使われています。
        show:
          - { type: title, text: ロールズとノージック }
          - { type: box, color: blue, w: 1100, title: ロールズ, text: "最も不利な人を守る → 福祉・格差是正の根拠" }
      - say: でも、自由を最も重視する、リバタリアンのノージックは、才能ある人がかせいだお金を、税金で分け直すのは、強制労働と変わらない、と批判しました。自分の努力や才能でえたものを、自分で使う自由と、どうバランスをとるかが、問われます。
        show:
          - { type: box, color: pink, w: 1100, title: ノージック（リバタリアン）, text: "かせいだお金の分け直しは、強制労働と変わらない" }
      - say: どちらが正しい、という答えはありません。でも、自分が、どちらの価値を重視するのかを、自覚することが、政治について判断する、土台になります。
        show:
          - { type: text, color: green, text: "自分がどちらの価値を重視するかを自覚する → 政治的判断の土台" }
