title: 功績と運
scenes:
  - board: whiteboard
    steps:
      - say: 「功績と運」です。アメリカの哲学者サンデルは、著書、『実力も運のうち』で、今の能力主義、メリトクラシーを批判しました。
        show:
          - { type: title, text: メリトクラシー }
      - say: 能力主義の前提には、成功は、本人の努力と才能の結果だから、成功した人が多く手に入れるのは正当だ、という考えがあります。それを支えているのが、だれでも努力すれば成功できる、という信念です。
        show:
          - { type: box, color: blue, w: 1100, title: 能力主義の前提, text: "成功 ＝ 本人の努力と才能の結果 → 多く得るのは正当（だれでも努力すれば成功できる）" }

  - board: whiteboard
    steps:
      - say: でもサンデルは、才能や知性、まじめさは、生まれた家庭や、遺伝に、大きく左右される、と指摘しました。努力できる性格そのものも、育った環境や、生まれ持った気質の産物です。
        show:
          - { type: title, text: 努力できることも運？ }
          - { type: box, color: yellow, w: 1100, text: "才能・知性・まじめさ、そして「努力できる性格」も、環境や生まれに左右される" }
      - say: 成功を、自分だけの手がらと考えることは、運が果たした役割を、小さく見すぎているのです。第3章で学んだ、道徳的運の話と、つながっていますね。
        show:
          - { type: text, color: gray, text: "成功を「自分だけの手がら」と見る ＝ 運の役割を小さく見すぎ（第3章とつながる）" }

  - board: whiteboard
    steps:
      - say: さらに、能力主義は、勝った人のおごりと、負けた人の屈辱を生みます。成功が本人の手がらなら、失敗も本人の責任になります。そこから、負け組は自業自得だ、という、残酷な考えが生まれるのです。
        show:
          - { type: title, text: おごりと屈辱 }
          - { type: box, color: pink, w: 1100, text: "成功が本人の手がらなら、失敗も本人の責任 →「負けたのは自業自得」という残酷な考え" }
      - say: これは、努力を否定しているのではありません。成功を、謙虚に受けとめよう、という提案なのです。
        show:
          - { type: box, color: green, w: 1100, text: "努力の否定ではない。成功を「謙虚に」受けとめよう、という提案" }
