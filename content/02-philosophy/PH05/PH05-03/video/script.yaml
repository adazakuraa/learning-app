title: 個人のアイデンティティ
scenes:
  - board: whiteboard
    steps:
      - say: 「個人のアイデンティティ」です。昨日の自分と、今日の自分は、同じ人でしょうか。古代から伝わる、テセウスの船、という思考実験があります。
        show:
          - { type: title, text: テセウスの船 }
          - type: svg
            w: 1100
            h: 200
            markup: |
              <g stroke="#9aa3ad"><path d="M40 100 H320 L280 160 H80 Z"/></g><g stroke="#9aa3ad"><path d="M80 100 V160 M130 100 V160 M180 100 V160 M230 100 V160"/></g>
              <path d="M370 130 H500 M485 118 L500 130 L485 142" stroke="#9aa3ad"/>
              <g stroke="#f3d77a"><path d="M560 100 H840 L800 160 H600 Z"/><path d="M600 100 V160"/></g><g stroke="#9aa3ad"><path d="M650 100 V160 M700 100 V160 M750 100 V160"/></g>
              <path d="M880 130 H960 M945 118 L960 130 L945 142" stroke="#9aa3ad"/>
              <g stroke="#f3d77a"><path d="M970 100 H1090 L1070 160 H990 Z"/></g>
              <g stroke="none" font-size="20" text-anchor="middle"><text x="180" y="195" fill="#9aa3ad">元の船</text><text x="700" y="195" fill="#f3d77a">板を1枚ずつ交換</text><text x="1030" y="195" fill="#f3d77a">全部新しい</text></g>
      - say: 船の板が、1枚ずつくさって、交換されていき、最後には、すべての板が新しくなりました。それは、元の船と、同じ船と言えるでしょうか。
        show:
          - { type: text, color: yellow, text: "すべての板が入れかわった船は、元の船と同じ？" }

  - board: whiteboard
    steps:
      - say: これは、私たち自身の話でもあります。体の多くの細胞は、数日から数年で入れかわっています。脳の神経細胞のように、一生ほとんど入れかわらない細胞もありますが、体をつくる原子も、食べ物や呼吸を通じて、少しずつ入れかわっています。10年前の自分と、今の自分は、物質としては、かなり別のものなのです。それでも、同じ人と言えるのは、なぜでしょうか。
        show:
          - { type: title, text: 心理的連続性 }
          - { type: text, text: "体の細胞や原子は入れかわる。それでも「同じ人」なのはなぜ？" }
      - say: 心理的連続性という説明では、記憶や性格、信念のつながりが、その人らしさをつくる、と考えます。昨日の記憶を持ち、同じ価値観や性格を持つから、同じ人だ、というのです。
        show:
          - { type: box, color: blue, w: 1100, title: 心理的連続性, text: "記憶・性格・信念のつながりが「同じ人」をつくる" }
      - say: でも、記憶は書きかえられ、性格も変わります。少しずつなら、同じ人と言えそうですが、病気で記憶や性格が大きく失われたときは、どうなるのでしょう。かんたんには、答えが出ません。
        show:
          - { type: text, color: pink, text: "でも記憶は書きかわり、性格も変わる。大きく失われたら？" }

  - board: whiteboard
    steps:
      - say: 同じ人か、という問いは、法律や道徳の責任を、だれが負うのか、という実用的な意味を持ちます。
        show:
          - { type: title, text: この問いから学べること }
          - { type: text, text: "実用面：責任をだれが負うのか（法律・道徳）" }
      - say: そして、もうひとつ。今の自分へのこだわりが、ゆるみます。今の価値観や、好み、信念に、しがみつきすぎず、変わることや、成長することを、自然なこととして受け入れられるようになるのです。
        show:
          - { type: box, color: green, w: 1100, text: "今の自分にしがみつかず、変わること・成長することを自然に受け入れる" }
