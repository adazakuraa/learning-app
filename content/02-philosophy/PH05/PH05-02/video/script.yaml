title: 意識のハード問題
scenes:
  - board: whiteboard
    steps:
      - say: 「意識のハード問題」です。今の哲学と脳科学で、最もむずかしい問題のひとつといわれます。問いはシンプルです。なぜ、物質である脳のはたらきから、主観的な体験が生まれるのか。
        show:
          - { type: title, text: 意識のハード問題 }
          - { type: box, color: yellow, w: 1100, text: "なぜ物質である脳のはたらきから、「感じ」という主観的な体験が生まれるのか？" }
      - say: 脳科学は、赤を見るとき、脳のこの部分がはたらく、ということは説明できます。でも、赤を見るときの、あの赤い感じが、なぜ存在するのかは、説明できません。
        show:
          - { type: text, color: blue, text: "説明できる：赤を見ると脳のこの部分がはたらく" }
          - { type: text, color: pink, text: "説明できない：なぜ「あの赤い感じ」があるのか" }

  - board: whiteboard
    steps:
      - say: この、主観的な体験の質を、クオリアといいます。バラの、赤い感じ。痛みの、あの痛い感じ。音楽を聴くときの、あの感じ。これらは、物理的な説明だけでは、とらえきれない面を持っています。
        show:
          - { type: title, text: クオリアと哲学的ゾンビ }
          - { type: box, color: pink, w: 1100, title: クオリア, text: "主観的な体験の質（バラの赤さ・痛みの痛さ・音楽のあの感じ）" }
      - say: 哲学的ゾンビという思考実験があります。見た目も、ふるまいも、脳のはたらきも、ふつうの人間とまったく同じなのに、内側に、主観的な体験がまったくない存在。そんなものは、ありえるでしょうか。もしありえるなら、主観的な体験は、物理的な説明だけでは、とらえられないことになります。
        show:
          - { type: box, color: gray, w: 1100, title: 哲学的ゾンビ, text: "外から見ると人間とまったく同じ。でも内側に「感じ」がない存在はありえるか？" }

  - board: whiteboard
    steps:
      - say: この問いは、AIにも直結します。
        show:
          - { type: title, text: AIは「感じている」のか }
      - say: AIが、どれほど上手に、感じているようにふるまっても、本当に何かを感じているかどうかは、わかりません。そして実は、ほかの人間についても、同じことが言えるのです。これは、次の章の、他者の問題につながっていきます。
        show:
          - { type: box, color: yellow, w: 1100, text: "AIが「感じているように」ふるまっても、本当に感じているかはわからない" }
          - { type: text, color: gray, text: "実は、ほかの人間についても同じ → 次の章へ" }
