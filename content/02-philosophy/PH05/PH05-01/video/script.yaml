title: 自己とは何か
scenes:
  - board: slide
    steps:
      - say: 第5章、「自己と意識」です。
        show:
          - { type: title, text: 第5章　自己と意識 }
      - say: 自分とは何か。意識とは何か。そして、昨日の自分と今日の自分は、同じ人なのか、を考えます。
        show:
          - type: list
            items: ["自己とは何か", "意識のハード問題", "個人のアイデンティティ"]
      - say: いちばん身近なのに、いちばんわからない、自分というものを、いろいろな角度からながめてみましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "「自分」「意識」を、いろいろな角度から考える" }

  - board: whiteboard
    steps:
      - say: 自分、というものは、本当にあるのでしょうか。デカルトは、考える自分を、確実な出発点にしました。
        show:
          - { type: title, text: 自分は「ある」のか }
          - { type: text, color: blue, text: "デカルト：考える自分は確実にある" }
      - say: でも、イギリスの哲学者ヒュームは、自分の内側をのぞいてみても、見えるのは、感覚や感情、考えの流れだけで、それらをたばねる、自分そのものは、見つからない、と主張しました。自分とは、経験の流れがつくり出す、まぼろしかもしれない、というのです。これを、束の理論といいます。
        show:
          - { type: box, color: green, w: 1100, title: ヒューム（束の理論）, text: "見えるのは感覚・感情・考えの流れだけ。自分は経験の「たば」がつくるまぼろし？" }
      - say: 仏教の、無我の思想も、同じように、固定した自分という実体はない、と考えます。自分とは、変わり続ける、過程なのです。
        show:
          - { type: text, color: yellow, text: "仏教の **無我**：固定した自分はない。自分は変わり続ける過程" }

  - board: whiteboard
    steps:
      - say: 哲学者パーフィットは、個人のアイデンティティは、私たちが思うほど、重要ではない、と主張しました。自分に、こだわりすぎることが、多くの問題の原因であり、自分の重要性を少し軽く見ることで、他人への思いやりや、未来の世代への責任が、自然に生まれる、というのです。
        show:
          - { type: title, text: パーフィットと物語的自己 }
          - { type: box, color: blue, w: 1100, title: パーフィット, text: "自分へのこだわりを軽くする → 他人や未来の世代への配慮が生まれる" }
      - say: 物語的自己、という考え方もあります。自分は、自分についての物語を語ることで、つくられる、という見方です。自分はこういう人間で、こんな経験をして、こんな価値観を持っている。その物語が、自分をつくるのです。
        show:
          - { type: box, color: pink, w: 1100, title: 物語的自己, text: "自分 ＝ 自分について語る物語。固定したものではなく、進行中の物語" }
      - say: この見方では、自分は、決まったものではなく、今も書き続けられている物語です。これからの章を、どう書くかは、あなたしだい、ということですね。
        added: true
        show:
          - { type: text, color: gray, text: "これからの章をどう書くかは、自分しだい" }
