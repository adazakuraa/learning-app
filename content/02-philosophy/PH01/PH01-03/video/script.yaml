title: 哲学史
scenes:
  - board: whiteboard
    steps:
      - say: 「哲学史」です。歴史に名を残した哲学者を、時代の順に見ていきましょう。まずは、古代ギリシャです。
        show:
          - { type: title, text: 古代ギリシャの3人 }
          - type: svg
            w: 1100
            h: 120
            markup: |
              <path d="M40 60 H1060" stroke="#9aa3ad"/>
              <g fill="#f3d77a" stroke="none"><circle cx="180" cy="60" r="10"/><circle cx="550" cy="60" r="10"/><circle cx="920" cy="60" r="10"/></g>
              <path d="M200 40 Q365 0 530 40 M570 40 Q735 0 900 40" stroke="#9aa3ad" stroke-dasharray="6 6"/>
              <g stroke="none" font-size="26" text-anchor="middle"><text x="180" y="105" fill="#f3d77a">ソクラテス</text><text x="550" y="105" fill="#f3d77a">プラトン</text><text x="920" y="105" fill="#f3d77a">アリストテレス</text><text x="365" y="18" font-size="18" fill="#9aa3ad">弟子</text><text x="735" y="18" font-size="18" fill="#9aa3ad">弟子</text></g>
      - say: ソクラテスは、「なぜそう思うのか」「なぜそれが成り立つのか」という問いを、何度もくり返す、問答法を使いました。そして、自分がわかっていないことを知る、無知の知の大切さを説きました。
        show:
          - { type: box, color: yellow, w: 1100, title: ソクラテス, text: "**問答法**で問いをくり返し、**無知の知**（わかっていないと知ること）の大切さを説いた" }

  - board: whiteboard
    steps:
      - say: その弟子のプラトンは、現実にあるものは、すべて、理想の世界にある、イデアのコピーにすぎない、と考えました。色も形もちがうイチゴを、どれもイチゴだとわかるのは、私たちの魂が、生まれる前に、イチゴそのもの、イチゴのイデアを見ていて、それを思い出しているからだ、というのです。
        show:
          - { type: title, text: プラトンとアリストテレス }
          - { type: box, color: blue, w: 1100, title: プラトン, text: "現実のものは **イデア**（理想の世界の本物）のコピー。魂が生まれる前に見たイデアを思い出す" }
      - say: さらにその弟子のアリストテレスは、中庸を大切にしました。臆病と無謀の間にある勇気のように、極端をさけた、バランスのとれた状態をよいとしたのです。また、人間は、ポリス的動物、つまり共同体の中でしか生きられない存在だ、と説きました。
        show:
          - { type: box, color: green, w: 1100, title: アリストテレス, text: "**中庸**（臆病と無謀の間の勇気）。人間は **ポリス的動物**（共同体で生きる）" }

  - board: whiteboard
    steps:
      - say: 次は、近代です。デカルトとカントは、あとの単元でくわしく学びます。
        show:
          - { type: title, text: ベーコンの4つのイドラ }
      - say: 17世紀イギリスのベーコンは、人がおちいりやすい思いこみを、4つのイドラに分けました。
        show:
          - { type: text, color: blue, text: "**種族のイドラ**：人間という種に共通する感覚の限界（目の錯覚など）" }
          - { type: text, color: green, text: "**洞窟のイドラ**：個人の性格・育ち・経験による思いこみ" }
          - { type: text, color: yellow, text: "**市場のイドラ**：言葉の使い方やうわさによる誤解" }
          - { type: text, color: pink, text: "**劇場のイドラ**：権威や伝統をうのみにする思いこみ" }
      - say: 種族のイドラは、人間という種に共通する感覚の限界。洞窟のイドラは、一人ひとりの性格や、育ち、経験による思いこみ。市場のイドラは、人が集まって話すときの、言葉の誤解やうわさ。劇場のイドラは、権威や伝統を、うのみにすることです。論理的思考で学んだ、バイアスの考え方の、先がけといえますね。
        show:
          - { type: text, size: s, color: gray, text: "現代の「認知バイアス」の考え方の先がけ" }

  - board: whiteboard
    steps:
      - say: 19世紀ドイツのヘーゲルは、どんなものごとも、内側に矛盾や対立をかかえている、と考えました。そして、どちらかを選ぶのではなく、両方を合わせて、より高い答えにたどりつくことを、アウフヘーベン、日本語で止揚、と呼びました。
        show:
          - { type: title, text: ヘーゲルの弁証法 }
          - { type: text, color: blue, text: "正（テーゼ）：老舗和菓子屋の伝統の味を守るべき" }
          - { type: text, color: pink, text: "反（アンチテーゼ）：若い客のために流行を取り入れるべき" }
          - { type: text, color: yellow, text: "合（アウフヘーベン）：伝統のあんを使った、和洋折衷の新しいスイーツ" }
      - say: 例えば、伝統の味を守るべきだ、という意見と、流行を取り入れるべきだ、という意見。どちらかを捨てるのではなく、伝統のあんを使った、新しいスイーツをつくる。対立を、一段上で解決するのです。
        show:
          - { type: box, color: green, w: 1100, text: "どちらかを捨てるのではなく、両方を生かして一段上の答えへ" }

  - board: whiteboard
    steps:
      - say: 同じく19世紀ドイツのニーチェは、科学が発展して、キリスト教への信頼がゆらぐ中で、「神は死んだ」という言葉を残しました。みんなが共通して頼れる価値観がくずれ、生きる意味を見失う、ニヒリズムの時代が来ることを、予見したのです。
        show:
          - { type: title, text: ニーチェ }
          - { type: box, color: pink, w: 1100, title: 「神は死んだ」, text: "共通の価値観がくずれ、意味を見失う **ニヒリズム** を予見" }
      - say: そのうえでニーチェは、世間や古い道徳にたよらず、自分の価値の物差しで生きる、超人になるべきだ、と説きました。また、弱い者が、強い者へのねたみや、うらみを正当化するために生み出す道徳を、ルサンチマンと呼んで、批判しました。
        show:
          - { type: box, color: yellow, w: 1100, title: 超人, text: "世間や古い道徳にたよらず、自分の価値の物差しで生きる" }
          - { type: box, color: gray, w: 1100, title: ルサンチマン, text: "ねたみ・うらみを正当化するための道徳（強者 ＝ 悪、弱者 ＝ 善）" }

  - board: whiteboard
    steps:
      - say: 20世紀には、ハイデガーやサルトルの実存主義があらわれます。これは、あとの章で学びます。
        show:
          - { type: title, text: フーコー }
          - { type: text, color: gray, text: "ハイデガー・サルトル：**実存主義**（あとの章で）" }
      - say: 20世紀フランスのフーコーは、狂気とは、絶対的なものではなく、その時代の価値観や権力によって、つくり出されるものだ、と主張しました。
        show:
          - { type: box, color: blue, w: 1100, title: フーコー, text: "「狂気」は絶対的なものではなく、時代の価値観や権力がつくり出す" }
      - say: 中世からルネサンスのヨーロッパでは、狂気は、ある種の知恵や神秘とも結びつけられ、社会の中に居場所がありました。でも17世紀以降、施設に閉じこめられ、排除されるようになります。正常と異常の境目をどこに引くかは、時代や社会によって決まるのです。
        show:
          - { type: text, text: "中世〜ルネサンス：社会の中に居場所 → 17世紀以降：閉じこめ、排除" }
          - { type: text, color: yellow, text: "正常と異常の境目は、時代や社会が決める" }
