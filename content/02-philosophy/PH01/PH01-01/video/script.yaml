title: 哲学とは
scenes:
  - board: slide
    steps:
      - say: 哲学の最初の章、「哲学とは何か」です。
        show:
          - { type: title, text: 第1章　哲学とは何か }
      - say: 哲学とはどんな営みなのか。どんな問いがあり、歴史上の哲学者たちが、何を考えてきたのかを、まず大まかにつかみます。
        show:
          - type: list
            items: ["哲学とは", "哲学の問いの地図", "哲学史"]
      - say: 哲学は、遠い昔の、むずかしい学問ではありません。毎日の判断や、生き方を考えるための、道具箱です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "哲学の全体像をつかみ、考えるための道具箱を手に入れる" }

  - board: whiteboard
    steps:
      - say: 哲学とは、答えのない問いを、できるかぎり、はっきりと、誠実に考え続ける営みです。
        show:
          - { type: title, text: 哲学とは }
          - { type: box, color: yellow, w: 1100, text: "**哲学** ＝ 答えのない問いを、できるかぎり明確に・誠実に考え続ける営み" }
      - say: 神は存在するか。自由意志はあるか。正義とは何か。こうした問いに、最終的な答えを出すことが目的ではありません。問いを正確に立て、論理的に考え、前提を疑い、ちがう視点から見直す。その過程そのものが、哲学なのです。
        show:
          - { type: text, text: "「神は存在するか」「自由意志はあるか」「正義とは何か」" }
          - { type: text, color: green, text: "問いを立てる → 論理的に考える → 前提を疑う → ちがう視点から見る" }

  - board: whiteboard
    steps:
      - say: 哲学は、意外と実用的です。身につく力は、3つあります。
        show:
          - { type: title, text: 哲学で身につく3つの力 }
      - say: ひとつ目は、前提を疑う力。「努力した人が報われるべきだ」「多数決が正しい」。当たり前に見える前提を疑い、根拠を問うと、判断全体が変わることがあります。
        show:
          - { type: box, color: blue, w: 1100, title: ① 前提を疑う力, text: "「努力した人が報われるべき」「多数決が正しい」は本当？" }
      - say: ふたつ目は、言葉の意味をはっきりさせる力。議論がすれちがうとき、実は、同じ言葉を、ちがう意味で使っていることがよくあります。「自由」「幸福」「愛」。言葉の意味をていねいに分けると、議論がはっきりします。
        show:
          - { type: box, color: green, w: 1100, title: ② 概念をはっきりさせる力, text: "すれちがいの原因は、同じ言葉をちがう意味で使っていること" }
      - say: みっつ目は、倫理的な判断力。どうすべきか、という判断の根拠を、自分の言葉で説明できると、筋の通った行動ができるようになります。
        show:
          - { type: box, color: pink, w: 1100, title: ③ 倫理的な判断力, text: "「どうすべきか」の根拠を言葉にできる → 筋の通った行動" }
