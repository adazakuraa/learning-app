questions:
  - q: 「何が善いか・どう生きるべきか」を問う、哲学の分野を何というでしょう？
    a: [倫理学]
  - q: 「何を・どのように知ることができるか」を問う、哲学の分野を何というでしょう？
    a: [認識論]
  - q: ソクラテスが説いた、自分が理解できていないことを知ることの大切さを何というでしょう？
    a: [無知の知]
  - q: アリストテレスが重視した、「臆病」と「無謀」の中間にある「勇気」のような、過不足のない状態を何というでしょう？
    a: [中庸]
  - q: プラトンが、現実のものはすべてそのコピーにすぎないと考えた、真の実在を何というでしょう？
    a: [イデア]
