title: 自由意志と道徳的責任
scenes:
  - board: whiteboard
    steps:
      - say: 「自由意志と道徳的責任」です。自由意志があるかどうかは、責任や罰、非難の根拠に、直結します。もし、人間の行動が、原因によって完全に決まっているなら、犯罪者を罰することに、意味はあるのでしょうか。
        show:
          - { type: title, text: 3つの立場 }
          - { type: text, color: pink, text: "行動がすべて決まっているなら、罰する意味は？" }
      - say: 強い自由意志論は、決定論を否定して、人間には本当の自由な意志がある、と考えます。強い決定論は、決定論を認めて、本当の自由意志はない、と考えます。そうなると、責任という考え方も、根本から見直す必要があります。
        show:
          - { type: box, color: blue, w: 1100, title: 強い自由意志論, text: "決定論は誤り。人間には本当の自由意志がある" }
          - { type: box, color: gray, w: 1100, title: 強い決定論, text: "決定論は正しい。本当の自由意志はない → 責任の考え方を見直すべき" }

  - board: whiteboard
    steps:
      - say: そして、両立論は、決定論と自由意志は、両立する、という立場で、今の哲学で、最も支持する人が多い考えです。
        show:
          - { type: title, text: 両立論 }
          - { type: box, color: yellow, w: 1100, text: "**両立論**：決定論と自由意志は両立する（今の哲学で最も支持が多い）" }
      - say: 自由意志を、外から無理やりさせられることなく、自分の欲求や理性に従って行動できること、と定義すれば、決定論が正しくても、自由意志はありえる、というのです。
        show:
          - { type: text, text: "自由 ＝ 外から強制されず、自分の欲求・理性に従って行動できること" }
      - say: ピストルをつきつけられて、お金をわたすのは、自由ではありません。でも、自分が欲しいから、お金を払って買い物をするのは、自由な行動です。たとえ、その欲しい気持ちに、原因があったとしても。
        added: true
        show:
          - { type: text, color: gray, text: "脅されて払う ＝ 不自由。欲しいから払う ＝ 自由（気持ちに原因があっても）" }

  - board: whiteboard
    steps:
      - say: まとめると、物理的に考えて、厳密な決定論が正しい可能性は低そうです。一方で、リベットの実験からわかるように、自由意志は、私たちが思っているほど、強いものではないのかもしれません。
        show:
          - { type: title, text: ちょうどよい「自由」 }
      - say: だから、完全な自由ではなく、強制されずに、ある程度のことを、自分の意志でコントロールできる状態を、自由だと考えるくらいが、ちょうどよさそうです。
        show:
          - { type: box, color: green, w: 1100, text: "完全な自由ではなく、「強制されず、ある程度自分でコントロールできる」くらいの自由" }
