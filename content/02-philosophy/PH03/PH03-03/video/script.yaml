title: 運と人生・道徳的運
scenes:
  - board: whiteboard
    steps:
      - say: 「運と人生」です。どの国に生まれたか。どんな家庭に育ったか。どんな遺伝子を持つか。どんな時代に生きるか。これらは、完全に運です。
        show:
          - { type: title, text: 人生と運 }
          - type: list
            items: ["どの国に生まれたか", "どんな家庭に育ったか", "どんな遺伝子を持つか", "どんな時代に生きるか"]
          - { type: box, at: [660, 200], w: 540, color: yellow, text: "→ すべて **運**" }
      - say: でも、私たちの社会は、努力した人が報われるべきだ、という、メリトクラシー、能力主義の原則で動いていて、貧しさや失敗を、本人の自己責任として扱いがちです。
        show:
          - { type: text, at: [80, 450], w: 1120, color: pink, text: "社会は「努力した人が報われるべき」（**メリトクラシー**）→ 失敗は「自己責任」" }

  - board: whiteboard
    steps:
      - say: 哲学者のネーゲルは、道徳的運という考えを示しました。人への道徳的な評価が、本人にはどうにもできない、運によって決まってしまう、という問題です。
        show:
          - { type: title, text: 道徳的運 }
      - say: 例えば、飲酒運転をした、2人のドライバーがいるとします。ひとりは、運よく何事もなく家に帰り、もうひとりは、運悪く、子どもをはねてしまいました。
        show:
          - type: svg
            w: 1000
            h: 200
            markup: |
              <rect x="20" y="40" width="440" height="120" rx="14" stroke="#9be0b0"/><rect x="540" y="40" width="440" height="120" rx="14" stroke="#f4a3b8"/>
              <g stroke="none" font-size="22" text-anchor="middle"><text x="240" y="85" fill="#9be0b0">飲酒運転 → 何事もなく帰宅</text><text x="240" y="130" fill="#9be0b0">「危険なことをした人」</text><text x="760" y="85" fill="#f4a3b8">飲酒運転 → 子どもをはねた</text><text x="760" y="130" fill="#f4a3b8">「人の命をうばった人」</text></g>
      - say: 行動はまったく同じなのに、一方は、危険なことをした人、もう一方は、人の命をうばった人、として扱われます。結果を決めたのは運なのに、評価が大きくちがう。これは、責任は、自分でコントロールできることにだけある、という直感と、矛盾しています。
        show:
          - { type: box, color: yellow, w: 1100, text: "行動は同じ。結果を決めたのは運。なのに評価が大きくちがう" }

  - board: whiteboard
    steps:
      - say: ただし、完全にコントロールできることだけに、責任をしぼると、困ったことになります。ほとんどの行動の背景には、遺伝や環境、過去の経験という、運の要素があるので、責任という考え方そのものが、くずれてしまうのです。
        show:
          - { type: title, text: 運の問題から学べること }
          - { type: text, color: gray, text: "コントロールできることだけに責任をしぼる → ほぼすべてに運がからみ、責任が成り立たない" }
      - say: 道徳的運の問題は、他人を厳しく裁く気持ちを、やわらげてくれます。あの人は、なぜあんなことをするのか。その答えの多くには、その人には、どうにもできなかった運の要素が、ふくまれているのです。
        show:
          - { type: box, color: green, w: 1100, text: "他人を厳しく裁く前に：その人がどうにもできなかった「運」がふくまれていないか？" }
