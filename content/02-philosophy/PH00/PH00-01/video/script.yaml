title: 哲学とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、哲学がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 哲学とは
      - say: 哲学は、「知るとはどういうことか」「自由とは」「どう生きるべきか」といった、答えがすぐには出ない問いを、できるだけ明確に、誠実に考え続ける学問です。
        show:
          - type: box
            w: 1100
            text: 哲学は、「知るとはどういうことか」「自由とは」「どう生きるべきか」といった、答えがすぐには出ない問いを、できるだけ明確に、誠実に考え続ける学問です。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で9章です。第1章は哲学とは何か、第2章は知識と真実、第3章は自由意志、第4章は倫理学の基本、第5章は自己と意識、第6章は他者と承認、第7章は正義と自由、第8章は人生の意味と幸福、第9章は現代の哲学的問題。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　哲学とは何か
              - 第2章　知識と真実
              - 第3章　自由意志
              - 第4章　倫理学の基本
              - 第5章　自己と意識
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第6章　他者と承認
              - 第7章　正義と自由
              - 第8章　人生の意味と幸福
              - 第9章　現代の哲学的問題
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、哲学を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、考える力の土台になる。前提を疑い、言葉の意味をはっきりさせ、筋道を立てて考える。哲学の考え方は、あらゆる学問や仕事の基礎になります。
        show:
          - type: box
            w: 1100
            text: |-
              **考える力の土台になる**
              前提を疑い、言葉の意味をはっきりさせ、筋道を立てて考える。哲学の考え方は、あらゆる学問や仕事の基礎になります。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、自分の価値観を言葉にできる。「正しさ」や「幸せ」について、昔から多くの人が考えてきた答えを知ると、自分の考えを整理する手がかりになります。
        show:
          - type: box
            w: 1100
            text: |-
              **自分の価値観を言葉にできる**
              「正しさ」や「幸せ」について、昔から多くの人が考えてきた答えを知ると、自分の考えを整理する手がかりになります。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、現代の問題を考える道具になる。AIに心はあるか、動物の扱いは正しいか。新しい問題も、哲学の考え方で筋道立てて考えられます。
        read: みっつ目は、現代の問題を考える道具になる。エーアイに心はあるか、動物の扱いは正しいか。新しい問題も、哲学の考え方で筋道立てて考えられます。
        show:
          - type: box
            w: 1100
            text: |-
              **現代の問題を考える道具になる**
              AIに心はあるか、動物の扱いは正しいか。新しい問題も、哲学の考え方で筋道立てて考えられます。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、人生の選択で迷ったとき、倫理的に難しいニュースを考えるとき、人と価値観が違うときに、相手の立場を理解したいとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 人生の選択で迷ったとき
              - 倫理的に難しいニュースを考えるとき
              - 人と価値観が違うときに、相手の立場を理解したいとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、哲学者の名前より、どんな問いを立てたかに注目する。そして、「自分ならどう考えるか」を一言でいいので持ってみる。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・哲学者の名前より、**どんな問いを立てたか**に注目する
              ・「自分ならどう考えるか」を一言でいいので持ってみる
            color: pink
            at:
              - 80
              - 420
