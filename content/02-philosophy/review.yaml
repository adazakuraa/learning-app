questions:
  - {u: PH01-01, p: 55, q: "答えのない問いを、できる限り明確に、誠実に考え続ける営みを何というでしょう？", a: [哲学]}
  - {u: PH01-02, p: 50, q: "哲学の分野で、「何を、どのように知ることができるか」を問うものを何というでしょう？", a: [認識論]}
  - {u: PH01-03, p: 65, q: "問答法を用い、自分が知らないことを自覚する「無知の知」を説いた古代ギリシャの哲学者は誰でしょう？", a: [ソクラテス]}
  - {u: PH01-03, p: 45, q: "ベーコンが分類した4つの偏見で、種族・洞窟・市場・劇場の名がつけられたものを何というでしょう？", a: [イドラ]}
  - {u: PH02-01, p: 60, q: "あらゆるものを疑い抜く方法的懐疑の末に、デカルトが「我思う、ゆえに」の後に続けた言葉は何でしょう？", a: [我あり, われあり], r: [われあり]}
  - {u: PH02-03, p: 40, q: "「美しい」の基準のように、真理は個人や文化によって違うとする立場を何というでしょう？", a: [相対主義]}
  - {u: PH02-04, p: 45, q: "ポパーが、科学の条件として挙げた、「間違っていればそれを示せる証拠がありうること」を何というでしょう？", a: [反証可能性]}
  - {u: PH03-01, p: 50, q: "すべての出来事は以前の原因によって決まっていると考え、自由意志の存在を問題にする立場を何というでしょう？", a: [決定論]}
  - {u: PH03-02, p: 40, q: "現代哲学で最も支持者が多い、「決定論と自由意志は両立する」とする立場を何というでしょう？", a: [両立論]}
  - {u: PH03-03, p: 35, q: "人の道徳的な評価が、本人にはどうにもならない運に左右されることを表す概念を何というでしょう？", a: [道徳的運]}
  - {u: PH04-01, p: 60, q: "ベンサムやミルが唱えた、行為の善悪を結果、つまり生み出す幸福の量で判断する倫理学説を何というでしょう？", a: [功利主義]}
  - {u: PH04-02, p: 50, q: "「嘘をつくな」のような無条件の命令を重視し、カントが説いた道徳の命令を何というでしょう？", a: [定言命法], r: [ていげんめいれい]}
  - {u: PH04-03, p: 65, q: "レバーを引けば5人が助かるが1人が犠牲になる、という状況で選択を問う思考実験を何というでしょう？", a: [トロッコ問題]}
  - {u: PH05-01, p: 35, q: "仏教で説かれる、「固定した自己という実体は存在しない」という思想を何というでしょう？", a: [無我]}
  - {u: PH05-02, p: 50, q: "バラの赤さの「赤い感じ」のような、主観的な体験の質を何というでしょう？", a: [クオリア]}
  - {u: PH05-03, p: 55, q: "部品を一枚ずつ交換し、すべて入れ替わった船は元の船と同じかを問う、古代からの思考実験を何というでしょう？", a: [テセウスの船]}
  - {u: PH06-02, p: 35, q: "「自己意識は他の自己意識との相互承認によってのみ確立する」と論じた、ドイツの哲学者は誰でしょう？", a: [ヘーゲル]}
  - {u: PH06-03, p: 40, q: "心理学者ギリガンが提唱した、具体的な関係の中での思いやりを重視する倫理を何というでしょう？", a: [ケアの倫理]}
  - {u: PH07-01, p: 50, q: "自分が社会のどの立場になるかわからない状態でルールを考える、ロールズの思考実験を何というでしょう？", a: [無知のヴェール, 無知のベール]}
  - {u: PH07-02, p: 40, q: "他者や政府に干渉されない自由を消極的自由といいますが、自分が自分の主人として生きる自由を何というでしょう？", a: [積極的自由]}
  - {u: PH07-03, p: 40, q: "『実力も運のうち』を著し、能力主義を批判したアメリカの政治哲学者は誰でしょう？", a: [サンデル, マイケル・サンデル]}
  - {u: PH08-01, p: 45, q: "サルトルの言葉で、「実存は〇〇に先立つ」の〇〇に入る言葉は何でしょう？", a: [本質]}
  - {u: PH08-01, p: 40, q: "岩を山頂へ押し上げては転げ落ちるシーシュポスの神話を用いて、カミュが表した概念は何でしょう？", a: [不条理]}
  - {u: PH08-03, p: 35, q: "「死は我々にとって何ものでもない」と説いた、古代ギリシャの哲学者は誰でしょう？", a: [エピクロス]}
  - {u: PH09-01, p: 50, q: "マニュアル通りに記号を処理するだけで正しい中国語の返事ができてしまう、AIの理解を問う思考実験を何というでしょう？", a: [中国語の部屋]}
  - {u: PH09-02, p: 40, q: "シンガーが、人間が動物の苦痛を軽く扱うことを人種差別と同じ構造だと批判した言葉を何というでしょう？", a: [スペシーシズム, 種差別], r: [しゅさべつ]}
