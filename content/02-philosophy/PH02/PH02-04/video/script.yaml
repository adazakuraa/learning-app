title: 科学的知識の強みと限界
scenes:
  - board: whiteboard
    steps:
      - say: 「科学的知識の強みと限界」です。科学は、今、最も信頼できる知識の生み出し方です。では、なぜ科学は信頼できるのでしょうか。
        show:
          - { type: title, text: 反証可能性 }
      - say: 哲学者のポパーは、科学の特徴として、反証可能性を挙げました。科学的な理論とは、もしまちがっているなら、それを示せる証拠が、ありうる理論だ、というものです。
        show:
          - { type: box, color: yellow, w: 1100, text: "**反証可能性**：まちがっているなら、それを示せる証拠がありうる ＝ 科学的" }
      - say: 「すべての白鳥は白い」は、科学的な主張です。黒い白鳥を、一羽でも見つければ、くつがえせます。実際に、オーストラリアで黒い白鳥が見つかりました。でも、「神は存在する」「悪い運命がある」などは、何が起きても、くつがえせないので、科学的な主張ではありません。
        show:
          - { type: text, color: green, text: "科学的：「すべての白鳥は白い」→ 黒い白鳥でくつがえせる" }
          - { type: text, color: gray, text: "科学ではない：「神は存在する」「悪い運命がある」→ 何が起きてもくつがえせない" }

  - board: whiteboard
    steps:
      - say: ただし、これは、科学でないものは、まちがいだ、という意味ではありません。
        show:
          - { type: title, text: 科学の外にある問い }
      - say: 科学は、知識のひとつの形です。道徳や、美、生きる意味、愛、宗教などは、科学の外にある問いです。
        show:
          - { type: text, text: "道徳・美・意味・愛・宗教 ＝ 科学の外にある問い" }
      - say: 「科学が言っていないから、うそだ」も、「科学で証明できないから、あてにならない」も、どちらもまちがいです。科学でないものは、科学のやり方では、正しいかまちがいかを決められない、というだけなのです。
        show:
          - { type: box, color: pink, w: 1100, text: "×「科学が言っていないからうそ」　×「科学で証明できないからあてにならない」" }

  - board: whiteboard
    steps:
      - say: 科学の、もうひとつの大事な特徴は、自分で自分を直す力です。まちがいが見つかれば、直すしくみを持っています。
        show:
          - { type: title, text: 自己修正という強み }
          - { type: box, color: green, w: 1100, text: "科学は、まちがいが見つかれば直すしくみを持つ（**自己修正**）" }
      - say: 「昔はこう言っていたのに、今はちがう。だから科学は信用できない」という批判は、この強みを、弱みと取りちがえています。科学は、いつも正しいことを言うものではなく、まちがいを重ねながら、真理に近づいていく、人間の営みなのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "「昔と言うことが変わった」＝ 弱みではなく強み。まちがいを直しながら真理に近づく" }
