questions:
  - q: デカルトが、あらゆるものを疑い抜いた末に残った確実なことを表した言葉は何か。「我思う、ゆえに（　　）」。
    a: [我あり, われあり]
    r: [われあり]
    show: 我あり
  - q: デカルトの、確実なものを見つけるためにあえてすべてを疑う方法を何というか。
    a: [方法的懐疑]
  - q: ポパーが、科学的な理論の条件として提唱した「間違っているならそれを示せる証拠が原理的にありうること」を何というか。
    a: [反証可能性]
  - q: 「真理は個人・文化・時代によって違う」とする立場を何というか。
    a: [相対主義]
