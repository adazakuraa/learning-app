title: 懐疑主義
scenes:
  - board: slide
    steps:
      - say: 第2章、「知識と真実」です。
        show:
          - { type: title, text: 第2章　知識と真実 }
      - say: 確かに知れることは何か。真実とは何か。そして、科学の知識はなぜ信頼できるのかを考えます。
        show:
          - type: list
            items: ["懐疑主義", "真実とは何か", "科学的知識の強みと限界"]
      - say: 「真実は人それぞれ」「科学も昔はまちがっていた」。よく聞くこうした言葉を、正しく考えられるようになりましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "「何を、どこまで信じてよいか」を考える物差しを持つ" }

  - board: whiteboard
    steps:
      - say: デカルトは、確実に知ることのできるものは何か、という問いに、とことん向き合いました。彼の方法は、少しでも疑う余地があれば、いったん、まちがいとみなす、という、方法的懐疑です。
        show:
          - { type: title, text: デカルトの方法的懐疑 }
          - { type: box, color: blue, w: 1100, text: "**方法的懐疑**：少しでも疑えるものは、いったん「まちがい」とみなす" }
      - say: 感覚は、だまされることがあります。しんきろう、目の錯覚、そして夢。今、目の前に見えているものも、夢かもしれません。
        show:
          - { type: text, color: gray, text: "感覚はだまされる：しんきろう・錯覚・夢" }
      - say: でも、どこまで疑っても、疑えないものが、ひとつあります。それは、今、疑っている自分がいる、ということです。疑っているということは、考えているということ。考えているということは、存在しているということ。これが、有名な、「我思う、ゆえに我あり」です。
        show:
          - { type: box, color: yellow, w: 1100, text: "疑っている ＝ 考えている ＝ 存在している →「**我思う、ゆえに我あり**」" }
      - say: デカルトは、この、考える自分を出発点に、確かな知識を組み立て直そうとしたのです。
        show:
          - { type: text, color: green, text: "考える自分を出発点に、知識を組み立て直す" }

  - board: whiteboard
    steps:
      - say: デカルトの問いは、今の私たちにも、つながっています。自分が信じていることのうち、本当に根拠があるものは、いくつあるでしょうか。
        show:
          - { type: title, text: 今の私たちへのヒント }
      - say: 私たちの信念の多くは、習慣や、環境、感情、権威への服従から来ていて、本気で根拠を問うと、くずれるものが少なくありません。
        show:
          - { type: text, text: "信念の多くは、習慣・環境・感情・権威から来ている" }
      - say: とはいえ、完全な確実さを求めすぎると、何も知ることができなくなります。かといって、何でも疑わずに信じるのも危険です。ほどよい疑いと、ほどよい信頼のバランスを持つこと。それが、知的に誠実であることの中心なのです。
        show:
          - { type: box, color: yellow, w: 1100, text: "疑いすぎも、信じすぎも危険 → ほどよい「疑い」と「信頼」のバランス" }
