title: 真実とは何か
scenes:
  - board: whiteboard
    steps:
      - say: 「真実とは何か」です。「真実は人それぞれ」「自分にとっての真実がある」という言葉を、よく聞きます。これは、本当でしょうか。哲学には、真理について、いくつかの立場があります。
        show:
          - { type: title, text: 対応説と相対主義 }
      - say: 対応説は、真理とは、現実と対応している主張のことだ、という、いちばんシンプルな立場です。「東京は日本の首都だ」が本当なのは、それが現実と合っているからです。
        show:
          - { type: box, color: blue, w: 1100, title: 対応説, text: "真理 ＝ 現実と対応している主張（「東京は日本の首都だ」）" }
      - say: 相対主義は、真理は、人や文化や時代によって変わる、という立場です。たしかに、何が美しいか、何が正しいか、という価値の判断は、文化や人によってちがいますね。
        show:
          - { type: box, color: green, w: 1100, title: 相対主義, text: "真理は人・文化・時代によって変わる（美しさ・正しさの判断はちがう）" }

  - board: whiteboard
    steps:
      - say: でも、強い相対主義、つまり、あらゆる真理は相対的だ、という考えには、致命的な問題があります。
        show:
          - { type: title, text: 相対主義のジレンマ }
      - say: 「すべての真理は相対的だ」という主張そのものが、絶対的な真理として、主張されているからです。絶対的な真理はない、と言うと、その言葉自体も、絶対ではなくなってしまう。自分で自分を否定してしまうのです。
        show:
          - { type: box, color: pink, w: 1100, text: "「すべての真理は相対的だ」← この主張自体は絶対？ → 自分で自分を否定してしまう" }
      - say: 「この世に絶対はない」と、絶対の自信で言う人がいたら、少しおかしいと感じますよね。それと同じです。
        added: true
        show:
          - { type: text, color: gray, text: "「この世に絶対はない」と絶対の自信で言う、のと同じ" }

  - board: whiteboard
    steps:
      - say: 実用的には、事実の問いと、価値の問いを、区別することが大切です。
        show:
          - { type: title, text: 事実の問いと価値の問い }
      - say: 事実の問い、例えば、東京は日本の首都か、地球は丸いか、ワクチンは効くか。これは、一人ひとりの考えとは関係なく、本当かどうかが決まります。ここでは、相対主義は成り立ちません。
        show:
          - { type: box, color: blue, w: 1100, title: 事実の問い, text: "東京は首都か・地球は丸いか → 人の考えと関係なく決まる（相対主義は成り立たない）" }
      - say: 価値の問い、例えば、何が美しいか、どう生きるべきか。こちらは、多様な考えを認める余地があります。「真実は人それぞれ」と聞いたら、それは、事実の話か、価値の話か、と問い直してみましょう。
        show:
          - { type: box, color: yellow, w: 1100, title: 価値の問い, text: "何が美しいか・どう生きるべきか → 多様な考えを認める余地がある" }
