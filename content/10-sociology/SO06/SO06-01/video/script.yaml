title: マスメディアと権力
scenes:
  - board: slide
    steps:
      - say: 第6章、「メディアと情報社会」です。
        show:
          - { type: title, text: 第6章　メディアと情報社会 }
      - say: マスメディアが、私たちの見る現実を、どうつくっているのかを学びます。
        show:
          - type: list
            items: ["マスメディアと権力"]
      - say: ニュースを、ただ受けとるのではなく、どう作られているかを意識して見る力をつけましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "ニュースがどう作られているかを意識して見る力をつける" }

  - board: whiteboard
    steps:
      - say: メディアは、現実を、そのまま伝えているのではなく、現実を、組み立てています。何を報道し、何を報道しないか。どの言葉を選ぶか。だれの声を取り上げるか。その選択が、受け手にとっての現実を、つくり出すのです。
        show:
          - { type: title, text: メディアは現実を組み立てる }
          - type: list
            items: ["何を報道し、何を報道しないか", "どの言葉を選ぶか", "だれの声を取り上げるか"]
          - { type: box, at: [660, 200], w: 540, color: yellow, text: "→ 受け手の「現実」をつくる" }

  - board: whiteboard
    steps:
      - say: マスメディアが、何が大事な問題かを、人々に設定するはたらきを、議題設定機能といいます。メディアが、あるテーマをくり返し大きく報道すると、人々は、それを大事な問題だと、考えるようになります。
        show:
          - { type: title, text: 議題設定とフレーミング }
          - { type: box, color: blue, w: 1100, title: 議題設定機能, text: "くり返し大きく報道 → 人々は「大事な問題だ」と考える" }
      - say: 「メディアは、何を考えるべきかは言えないが、何について考えるべきかは言える」という言葉が、よく使われます。
        show:
          - { type: text, color: gray, text: "「何を考えるかは言えないが、何について考えるかは言える」" }
      - say: フレーミングとは、問題を、どんな枠組みで示すか、です。移民を、助けを必要とする、難民、として報道するか、脅威となる、侵入者、として報道するかで、同じ事実でも、受けとり方が変わります。
        show:
          - { type: box, color: pink, w: 1100, title: フレーミング, text: "同じ移民を「助けが必要な難民」と報じるか「脅威の侵入者」と報じるかで、受けとり方が変わる" }
