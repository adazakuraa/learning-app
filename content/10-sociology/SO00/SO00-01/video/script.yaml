title: 社会学とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、社会学がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 社会学とは
      - say: 社会学は、家族、学校、会社、メディアなど、人と人が集まってできる「社会」の仕組みと、それが個人に与える影響を考える学問です。
        show:
          - type: box
            w: 1100
            text: 社会学は、家族、学校、会社、メディアなど、人と人が集まってできる「社会」の仕組みと、それが個人に与える影響を考える学問です。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で8章です。第1章は社会学とは何か、第2章は社会の構造、第3章は不平等と階層、第4章は逸脱と社会統制、第5章は相互作用と日常生活、第6章はメディアと情報社会、第7章は宗教・文化・アイデンティティ、第8章は社会学と哲学の接点。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　社会学とは何か
              - 第2章　社会の構造
              - 第3章　不平等と階層
              - 第4章　逸脱と社会統制
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第5章　相互作用と日常生活
              - 第6章　メディアと情報社会
              - 第7章　宗教・文化・アイデンティティ
              - 第8章　社会学と哲学の接点
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、社会学を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、「当たり前」を見直せる。常識や習慣は、時代や社会によって違います。社会学の目を持つと、当たり前だと思っていたことの理由が見えてきます。
        show:
          - type: box
            w: 1100
            text: |-
              **「当たり前」を見直せる**
              常識や習慣は、時代や社会によって違います。社会学の目を持つと、当たり前だと思っていたことの理由が見えてきます。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、悩みを社会の問題として考えられる。個人の悩みに見えることも、社会の構造が関係していることがあります。自分を責めすぎずに、仕組みから考えられます。
        show:
          - type: box
            w: 1100
            text: |-
              **悩みを社会の問題として考えられる**
              個人の悩みに見えることも、社会の構造が関係していることがあります。自分を責めすぎずに、仕組みから考えられます。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、情報社会を賢く生きる。メディアが人の考えにどう影響するかを知ると、ニュースやSNSとの付き合い方が変わります。
        read: みっつ目は、情報社会を賢く生きる。メディアが人の考えにどう影響するかを知ると、ニュースやエスエヌエスとの付き合い方が変わります。
        show:
          - type: box
            w: 1100
            text: |-
              **情報社会を賢く生きる**
              メディアが人の考えにどう影響するかを知ると、ニュースやSNSとの付き合い方が変わります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、格差や差別のニュースを考えるとき、SNSやメディアの影響を考えるとき、職場や地域での人間関係を理解したいとき、などに役立ちます。
        read: たとえば、格差や差別のニュースを考えるとき、エスエヌエスやメディアの影響を考えるとき、職場や地域での人間関係を理解したいとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 格差や差別のニュースを考えるとき
              - SNSやメディアの影響を考えるとき
              - 職場や地域での人間関係を理解したいとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、用語を身近な場面に当てはめる。そして、「それは社会のどんな仕組みから来ている？」と問う。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・用語を**身近な場面**に当てはめる
              ・「それは社会のどんな仕組みから来ている？」と問う
            color: pink
            at:
              - 80
              - 420
