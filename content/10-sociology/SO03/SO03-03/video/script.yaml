title: 人種・民族と差別の構造
scenes:
  - board: whiteboard
    steps:
      - say: 「人種、民族と差別のしくみ」です。制度的差別とは、一人ひとりの偏見ではなく、制度や習慣、政策が、特定の人種の集団を、不利にする差別です。
        show:
          - { type: title, text: 制度的差別 }
          - { type: box, color: pink, w: 1100, text: "**制度的差別**：個人の偏見ではなく、制度・習慣・政策が特定の集団を不利にする" }
      - say: 採用の基準や、住む地域の区分、教育予算の配り方などが、特定の集団を、しくみとして不利にしている場合があります。
        show:
          - { type: text, text: "例：採用の基準・住む地域の区分・教育予算の配り方" }
      - say: 自分には偏見はない、という人でも、差別的な制度に参加することで、差別を続けさせてしまうことがあるのです。
        show:
          - { type: text, color: yellow, text: "「偏見はない」人でも、差別的な制度に参加して差別を続けさせることがある" }

  - board: whiteboard
    steps:
      - say: 無意識の偏見とは、自分では、偏見はないと思っていても、自動的な連想が、判断に影響してしまう現象です。
        show:
          - { type: title, text: 無意識の偏見 }
          - { type: box, color: blue, w: 1100, text: "**無意識の偏見**：偏見はないつもりでも、自動的な連想が判断に影響する" }
      - say: 例えば、特定の人種と危険を、女性と弱さを、知らず知らず結びつけてしまう、といったことです。多くの人が、自覚なしに、こうした偏見を持っていることが、研究で示されています。
        show:
          - { type: text, text: "例：特定の人種と「危険」、女性と「弱さ」を無意識に結びつける" }
      - say: 大切なのは、偏見がない人はいない、と認めたうえで、自分の判断を、ときどき見直すことです。論理的思考で学んだ、バイアスの考え方と同じですね。
        added: true
        show:
          - { type: box, color: yellow, w: 1100, text: "偏見のない人はいない、と認めて、自分の判断をときどき見直す" }
