title: 社会移動と格差
scenes:
  - board: slide
    steps:
      - say: 第3章、「不平等と階層」です。
        show:
          - { type: title, text: 第3章　不平等と階層 }
      - say: 格差はどう生まれ、どう受けつがれるのか。そして、差別のしくみを学びます。
        show:
          - type: list
            items: ["社会移動と格差", "文化資本と社会関係資本", "人種・民族と差別の構造"]
      - say: 「努力すれば報われる」は、どこまで本当なのか。データと理論から考えます。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "格差と差別がどう生まれ、受けつがれるかを知る" }

  - board: whiteboard
    steps:
      - say: 社会移動とは、一人ひとりが、社会の階層の中で、上や下へ動くことです。親より高い地位や収入をえることを、上昇移動、低くなることを、下降移動といいます。
        show:
          - { type: title, text: 社会移動 }
          - { type: text, color: green, text: "上昇移動：親より高い地位・収入へ" }
          - { type: text, color: pink, text: "下降移動：親より低い地位・収入へ" }
      - say: 努力すれば、だれでも成功できる、という能力主義、メリトクラシーの考えは、多くの近代社会の建前です。でも、実際には、どのくらい移動が起きているのでしょうか。
        show:
          - { type: text, text: "建前：努力すればだれでも成功できる（**メリトクラシー**）" }
      - say: 研究では、親の収入や学歴が、子どもの社会的地位を、いちばんよく予測することが、示されています。
        show:
          - { type: box, color: yellow, w: 1100, text: "研究：親の収入・学歴が、子どもの社会的地位をいちばんよく予測する" }

  - board: whiteboard
    steps:
      - say: 教育の役割は、複雑です。教育は、社会の階層を移動する手段になる一方で、今ある格差を、くり返し生み出す、再生産する、ともいわれます。豊かな家庭の子どもは、よりよい教育や、文化的な体験をえられ、よい学歴や職業につきやすいのです。
        show:
          - { type: title, text: 教育と格差 }
          - { type: box, color: blue, w: 1100, text: "教育 ＝ 移動の手段。でも、豊かな家庭ほど良い教育 → 格差の再生産にも" }

  - board: whiteboard
    steps:
      - say: 相対的剥奪という考えも、大切です。貧しさや不満は、物が足りないことだけから生まれるのではなく、まわりと比べて、自分は恵まれていない、という比較から生まれます。
        show:
          - { type: title, text: 相対的剥奪 }
          - { type: box, color: pink, w: 1100, text: "**相対的剥奪**：不満は「まわりと比べて恵まれていない」という比較から生まれる" }
      - say: だから、社会全体が豊かになっても、格差が大きければ、不満は増えることがあります。給料が上がっても、同僚がもっと上がっていたら、うれしくないのと同じです。
        show:
          - { type: text, color: gray, text: "給料が上がっても、同僚がもっと上がればうれしくない" }
