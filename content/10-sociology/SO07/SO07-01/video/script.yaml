title: 宗教の社会学
scenes:
  - board: slide
    steps:
      - say: 第7章、「宗教、文化、アイデンティティ」です。
        show:
          - { type: title, text: 第7章　宗教・文化・アイデンティティ }
      - say: 社会の中での宗教のはたらきと、現代の、自分らしさの悩みを学びます。
        show:
          - type: list
            items: ["宗教の社会学", "アイデンティティと現代"]
      - say: 自分とは何者か。この問いが、なぜ今、こんなに切実になっているのかが、見えてきます。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "宗教の社会的なはたらきと、現代の「自分らしさ」の悩みを知る" }

  - board: whiteboard
    steps:
      - say: デュルケームは、宗教の社会的なはたらきとして、社会をひとつにまとめることを、最も重視しました。いっしょに行う儀式や信仰が、人々を結びつけ、社会としての一体感をつくり出すのです。
        show:
          - { type: title, text: 社会をまとめる宗教 }
          - { type: box, color: yellow, w: 1100, title: デュルケーム, text: "共同の儀式・信仰が人々を結びつけ、社会の一体感をつくる" }
      - say: 国旗に敬意をはらう、国歌を歌う、という行為も、宗教ではないけれど、宗教と同じようなはたらきをしている、ともいえます。スポーツの応援で、みんなが一体になるのも、似ていますね。
        show:
          - { type: text, color: gray, text: "国旗・国歌、スポーツの応援も、宗教に似たはたらき" }

  - board: whiteboard
    steps:
      - say: 昔は、近代化とともに、宗教の力は、弱まっていく、と考えられていました。でも実際には、先進国でも、宗教は完全には消えておらず、途上国や新興国では、今も強い力を持っています。宗教は消えるのではなく、形を変えていく、というのが、今の見方です。
        show:
          - { type: title, text: 宗教は形を変えて残る }
          - { type: text, color: gray, text: "昔の予想：近代化で宗教は弱まる" }
          - { type: text, color: yellow, text: "実際：消えずに形を変える（途上国・新興国では今も強い）" }
      - say: ウェーバーは、宗教を、意味をあたえるしくみ、ととらえました。なぜ苦しむのか、なぜ死ぬのか。こうした問いに、宗教は答えを示します。科学が発展しても、意味の問いには、科学は答えられないので、宗教は残り続ける、という見方です。
        show:
          - { type: box, color: blue, w: 1100, title: ウェーバー, text: "宗教 ＝ 意味をあたえるしくみ。「なぜ苦しむのか」に科学は答えられない → 宗教は残る" }
