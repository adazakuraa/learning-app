title: アイデンティティと現代
scenes:
  - board: whiteboard
    steps:
      - say: 「アイデンティティと現代」です。アイデンティティとは、自分は何者か、という自己の定義です。
        show:
          - { type: title, text: 昔と今のアイデンティティ }
          - { type: text, text: "**アイデンティティ** ＝「自分は何者か」という自己定義" }
      - say: 近代より前の社会では、アイデンティティは、比較的固定していました。どの家に生まれたか、どの村に住むか、どの宗教を持つかが、自分を決めていたのです。
        show:
          - { type: box, color: gray, w: 1100, title: 昔, text: "生まれた家・住む村・宗教が「自分」を決めていた（固定的）" }
      - say: 一方、今の私たちは、自分の生き方を、たえず問い直し、選び、つくり続けることを求められます。どんな仕事をするか。どこに住むか。だれと結婚するか。どんな価値観を持つか。こうした選択が自分をつくる、という自由と責任が生まれました。
        show:
          - { type: box, color: yellow, w: 1100, title: 今, text: "仕事・住む場所・結婚・価値観を自分で選び、自分をつくり続ける（自由と責任）" }

  - board: whiteboard
    steps:
      - say: でも、この選択の自由は、同時に、アイデンティティの不安定さを、もたらします。伝統や習慣、宗教が、自分を支えてくれていた時代とちがって、今の私たちは、いつも、自分はこれでいいのか、という不安にさらされています。
        show:
          - { type: title, text: 自由と不安 }
          - { type: box, color: pink, w: 1100, text: "選ぶ自由 ＝ 支えがない不安。「自分はこれでいいのか？」" }
      - say: SNSでほかの人と比べ、お手本を探し、認めてもらうことを求める。そうした今の心のあり方の背景には、このアイデンティティのゆらぎがあるのです。
        show:
          - { type: text, color: gray, text: "SNSで比べる・お手本を探す・認めてほしい → 背景にアイデンティティのゆらぎ" }
      - say: 不安を感じるのは、あなたが弱いからではなく、自由な社会の、しくみから来るものなのです。
        added: true
        show:
          - { type: text, color: yellow, text: "不安は、弱さではなく、自由な社会のしくみから来る" }
