title: 社会的役割と地位
scenes:
  - board: slide
    steps:
      - say: 第2章、「社会の構造」です。
        show:
          - { type: title, text: 第2章　社会の構造 }
      - say: 社会の中での立場と、そこで期待される役割について学びます。
        show:
          - type: list
            items: ["社会的役割と地位"]
      - say: 親として、会社員として、友人として。いくつもの顔を持つ私たちの、悩みのしくみが見えてきます。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "いくつもの役割を持つ私たちの、悩みのしくみを知る" }

  - board: whiteboard
    steps:
      - say: 社会学でいう地位とは、社会の中での位置のことです。医師、教師、母親、会社員といった位置です。
        show:
          - { type: title, text: 地位と役割 }
          - { type: box, color: blue, w: 1100, title: 地位, text: "社会の中での位置（医師・教師・母親・会社員）" }
      - say: 役割は、ある地位にいる人に、期待される行動のパターンです。教師という地位には、知識を教える、お手本になる、という役割が期待されます。
        show:
          - { type: box, color: green, w: 1100, title: 役割, text: "その地位の人に期待される行動（教師 → 教える・お手本になる）" }

  - board: whiteboard
    steps:
      - say: 役割葛藤とは、同時にいくつもの役割を担うとき、それらが、ぶつかり合う状況です。仕事で遅くなるけれど、子どもの行事にも出たい親、が典型的な例です。
        show:
          - { type: title, text: 役割葛藤と役割距離 }
          - { type: box, color: pink, w: 1100, title: 役割葛藤, text: "役割どうしがぶつかる（仕事で遅くなる ⇔ 子どもの行事に出たい親）" }
      - say: 今の私たちは、たくさんの役割を持っているので、役割葛藤は、だれもが経験するものです。自分が悪いのではなく、しくみとして起きる、と知っておくだけでも、少し気が楽になりますね。
        show:
          - { type: text, color: gray, text: "だれもが経験する。自分が悪いのではなく、しくみとして起きる" }
      - say: 役割距離は、自分は、この役割だけの人間ではない、という距離感を、見せることです。厳しいお医者さんが、患者さんに冗談を言うのは、医師という役割に、すっかりのみこまれてはいない、ということを示す、役割距離のあらわれです。
        show:
          - { type: box, color: yellow, w: 1100, title: 役割距離, text: "「この役割だけの自分ではない」と見せる（厳しい医師が冗談を言う）" }
