title: 逸脱とは何か
scenes:
  - board: slide
    steps:
      - say: 第4章、「逸脱と社会統制」です。
        show:
          - { type: title, text: 第4章　逸脱と社会統制 }
      - say: 「ふつう」から外れるとはどういうことか。そして、レッテルが人をどう変えるかを学びます。
        show:
          - type: list
            items: ["逸脱とは何か", "ラベリング理論"]
      - say: 何がふつうで、何がふつうでないか。それを決めているのは、だれなのでしょうか。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "「ふつう」を決めているしくみと、レッテルの力を知る" }

  - board: whiteboard
    steps:
      - say: 逸脱とは、社会の決まりや期待から、外れた行動や状態のことです。大切なのは、逸脱は、行動そのものの性質ではなく、社会が決めるものだ、という点です。
        show:
          - { type: title, text: 逸脱は社会が決める }
          - { type: box, color: yellow, w: 1100, text: "**逸脱** ＝ 社会の決まり・期待から外れること。行動そのものではなく、**社会が決める**" }
      - say: 何が逸脱かは、時代や文化によって、大きくちがいます。かつて、同性愛は、犯罪や病気とされていましたが、今、多くの社会では、ふつうの多様性のひとつとして、受け入れられています。
        show:
          - { type: text, color: blue, text: "例：同性愛 → かつて犯罪・病気とされた → 今は多くの社会で受け入れられる" }
      - say: タトゥーは、日本では、反社会的なイメージがありますが、多くの文化では、ふつうのおしゃれです。
        show:
          - { type: text, color: green, text: "例：タトゥー → 日本では反社会的なイメージ。多くの文化ではふつうのおしゃれ" }

  - board: whiteboard
    steps:
      - say: デュルケームは、逆説的に、犯罪は正常だ、と述べました。
        show:
          - { type: title, text: 「犯罪は正常だ」 }
      - say: どんな社会にも、逸脱はあります。そして、逸脱を決めて、罰することで、社会の決まりが、確認され、強くなります。
        show:
          - { type: box, color: blue, w: 1100, text: "逸脱を決め、罰する → 社会の決まりが確認され、強まる" }
      - say: 完全に犯罪のない社会は、ありません。もし、今の犯罪がすべてなくなったら、今は許されている行動が、新しく犯罪として定められるだろう、と考えることができます。デュルケームは、聖人ばかりの修道院でも、小さなあやまちが、大きな罪とされるだろう、とたとえました。
        show:
          - { type: box, color: pink, w: 1100, text: "犯罪がなくなれば、今は許される行動が新しい「犯罪」になる（聖人の修道院でも小さなあやまちが罪に）" }
