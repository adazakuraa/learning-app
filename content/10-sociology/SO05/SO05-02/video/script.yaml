title: 会話と相互作用の秩序
scenes:
  - board: whiteboard
    steps:
      - say: 「会話のルール」です。私たちの日常会話には、たくさんの、暗黙のルールがあります。
        show:
          - { type: title, text: 会話の暗黙のルール }
      - say: 会話は、一度にひとりが話す。相手の言葉に、関係のある返事をする。あいづちで、わかっていることを示す。だまっていることにも、意味がある。こうしたルールは、だれも教えていないのに、ほとんど全員が従っています。
        show:
          - type: list
            items: ["一度にひとりが話す", "相手の言葉に関係のある返事をする", "あいづちで理解を示す", "沈黙にも意味がある"]
          - { type: box, at: [660, 200], w: 540, color: yellow, text: "だれも教えていないのに、みんなが従っている" }

  - board: whiteboard
    steps:
      - say: アメリカの社会学者ガーフィンケルは、違背実験という、ユニークな方法で、こうした暗黙のルールを明らかにしました。わざとルールを破ってみることで、ルールがあることを、浮かび上がらせる実験です。
        show:
          - { type: title, text: ガーフィンケルの違背実験 }
          - { type: box, color: blue, w: 1100, text: "**違背実験**：わざとルールを破り、ルールの存在を浮かび上がらせる" }
      - say: 学生に、友だちとの会話で、相手の言葉の意味を、すべて細かく問い直す、という課題をあたえたところ、ほとんどの友だちが、とまどい、怒り、動揺しました。
        show:
          - { type: text, color: blue, text: "友だち：「調子はどう？」" }
          - { type: text, color: pink, text: "学生：「何が？ どの意味で？ 体調のこと？ 気分のこと？」" }
          - { type: text, color: gray, text: "→ 相手は「こいつはおかしい」と感じる" }
      - say: 「調子はどう？」と聞かれて、「何が？ どの意味で？」と返すと、相手は、こいつはおかしい、と感じます。ふだん意識しないルールが、私たちの日常の秩序を、しっかり支えていることがわかりますね。
        show:
          - { type: box, color: yellow, w: 1100, text: "意識しないルールが、日常の秩序を支えている" }
