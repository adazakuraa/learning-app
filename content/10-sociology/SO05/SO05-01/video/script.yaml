title: ゴフマンの演技論
scenes:
  - board: slide
    steps:
      - say: 第5章、「相互作用と日常生活」です。
        show:
          - { type: title, text: 第5章　相互作用と日常生活 }
      - say: 毎日の人とのやりとりに、どんなしくみがあるのかを学びます。
        show:
          - type: list
            items: ["ゴフマンの演技論", "会話と相互作用の秩序"]
      - say: SNSでの自分の見せ方や、会話の気まずさ。身近なことを、社会学の目で見てみましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "毎日のやりとりにかくれたしくみを見つける" }

  - board: whiteboard
    steps:
      - say: アメリカの社会学者ゴフマンの考えは、日常生活は演劇だ、というあざやかなたとえで表されます。ドラマトゥルギーといいます。
        show:
          - { type: title, text: 日常生活は演劇 }
          - { type: box, color: yellow, w: 1100, text: "**ドラマトゥルギー**：日常生活は演劇だ" }
      - say: 私たちは、毎日、いつも演技をしています。職場では、有能な社員。家では、よい親。友だちの前では、おもしろい人。場面に合わせて、キャラクターを演じ分けています。これは、にせものではなく、人とのやりとりの、ふつうのしくみなのです。
        show:
          - { type: text, text: "職場 → 有能な社員　家 → よい親　友だちの前 → おもしろい人" }
          - { type: text, color: gray, text: "演技 ＝ にせものではなく、人とのやりとりのふつうのしくみ" }

  - board: whiteboard
    steps:
      - say: ゴフマンは、表舞台と、楽屋を区別しました。表舞台は、人に見られる場所で、決まった役割やイメージを保ちます。楽屋は、見られていない場所で、緊張をといて、素の姿を見せます。
        show:
          - { type: title, text: 表舞台と楽屋 }
          - { type: box, color: blue, at: [80, 140], w: 540, title: 表舞台, text: "人に見られる場所。役割・イメージを保つ" }
          - { type: box, color: green, at: [660, 140], w: 540, title: 楽屋, text: "見られていない場所。素の姿" }
      - say: 印象管理とは、自分について、ある印象を、相手に持たせ、保とうとすることです。服装、話し方、身ぶり、わざと見せる持ち物。すべてが、印象管理の道具になります。
        show:
          - { type: text, at: [80, 360], w: 1120, color: yellow, text: "**印象管理**：服装・話し方・身ぶり・持ち物で、自分の印象をつくる" }

  - board: whiteboard
    steps:
      - say: SNSは、究極の印象管理の道具です。自分のいちばんよいところだけを選んで見せ、楽屋は、完全にかくせます。
        show:
          - { type: title, text: SNSと表舞台 }
          - { type: box, color: pink, w: 1100, text: "SNS ＝ 究極の表舞台。いちばんよいところだけ見せ、楽屋はかくせる" }
      - say: SNSを見ると、ほかの人が充実して見えて、自分がみじめになる。この現象の原因のひとつは、表舞台しか見えない、SNSのしくみにあるのです。みんな、楽屋では、同じようにだらしない姿もあるのですから。
        show:
          - { type: text, color: yellow, text: "他人が充実して見えるのは、表舞台しか見えないから。楽屋はみんな同じ" }
