title: 社会学の誕生と問い
scenes:
  - board: slide
    steps:
      - say: 社会学の最初の章、「社会学とは何か」です。
        show:
          - { type: title, text: 第1章　社会学とは何か }
      - say: 社会学がどう生まれ、どんなものの見方をするのかを学びます。
        show:
          - type: list
            items: ["社会学の誕生と問い", "社会学的想像力"]
      - say: 自分の悩みや、身のまわりの「当たり前」を、社会のしくみとつなげて見る。そんな新しいメガネを手に入れましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "自分の悩みや「当たり前」を、社会のしくみとつなげて見るメガネを持つ" }

  - board: whiteboard
    steps:
      - say: 社会学という言葉をつくったのは、19世紀フランスのオーギュスト・コントです。物理学が、自然の法則を見つけるように、社会にも法則があるはずだ、と考えました。そこから生まれたのが、社会学です。
        show:
          - { type: title, text: 社会学の誕生 }
          - { type: box, color: blue, w: 1100, title: コント, text: "「社会学」の名づけ親。自然に法則があるように、社会にも法則があるはず" }

  - board: whiteboard
    steps:
      - say: フランスのデュルケームは、『自殺論』という本で知られる社会学者です。
        show:
          - { type: title, text: デュルケームの『自殺論』 }
      - say: 自殺は、最も個人的な行為のように見えます。でも、統計を調べると、宗教や、結婚しているかどうか、経済の状況といった、社会の要因によって、自殺の割合が、決まった形で変わることを示しました。
        show:
          - { type: box, color: yellow, w: 1100, text: "最も個人的に見える「自殺」も、宗教・結婚・経済状況など社会の要因で割合が変わる" }
      - say: 個人の心の問題に見えることにも、社会のしくみが、深く関わっている。これが、社会学の出発点となる発見です。
        added: true
        show:
          - { type: text, color: gray, text: "個人の問題に見えても、社会のしくみが関わっている" }

  - board: whiteboard
    steps:
      - say: このように、社会というしくみが、私たちにどんな影響をあたえているのか。そして、なぜそのようなしくみがあるのか。自分の中の常識を疑いながら、考えを深めていくのが、社会学です。
        show:
          - { type: title, text: 社会学とは }
          - { type: box, color: green, w: 1100, text: "社会のしくみが私たちにどう影響するか、なぜそのしくみがあるのかを、常識を疑いながら考える" }
