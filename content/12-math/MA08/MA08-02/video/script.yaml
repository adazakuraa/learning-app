title: 最大公約数と最小公倍数
scenes:
  - board: whiteboard
    steps:
      - say: 「最大公約数と最小公倍数」です。
        show:
          - { type: title, text: 最大公約数と最小公倍数 }
      - say: 2つの整数に共通する約数のうち、いちばん大きいものを、最大公約数といいます。
        show:
          - { type: text, text: "**最大公約数** … 共通する約数のうち、いちばん大きいもの" }
      - say: 共通する倍数のうち、いちばん小さいものを、最小公倍数といいます。
        show:
          - { type: text, text: "**最小公倍数** … 共通する倍数のうち、いちばん小さいもの" }

  - board: whiteboard
    steps:
      - say: 最大公約数は、「等分する」場面で役立ちます。縦24センチ、横18センチの長方形に、できるだけ大きな正方形のタイルを、すき間なく敷きつめたい。タイルの一辺は何センチでしょう。
        show:
          - { type: title, text: 最大公約数：タイルを敷きつめる }
        pause: 2
      - say: 一辺は、縦の24も、横の18も割り切れる長さでないといけません。その中でいちばん大きいのは、24と18の最大公約数、6センチです。
        show:
          - type: svg
            at: [80, 200]
            w: 600
            h: 460
            color: blue
            markup: |
              <rect x="20" y="20" width="270" height="360"/>
              <path d="M110 20 V380"/><path d="M200 20 V380"/>
              <path d="M20 110 H290"/><path d="M20 200 H290"/><path d="M20 290 H290"/>
              <g fill="currentColor" stroke="none" font-size="26"><text x="120" y="420">横 18cm</text><text x="300" y="210">縦 24cm</text></g>
          - { type: text, at: [700, 260], color: yellow, text: "24 と 18 の\n最大公約数 ＝ **6cm**" }
          - { type: text, at: [700, 420], size: s, color: gray, text: "6cm のタイルが\n縦4枚 × 横3枚 ＝ 12枚" }

  - board: whiteboard
    steps:
      - say: 最小公倍数は、「周期が重なる」場面で使います。2日ごとに来るバスと、3日ごとに来るバス。次に同じ日に来るのは、何日後でしょう。
        show:
          - { type: title, text: 最小公倍数：周期が重なる }
        pause: 2
      - say: 2の倍数と3の倍数で、最初に重なるのは6。つまり、6日後です。
        show:
          - type: svg
            w: 1100
            h: 220
            markup: |
              <path d="M40 160 H1060" stroke="#9aa3ad"/>
              <g fill="#9aa3ad" stroke="none" font-size="24" text-anchor="middle"><text x="100" y="200">0</text><text x="250" y="200">1</text><text x="400" y="200">2</text><text x="550" y="200">3</text><text x="700" y="200">4</text><text x="850" y="200">5</text><text x="1000" y="200">6</text></g>
              <g fill="#8fc4ff" stroke="none"><circle cx="400" cy="120" r="14"/><circle cx="700" cy="120" r="14"/><circle cx="1000" cy="120" r="14"/></g>
              <g fill="#f4a3b8" stroke="none"><circle cx="550" cy="80" r="14"/><circle cx="1000" cy="80" r="14"/></g>
              <text x="40" y="125" font-size="24" fill="#8fc4ff" stroke="none">2日ごと</text><text x="40" y="85" font-size="24" fill="#f4a3b8" stroke="none">3日ごと</text>
              <text x="1000" y="40" font-size="26" fill="#f3d77a" stroke="none" text-anchor="middle">重なる！</text>
          - { type: text, color: yellow, text: "2 と 3 の最小公倍数 ＝ **6** → 6日後に同じ日" }
