title: 練習問題 整数
scenes:
  - board: slide
    steps:
      - say: 「整数」の章の練習問題です。問題を読んだら一時停止して、考えてみましょう。
        show:
          - { type: title, text: 練習問題　整数 }
          - { type: text, size: l, text: "約数・素因数分解・公約数と公倍数・n進数" }

  - board: whiteboard
    steps:
      - say: 問題1。24の約数を、すべて求めましょう。
        show:
          - { type: title, text: "問題 ①②" }
          - { type: text, text: "① 24 の約数をすべて" }
        pause: 3
      - say: 1、2、3、4、6、8、12、24です。かけて24になるペア、1と24、2と12、3と8、4と6を探すと、もれなく見つかります。
        show:
          - { type: text, color: green, text: "1, 2, 3, 4, 6, 8, 12, 24" }
          - { type: text, size: s, color: gray, text: "ペアで探す：1×24、2×12、3×8、4×6" }
      - say: 問題2。144を素因数分解しましょう。
        show:
          - { type: text, text: "② 144 を素因数分解" }
        pause: 3
      - say: 小さい素数から順に割っていくと、2の4乗×3の2乗です。144は12×12なので、12＝2²×3を2回かけた、と考えても求められます。
        show:
          - { type: formula, color: green, tex: '144 = 2^4 \times 3^2' }

  - board: whiteboard
    steps:
      - say: 問題3。120と144の、最大公約数と最小公倍数は？
        show:
          - { type: title, text: "問題 ③" }
        pause: 3
      - say: まず素因数分解します。144は2⁴×3²、120は2³×3×5です。
        show:
          - { type: formula, tex: '144 = 2^4 \times 3^2 \qquad 120 = 2^3 \times 3 \times 5' }
      - say: 最大公約数は、両方に共通する部分、2³×3で、24です。
        show:
          - { type: formula, color: green, tex: '\text{最大公約数} = 2^3 \times 3 = 24' }
      - say: 最小公倍数は、どちらの部品もすべて含む数、2⁴×3²×5で、720です。
        show:
          - { type: formula, color: green, tex: '\text{最小公倍数} = 2^4 \times 3^2 \times 5 = 720' }

  - board: whiteboard
    steps:
      - say: 問題4。十干十二支は、10個の十干、甲、乙、丙…と、12個の十二支、子、丑、寅…を、甲子、乙丑、丙寅…と順に組み合わせたものです。全部で何通りあるでしょう。
        show:
          - { type: title, text: "問題 ④　十干十二支" }
          - { type: text, size: s, text: "十干（10個）と十二支（12個）を順に組み合わせる：甲子、乙丑、丙寅 …" }
        pause: 4
      - say: 10×12で120通り、と思いがちですが、ちがいます。最初の甲子に戻ってくるのは、10と12の両方の周期がそろうとき。つまり、10と12の最小公倍数、60個後です。だから、全部で60通りです。
        show:
          - { type: text, color: green, text: "10 と 12 の最小公倍数 ＝ **60通り**" }
      - say: 60歳を「還暦」と呼ぶのは、生まれた年の十干十二支に、60年でもどってくるからです。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "60年で生まれた年の干支にもどる ＝ 還暦" }

  - board: whiteboard
    steps:
      - say: 問題5。2進数の「1101」を、10進数に直しましょう。
        show:
          - { type: title, text: "問題 ⑤⑥⑦　n進数" }
          - { type: text, text: "⑤ 2進数 1101 → 10進数" }
        pause: 3
      - say: 左から、8の位、4の位、2の位、1の位です。8＋4＋1で、13です。
        show:
          - { type: formula, color: green, tex: '1101_{(2)} = 8 + 4 + 0 + 1 = 13' }
      - say: 問題6。10進数の9を、2進数に直しましょう。
        show:
          - { type: text, text: "⑥ 10進数 9 → 2進数" }
        pause: 3
      - say: 9は、8＋1。8の位と1の位が1なので、1001です。
        show:
          - { type: formula, color: green, tex: '9 = 8 + 1 = 1001_{(2)}' }
      - say: 問題7。16進数の「A2」を、10進数に直しましょう。
        show:
          - { type: text, text: "⑦ 16進数 A2 → 10進数" }
        pause: 3
      - say: 16進数では、右から2つ目が16の位です。Aは10なので、16×10で160。1の位の2を足して、162です。
        show:
          - { type: formula, color: green, tex: 'A2_{(16)} = 16 \times 10 + 2 = 162' }

  - board: whiteboard
    steps:
      - say: おつかれさまでした。間違えた問題は、テキストの解説で復習しましょう。
        show:
          - { type: title, text: おつかれさまでした }
          - { type: text, text: "間違えた問題は、テキストの解説で復習しよう" }
