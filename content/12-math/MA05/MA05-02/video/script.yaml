title: 順列と組み合わせ
scenes:
  - board: whiteboard
    steps:
      - say: 「順列と組み合わせ」です。
        show:
          - { type: title, text: 順列と組み合わせ }
      - say: 順列とは、いくつかのものから選んで、順番をつけて一列に並べることです。
        show:
          - { type: text, size: l, text: "**順列** ＝ 選んで、**順番をつけて** 並べる" }
      - say: A、B、Cの3人から2人を選んで並べます。1人目はA、B、Cの3通り。2人目は、1人目以外の2通り。だから、3×2で6通りです。
        show:
          - { type: formula, tex: '3 \times 2 = 6' }
          - { type: text, color: yellow, text: "AB　AC　BA　BC　CA　CB" }

  - board: whiteboard
    steps:
      - say: n個からr個を選んで並べる順列を、nPrと書きます。nから始めて、1ずつ小さい数を、r個かけ算します。
        show:
          - { type: title, text: 順列の記号 }
          - { type: formula, size: l, color: yellow, tex: '{}_n\mathrm{P}_r = n \times (n-1) \times \cdots \times (n-r+1)' }
      - say: さっきの例は、3P2。3×2で6です。
        show:
          - { type: formula, tex: '{}_3\mathrm{P}_2 = 3 \times 2 = 6' }
      - say: n個すべてを並べる順列は、n！と書き、nの「階乗」と呼びます。たとえば、3！は3×2×1で6です。
        show:
          - { type: formula, tex: 'n! = n \times (n-1) \times \cdots \times 2 \times 1' }
          - { type: formula, tex: '3! = 3 \times 2 \times 1 = 6' }

  - board: whiteboard
    steps:
      - say: 一方、組み合わせは、順番の区別がない場合の数です。
        show:
          - { type: title, text: 組み合わせ }
          - { type: text, size: l, text: "**組み合わせ** ＝ 選ぶだけ（**順番は関係ない**）" }
      - say: 3人から2人を選ぶだけなら、ABとBAは同じグループです。だから、AB、BC、ACの3通りです。
        show:
          - { type: text, color: yellow, text: "AB ＝ BA → 1つと数える　→ AB　BC　AC の3通り" }
      - say: n個からr個を選ぶ組み合わせは、nCrと書きます。順列のnPrを、r！で割って求めます。選んだr人の並び順の分だけ、重複して数えているからです。
        show:
          - { type: formula, size: l, color: yellow, tex: '{}_n\mathrm{C}_r = \frac{{}_n\mathrm{P}_r}{r!}' }
          - { type: formula, tex: '{}_3\mathrm{C}_2 = \frac{6}{2!} = \frac{6}{2} = 3' }

  - board: whiteboard
    steps:
      - say: 見分け方のコツです。リーダーと副リーダーのように、役割や順番がある選び方は順列。委員を2人選ぶだけなら、組み合わせです。
        added: true
        show:
          - { type: title, text: 見分け方 }
          - { type: box, color: blue, w: 1000, title: 順列（P）, text: "順番・役割がある（リーダーと副リーダー、1位・2位）" }
          - { type: box, color: pink, w: 1000, title: 組み合わせ（C）, text: "選ぶだけ（委員を2人、チームのメンバー）" }
