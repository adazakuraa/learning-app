title: 練習問題 統計の基礎
scenes:
  - board: slide
    steps:
      - say: 「統計の基礎」の章の練習問題です。問題を読んだら一時停止して、考えてみましょう。
        show:
          - { type: title, text: 練習問題　統計の基礎 }
          - { type: text, size: l, text: "代表値・標準偏差・相関と因果" }

  - board: whiteboard
    steps:
      - say: 問題1。8、6、9、11、6。このデータの平均値は？
        show:
          - { type: title, text: "問題 ①" }
          - { type: text, size: l, text: "8, 6, 9, 11, 6 の平均値" }
        pause: 3
      - say: 全部足すと40。5で割って、8です。
        show:
          - { type: formula, color: green, tex: '\frac{8+6+9+11+6}{5} = \frac{40}{5} = 8' }
      - say: 計算のコツです。だいたい7を基準にして、差だけを足します。プラス1、マイナス1、プラス2、プラス4、マイナス1で、合計プラス5。5で割るとプラス1なので、7＋1で8。これを「仮の平均」といいます。
        show:
          - { type: text, size: s, color: gray, text: "仮の平均：7を基準に差（+1, −1, +2, +4, −1）の平均 +1 → 8" }

  - board: whiteboard
    steps:
      - say: 問題2。5人の年収が、3000万、350万、300万、450万、400万。平均値と中央値は？
        show:
          - { type: title, text: "問題 ②" }
          - { type: text, text: "3000万　350万　300万　450万　400万" }
        pause: 3
      - say: 平均は、合計4500万を5で割って、900万。中央値は、小さい順に並べた真ん中で、400万です。
        show:
          - { type: text, color: green, text: "平均 900万　　中央値 400万" }
      - say: 実際、日本人の年収も、平均と中央値には差があることが知られています。外れ値に引っぱられる平均だけでなく、中央値も見ることが大切です。
        show:
          - { type: text, size: s, color: gray, text: "1人の高収入（外れ値）が平均を引き上げている" }

  - board: whiteboard
    steps:
      - say: 問題3。行きは時速40キロ、帰りは時速60キロで、同じ道を往復しました。速さの平均は？
        show:
          - { type: title, text: "問題 ③" }
          - { type: text, text: "行き 時速40km　帰り 時速60km（同じ距離）" }
        pause: 4
      - say: 単純に足して2で割った50キロは、まちがいです。遅い行きのほうが、時間が長くかかるからです。
        show:
          - { type: text, color: pink, text: "(40 ＋ 60) ÷ 2 ＝ 50 は ×" }
      - say: たとえば、片道120キロとすると、行きは3時間、帰りは2時間。合計240キロを5時間で走るので、時速48キロです。
        added: true
        show:
          - { type: formula, tex: '\text{行き}\; 120 \div 40 = 3\ \text{時間} \quad \text{帰り}\; 120 \div 60 = 2\ \text{時間}' }
          - { type: formula, size: l, color: green, tex: '240 \div 5 = 48\ \text{km/時}' }

  - board: whiteboard
    steps:
      - say: 問題4。偏差値は、平均50、標準偏差10になるように調整した値。IQは、平均100、標準偏差15になるように調整した値です。偏差値60と、IQ110。より上位なのは？
        show:
          - { type: title, text: "問題 ④" }
          - { type: text, size: s, text: "偏差値：平均50・標準偏差10　　IQ：平均100・標準偏差15" }
        pause: 4
      - say: 偏差値60は、平均より標準偏差1つ分上。IQでいえば、100＋15で、115にあたります。IQ110はそれより下なので、偏差値60のほうが上位です。
        show:
          - { type: text, text: "偏差値60 ＝ 平均＋1σ ＝ IQ 115 相当" }
          - { type: text, color: green, text: "答え：偏差値60 のほうが上位" }

  - board: whiteboard
    steps:
      - say: 問題5。小学生の体力と学力の関係を調べたグラフ、散布図です。正しいものを、すべて選びましょう。
        show:
          - { type: title, text: "問題 ⑤　散布図" }
          - { type: image, src: 1000003118.webp, w: 700 }
          - type: list
            at: [800, 150]
            size: s
            w: 440
            items: ["(1) 体力が高い人ほど算数の点が高い相関がある", "(2) 学力を上げれば体力も自然と上がる", "(3) 体力をつければ頭が良くなる", "(4) 国語より算数のほうが体力との相関が強い"]
        pause: 4
      - say: 答えは、1と4です。グラフから、体力と算数の点数に正の相関が読み取れます。算数のほうが点がまとまっていて、相関が強いことも読み取れます。
        show:
          - { type: text, at: [800, 480], color: green, text: "答え：(1)(4)" }
      - say: 2と3は、どちらも「こうすれば、こうなる」という因果の主張です。この散布図からは、相関しか言えません。
        show:
          - { type: text, at: [800, 560], size: s, w: 440, color: pink, text: "(2)(3) は因果の主張 → この図からは言えない" }

  - board: whiteboard
    steps:
      - say: 問題6。健康診断の生活指導を、受けた人と受けていない人で、前の年からの血圧と体重の変化を比べたグラフです。濃い色が受けた人、薄い色が受けていない人。正しいものを、すべて選びましょう。
        show:
          - { type: title, text: "問題 ⑥　生活指導の効果" }
          - { type: image, src: 1000003120.webp, w: 720 }
          - type: list
            at: [820, 150]
            size: s
            w: 420
            items: ["(1) 指導を受けた人は体重が軽くなった", "(2) 女性より男性のほうが効果が大きい", "(3) 指導を受ければ健康になれる", "(4) 受けていない人は血圧が上がった"]
        pause: 4
      - say: 0より下に伸びている棒は、前の年より改善したことを表します。受けた人のほうが体重が大きく下がっているので、1は正しい。答えは1だけです。
        show:
          - { type: text, at: [820, 470], color: green, text: "答え：(1)" }
      - say: 2は、女性のほうが改善が大きいので逆です。4は、受けていない人も、血圧は下がっています。そして3は因果の主張。指導を自分から受けるような、健康に気をつける人だから改善しただけ、という可能性もあります。
        show:
          - { type: text, at: [820, 540], size: s, w: 420, color: pink, text: "(3)：もともと健康意識が高い人が受けただけかも（因果とは言えない）" }

  - board: whiteboard
    steps:
      - say: おつかれさまでした。グラフや数字を見たら、「平均だけでいいか」「相関か、因果か」を確かめるクセをつけましょう。
        show:
          - { type: title, text: おつかれさまでした }
          - { type: text, text: "「平均だけでいい？」「相関？ 因果？」を確かめるクセを" }
