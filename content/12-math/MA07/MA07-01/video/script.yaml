title: 等差数列
scenes:
  - board: slide
    steps:
      - say: ここから「数列」の章です。
        show:
          - { type: title, text: 第7章　数列 }
      - say: 数列とは、ある決まりで並んだ数のこと。この章では、その並びの決まりと、たくさんの数をすばやく足す方法を学びます。
        added: true
        show:
          - type: list
            items: ["等差数列", "等比数列", "数学的帰納法", "フィボナッチ数列", "練習問題"]
      - say: 貯金の利息、人口の増え方、自然の中の模様。数列は、身のまわりの「増え方」を考える道具になります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "数の並びの「決まり」を見つけ、増え方を見通せるようになる" }

  - board: whiteboard
    steps:
      - say: 1本目は、「等差数列」です。
        show:
          - { type: title, text: 等差数列 }
      - say: 1、3、5、7、9。このように、同じ差で増えていく数の並びを、等差数列といいます。この「等しい差」を、公差といいます。
        show:
          - type: svg
            w: 1000
            h: 160
            markup: |
              <g fill="currentColor" stroke="none" font-size="48" text-anchor="middle"><text x="60" y="110">1</text><text x="260" y="110">3</text><text x="460" y="110">5</text><text x="660" y="110">7</text><text x="860" y="110">9</text></g>
              <g stroke="#f3d77a"><path d="M80 50 Q160 0 240 50"/><path d="M280 50 Q360 0 440 50"/><path d="M480 50 Q560 0 640 50"/><path d="M680 50 Q760 0 840 50"/></g>
              <g fill="#f3d77a" stroke="none" font-size="26" text-anchor="middle"><text x="160" y="20">+2</text><text x="360" y="20">+2</text><text x="560" y="20">+2</text><text x="760" y="20">+2</text></g>
          - { type: text, text: "同じ差（**公差** ＝ 2）で増える → **等差数列**" }
      - say: この奇数の並びは、自然数nを使って、2n－1と書けます。nに1、2、3と入れていくと、1、3、5…と、順番に作れます。これを「一般項」といいます。
        show:
          - { type: formula, size: l, color: yellow, tex: '2n - 1' }
          - { type: text, size: s, color: gray, text: "n ＝ 1, 2, 3 … → 1, 3, 5 …（一般項）" }

  - board: whiteboard
    steps:
      - say: 等差数列の便利なところは、和がかんたんに計算できることです。1から100までの整数の和は、いくつでしょう。
        show:
          - { type: title, text: 1から100まで足すと？ }
          - { type: formula, size: l, tex: '1 + 2 + 3 + \cdots + 100 = \ ?' }
      - say: 順番に足すのは大変です。そこで、1と100、2と99、3と98…と、両はしからペアを作ります。どのペアも、合計は101です。
        show:
          - type: svg
            w: 1100
            h: 230
            markup: |
              <g fill="currentColor" stroke="none" font-size="36" text-anchor="middle"><text x="60" y="60">1</text><text x="160" y="60">2</text><text x="260" y="60">3</text><text x="420" y="60">…</text><text x="700" y="60">…</text><text x="860" y="60">98</text><text x="960" y="60">99</text><text x="1060" y="60">100</text></g>
              <path d="M60 80 Q560 260 1060 80" stroke="#f3d77a"/><path d="M160 80 Q560 220 960 80" stroke="#8fc4ff"/><path d="M260 80 Q560 180 860 80" stroke="#f4a3b8"/>
              <text x="560" y="220" font-size="28" fill="#f3d77a" stroke="none" text-anchor="middle">どのペアも 101</text>
      - say: ペアは50組。だから、101×50で、5050です。
        show:
          - { type: formula, size: l, color: green, tex: '101 \times 50 = 5050' }
      - say: この方法を見つけたのは、数学者のガウス。小学生のころ、先生に「1から100まで足しなさい」と言われて、すぐに答えたという話が残っています。
        show:
          - { type: text, size: s, color: gray, text: "ガウスの逸話：先生が驚いた、すばやい計算" }

  - board: whiteboard
    steps:
      - say: この考え方を、公式にしたものがこちらです。わかっている情報によって、2つの式を使い分けます。
        show:
          - { type: title, text: 等差数列の和の公式 }
      - say: 1つ目は、最初の数、つまり初項aと、最後の数、末項lがわかっているとき。項数をnとすると、和は、n×（a＋l）÷2です。さっきのペアの考え方そのものですね。
        show:
          - { type: formula, size: l, color: yellow, tex: 'S_n = \frac{1}{2}n(a + l)' }
          - { type: text, size: s, color: gray, text: "初項 a・末項 l・項数 n がわかっているとき" }
      - say: 2つ目は、初項aと、公差dがわかっているとき。和は、こちらの式で求められます。
        show:
          - { type: formula, size: l, color: blue, tex: 'S_n = \frac{1}{2}n\{2a + (n-1)d\}' }
          - { type: text, size: s, color: gray, text: "初項 a・公差 d・項数 n がわかっているとき" }
