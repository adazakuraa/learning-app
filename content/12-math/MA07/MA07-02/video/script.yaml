title: 等比数列
scenes:
  - board: whiteboard
    steps:
      - say: 「等比数列」です。
        show:
          - { type: title, text: 等比数列 }
      - say: 2、4、8、16、32。このように、同じ倍率で増えていく数の並びを、等比数列といいます。この倍率を、公比といいます。この場合は、2倍です。
        show:
          - type: svg
            w: 1000
            h: 160
            markup: |
              <g fill="currentColor" stroke="none" font-size="48" text-anchor="middle"><text x="60" y="110">2</text><text x="260" y="110">4</text><text x="460" y="110">8</text><text x="660" y="110">16</text><text x="860" y="110">32</text></g>
              <g stroke="#f3d77a"><path d="M80 50 Q160 0 240 50"/><path d="M280 50 Q360 0 440 50"/><path d="M480 50 Q560 0 640 50"/><path d="M680 50 Q760 0 840 50"/></g>
              <g fill="#f3d77a" stroke="none" font-size="26" text-anchor="middle"><text x="160" y="20">×2</text><text x="360" y="20">×2</text><text x="560" y="20">×2</text><text x="760" y="20">×2</text></g>
          - { type: text, text: "同じ倍率（**公比** ＝ 2）で増える → **等比数列**" }
      - say: この数列の一般項は、2のn乗です。一般には、初項×公比の、n－1乗で表せます。
        show:
          - { type: formula, size: l, color: yellow, tex: 'a_n = 2^n \qquad （一般に\; a \times r^{\,n-1}）' }

  - board: whiteboard
    steps:
      - say: 等比数列にも、和の公式があります。初項a、公比r、項数nの和は、こうなります。
        show:
          - { type: title, text: 等比数列の和 }
          - { type: formula, size: l, color: yellow, tex: 'S_n = \frac{a(r^n - 1)}{r - 1} \quad (r \neq 1)' }
      - say: たとえば、1、2、4、8…という数列の、最初の10個の和は、1×（2の10乗－1）÷（2－1）で、1023です。
        show:
          - { type: formula, tex: '1 + 2 + 4 + \cdots + 512 = \frac{1 \times (2^{10} - 1)}{2 - 1} = 1023' }

  - board: whiteboard
    steps:
      - say: いちばん身近な応用が、「複利」の計算です。
        show:
          - { type: title, text: 複利の力 }
      - say: 100万円を、年5％の複利で増やすと、1年後は105万円。2年後は、105万円の5％が増えて、110.25万円。増えた分にも、また利息がつくのが複利です。
        show:
          - { type: text, text: "100万 → 105万 → 110.25万 → …（毎年 ×1.05）" }
      - say: 10年後には約163万円、20年後には約265万円になります。
        show:
          - type: svg
            w: 1100
            h: 330
            markup: |
              <path d="M60 300 H1060" stroke="#9aa3ad"/><path d="M60 300 V20" stroke="#9aa3ad"/>
              <path d="M60 250 L1060 108" stroke="#8fc4ff" stroke-dasharray="10 8"/>
              <polyline points="60,250 110,243 160,235 210,228 260,219 310,211 360,202 410,192 460,182 510,171 560,160 610,149 660,137 710,124 760,110 810,96 860,82 910,66 960,50 1010,33 1060,15" stroke="#f3d77a"/>
              <g font-size="24" stroke="none"><text x="800" y="150" fill="#8fc4ff">単利：20年後 200万</text><text x="700" y="25" fill="#f3d77a">複利：20年後 約265万</text><text x="40" y="325" fill="#9aa3ad">0年</text><text x="1020" y="325" fill="#9aa3ad">20年</text></g>
      - say: 毎年5万円ずつ増える単利は、等差数列。複利は、等比数列です。20年後の差は、歴然ですね。
        show:
          - { type: text, size: s, color: gray, text: "単利 ＝ 等差数列（毎年 ＋5万）　複利 ＝ 等比数列（毎年 ×1.05）" }
      - say: 「複利は人類最大の発明だ」と、アインシュタインが言ったとされています。本当に言ったかはわかりませんが、等比数列的な成長の力をよく表した言葉です。
        show:
          - { type: box, color: yellow, w: 1000, text: "「複利は人類最大の発明」（アインシュタインの言葉とされる。真偽は不明）" }
