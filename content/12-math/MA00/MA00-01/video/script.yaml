title: 数学とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、数学がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 数学とは
      - say: 数学では、数と計算、方程式、関数、確率、統計、数列、指数・対数、三角関数、微分までを、身近な例を使いながら学びます。
        show:
          - type: box
            w: 1100
            text: 数学では、数と計算、方程式、関数、確率、統計、数列、指数・対数、三角関数、微分までを、身近な例を使いながら学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で12章です。第1章は数と計算の基礎、第2章は文字と式・方程式、第3章は関数とグラフ、第4章は集合と論理、第5章は場合の数と確率、第6章は統計の基礎、第7章は数列と規則性、第8章は整数論、第9章は指数・対数、第10章は三角関数、第11章は微分、第12章はその他。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　数と計算の基礎
              - 第2章　文字と式・方程式
              - 第3章　関数とグラフ
              - 第4章　集合と論理
              - 第5章　場合の数と確率
              - 第6章　統計の基礎
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第7章　数列と規則性
              - 第8章　整数論
              - 第9章　指数・対数
              - 第10章　三角関数
              - 第11章　微分
              - 第12章　その他
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、数学を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、筋道を立てて考える力がつく。条件を整理し、一歩ずつ答えに近づく。数学の考え方は、仕事や生活の問題解決にもそのまま使えます。
        show:
          - type: box
            w: 1100
            text: |-
              **筋道を立てて考える力がつく**
              条件を整理し、一歩ずつ答えに近づく。数学の考え方は、仕事や生活の問題解決にもそのまま使えます。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、数字にだまされなくなる。確率や統計がわかると、「〇〇%が効果を実感」のような数字の意味を、正しく読めるようになります。
        read: ふたつ目は、数字にだまされなくなる。確率や統計がわかると、「〇〇パーセントが効果を実感」のような数字の意味を、正しく読めるようになります。
        show:
          - type: box
            w: 1100
            text: |-
              **数字にだまされなくなる**
              確率や統計がわかると、「〇〇%が効果を実感」のような数字の意味を、正しく読めるようになります。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、ほかの学問の土台になる。物理、経済、情報、心理学。多くの学問は、数学の考え方を使っています。
        show:
          - type: box
            w: 1100
            text: |-
              **ほかの学問の土台になる**
              物理、経済、情報、心理学。多くの学問は、数学の考え方を使っています。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、ローンや投資の利息を計算するとき、統計やグラフでデータを読むとき、プログラミングやデータ分析を学ぶとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - ローンや投資の利息を計算するとき
              - 統計やグラフでデータを読むとき
              - プログラミングやデータ分析を学ぶとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、公式は意味を理解してから使う。そして、例題は自分の手で解いてみる。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・公式は**意味を理解してから**使う
              ・例題は自分の手で解いてみる
            color: pink
            at:
              - 80
              - 420
