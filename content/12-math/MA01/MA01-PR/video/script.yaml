# MA01 練習問題（MA01-02 の問題）
title: 練習問題 数と計算の基礎
scenes:
  - board: slide
    steps:
      - say: この章の練習問題です。問題を読んだら、動画を一時停止して考えてみましょう。解き方の説明は、そのあとに続きます。
        show:
          - { type: title, text: 練習問題　数と計算の基礎 }
          - { type: text, size: l, text: "問題 → 少し考える時間 → 解き方" }

  - board: whiteboard
    steps:
      - say: 問題1。2の4乗かける2の6乗はいくつでしょう。
        show:
          - { type: title, text: "問題 ①" }
          - { type: formula, size: l, tex: '2^4 \times 2^6 = \ ?' }
        pause: 3
      - say: 同じ数の累乗どうしのかけ算は、「何乗」の部分をそのまま足せます。4+6で、2の10乗です。
        show:
          - { type: formula, color: yellow, tex: '2^4 \times 2^6 = 2^{4+6} = 2^{10}' }
      - say: 2の10乗は1024。「指数と累乗」の単元で出てきた、折り紙を10回折ると1024層になる話と同じ数ですね。
        show:
          - { type: formula, size: l, color: green, tex: '2^{10} = 1024' }

  - board: whiteboard
    steps:
      - say: 問題2。-51、109、√5、112/35を、自然数、有理数、無理数、その他に分けてみましょう。
        show:
          - { type: title, text: "問題 ②" }
          - { type: text, size: l, text: "-51　　109　　√5　　112/35" }
          - { type: text, size: s, color: gray, text: "自然数・有理数・無理数・その他 に分類" }
        pause: 3
      - say: 109は、0より大きい整数なので自然数。112/35は分数で表されているので有理数です。
        show:
          - { type: text, text: "109 → **自然数**　　112/35 → **有理数**" }
      - say: √5は、2乗すると5になる数で、2.236…と小数が終わりません。分数で表せないので無理数です。
        added: true
        show:
          - { type: text, text: "√5 = 2.236… → **無理数**" }
      - say: -51は負の数なので、自然数ではありません。でも整数です。さっきの図のとおり、整数は-51/1のように分数で書けるので、-51は有理数です。
        show:
          - { type: text, text: "-51 → 自然数ではないが整数 → **有理数**" }
          - { type: text, size: s, color: gray, text: "※ -51 = -51/1 と分数で書ける" }

  - board: whiteboard
    steps:
      - say: 問題3。√4を整数で表すといくつでしょう。
        show:
          - { type: title, text: "問題 ③" }
          - { type: formula, size: l, tex: '\sqrt{4} = \ ?' }
        pause: 3
      - say: √4は「2乗したら4になる数」という意味です。そういう数は、2と-2の2つがあります。
        show:
          - { type: formula, tex: '2 \times 2 = 4 \qquad (-2) \times (-2) = 4' }
      - say: ただし、ふつう√は正の数のほうを表します。-2を表したいときは「-√4」と書きます。だから答えは2です。
        show:
          - { type: formula, size: l, color: green, tex: '\sqrt{4} = 2 \qquad -\sqrt{4} = -2' }

  - board: whiteboard
    steps:
      - say: 問題4。3対5は、四角対125。四角に入る数はいくつでしょう。
        show:
          - { type: title, text: "問題 ④" }
          - { type: formula, size: l, tex: '3 : 5 = \square : 125' }
        pause: 3
      - say: 比の式では、内側どうしのかけ算と、外側どうしのかけ算が等しくなります。
        show:
          - { type: formula, color: yellow, tex: '5 \times \square = 3 \times 125' }
      - say: 3×125は375。375を5で割って、答えは75です。
        show:
          - { type: formula, size: l, color: green, tex: '\square = 375 \div 5 = 75' }

  - board: whiteboard
    steps:
      - say: 問題5。ある本の3/5まで読んだとき、残りが160ページあった。本は全部で何ページでしょう。
        show:
          - { type: title, text: "問題 ⑤" }
          - { type: text, text: "本の 3/5 まで読んだ → 残り 160ページ。全部で何ページ？" }
        pause: 3
      - say: 全体を1とすると、読み終えたのが3/5なので、残りは2/5。この2/5が160ページにあたります。
        show:
          - type: svg
            w: 1000
            h: 120
            markup: |
              <rect x="10" y="20" width="600" height="60" fill="currentColor" fill-opacity="0.18"/>
              <rect x="610" y="20" width="400" height="60"/>
              <g fill="currentColor" stroke="none" font-size="28"><text x="230" y="60">読んだ 3/5</text><text x="700" y="60">残り 2/5 = 160</text></g>
      - say: 2/5で160ページなら、1/5は80ページ。全体の5/5は、80×5で400ページです。
        show:
          - { type: formula, size: l, color: green, tex: '160 \div 2 = 80 \quad\rightarrow\quad 80 \times 5 = 400' }

  - board: whiteboard
    steps:
      - say: 問題6。分速40メートルは、時速何キロメートルでしょう。
        show:
          - { type: title, text: "問題 ⑥" }
          - { type: text, text: "分速 40m は 時速 何km？" }
        pause: 3
      - say: 1分で40メートル進むなら、60分、つまり1時間では、40×60で2400メートル進みます。
        show:
          - { type: formula, tex: '40 \times 60 = 2400\ \text{m}' }
      - say: 1000メートルが1キロメートルなので、2400メートルは2.4キロメートル。答えは時速2.4キロメートルです。
        show:
          - { type: formula, size: l, color: green, tex: '2400\ \text{m} = 2.4\ \text{km} \;\rightarrow\; \text{時速}\ 2.4\ \text{km}' }

  - board: whiteboard
    steps:
      - say: 問題7。目的地まで2.4キロメートル。分速60メートルで歩くと、何分かかるでしょう。
        show:
          - { type: title, text: "問題 ⑦" }
          - { type: text, text: "2.4km を 分速60m で歩くと 何分？" }
        pause: 3
      - say: 単位をそろえます。2.4キロメートルは2400メートル。これを1分に進む60メートルで割ると、40分です。
        show:
          - { type: formula, size: l, color: green, tex: '2400 \div 60 = 40\ \text{分}' }

  - board: whiteboard
    steps:
      - say: 問題8。原価1200円の商品に、2割の利益を見込んで定価をつけました。定価はいくらでしょう。
        show:
          - { type: title, text: "問題 ⑧" }
          - { type: text, text: "原価1200円 ＋ 2割の利益 → 定価は？" }
        pause: 3
      - say: 2割の利益を足すということは、原価の1.2倍にするということです。1200×1.2で、1440円です。
        show:
          - { type: formula, size: l, color: green, tex: '1200 \times 1.2 = 1440\ \text{円}' }
      - say: ちなみに、12×12=144のような数を覚えておくと、こういう計算がすぐにできます。11×11=121、15×15=225なども有名です。
        show:
          - { type: text, size: s, color: gray, text: "12×12=144　11×11=121　15×15=225" }

  - board: whiteboard
    steps:
      - say: 問題9。定価1000円の商品を2割引にし、さらにそこから3割引にしました。値段はいくらでしょう。
        show:
          - { type: title, text: "問題 ⑨" }
          - { type: text, text: "1000円 → 2割引 → さらに3割引 → いくら？" }
        pause: 3
      - say: 2割引は0.8倍なので、800円。そこからさらに3割引は0.7倍なので、800×0.7で560円です。
        show:
          - { type: formula, tex: '1000 \times 0.8 = 800' }
          - { type: formula, size: l, color: green, tex: '800 \times 0.7 = 560\ \text{円}' }
      - say: 2割と3割を足して5割引、つまり500円にはならないことに注意しましょう。
        show:
          - { type: box, color: pink, w: 760, title: 注意, text: "2割引＋3割引 ≠ 5割引" }

  - board: whiteboard
    steps:
      - say: おつかれさまでした。間違えた問題は、テキストの解説ももう一度読んでみましょう。
        show:
          - { type: title, text: おつかれさまでした }
          - { type: text, text: "間違えた問題は、テキストの解説で復習しよう" }
