title: 練習問題 証明と推定
scenes:
  - board: slide
    steps:
      - say: 「証明と推定」の章の練習問題です。数学の最後の練習問題です。
        show:
          - { type: title, text: 練習問題　証明と推定 }
          - { type: text, size: l, text: "背理法 と フェルミ推定" }

  - board: whiteboard
    steps:
      - say: 問題1。有理数と無理数の和は、無理数になります。このことを、背理法で証明しましょう。
        show:
          - { type: title, text: "問題 ①　背理法" }
          - { type: text, text: "有理数 ＋ 無理数 ＝ 無理数 であることを証明せよ" }
        pause: 4
      - say: 解答です。有理数をa、無理数をxとします。そして、反対を仮定します。a＋xが、有理数bになると仮定するのです。
        show:
          - { type: text, text: "仮定：a ＋ x ＝ b が **有理数** になるとする" }
      - say: すると、x＝b－a。右辺は、有理数から有理数を引いたものなので、有理数です。でも、左辺のxは無理数でした。無理数が有理数に等しい。これは矛盾です。
        show:
          - { type: formula, tex: 'x = b - a \quad (\text{右辺は有理数})' }
          - { type: text, color: pink, text: "x は無理数なのに、有理数と等しい → **矛盾**" }
      - say: よって、仮定がまちがっていました。有理数と無理数の和は、無理数になります。
        show:
          - { type: text, color: green, text: "仮定がまちがい → 有理数 ＋ 無理数 ＝ 無理数" }

  - board: whiteboard
    steps:
      - say: 問題2。東京のラーメン店1店の、お昼の時間、11時から13時までの売上を、フェルミ推定で見積もりましょう。
        show:
          - { type: title, text: "問題 ②　ラーメン店の売上" }
          - { type: text, text: "東京のラーメン店1店、11時〜13時の売上は？" }
        pause: 4
      - say: 解答です。売上は、「客単価×客の数」で求められます。客単価、つまり1人が払う金額を、平均1000円とします。
        show:
          - { type: formula, color: yellow, tex: '\text{売上} = \text{客単価} \times \text{客の数}' }
          - { type: text, text: "客単価 ≒ 1000円" }
      - say: 1人が店にいる時間を、平均30分とします。お昼の時間は2時間なので、1つの席に、4人が入れ替わりで座る計算です。席の数を15とすると、15×4で60人です。
        show:
          - { type: text, text: "1席あたり 2時間 ÷ 30分 ＝ 4人　×　15席 ＝ 60人" }
      - say: だから、売上は、1000円×60人で、6万円と見積もれます。これは一つの回答例です。席がいつも満席とは限らない、など、仮定を変えて考えてみるのもよい練習になります。
        show:
          - { type: formula, size: l, color: green, tex: '1000 \times 60 = 60000\ \text{円}' }
          - { type: text, size: s, color: gray, text: "回答例。仮定（満席率など）を変えて考えてみよう" }

  - board: whiteboard
    steps:
      - say: おつかれさまでした。これで、数学の章はすべて終わりです。数の種類から微分まで、少しずつ、つながりが見えてきたでしょうか。
        show:
          - { type: title, text: 数学、おつかれさまでした！ }
          - { type: text, text: "数の種類 → 式 → 関数 → 確率・統計 → 微分 → 証明" }
