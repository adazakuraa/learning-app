title: フェルミ推定
scenes:
  - board: whiteboard
    steps:
      - say: 「フェルミ推定」です。
        show:
          - { type: title, text: フェルミ推定 }
      - say: 日本の世帯数は、どれくらいでしょう。東京都内のコンビニは、何店舗あるでしょう。正確な数はわからなくても、筋の通った仮定を積み重ねれば、現実的な見積もりが出せます。これがフェルミ推定です。
        show:
          - { type: text, text: "「日本の世帯数は？」「都内のコンビニは何店舗？」" }
          - { type: box, color: yellow, w: 1000, text: "筋の通った仮定を積み重ねて、ざっくり見積もる ＝ **フェルミ推定**" }

  - board: whiteboard
    steps:
      - say: 日本の世帯数を考えてみましょう。日本の人口は、ざっくり1億2000万人です。
        show:
          - { type: title, text: 日本の世帯数を推定 }
          - { type: text, text: "人口 ≒ 1.2億人" }
      - say: 1世帯の人数は、2人の夫婦、3人の親子、4人以上の家族など、いろいろです。ざっくり平均を、3人とします。
        show:
          - { type: text, text: "1世帯の人数 ≒ 平均3人（と仮定）" }
      - say: すると、1億2000万÷3で、4000万世帯、と推定できます。
        show:
          - { type: formula, size: l, color: yellow, tex: '1.2\text{億} \div 3 = 4000\text{万世帯}' }
      - say: 実際の世帯数は、およそ5500万。ぴったりではありませんが、「数千万」という桁、つまり、おおまかな規模は合っています。
        show:
          - { type: text, color: green, text: "実際 ≒ 5500万 → 桁（数千万）は合っている" }

  - board: whiteboard
    steps:
      - say: フェルミ推定の本質は、正確な答えを出すことではありません。「どの要素が大事か」「だいたい、どの桁か」をつかむことです。
        show:
          - { type: title, text: フェルミ推定の本質 }
          - { type: box, color: blue, w: 1000, text: "正確さより「どの要素が大事か」「どの桁か」をつかむ" }
      - say: 今の例なら、実際より少なく出たのは、「1世帯の平均人数」を多めに見積もったからかもしれません。一人暮らしの人が多いのかも、と考えを深められますね。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "ずれの理由を考える → 一人暮らしが多い？（平均人数の見直し）" }
      - say: 限られた情報から、筋道立てて考える力。フェルミ推定は、論理的な思考を鍛える練習にもなります。
        show:
          - { type: text, color: yellow, text: "限られた情報から、筋道立てて考える練習になる" }
