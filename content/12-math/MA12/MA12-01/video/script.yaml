title: 背理法
scenes:
  - board: slide
    steps:
      - say: ここから、数学の最後の章、「証明と推定」です。
        show:
          - { type: title, text: 第12章　証明と推定 }
      - say: この章では、ちょっと変わった証明の方法、背理法と、限られた情報から数をざっくり見積もる、フェルミ推定を学びます。
        added: true
        show:
          - type: list
            items: ["背理法", "フェルミ推定", "練習問題"]
      - say: どちらも、数学の外、ふだんの議論や仕事でも使える、考え方の道具です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "筋道立てて考える「頭の使い方」を、日常でも使えるようにする" }

  - board: whiteboard
    steps:
      - say: 1本目は「背理法」です。
        show:
          - { type: title, text: 背理法 }
      - say: 背理法とは、証明したいことの反対を、いったん「正しい」と仮定して、そこから矛盾、つまり、つじつまの合わないことを導く方法です。
        show:
          - { type: text, text: "① 証明したいことの **反対** を仮定する" }
          - { type: text, text: "② そこから **矛盾** を導く" }
          - { type: text, color: yellow, text: "③ 仮定がまちがい → もとの命題が正しい" }
      - say: 「もし、これがまちがっていたら、どうなるか」を考えて、真実に迫るのです。
        show:
          - { type: text, size: s, color: gray, text: "「もし違っていたら、どうなる？」から考える" }

  - board: whiteboard
    steps:
      - say: かんたんな例で使ってみましょう。「私は犯人ではない」ことを証明したい。そして、私にはアリバイがある、とします。
        show:
          - { type: title, text: 例：私は犯人ではない }
          - { type: text, text: "条件：私には **アリバイ** がある（事件の時刻、別の場所にいた）" }
      - say: まず、反対の「私が犯人である」と仮定します。犯人なら、事件の時刻に現場にいたはずです。でも、私にはアリバイがあり、その時刻は別の場所にいました。これは矛盾です。
        show:
          - { type: box, color: pink, w: 1000, title: 仮定：私が犯人だとすると…, text: "事件の時刻に現場にいたはず ⇔ でも別の場所にいた（アリバイ）→ **矛盾**" }
      - say: つまり、最初の仮定がまちがっていた。だから、「私は犯人ではない」と言えます。推理小説の探偵がよく使う考え方ですね。
        show:
          - { type: text, color: green, text: "仮定がまちがい → 私は犯人ではない" }
      - say: 背理法は、まっすぐ証明するのがむずかしいことを証明するときに使われます。たとえば、「√2が分数で表せない」ことの証明も、背理法で行います。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "例：「√2 は分数で表せない（無理数）」の証明も背理法" }
