title: 練習問題 集合と論理
scenes:
  - board: slide
    steps:
      - say: 「集合と論理」の章の練習問題です。ベン図と対偶を使いこなしましょう。問題を読んだら一時停止して、考えてみましょう。
        show:
          - { type: title, text: 練習問題　集合と論理 }
          - { type: text, size: l, text: "道具：ベン図 ／ 対偶" }

  - board: whiteboard
    steps:
      - say: 問題1。41人のクラスで、電車を使う人が31人、バスを使う人が16人、両方使う人が9人でした。電車もバスも使わない人は何人でしょう。
        show:
          - { type: title, text: "問題 ①　電車とバス" }
          - { type: text, size: s, text: "全体41人　電車31人　バス16人　両方9人 → どちらも使わない人は？" }
        pause: 4
      - say: ベン図で考えます。電車かバスを使う人、つまり和集合は、31＋16から、両方使う9人を引いて、38人。両方使う人を二重に数えないよう、引くのがポイントです。
        show:
          - type: svg
            at: [80, 230]
            w: 640
            h: 380
            color: blue
            markup: |
              <rect x="10" y="10" width="620" height="360" rx="8" stroke="#9aa3ad"/>
              <circle cx="240" cy="190" r="140"/><circle cx="400" cy="190" r="120" stroke="#f4a3b8"/>
              <g fill="currentColor" stroke="none" font-size="26"><text x="120" y="120">電車31</text></g>
              <text x="440" y="110" font-size="26" fill="#f4a3b8" stroke="none">バス16</text>
              <text x="305" y="200" font-size="26" fill="#f3d77a" stroke="none">両方9</text>
              <text x="30" y="350" font-size="24" fill="#9aa3ad" stroke="none">どちらも使わない ＝ ?</text>
          - { type: formula, at: [760, 260], tex: '31 + 16 - 9 = 38' }
      - say: 全体41人から38人を引いて、どちらも使わない人は3人です。
        show:
          - { type: formula, at: [760, 360], size: l, color: green, tex: '41 - 38 = 3\ \text{人}' }

  - board: whiteboard
    steps:
      - say: 問題2。1から100までの数のうち、3の倍数でも5の倍数でもないものは、いくつあるでしょう。
        show:
          - { type: title, text: "問題 ②　倍数の数" }
        pause: 4
      - say: 3の倍数は、100÷3で33個。5の倍数は、100÷5で20個。両方の倍数、つまり15の倍数は、100÷15で6個です。
        show:
          - { type: text, text: "3の倍数 33個　5の倍数 20個　15の倍数（両方）6個" }
      - say: 3の倍数または5の倍数は、33＋20－6で47個。それ以外は、100－47で53個です。
        show:
          - { type: formula, tex: '33 + 20 - 6 = 47' }
          - { type: formula, size: l, color: green, tex: '100 - 47 = 53\ \text{個}' }

  - board: whiteboard
    steps:
      - say: 問題3。「x²＝4ならば、x＝2である」。これは真でしょうか、偽でしょうか。
        show:
          - { type: title, text: "問題 ③" }
          - { type: formula, size: l, tex: 'x^2 = 4 \Rightarrow x = 2\ \ ?' }
        pause: 3
      - say: x²＝4になるのは、x＝2だけでなく、x＝－2のときもあります。必ずx＝2とは言えないので、偽です。
        show:
          - { type: formula, tex: '(-2)^2 = 4' }
          - { type: text, color: green, text: "答え：偽（x ＝ －2 の場合もある）" }

  - board: whiteboard
    steps:
      - say: 問題4。「すべての男性は優しい」という命題が偽のとき、確実に言えるのはどれでしょう。
        show:
          - { type: title, text: "問題 ④" }
          - type: list
            size: s
            items: ["1 すべての男性は優しくない", "2 すべての女性は優しい", "3 ある男性は優しくない", "4 優しくなければ男性でない", "5 ある女性は優しい"]
        pause: 4
      - say: 「すべての男性が優しい」が正しくない、ということは、優しくない男性が、少なくとも1人はいる、ということです。だから答えは3。
        show:
          - { type: text, color: green, text: "答え：3（優しくない男性が少なくとも1人いる）" }
      - say: 1の「すべての男性が優しくない」までは言えません。女性については何も言っていないので、2と5もわかりません。4は、優しくない男性がいるので、正しくありません。
        show:
          - { type: text, size: s, color: gray, text: "「すべて〜ではない」の否定は「〜でないものが少なくとも1つある」" }

  - board: whiteboard
    steps:
      - say: 問題5。ある小学校で調べたところ、次のことがわかりました。ア、算数が得意な生徒は、国語が得意ではない。イ、理科が得意な生徒は、社会が得意ではない。ウ、理科が得意でない生徒は、国語が得意である。
        show:
          - { type: title, text: "問題 ⑤" }
          - type: list
            size: s
            items: ["ア：算数得意 ⇒ 国語得意でない", "イ：理科得意 ⇒ 社会得意でない", "ウ：理科得意でない ⇒ 国語得意"]
      - say: 確実に言えるのはどれでしょう。1、国語が得意な生徒は社会が得意。2、算数が得意な生徒は社会が得意。3、理科が得意な生徒は算数が得意。4、社会が得意な生徒は算数が得意ではない。5、理科が得意な生徒は他にも得意な科目がある。
        show:
          - type: list
            size: s
            items: ["1 国語得意 ⇒ 社会得意", "2 算数得意 ⇒ 社会得意", "3 理科得意 ⇒ 算数得意", "4 社会得意 ⇒ 算数得意でない", "5 理科得意 ⇒ 他にも得意科目がある"]
        pause: 4
      - say: 対偶を使って、矢印をつなげます。イの対偶は「社会が得意なら、理科は得意でない」。それにウをつなげると「国語が得意」。さらにアの対偶「国語が得意なら、算数は得意でない」をつなげます。
        show:
          - { type: text, color: yellow, text: "社会得意 →（イの対偶）理科得意でない →（ウ）国語得意 →（アの対偶）算数得意でない" }
      - say: つまり、社会が得意な生徒は算数が得意ではない。答えは4です。
        show:
          - { type: text, color: green, text: "答え：4" }

  - board: whiteboard
    steps:
      - say: 問題6。次のA、B、Cから正しく導かれるのはどれでしょう。A、まじめな人は女性に人気がある。B、仕事熱心な人はまじめである。C、まじめな人は上司からの信頼がある。
        show:
          - { type: title, text: "問題 ⑥" }
          - type: list
            size: s
            items: ["A：まじめ ⇒ 女性に人気", "B：仕事熱心 ⇒ まじめ", "C：まじめ ⇒ 上司の信頼"]
      - say: 選択肢は、1、女性に人気のある人は上司からの信頼が厚い。2、仕事熱心でない人は女性に人気がない。3、上司から信頼が厚くない人は仕事熱心でない。4、女性に人気のない人は上司からの信頼が厚くない。5、上司から信頼の厚い人は仕事熱心である。
        show:
          - type: list
            size: s
            items: ["1 女性に人気 ⇒ 上司の信頼", "2 仕事熱心でない ⇒ 女性に人気がない", "3 上司の信頼がない ⇒ 仕事熱心でない", "4 女性に人気がない ⇒ 上司の信頼がない", "5 上司の信頼 ⇒ 仕事熱心"]
        pause: 4
      - say: Cの対偶は「上司の信頼が厚くない人は、まじめでない」。Bの対偶は「まじめでない人は、仕事熱心でない」。2つをつなげると、選択肢3になります。答えは3です。
        show:
          - { type: text, color: yellow, text: "上司の信頼なし →（Cの対偶）まじめでない →（Bの対偶）仕事熱心でない" }
          - { type: text, color: green, text: "答え：3" }

  - board: whiteboard
    steps:
      - say: おつかれさまでした。論理の問題は、対偶を使って矢印をつなげるのがコツです。テキストの解説でも、復習しておきましょう。
        show:
          - { type: title, text: おつかれさまでした }
          - { type: text, text: "コツ：対偶を使って、矢印をつなげる" }
