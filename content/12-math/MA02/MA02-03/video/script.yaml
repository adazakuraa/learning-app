title: 連立方程式
scenes:
  - board: whiteboard
    steps:
      - say: 「連立方程式」です。
        show:
          - { type: title, text: 連立方程式 }
      - say: わからない数、つまり未知数が、xとyの2つある場合を考えます。
        show:
          - { type: text, text: "未知数（変数）が **x と y の2つ**" }
      - say: たとえば、x＋y＝5という式。x＝1、y＝4でも、x＝2、y＝3でも成り立ちます。式が1つだけだと、答えが無数にあって決まりません。
        show:
          - { type: formula, size: l, tex: 'x + y = 5' }
          - { type: text, text: "(1, 4)　(2, 3)　(3, 2)　(4, 1)　… 無数にある" }
      - say: たとえるなら、「りんごとみかんを合わせて5個買った」と言われても、それぞれ何個かはわかりませんね。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "例：「りんごとみかん、合わせて5個」だけでは、それぞれの数はわからない" }

  - board: whiteboard
    steps:
      - say: そこに、もう一つの条件、x－y＝1を加えます。
        show:
          - { type: title, text: 条件をもう一つ加える }
          - { type: formula, tex: '\text{①}\; x + y = 5' }
          - { type: formula, color: yellow, tex: '\text{②}\; x - y = 1' }
      - say: すると、2つの式を両方満たすのは、x＝3、y＝2だけ。答えがひとつに決まります。このように、複数の式を組み合わせて解くのが、連立方程式です。
        show:
          - { type: formula, size: l, color: green, tex: 'x = 3,\; y = 2' }

  - board: whiteboard
    steps:
      - say: 実際に解いてみましょう。ステップ1。どちらかの式を、「x＝」の形にします。②の式の、マイナスyを右に移すと、x＝y＋1。これを③とします。
        show:
          - { type: title, text: 解き方（代入法） }
          - { type: text, size: s, color: gray, text: "ステップ1：「x ＝ ～」の形にする" }
          - { type: formula, tex: 'x - y = 1 \;\rightarrow\; x = y + 1 \quad \text{…③}' }
      - say: ステップ2。③を、使っていない①の式のxに代入します。
        show:
          - { type: text, size: s, color: gray, text: "ステップ2：もう一つの式に代入する" }
          - { type: formula, tex: '(y + 1) + y = 5' }
      - say: ステップ3。計算すると、2y＋1＝5、2y＝4、y＝2です。
        show:
          - { type: text, size: s, color: gray, text: "ステップ3：y を求める" }
          - { type: formula, tex: '2y + 1 = 5 \;\rightarrow\; 2y = 4 \;\rightarrow\; y = 2' }
      - say: ステップ4。y＝2を③に入れると、x＝2＋1で、x＝3。解は、x＝3、y＝2です。
        show:
          - { type: text, size: s, color: gray, text: "ステップ4：x を求める" }
          - { type: formula, color: green, tex: 'x = 2 + 1 = 3' }

  - board: whiteboard
    steps:
      - say: 大事なのは、「条件の数と、未知数の数が一致すると、解が決まる」ということです。
        show:
          - { type: title, text: 大事なポイント }
          - { type: box, color: yellow, w: 1000, text: "未知数の数 ＝ 式（条件）の数 → 解がひとつに決まる" }
      - say: 未知数がxとyの2つなら、式も2つ必要でした。もし未知数が3つなら、式も3つないと、解は決まりません。
        show:
          - { type: text, text: "未知数 2つ → 式 2つ" }
          - { type: text, text: "未知数 3つ → 式 3つ" }
      - say: わからないことが増えたら、その分だけ手がかりが必要。そう考えると、自然ですね。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "わからないことの数だけ、手がかり（条件）が必要" }
