title: 一次方程式
scenes:
  - board: whiteboard
    steps:
      - say: 「一次方程式」です。
        show:
          - { type: title, text: 一次方程式 }
      - say: xのような変数が入った等式を、「方程式」といいます。
        show:
          - { type: formula, size: l, tex: '2x + 3 = 9' }
      - say: その中でも、xの2乗や3乗が出てこない、ただのxだけの方程式を「一次方程式」といいます。
        show:
          - { type: text, text: "**一次方程式** … x² や x³ が出てこない（x だけ）" }
          - { type: text, size: s, color: gray, text: "例：2x + 3 = 9 は一次方程式　　x² + 1 = 5 は一次ではない" }

  - board: whiteboard
    steps:
      - say: 「方程式を解く」とは、xに何を入れれば、左と右が等しくなるかを考えることです。
        show:
          - { type: title, text: 方程式を解くとは }
          - { type: formula, size: l, tex: '2x + 3 = 9' }
      - say: たとえば、x＝3を入れてみると、2×3＋3で9。左右が等しくなりました。
        show:
          - { type: formula, color: green, tex: 'x = 3 \;\rightarrow\; 2 \times 3 + 3 = 9' }
      - say: このx＝3が、この方程式の「解」です。
        show:
          - { type: box, color: yellow, w: 700, text: "等式が成り立つ x の値 ＝ **解**" }

  - board: whiteboard
    steps:
      - say: では、どうやって解を見つけるのか。基本は、「両辺に同じ操作をしても、等式は保たれる」という原則です。
        show:
          - { type: title, text: 天秤で考えよう }
      - say: 天秤を想像してください。左右がつりあっているとき、両側に同じ重さを足しても、同じ重さを取り除いても、つりあいは保たれます。
        show:
          - type: svg
            at: [100, 150]
            w: 1080
            h: 300
            color: blue
            markup: |
              <path d="M540 60 V260"/><path d="M440 260 H640"/>
              <path d="M200 80 H880"/>
              <path d="M240 80 L190 170 H330 L280 80"/><path d="M800 80 L750 170 H890 L840 80"/>
              <g fill="currentColor" stroke="none" font-size="32" text-anchor="middle">
                <text x="260" y="220">2x + 3</text><text x="820" y="220">9</text>
              </g>
      - say: 左右の両方から3を取り除くと、2x＝6。
        show:
          - { type: formula, at: [100, 480], tex: '2x + 3 - 3 = 9 - 3 \;\rightarrow\; 2x = 6' }
      - say: さらに、両方を2で割ると、x＝3。これで解が求まりました。
        show:
          - { type: formula, at: [100, 560], color: green, tex: '2x \div 2 = 6 \div 2 \;\rightarrow\; x = 3' }

  - board: whiteboard
    steps:
      - say: まとめです。
        show:
          - { type: title, text: まとめ }
      - say: xだけが入った方程式が一次方程式。等式を成り立たせるxの値が、解です。
        show:
          - { type: text, text: "**一次方程式**：x だけの方程式　／　**解**：等式が成り立つ x の値" }
      - say: 解くときは、天秤のように、両辺に同じ操作をして、xだけを残していきます。
        show:
          - { type: text, text: "両辺に同じことをしても、つりあい（等式）は保たれる" }
