title: 対数の意味
scenes:
  - board: whiteboard
    steps:
      - say: 「対数の意味」です。
        show:
          - { type: title, text: 対数の意味 }
      - say: 「2を何乗すると、8になるか？」。答えは3です。この「何乗するか」を表すのが、対数です。
        show:
          - { type: formula, size: l, tex: '2^{\square} = 8 \;\rightarrow\; \square = 3' }
      - say: 「2を3乗したら8になる」ということを、log₂8＝3と書き、「ログ2の8イコール3」と読みます。この2のことを、「底」といいます。
        show:
          - { type: formula, size: xl, color: yellow, tex: '\log_2 8 = 3' }
          - { type: text, size: s, color: gray, text: "読み方：ログ 2 の 8　　2 ＝ 底（てい）" }

  - board: whiteboard
    steps:
      - say: 対数は、指数の逆です。指数は「何乗した結果か」を表し、対数は「何乗すればよいか」を表します。
        show:
          - { type: title, text: 指数と対数は逆 }
          - type: svg
            w: 1000
            h: 260
            markup: |
              <text x="150" y="140" font-size="48" fill="currentColor" stroke="none">2³ ＝ 8</text>
              <text x="620" y="140" font-size="48" fill="#f3d77a" stroke="none">log₂8 ＝ 3</text>
              <path d="M370 80 Q500 10 610 80" stroke="#8fc4ff"/><path d="M596 70 L610 80 L594 88" stroke="#8fc4ff"/>
              <path d="M610 170 Q500 240 370 170" stroke="#f4a3b8"/><path d="M386 180 L370 170 L388 162" stroke="#f4a3b8"/>
              <text x="430" y="40" font-size="24" fill="#8fc4ff" stroke="none">何乗すれば？</text>
              <text x="430" y="250" font-size="24" fill="#f4a3b8" stroke="none">何乗した結果は？</text>

  - board: whiteboard
    steps:
      - say: 対数が特に便利なのは、かけ算を、足し算に変えられることです。
        show:
          - { type: title, text: かけ算 → 足し算 }
          - { type: formula, size: l, color: yellow, tex: '\log(A \times B) = \log A + \log B' }
      - say: たとえば、底が10のとき、100は10の2乗、1000は10の3乗。100×1000＝10万は、10の5乗。指数どうしを、足し算しているだけですね。
        added: true
        show:
          - { type: formula, tex: '\log_{10}(100 \times 1000) = 2 + 3 = 5' }
      - say: 計算機がなかった時代、天文学者や航海士は、対数の表を使って、むずかしいかけ算を足し算に変え、計算を楽にしていました。
        show:
          - { type: text, size: s, color: gray, text: "計算機のない時代：天文学者・航海士が「対数表」で計算を楽に" }

  - board: whiteboard
    steps:
      - say: よく使われる対数が2つあります。1つは、底が10の「常用対数」。
        show:
          - { type: title, text: 常用対数と自然対数 }
          - { type: text, text: "**常用対数** … 底が 10" }
      - say: もう1つは、底がeという特別な数の「自然対数」です。eは、およそ2.718の無理数で、ネイピア数と呼ばれます。自然界の成長や減衰と、深く結びついた数です。
        show:
          - { type: text, text: "**自然対数** … 底が e（ネイピア数 ≒ 2.718）" }
          - { type: text, size: s, color: gray, text: "e は自然界の成長・減衰と深く結びついた数" }
      - say: 身近なところでは、音の大きさを表すデシベルや、地震の規模を表すマグニチュードも、対数の考え方を使っています。マグニチュードが2大きくなると、地震のエネルギーはおよそ1000倍になります。
        added: true
        show:
          - { type: box, color: blue, w: 1000, text: "デシベル（音）・マグニチュード（地震）も対数の考え方\nマグニチュード ＋2 → エネルギー 約1000倍" }
