title: 戦後の有名な総理大臣
scenes:
  - board: whiteboard
    steps:
      - say: 最後に、戦後の有名な総理大臣を4人紹介します。
        show:
          - { type: title, text: 戦後の有名な総理大臣 }
      - say: 吉田茂は、サンフランシスコ平和条約と、日米安全保障条約を結び、警察予備隊を作りました。マッカーサーと対等にわたりあった、ワンマン宰相として知られます。
        read: よしだしげるは、サンフランシスコ平和条約と、日米安全保障条約を結び、警察予備隊を作りました。マッカーサーと対等にわたりあった、ワンマン宰相として知られます。
        show:
          - { type: box, at: [80, 130], w: 540, color: blue, title: 吉田茂, text: "平和条約・安保条約\nマッカーサーとわたりあう" }
      - say: 佐藤栄作は、沖縄返還を実現しました。また、核兵器を持たず、作らず、持ちこませず、という非核三原則をとなえ、ノーベル平和賞を受賞しました。
        read: さとうえいさくは、沖縄返還を実現しました。また、核兵器を持たず、作らず、持ちこませず、という非核三原則をとなえ、ノーベル平和賞を受賞しました。
        show:
          - { type: box, at: [660, 130], w: 540, color: green, title: 佐藤栄作, text: "沖縄返還・非核三原則\nノーベル平和賞" }
      - say: 田中角栄は、1972年、戦争で途切れていた中国との国交を正常化しました。国内では、日本列島改造論をかかげ、新幹線や高速道路などの交通網を広げました。
        read: たなかかくえいは、1972年、戦争で途切れていた中国との国交を正常化しました。国内では、日本列島改造論をかかげ、新幹線や高速道路などの交通網を広げました。
        show:
          - { type: box, at: [80, 340], w: 540, color: yellow, title: 田中角栄, text: "日中国交正常化（1972）\n日本列島改造論" }
      - say: 小泉純一郎は、郵政民営化で、郵便の事業を国営から民営にしたほか、政府の役割をできるだけ小さくする、小さな政府を目指しました。
        read: こいずみじゅんいちろうは、郵政民営化で、郵便の事業を国営から民営にしたほか、政府の役割をできるだけ小さくする、小さな政府を目指しました。
        show:
          - { type: box, at: [660, 340], w: 540, color: pink, title: 小泉純一郎, text: "郵政民営化\n「小さな政府」" }

  - board: whiteboard
    steps:
      - say: 縄文時代から、今のわたしたちまで。歴史は、ばらばらの年号ではなく、原因と結果のつながりです。
        added: true
        show:
          - { type: title, text: 歴史を学ぶ意味 }
          - { type: text, at: [80, 150], w: 1120, size: l, text: "歴史 ＝ **原因と結果** のつながり" }
      - say: 古いことを学んで、新しいことを知る。温故知新。今のニュースの背景を知りたいとき、ぜひ、この日本史の流れを思い出してください。
        read: 古いことを学んで、新しいことを知る。おんこちしん。今のニュースの背景を知りたいとき、ぜひ、この日本史の流れを思い出してください。
        added: true
        show:
          - { type: box, at: [80, 280], w: 1120, color: yellow, title: 温故知新, text: "過去を知ることで、今と未来が見えてくる" }
