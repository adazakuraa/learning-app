title: 高度経済成長
scenes:
  - board: whiteboard
    steps:
      - say: 1950年代後半から、1970年代のはじめにかけて、日本経済は、毎年平均10%前後という、驚くほどの成長を続けました。これが高度経済成長期です。
        show:
          - { type: title, text: 高度経済成長 }
          - { type: text, at: [80, 140], w: 1120, text: "1950年代後半〜1970年代はじめ　成長率 年平均 **約10%**" }
      - say: 毎年10%成長すると、およそ7年で経済の大きさは2倍になります。給料も、どんどん上がっていく時代でした。
        added: true
        show:
          - { type: box, at: [80, 230], w: 1120, color: green, text: "年10%成長 → 約7年で経済が **2倍**" }
      - say: 焼け野原だった国が、わずか20年あまりで、世界第2位の経済大国になる。歴史上ほとんど例のない、急成長でした。
        show:
          - { type: text, at: [80, 400], w: 1120, size: l, text: "焼け野原 → 約20年で **世界第2位** の経済大国" }

  - board: whiteboard
    steps:
      - say: 1958年に東京タワーが完成し、1964年には東海道新幹線が開通、アジアで初めての東京オリンピックが開かれました。
        show:
          - { type: title, text: 豊かになる暮らし }
          - type: list
            at: [80, 140]
            items: ["1958年　東京タワー完成", "1964年　東海道新幹線・東京オリンピック"]
      - say: テレビ、洗濯機、冷蔵庫は、三種の神器と呼ばれ、家庭に広がっていきます。暮らしが目に見えて豊かになっていきました。
        show:
          - { type: box, at: [80, 320], w: 1120, color: yellow, title: 三種の神器, text: "テレビ・洗濯機・冷蔵庫" }

  - board: whiteboard
    steps:
      - say: この成長を支えたものは何だったのでしょうか。
        show:
          - { type: title, text: 成長を支えたもの }
      - say: 安くて質の高い労働力。戦後の教育で育った、読み書きの力や技術力。そして、アメリカの技術を取り入れ、輸出で稼ぐ経済政策です。
        show:
          - type: list
            at: [80, 140]
            items: ["安くて質の高い **労働力**", "高い **教育水準**・技術力", "アメリカの技術の導入", "**輸出** で稼ぐ政策"]
      - say: 日本の奇跡と呼ばれたこの成長は、のちに韓国、台湾、シンガポールなど、アジアの国々の発展のお手本にもなりました。
        show:
          - { type: text, at: [80, 440], w: 1120, color: gray, text: "「日本の奇跡」→ 韓国・台湾・シンガポールなどのお手本に" }
