title: バブル経済
scenes:
  - board: whiteboard
    steps:
      - say: 1980年代の後半、日本は、かつてない好景気にわきました。土地や株の値段が、本当の価値とかけ離れてふくらみ続けた、この時期を、バブル経済と呼びます。
        show:
          - { type: title, text: バブル経済 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: バブル, text: "土地や株の値段が、本当の価値以上に **泡のように** ふくらむ" }
      - say: 東京の山手線の内側の土地の値段で、アメリカ全土が買える、とまで言われました。都心のマンションは、普通の会社員には、とても手が届かない値段になります。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "「山手線の内側の地価で、アメリカ全土が買える」" }
      - say: タクシーを止めるのに、一万円札をふった人がいたとか、数千万円のゴルフ場の会員権が飛ぶように売れたとか、今から見ると、別世界のような話が残っています。
        show:
          - { type: text, at: [80, 410], w: 1120, color: gray, text: "一万円札をふってタクシーを止める・数千万円のゴルフ会員権が売れる" }

  - board: whiteboard
    steps:
      - say: しかし1990年に株価が、続いて土地の値段が急落し、バブルははじけます。
        show:
          - { type: title, text: バブル崩壊と失われた30年 }
          - type: svg
            at: [80, 130]
            w: 640
            h: 300
            anim: draw
            markup: |
              <path d="M30 260 L620 260" stroke="#9aa3ad"/><path d="M30 260 L30 20" stroke="#9aa3ad"/>
              <path d="M40 230 C120 220 180 190 240 120 C270 70 290 40 310 45 C330 50 340 140 380 200 C440 230 520 225 610 220" stroke="#f3d77a"/>
              <g stroke="none" font-size="20" fill="#e8eef5"><text x="40" y="290">1980</text><text x="280" y="290">1990</text><text x="560" y="290">2000〜</text><text x="270" y="30">ピーク</text></g>
      - say: 多額の借金をかかえた会社や銀行が次々と経営危機におちいり、日本経済は、長い停滞期に入ります。これが、失われた30年の始まりです。
        show:
          - { type: box, at: [760, 150], w: 440, color: pink, title: 失われた30年, text: "会社・銀行が経営危機\n→ 1990年代〜2020年代\n低い成長が続く" }
      - say: みんなが値上がりを信じて買うから、さらに値上がりする。でも、信じる人がいなくなった瞬間に、一気にしぼむ。バブルのしくみは、今の投資の世界にも通じる教訓です。
        added: true
        show:
          - { type: text, at: [80, 470], w: 1120, color: gray, text: "「信じるから上がる」→ 信じる人が消えると一気にしぼむ" }
