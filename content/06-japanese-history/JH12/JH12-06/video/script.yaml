title: 公害問題
scenes:
  - board: whiteboard
    steps:
      - say: 高度成長のかげで、深刻な公害が各地で起きていました。
        show:
          - { type: title, text: 成長のかげの公害 }
      - say: 熊本県の水俣市では、工場が流した、水銀をふくむ排水が海を汚し、その魚を食べた人々に、重い神経の症状が現れました。水俣病です。
        read: 熊本県のみなまた市では、工場が流した、水銀をふくむ排水が海を汚し、その魚を食べた人々に、重い神経の症状が現れました。みなまた病です。
        show:
          - { type: box, at: [80, 140], w: 1120, color: pink, title: 水俣病（熊本県）, text: "工場排水の水銀 → 魚 → 人へ　手足のしびれ、目や耳、言葉の障害" }
      - say: 先に、猫が狂ったように踊り、海に飛びこむ、という異変が報告され、そのあと、人への被害が明らかになりました。
        show:
          - { type: text, at: [80, 320], w: 1120, color: gray, text: "先に「猫踊り病」が報告され、のちに人への被害が明らかに" }

  - board: whiteboard
    steps:
      - say: 三重県の四日市では、石油コンビナートの煙で、ぜんそくの患者が続出しました。
        read: 三重県のよっかいちでは、石油コンビナートの煙で、ぜんそくの患者が続出しました。
        show:
          - { type: title, text: 四大公害病 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 水俣病（熊本）, text: "水銀" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: 四日市ぜんそく（三重）, text: "工場の排煙" }
      - say: 富山県では、鉱山の排水にふくまれるカドミウムで、イタイイタイ病が起きました。骨がもろくなり、全身に激痛が走るこの病気の名前は、患者たちの、痛い、痛い、というさけびから付けられました。
        show:
          - { type: box, at: [80, 300], w: 540, color: yellow, title: イタイイタイ病（富山）, text: "カドミウム" }
      - say: 新潟県でも、水俣病と同じ原因で、新潟水俣病が起きています。この四つを合わせて、四大公害病と呼びます。
        added: true
        show:
          - { type: box, at: [660, 300], w: 540, color: green, title: 新潟水俣病（新潟）, text: "水銀" }

  - board: whiteboard
    steps:
      - say: こうした被害を受けて住民運動が起き、1967年に公害対策基本法が作られ、1970年の公害国会で、大きく強化されます。
        show:
          - { type: title, text: 人の命を優先する }
          - type: list
            at: [80, 140]
            items: ["住民運動・裁判", "1967年　**公害対策基本法**", "1970年　「公害国会」で強化", "1971年　環境庁の設置"]
      - say: 会社の利益より、人の命を優先する。その考え方が、法律として定着していきました。今の環境問題を考えるときの、原点の一つです。
        show:
          - { type: box, at: [80, 420], w: 1120, color: green, text: "企業の利益より **人の命** を優先 ← 今の環境問題の原点" }
