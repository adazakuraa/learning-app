title: 日本国憲法と平和主義
scenes:
  - board: whiteboard
    steps:
      - say: 1946年に公布された日本国憲法は、戦前の大日本帝国憲法から、根本的に変わりました。三つの柱があります。
        show:
          - { type: title, text: 日本国憲法の三つの柱 }
      - say: 主権が、天皇から国民へ。基本的人権の保障。そして、第9条による、戦争の放棄、つまり平和主義です。
        show:
          - { type: box, at: [80, 140], w: 360, color: blue, title: 国民主権, text: "主権が\n天皇 → 国民へ" }
          - { type: box, at: [460, 140], w: 360, color: green, title: 基本的人権の尊重, text: "人が生まれながらに\n持つ権利を保障" }
          - { type: box, at: [840, 140], w: 360, color: yellow, title: 平和主義, text: "第9条\n戦争の放棄" }
      - say: 1946年11月3日に公布され、翌年の5月3日に施行されました。今の文化の日と、憲法記念日です。
        added: true
        show:
          - { type: text, at: [80, 380], w: 1120, color: gray, text: "公布 11月3日（文化の日）・施行 5月3日（憲法記念日）" }

  - board: whiteboard
    steps:
      - say: 第9条は、戦力を持たない、国が戦争をする権利を認めない、という内容で、世界でも例の少ない平和主義の条文です。
        show:
          - { type: title, text: 第9条をめぐって }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 第9条, text: "戦争の放棄・戦力を持たない・交戦権を認めない" }
      - say: この憲法がGHQの主導で作られたのは事実です。でも、当時の日本人の多くが、戦争への深い後悔と、平和への強い願いを持っていたのも確かで、押しつけられただけ、とは言い切れない面もあります。
        read: この憲法がジーエイチキューの主導で作られたのは事実です。でも、当時の日本人の多くが、戦争への深い後悔と、平和への強い願いを持っていたのも確かで、押しつけられただけ、とは言い切れない面もあります。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "GHQ主導で作られた ＋ 国民の平和への願い" }

  - board: whiteboard
    steps:
      - say: 今も、憲法を変えるかどうかの議論は続いています。特に、第9条と自衛隊の関係は、政治的に大きなテーマです。
        show:
          - { type: title, text: 今も続く議論 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 改正すべき, text: "憲法を変えて\n自衛隊を正式に認めるべき" }
          - { type: box, at: [660, 140], w: 540, color: green, title: 守るべき, text: "第9条こそ\n日本の平和の礎だ" }
      - say: 70年以上、一度も改正されていない憲法というのは、民主主義の国としては、かなり珍しいことでもあります。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "70年以上一度も改正されていない ＝ 世界でも珍しい" }
