title: 朝鮮戦争と再軍備
scenes:
  - board: whiteboard
    steps:
      - say: 1950年、朝鮮半島で、北朝鮮と韓国の戦争が始まりました。朝鮮戦争です。日本は、アメリカ軍の後方の基地として使われました。
        show:
          - { type: title, text: 1950年　朝鮮戦争と特需 }
          - { type: text, at: [80, 140], w: 1120, text: "北朝鮮 vs 韓国　日本は **アメリカ軍の後方基地** に" }
      - say: 軍需物資の注文が殺到し、日本の工場はフル回転します。この朝鮮特需が、日本経済の復興を一気に早めました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: green, title: 朝鮮特需, text: "軍需物資の注文が殺到 → 工場がフル回転 → 経済復興が加速" }
      - say: 戦争で苦しむ隣の国を横目に、自分の国がうるおう。複雑な状況でもありました。
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "隣国の戦争で自国がうるおう、という複雑さ" }

  - board: whiteboard
    steps:
      - say: アメリカは日本に再軍備を求め、1950年、警察予備隊が作られます。これが、のちの自衛隊です。
        show:
          - { type: title, text: 自衛隊の誕生 }
          - { type: text, at: [80, 140], w: 1120, text: "1950年 警察予備隊 → 保安隊 → 1954年 **自衛隊**" }
      - say: 戦力は持たない、はずの憲法のもとで、軍事組織が生まれる。この矛盾は、自分の国を守るための実力組織であって、軍隊ではない、という解釈で整理されました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: 政府の解釈, text: "「自衛のための実力組織であって、軍隊ではない」" }
      - say: この解釈は今も続いており、自衛隊の位置づけは、今なお議論の種になっています。
        show: []

  - board: whiteboard
    steps:
      - say: 1951年、サンフランシスコ平和条約で、日本は独立を取りもどします。同時に、日米安全保障条約、いわゆる安保条約を結びました。
        show:
          - { type: title, text: 1951年　独立と安保条約 }
          - { type: box, at: [80, 140], w: 540, color: green, title: サンフランシスコ平和条約, text: "日本が独立（主権）を回復" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: 日米安全保障条約, text: "アメリカが日本を守る\n日本は基地を提供" }
      - say: アメリカが日本を守るかわりに、日本はアメリカ軍に基地を提供する、という取り決めです。このしくみは、今も続いています。
        show:
          - { type: text, at: [80, 360], w: 1120, size: l, text: "このしくみは **今も** 続いている" }
