title: GHQによる占領と民主化
scenes:
  - board: slide
    steps:
      - say: 日本史の最後の章、「戦後から現代」です。
        show:
          - { type: title, text: 第12章　戦後〜現代 }
      - say: 占領と民主化、新しい憲法、高度経済成長、公害、沖縄、バブル。焼け野原から、今の日本ができるまでを見ていきます。
        show:
          - type: list
            at: [80, 130]
            w: 540
            size: s
            items: ["GHQによる占領と民主化", "日本国憲法と平和主義", "朝鮮戦争と再軍備", "高度経済成長", "安保闘争"]
          - type: list
            at: [660, 130]
            w: 540
            size: s
            items: ["公害問題", "沖縄返還と日米関係", "バブル経済", "戦後の有名な総理大臣"]
      - say: 憲法9条、自衛隊、米軍基地、失われた30年。今ニュースで議論されていることの多くは、この時代に出発点があります。
        added: true
        show:
          - { type: box, at: [80, 440], color: yellow, w: 1120, title: この章の目的, text: "今のニュースの「出発点」を知り、現代の日本を歴史の流れで理解する" }

  - board: whiteboard
    steps:
      - say: 敗戦後の日本は、GHQ、つまり連合国軍総司令部の占領下に置かれました。実質的には、アメリカによる占領です。
        read: 敗戦後の日本は、ジーエイチキュー、つまり連合国軍総司令部の占領下に置かれました。実質的には、アメリカによる占領です。
        show:
          - { type: title, text: GHQの占領 }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: GHQ（連合国軍総司令部）, text: "実質的にはアメリカが日本を占領　最高司令官 **マッカーサー**" }
      - say: 最高司令官のマッカーサーが、厚木飛行場に、サングラスをかけ、パイプをくわえて降り立った写真は有名です。アメリカの将軍が日本を支配している、という事実を、写真一枚で世界に示した場面です。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "厚木飛行場に降り立つマッカーサー ＝ 写真一枚で示された「占領」" }

  - board: whiteboard
    steps:
      - say: GHQは、日本を民主的で、軍隊を持たない国にするため、次々と改革を行いました。
        read: ジーエイチキューは、日本を民主的で、軍隊を持たない国にするため、次々と改革を行いました。
        show:
          - { type: title, text: 民主化・非軍事化の改革 }
      - say: 三菱、三井、住友などの大企業グループを分割する財閥解体。労働組合を認めること。さらに、農地改革で、地主の土地を小作人に安く売り渡し、女性にも選挙権が与えられました。
        show:
          - type: list
            at: [80, 140]
            items: ["**財閥解体**（三菱・三井・住友などを分割）", "**労働組合** を認める", "**農地改革**（小作人が自分の土地を持つ）", "**女性の参政権**"]
      - say: どれも、戦前の日本の権力のしくみを、根本から変えるものでした。
        show:
          - { type: text, at: [80, 440], w: 1120, size: l, text: "戦前の権力のしくみを **根本から** 変えた" }

  - board: whiteboard
    steps:
      - say: マッカーサーは、日本人は12歳の少年のようなものだ、と発言して、物議をかもしたこともあります。
        show:
          - { type: title, text: マッカーサーと日本人 }
          - { type: text, at: [80, 140], w: 1120, text: "「日本人は12歳の少年のようなものだ」" }
      - say: 一方で、日本を去るときには、この国を愛するようになった、とも語っています。帰国のときには多くの日本人が見送りに集まり、感謝の手紙が殺到しました。占領する側とされる側をこえた感情があったようです。
        show:
          - { type: text, at: [80, 230], w: 1120, text: "帰国時：多くの日本人が見送り、感謝の手紙が殺到" }
