title: 安保闘争と戦後民主主義の試練
scenes:
  - board: whiteboard
    steps:
      - say: 1960年、岸信介内閣が、日米安全保障条約の改定を、強行採決しようとしたことをきっかけに、かつてない規模の反対運動が起きました。安保闘争です。
        read: 1960年、きしのぶすけ内閣が、日米安全保障条約の改定を、強行採決しようとしたことをきっかけに、かつてない規模の反対運動が起きました。安保闘争です。
        show:
          - { type: title, text: 1960年　安保闘争 }
          - { type: text, at: [80, 140], w: 1120, text: "岸信介内閣が安保条約の改定を **強行採決**" }
      - say: 新しい条約は、アメリカが日本を守る義務をはっきりさせる一方で、日本がアメリカの戦争に巻きこまれるかもしれない、という不安を広げました。
        show:
          - { type: box, at: [80, 230], w: 540, color: green, title: 期待, text: "アメリカが日本を守る\n義務がはっきりする" }
          - { type: box, at: [660, 230], w: 540, color: pink, title: 不安, text: "アメリカの戦争に\n巻きこまれるのでは" }
      - say: 連日、数万から数十万人のデモ隊が国会を取り囲み、全国の大学でストライキが起きました。
        show:
          - { type: text, at: [80, 440], w: 1120, text: "連日 **数万〜数十万人** が国会を取り囲む" }

  - board: whiteboard
    steps:
      - say: デモのなかで、東京大学の学生、樺美智子さんが、機動隊との衝突で亡くなります。社会の衝撃はさらに高まり、岸首相は、条約が成立したあとに退陣しました。
        read: デモのなかで、東京大学の学生、かんばみちこさんが、機動隊との衝突で亡くなります。社会の衝撃はさらに高まり、岸首相は、条約が成立したあとに退陣しました。
        show:
          - { type: title, text: 条約は成立、首相は退陣 }
          - type: list
            at: [80, 140]
            items: ["東大生・樺美智子さんが死亡", "条約は成立", "岸首相は退陣"]
      - say: それでも条約は成立し、その後の日本は、アメリカとの同盟を軸に、経済成長の道を進んでいきます。
        show: []
      - say: ちなみに岸信介は、退陣後も長く自民党の実力者として影響力を持ち続けました。孫が安倍晋三元首相であることも、よく知られています。
        read: ちなみに岸信介は、退陣後も長く自民党の実力者として影響力を持ち続けました。孫があべしんぞう元首相であることも、よく知られています。
        show:
          - { type: text, at: [80, 380], w: 1120, color: gray, text: "岸信介の孫 ＝ 安倍晋三 元首相" }

  - board: whiteboard
    steps:
      - say: 1960年代後半には、ベトナム戦争への反対や、大学の民主化を求める学生運動が激しくなります。東大や日大などで学生が大学を占拠し、1969年の東大の入試は、中止に追いこまれました。
        show:
          - { type: title, text: 学生運動の時代 }
          - { type: text, at: [80, 140], w: 1120, text: "ベトナム反戦・大学の民主化 → 大学占拠 → **1969年 東大入試中止**" }
      - say: 今から見ると別世界のようですが、若者が、自分たちで社会を変えられる、という感覚を持っていた時代とも言えます。
        show:
          - { type: text, at: [80, 240], w: 1120, size: l, text: "「社会を変えられる」と若者が感じていた時代" }
