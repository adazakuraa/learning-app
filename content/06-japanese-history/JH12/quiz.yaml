questions:
  - q: 戦後の日本を占領・統治した連合国軍の総司令部を、アルファベット3字で何というか。
    a: [GHQ]
  - q: 日本国憲法の3つの柱は、国民主権、基本的人権の尊重と、もう1つは何か。
    a: [平和主義]
  - q: 1951年に結ばれ、日本が主権を回復した条約を何というか。
    a: [サンフランシスコ平和条約, サンフランシスコ講和条約]
    show: サンフランシスコ平和条約
  - q: 熊本県で起きた、工場廃水の有機水銀による公害病を何というか。
    a: [水俣病]
  - q: 沖縄が日本に返還されたのは何年か。
    a: ['1972', 1972年]
    show: 1972年
