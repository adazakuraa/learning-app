title: 日中戦争と南京事件
scenes:
  - board: whiteboard
    steps:
      - say: 1931年、中国東北部にいた日本の陸軍、関東軍が、南満州鉄道の線路を自分たちで爆破し、それを中国側のしわざだとして、満州を占領しました。これが満州事変です。
        show:
          - { type: title, text: 1931年　満州事変 }
          - { type: box, at: [80, 140], w: 1120, color: pink, title: 満州事変, text: "関東軍が自ら線路を爆破 →「中国のしわざ」として満州を占領" }
      - say: 軍が、政府の許可なく、勝手に戦争を始める、という前代未聞のできごとでした。
        show:
          - { type: text, at: [80, 320], w: 1120, size: l, text: "軍が政府の許可なく戦争を始めた" }

  - board: whiteboard
    steps:
      - say: 国際連盟は、日本軍に満州からの撤退を勧告しますが、日本は連盟を脱退して対抗します。国際社会から孤立していく出発点です。
        show:
          - { type: title, text: 国際的な孤立 }
          - { type: text, at: [80, 140], w: 1120, text: "国際連盟：「満州から撤退を」→ 日本は **連盟を脱退**（1933年）" }
      - say: ちなみに当時の中国は、日本やイギリスなどとの戦争に敗れ、さまざまな国から支配を受けていました。
        show:
          - { type: text, at: [80, 230], w: 1120, color: gray, text: "当時の中国：各国との戦争に敗れ、さまざまな国に支配されていた" }
      - say: クラスの話し合いで注意されて、クラスから出ていってしまうようなものです。話し合いの場を自分から離れると、味方はどんどん減っていきます。
        added: true
        show:
          - { type: text, at: [80, 320], w: 1120, text: "話し合いの場を離れる → 味方が減り、孤立していく" }

  - board: whiteboard
    steps:
      - say: 1937年、さらに勢力を広げようとする日本と、それに抵抗する中国との間で、日中戦争が始まります。
        show:
          - { type: title, text: 1937年　日中戦争と南京事件 }
          - { type: text, at: [80, 140], w: 1120, text: "1937年 **日中戦争** 始まる" }
      - say: 首都の南京を占領した日本軍は、捕虜や一般の市民を大規模に殺害しました。これが南京事件です。
        read: 首都のなんきんを占領した日本軍は、捕虜や一般の市民を大規模に殺害しました。これがなんきん事件です。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, title: 南京事件, text: "南京を占領した日本軍が、捕虜や市民を大規模に殺害" }
      - say: 犠牲者の数については、日本と中国の間で大きな開きがあり、今も歴史認識の対立点になっています。ただし、大規模な虐殺があったこと自体は、日本の研究者の間でも否定されていません。
        show:
          - { type: text, at: [80, 410], w: 1120, text: "犠牲者数は日中で大きな開き。ただし **大規模な虐殺があったこと自体** は否定されていない" }
