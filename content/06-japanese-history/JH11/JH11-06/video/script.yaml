title: 敗戦と原爆・東京大空襲
scenes:
  - board: whiteboard
    steps:
      - say: 1945年3月10日、アメリカ軍のB29爆撃機、およそ300機が、東京に焼夷弾を落としました。東京大空襲です。
        read: せんきゅうひゃくよんじゅうご年さんがつとおか、アメリカ軍のビーにじゅうく爆撃機、およそさんびゃっきが、東京にしょういだんを落としました。東京大空襲です。
        show:
          - { type: title, text: 1945年　東京大空襲 }
          - { type: text, at: [80, 140], w: 1120, text: "3月10日　B-29 約300機が **焼夷弾**（火災を起こす爆弾）で爆撃" }
      - say: 木造の家が密集する東京の下町は、一夜にして焼け野原になり、推計で10万人以上が亡くなりました。その後も、大阪、名古屋、神戸など、全国の都市が次々と爆撃されます。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, text: "木造家屋の下町が一夜で焼け野原　推計 **10万人以上** が死亡" }

  - board: whiteboard
    steps:
      - say: 8月6日に広島、9日に長崎に、人類史上はじめて、原子爆弾が落とされました。
        show:
          - { type: title, text: 原子爆弾 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 8月6日　広島, text: "年内に推計 約14万人が死亡" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: 8月9日　長崎, text: "年内に 7万人以上が死亡" }
      - say: 広島では推計14万人、長崎では7万人以上が、その年のうちに亡くなったとされています。
        show: []
      - say: 原爆は、爆風や熱線によるその場の死だけでなく、放射線による病気を、生き残った人々に、長く与え続けました。
        show:
          - { type: text, at: [80, 340], w: 1120, text: "放射線の後遺症が、生き残った人々を **長く** 苦しめた" }

  - board: whiteboard
    steps:
      - say: 8月15日、昭和天皇がラジオで、戦争の終わりを告げます。玉音放送です。
        show:
          - { type: title, text: 8月15日　終戦 }
          - { type: text, at: [80, 140], w: 1120, text: "**玉音放送**：昭和天皇がラジオで終戦を告げる" }
      - say: 多くの国民にとって、天皇の声を聞くのは初めてでした。長く、勝つと信じさせられてきた人々にとって、敗戦は受け入れがたい現実でした。
        show:
          - { type: text, at: [80, 230], w: 1120, text: "「勝つ」と信じさせられてきた国民 → 受け入れがたい現実" }
      - say: 戦争で亡くなった日本人は、軍人と民間人をあわせて、およそ310万人とされています。そして、日本が戦場とした国々でも、それをはるかに上回る、多くの命が失われました。
        show:
          - { type: box, at: [80, 340], w: 1120, color: yellow, text: "日本人の戦没者 約 **310万人**（軍人＋民間人）" }
          - { type: text, at: [80, 480], w: 1120, color: gray, text: "アジアの国々でも、さらに多くの命が失われた" }
