title: 戦争を生きた人物たち
scenes:
  - board: whiteboard
    steps:
      - say: 昭和の戦争は、さまざまな立場の人を、歴史の表舞台に押し出しました。まずは、首相をつとめた二人です。
        show:
          - { type: title, text: 二人の首相 }
      - say: 近衛文麿は、戦争の時期に3度首相になった人物です。貴族の生まれで、45歳の若さで首相になりました。
        read: このえふみまろは、戦争の時期に3度首相になった人物です。貴族の生まれで、45歳の若さで首相になりました。
        show:
          - { type: box, at: [80, 140], w: 540, color: blue, title: 近衛文麿, text: "3度首相に・貴族の出身\n盧溝橋事件で一度は不拡大方針\nでも軍の要求に押される" }
      - say: 日中戦争のきっかけとなった、1937年の盧溝橋事件では、一度は戦いを広げない方針を取りましたが、軍の要求に押されて兵の派遣を認めてしまいます。優柔不断な性格もあり、軍を止められませんでした。
        read: 日中戦争のきっかけとなった、1937年のろこうきょう事件では、一度は戦いを広げない方針を取りましたが、軍の要求に押されて兵の派遣を認めてしまいます。優柔不断な性格もあり、軍を止められませんでした。
        show: []
      - say: 戦後、戦争犯罪の容疑者として逮捕命令が出され、出頭の前に、毒を飲んで自ら命を絶ちました。
        show:
          - { type: text, at: [80, 420], w: 540, color: gray, text: "戦後、逮捕命令 → 出頭前に自殺" }
      - say: 東条英機は、太平洋戦争の時期の首相で、開戦を強く主張していました。天皇から和平を求められると、交渉に力をつくしますが、アメリカからハル・ノートが出されます。
        read: とうじょうひできは、太平洋戦争の時期の首相で、開戦を強く主張していました。天皇から和平を求められると、交渉に力をつくしますが、アメリカからハル・ノートが出されます。
        show:
          - { type: box, at: [660, 140], w: 540, color: pink, title: 東条英機, text: "開戦派の首相\n天皇の意向で交渉するも\nハル・ノートで開戦へ" }
      - say: ハル・ノートは、それまでの日本の行動をすべて否定し、元に戻すことを求める内容で、日本側は、事実上の最後通告と受けとめました。そして開戦にふみきります。戦後、東京裁判で死刑判決を受け、処刑されました。
        show:
          - { type: text, at: [660, 420], w: 540, color: gray, text: "戦後、東京裁判で死刑" }

  - board: whiteboard
    steps:
      - say: 海軍の山本五十六は、アメリカに留学した経験があり、その国力をよく知っていたため、アメリカとの戦争に、はじめは強く反対していました。
        read: 海軍のやまもといそろくは、アメリカに留学した経験があり、その国力をよく知っていたため、アメリカとの戦争に、はじめは強く反対していました。
        show:
          - { type: title, text: 軍人たち }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 山本五十六, text: "アメリカを知り、開戦に反対\nでも真珠湾攻撃を立案\n1943年 撃墜され戦死" }
      - say: それなのに、反対していた戦争の作戦を、自ら立てて指揮する、という矛盾をかかえていました。1943年、暗号を解読したアメリカ軍に待ちぶせされ、乗っていた飛行機が撃ち落とされて戦死します。
        show: []
      - say: 乃木希典は、日露戦争で、旅順の要塞を攻め落とした将軍です。正面からの攻撃をくり返して多くの犠牲を出し、自分の二人の息子も、日露戦争で失いました。
        read: のぎまれすけは、日露戦争で、りょじゅんのようさいを攻め落とした将軍です。正面からの攻撃をくり返して多くの犠牲を出し、自分の二人の息子も、日露戦争で失いました。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: 乃木希典, text: "日露戦争・旅順攻略\n二人の息子も戦死\n明治天皇の後を追い自刃" }
      - say: 1912年、明治天皇が亡くなると、そのあとを追って、妻とともに自ら命を絶ちます。夏目漱石の『こころ』は、このできごとから着想を得たとされています。
        show:
          - { type: text, at: [660, 420], w: 540, color: gray, text: "→ 夏目漱石『こころ』に影響" }

  - board: whiteboard
    steps:
      - say: 辻政信は、作戦の神様と呼ばれた陸軍の参謀です。しかし実際は、無謀な作戦を強行し、失敗しても責任を取らない人物で、部下からおそれられていました。
        read: つじまさのぶは、作戦の神様と呼ばれた陸軍の参謀です。しかし実際は、無謀な作戦を強行し、失敗しても責任を取らない人物で、部下からおそれられていました。
        show:
          - { type: title, text: 辻政信と上原良司 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 辻政信, text: "「作戦の神様」\n無謀な作戦・責任を取らない\n戦後は逃亡、のち議員に\n1961年ラオスで行方不明" }
      - say: 戦後は、戦犯になるのをさけて、お坊さんなどに変装して逃げ回ります。その後なぜか国会議員になりますが、1961年、ラオスで行方がわからなくなり、今も生死はわかっていません。
        show: []
      - say: 特攻隊員として亡くなった若者のなかにも、語りつがれる人がいます。慶應の学生だった上原良司は、出撃の前の夜、自由を愛した自分が、自由のない国のために死ぬのが残念だ、という意味の文章を残しました。
        read: 特攻隊員として亡くなった若者のなかにも、語りつがれる人がいます。慶應の学生だったうえはらりょうじは、出撃の前の夜、自由を愛した自分が、自由のない国のために死ぬのが残念だ、という意味の文章を残しました。
        show:
          - { type: box, at: [660, 140], w: 540, color: yellow, title: 上原良司（特攻隊員）, text: "「自由を愛した自分が、\n自由のない国家のために\n死ぬことが残念だ」" }
      - say: 指導者も、軍人も、若者も、それぞれの立場で、それぞれの選択をしました。一人ひとりの人生を知ると、戦争が、教科書の年号ではなく、人の物語として見えてきます。
        added: true
        show:
          - { type: text, at: [80, 500], w: 1120, color: gray, text: "戦争を「年号」ではなく「人の物語」として見る" }
