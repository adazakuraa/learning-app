title: 戦時下の国民生活
scenes:
  - board: whiteboard
    steps:
      - say: 太平洋戦争が始まると、国民の生活は、戦争一色にそまっていきます。欲しがりません勝つまでは、というスローガンのもと、あらゆる資源が戦争のために使われました。
        show:
          - { type: title, text: 欲しがりません勝つまでは }
          - { type: box, at: [80, 140], w: 1120, color: yellow, text: "すべての資源を戦争のために" }
      - say: 金属が足りなくなると、お寺の鐘や、家の鍋や釜まで、差し出させられました。
        show:
          - type: list
            at: [80, 300]
            items: ["お寺の鐘・家の鍋や釜まで **金属を供出**", "食料は **配給制**、白米のかわりにサツマイモや雑穀", "空襲に備えて家を壊す **建物疎開**"]
      - say: 食料は配給制になり、白いご飯は食べられなくなって、サツマイモや雑穀が主食になります。
        show: []
      - say: 都市では、空襲で火が広がらないように、建物を強制的にこわして空き地を作る、建物疎開が行われ、突然、家を失った人も大勢いました。
        show: []

  - board: whiteboard
    steps:
      - say: 学生や生徒を、工場や農作業にかり出す、学徒動員も進み、授業はほとんど行われなくなりました。
        show:
          - { type: title, text: 若者たちと戦争 }
          - { type: text, at: [80, 140], w: 1120, text: "**学徒動員**：学生が工場や農作業へ → 授業はほとんどなし" }
      - say: 戦況が悪くなると、学生も兵士として戦場に送られます。爆弾を積んだ飛行機ごと、敵の船に体当たりする、特攻隊に送られた若者の多くは、20歳前後でした。
        show:
          - { type: box, at: [80, 240], w: 1120, color: pink, title: 特攻隊, text: "爆弾を積んだ飛行機ごと敵艦に体当たり　多くは **20歳前後**" }
      - say: 彼らが残した手紙には、死を前にした若者の、複雑な思いがつづられています。今のわたしたちと変わらない、若者の言葉です。
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "残された手紙 ＝ 今のわたしたちと変わらない若者の言葉" }
