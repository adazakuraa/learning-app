title: 太平洋戦争の開戦と経緯
scenes:
  - board: whiteboard
    steps:
      - say: 日中戦争が長引くなか、日本は、ドイツ、イタリアと、日独伊三国同盟を結び、東南アジアへと進出します。
        show:
          - { type: title, text: 追いつめられる日本 }
          - type: list
            at: [80, 140]
            items: ["日中戦争が長引く", "**日独伊三国同盟**（1940年）", "東南アジアへ進出（南進）"]
      - say: 危機感を持ったアメリカは、石油や鉄の日本への輸出を禁止しました。当時の日本は、石油のおよそ8割をアメリカから輸入していたので、これは事実上の兵糧攻めでした。
        show:
          - type: svg
            at: [660, 140]
            w: 540
            h: 140
            anim: draw
            markup: |
              <rect x="10" y="40" width="520" height="60" stroke="#9aa3ad"/>
              <rect x="10" y="40" width="416" height="60" fill="#f4a3b8" fill-opacity="0.45" stroke="none"/>
              <g stroke="none" font-size="22" fill="#e8eef5"><text x="20" y="28">日本の石油の輸入先</text><text x="120" y="78">アメリカ 約8割</text><text x="440" y="78">他</text></g>
          - { type: box, at: [80, 380], w: 1120, color: pink, title: アメリカの対日輸出禁止, text: "石油・鉄が入らない ＝ 事実上の **兵糧攻め**" }

  - board: whiteboard
    steps:
      - say: 交渉を続けるか、戦争にふみきるか。議論が続くなか、1941年12月、日本軍はハワイの真珠湾にあるアメリカ海軍の基地を、奇襲攻撃しました。
        show:
          - { type: title, text: 1941年　太平洋戦争の開戦 }
          - { type: text, at: [80, 140], w: 1120, text: "1941年12月8日　ハワイ・**真珠湾** を奇襲攻撃" }
      - say: 同時に東南アジアへの攻撃も始め、太平洋戦争が始まります。
        show:
          - { type: text, at: [80, 220], w: 1120, text: "同時に東南アジアへ侵攻 → **太平洋戦争** 始まる" }
      - say: 開戦を決めた東条英機内閣のもとでは、石油が止められたままでは、何もせずに死を待つようなものだ、それなら戦うしかない、という考えが語られていました。
        read: 開戦を決めたとうじょうひでき内閣のもとでは、石油が止められたままでは、何もせずに死を待つようなものだ、それなら戦うしかない、という考えが語られていました。
        show:
          - { type: box, at: [80, 320], w: 1120, color: yellow, text: "「石油禁輸のままでは座して死を待つようなもの、それなら戦うしかない」" }

  - board: whiteboard
    steps:
      - say: しかし、圧倒的な工業力と資源を持つアメリカを相手に、どこまで勝ち目があったのか。当時の指導者たちも、心の底ではわかっていたとも言われます。
        show:
          - { type: title, text: 勝ち目はあったのか }
      - say: 真珠湾攻撃を立案した山本五十六は、半年や一年は暴れてみせる、しかしその後は保証できない、と語ったとされています。
        read: 真珠湾攻撃を立案したやまもといそろくは、半年や一年は暴れてみせる、しかしその後は保証できない、と語ったとされています。
        show:
          - { type: box, at: [80, 140], w: 1120, color: blue, title: 山本五十六, text: "「半年や一年は暴れてみせる。しかしその後は保証できない」" }
      - say: 追いつめられた、と感じたとき、人も国も、冷静な判断を失いやすくなります。開戦までの流れは、その教訓としても読むことができます。
        added: true
        show:
          - { type: text, at: [80, 320], w: 1120, color: gray, text: "追いつめられると、冷静な判断を失いやすい" }
