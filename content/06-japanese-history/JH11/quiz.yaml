questions:
  - q: 1931年、関東軍が満州鉄道を自ら爆破したことから始まった軍事行動を何というか。
    a: [満州事変]
  - q: 1936年、陸軍の青年将校らが東京の中枢を占拠したクーデター事件を何というか。
    a: [二・二六事件, 226事件, 二二六事件]
    show: 二・二六事件
  - q: 1941年12月、日本がアメリカ海軍基地を奇襲攻撃した、ハワイの湾の名前は何か。
    a: [真珠湾, パールハーバー]
    show: 真珠湾
  - q: 1945年8月6日に原子爆弾が投下された都市はどこか。
    a: [広島, 広島市]
    show: 広島
