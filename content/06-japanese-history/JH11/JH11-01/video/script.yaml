title: 世界恐慌と日本の対応
scenes:
  - board: slide
    steps:
      - say: 第11章、「昭和前期と戦争」です。
        show:
          - { type: title, text: 第11章　昭和前期・戦争 }
      - say: 世界的な不景気から、軍部が力を強め、日中戦争、太平洋戦争へと進み、敗戦をむかえるまでを見ていきます。
        show:
          - type: list
            items: ["世界恐慌と日本の対応", "軍国主義と二・二六事件", "日中戦争と南京事件", "太平洋戦争の開戦", "戦時下の国民生活", "敗戦と原爆・東京大空襲", "戦争を生きた人物たち"]
      - say: なぜ日本は、勝ち目のうすい戦争に進んでしまったのか。一つの原因ではなく、いくつもの選択が積み重なった結果として見ていくことが大切です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "戦争への道を「一つひとつの選択の積み重ね」として理解する" }

  - board: whiteboard
    steps:
      - say: 1929年、アメリカのニューヨークの株式市場で、株価が大暴落しました。その影響は世界中に広がります。これが世界恐慌です。
        show:
          - { type: title, text: 1929年　世界恐慌 }
          - { type: text, at: [80, 140], w: 1120, text: "ニューヨークで株価が大暴落 → **世界中** に広がる" }
      - say: 貿易が大きく減り、工場は閉鎖され、町には仕事を失った人があふれました。
        show:
          - { type: text, at: [80, 220], w: 1120, text: "貿易が減る → 工場が閉鎖 → 失業者があふれる" }
      - say: 日本でも農村を中心に深刻な不況が続き、娘を売らなければならない家庭が出るほどの貧しさが広がりました。
        show:
          - { type: box, at: [80, 320], w: 1120, color: pink, text: "日本の農村：娘を身売りする家庭が出るほどの貧困" }

  - board: whiteboard
    steps:
      - say: この危機に、各国がどう対応したかが、その後の歴史を大きく分けます。
        show:
          - { type: title, text: 各国の対応 }
      - say: アメリカは、ルーズベルト大統領が、ニューディール政策を打ち出しました。大規模な公共事業で、仕事を作り出したのです。
        show:
          - { type: box, at: [80, 140], w: 360, color: blue, title: アメリカ, text: "ニューディール政策\n公共事業で仕事を作る" }
      - say: イギリスやフランスは、自分の植民地との貿易を優先し、ほかの国とは貿易を減らす、ブロック経済に移りました。
        show:
          - { type: box, at: [460, 140], w: 360, color: green, title: イギリス・フランス, text: "ブロック経済\n植民地との貿易を優先" }
      - say: 一方、植民地の少ない日本、ドイツ、イタリアは、経済の行きづまりを、軍事の力で切り開こう、という方向へ進んでいきます。
        show:
          - { type: box, at: [840, 140], w: 360, color: pink, title: 日本・ドイツ・イタリア, text: "植民地が少ない\n→ 軍事で切り開く" }

  - board: whiteboard
    steps:
      - say: 日本では軍部が、政治家や大企業が腐敗しているから不況が続くのだ、軍が主導すれば日本は強くなれる、と主張し、国民の間にも支持が広がりました。
        show:
          - { type: title, text: 民主主義への失望 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 軍部の主張, text: "「政治家や財閥が腐敗しているから不況が続く。軍が主導すれば強くなれる」" }
      - say: 暮らしが苦しいとき、民主主義への失望が、強いリーダーや独裁を求める声につながる。これは、この時代の世界共通の流れでした。
        show:
          - { type: text, at: [80, 340], w: 1120, size: l, text: "生活苦 → 民主主義への失望 → 独裁・軍国主義へ" }
