title: 軍国主義と二・二六事件
scenes:
  - board: whiteboard
    steps:
      - say: 1930年代、日本では、軍部の力が急速に大きくなります。政治家や大企業に不満を持つ若い将校たちは、腐敗した上の人たちを倒して、天皇中心の国に作り直す、という考えを持つようになりました。
        show:
          - { type: title, text: 青年将校たちの不満 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, text: "「腐敗した上層部を倒し、天皇中心の国に作り直す」" }

  - board: whiteboard
    steps:
      - say: 1932年、海軍の若い将校たちが、犬養毅首相を、首相官邸で撃ち殺しました。五・一五事件です。
        read: せんきゅうひゃくさんじゅうに年、海軍の若い将校たちが、いぬかいつよし首相を、首相官邸で撃ち殺しました。ごいちご事件です。
        show:
          - { type: title, text: 1932年　五・一五事件 }
          - { type: text, at: [80, 140], w: 1120, text: "海軍の青年将校が **犬養毅** 首相を殺害" }
      - say: 犬養は、話せばわかる、と言いましたが、将校たちは、問答無用、と撃ちました。この言葉の対比が、話し合いより暴力が通る時代の空気を表しています。
        show:
          - { type: box, at: [80, 230], w: 540, color: blue, title: 犬養毅, text: "「話せばわかる」" }
          - { type: box, at: [660, 230], w: 540, color: pink, title: 青年将校, text: "「問答無用」" }

  - board: whiteboard
    steps:
      - say: そして1936年、二・二六事件が起きます。陸軍の若い将校たち、およそ1500人が、東京の中心部を占拠し、大臣たちを殺害するクーデターを起こしました。
        read: そして、せんきゅうひゃくさんじゅうろく年、ににろく事件が起きます。陸軍の若い将校たち、およそせんごひゃく人が、東京の中心部を占拠し、大臣たちを殺害するクーデターを起こしました。
        show:
          - { type: title, text: 1936年　二・二六事件 }
          - { type: text, at: [80, 140], w: 1120, text: "陸軍の青年将校 約1500人が東京の中心部を占拠・大臣らを殺害" }
      - say: 首相官邸や警視庁などがおさえられ、東京は3日間、雪のなかで緊張に包まれました。しかし昭和天皇が、強い言葉で鎮圧を命じ、反乱は失敗。首謀者たちは処刑されます。
        show:
          - { type: text, at: [80, 230], w: 1120, text: "昭和天皇が鎮圧を命じる → 反乱は失敗" }
      - say: 皮肉なことに、クーデターは失敗したのに、政治家たちは、また軍が暴走するかもしれない、とおそれて、軍に逆らえなくなりました。結果として、軍の政治支配は、かえって強まったのです。
        show:
          - { type: box, at: [80, 340], w: 1120, color: pink, title: 皮肉な結果, text: "失敗したのに → 政治家が軍をおそれる → 軍の支配が強まる" }
