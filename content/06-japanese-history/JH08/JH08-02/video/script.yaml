title: 鎖国と対外関係
scenes:
  - board: whiteboard
    steps:
      - say: 江戸幕府は、外国との交流を厳しく制限しました。これが鎖国です。
        show:
          - { type: title, text: 鎖国 }
      - say: ただし、完全に閉じていたわけではありません。長崎の出島ではオランダと貿易し、朝鮮、琉球、アイヌの人々とも、限られた交流が続いていました。
        show:
          - type: list
            at: [80, 140]
            items: ["長崎・出島：**オランダ**・中国", "対馬藩：**朝鮮**", "薩摩藩：**琉球**", "松前藩：**アイヌ**"]
      - say: 窓口を4つにしぼって、幕府が管理した、と考えるとわかりやすいでしょう。
        added: true
        show:
          - { type: box, at: [660, 140], w: 540, color: yellow, title: 4つの窓口, text: "閉じたのではなく\n**窓口をしぼって管理**" }

  - board: whiteboard
    steps:
      - say: なぜ鎖国をしたのでしょうか。いちばんの理由は、キリスト教を禁じるためです。信者が、幕府よりも神や外国の勢力に従い、支配が揺らぐことを恐れたのです。
        show:
          - { type: title, text: なぜ鎖国？ }
          - { type: box, at: [80, 140], w: 540, color: pink, title: ①キリスト教の禁止, text: "信者が幕府より神（外国）に従うのを恐れた" }
      - say: もう一つは、貿易の利益を、幕府と一部の藩でひとりじめしたい、という経済的な理由です。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: ②貿易の独占, text: "利益を幕府と一部の藩で独占" }

  - board: whiteboard
    steps:
      - say: 200年以上続いた鎖国の、いちばんの効果は、平和でした。大きな対外戦争がなく、人々のくらしは少しずつ豊かになっていきます。
        show:
          - { type: title, text: 鎖国がもたらしたもの }
          - { type: box, at: [80, 140], w: 540, color: green, title: よかった点, text: "200年以上、対外戦争のない **平和**" }
      - say: 一方、その間にヨーロッパでは産業革命が起こり、急速に近代化が進みました。幕末に黒船が来たとき、日本がその差にがく然としたのは、当然の結果でした。
        show:
          - { type: box, at: [660, 140], w: 540, color: pink, title: 困った点, text: "その間に欧米は **産業革命**\n→ 技術の差が開く" }
      - say: 外と比べないと、自分たちの遅れに気づけない。これは国だけでなく、会社や個人にも言えることかもしれません。
        added: true
        show:
          - { type: text, at: [80, 380], w: 1120, color: gray, text: "外と比べないと、遅れに気づけない" }
