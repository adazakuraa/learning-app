title: 享保・寛政・天保の改革
scenes:
  - board: whiteboard
    steps:
      - say: 江戸時代の中ごろから、幕府はお金が足りなくなり、社会の乱れにも悩まされます。そのたびに、改革が行われました。
        show:
          - { type: title, text: 江戸の三大改革 }
          - { type: text, at: [80, 140], w: 1120, text: "背景：幕府の **財政難** ＋ 社会の乱れ" }
      - say: 有名なのは三つ。8代将軍、徳川吉宗の享保の改革、松平定信の寛政の改革、水野忠邦の天保の改革です。
        read: 有名なのは三つ。8代将軍、とくがわよしむねのきょうほうの改革、まつだいらさだのぶのかんせいの改革、みずのただくにのてんぽうの改革です。
        show:
          - { type: box, at: [80, 230], w: 360, color: green, title: 享保の改革, text: "8代将軍 徳川吉宗\n（1700年代前半）" }
          - { type: box, at: [460, 230], w: 360, color: blue, title: 寛政の改革, text: "老中 松平定信\n（1700年代後半）" }
          - { type: box, at: [840, 230], w: 360, color: pink, title: 天保の改革, text: "老中 水野忠邦\n（1800年代前半）" }

  - board: whiteboard
    steps:
      - say: 時代はちがっても、中身はどれも、倹約しなさい、ぜいたくは禁止、風紀を正しなさい、という方向でした。
        show:
          - { type: title, text: 中身はどれも似ている }
          - { type: text, at: [80, 140], w: 1120, size: l, text: "倹約しろ・ぜいたく禁止・風紀を正せ" }
      - say: 吉宗の改革は、ある程度成功しました。新しい田んぼを開いて年貢を増やし、人々の意見を聞く目安箱を置くなど、具体的な手も打ったからです。
        read: 吉宗の改革は、ある程度成功しました。新しい田んぼを開いて年貢を増やし、人々の意見を聞くめやすばこを置くなど、具体的な手も打ったからです。
        added: true
        show:
          - { type: box, at: [80, 250], w: 1120, color: green, title: 享保の改革 → ある程度成功, text: "新田開発で年貢を増やす・目安箱で庶民の声を聞く" }
      - say: 一方、寛政と天保の改革は、最終的に失敗します。ぜいたくや娯楽を厳しく取りしまりすぎて、人々や商人の反発を招いたのです。
        show:
          - { type: box, at: [80, 420], w: 1120, color: pink, title: 寛政・天保の改革 → 失敗, text: "取りしまりが厳しすぎて、人々や商人が反発" }

  - board: whiteboard
    steps:
      - say: 節約だけでは、経済は元気になりません。みんながお金を使わなくなると、お店がもうからず、かえって不景気になるからです。
        added: true
        show:
          - { type: title, text: 節約だけでは立ち直れない }
          - { type: text, at: [80, 140], w: 1120, text: "みんなが節約 → お店がもうからない → さらに不景気" }
      - say: 収入を増やす工夫と、支出を減らす工夫のバランス。今の国の予算や、家計の見直しにも通じる話です。
        added: true
        show:
          - { type: box, at: [80, 260], w: 1120, color: yellow, text: "収入を増やす工夫 ＋ 支出を減らす工夫 の **バランス** が大事" }
