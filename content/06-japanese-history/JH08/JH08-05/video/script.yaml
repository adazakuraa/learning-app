title: 化政文化
scenes:
  - board: whiteboard
    steps:
      - say: 19世紀のはじめに花開いたのが、化政文化です。今度は上方ではなく、江戸が文化の中心になり、より庶民的な文化が広がりました。
        read: 19世紀のはじめに花開いたのが、かせい文化です。今度はかみがたではなく、江戸が文化の中心になり、より庶民的な文化が広がりました。
        show:
          - { type: title, text: 化政文化 }
          - { type: box, at: [80, 140], w: 540, color: gray, title: 元禄文化, text: "上方（大阪・京都）中心" }
          - { type: arrow, from: [628, 200], to: [652, 200] }
          - { type: box, at: [660, 140], w: 540, color: yellow, title: 化政文化, text: "**江戸** 中心・より庶民的" }

  - board: whiteboard
    steps:
      - say: 浮世絵では、葛飾北斎の『富嶽三十六景』や、歌川広重の『東海道五十三次』が、今も世界中で愛されています。
        read: 浮世絵では、かつしかほくさいの『ふがくさんじゅうろっけい』や、うたがわひろしげの『とうかいどうごじゅうさんつぎ』が、今も世界中で愛されています。
        show:
          - { type: title, text: 浮世絵とジャポニスム }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 葛飾北斎, text: "『富嶽三十六景』" }
          - { type: box, at: [660, 140], w: 540, color: green, title: 歌川広重, text: "『東海道五十三次』" }
      - say: 北斎は、モネやゴッホなど、ヨーロッパの画家たちにも大きな影響を与えました。ジャポニスムと呼ばれる、日本美術のブームです。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "→ モネ・ゴッホに影響　＝ 「**ジャポニスム**」" }
      - say: 浮世絵は、当時は一枚がそば一杯ほどの値段で買える、庶民の楽しみでした。今でいうポスターやブロマイドのようなものが、世界の芸術を動かしたのです。
        added: true
        show:
          - { type: text, at: [80, 410], w: 1120, color: gray, text: "庶民のポスター・ブロマイドが、世界の芸術を動かした" }

  - board: whiteboard
    steps:
      - say: 長い読み物も人気でした。十返舎一九の『東海道中膝栗毛』は、弥次さん喜多さんのドタバタ旅行記です。
        read: 長い読み物も人気でした。じっぺんしゃいっくの、とうかいどうちゅうひざくりげは、やじさんきたさんのドタバタ旅行記です。
        show:
          - { type: title, text: 人気の読み物 }
          - type: list
            at: [80, 140]
            items: ["十返舎一九『東海道中膝栗毛』（弥次さん喜多さんの旅）", "滝沢馬琴『南総里見八犬伝』（長編の冒険物語）"]
      - say: 滝沢馬琴の『南総里見八犬伝』も人気を集めました。平和な時代だからこそ、旅や物語を楽しむ余裕が、庶民にも生まれたのです。
        read: たきざわばきんの『なんそうさとみはっけんでん』も人気を集めました。平和な時代だからこそ、旅や物語を楽しむ余裕が、庶民にも生まれたのです。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "平和 → 庶民にも、旅や物語を楽しむ **余裕**" }
