title: 元禄文化
scenes:
  - board: whiteboard
    steps:
      - say: 5代将軍、徳川綱吉の時代に花開いたのが、元禄文化です。大阪や京都、つまり上方の町人たちが、文化の主役になりました。
        read: 5代将軍、とくがわつなよしの時代に花開いたのが、元禄文化です。大阪や京都、つまりかみがたの町人たちが、文化の主役になりました。
        show:
          - { type: title, text: 元禄文化 }
          - { type: text, at: [80, 140], w: 1120, text: "5代将軍・徳川綱吉のころ　主役は **上方**（大阪・京都）の **町人**" }
      - say: 武士や貴族ではなく、お金を持った町人が文化を支える。平和が続いて、商売がさかんになった証拠です。
        added: true
        show:
          - { type: text, at: [80, 220], w: 1120, color: gray, text: "平和 → 商売がさかん → 町人が文化の主役に" }

  - board: whiteboard
    steps:
      - say: 松尾芭蕉は、俳句を芸術の高さまで引き上げた人物です。古池や、かわず飛び込む、水の音。世界でもっとも有名な日本語の詩の一つです。
        read: まつおばしょうは、俳句を芸術の高さまで引き上げた人物です。古池や、かわず飛び込む、水の音。世界でもっとも有名な日本語の詩の一つです。
        show:
          - { type: title, text: 元禄の文化人 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 松尾芭蕉（俳句）, text: "古池や　蛙飛び込む　水の音　／　旅の記録『奥の細道』" }
      - say: 芭蕉は東北などを旅しながら句をよみ、その記録が『奥の細道』として残っています。
        read: 芭蕉は東北などを旅しながら句をよみ、その記録が『おくのほそみち』として残っています。
        show: []
      - say: 井原西鶴は、今でいう小説で、町人のくらしや恋を生き生きと描きました。近松門左衛門は、人形浄瑠璃や歌舞伎の脚本家として、悲しい恋の物語などを書きました。
        read: いはらさいかくは、今でいう小説で、町人のくらしや恋を生き生きと描きました。ちかまつもんざえもんは、人形じょうるりや歌舞伎の脚本家として、悲しい恋の物語などを書きました。
        show:
          - { type: box, at: [80, 320], w: 540, color: blue, title: 井原西鶴（小説）, text: "町人のくらし・恋" }
          - { type: box, at: [660, 320], w: 540, color: green, title: 近松門左衛門（脚本）, text: "人形浄瑠璃・歌舞伎" }

  - board: whiteboard
    steps:
      - say: 綱吉といえば、生類憐みの令でも有名です。犬を傷つけると厳しく罰せられ、綱吉は、犬公方とも呼ばれました。
        read: 綱吉といえば、しょうるいあわれみの令でも有名です。犬を傷つけると厳しく罰せられ、綱吉は、いぬくぼうとも呼ばれました。
        show:
          - { type: title, text: 生類憐みの令 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: よくあるイメージ, text: "犬を大事にしすぎた悪法\n綱吉 ＝「犬公方」" }
      - say: ただ最近の研究では、戦国時代から続いていた、命を軽く見る風潮を改めようとした政策だった、という評価もあります。ただの犬好きの変な法律ではなかった、という見方です。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: 最近の評価, text: "命を軽く見る風潮を\n改めようとした政策" }
      - say: 同じできごとでも、時代や見る角度によって評価が変わる。歴史を学ぶ面白さの一つです。
        added: true
        show:
          - { type: text, at: [80, 380], w: 1120, color: gray, text: "評価は、時代と見る角度で変わる" }
