title: 徳川家康
scenes:
  - board: slide
    steps:
      - say: 第8章、「江戸時代」です。
        show:
          - { type: title, text: 第8章　江戸時代 }
      - say: 徳川家康が開いた江戸幕府は、およそ260年続きます。そのしくみ、鎖国、町人の文化、そして幕府の改革を見ていきます。
        show:
          - type: list
            items: ["徳川家康", "鎖国と対外関係", "元禄文化", "享保・寛政・天保の改革", "化政文化"]
      - say: 戦争のない時代が、これほど長く続いたのは、世界でもめずらしいことです。平和が、どんな文化と、どんな遅れを生んだのか、に注目しましょう。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "長い平和を支えたしくみと、その平和が生んだ文化・遅れをつかむ" }

  - board: whiteboard
    steps:
      - say: 秀吉が亡くなったあと、力をのばしたのが徳川家康です。家康は秀吉から、息子の秀頼が大人になるまで、豊臣家を頼む、と頼まれていました。
        read: 秀吉が亡くなったあと、力をのばしたのがとくがわいえやすです。家康は秀吉から、息子のひでよりが大人になるまで、豊臣家を頼む、と頼まれていました。
        show:
          - { type: title, text: 家康の天下取り }
          - { type: text, at: [80, 140], w: 1120, text: "秀吉の遺言：「息子・秀頼を頼む」" }
      - say: それなのに、家康は着々と勢力を固め、1600年の関ヶ原の戦いで、石田三成らを破ります。そして1603年、征夷大将軍となり、江戸に幕府を開きました。
        read: それなのに、家康は着々と勢力を固め、1600年の関ヶ原の戦いで、いしだみつなりらを破ります。そして1603年、せいいたいしょうぐんとなり、江戸に幕府を開きました。
        show:
          - type: list
            at: [80, 220]
            items: ["1600年　**関ヶ原の戦い**（石田三成らを破る）", "1603年　征夷大将軍 → **江戸幕府**", "1615年　大阪夏の陣 → 豊臣家ほろぶ"]
      - say: 最後は、大阪夏の陣で、秀頼と母の淀君を自害に追い込み、豊臣家をほろぼしました。
        read: 最後は、大阪夏の陣で、秀頼と母のよどぎみを自害に追い込み、豊臣家をほろぼしました。
        show: []

  - board: whiteboard
    steps:
      - say: 家康が作った、幕藩体制は、とてもよくできていました。幕府と、各地の藩が、役割を分けて全国を治めるしくみです。
        read: 家康が作った、ばくはん体制は、とてもよくできていました。幕府と、各地の藩が、役割を分けて全国を治めるしくみです。
        show:
          - { type: title, text: 反乱を起こさせないしくみ }
      - say: 大名を、徳川の一族の親藩、古くからの家来の譜代、関ヶ原のあとに従った外様に分けました。そして、外様大名は、江戸から遠い地方に置き、反乱を起こしにくくしました。
        read: 大名を、徳川の一族のしんぱん、古くからの家来のふだい、関ヶ原のあとに従ったとざまに分けました。そして、とざま大名は、江戸から遠い地方に置き、反乱を起こしにくくしました。
        show:
          - { type: box, at: [80, 140], w: 360, color: yellow, title: 親藩, text: "徳川の一族" }
          - { type: box, at: [460, 140], w: 360, color: blue, title: 譜代, text: "古くからの家来\n→ 重要な場所に" }
          - { type: box, at: [840, 140], w: 360, color: pink, title: 外様, text: "関ヶ原後に従った\n→ **遠くに** 置く" }
      - say: さらに、参勤交代で、大名に1年おきに江戸と領地を行き来させました。大行列の旅費と、江戸でのくらしの費用で、大名のお金を使わせ、力をそいだのです。
        show:
          - { type: box, at: [80, 360], w: 1120, color: green, title: 参勤交代, text: "1年おきに江戸と領地を往復 → 旅費・滞在費で **お金を使わせる**" }
      - say: 一方で、大名行列が通る街道や宿場町がにぎわい、全国の道や経済が発展するきっかけにもなりました。
        added: true
        show:
          - { type: text, at: [80, 540], w: 1120, color: gray, text: "おまけの効果：街道・宿場町がにぎわい、経済が発展" }

  - board: whiteboard
    steps:
      - say: 家康は、鳴かぬなら、鳴くまで待とう、ホトトギス、という句で知られるように、しんぼう強くチャンスを待つ人物として描かれます。
        show:
          - { type: title, text: 待つ人・家康 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, text: "鳴かぬなら　鳴くまで待とう　ホトトギス" }
      - say: 天下を取ったのは60歳をこえてから。若いころは、今川氏の人質として苦労を重ねました。その経験が、この忍耐力を育てたとも言われます。遅咲きの成功者ですね。
        show:
          - { type: text, at: [80, 300], w: 1120, text: "若いころは人質生活 → 60歳をこえて天下人（遅咲き）" }
