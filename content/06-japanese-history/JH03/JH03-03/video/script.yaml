title: 仏教と国家
scenes:
  - board: whiteboard
    steps:
      - say: 奈良時代の仏教は、一人ひとりを救うというより、国を守るための道具という性格が強いものでした。
        show:
          - { type: title, text: 国を守る仏教 }
          - { type: text, at: [80, 140], w: 1120, text: "奈良時代の仏教 ＝ **国を守るための道具**" }
      - say: 聖武天皇は、病気の流行や反乱が続くなか、仏教の力で国を安定させようと考えました。そして全国に国分寺を建て、東大寺の大仏を完成させます。
        read: しょうむてんのうは、病気の流行や反乱が続くなか、仏教の力で国を安定させようと考えました。そして全国にこくぶんじを建て、とうだいじの大仏を完成させます。
        show:
          - { type: box, at: [80, 230], w: 540, color: blue, title: 国分寺, text: "全国（各国）に建てた寺" }
          - { type: box, at: [660, 230], w: 540, color: yellow, title: 東大寺の大仏, text: "高さ 約15m の金銅仏" }
      - say: 大仏を作るために、当時の日本でとれた銅の大半が使われたと言われます。まさに国をあげての大事業でした。
        show:
          - { type: text, at: [80, 420], w: 1120, text: "当時の日本の銅の大半を使った **国家プロジェクト**" }

  - board: whiteboard
    steps:
      - say: 一方で、道鏡というお坊さんが権力を握り、天皇の位を狙ったとされる事件も起きます。
        read: 一方で、どうきょうというお坊さんが権力を握り、天皇の位を狙ったとされる事件も起きます。
        show:
          - { type: title, text: 道鏡の事件 }
          - { type: text, at: [80, 140], w: 1120, text: "上皇に気に入られた僧・**道鏡** が、天皇の位を狙う？" }
      - say: そこで宇佐八幡宮に神様のお告げを求めたところ、道鏡を天皇にしてはならない、という答えが返ってきて、道鏡はあきらめた、という話です。
        read: そこでうさはちまんぐうに神様のお告げを求めたところ、道鏡を天皇にしてはならない、という答えが返ってきて、道鏡はあきらめた、という話です。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: 宇佐八幡宮のお告げ, text: "「道鏡を天皇にしてはならない」" }
      - say: ただし、このお告げは、道鏡を天皇にしたくない人たちが作ったものだ、という説もあります。仏教と権力の近すぎる関係は、すでにこのころから問題になっていました。
        show:
          - { type: text, at: [80, 410], w: 1120, color: gray, text: "仏教と権力が近すぎる → 次の平安時代の「遷都」へつながる" }
