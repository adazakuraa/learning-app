title: 万葉集
scenes:
  - board: whiteboard
    steps:
      - say: 万葉集は、8世紀後半にまとめられた、日本で最も古い歌集です。およそ4500首の歌がおさめられています。
        show:
          - { type: title, text: 万葉集 }
          - { type: text, at: [80, 140], w: 1120, text: "8世紀後半　日本最古の歌集　約 **4500首**" }
      - say: いちばんの特徴は、天皇や貴族だけでなく、防人や農民まで、さまざまな立場の人の歌が入っていることです。防人とは、国の守りのために各地から集められた兵士のことです。
        read: いちばんの特徴は、天皇や貴族だけでなく、さきもりや農民まで、さまざまな立場の人の歌が入っていることです。さきもりとは、国の守りのために各地から集められた兵士のことです。
        show:
          - type: list
            at: [80, 220]
            items: ["天皇・貴族", "**防人**（遠くの守りに集められた兵士）", "農民"]

  - board: whiteboard
    steps:
      - say: 当時は、まだひらがながありません。そこで、漢字の音だけを借りて日本語を書く、万葉仮名という方法が使われました。
        show:
          - { type: title, text: 万葉仮名 }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: 漢字の「音」だけを借りる, text: "例：「やま」→「也末」　今でいう **当て字**" }
      - say: 今でいう当て字のようなものなので、読み解くのがとても難しく、今でも解釈が分かれる歌もあります。
        show: []

  - board: whiteboard
    steps:
      - say: 防人の妻がよんだ歌を一つ紹介します。防人に行くのは誰の夫かしら、と気楽に聞いている人がうらやましい。あの人たちは、悲しい思いをしなくてすむのだから。という意味です。
        read: さきもりの妻がよんだ歌を一つ紹介します。さきもりに行くのは誰の夫かしら、と気楽に聞いている人がうらやましい。あの人たちは、悲しい思いをしなくてすむのだから。という意味です。
        show:
          - { type: title, text: 防人の妻の歌 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, text: "防人に　行くは誰が背と　問ふ人を　見るがともしさ　物思ひもせず" }
          - { type: text, at: [80, 320], w: 1120, text: "「防人に行くのは誰の夫？」と聞く人がうらやましい。\nあの人は悲しい思いをしなくてすむのだから。" }
      - say: 1300年前の歌ですが、家族を遠くに送り出す気持ちは、今と変わりませんね。
        added: true
        show: []

  - board: whiteboard
    steps:
      - say: 今の元号、令和は、万葉集の歌から取られました。日本の古典からとった、初めての元号として話題になりました。
        show:
          - { type: title, text: 令和と万葉集 }
          - { type: text, at: [80, 140], w: 1120, size: l, text: "元号「**令和**」の出典は万葉集" }
          - { type: text, at: [80, 260], w: 1120, color: gray, text: "それまでの元号は、ほぼ中国の古典から" }
