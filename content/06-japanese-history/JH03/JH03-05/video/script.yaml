title: おまけ（和気清麻呂）
scenes:
  - board: whiteboard
    steps:
      - say: おまけの話です。和気清麻呂は、天皇の位を奪おうとした道鏡を、宇佐八幡宮のお告げによって止めた人物です。
        read: おまけの話です。わけのきよまろは、天皇の位を奪おうとしたどうきょうを、うさはちまんぐうのお告げによって止めた人物です。
        show:
          - { type: title, text: 和気清麻呂 }
          - { type: box, at: [80, 140], w: 1120, color: blue, text: "宇佐八幡宮のお告げを持ち帰り、道鏡の野望を止めた" }
      - say: ところが、怒った道鏡の側から、仕返しを受けます。役職を奪われて島流しにされたうえ、名前まで、別部穢麻呂に、むりやり変えさせられたのです。
        read: ところが、怒った道鏡の側から、仕返しを受けます。役職を奪われて島流しにされたうえ、名前まで、わけべのきたなまろに、むりやり変えさせられたのです。
        show:
          - { type: text, at: [80, 300], w: 1120, size: l, text: "和気清麻呂 → 別部**穢**麻呂（きたなまろ）" }
      - say: 協力したお姉さんの広虫も、狭虫という名前に変えさせられました。今でいえば、悪口のあだ名を公式の名前にされるようなものです。
        read: 協力したお姉さんのひろむしも、さむしという名前に変えさせられました。今でいえば、悪口のあだ名を公式の名前にされるようなものです。
        show:
          - { type: text, at: [80, 400], w: 1120, size: l, text: "姉：広虫 → **狭**虫（さむし）" }
          - { type: text, at: [80, 500], w: 1120, color: gray, text: "名前を悪く変える ＝ 公式の「いやがらせ」" }
