title: 大正文化と近代思想
scenes:
  - board: whiteboard
    steps:
      - say: 大正時代の文化は、明治の、西洋に追いつけ、というあせりから少し解放されて、より自由で、多様なものになりました。
        show:
          - { type: title, text: 大正の文学 }
          - { type: text, at: [80, 140], w: 1120, text: "明治「西洋に追いつけ」→ 大正「より自由で多様に」" }
      - say: 文学では、芥川龍之介、志賀直哉、谷崎潤一郎らが活躍します。
        read: 文学では、あくたがわりゅうのすけ、しがなおや、たにざきじゅんいちろうらが活躍します。
        show:
          - type: list
            at: [80, 220]
            items: ["芥川龍之介『羅生門』『藪の中』", "志賀直哉", "谷崎潤一郎"]
      - say: 芥川の『羅生門』や『藪の中』は、今も教科書にのる作品です。人間の自分勝手さや、真実のあいまいさを、するどく描いています。
        read: 芥川の『らしょうもん』や『やぶのなか』は、今も教科書にのる作品です。人間の自分勝手さや、真実のあいまいさを、するどく描いています。
        show:
          - { type: box, at: [80, 420], w: 1120, color: blue, text: "人間の自分勝手さ・真実のあいまいさを描く" }

  - board: whiteboard
    steps:
      - say: 都市では、モダンガール、モダンボーイと呼ばれる、西洋風のファッションを楽しむ若者が現れました。略して、モガ、モボです。
        show:
          - { type: title, text: モダンな都市生活 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: モガ・モボ, text: "西洋風のファッションを楽しむ若者" }
      - say: カフェ、映画、レコードが広まり、ラジオ放送も始まります。今のわたしたちの、娯楽のある都市生活の原型が、ここで生まれました。
        show:
          - type: list
            at: [80, 320]
            items: ["カフェ", "映画", "レコード", "ラジオ放送（1925年〜）"]
