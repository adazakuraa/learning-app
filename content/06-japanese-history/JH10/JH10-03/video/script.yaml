title: 大正デモクラシー
scenes:
  - board: whiteboard
    steps:
      - say: 大正時代、1912年から1926年は、日本の民主主義がもっとも活発だった時期の一つです。
        show:
          - { type: title, text: 大正デモクラシー }
          - { type: text, at: [80, 140], w: 1120, text: "大正時代（1912〜1926年）　民主主義が活発に" }
      - say: それまでの選挙では、一定以上の税金を納めた男性しか、投票できませんでした。財産や身分に関係なく選挙権を、という普通選挙を求める運動が高まり、1925年、男性の普通選挙法が成立します。
        show:
          - { type: box, at: [80, 230], w: 540, color: gray, title: それまで, text: "一定以上の税金を納めた\n男性だけ" }
          - { type: arrow, from: [628, 290], to: [652, 290] }
          - { type: box, at: [660, 230], w: 540, color: green, title: 1925年 普通選挙法, text: "25歳以上の **男性** すべて" }
      - say: ただし、女性の選挙権はまだなく、それは戦後まで待つことになります。
        show:
          - { type: text, at: [80, 430], w: 1120, color: gray, text: "女性の選挙権は戦後（1945年）まで待つ" }

  - board: whiteboard
    steps:
      - say: この時代の自由な雰囲気は、都市の会社員などを中心に広がりました。労働運動や、女性の解放運動もさかんになります。
        show:
          - { type: title, text: 声をあげる人々 }
      - say: 平塚らいてうは、元始、女性は太陽であった、という宣言で、女性解放運動を引っぱりました。女性は家にいるもの、とされた時代に、堂々と異をとなえたのです。
        read: ひらつからいちょうは、げんし、女性は太陽であった、という宣言で、女性解放運動を引っぱりました。女性は家にいるもの、とされた時代に、堂々と異をとなえたのです。
        show:
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 平塚らいてう, text: "「元始、女性は太陽であった」" }

  - board: whiteboard
    steps:
      - say: しかし、この自由な空気は長続きしません。1925年、普通選挙法と同時に、治安維持法も作られました。
        show:
          - { type: title, text: アメとムチ }
          - { type: box, at: [80, 140], w: 540, color: green, title: アメ：普通選挙法, text: "選挙権を広げる" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: ムチ：治安維持法, text: "社会主義などを取りしまる" }
      - say: 社会主義や共産主義の活動を取りしまる法律でしたが、のちに拡大して解釈され、政府への批判そのものをおさえこむ道具として使われていきます。
        show:
          - { type: text, at: [80, 340], w: 1120, text: "のちに拡大解釈 → **政府批判そのもの** を弾圧する道具に" }
      - say: 法律は、作られたときの目的をこえて使われることがある。自由と弾圧が同時に進んだ、矛盾をかかえた時代でした。
        added: true
        show:
          - { type: text, at: [80, 440], w: 1120, color: gray, text: "法律は、作った目的をこえて使われることがある" }
