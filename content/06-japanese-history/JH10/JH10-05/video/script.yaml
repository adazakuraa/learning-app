title: 関東大震災
scenes:
  - board: whiteboard
    steps:
      - say: 1923年9月1日、マグニチュード7.9の大地震が、関東地方をおそいました。関東大震災です。
        read: せんきゅうひゃくにじゅうさん年くがつついたち、マグニチュード、ななてんきゅうの大地震が、関東地方をおそいました。関東大震災です。
        show:
          - { type: title, text: 1923年　関東大震災 }
          - { type: text, at: [80, 140], w: 1120, text: "1923年9月1日　マグニチュード **7.9**" }
      - say: お昼ごはんの準備で火を使う時間だったこともあり、東京や横浜を中心に、大きな火災が起きました。死者と行方不明者は、10万人以上にのぼります。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, text: "昼食の準備の時間 → 大火災　死者・行方不明者 **10万人以上**" }
      - say: 9月1日が、防災の日とされているのは、この震災がきっかけです。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "9月1日「防災の日」の由来" }

  - board: whiteboard
    steps:
      - say: この混乱のなかで、朝鮮人虐殺事件が起きます。朝鮮人が井戸に毒を入れた、暴動を起こしている、というデマが広がりました。
        show:
          - { type: title, text: デマが生んだ悲劇 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: デマ, text: "「朝鮮人が井戸に毒を入れた」「暴動を起こしている」" }
      - say: そして自警団や、軍、警察によって、数千人ともいわれる朝鮮人が殺害されました。6000人以上とする推計もあります。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "自警団・軍・警察により、**数千人** ともいわれる朝鮮人が殺害" }
      - say: 不安のなかで広がるデマが、人を暴力にかりたてる。SNSでデマが一気に広がる今こそ、忘れてはいけない教訓です。
        read: 不安のなかで広がるデマが、人を暴力にかりたてる。エスエヌエスでデマが一気に広がる今こそ、忘れてはいけない教訓です。
        added: true
        show:
          - { type: box, at: [80, 420], w: 1120, color: blue, text: "災害時のデマに注意 ← SNSの時代こそ大切な教訓" }

  - board: whiteboard
    steps:
      - say: 震災のあと、東京は復興事業によって、近代的な都市に生まれ変わります。
        show:
          - { type: title, text: 帝都復興 }
      - say: 復興を指揮した後藤新平は、大きな道路や公園を作る、大規模な都市計画を進めました。今の東京の、大通りや公園の骨組みの多くは、この計画に由来しています。
        read: 復興を指揮したごとうしんぺいは、大きな道路や公園を作る、大規模な都市計画を進めました。今の東京の、大通りや公園の骨組みの多くは、この計画に由来しています。
        show:
          - { type: box, at: [80, 140], w: 1120, color: green, title: 後藤新平の復興計画, text: "広い道路・公園 → 今の東京の骨組みに" }
