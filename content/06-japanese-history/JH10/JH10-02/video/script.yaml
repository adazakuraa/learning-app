title: 韓国併合と植民地支配
scenes:
  - board: whiteboard
    steps:
      - say: 日露戦争のあと、日本は朝鮮半島への影響力を強め、1910年、韓国を併合して植民地にしました。
        show:
          - { type: title, text: 1910年　韓国併合 }
          - { type: text, at: [80, 140], w: 1120, text: "1910年 **韓国併合** 〜 1945年の敗戦まで **35年間** 統治" }
      - say: これ以後、1945年の敗戦まで、35年間、日本は朝鮮を統治します。
        show: []

  - board: whiteboard
    steps:
      - say: 統治の中身は、時期によって異なります。はじめは武力を背景にした厳しい支配で、土地の調査を通じて、農民が土地を失う政策も行われました。
        show:
          - { type: title, text: 植民地支配 }
          - { type: box, at: [80, 140], w: 1120, color: pink, title: 初期の支配, text: "武力を背景にした厳しい支配・土地調査で農民が土地を失う" }
      - say: 1919年には、朝鮮全土で、日本からの独立を求める、三・一独立運動が起きます。日本は、これを武力でおさえこみました。
        read: 1919年には、朝鮮全土で、日本からの独立を求める、さんいち独立運動が起きます。日本は、これを武力でおさえこみました。
        show:
          - { type: box, at: [80, 300], w: 1120, color: yellow, title: 1919年　三・一独立運動, text: "朝鮮全土で独立を求める → 日本は武力で鎮圧" }
      - say: この歴史は、今の日本と韓国の関係にも、深い影を落としています。ニュースで歴史問題が取り上げられるとき、その出発点の一つがここにあります。
        show:
          - { type: text, at: [80, 470], w: 1120, color: gray, text: "→ 今の日韓関係の「歴史問題」の出発点の一つ" }
