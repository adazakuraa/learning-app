title: 日清・日露戦争と帝国主義
scenes:
  - board: slide
    steps:
      - say: 第10章、「明治後期から大正時代」です。
        show:
          - { type: title, text: 第10章　明治後期〜大正時代 }
      - say: 日本は戦争に勝って植民地を持つ国になります。一方、国内では民主主義の動きが高まり、新しい文化も生まれます。そして関東大震災が起こります。
        show:
          - type: list
            items: ["日清・日露戦争と帝国主義", "韓国併合と植民地支配", "大正デモクラシー", "大正文化と近代思想", "関東大震災"]
      - say: 外には強い国、内には自由を求める声。この二つの動きが、次の戦争の時代へどうつながるのかを意識してください。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "対外進出と国内の民主化、二つの流れが同時に進んだことをつかむ" }

  - board: whiteboard
    steps:
      - say: 明治の日本は、西洋の強い国に追いつくため、帝国主義の道を歩みます。帝国主義とは、軍事力や経済力で、ほかの国を支配し、植民地にする政策です。
        show:
          - { type: title, text: 帝国主義 }
          - { type: box, at: [80, 140], w: 1120, color: pink, title: 帝国主義, text: "軍事力・経済力でほかの国を支配し、植民地にする" }
      - say: 当時の世界では、強い国が弱い国を支配するのが当然、とされていました。支配されないためには、支配する側に回るしかない、と考えられた時代です。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "当時は「強い国が弱い国を支配する」のが当然とされた" }

  - board: whiteboard
    steps:
      - say: 1894年、日本は、中国の清との戦争、日清戦争に勝ち、台湾と遼東半島を手に入れます。
        read: 1894年、日本は、中国のしんとの戦争、日しん戦争に勝ち、台湾とりょうとう半島を手に入れます。
        show:
          - { type: title, text: 日清戦争と三国干渉 }
          - { type: text, at: [80, 140], w: 1120, text: "1894年 **日清戦争** に勝利 → 台湾・遼東半島を得る" }
      - say: ところが、ロシア、フランス、ドイツの三国が、遼東半島を清に返せ、と圧力をかけてきます。これが三国干渉です。
        read: ところが、ロシア、フランス、ドイツの三国が、りょうとう半島を清に返せ、と圧力をかけてきます。これが三国干渉です。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, title: 三国干渉, text: "ロシア・フランス・ドイツ「遼東半島を返せ」" }
      - say: 本当の狙いは、ロシアでした。ロシアは、冬でも凍らない港を求めて、南へ勢力をのばそうとしていたのです。軍事力でかなわない日本は、しかたなく返しました。
        show:
          - { type: text, at: [80, 400], w: 1120, text: "本当の狙い：ロシアの **南下政策**（凍らない港がほしい）" }

  - board: whiteboard
    steps:
      - say: その10年後の1904年、日本はそのロシアと戦争を始めます。日露戦争です。
        show:
          - { type: title, text: 1904年　日露戦争 }
      - say: ロシアが圧倒的に有利と見られていましたが、日本は日本海の海戦でロシアの艦隊を破ります。指揮した東郷平八郎は、世界的な英雄になりました。
        read: ロシアが圧倒的に有利と見られていましたが、日本は日本海の海戦でロシアの艦隊を破ります。指揮したとうごうへいはちろうは、世界的な英雄になりました。
        show:
          - { type: box, at: [80, 140], w: 1120, color: green, title: 日本海海戦, text: "東郷平八郎がロシア艦隊を破る → 世界的な英雄に" }
      - say: しかし、勝ったのに賠償金を取れなかったことに国民が怒り、日比谷焼き討ち事件が起きます。戦争の負担に苦しんだ国民は、見返りを期待していたのです。
        read: しかし、勝ったのに賠償金を取れなかったことに国民が怒り、ひびや焼き討ち事件が起きます。戦争の負担に苦しんだ国民は、見返りを期待していたのです。
        show:
          - { type: box, at: [80, 320], w: 1120, color: pink, title: 日比谷焼き討ち事件, text: "賠償金なし → 重い負担をがまんした国民が怒る" }
      - say: 小さな国がロシアに勝ったことは、アジアの人々を勇気づけました。一方で日本は、自信を深めて、さらなる進出へと向かっていきます。
        added: true
        show:
          - { type: text, at: [80, 500], w: 1120, color: gray, text: "勝利で自信を深め、さらなる進出へ" }
