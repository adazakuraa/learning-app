title: 文明開化と西洋文化の受容
scenes:
  - board: whiteboard
    steps:
      - say: 明治維新のあと、日本は西洋の文化を、驚くほど積極的に取り入れました。これが文明開化です。
        show:
          - { type: title, text: 文明開化 }
      - say: 鉄道、電信、郵便、新聞、洋服、牛肉、ガス灯。江戸時代にはなかったものが、一気に日常に入ってきます。
        show:
          - type: list
            at: [80, 140]
            items: ["鉄道（1872年 新橋〜横浜）", "郵便・電信・新聞", "洋服・牛なべ", "ガス灯・れんが造りの建物"]
      - say: ちょんまげを切って、洋服を着て、牛なべを食べる。わずか数年で、暮らしの見た目が大きく変わったのです。
        added: true
        show:
          - { type: box, at: [660, 140], w: 540, color: yellow, text: "ちょんまげ → ざんぎり頭\n着物 → 洋服\n牛なべブーム" }

  - board: whiteboard
    steps:
      - say: 西洋化が進む一方で、伝統を見直す動きも起きました。明治政府は、神道を国の心のよりどころとして重んじます。
        show:
          - { type: title, text: 廃仏毀釈 }
          - { type: text, at: [80, 140], w: 1120, text: "政府は **神道** を国の心のよりどころに" }
      - say: それまで、日本では、同じお寺の中で、神様と仏様が一緒にまつられていることも多くありました。それを急に分けろ、と命じたのです。
        show:
          - { type: box, at: [80, 230], w: 1120, color: blue, title: 神仏分離, text: "いっしょにまつられていた神と仏を、分けさせる" }
      - say: その結果、仏教を排除しようとする廃仏毀釈の運動が一時的に起き、各地で仏像や仏具が捨てられたり、こわされたりしました。
        read: その結果、仏教を排除しようとするはいぶつきしゃくの運動が一時的に起き、各地で仏像や仏具が捨てられたり、こわされたりしました。
        show:
          - { type: box, at: [80, 400], w: 1120, color: pink, title: 廃仏毀釈, text: "各地で仏像・仏具が捨てられ、こわされる" }
