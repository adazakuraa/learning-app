title: 黒船来航と開国
scenes:
  - board: slide
    steps:
      - say: 第9章、「幕末・明治維新」です。
        show:
          - { type: title, text: 第9章　幕末・明治維新 }
      - say: 黒船がやってきて、260年続いた江戸幕府がたおれます。そして明治政府が、ものすごい速さで日本を近代国家に作りかえていきます。
        show:
          - type: list
            items: ["黒船来航と開国", "薩長同盟と倒幕", "明治維新の諸改革", "明治の重要人物", "自由民権運動と憲法", "文明開化"]
      - say: 鉄道、学校、選挙、洋服。今のわたしたちの生活の土台の多くは、この時代に始まりました。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "外からの圧力をきっかけに、日本がどう生まれ変わったかをつかむ" }

  - board: whiteboard
    steps:
      - say: 1853年、アメリカのペリー提督が、黒船と呼ばれた蒸気船をひきいて、今の神奈川県の浦賀に現れ、開国をせまります。
        read: 1853年、アメリカのペリー提督が、黒船と呼ばれた蒸気船をひきいて、今の神奈川県のうらがに現れ、開国をせまります。
        show:
          - { type: title, text: 1853年　黒船来航 }
          - { type: text, at: [80, 140], w: 1120, text: "**ペリー**（アメリカ）が **黒船** で浦賀（神奈川県）へ" }
      - say: 圧倒的な軍事力を前に、幕府は翌年、日米和親条約を結んで港を開きました。200年以上続いた鎖国の終わりです。
        show:
          - { type: text, at: [80, 230], w: 1120, text: "1854年　**日米和親条約** → 鎖国の終わり" }
      - say: 煙をはいて、風がなくても進む、巨大な黒い船。日本人にとっては、見たこともない技術でした。西洋はこんなものを作れるのか、という、驚きと恐怖をもたらしたのです。
        show:
          - { type: box, at: [80, 330], w: 1120, color: pink, text: "見たこともない技術 →「西洋はこんなものを作れるのか」という驚きと恐怖" }

  - board: whiteboard
    steps:
      - say: 外国の圧力に負けて開国した幕府への反発から、天皇を敬い、外国を追い払え、という尊王攘夷運動が、全国に広がります。
        read: 外国の圧力に負けて開国した幕府への反発から、天皇を敬い、外国を追い払え、というそんのうじょうい運動が、全国に広がります。
        show:
          - { type: title, text: 攘夷から開国へ }
          - { type: box, at: [80, 140], w: 540, color: pink, title: はじめ：尊王攘夷, text: "天皇を敬い、外国を追い払え" }
      - say: しかし現実を見た志士たちは、しだいに、外国を追い払うのは無理だ、むしろ西洋に学んで強い国を作るべきだ、という考えに変わっていきます。
        show:
          - { type: arrow, from: [628, 200], to: [652, 200] }
          - { type: box, at: [660, 140], w: 540, color: green, title: のちに, text: "西洋に学んで強い国を作ろう" }

  - board: whiteboard
    steps:
      - say: その橋渡しをしたのが、坂本龍馬です。今の高知県、土佐藩の出身で、藩をぬけて浪人になりました。
        read: その橋渡しをしたのが、さかもとりょうまです。今の高知県、土佐藩の出身で、藩をぬけてろうにんになりました。
        show:
          - { type: title, text: 坂本龍馬と薩長同盟 }
          - { type: text, at: [80, 140], w: 1120, text: "**坂本龍馬**：土佐藩（高知県）出身、藩をぬけて浪人に" }
      - say: 龍馬は、今の鹿児島県の薩摩藩と、山口県の長州藩という、仲の悪い二つの藩を結びつける、薩長同盟の仲立ちをします。
        show:
          - { type: box, at: [80, 240], w: 360, color: blue, title: 薩摩藩, text: "鹿児島県" }
          - { type: box, at: [460, 240], w: 360, color: yellow, title: 坂本龍馬, text: "仲立ち" }
          - { type: box, at: [840, 240], w: 360, color: green, title: 長州藩, text: "山口県" }
      - say: 当時の龍馬は、30歳そこそこ。組織の後ろだてもない若者が、歴史を動かしたのです。しかし1867年、龍馬は京都の旅館、近江屋で暗殺されます。犯人は、今もはっきりしていません。
        read: 当時の龍馬は、30歳そこそこ。組織の後ろだてもない若者が、歴史を動かしたのです。しかし1867年、龍馬は京都の旅館、おうみやで暗殺されます。犯人は、今もはっきりしていません。
        show:
          - { type: text, at: [80, 420], w: 1120, text: "1867年　京都・近江屋で暗殺（犯人は今も不明）" }
