title: 明治の重要人物
scenes:
  - board: whiteboard
    steps:
      - say: 明治維新を動かした人たちは、個性ゆたかで、その後の運命もそれぞれ劇的です。まずは、維新の三傑と呼ばれる3人です。
        read: 明治いしんを動かした人たちは、個性ゆたかで、その後の運命もそれぞれ劇的です。まずは、いしんの三傑と呼ばれる3人です。
        show:
          - { type: title, text: 維新の三傑 }
      - say: 西郷隆盛は薩摩藩の出身で、倒幕の中心人物です。しかし明治政府の近代化の方針と対立し、1877年の西南戦争で政府軍に敗れ、自害しました。
        read: さいごうたかもりは薩摩藩の出身で、倒幕の中心人物です。しかし明治政府の近代化の方針と対立し、1877年の西南戦争で政府軍に敗れ、自害しました。
        show:
          - { type: box, at: [80, 140], w: 360, color: green, title: 西郷隆盛, text: "薩摩・豪快な人柄\n西南戦争（1877）で敗れる" }
      - say: 同じ薩摩出身の大久保利通は、西郷と対照的な、近代化を進める実務家です。明治政府の土台を作りましたが、1878年に暗殺されます。生きている間は、冷たい独裁者と嫌われましたが、死後に評価が上がったタイプの人物です。
        read: 同じ薩摩出身のおおくぼとしみちは、西郷と対照的な、近代化を進める実務家です。明治政府の土台を作りましたが、1878年に暗殺されます。生きている間は、冷たい独裁者と嫌われましたが、死後に評価が上がったタイプの人物です。
        show:
          - { type: box, at: [460, 140], w: 360, color: blue, title: 大久保利通, text: "薩摩・近代化の実務家\n1878年に暗殺" }
      - say: 木戸孝允は長州藩の出身です。剣の達人でしたが、逃げの小五郎と呼ばれ、決して戦わずに逃げ回りました。人を斬っても世の中は変わらないし、自分が死んだら目的を果たせない、という合理的な考えの持ち主でした。
        read: きどたかよしは長州藩の出身です。剣の達人でしたが、逃げのこごろうと呼ばれ、決して戦わずに逃げ回りました。人を斬っても世の中は変わらないし、自分が死んだら目的を果たせない、という合理的な考えの持ち主でした。
        show:
          - { type: box, at: [840, 140], w: 360, color: yellow, title: 木戸孝允（桂小五郎）, text: "長州・剣の達人\nでも「逃げの小五郎」" }
      - say: 西南戦争は、もと武士たちによる、最後の大きな反乱でした。これ以降、不満は武力ではなく、言論で訴えられるようになります。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "西南戦争 ＝ 武力による最後の大反乱 → 以後は「言論」の時代へ" }

  - board: whiteboard
    steps:
      - say: 伊藤博文は長州の出身です。ヨーロッパの憲法を研究して、大日本帝国憲法の案を作り、初代の内閣総理大臣になりました。
        read: いとうひろぶみは長州の出身です。ヨーロッパの憲法を研究して、大日本帝国憲法の案を作り、初代の内閣総理大臣になりました。
        show:
          - { type: title, text: 伊藤博文と福沢諭吉 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 伊藤博文, text: "憲法の案を作る\n**初代内閣総理大臣**" }
      - say: のちに韓国の統治に深くかかわり、朝鮮の独立運動家、安重根に暗殺されました。
        read: のちに韓国の統治に深くかかわり、朝鮮の独立運動家、あんじゅうこんに暗殺されました。
        show:
          - { type: text, at: [80, 340], w: 540, color: gray, text: "のちに安重根に暗殺される" }
      - say: 福沢諭吉は、思想家、教育者で、慶應義塾を作りました。天は人の上に人を造らず、人の下に人を造らず、という言葉で始まる『学問のすすめ』は、明治はじめのベストセラーになりました。
        read: ふくざわゆきちは、思想家、教育者で、けいおうぎじゅくを作りました。天は人の上に人を造らず、人の下に人を造らず、という言葉で始まる『学問のすすめ』は、明治はじめのベストセラーになりました。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: 福沢諭吉, text: "慶應義塾を創設\n『学問のすすめ』" }
          - { type: text, at: [660, 340], w: 540, color: yellow, text: "「天は人の上に人を造らず\n　人の下に人を造らず」" }
