title: 自由民権運動と大日本帝国憲法
scenes:
  - board: whiteboard
    steps:
      - say: 明治政府の改革は、上から押しつけられるものでした。それに対して民間からも、国民が政治に参加できる議会を作れ、という声があがります。これが自由民権運動です。
        show:
          - { type: title, text: 自由民権運動 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 自由民権運動, text: "「国民が参加できる **議会** を作れ」" }
      - say: 板垣退助らが中心となり、全国で演説会や署名運動が行われました。
        read: いたがきたいすけらが中心となり、全国で演説会や署名運動が行われました。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "中心：**板垣退助**　→ 全国で演説会・署名運動" }
      - say: 板垣が襲われたとき、板垣死すとも自由は死せず、とさけんだという話は有名です。ただ、本当にそう言ったかはあやしく、傷も軽くて、すぐに回復したようです。
        show:
          - { type: text, at: [80, 410], w: 1120, color: gray, text: "「板垣死すとも自由は死せず」（本当に言ったかは怪しい）" }

  - board: whiteboard
    steps:
      - say: こうした動きを受けて、1889年、大日本帝国憲法が発布されます。
        show:
          - { type: title, text: 1889年　大日本帝国憲法 }
      - say: ただしこれは、ドイツの憲法を手本にした、天皇が国民に与える形の憲法で、主権は天皇にありました。国民の権利も、法律の範囲内で、という条件つきでした。
        show:
          - type: list
            at: [80, 140]
            items: ["手本は **ドイツ** の憲法", "天皇が国民に与える形（欽定憲法）", "主権は **天皇**", "国民の権利は「法律の範囲内で」"]
      - say: それでも、アジアで初めて、近代的な憲法を持つ国になったのは事実です。翌1890年には、帝国議会、つまり国会も開かれました。不完全でも、議会の芽が生まれたことが、のちの民主主義につながっていきます。
        show:
          - { type: box, at: [80, 400], w: 1120, color: green, text: "アジア初の近代憲法　1890年 **帝国議会**（国会）開設" }
