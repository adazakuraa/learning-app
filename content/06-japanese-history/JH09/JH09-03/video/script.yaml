title: 明治維新の諸改革
scenes:
  - board: whiteboard
    steps:
      - say: 1868年の明治維新から、日本は猛スピードで近代国家に生まれ変わります。その規模と速さは、世界の歴史で見ても異例でした。
        show:
          - { type: title, text: 明治維新の改革 }
      - say: まず、廃藩置県です。それまでの藩をなくして、全国を府と県に作りかえ、中央の政府が直接治める形にしました。今の都道府県の始まりです。
        read: まず、はいはんちけんです。それまでの藩をなくして、全国を府と県に作りかえ、中央の政府が直接治める形にしました。今の都道府県の始まりです。
        show:
          - { type: box, at: [80, 140], w: 540, color: blue, title: 廃藩置県, text: "藩をなくし府・県に\n＝ 今の **都道府県** の始まり" }
      - say: 徴兵令で、武士以外からも兵士を集め、地租改正で、土地にかける税のしくみを全国で統一しました。
        read: 徴兵令で、武士以外からも兵士を集め、ちそ改正で、土地にかける税のしくみを全国で統一しました。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: 徴兵令・地租改正, text: "国民から兵士を集める\n土地の税を全国で統一" }
      - say: 合言葉は、豊かな国と強い軍隊を作る、富国強兵と、産業を育てる、殖産興業でした。
        read: 合言葉は、豊かな国と強い軍隊を作る、富国強兵と、産業を育てる、しょくさんこうぎょうでした。
        show:
          - { type: text, at: [80, 360], w: 1120, size: l, text: "合言葉：**富国強兵**・**殖産興業**" }

  - board: whiteboard
    steps:
      - say: 政府は、お雇い外国人として、欧米の専門家を高い給料で招き、医学、法律、建築、工学などの知識を吸収しました。
        read: 政府は、おやとい外国人として、欧米の専門家を高い給料で招き、医学、法律、建築、工学などの知識を吸収しました。
        show:
          - { type: title, text: 学びの二本立て }
          - { type: box, at: [80, 140], w: 540, color: yellow, title: 呼んで学ぶ, text: "お雇い外国人\n（欧米の専門家を高給で招く）" }
      - say: 一方で、若い日本人を欧米に留学させ、知識を持ち帰らせます。伊藤博文も、若いころ長州藩からイギリスに、こっそり留学した一人でした。
        read: 一方で、若い日本人を欧米に留学させ、知識を持ち帰らせます。いとうひろぶみも、若いころ長州藩からイギリスに、こっそり留学した一人でした。
        show:
          - { type: box, at: [660, 140], w: 540, color: blue, title: 行って学ぶ, text: "欧米への留学\n（伊藤博文もイギリスへ）" }
      - say: まず外に出て、学んでこい。この姿勢が、明治政府の強さの源の一つでした。会社が、外の専門家を招いたり、社員を研修に出したりするのと同じですね。
        show:
          - { type: text, at: [80, 380], w: 1120, text: "「まず外に出て学ぶ」姿勢が、明治の強さの源" }
