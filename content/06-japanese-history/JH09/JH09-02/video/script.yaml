title: 薩長同盟と倒幕
scenes:
  - board: whiteboard
    steps:
      - say: 幕府を倒す動きの中心になったのは、薩摩藩と長州藩です。この流れを受けて、1867年、15代将軍の徳川慶喜は、大政奉還を行いました。政権を朝廷に返す、という宣言です。
        read: 幕府を倒す動きの中心になったのは、薩摩藩と長州藩です。この流れを受けて、1867年、15代将軍のとくがわよしのぶは、たいせいほうかんを行いました。政権を朝廷に返す、という宣言です。
        show:
          - { type: title, text: 1867年　大政奉還 }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: 大政奉還, text: "15代将軍・徳川慶喜が、政権を朝廷に返す" }
      - say: 一見いさぎよい行動ですが、慶喜には計算がありました。政権を返しても、徳川家の力はまだ大きく、新しい政府の中で主導権を取れる、と考えていたのです。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "慶喜の計算：「新政府でも徳川が主導権を取れる」" }

  - board: whiteboard
    steps:
      - say: しかし、薩摩と長州は、それを許しません。王政復古の大号令で、天皇中心の新しい政府を作ると宣言し、慶喜を外します。
        read: しかし、薩摩と長州は、それを許しません。おうせいふっこの大号令で、天皇中心の新しい政府を作ると宣言し、慶喜を外します。
        show:
          - { type: title, text: 戊辰戦争 }
          - type: list
            at: [80, 140]
            items: ["1867年　**王政復古の大号令**（慶喜を新政府から外す）", "1868年　**鳥羽・伏見の戦い** → **戊辰戦争** 始まる", "旧幕府軍が敗れ、**江戸城の無血開城**"]
      - say: そして1868年、鳥羽・伏見の戦いをきっかけに、戊辰戦争が始まります。旧幕府軍は敗れ、江戸城は、戦わずに明けわたされました。
        read: そして1868年、とば・ふしみの戦いをきっかけに、ぼしん戦争が始まります。旧幕府軍は敗れ、江戸城は、戦わずに明けわたされました。
        show: []

  - board: whiteboard
    steps:
      - say: 江戸城の無血開城を実現したのが、幕府側の勝海舟と、薩摩側の西郷隆盛の話し合いです。
        read: 江戸城の無血開城を実現したのが、幕府側のかつかいしゅうと、薩摩側のさいごうたかもりの話し合いです。
        show:
          - { type: title, text: 江戸城無血開城 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 勝海舟（幕府側）, text: "アメリカに渡った経験あり\n「戦っても無駄だ」" }
          - { type: box, at: [660, 140], w: 540, color: green, title: 西郷隆盛（薩摩側）, text: "「江戸を焼け野原にしても\n意味がない」" }
      - say: 勝海舟は、アメリカに渡った経験があり、戦っても無駄だ、という現実的な考えから、徹底抗戦派をおさえました。西郷も、江戸を焼け野原にしても意味がない、と判断します。
        show: []
      - say: 100万人が暮らす大都市が、燃えずにすんだ。対立する相手同士でも、話し合いで最悪の事態を避けられる、という歴史の大切な例です。
        show:
          - { type: text, at: [80, 380], w: 1120, size: l, text: "100万人の都市が **燃えずにすんだ**" }
