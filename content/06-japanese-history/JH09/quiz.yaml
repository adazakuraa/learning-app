questions:
  - q: 1853年、黒船を率いて浦賀に来航し、開国を迫ったアメリカの人物は誰でしょう？
    a: [ペリー]
  - q: 1867年、15代将軍・徳川慶喜が政権を朝廷に返したことを何というでしょう？
    a: [大政奉還]
  - q: 藩を廃止して全国を府県に置きかえ、中央集権を進めた改革を何というでしょう？
    a: [廃藩置県]
  - q: 明治政府がかかげた、「豊かな国と強い軍隊をつくる」というスローガンを漢字4字で何というでしょう？
    a: [富国強兵]
  - q: 憲法を起草し、初代内閣総理大臣となった人物は誰でしょう？
    a: [伊藤博文]
