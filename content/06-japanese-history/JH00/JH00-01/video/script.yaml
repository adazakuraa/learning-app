title: 日本史とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、日本史がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 日本史とは
      - say: 日本史では、縄文時代から現代まで、日本の社会がどのように移り変わってきたかを、時代の流れにそって学びます。
        show:
          - type: box
            w: 1100
            text: 日本史では、縄文時代から現代まで、日本の社会がどのように移り変わってきたかを、時代の流れにそって学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で12章です。第1章は縄文・弥生時代、第2章は古墳・飛鳥時代、第3章は奈良時代、第4章は平安時代、第5章は鎌倉時代、第6章は室町時代、第7章は安土桃山時代、第8章は江戸時代、第9章は幕末・明治維新、第10章は明治後期〜大正時代、第11章は昭和前期・戦争、第12章は戦後〜現代。
        read: この科目は、全部で12章です。第1章は縄文・弥生時代、第2章は古墳・飛鳥時代、第3章は奈良時代、第4章は平安時代、第5章は鎌倉時代、第6章は室町時代、第7章は安土桃山時代、第8章は江戸時代、第9章は幕末・明治維新、第10章は明治後期から大正時代、第11章は昭和前期・戦争、第12章は戦後から現代。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　縄文・弥生時代
              - 第2章　古墳・飛鳥時代
              - 第3章　奈良時代
              - 第4章　平安時代
              - 第5章　鎌倉時代
              - 第6章　室町時代
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第7章　安土桃山時代
              - 第8章　江戸時代
              - 第9章　幕末・明治維新
              - 第10章　明治後期〜大正時代
              - 第11章　昭和前期・戦争
              - 第12章　戦後〜現代
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、日本史を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、今の日本の成り立ちがわかる。天皇や政治の仕組み、地名、行事。今あるものの多くは、歴史の中で形づくられてきました。
        show:
          - type: box
            w: 1100
            text: |-
              **今の日本の成り立ちがわかる**
              天皇や政治の仕組み、地名、行事。今あるものの多くは、歴史の中で形づくられてきました。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、ニュースや旅行がおもしろくなる。城や寺、史跡の背景を知っていると、見るものの意味がまるで変わります。外交のニュースの背景もわかります。
        show:
          - type: box
            w: 1100
            text: |-
              **ニュースや旅行がおもしろくなる**
              城や寺、史跡の背景を知っていると、見るものの意味がまるで変わります。外交のニュースの背景もわかります。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、過去から学べる。戦争や災害、改革の成功と失敗。歴史には、同じ失敗をくり返さないためのヒントが詰まっています。
        show:
          - type: box
            w: 1100
            text: |-
              **過去から学べる**
              戦争や災害、改革の成功と失敗。歴史には、同じ失敗をくり返さないためのヒントが詰まっています。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、旅行で歴史の名所を訪れるとき、大河ドラマや時代劇を見るとき、外交や社会問題のニュースを理解するとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 旅行で歴史の名所を訪れるとき
              - 大河ドラマや時代劇を見るとき
              - 外交や社会問題のニュースを理解するとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、年号の暗記より、「なぜ起きて、どうなったか」の流れをつかむ。そして、人物は、何をした人かを一言で。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・年号の暗記より、**「なぜ起きて、どうなったか」**の流れをつかむ
              ・人物は、何をした人かを一言で
            color: pink
            at:
              - 80
              - 420
