title: 元寇と神風
scenes:
  - board: whiteboard
    steps:
      - say: 1274年と1281年の2度、元が日本に攻めてきました。元は、当時世界最大だった、モンゴルの帝国です。これが元寇です。
        read: 1274年と1281年の2度、げんが日本に攻めてきました。げんは、当時世界最大だった、モンゴルの帝国です。これがげんこうです。
        show:
          - { type: title, text: 元寇 }
          - { type: text, at: [80, 140], w: 1120, text: "1274年・1281年　**元**（モンゴル帝国）が2度襲来" }
      - say: 元の軍は、集団で戦う作戦と、てつはう、という爆発する武器を使いました。一対一の戦いに慣れた日本の武士は、苦戦します。
        read: げんの軍は、集団で戦う作戦と、てつはう、という爆発する武器を使いました。一対一の戦いに慣れた日本の武士は、苦戦します。
        show:
          - { type: box, at: [80, 230], w: 540, color: pink, title: 元軍, text: "集団戦法\n火薬の武器「てつはう」" }
          - { type: box, at: [660, 230], w: 540, color: blue, title: 日本の武士, text: "一騎打ち（一対一）に慣れていた" }

  - board: whiteboard
    steps:
      - say: しかし、2度とも嵐によって元軍の船が大きな被害を受け、撃退に成功しました。
        show:
          - { type: title, text: 神風 }
          - { type: text, at: [80, 140], w: 1120, text: "2度とも **暴風雨** で元軍の船が壊滅" }
      - say: この嵐は、のちに神風と呼ばれ、日本は神に守られた国だ、という考えが強まるきっかけになります。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: 神風, text: "「日本は神に守られた国」という考えが強まる" }
      - say: この神風という言葉は、およそ650年後、第二次世界大戦の末期に、特攻隊の名前にも使われることになります。言葉が、時代をこえて人を動かした例です。
        show:
          - { type: text, at: [80, 410], w: 1120, color: gray, text: "→ 約650年後、第二次世界大戦の「神風特攻隊」へ" }

  - board: whiteboard
    steps:
      - say: ただし、幕府にとって元寇は、大きなダメージでもありました。
        read: ただし、幕府にとってげんこうは、大きなダメージでもありました。
        show:
          - { type: title, text: 勝ったのに弱くなる }
      - say: 武士が幕府に仕えるのは、手柄をあげれば、ほうびとして土地がもらえるからです。ところが外国との戦いでは、勝っても奪える土地がありません。
        show:
          - type: svg
            at: [80, 130]
            w: 1120
            h: 170
            anim: draw
            markup: |
              <rect x="10" y="40" width="300" height="90" rx="12" stroke="#9fc7ff"/>
              <rect x="810" y="40" width="300" height="90" rx="12" stroke="#9be0b0"/>
              <path d="M320 70 L800 70"/><path d="M782 58 L802 70 L782 82"/>
              <path d="M800 110 L320 110"/><path d="M338 98 L318 110 L338 122"/>
              <g stroke="none" font-size="28" fill="#e8eef5" text-anchor="middle"><text x="160" y="95">幕府</text><text x="960" y="95">御家人（武士）</text><text x="560" y="58" font-size="22">ほうび（土地）</text><text x="560" y="152" font-size="22">戦って奉公</text></g>
      - say: 働いたのに、ごほうびがない。御家人たちの不満が高まり、鎌倉幕府がおとろえる原因の一つになっていきます。
        read: 働いたのに、ごほうびがない。ごけにんたちの不満が高まり、鎌倉幕府がおとろえる原因の一つになっていきます。
        show:
          - { type: box, at: [80, 340], w: 1120, color: pink, text: "元寇は防衛戦 → 新しい土地なし → ほうびが出せない → **不満**" }
      - say: 頑張ったのに、ボーナスが出ない会社では、社員の気持ちが離れていきますね。戦争に勝ったのに組織が弱る、という皮肉な結果です。
        added: true
        show:
          - { type: text, at: [80, 500], w: 1120, color: gray, text: "頑張ってもボーナスが出ない会社 → 気持ちが離れる" }
