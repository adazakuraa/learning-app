title: 源頼朝と鎌倉幕府
scenes:
  - board: slide
    steps:
      - say: 第5章、「鎌倉時代」です。
        show:
          - { type: title, text: 第5章　鎌倉時代 }
      - say: 武士が、はじめて自分たちの政府、幕府を作ります。源頼朝、北条氏の執権政治、そして、モンゴル帝国の襲来を見ていきます。
        read: 武士が、はじめて自分たちの政府、幕府を作ります。みなもとのよりとも、ほうじょうしのしっけん政治、そして、モンゴル帝国の襲来を見ていきます。
        show:
          - type: list
            items: ["源頼朝と鎌倉幕府", "北条氏の執権政治", "元寇と神風"]
      - say: ここから江戸時代の終わりまで、およそ700年、武士が政治の中心になります。その始まりの時代です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "武士の政権（幕府）のしくみと、それが揺らぐ理由をつかむ" }

  - board: whiteboard
    steps:
      - say: 平氏をほろぼした源頼朝は、全国に守護と地頭を置くことを、朝廷に認めさせます。守護は国ごとの軍事や警察、地頭は荘園などの管理や、年貢の取り立てをする役目です。
        read: 平氏をほろぼしたみなもとのよりともは、全国にしゅごとじとうを置くことを、朝廷に認めさせます。しゅごは国ごとの軍事や警察、じとうは荘園などの管理や、年貢の取り立てをする役目です。
        show:
          - { type: title, text: 鎌倉幕府 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 守護, text: "国ごとの軍事・警察" }
          - { type: box, at: [660, 140], w: 540, color: green, title: 地頭, text: "土地の管理・年貢の取り立て" }
      - say: 1192年には、征夷大将軍に任命されます。武士のトップを表す称号です。
        read: 1192年には、せいいたいしょうぐんに任命されます。武士のトップを表す称号です。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "1185年 守護・地頭を置く　→　1192年 **征夷大将軍** に" }
      - say: 昔は、1192年、いいくに作ろう鎌倉幕府、と覚えましたが、今は、しくみが整った1185年を、幕府の始まりとみる考えが有力です。
        read: 昔は、せんひゃくきゅうじゅうに年、いいくにつくろうかまくらばくふ、と覚えましたが、今は、しくみが整ったせんひゃくはちじゅうご年を、幕府の始まりとみる考えが有力です。
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "「いいくに（1192）」→ 今は「1185年」説が有力" }

  - board: whiteboard
    steps:
      - say: 幕府を置いたのは、京都ではなく、鎌倉でした。京都は貴族の縄張りで、武士が主導権を握りにくい場所だったからです。
        show:
          - { type: title, text: なぜ鎌倉？ }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 京都, text: "朝廷・貴族の世界" }
          - { type: box, at: [660, 140], w: 540, color: yellow, title: 鎌倉, text: "武士の世界（幕府）" }
      - say: その結果、京都の朝廷と、鎌倉の幕府という、二つの権力がしばらく並び立つ、日本独特のしくみが生まれました。
        show:
          - { type: text, at: [80, 340], w: 1120, size: l, text: "朝廷と幕府の **二重の権力**" }

  - board: whiteboard
    steps:
      - say: 頼朝は、とても冷たい権力者でした。平氏との戦いでいちばん手柄をあげた弟、義経が人々の人気を集めると、頼朝はそれを脅威に感じ、追い出します。
        read: 頼朝は、とても冷たい権力者でした。平氏との戦いでいちばん手柄をあげた弟、よしつねが人々の人気を集めると、頼朝はそれを脅威に感じ、追い出します。
        show:
          - { type: title, text: 頼朝と義経 }
          - { type: text, at: [80, 140], w: 1120, text: "弟・**義経** の人気 → 兄・頼朝が脅威と感じて追放" }
      - say: 義経は各地を逃げ回り、最後は岩手の平泉で、自害に追い込まれました。
        read: 義経は各地を逃げ回り、最後は岩手のひらいずみで、自害に追い込まれました。
        show:
          - { type: text, at: [80, 230], w: 1120, text: "義経は岩手・**平泉** で自害" }
      - say: その死を惜しんだ人々の間で、実は生きのびて大陸に渡り、チンギス・ハンになった、という伝説まで生まれます。
        show:
          - { type: text, at: [80, 320], w: 1120, color: gray, text: "伝説：生きのびてチンギス・ハンに？（もちろん作り話）" }
      - say: 弱い立場の人や、負けた人に同情する気持ちを、判官贔屓と言います。この言葉は、義経への同情から生まれました。負けているチームを、つい応援したくなる気持ちですね。
        read: 弱い立場の人や、負けた人に同情する気持ちを、ほうがんびいきと言います。この言葉は、義経への同情から生まれました。負けているチームを、つい応援したくなる気持ちですね。
        show:
          - { type: box, at: [80, 420], w: 1120, color: yellow, title: 判官贔屓（ほうがんびいき）, text: "負けた者・弱い者に同情する気持ち（義経の官職「判官」から）" }
