questions:
  - q: 1192年に征夷大将軍となり、鎌倉幕府を開いた人物は誰でしょう？
    a: [源頼朝]
  - q: 頼朝の死後、北条氏がついた、幕府の実権をにぎる役職を何というでしょう？
    a: [執権]
  - q: 1221年、後鳥羽上皇が幕府を倒そうとして敗れた戦いを何というでしょう？
    a: [承久の乱]
    r: [じょうきゅうのらん]
  - q: モンゴルの帝国「元」が、2度にわたって日本に襲来したできごとを何というでしょう？
    a: [元寇, 蒙古襲来]
    r: [げんこう, もうこしゅうらい]
    show: 元寇（蒙古襲来）
