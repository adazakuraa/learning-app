title: 北条氏の執権政治
scenes:
  - board: whiteboard
    steps:
      - say: 頼朝が亡くなると、将軍は名前だけの存在になり、実際の権力は、頼朝の妻の実家、北条氏が握るようになります。
        read: 頼朝が亡くなると、将軍は名前だけの存在になり、実際の権力は、頼朝の妻の実家、ほうじょうしが握るようになります。
        show:
          - { type: title, text: 執権政治 }
          - { type: text, at: [80, 140], w: 1120, text: "頼朝の死 → 将軍は名前だけ → 実権は **北条氏**" }
      - say: 北条氏がついた役職が、執権です。面白いのは、北条氏は将軍にはならなかったことです。
        read: ほうじょうしがついた役職が、しっけんです。面白いのは、ほうじょうしは将軍にはならなかったことです。
        show:
          - { type: box, at: [80, 230], w: 540, color: gray, title: 将軍, text: "源氏・皇族を置く（看板）" }
          - { type: box, at: [660, 230], w: 540, color: yellow, title: 執権（北条氏）, text: "補佐役として **実権** を握る" }
      - say: 将軍には、源氏や皇族を据えておき、自分たちは補佐役に徹しながら、実権を握る。藤原氏の摂関政治や、院政と同じく、表の看板と、本当の実力者が違う、という日本史によくある形です。
        read: 将軍には、源氏や皇族を据えておき、自分たちは補佐役に徹しながら、実権を握る。藤原氏のせっかん政治や、院政と同じく、表の看板と、本当の実力者が違う、という日本史によくある形です。
        added: true
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "「看板」と「本当の実力者」が別　← 摂関政治・院政と同じ形" }

  - board: whiteboard
    steps:
      - say: 頼朝の妻、北条政子は、頼朝の死後、尼将軍と呼ばれるほどの実力者として幕府を支えました。
        read: 頼朝の妻、ほうじょうまさこは、頼朝の死後、あましょうぐんと呼ばれるほどの実力者として幕府を支えました。
        show:
          - { type: title, text: 北条政子と承久の乱 }
          - { type: text, at: [80, 140], w: 1120, text: "**北条政子** ＝ 「尼将軍」" }
      - say: 1221年、後鳥羽上皇が幕府を倒そうと呼びかけ、承久の乱が起こります。
        read: 1221年、ごとば上皇が幕府を倒そうと呼びかけ、じょうきゅうの乱が起こります。
        show:
          - { type: text, at: [80, 220], w: 1120, text: "1221年　**承久の乱**（後鳥羽上皇が幕府打倒をよびかける）" }
      - say: 動揺する御家人たちの前に政子が立ち、頼朝様がゼロから築いたこの幕府を守れ、と涙ながらに訴えたとされます。
        read: 動揺するごけにんたちの前に政子が立ち、頼朝様がゼロから築いたこの幕府を守れ、と涙ながらに訴えたとされます。
        show:
          - { type: box, at: [80, 310], w: 1120, color: pink, text: "「頼朝様がゼロから築いた幕府を守れ」" }
      - say: 結果は幕府の圧勝。朝廷の力は大きくそがれ、武士の政権が、本当の意味で全国の主役になりました。
        show:
          - { type: text, at: [80, 450], w: 1120, size: l, text: "幕府の圧勝 → 朝廷の力が弱まる" }
