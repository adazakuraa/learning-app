title: おまけ（破天荒な一休宗純）
scenes:
  - board: whiteboard
    steps:
      - say: おまけの話です。一休宗純は、アニメの一休さんのモデルとして知られる、室町時代のお坊さんです。とんちで事件を解決する、かしこい小坊主のイメージがありますね。
        read: おまけの話です。いっきゅうそうじゅんは、アニメの一休さんのモデルとして知られる、室町時代のお坊さんです。とんちで事件を解決する、かしこい小坊主のイメージがありますね。
        show:
          - { type: title, text: 一休さんの本当の姿 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: イメージ, text: "とんちの得意な\nかわいい小坊主" }
      - say: ところが、大人になってからの一休は、まるでパンクロッカーのような、型破りなお坊さんでした。ボロボロの服でお酒を飲み歩いたといいます。
        show:
          - { type: box, at: [660, 140], w: 540, color: pink, title: 大人の一休, text: "型破りなお坊さん\nボロボロの服で酒を飲み歩く" }
      - say: お正月には、つえの先に人のどくろをぶら下げて、ご用心、ご用心、と練り歩きました。浮かれている人々に、死は誰にでも平等にやってくるぞ、と突きつけたのです。
        show:
          - { type: text, at: [80, 340], w: 1120, size: l, text: "正月にどくろを掲げて「ご用心、ご用心」" }
          - { type: text, at: [80, 430], w: 1120, text: "→ 「死は誰にでも平等に訪れる」" }
      - say: 権威や形式にしばられず、人間の本質にまっすぐ向き合う。その生き方は、当時の人々を驚かせ、同時に強くひきつけました。
        show:
          - { type: text, at: [80, 520], w: 1120, color: gray, text: "形式より本質 ← 禅の考え方そのもの" }
