title: 南北朝の動乱と室町幕府
scenes:
  - board: slide
    steps:
      - say: 第6章、「室町時代」です。
        show:
          - { type: title, text: 第6章　室町時代 }
      - say: 天皇が二人いた南北朝の時代、中国や琉球との貿易、今に続く日本文化の誕生、そして戦国時代の始まりまでを見ていきます。
        show:
          - type: list
            items: ["南北朝の動乱と室町幕府", "日明貿易と琉球", "室町文化（能・茶・禅）", "応仁の乱と戦国時代", "おまけ：一休宗純"]
      - say: お茶、生け花、和室。わたしたちが日本らしいと感じるものの多くは、この時代に形づくられました。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "政治は混乱、でも文化は花開く。「今の日本らしさ」の原点をつかむ" }

  - board: whiteboard
    steps:
      - say: 鎌倉時代の終わり、後醍醐天皇は、天皇が直接政治を行うべきだ、という強い信念を持っていました。
        read: 鎌倉時代の終わり、ごだいご天皇は、天皇が直接政治を行うべきだ、という強い信念を持っていました。
        show:
          - { type: title, text: 後醍醐天皇と倒幕 }
          - { type: text, at: [80, 140], w: 1120, text: "**後醍醐天皇**：「天皇が直接政治をするべきだ」" }
      - say: 元寇のあと、ほうびの問題で、幕府への信頼は落ちていました。後醍醐天皇は、倒幕の計画に2度失敗し、隠岐に流されながらもあきらめず、3度目でついに成功します。
        read: げんこうのあと、ほうびの問題で、幕府への信頼は落ちていました。後醍醐天皇は、倒幕の計画に2度失敗し、おきに流されながらもあきらめず、3度目でついに成功します。
        show:
          - { type: text, at: [80, 230], w: 1120, text: "倒幕計画が2度失敗 → 隠岐に流される → **3度目で成功**（1333年）" }
      - say: ところが、倒幕のあとに始めた建武の新政は、武士へのほうびが不公平だという不満が噴き出し、わずか2年ほどで崩れます。
        read: ところが、倒幕のあとに始めたけんむの新政は、武士へのほうびが不公平だという不満が噴き出し、わずか2年ほどで崩れます。
        show:
          - { type: box, at: [80, 340], w: 1120, color: pink, title: 建武の新政, text: "武士へのほうびが不公平 → 約2年で崩壊" }

  - board: whiteboard
    steps:
      - say: 後醍醐天皇の側にいた足利尊氏が離れ、京都に別の天皇を立てます。これが北朝です。
        read: 後醍醐天皇の側にいたあしかがたかうじが離れ、京都に別の天皇を立てます。これが北朝です。
        show:
          - { type: title, text: 南北朝時代 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 北朝（京都）, text: "足利尊氏が立てた天皇\n→ 室町幕府" }
      - say: 後醍醐天皇は奈良の吉野に逃れ、別の朝廷を開きます。これが南朝です。天皇が同時に二人いる、およそ60年の南北朝時代の始まりです。
        read: 後醍醐天皇は奈良のよしのに逃れ、別の朝廷を開きます。これが南朝です。天皇が同時に二人いる、およそ60年の南北朝時代の始まりです。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: 南朝（奈良・吉野）, text: "後醍醐天皇の朝廷" }
          - { type: text, at: [80, 340], w: 1120, size: l, text: "天皇が **二人** いる時代　約60年" }
      - say: この異常事態をおさめたのが、3代将軍、足利義満です。1392年に南北朝を一つにまとめました。京都の室町に幕府を置いたので、室町幕府と呼びます。金閣を建てたことでも有名です。
        read: この異常事態をおさめたのが、3代将軍、あしかがよしみつです。1392年に南北朝を一つにまとめました。京都の室町に幕府を置いたので、室町幕府と呼びます。金閣を建てたことでも有名です。
        show:
          - { type: text, at: [80, 440], w: 1120, text: "1392年　3代将軍 **足利義満** が南北朝を合一（金閣も建てた）" }
