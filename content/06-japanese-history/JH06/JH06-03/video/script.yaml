title: 室町文化（能・茶・禅）
scenes:
  - board: whiteboard
    steps:
      - say: 室町時代は、今の日本らしさの多くが形づくられた時代です。
        show:
          - { type: title, text: 「日本らしさ」の誕生 }
      - say: 能、茶の湯、水墨画、枯山水の庭、生け花。これらはすべて、室町時代に原型ができました。
        read: のう、茶の湯、すいぼくが、かれさんすいの庭、生け花。これらはすべて、室町時代に原型ができました。
        show:
          - type: list
            at: [80, 140]
            items: ["能楽", "茶の湯", "水墨画", "枯山水（石と砂の庭）", "生け花"]
      - say: 書院造という、たたみや、ふすまのある部屋も、この時代に生まれます。今の和室のルーツです。
        added: true
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: 書院造, text: "たたみ・ふすま・床の間\n＝ 今の **和室** のルーツ" }

  - board: whiteboard
    steps:
      - say: その背景にあるのが、禅宗です。座禅を組み、自分の力で悟りを目指す、仏教の一派です。
        read: その背景にあるのが、ぜんしゅうです。座禅を組み、自分の力で悟りを目指す、仏教の一派です。
        show:
          - { type: title, text: 禅とわびさび }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: 禅宗, text: "座禅を組み、自分の力で悟りを目指す" }
      - say: 禅には、よけいなものをそぎ落とした先に本質がある、という考え方があります。それが、わびさびと呼ばれる、日本独自の美しさの感覚につながっていきました。
        show:
          - { type: text, at: [80, 320], w: 1120, size: l, text: "そぎ落とした先に本質 → 「**わびさび**」" }
      - say: ものを減らして、すっきり暮らすミニマリストの考え方にも、どこか通じるものがありますね。
        added: true
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "今の「ミニマリスト」にも通じる感覚" }

  - board: whiteboard
    steps:
      - say: 8代将軍の足利義政は、政治家としては頼りなかったと言われますが、文化の支援者としては超一流でした。京都の東山に銀閣を建て、東山文化を花開かせます。
        read: 8代将軍のあしかがよしまさは、政治家としては頼りなかったと言われますが、文化の支援者としては超一流でした。京都の東山に銀閣を建て、東山文化を花開かせます。
        show:
          - { type: title, text: 足利義政と東山文化 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 政治家として, text: "頼りない" }
          - { type: box, at: [660, 140], w: 540, color: green, title: 文化の支援者として, text: "超一流 → **銀閣**・東山文化" }
      - say: 次に学ぶ応仁の乱で、京都が焼け野原になっていくなかでも、文化に熱心だった。政治家としてはどうなのか、という話ですが、結果として、今に残る文化遺産を生み出したのも事実です。
        show:
          - { type: text, at: [80, 340], w: 1120, text: "京都が焼けても文化に熱心 → 今に残る文化遺産" }
