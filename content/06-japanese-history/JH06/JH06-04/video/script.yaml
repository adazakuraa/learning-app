title: 応仁の乱と戦国時代
scenes:
  - board: whiteboard
    steps:
      - say: 1467年、8代将軍、足利義政の跡継ぎをめぐる争いに、有力な大名たちの権力争いがからみあって、大きな内乱が起こります。これが応仁の乱です。
        read: 1467年、8代将軍、あしかがよしまさの跡継ぎをめぐる争いに、有力な大名たちの権力争いがからみあって、大きな内乱が起こります。これがおうにんの乱です。
        show:
          - { type: title, text: 1467年　応仁の乱 }
          - { type: text, at: [80, 140], w: 1120, text: "将軍の跡継ぎ争い ＋ 大名たちの権力争い" }
      - say: 11年にわたって京都が戦場になり、都はほぼ焼け野原になりました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, text: "**11年間** 京都が戦場 → 都はほぼ焼け野原" }
      - say: 京都では今でも、この前の戦争、と言うと、応仁の乱のことだ、という冗談があるほどです。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "京都の冗談：「この前の戦争」＝ 応仁の乱" }

  - board: whiteboard
    steps:
      - say: 乱がおさまったあとも、各地の争いは続きます。実力さえあれば、家柄に関係なく、上の者を倒してのし上がれる、下剋上の時代です。これが戦国時代です。
        read: 乱がおさまったあとも、各地の争いは続きます。実力さえあれば、家柄に関係なく、上の者を倒してのし上がれる、げこくじょうの時代です。これが戦国時代です。
        show:
          - { type: title, text: 下剋上と戦国時代 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 下剋上, text: "下の者が、実力で上の者を倒す" }
      - say: 農民の子が大名になり、家来が主君に取って代わる。誰が天下を取るかわからない、という混乱こそが、この時代の面白さです。
        show:
          - type: list
            at: [80, 320]
            items: ["農民の子 → 大名へ", "家来 → 主君に取って代わる", "誰が天下を取るかわからない"]
      - say: 学歴や家柄より実力。そんな世の中は、自由でもあり、厳しくもあったのです。
        added: true
        show:
          - { type: text, at: [80, 540], w: 1120, color: gray, text: "家柄より実力 ＝ 自由だけど、厳しい" }
