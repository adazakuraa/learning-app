  - {u: JH12-07, p: 45, q: "沖縄返還を実現し、非核三原則でノーベル平和賞を受賞した首相は誰でしょう？", a: [佐藤栄作]}
  - {u: JH12-08, p: 45, q: "1980年代後半、地価や株価が実態以上に上がり、その後崩壊した好景気を何というでしょう？", a: [バブル経済, バブル景気, バブル]}
  - {u: JH12-09, p: 45, q: "1972年に日中国交正常化を実現し、「日本列島改造論」を掲げた首相は誰でしょう？", a: [田中角栄]}
