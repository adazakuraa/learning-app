questions:
  - {u: JH01-01, p: 55, q: "縄文時代の人々が住んだ、地面を掘り下げて柱を立て、屋根をかけた住居を何というでしょう？", a: [竪穴住居, 竪穴式住居]}
  - {u: JH01-01, p: 50, q: "豊穣や安産を祈るためのものとされる、縄文時代につくられた土の人形を何というでしょう？", a: [土偶]}
  - {u: JH01-02, p: 55, q: "身分の差や集落どうしの争いが生まれるきっかけとなった、弥生時代に大陸から伝わった農業は何でしょう？", a: [稲作, 米作り]}
  - {u: JH01-03, p: 60, q: "中国の歴史書『魏志倭人伝』に記され、呪術で人々を治めた邪馬台国の女王は誰でしょう？", a: [卑弥呼], r: [ひみこ]}
  - {u: JH02-01, p: 50, q: "全長約486mで世界最大級の墓といわれる、大阪府堺市の前方後円墳は、何天皇の陵とされるでしょう？", a: [仁徳天皇, 仁徳]}
  - {u: JH02-02, p: 40, q: "6世紀に仏教が伝来したとき、受け入れに賛成した蘇我氏と対立した豪族は何氏でしょう？", a: [物部氏, 物部]}
  - {u: JH02-03, p: 60, q: "推古天皇の摂政として、役人の心構えを示した十七条の憲法を定めた人物は誰でしょう？", a: [聖徳太子, 厩戸王], r: [うまやどのおう]}
  - {u: JH02-04, p: 55, q: "645年、中大兄皇子と中臣鎌足が蘇我氏を倒して始めた政治改革を何というでしょう？", a: [大化の改新]}
  - {u: JH03-01, p: 45, q: "701年に完成した、国家運営のルールを初めて文書としてまとめた法律を何というでしょう？", a: [大宝律令]}
  - {u: JH03-02, p: 55, q: "710年、唐の長安をモデルに碁盤の目状につくられた都を何というでしょう？", a: [平城京]}
  - {u: JH03-03, p: 50, q: "全国に国分寺を建て、東大寺に大仏をつくらせた天皇は誰でしょう？", a: [聖武天皇]}
  - {u: JH03-03, p: 35, q: "奈良時代に天皇の位を狙ったとされ、和気清麻呂に阻まれた僧侶は誰でしょう？", a: [道鏡]}
  - {u: JH03-04, p: 40, q: "漢字の音を借りて日本語を書き表した、万葉集で使われている表記を何というでしょう？", a: [万葉仮名]}
  - {u: JH04-01, p: 55, q: "794年に都が移され、以後約1100年にわたり都となった、現在の京都を何というでしょう？", a: [平安京]}
  - {u: JH04-02, p: 50, q: "「この世をば我が世とぞ思ふ」の歌を詠み、摂関政治の全盛期を築いた人物は誰でしょう？", a: [藤原道長]}
  - {u: JH04-03, p: 45, q: "菅原道真の意見で停止され、国風文化が花開くきっかけとなった、唐への使節を何というでしょう？", a: [遣唐使]}
  - {u: JH04-04, p: 45, q: "10円玉の裏に描かれている、藤原頼通が宇治に建てた建物は何でしょう？", a: [平等院鳳凰堂, 鳳凰堂]}
  - {u: JH04-05, p: 45, q: "天皇が早めに退位して上皇となり、実権を持ち続けた政治の形を何というでしょう？", a: [院政]}
  - {u: JH04-06, p: 55, q: "武士として初めて太政大臣となり、「平氏にあらずんば人にあらず」の時代を築いたのは誰でしょう？", a: [平清盛]}
  - {u: JH05-01, p: 60, q: "1192年に征夷大将軍となり、鎌倉に幕府を開いた人物は誰でしょう？", a: [源頼朝]}
  - {u: JH05-02, p: 45, q: "頼朝の妻で、承久の乱で御家人を一つにまとめ「尼将軍」と呼ばれたのは誰でしょう？", a: [北条政子]}
  - {u: JH05-03, p: 50, q: "モンゴルの帝国「元」が2度にわたって日本に襲来したできごとを何というでしょう？", a: [元寇, 蒙古襲来], r: [げんこう]}
  - {u: JH06-01, p: 45, q: "鎌倉幕府を倒したあと後醍醐天皇が始め、わずか数年で崩れた天皇中心の政治を何というでしょう？", a: [建武の新政]}
  - {u: JH06-01, p: 50, q: "1392年に南北朝を合一し、京都の北山に金閣を建てた室町幕府の将軍は誰でしょう？", a: [足利義満]}
  - {u: JH06-02, p: 40, q: "日本・中国・東南アジアを結ぶ中継貿易で栄え、「世界の架け橋」を自称した、現在の沖縄の国は何でしょう？", a: [琉球王国, 琉球]}
  - {u: JH06-03, p: 40, q: "銀閣を建て、東山文化を花開かせた室町幕府8代将軍は誰でしょう？", a: [足利義政]}
  - {u: JH06-04, p: 55, q: "1467年から11年間京都を戦場にし、下剋上の戦国時代を招いた戦乱を何というでしょう？", a: [応仁の乱]}
