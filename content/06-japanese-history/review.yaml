  - {u: JH08-01, p: 50, q: "大名に1年おきに江戸と領地を往復させ、力を弱めた江戸幕府の制度を何というでしょう？", a: [参勤交代]}
  - {u: JH08-02, p: 40, q: "鎖国中も、オランダとの貿易の窓口となった長崎の人工の島は何でしょう？", a: [出島]}
  - {u: JH08-03, p: 45, q: "犬を大切にさせる「生類憐みの令」を出し、元禄文化の時代の将軍だったのは誰でしょう？", a: [徳川綱吉, 綱吉]}
  - {u: JH08-04, p: 35, q: "寛政の改革を行った老中は誰でしょう？", a: [松平定信]}
  - {u: JH08-05, p: 45, q: "江戸時代後期の化政文化で、『東海道五十三次』を描いた浮世絵師は誰でしょう？", a: [歌川広重, 安藤広重, 広重]}
  - {u: JH09-01, p: 50, q: "1854年にペリーと結ばれ、下田と函館を開港して鎖国が終わった条約を何というでしょう？", a: [日米和親条約]}
  - {u: JH09-02, p: 45, q: "1868年、旧幕府側の勝海舟と新政府側の西郷隆盛の会談によって実現した、戦わずに江戸城を明け渡したことを何というでしょう？", a: [江戸城無血開城, 無血開城]}
  - {u: JH09-03, p: 45, q: "土地の価格に応じて現金で税を納めさせ、税制を統一した明治政府の改革を何というでしょう？", a: [地租改正]}
  - {u: JH09-04, p: 45, q: "薩摩藩出身の明治政府の実力者で、西郷隆盛と対照的な近代化推進派として知られるのは誰でしょう？", a: [大久保利通]}
  - {u: JH09-05, p: 45, q: "1889年に発布された、ドイツの憲法を参考にした天皇が定める欽定憲法を何というでしょう？", a: [大日本帝国憲法, 明治憲法]}
  - {u: JH09-06, p: 35, q: "明治初めに神仏分離令をきっかけに起きた、寺や仏像を壊す運動を何というでしょう？", a: [廃仏毀釈]}
  - {u: JH10-01, p: 45, q: "日露戦争の日本海海戦でバルチック艦隊を破り、世界的な英雄となった司令長官は誰でしょう？", a: [東郷平八郎]}
  - {u: JH10-02, p: 40, q: "1919年、日本の植民地支配に対して朝鮮で起きた独立運動を何というでしょう？", a: [三・一独立運動, 三一独立運動, 3.1独立運動]}
  - {u: JH10-03, p: 40, q: "1925年、普通選挙法と同じ年に制定され、社会主義などを取り締まった法律を何というでしょう？", a: [治安維持法]}
  - {u: JH10-04, p: 40, q: "大正時代に活躍し、『細雪』などで知られる作家は誰でしょう？", a: [谷崎潤一郎]}
  - {u: JH10-05, p: 50, q: "1923年9月1日に起き、火災で多くの犠牲者を出した大地震を何というでしょう？", a: [関東大震災]}
  - {u: JH11-01, p: 40, q: "世界恐慌に対しアメリカのルーズベルトがとった、大規模な公共事業で雇用を生む政策を何というでしょう？", a: [ニューディール政策, ニューディール]}
  - {u: JH11-02, p: 45, q: "1932年、犬養毅首相が「話せばわかる」と言いながら海軍の青年将校に暗殺された事件を何というでしょう？", a: [五・一五事件, 515事件, 五一五事件]}
  - {u: JH11-03, p: 40, q: "1937年、北京郊外で起き、日中戦争のきっかけとなった事件を何というでしょう？", a: [盧溝橋事件]}
  - {u: JH11-04, p: 45, q: "日米開戦の直前、それまでの日本の行動をすべて否定する内容でアメリカが示した文書を何というでしょう？", a: [ハル・ノート, ハルノート]}
  - {u: JH11-05, p: 40, q: "戦時中のスローガンで、「欲しがりません〇〇〇〇は」の〇に入る言葉は何でしょう？", a: [勝つまで]}
  - {u: JH11-06, p: 45, q: "1945年3月10日、B-29の焼夷弾攻撃で東京の下町が焼け野原になった空襲を何というでしょう？", a: [東京大空襲]}
  - {u: JH11-07, p: 40, q: "真珠湾攻撃を立案した海軍の名将で、アメリカとの開戦には反対だったとされるのは誰でしょう？", a: [山本五十六]}
  - {u: JH12-01, p: 55, q: "戦後の日本を占領した連合国軍総司令部の最高司令官で、厚木飛行場にパイプをくわえて降り立った人物は誰でしょう？", a: [マッカーサー]}
  - {u: JH12-02, p: 55, q: "日本国憲法で、戦争の放棄と戦力の不保持を定めているのは第何条でしょう？", a: [第9条, 9条, '9']}
  - {u: JH12-03, p: 45, q: "朝鮮戦争の軍需物資の注文によって、日本経済の復興が一気に進んだことを何というでしょう？", a: [朝鮮特需, 特需]}
  - {u: JH12-04, p: 45, q: "高度経済成長期に家庭に普及した、白黒テレビ・洗濯機・冷蔵庫を何と呼んだでしょう？", a: [三種の神器]}
  - {u: JH12-05, p: 40, q: "1960年、日米安全保障条約の改定に反対して起きた大規模な反対運動を何というでしょう？", a: [安保闘争]}
