title: 邪馬台国と卑弥呼
scenes:
  - board: whiteboard
    steps:
      - say: 3世紀の日本は、中国から、倭と呼ばれていました。その倭に、邪馬台国という国があったと、中国の歴史書、魏志倭人伝に書かれています。
        read: 3世紀の日本は、中国から、わと呼ばれていました。そのわに、やまたいこくという国があったと、中国の歴史書、ぎしわじんでんに書かれています。
        show:
          - { type: title, text: 邪馬台国 }
          - { type: text, at: [80, 140], w: 1120, text: "3世紀の日本 ＝ 「**倭**（わ）」" }
          - { type: box, at: [80, 220], w: 1120, color: blue, title: 中国の歴史書『魏志倭人伝』, text: "倭に **邪馬台国** があり、女王が治めていた" }
      - say: 当時の日本には、まだ文字の記録がありません。だから、外国の記録が手がかりになるのです。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "日本にまだ文字の記録がない → 外国の記録が手がかり" }

  - board: whiteboard
    steps:
      - say: その女王が、卑弥呼です。卑弥呼は、占いやまじないの力で、人々を治めていたとされます。
        read: その女王が、ひみこです。ひみこは、占いやまじないの力で、人々を治めていたとされます。
        show:
          - { type: title, text: 女王・卑弥呼 }
          - type: list
            at: [80, 140]
            items: ["まじない・占いの力で治める", "結婚しなかった", "弟が政治を手伝った"]
      - say: 結婚はせず、弟が政治を手伝う形で、国を治めていました。神様の声を聞く人と、実際の仕事をする人で、役割を分けていたわけです。
        show:
          - { type: box, at: [80, 380], w: 1120, color: yellow, text: "神の声を聞く人（卑弥呼）＋ 実務をする人（弟）" }

  - board: whiteboard
    steps:
      - say: ただし、邪馬台国がどこにあったのかは、今もわかっていません。
        read: ただし、やまたいこくがどこにあったのかは、今もわかっていません。
        show:
          - { type: title, text: 日本史最大の謎 }
      - say: 奈良のあたりとする、畿内説と、九州説が、長いあいだ対立しています。
        read: 奈良のあたりとする、きない説と、九州説が、長いあいだ対立しています。
        show:
          - { type: box, at: [80, 150], w: 540, color: blue, title: 畿内説, text: "奈良あたり\n→ のちの大和政権につながる？" }
          - { type: box, at: [660, 150], w: 540, color: green, title: 九州説, text: "九州北部\n→ 大陸に近い" }
      - say: 畿内説が正しければ、邪馬台国が、そのまま次の時代の大和政権につながるかもしれません。どちらに決まるかで、日本という国のはじまりの見え方が変わるのです。
        read: 畿内説が正しければ、やまたいこくが、そのまま次の時代の大和政権につながるかもしれません。どちらに決まるかで、日本という国のはじまりの見え方が変わるのです。
        added: true
        show:
          - { type: text, at: [80, 420], w: 1120, size: l, text: "場所しだいで「日本のはじまり」の見え方が変わる" }
