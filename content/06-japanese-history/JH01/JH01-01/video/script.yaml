title: 縄文文化の特徴
scenes:
  - board: slide
    steps:
      - say: 日本史の最初の章、「縄文・弥生時代」です。
        show:
          - { type: title, text: 第1章　縄文・弥生時代 }
      - say: 狩りと採集の縄文時代から、お米づくりの弥生時代へ。そして、中国の歴史書に登場する、邪馬台国までを見ていきます。
        show:
          - type: list
            items: ["縄文文化の特徴", "弥生時代と稲作の始まり", "邪馬台国と卑弥呼"]
      - say: 「食べ物をたくわえられるようになると、社会はどう変わるのか」。この章の大きなテーマです。今のわたしたちの、貯金や格差の話にもつながっています。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "暮らし方の変化が、社会のしくみ（身分・争い・国）を生む流れをつかむ" }

  - board: whiteboard
    steps:
      - say: 日本列島には、およそ3万8000年前から人が暮らしていました。これが旧石器時代です。
        show:
          - { type: title, text: 縄文時代のはじまり }
          - { type: image, src: 1000002885.webp, at: [820, 120], w: 380, caption: 縄文土器 }
          - { type: text, at: [80, 140], w: 700, text: "約3万8000年前〜　**旧石器時代**" }
      - say: そして、およそ1万6000年前、土器が作られ始めます。ここからが縄文時代です。
        show:
          - { type: arrow, from: [200, 200], to: [200, 270] }
          - { type: text, at: [80, 290], w: 700, text: "約1万6000年前〜　**縄文時代**（土器の登場）" }
      - say: 縄文という名前は、土器の表面に、縄を転がしてつけた模様があることから来ています。
        show:
          - { type: box, at: [80, 380], w: 700, color: blue, title: 名前の由来, text: "土器に **縄** を転がしてつけた **文**様（模様）" }
      - say: 土器があると、食べ物を煮ることができます。かたい木の実や貝も、やわらかく、安全に食べられるようになりました。鍋の発明のようなものですね。
        added: true
        show:
          - { type: text, at: [80, 560], w: 700, color: gray, text: "土器 ＝ 煮炊きできる「鍋」の発明" }

  - board: whiteboard
    steps:
      - say: 縄文時代には、まだ農業はなく、狩りや、木の実を集める採集が中心でした。
        show:
          - { type: title, text: 縄文の暮らし }
          - { type: image, src: 1000002887.webp, at: [700, 130], w: 500, caption: 竪穴住居 }
          - type: list
            at: [80, 140]
            w: 580
            items: ["狩り・漁・採集が中心", "住まい：**竪穴住居**", "ごみ捨て場：**貝塚**"]
      - say: 住まいは、地面を掘り下げて屋根をかけた、竪穴住居です。
        show: []
      - say: 食べたあとの貝殻や骨を捨てた場所は、貝塚として残っています。いわば、縄文人のごみ捨て場です。ごみを調べると、何を食べていたかがわかるのです。
        show:
          - { type: box, at: [80, 420], w: 580, color: green, title: 貝塚からわかること, text: "貝・魚・動物の骨 → 当時の **食生活**" }

  - board: whiteboard
    steps:
      - say: 農業のない時代と聞くと、遅れた時代と思うかもしれません。でも最近の研究では、貧富の差が小さく、争いのあとも少ない、ある意味で平和な時代だったことがわかっています。
        show:
          - { type: title, text: 縄文は「平和な時代」？ }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 縄文時代, text: "貧富の差が小さい\n争いのあとが少ない" }
      - say: 土偶という人形も、たくさん作られました。豊かな実りや、安産を祈るためのものだったと考えられています。
        show:
          - { type: box, at: [660, 140], w: 540, color: yellow, title: 土偶, text: "豊かな実り・安産を祈る人形" }
      - say: たくわえがないと、奪い合う財産もない。この見方は、次の弥生時代と比べると、よくわかります。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, size: l, text: "たくわえが少ない → 奪い合うものも少ない" }
