title: 桃山文化
scenes:
  - board: whiteboard
    steps:
      - say: 安土桃山時代の文化は、とにかく豪華の一言につきます。成り上がりの権力者たちが、自分の富と力を、目に見える形で示そうとしたからです。
        show:
          - { type: title, text: 豪華な桃山文化 }
          - { type: text, at: [80, 140], w: 1120, text: "わびさび（室町）とは正反対の、**絢爛豪華**" }
      - say: その象徴が、お城です。信長の安土城、秀吉の大阪城。どれも金箔を使った豪華な天守閣を持ち、おれはこれだけの力を持っている、と見せつけるものでした。
        read: その象徴が、お城です。信長のあづちじょう、秀吉の大阪城。どれも金箔を使った豪華な天守閣を持ち、おれはこれだけの力を持っている、と見せつけるものでした。
        show:
          - { type: box, at: [80, 230], w: 540, color: yellow, title: 城, text: "安土城（信長）・大阪城（秀吉）\n金箔の天守閣" }
      - say: 城の中には、狩野永徳たちがえがいた、金地にあざやかな色のふすま絵が飾られ、訪れる人を圧倒しました。
        read: 城の中には、かのうえいとくたちがえがいた、金地にあざやかな色のふすま絵が飾られ、訪れる人を圧倒しました。
        show:
          - { type: box, at: [660, 230], w: 540, color: yellow, title: 障壁画, text: "狩野永徳ら\n金地にあざやかな色" }
      - say: 高級ブランド品や、豪邸で力を見せるのと、同じ発想ですね。
        added: true
        show:
          - { type: text, at: [80, 440], w: 1120, color: gray, text: "豪華さ ＝ 力を見せつける「看板」" }

  - board: whiteboard
    steps:
      - say: 一方で、茶の湯は、政治の場としても使われていました。
        show:
          - { type: title, text: 千利休 }
      - say: 千利休は、わびの茶という、質素で精神的な茶の文化を完成させました。秀吉の茶の師匠として、大きな影響力を持ちます。
        read: せんのりきゅうは、わびの茶という、質素で精神的な茶の文化を完成させました。秀吉の茶の師匠として、大きな影響力を持ちます。
        show:
          - { type: box, at: [80, 140], w: 1120, color: green, title: わび茶, text: "質素で、心を大切にする茶の湯" }
      - say: しかし最後は、秀吉に切腹を命じられます。理由ははっきりしませんが、利休の影響力が大きくなりすぎたことを警戒した、という説が有力です。
        read: しかし最後は、秀吉にせっぷくを命じられます。理由ははっきりしませんが、利休の影響力が大きくなりすぎたことを警戒した、という説が有力です。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "秀吉に **切腹** を命じられる（影響力が大きくなりすぎた？）" }
      - say: 金ぴかの権力者のそばで、質素の美学を最後まで貫いた。この対比が、利休の生き方を今も印象的なものにしています。
        added: true
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "豪華な秀吉 ⇔ 質素な利休" }
