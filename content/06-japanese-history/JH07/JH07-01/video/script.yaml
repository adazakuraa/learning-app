title: 織田信長の統一事業
scenes:
  - board: slide
    steps:
      - say: 第7章、「安土桃山時代」です。
        show:
          - { type: title, text: 第7章　安土桃山時代 }
      - say: 織田信長、豊臣秀吉が、戦国の世をまとめていきます。豪華な桃山文化、そしてキリスト教の伝来と禁止までを見ていきます。
        show:
          - type: list
            items: ["織田信長の統一事業", "豊臣秀吉の天下統一", "桃山文化", "キリスト教の伝来と弾圧"]
      - say: 100年続いた戦乱が、わずか30年ほどでまとまっていく、日本史でもっともスピード感のある時代です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "バラバラの戦国大名が、どうやって一つにまとめられたかをつかむ" }

  - board: whiteboard
    steps:
      - say: 戦国の混乱を終わらせようとした最初の人物が、織田信長です。今の愛知県西部、尾張の小さな大名の家に生まれました。
        read: 戦国の混乱を終わらせようとした最初の人物が、おだのぶながです。今の愛知県西部、尾張の小さな大名の家に生まれました。
        show:
          - { type: title, text: 「大うつけ」織田信長 }
          - { type: text, at: [80, 140], w: 1120, text: "1534〜1582年　尾張（愛知県西部）の小大名の家" }
      - say: 若いころは、大うつけ、つまり大ばか者と呼ばれていました。着物のすそをまくり上げ、ひょうたんをぶら下げて町を歩き回り、父親の葬式では、お焼香を仏前に投げつけて帰った、という話もあります。
        read: 若いころは、大うつけ、つまり大ばか者と呼ばれていました。着物のすそをまくり上げ、ひょうたんをぶら下げて町を歩き回り、父親の葬式では、おしょうこうを仏前に投げつけて帰った、という話もあります。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, title: 大うつけ（大ばか者）, text: "変わった服装で町を歩く・父の葬式で焼香を投げつける" }
      - say: 周りの大人たちは、この跡継ぎで大丈夫か、と頭を抱えました。でも、その常識にとらわれない性格こそが、のちの新しい発想の源になります。
        show:
          - { type: text, at: [80, 400], w: 1120, text: "常識にとらわれない → **新しい発想** の源" }

  - board: whiteboard
    steps:
      - say: 当時の戦いは、馬に乗った武士が中心でした。信長は、足軽という歩兵に鉄砲を持たせ、集団で使う作戦を取りました。
        read: 当時の戦いは、馬に乗った武士が中心でした。信長は、あしがるという歩兵に鉄砲を持たせ、集団で使う作戦を取りました。
        show:
          - { type: title, text: 常識を疑う }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 長篠の戦い, text: "足軽（歩兵）＋ 鉄砲の集団戦法\n→ 最強の武田の騎馬隊を破る" }
      - say: 長篠の戦いでは、最強と言われた武田の騎馬隊を打ち破ります。
        read: ながしのの戦いでは、最強と言われた武田の騎馬隊を打ち破ります。
        show: []
      - say: また、楽市楽座という政策で、一部の業者が独占していた市場を開き、誰でも自由に商売できるようにしました。今でいう、規制緩和です。
        read: また、らくいちらくざという政策で、一部の業者が独占していた市場を開き、誰でも自由に商売できるようにしました。今でいう、規制緩和です。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: 楽市楽座, text: "独占をやめ、誰でも自由に商売\n＝ 今でいう **規制緩和**" }

  - board: whiteboard
    steps:
      - say: 一方で、比叡山延暦寺の焼き討ちや、一向一揆への徹底した弾圧など、残酷なイメージも強い人物です。
        read: 一方で、ひえいざんえんりゃくじの焼き討ちや、いっこういっきへの徹底した弾圧など、残酷なイメージも強い人物です。
        show:
          - { type: title, text: 宗教勢力との戦い }
          - type: list
            at: [80, 140]
            items: ["比叡山延暦寺の焼き討ち", "一向一揆（浄土真宗の信者の武装蜂起）の弾圧"]
      - say: これも、権力に逆らう勢力は徹底的につぶす、という一貫した考えの結果です。宗教が政治に口を出すことを許さなかった点では、今の、政治と宗教を分ける考え方に近い面もあります。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "宗教勢力の政治介入を許さない ≒ 今の **政教分離** に近い面も" }

  - board: whiteboard
    steps:
      - say: しかし、天下統一の目前で、家来の明智光秀に裏切られ、京都の本能寺で自害します。これが本能寺の変です。
        read: しかし、天下統一の目前で、家来のあけちみつひでに裏切られ、京都の本能寺で自害します。これが本能寺の変です。
        show:
          - { type: title, text: 1582年　本能寺の変 }
          - { type: text, at: [80, 140], w: 1120, text: "家来の **明智光秀** が裏切る → 信長は本能寺で自害" }
      - say: なぜ光秀は裏切ったのか。信長に責められ続けて限界だったという説、朝廷やほかの勢力とつながっていたという説など、今も謎のままです。日本史最大のミステリーの一つです。
        show:
          - type: list
            at: [80, 240]
            items: ["信長に責められ続けて限界だった？", "朝廷や他の勢力と裏でつながっていた？", "……今も謎"]
