title: 豊臣秀吉の天下統一
scenes:
  - board: whiteboard
    steps:
      - say: 本能寺の変のあと、いちばん素早く動いたのが、豊臣秀吉でした。
        read: 本能寺の変のあと、いちばん素早く動いたのが、とよとみひでよしでした。
        show:
          - { type: title, text: 中国大返し }
      - say: 岡山で毛利氏と戦っていた秀吉は、信長の死を知るとすぐに和睦し、驚くほどの速さで京都に引き返して、明智光秀を討ちます。これが、中国大返しです。
        read: 岡山でもうり氏と戦っていた秀吉は、信長の死を知るとすぐに和睦し、驚くほどの速さで京都に引き返して、あけちみつひでを討ちます。これが、中国大返しです。
        show:
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 中国大返し, text: "岡山 → 京都へ大急ぎで戻り、明智光秀を討つ" }
      - say: チャンスを見たら、すぐ動く。秀吉の決断力と行動力を表すエピソードです。
        show:
          - { type: text, at: [80, 320], w: 1120, size: l, text: "チャンスを見たら **すぐ動く**" }

  - board: whiteboard
    steps:
      - say: 秀吉は農民の出身で、信長に仕えて出世しました。草履取りから天下人へ、というサクセスストーリーは、まさに下剋上そのものです。
        read: 秀吉は農民の出身で、信長に仕えて出世しました。ぞうり取りから天下人へ、というサクセスストーリーは、まさにげこくじょうそのものです。
        show:
          - { type: title, text: 農民から天下人へ }
          - type: svg
            at: [80, 140]
            w: 1120
            h: 150
            anim: draw
            markup: |
              <path d="M40 140 L300 140 L300 110 L560 110 L560 80 L820 80 L820 50 L1080 50" stroke="#f3d77a"/>
              <g stroke="none" font-size="26" fill="#e8eef5" text-anchor="middle"><text x="170" y="128">農民</text><text x="430" y="98">草履取り</text><text x="690" y="68">武将</text><text x="950" y="38" fill="#f3d77a">天下人</text></g>
      - say: 1590年、秀吉は全国統一を成しとげます。
        show:
          - { type: text, at: [80, 330], w: 1120, text: "1590年　**全国統一**" }

  - board: whiteboard
    steps:
      - say: 秀吉は、天皇から関白に任命されることにこだわりました。武力で天下を取りながら、権威は朝廷から借りる、という形です。
        read: 秀吉は、天皇からかんぱくに任命されることにこだわりました。武力で天下を取りながら、権威は朝廷から借りる、という形です。
        show:
          - { type: title, text: 信長と秀吉のちがい }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 信長, text: "朝廷を利用しつつ\n**超えよう** とした" }
          - { type: box, at: [660, 140], w: 540, color: green, title: 秀吉, text: "朝廷の権威の\n**中に収まろう** とした（関白）" }
      - say: 晩年には、朝鮮へ2度も兵を送るという、無謀な侵略を行い、多くの犠牲を出して失敗します。大名たちの不満も高まり、秀吉の死後、豊臣政権は急速に揺らいでいきました。
        show:
          - { type: box, at: [80, 380], w: 1120, color: pink, title: 晩年, text: "朝鮮へ2度出兵 → 多くの犠牲・失敗 → 豊臣政権が揺らぐ" }
