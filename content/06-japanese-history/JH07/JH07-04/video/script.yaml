title: キリスト教の伝来と弾圧
scenes:
  - board: whiteboard
    steps:
      - say: 1549年、スペインの宣教師、フランシスコ・ザビエルが鹿児島に上陸し、キリスト教の布教が始まりました。
        show:
          - { type: title, text: 1549年　キリスト教の伝来 }
          - { type: text, at: [80, 140], w: 1120, text: "**ザビエル**（スペインの宣教師）が鹿児島に上陸" }
      - say: 当時のキリスト教は、ポルトガルやスペインの海外進出とセットで広がっていました。宣教師の後ろには、商人と軍隊がいたのです。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, text: "宣教師 ＋ 商人 ＋ 軍隊 ＝ ポルトガル・スペインの海外進出" }

  - board: whiteboard
    steps:
      - say: 信長は、キリスト教に比較的寛大でした。仏教勢力をおさえるためにも、西洋の新しい技術を取り入れるためにも、都合がよかったからです。
        show:
          - { type: title, text: 寛容から禁止へ }
          - { type: box, at: [80, 140], w: 360, color: green, title: 信長, text: "寛容\n南蛮文化ブーム" }
      - say: ところが秀吉は、バテレン追放令を出して、宣教師を国外に追い出します。信者が支配者よりも神への忠誠を優先して、逆らうかもしれない、という危機感からでした。
        show:
          - { type: arrow, from: [445, 200], to: [455, 200] }
          - { type: box, at: [460, 140], w: 360, color: yellow, title: 秀吉, text: "バテレン追放令\n宣教師を追放" }
      - say: 徳川家康の時代には、キリスト教を禁じる命令が出され、厳しい弾圧が始まります。
        show:
          - { type: arrow, from: [825, 200], to: [835, 200] }
          - { type: box, at: [840, 140], w: 360, color: pink, title: 家康以降, text: "禁教令\n厳しい弾圧" }
      - say: キリシタンの農民たちが起こした大きな反乱、島原の乱をへて、禁教はさらに徹底され、次の章の、鎖国へとつながっていきます。
        show:
          - { type: text, at: [80, 380], w: 1120, size: l, text: "**島原の乱** → 禁教の徹底 → **鎖国** へ" }
