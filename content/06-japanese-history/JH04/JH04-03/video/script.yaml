title: 国風文化と仮名文字
scenes:
  - board: whiteboard
    steps:
      - say: 894年、菅原道真の意見で、遣唐使の派遣が止められます。遣唐使とは、中国の唐に送っていた使節団のことです。
        read: 894年、すがわらのみちざねの意見で、けんとうしの派遣が止められます。けんとうしとは、中国の唐に送っていた使節団のことです。
        show:
          - { type: title, text: 国風文化 }
          - { type: text, at: [80, 140], w: 1120, text: "894年　**遣唐使** の派遣を停止（菅原道真の意見）" }
      - say: これをきっかけに、中国の文化をそのまま取り入れる時代から、日本独自の文化を育てる時代へと移ります。これが国風文化です。
        show:
          - { type: box, at: [80, 230], w: 540, color: gray, title: それまで, text: "中国文化をそのまま輸入" }
          - { type: arrow, from: [628, 290], to: [652, 290] }
          - { type: box, at: [660, 230], w: 540, color: yellow, title: 国風文化, text: "日本独自の文化を育てる" }
      - say: いちばんの発明は、ひらがなと、カタカナです。漢字をくずしたり、一部を取ったりして作られました。
        show:
          - { type: text, at: [80, 420], w: 1120, size: l, text: "安 → **あ**　　伊 → **イ**" }

  - board: whiteboard
    steps:
      - say: 文字が使いやすくなると、書く人が増えます。特に、宮廷の女性たちが、次々と名作を生み出しました。
        show:
          - { type: title, text: 女性たちの文学 }
      - say: 紫式部の『源氏物語』は、世界最古の長編小説とも言われます。主人公、光源氏の恋を中心に、人の喜びや悲しみが描かれています。
        read: むらさきしきぶの『源氏物語』は、世界最古の長編小説とも言われます。主人公、ひかるげんじの恋を中心に、人の喜びや悲しみが描かれています。
        show:
          - { type: box, at: [80, 140], w: 540, color: pink, title: 紫式部『源氏物語』, text: "世界最古の長編小説とも\n光源氏の恋と人生" }
      - say: 同じころ、清少納言は、『枕草子』を書きました。春はあけぼの、で始まる、日常のちょっとした感動をつづったエッセイです。
        read: 同じころ、せいしょうなごんは、『まくらのそうし』を書きました。春はあけぼの、で始まる、日常のちょっとした感動をつづったエッセイです。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: 清少納言『枕草子』, text: "「春はあけぼの」\n日常の感動をつづるエッセイ" }
      - say: 二人は同じ時代を生きましたが、あまり仲は良くなかったようで、相手をほのめかすような文章が残っています。小説家とエッセイストの、ライバル関係ですね。
        show:
          - { type: text, at: [80, 380], w: 1120, color: gray, text: "二人はライバル？　お互いをほのめかす記述が残る" }
