title: 浄土信仰と末法思想
scenes:
  - board: whiteboard
    steps:
      - say: 平安時代の中ごろ、末法という考え方が広まります。お釈迦様が亡くなって2000年たつと、仏の教えがすたれて、世の中が乱れる、というものです。
        read: 平安時代の中ごろ、まっぽうという考え方が広まります。おしゃか様が亡くなって2000年たつと、仏の教えがすたれて、世の中が乱れる、というものです。
        show:
          - { type: title, text: 末法思想 }
          - { type: box, at: [80, 140], w: 1120, color: pink, title: 末法, text: "釈迦の死から2000年 → 仏の教えがすたれ、世が乱れる" }
      - say: 日本では、1052年がその年にあたると信じられていました。実際に、戦乱や災害も続き、人々は不安にかられます。
        show:
          - { type: text, at: [80, 320], w: 1120, size: l, text: "1052年 ＝ 末法の始まり？　→ 人々の **不安**" }

  - board: whiteboard
    steps:
      - say: そんななかで広まったのが、浄土信仰です。南無阿弥陀仏と念仏をとなえれば、死んだあと、極楽浄土に生まれ変われる、という教えです。
        read: そんななかで広まったのが、じょうど信仰です。なむあみだぶつと念仏をとなえれば、死んだあと、ごくらくじょうどに生まれ変われる、という教えです。
        show:
          - { type: title, text: 浄土信仰 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, text: "「**南無阿弥陀仏**」ととなえる → 死後、**極楽浄土** へ" }
      - say: わかりやすくて、誰でもできる。だから、貴族から庶民まで、幅広く支持されました。
        show:
          - { type: text, at: [80, 300], w: 1120, text: "わかりやすい・誰でもできる → 貴族から庶民まで" }

  - board: whiteboard
    steps:
      - say: その象徴が、藤原頼通が建てた、平等院鳳凰堂です。10円玉の表に描かれている建物、といえば、イメージしやすいでしょう。
        read: その象徴が、ふじわらのよりみちが建てた、びょうどういんほうおうどうです。10円玉の表に描かれている建物、といえば、イメージしやすいでしょう。
        show:
          - { type: title, text: 平等院鳳凰堂 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, text: "京都・宇治　藤原頼通が建てる　＝ **10円玉** の建物" }
      - say: 池に映る姿は、極楽浄土を表しているとされます。死んだらこんな場所に行けるんだ、と、当時の人々をなぐさめた場所でした。
        show:
          - { type: text, at: [80, 300], w: 1120, text: "池に映る姿 ＝ この世に作った「極楽浄土」" }
      - say: 不安な時代ほど、わかりやすい救いが求められる。この流れは、次の鎌倉時代の新しい仏教にもつながります。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "不安な時代ほど、わかりやすい救いが求められる" }
