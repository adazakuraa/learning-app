title: 平氏政権
scenes:
  - board: whiteboard
    steps:
      - say: 武士として初めて、太政大臣になったのが、平清盛です。太政大臣は、朝廷でいちばん高い役職です。
        read: 武士として初めて、だじょうだいじんになったのが、たいらのきよもりです。だじょうだいじんは、朝廷でいちばん高い役職です。
        show:
          - { type: title, text: 平清盛 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 太政大臣, text: "朝廷の最高の役職 → 武士として **初めて** 就任" }
      - say: それまで、政治の頂点は貴族のものでした。清盛は、天皇と上皇の争いなどに乗じて力をのばし、そこに武士として割り込んだのです。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "天皇と上皇の争いに乗じて力をのばす" }

  - board: whiteboard
    steps:
      - say: 清盛も、藤原氏と同じように、娘を天皇と結婚させ、孫を天皇にする作戦を使いました。
        show:
          - { type: title, text: 政治家・経営者としての清盛 }
          - type: list
            at: [80, 140]
            items: ["娘を天皇に嫁がせる（藤原氏と同じ作戦）", "**宋**（中国）との貿易で大もうけ"]
      - say: さらに、中国の宋との貿易をさかんにして、大きな利益を得ます。ただの武将ではなく、政治家、経営者としての才能もあった人物です。
        read: さらに、中国のそうとの貿易をさかんにして、大きな利益を得ます。ただの武将ではなく、政治家、経営者としての才能もあった人物です。
        show: []

  - board: whiteboard
    steps:
      - say: しかし、平氏の全盛期は長く続きません。清盛が亡くなると、源頼朝と義経の兄弟が率いる源氏が兵をあげ、壇ノ浦の戦いで、平氏はほろびます。
        read: しかし、平氏の全盛期は長く続きません。清盛が亡くなると、みなもとのよりともとよしつねの兄弟が率いる源氏が兵をあげ、だんのうらの戦いで、平氏はほろびます。
        show:
          - { type: title, text: 平氏の滅亡 }
          - { type: text, at: [80, 140], w: 1120, text: "清盛の死 → 源氏が挙兵 → **壇ノ浦の戦い** で平氏滅亡" }
      - say: 『平家物語』の、おごれる人も久しからず、という一節は、平氏の栄えとほろびを描いたものです。
        read: へいけ物語の、おごれる人もひさしからず、という一節は、平氏の栄えとほろびを描いたものです。
        show:
          - { type: box, at: [80, 240], w: 1120, color: yellow, title: 『平家物語』, text: "驕れる人も久しからず（おごった者の栄えは長く続かない）" }
      - say: どんなに栄えたものも、いつかは終わる。この無常観は、日本人の心に深く根づいていきます。
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "栄えたものも、いつかは終わる ＝ **無常観**" }
