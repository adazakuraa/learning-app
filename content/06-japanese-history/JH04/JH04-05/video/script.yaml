title: 武士の台頭と院政
scenes:
  - board: whiteboard
    steps:
      - say: 平安時代の後半、都の貴族たちが優雅な文化を楽しんでいる一方で、地方では、武士が力をつけていきます。
        show:
          - { type: title, text: 武士の登場 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 都, text: "貴族が優雅な文化を楽しむ" }
          - { type: box, at: [660, 140], w: 540, color: yellow, title: 地方, text: "**武士** が力をつける" }
      - say: もともと武士は、貴族の警備や、地方の治安を守る、いわばガードマンでした。それがしだいに、自分たちの勢力を持つようになります。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "はじめは貴族の **ガードマン** → しだいに独自の勢力に" }

  - board: whiteboard
    steps:
      - say: 一方、都では、院政という新しい権力の形が生まれます。天皇が早めに位をゆずって上皇となり、院と呼ばれる自分の御所から、政治を動かすやり方です。
        show:
          - { type: title, text: 院政 }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: 院政, text: "天皇が位をゆずって **上皇** に → 「院」から政治を動かす" }
      - say: 藤原氏の、摂政や関白に口をはさまれずに、権力をふるえる、という利点がありました。会社でいえば、社長をゆずった会長が、実権を握り続けるようなものです。
        read: 藤原氏の、せっしょうやかんぱくに口をはさまれずに、権力をふるえる、という利点がありました。会社でいえば、社長をゆずった会長が、実権を握り続けるようなものです。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "藤原氏（摂政・関白）の影響を受けずにすむ" }
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "たとえるなら：社長をゆずった「会長」が実権を握る" }

  - board: whiteboard
    steps:
      - say: 院政を始めた白河上皇には、こんな話が残っています。
        read: 院政を始めたしらかわ上皇には、こんな話が残っています。
        show:
          - { type: title, text: 白河上皇の3つの悩み }
      - say: 賀茂川の水、すごろくのサイコロの目、そして山法師。この3つだけは、思い通りにならない、となげいたというのです。
        read: かもがわの水、すごろくのサイコロの目、そしてやまほうし。この3つだけは、思い通りにならない、となげいたというのです。
        show:
          - { type: box, at: [80, 140], w: 360, color: blue, title: 賀茂川の水, text: "洪水は止められない" }
          - { type: box, at: [460, 140], w: 360, color: green, title: サイコロの目, text: "運は操れない" }
          - { type: box, at: [840, 140], w: 360, color: pink, title: 山法師, text: "延暦寺の武装した僧" }
      - say: 山法師とは、比叡山延暦寺の、武器を持ったお坊さんたちです。天下の権力者でも、自然と運と、武装した宗教勢力には、手を焼いていたのです。
        read: やまほうしとは、ひえいざんえんりゃくじの、武器を持ったお坊さんたちです。天下の権力者でも、自然と運と、武装した宗教勢力には、手を焼いていたのです。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "最高権力者でも、**自然・運・宗教勢力** には勝てない" }
