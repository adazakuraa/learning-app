title: 聖徳太子と十七条憲法
scenes:
  - board: whiteboard
    steps:
      - say: 聖徳太子は、推古天皇の摂政として活躍した人物です。摂政とは、天皇に代わって政治を行う役職のことです。
        read: しょうとくたいしは、すいこてんのうのせっしょうとして活躍した人物です。せっしょうとは、天皇に代わって政治を行う役職のことです。
        show:
          - { type: title, text: 聖徳太子 }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: 摂政, text: "天皇に代わって政治を行う役職" }
      - say: 最近は、本名とされる、厩戸王という呼び方も使われ、教科書の書き方も変わりつつあります。
        read: 最近は、本名とされる、うまやどのおうという呼び方も使われ、教科書の書き方も変わりつつあります。
        show:
          - { type: text, at: [80, 300], w: 1120, text: "本名：**厩戸王**（うまやどのおう）" }

  - board: whiteboard
    steps:
      - say: 聖徳太子は、十七条の憲法を出したことで有名です。日本最初の憲法とも言われますが、今の法律とはかなり違います。
        read: しょうとくたいしは、十七条の憲法を出したことで有名です。日本最初の憲法とも言われますが、今の法律とはかなり違います。
        show:
          - { type: title, text: 十七条の憲法 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 第一条, text: "和を以て貴しとなす（争わず、仲よくすることが大切）" }
      - say: 第一条の、「和を以て貴しとなす」に表れているように、役人や豪族に向けた、心がまえを示す文書でした。
        read: 第一条の、「わをもってとうとしとなす」に表れているように、役人や豪族に向けた、心がまえを示す文書でした。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "役人・豪族への **心がまえ**（道徳・政治の指針）" }
      - say: 仏教や儒教の考えを取り入れ、天皇を中心とした国の秩序を作ろうとしたのです。会社でいえば、社員に向けた行動指針のようなものです。
        read: 仏教やじゅきょうの考えを取り入れ、天皇を中心とした国の秩序を作ろうとしたのです。会社でいえば、社員に向けた行動指針のようなものです。
        added: true
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "たとえるなら、会社の「行動指針」" }

  - board: whiteboard
    steps:
      - say: 聖徳太子には、同時に10人の話を聞けた、という伝説があります。さすがに盛りすぎですが、それだけ後の時代に、理想の人物として語り継がれてきたということです。
        read: しょうとくたいしには、同時に10人の話を聞けた、という伝説があります。さすがに盛りすぎですが、それだけ後の時代に、理想の人物として語り継がれてきたということです。
        show:
          - { type: title, text: 伝説と事実 }
          - { type: text, at: [80, 140], w: 1120, text: "伝説：10人の話を同時に聞けた" }
      - say: 実は、その業績の多くは、後から作られたものだという説もあります。歴史上の偉人ほど、伝説と事実の境目があいまいになりやすいのです。
        show:
          - { type: box, at: [80, 260], w: 1120, color: yellow, text: "偉人ほど、伝説と事実の境目があいまいになる" }
