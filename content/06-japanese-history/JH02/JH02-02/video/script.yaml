title: 仏教の伝来
scenes:
  - board: whiteboard
    steps:
      - say: 仏教が日本に正式に伝わったのは、6世紀。朝鮮半島の国、百済の王から、大和政権への贈り物という形でした。
        read: 仏教が日本に正式に伝わったのは、6世紀。朝鮮半島の国、くだらの王から、大和政権への贈り物という形でした。
        show:
          - { type: title, text: 仏教がやってきた }
          - { type: text, at: [80, 140], w: 1120, text: "6世紀　**百済**（朝鮮半島）の王 → 大和政権へ" }
      - say: 仏像とお経が届けられ、これはすごい神様だから拝むべきだ、という話になります。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, text: "仏像とお経が届く →「すごい神様だ、拝むべきだ」" }

  - board: whiteboard
    steps:
      - say: ところが、これが大きな対立を生みます。賛成派の蘇我氏と、反対派の物部氏です。
        read: ところが、これが大きな対立を生みます。賛成派のそがしと、反対派のもののべしです。
        show:
          - { type: title, text: 蘇我氏 vs 物部氏 }
          - { type: box, at: [80, 140], w: 540, color: green, title: 蘇我氏, text: "仏教を受け入れよう" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: 物部氏, text: "日本の神々を守るべきだ" }
      - say: ただ、これは単なる好き嫌いではなく、仏教を理由にした、権力争いだったと考えられています。
        show:
          - { type: text, at: [80, 320], w: 1120, size: l, text: "本当は **権力争い**" }
      - say: 最後は蘇我氏が勝ち、仏教は、国を守る考え方として受け入れられ、各地にお寺が建てられていきました。
        read: 最後はそがしが勝ち、仏教は、国を守る考え方として受け入れられ、各地にお寺が建てられていきました。
        show:
          - { type: text, at: [80, 420], w: 1120, text: "蘇我氏の勝利 → 仏教は「**国を守る思想**」に → 各地にお寺" }

  - board: whiteboard
    steps:
      - say: 面白いのは、仏教が入ってきたことで、もともとあった日本の神々への信仰が、神道として意識されるようになったことです。
        show:
          - { type: title, text: 外から来ると、内側に名前がつく }
          - { type: box, at: [80, 140], w: 540, color: yellow, title: 外から来たもの, text: "仏教" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: もともとあったもの, text: "→「**神道**」と呼ばれるように" }
      - say: 例えば、外国の料理が入ってきて初めて、「和食」という言葉が生まれたのと同じです。比べる相手が来ると、自分たちのものに名前がつくのです。
        added: true
        show:
          - { type: text, at: [80, 340], w: 1120, color: gray, text: "例：洋食が来て、はじめて「和食」という言葉が生まれた" }
