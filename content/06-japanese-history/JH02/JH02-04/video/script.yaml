title: 大化の改新
scenes:
  - board: whiteboard
    steps:
      - say: 645年、中大兄皇子と、中臣鎌足が、権力を握りすぎた蘇我入鹿を、宮中で暗殺しました。これが、大化の改新の始まりです。
        read: 645年、なかのおおえのおうじと、なかとみのかまたりが、権力を握りすぎたそがのいるかを、宮中で暗殺しました。これが、大化の改新の始まりです。
        show:
          - { type: title, text: 645年　大化の改新 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 実行した側, text: "中大兄皇子\n中臣鎌足（藤原氏の祖先）" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: 倒された側, text: "蘇我入鹿" }
      - say: 蘇我氏は、入鹿の父、蝦夷の代には、天皇をしのぐほどの力を持ち、入鹿は皇族を勝手に殺すなど、やりすぎの状態でした。
        read: そがしは、入鹿の父、えみしの代には、天皇をしのぐほどの力を持ち、入鹿は皇族を勝手に殺すなど、やりすぎの状態でした。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "蘇我氏：天皇をしのぐ権力 → **やりすぎ** → クーデター" }

  - board: whiteboard
    steps:
      - say: ただし、この事件のおもな記録は、『日本書紀』です。これは、勝った側がまとめた歴史書です。
        show:
          - { type: title, text: 歴史は勝者が書く }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 『日本書紀』, text: "クーデターに **勝った側** がまとめた歴史書" }
      - say: だから、蘇我氏が悪く書かれすぎているのでは、という疑いがあります。蝦夷や入鹿という名前も、あとから悪い意味でつけられた呼び名かもしれません。
        read: だから、そがしが悪く書かれすぎているのでは、という疑いがあります。えみしや入鹿という名前も、あとから悪い意味でつけられた呼び名かもしれません。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "蘇我氏は悪く書かれすぎ？　名前もあとからの悪口？" }
      - say: 今でも、ニュースや記録を見るときは、誰が書いたのか、を考えることが大切です。
        added: true
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "記録を読むときは「誰が書いたか」を考える" }

  - board: whiteboard
    steps:
      - say: このあと、「大化」という、日本で最初の元号が定められます。
        show:
          - { type: title, text: 改革のはじまり }
          - { type: text, at: [80, 140], w: 1120, text: "日本初の元号「**大化**」" }
      - say: そして、土地と人々をすべて国が管理する、公地公民の方針が打ち出されました。中国の唐の制度を手本に、国のしくみを一から作り直す、大改革の始まりです。
        read: そして、土地と人々をすべて国が管理する、こうちこうみんの方針が打ち出されました。中国の唐の制度を手本に、国のしくみを一から作り直す、大改革の始まりです。
        show:
          - { type: box, at: [80, 230], w: 1120, color: blue, title: 公地公民, text: "土地と人々は、すべて国のもの（豪族のものではない）" }
          - { type: text, at: [80, 410], w: 1120, text: "手本は **唐**（中国）の制度 → 次の「律令国家」へ" }
