title: 古墳と大和政権
scenes:
  - board: slide
    steps:
      - say: 第2章、「古墳・飛鳥時代」です。
        show:
          - { type: title, text: 第2章　古墳・飛鳥時代 }
      - say: 巨大なお墓、古墳を作った大和政権。仏教の伝来、聖徳太子、そして大化の改新を見ていきます。
        read: 巨大なお墓、古墳を作った大和政権。仏教の伝来、しょうとくたいし、そして大化の改新を見ていきます。
        show:
          - type: list
            items: ["古墳と大和政権", "仏教の伝来", "聖徳太子と十七条憲法", "大化の改新"]
      - say: バラバラだった豪族たちが、天皇を中心とした一つの国にまとまっていく。日本という国の、骨組みができ始める時代です。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "豪族の集まりが「天皇中心の国」へまとまっていく流れをつかむ" }

  - board: whiteboard
    steps:
      - say: 3世紀から7世紀ごろ、日本各地に、巨大なお墓が作られました。これが古墳です。
        show:
          - { type: title, text: 古墳 }
          - { type: image, src: 1000003217.webp, at: [640, 130], w: 560, caption: 前方後円墳 }
          - { type: text, at: [80, 140], w: 520, text: "3〜7世紀ごろ　**古墳** ＝ 巨大なお墓" }
      - say: いちばん有名なのは、前が四角く、後ろが丸い、前方後円墳です。
        read: いちばん有名なのは、前が四角く、後ろが丸い、ぜんぽうこうえんふんです。
        show:
          - { type: box, at: [80, 250], w: 520, color: blue, title: 前方後円墳, text: "前が四角・後ろが丸" }
      - say: 大阪にある仁徳天皇陵は、全長およそ486メートル。エジプトのピラミッドをしのぐ、世界最大級のお墓です。東京タワーを横にしても、まだ足りない長さです。
        read: 大阪にあるにんとくてんのうりょうは、全長およそ486メートル。エジプトのピラミッドをしのぐ、世界最大級のお墓です。東京タワーを横にしても、まだ足りない長さです。
        show:
          - { type: box, at: [80, 400], w: 520, color: yellow, title: 仁徳天皇陵（大阪）, text: "全長 約 **486m**\n＝ 東京タワー（333m）の約1.5倍" }

  - board: whiteboard
    steps:
      - say: こんな大きなお墓を作れたということは、大勢の人を働かせることができる、強い権力者がいたということです。
        show:
          - { type: title, text: 大和政権 }
          - { type: text, at: [80, 140], w: 1120, text: "巨大な古墳 → 大勢を働かせる **強い権力者** がいた" }
      - say: この時代、近畿地方を中心とする、大和政権が、各地の豪族、つまり地方の有力者たちをまとめながら、少しずつ全国を支配するしくみを作っていきました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: blue, title: 大和政権（ヤマト王権）, text: "近畿地方が中心。各地の **豪族**（地方の有力者）を束ねる" }
      - say: 卑弥呼のものではないかと考えられている古墳もあり、邪馬台国と大和政権、つまり今の天皇家とのつながりが、研究されています。
        read: 卑弥呼のものではないかと考えられている古墳もあり、やまたいこくと大和政権、つまり今の天皇家とのつながりが、研究されています。
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "邪馬台国 →？ 大和政権 → 天皇家" }

  - board: whiteboard
    steps:
      - say: 古墳のまわりには、埴輪という焼き物が並べられました。人、動物、家など、さまざまな形があります。
        read: 古墳のまわりには、はにわという焼き物が並べられました。人、動物、家など、さまざまな形があります。
        show:
          - { type: title, text: 埴輪 }
          - type: list
            at: [80, 140]
            items: ["武人の埴輪", "踊る人の埴輪", "馬・家の埴輪"]
      - say: 武人、踊る人、馬。埴輪を見ていると、当時の人たちの暮らしが伝わってきます。文字のない時代の、写真のようなものですね。
        read: 武人、踊る人、馬。はにわを見ていると、当時の人たちの暮らしが伝わってきます。文字のない時代の、写真のようなものですね。
        added: true
        show:
          - { type: box, at: [80, 380], w: 1120, color: green, text: "埴輪 ＝ 文字のない時代の「写真」" }
