questions:
  - q: 「細胞の発電所」と呼ばれ、糖を分解してエネルギー（ATP）をつくる細胞小器官は何でしょう？
    a: [ミトコンドリア]
  - q: 植物の細胞にだけあり、光合成を行う緑色の細胞小器官は何でしょう？
    a: [葉緑体]
    r: [ようりょくたい]
  - q: 大腸菌のように、核を持たない細胞を何というでしょう？
    a: [原核細胞]
  - q: 精子や卵子をつくるときの、染色体の数が半分になる分裂を何というでしょう？
    a: [減数分裂]
  - q: ヒトの体細胞の染色体は何本でしょう？
    a: ['46', 46本]
    show: 46本
