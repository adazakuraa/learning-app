title: 循環系（心臓と血液）
scenes:
  - board: whiteboard
    steps:
      - say: 「循環系」です。血液は、心臓をポンプにして、体をめぐっています。そのルートは2つあります。
        show:
          - { type: title, text: 2つの循環 }
          - type: svg
            at: [80, 120]
            w: 1100
            h: 460
            markup: |
              <rect x="450" y="190" width="200" height="110" rx="20" stroke="#f4a3b8"/><text x="550" y="255" font-size="30" fill="#f4a3b8" stroke="none" text-anchor="middle">心臓</text>
              <ellipse cx="550" cy="60" rx="160" ry="45" stroke="#8fc4ff"/><text x="550" y="70" font-size="28" fill="#8fc4ff" stroke="none" text-anchor="middle">肺</text>
              <ellipse cx="550" cy="410" rx="260" ry="45" stroke="#f3d77a"/><text x="550" y="420" font-size="28" fill="#f3d77a" stroke="none" text-anchor="middle">全身</text>
              <path d="M500 190 Q440 140 470 100 M600 105 Q660 140 600 190" stroke="#8fc4ff"/>
              <path d="M650 260 Q820 320 700 370 M400 370 Q280 320 450 260" stroke="#f3d77a"/>
              <g stroke="none" font-size="22"><text x="720" y="150" fill="#8fc4ff">肺循環</text><text x="830" y="330" fill="#f3d77a">体循環</text></g>
      - say: 体循環は、心臓から大動脈を通って全身へ。酸素と栄養を届け、二酸化炭素と老廃物を回収して、大静脈から心臓へ戻ります。
        show:
          - { type: text, at: [80, 595], color: yellow, text: "体循環：心臓 → 全身（酸素・栄養を届け、CO₂・老廃物を回収）→ 心臓" }
      - say: 肺循環は、心臓から肺へ行き、全身から集めた二酸化炭素を出し、酸素を受けとって、心臓へ戻ります。
        show:
          - { type: text, at: [80, 645], color: blue, text: "肺循環：心臓 → 肺（CO₂ を出し、酸素を受けとる）→ 心臓" }

  - board: whiteboard
    steps:
      - say: 血液の成分を見てみましょう。
        show:
          - { type: title, text: 血液の成分 }
      - say: 赤血球は、ヘモグロビンというタンパク質で、酸素を運びます。白血球は、細菌やウイルスを攻撃する、免疫の係。血小板は、出血したときに集まって、血を止めます。血しょうは、ただひとつの液体の成分で、栄養やホルモン、老廃物をとかして運びます。
        show:
          - { type: box, color: pink, at: [60, 150], w: 560, title: 赤血球, text: "ヘモグロビンで酸素を運ぶ（血が赤いのはこれ）" }
          - { type: box, color: gray, at: [660, 150], w: 560, title: 白血球, text: "免疫。細菌・ウイルスを攻撃" }
          - { type: box, color: yellow, at: [60, 410], w: 560, title: 血小板, text: "出血したとき集まって血を止める" }
          - { type: box, color: blue, at: [660, 410], w: 560, title: 血しょう, text: "液体。栄養・ホルモン・老廃物を運ぶ" }

  - board: whiteboard
    steps:
      - say: ABO式の血液型は、赤血球の表面にある、目印の種類のちがいです。この目印を、抗原といいます。
        show:
          - { type: title, text: 血液型 }
          - { type: text, text: "血液型 ＝ 赤血球の表面の目印（**抗原**）の種類" }
      - say: 抗原は、免疫のしくみに関わる目印です。輸血のときに血液型が合わないと、体がよそ者と判断して攻撃し、とても危険です。だから、血液型を正しく知っておく必要があるのです。
        show:
          - { type: box, color: pink, w: 1000, text: "輸血で型が合わない → 免疫が攻撃 → 危険" }
