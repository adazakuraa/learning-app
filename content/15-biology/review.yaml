questions:
  - {u: BI01-01, p: 45, q: "生物の条件の一つで、外の環境が変わっても体の中を一定に保つ性質を何というでしょう？", a: [恒常性, ホメオスタシス]}
  - {u: BI01-02, p: 35, q: "生物の分類で最も大きな単位で、真核生物・バクテリア・アーキアの3つに分けるものを何というでしょう？", a: [ドメイン]}
  - {u: BI02-01, p: 50, q: "「細胞の発電所」と呼ばれ、ATPをつくる細胞小器官は何でしょう？", a: [ミトコンドリア]}
  - {u: BI02-02, p: 40, q: "大腸菌のように、核を持たない細胞を何というでしょう？", a: [原核細胞]}
  - {u: BI02-03, p: 45, q: "精子や卵子をつくるときに起こる、染色体の数が半分になる分裂を何というでしょう？", a: [減数分裂]}
  - {u: BI03-01, p: 45, q: "DNAの4種類の塩基で、グアニンと必ず対になるのはどれでしょう？", a: [シトシン, C]}
  - {u: BI03-02, p: 35, q: "DNAの情報が転写され、翻訳されてタンパク質がつくられる、という生物共通の流れを何というでしょう？", a: [セントラルドグマ]}
  - {u: BI03-03, p: 50, q: "エンドウ豆を使った実験で、遺伝の法則を発見したのは誰でしょう？", a: [メンデル]}
  - {u: BI03-04, p: 45, q: "『種の起源』で、自然選択による進化論を発表したのは誰でしょう？", a: [ダーウィン]}
  - {u: BI03-05, p: 40, q: "ある生物が持つDNAの全情報を何というでしょう？", a: [ゲノム]}
  - {u: BI04-01, p: 45, q: "光合成を行う葉緑体に含まれる緑色の色素を何というでしょう？", a: [クロロフィル, 葉緑素], r: [ようりょくそ]}
  - {u: BI04-02, p: 40, q: "激しい無酸素運動のとき、解糖系でできて筋肉にたまる物質は何でしょう？", a: [乳酸]}
  - {u: BI05-01, p: 45, q: "胃で働き、タンパク質を分解する消化酵素は何でしょう？", a: [ペプシン]}
  - {u: BI05-02, p: 45, q: "出血したときに集まって血を止める、血液の成分は何でしょう？", a: [血小板]}
  - {u: BI05-03, p: 40, q: "肺の中にある、直径0.1〜0.2mmほどの小さな袋で、酸素と二酸化炭素を交換する場所を何というでしょう？", a: [肺胞]}
  - {u: BI05-04, p: 40, q: "神経系の基本単位で、電気信号で情報を伝える細胞を何というでしょう？", a: [ニューロン, 神経細胞]}
  - {u: BI05-05, p: 45, q: "血液から老廃物をこし取って尿をつくる臓器は何でしょう？", a: [腎臓]}
  - {u: BI05-06, p: 40, q: "副腎から出て、心拍数や血糖値を上げ、体を戦闘モードにするホルモンは何でしょう？", a: [アドレナリン]}
  - {u: BI05-07, p: 45, q: "弱めたり無毒化したりした病原体を体に入れて、獲得免疫をつけさせるものを何というでしょう？", a: [ワクチン]}
  - {u: BI06-01, p: 40, q: "アメーバの分裂のように、1つの個体だけで子をつくる生殖を何というでしょう？", a: [無性生殖]}
  - {u: BI07-01, p: 35, q: "最初の生命が生まれた場所の候補とされる、海底で熱水が噴き出している場所を何というでしょう？", a: [熱水噴出孔]}
  - {u: BI07-02, p: 45, q: "約5.4億年前、動物の主要なグループがほぼいっせいに出現したできごとを何というでしょう？", a: [カンブリア爆発]}
  - {u: BI07-03, p: 40, q: "約400万年前の初期の人類で、すでに二足歩行をしていたものを何というでしょう？", a: [アウストラロピテクス]}
