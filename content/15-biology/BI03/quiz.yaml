questions:
  - q: DNAの4種類の塩基のうち、アデニン（A）と必ず対になるのはどれでしょう？
    a: [チミン, T]
    show: チミン（T）
  - q: DNAの2本の鎖がねじれた構造を何というでしょう？
    a: [二重らせん]
  - q: DNAの情報をRNAに写し取ることを何というでしょう？
    a: [転写]
  - q: エンドウ豆の実験から遺伝の法則を発見した人物は誰でしょう？
    a: [メンデル]
  - q: 環境に合った性質をもつ個体が生き残り、子孫を残していくことで進化が起こる、という仕組みを何というでしょう？
    a: [自然選択, 自然淘汰]
    show: 自然選択（自然淘汰）
