title: 人類の進化
scenes:
  - board: whiteboard
    steps:
      - say: 最後は「人類の進化」です。ヒトとチンパンジーは、およそ700万年前に、共通の祖先から分かれたと考えられています。DNAの塩基配列は、チンパンジーと、約98.7パーセント同じです。
        show:
          - { type: title, text: ヒトとチンパンジー }
          - { type: text, text: "約700万年前に **共通の祖先** から分かれた。DNA は約98.7％同じ" }
      - say: ここで注意です。これは、ヒトがチンパンジーから進化した、という意味ではありません。比較的最近に、共通の祖先を持っている、ということです。いとこ同士のような関係ですね。
        show:
          - type: svg
            w: 900
            h: 240
            markup: |
              <path d="M450 220 V120 L250 30 M450 120 L650 30" stroke="#9aa3ad"/>
              <circle cx="450" cy="220" r="8" fill="#f3d77a" stroke="none"/>
              <g stroke="none" font-size="26" text-anchor="middle"><text x="230" y="24" fill="#8fc4ff">ヒト</text><text x="680" y="24" fill="#9be0b0">チンパンジー</text><text x="650" y="228" fill="#f3d77a">共通の祖先（約700万年前）</text></g>
          - { type: box, color: pink, w: 1000, text: "×「チンパンジーから進化した」　○「共通の祖先を持つ（いとこのような関係）」" }

  - board: whiteboard
    steps:
      - say: 人類の進化には、いくつかの大事な変化がありました。
        show:
          - { type: title, text: 人類の大きな変化 }
      - say: まず、二足歩行です。約400万年前のアウストラロピテクスは、すでに二本足で歩いていました。さらに古い、最初期の人類から始まっていたと考えられています。両手が自由になり、道具を使えるようになりました。
        show:
          - { type: text, color: yellow, text: "① **二足歩行**：約400万年前のアウストラロピテクスはすでに二足歩行 → 手が自由に、道具が使える" }
      - say: 200万年前ごろからは、脳が急に大きくなりました。100万年前ごろからは、火を使った証拠が残っています。食べ物を加熱調理すると、やわらかく消化しやすくなり、エネルギーを効率よくとれるようになりました。
        show:
          - { type: text, color: blue, text: "② 脳の大型化：約200万年前から" }
          - { type: text, color: pink, text: "③ 火の使用：約100万年前から。調理で消化しやすく、エネルギー効率アップ" }
      - say: そして、言語の発達です。複雑なやりとりができるようになり、知識や文化を、ためて、次の世代へ伝えられるようになりました。
        show:
          - { type: text, color: green, text: "④ 言語：複雑なコミュニケーション。知識・文化をためて伝える" }

  - board: whiteboard
    steps:
      - say: 私たち、ホモ・サピエンスは、およそ30万年前にアフリカで生まれ、6万年から7万年前ごろから、世界中に広がっていきました。
        show:
          - { type: title, text: ホモ・サピエンス }
          - { type: box, color: yellow, w: 1000, text: "約30万年前にアフリカで誕生 → 約6〜7万年前から世界へ広がる" }
      - say: 世界中のどんな人も、ルーツをたどれば、アフリカにいた共通の祖先につながります。38億年前の小さな細胞から始まった命が、長い時間をかけて、今の私たちにつながっているのです。これで、生物はおしまいです。おつかれさまでした。
        added: true
        show:
          - { type: text, color: gray, text: "38億年前の細胞 → … → 今の私たち" }
