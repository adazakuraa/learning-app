title: 光合成
scenes:
  - board: slide
    steps:
      - say: ここから「生命活動とエネルギー」の章です。
        show:
          - { type: title, text: 第4章　生命活動とエネルギー }
      - say: この章では、生き物がエネルギーをつくり、使うしくみ、光合成と呼吸を学びます。
        added: true
        show:
          - type: list
            items: ["光合成", "呼吸（細胞呼吸）"]
      - say: 植物が太陽の光でつくった栄養を、動物が食べて、呼吸でエネルギーにする。地球全体の、エネルギーのめぐりが見えてきます。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "光合成と呼吸が「裏返し」の関係にあることを理解する" }

  - board: whiteboard
    steps:
      - say: 1本目は「光合成」です。光合成は、植物や藻、一部の細菌が、光のエネルギーを使って、二酸化炭素と水から、糖と酸素をつくる反応です。
        show:
          - { type: title, text: 光合成 }
          - type: svg
            w: 1100
            h: 300
            markup: |
              <circle cx="100" cy="70" r="40" stroke="#f3d77a"/><path d="M150 90 L330 150" stroke="#f3d77a" stroke-dasharray="8 8"/>
              <path d="M520 280 V120" stroke="#9be0b0" stroke-width="5"/><ellipse cx="460" cy="130" rx="70" ry="30" stroke="#9be0b0"/><ellipse cx="590" cy="110" rx="70" ry="30" stroke="#9be0b0"/>
              <g stroke="none" font-size="26"><text x="40" y="150" fill="#f3d77a">光</text><text x="40" y="250" fill="#9aa3ad">CO₂ ＋ 水</text><text x="720" y="110" fill="#8fc4ff">糖（栄養）</text><text x="720" y="180" fill="#f4a3b8">酸素</text></g>
              <path d="M170 240 H420 M640 100 H710 M640 170 H710" stroke="#9aa3ad"/>
      - say: 糖とは、グルコース、ブドウ糖のことです。式で書くと、こうなります。
        show:
          - { type: formula, size: l, color: yellow, tex: '6\text{CO}_2 + 6\text{H}_2\text{O} + \text{光} \rightarrow \text{C}_6\text{H}_{12}\text{O}_6 + 6\text{O}_2' }

  - board: whiteboard
    steps:
      - say: 光合成は、細胞の中の、葉緑体で行われます。葉緑体には、クロロフィルという、緑色の色素がふくまれていて、これが光を受けとめています。
        show:
          - { type: title, text: 葉緑体とクロロフィル }
          - { type: text, text: "光合成の場所 ＝ **葉緑体**　　光を受けとめる緑の色素 ＝ **クロロフィル**" }
      - say: 私たちが吸っている酸素も、食べている食べ物も、もとをたどれば、植物の光合成でつくられたものです。光合成は、地球の生き物すべてを支えているのです。
        added: true
        show:
          - { type: box, color: green, w: 1000, text: "酸素も食べ物も、もとは光合成 → 地球の生き物すべてを支える" }
