title: 生物の多様性と分類
scenes:
  - board: whiteboard
    steps:
      - say: 「生物の多様性と分類」です。地球上には、およそ870万種の生き物がいると考えられています。そのうち、人類が発見して記録できたのは、およそ200万種。まだ、ほとんどが見つかっていないのです。
        show:
          - { type: title, text: 生物の多様性 }
          - type: svg
            w: 1000
            h: 160
            markup: |
              <rect x="40" y="40" width="900" height="70" stroke="#9aa3ad"/>
              <rect x="40" y="40" width="207" height="70" fill="#9be0b0" fill-opacity="0.4" stroke="#9be0b0"/>
              <g stroke="none" font-size="24"><text x="50" y="140" fill="#9be0b0">発見ずみ 約200万種</text><text x="620" y="140" fill="#9aa3ad">推定 約870万種</text></g>

  - board: whiteboard
    steps:
      - say: 生き物のいちばん大きな分け方が、「ドメイン」です。真核生物、バクテリア、アーキアの3つがあります。
        show:
          - { type: title, text: 3つのドメイン }
          - type: svg
            w: 1100
            h: 220
            markup: |
              <rect x="20" y="20" width="340" height="180" rx="14" stroke="#f3d77a"/><rect x="390" y="20" width="340" height="180" rx="14" stroke="#8fc4ff"/><rect x="760" y="20" width="320" height="180" rx="14" stroke="#f4a3b8"/>
              <g stroke="none" font-size="28" text-anchor="middle"><text x="190" y="70" fill="#f3d77a">真核生物</text><text x="560" y="70" fill="#8fc4ff">バクテリア（細菌）</text><text x="920" y="70" fill="#f4a3b8">アーキア（古細菌）</text></g>
              <g stroke="none" font-size="20" text-anchor="middle" fill="currentColor"><text x="190" y="120">動物・植物・キノコ</text><text x="190" y="150">アメーバ など</text><text x="560" y="120">大腸菌・乳酸菌</text><text x="920" y="120">高温・高塩など</text><text x="920" y="150">極限の環境にすむ</text></g>
      - say: 私たちがよく知る生き物、動物、植物、キノコなどは、ほとんどが真核生物です。バクテリアは、大腸菌や乳酸菌など。アーキアは、熱い温泉や、塩分の濃い場所など、極限の環境にすむ微生物です。
        show:
          - { type: text, size: s, color: gray, text: "身近な生き物はほとんど真核生物" }

  - board: whiteboard
    steps:
      - say: 動物の中も、さらに、いくつかのグループ、「門」に分かれます。
        show:
          - { type: title, text: 動物のグループ（門） }
          - type: list
            items: ["海綿動物：海綿", "刺胞動物：クラゲ・イソギンチャク（毒の針）", "棘皮動物：ナマコ・ヒトデ", "脊椎動物：魚・哺乳類（背骨がある）", "軟体動物：貝・タコ", "節足動物：昆虫・エビ・カニ"]
      - say: クラゲやイソギンチャクは、毒の針を持つ刺胞動物。ナマコやヒトデは棘皮動物。貝やタコは軟体動物。昆虫は節足動物。そして私たちのように、背骨のある動物が、脊椎動物です。
        show:
          - { type: text, size: s, color: gray, text: "地球上でいちばん種類が多いのは、昆虫をふくむ節足動物" }

  - board: whiteboard
    steps:
      - say: ドメインの下には、界、門、綱、目、科、属、種と、だんだん細かい分類があります。
        show:
          - { type: title, text: ヒトの分類 }
          - type: svg
            w: 1100
            h: 400
            markup: |
              <g stroke="none" font-size="26">
                <text x="40" y="40" fill="#f3d77a">ドメイン：真核生物</text>
                <text x="100" y="90" fill="currentColor">界：動物界</text>
                <text x="160" y="140" fill="currentColor">門：脊索動物門（脊椎動物亜門）</text>
                <text x="220" y="190" fill="currentColor">綱：哺乳綱</text>
                <text x="280" y="240" fill="currentColor">目：霊長目</text>
                <text x="340" y="290" fill="currentColor">科：ヒト科</text>
                <text x="400" y="340" fill="currentColor">属：ホモ属</text>
                <text x="460" y="390" fill="#9be0b0">種：ホモ・サピエンス</text>
              </g>
      - say: ヒトは、真核生物、動物界、脊索動物門、哺乳綱、霊長目、ヒト科、ホモ属、そして、ホモ・サピエンスという種です。住所を、国、県、市、町と細かくしていくようなイメージです。
        show:
          - { type: text, size: s, color: gray, text: "住所を「国 → 県 → 市 → 町」と細かくするイメージ" }
      - say: 生き物の学名は、ラテン語でつけます。ホモ・サピエンスは、「ホモ属の、サピエンスという種」という意味で、日本語では、「知恵のある人」という意味です。
        show:
          - { type: box, color: yellow, w: 1000, text: "ホモ・サピエンス ＝ ラテン語で「知恵のある人」" }
