title: 生物の定義
scenes:
  - board: slide
    steps:
      - say: ここから、生物の学習に入ります。最初の章は、「生物とは何か」です。
        show:
          - { type: title, text: 第1章　生物とは何か }
      - say: この章では、「生きている」とはどういうことか、そして、地球上のさまざまな生き物の分け方を学びます。
        added: true
        show:
          - type: list
            items: ["生物の定義", "生物の多様性と分類"]
      - say: ウイルスは生き物なのか。人間は、生き物の中でどんな位置にいるのか。生物学の入り口となる問いです。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "「生きている」とは何かを考え、生き物全体の中で人間を位置づける" }

  - board: whiteboard
    steps:
      - say: 1本目は「生物の定義」です。生物とは何か。かんたんそうで、実は定義がむずかしい問いです。今の生物学では、生き物に共通する特徴として、次の4つがあげられます。
        show:
          - { type: title, text: 生物の4つの特徴 }
          - type: list
            items: ["① 細胞からできている", "② 代謝を行う", "③ 自己複製する", "④ 恒常性（ホメオスタシス）をもつ"]

  - board: whiteboard
    steps:
      - say: 1つ目、細胞からできていること。すべての生き物は、細胞という基本の単位でできています。細菌のように、細胞1個で生きる単細胞生物もいます。
        show:
          - { type: title, text: "① 細胞 ② 代謝" }
          - { type: box, color: blue, w: 1100, title: ① 細胞からできている, text: "すべての生物は細胞が基本単位（細胞1個の単細胞生物もいる）" }
      - say: 2つ目、代謝を行うこと。生き物は、外からエネルギーや物質をとりこんで、化学反応で生命活動を続けます。この一連の化学反応を、代謝といいます。食べることや、呼吸することがそうです。
        show:
          - { type: box, color: green, w: 1100, title: ② 代謝を行う, text: "外からエネルギー・物質をとりこみ、化学反応で生きる（食べる・呼吸する）" }

  - board: whiteboard
    steps:
      - say: 3つ目、自己複製すること。生き物は、自分のコピーを作って増えます。そのとき、DNAという遺伝情報を、次の世代に伝えます。
        show:
          - { type: title, text: "③ 自己複製 ④ 恒常性" }
          - { type: box, color: yellow, w: 1100, title: ③ 自己複製する, text: "自分のコピーを作って増える（DNA を次の世代へ）" }
      - say: 4つ目、恒常性、ホメオスタシスを持つこと。外の環境が変わっても、体の中を一定に保とうとする性質です。暑くても寒くても、体温を37度近くに保つ。血糖値を一定に保つ。これが恒常性です。
        show:
          - { type: box, color: pink, w: 1100, title: ④ 恒常性（ホメオスタシス）, text: "外が変わっても体の中を一定に保つ（体温37℃前後、血糖値）" }

  - board: whiteboard
    steps:
      - say: この4つの条件で考えると、ウイルスは、細胞を持たず、自分だけでは代謝もできません。だから、生物とは呼べない、と考えられています。
        show:
          - { type: title, text: ウイルスは生物？ }
          - { type: text, text: "ウイルス：細胞をもたない、自分で代謝できない → 生物とは呼べない" }
      - say: ウイルスは、ほかの生物の細胞に入りこんで、その細胞の仕組みを借りて増えます。生物と、生物でないものの、ちょうど境目にいる存在なのです。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "他の細胞の仕組みを借りて増える → 生物と非生物の境目の存在" }
      - say: 「生きているとは何か」。これは、生物学のいちばん根本の問いのひとつです。
        show:
          - { type: box, color: yellow, w: 1000, text: "「生きているとは何か」＝ 生物学の根本の問い" }
