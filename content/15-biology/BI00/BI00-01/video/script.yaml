title: 生物学とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、生物学がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 生物学とは
      - say: 生物学では、細胞、遺伝とDNA、生命活動とエネルギー、人体の仕組み、生殖、進化と生命の歴史を学びます。
        read: 生物学では、細胞、遺伝とディーエヌエー、生命活動とエネルギー、人体の仕組み、生殖、進化と生命の歴史を学びます。
        show:
          - type: box
            w: 1100
            text: 生物学では、細胞、遺伝とDNA、生命活動とエネルギー、人体の仕組み、生殖、進化と生命の歴史を学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で7章です。第1章は生物とは何か、第2章は細胞、第3章は遺伝とDNA、第4章は生命活動とエネルギー、第5章は人体の仕組み、第6章は生殖と発生、第7章は進化と生物の歴史。
        read: この科目は、全部で7章です。第1章は生物とは何か、第2章は細胞、第3章は遺伝とディーエヌエー、第4章は生命活動とエネルギー、第5章は人体の仕組み、第6章は生殖と発生、第7章は進化と生物の歴史。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　生物とは何か
              - 第2章　細胞
              - 第3章　遺伝とDNA
              - 第4章　生命活動とエネルギー
              - 第5章　人体の仕組み
              - 第6章　生殖と発生
              - 第7章　進化と生物の歴史
            at:
              - 80
              - 150
  - board: whiteboard
    steps:
      - say: では、生物学を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、自分の体を理解できる。消化、呼吸、免疫、ホルモン。体の仕組みを知ることは、健康管理の基本です。
        show:
          - type: box
            w: 1100
            text: |-
              **自分の体を理解できる**
              消化、呼吸、免疫、ホルモン。体の仕組みを知ることは、健康管理の基本です。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、医療や健康の情報を判断できる。ワクチン、遺伝子検査、がん。生物学の基礎があれば、健康情報を正しく理解できます。
        show:
          - type: box
            w: 1100
            text: |-
              **医療や健康の情報を判断できる**
              ワクチン、遺伝子検査、がん。生物学の基礎があれば、健康情報を正しく理解できます。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、生命のつながりがわかる。進化の歴史や生態系を知ると、人間もほかの生き物とつながっていることが実感できます。
        show:
          - type: box
            w: 1100
            text: |-
              **生命のつながりがわかる**
              進化の歴史や生態系を知ると、人間もほかの生き物とつながっていることが実感できます。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、健康診断の結果を見るとき、病気や薬のニュースを理解するとき、自然や動物に関心をもったとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 健康診断の結果を見るとき
              - 病気や薬のニュースを理解するとき
              - 自然や動物に関心をもったとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、器官や仕組みは、図を思い浮かべながら覚える。そして、「何のためにあるのか」を考える。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・器官や仕組みは、**図を思い浮かべながら**覚える
              ・「何のためにあるのか」を考える
            color: pink
            at:
              - 80
              - 420
