title: 有性生殖と無性生殖
scenes:
  - board: slide
    steps:
      - say: ここから「生殖と発生」の章です。
        show:
          - { type: title, text: 第6章　生殖と発生 }
      - say: この章で学ぶのは、「有性生殖と無性生殖」です。
        show:
          - type: list
            items: ["有性生殖と無性生殖"]
      - say: 生き物は、どうやって子孫を残すのか。そして、なぜわざわざオスとメスがいるのか。その意味を考えます。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "子孫の残し方と、オス・メスがいる意味を知る" }

  - board: whiteboard
    steps:
      - say: 生き物が子孫を残す方法は、大きく2つあります。
        show:
          - { type: title, text: 2つの生殖 }
      - say: 無性生殖は、ひとつの個体が、分裂などで子をつくる方法です。アメーバの分裂や、植物のさし木がこれにあたります。生まれる子は、親とまったく同じ遺伝子を持つ、クローンです。
        show:
          - { type: box, color: blue, w: 1100, title: 無性生殖, text: "1つの個体から子をつくる（分裂・さし木）→ 親と同じ遺伝子の **クローン**" }
      - say: 有性生殖は、2つの個体の、精子と卵が合体して、子をつくる方法です。これを受精といいます。両親の遺伝子がまざり合うので、親とはちがう組み合わせの子が生まれます。
        show:
          - { type: box, color: pink, w: 1100, title: 有性生殖, text: "精子と卵が合体（**受精**）→ 遺伝子がまざり、親とちがう組み合わせの子" }

  - board: whiteboard
    steps:
      - say: それぞれの長所と短所を比べてみましょう。
        show:
          - { type: title, text: メリットとデメリット }
      - say: 無性生殖は、相手がいらず、どんどん増やせます。でも、みんな同じ遺伝子なので、ある病気や環境の変化に弱いと、全員が同じようにやられてしまいます。
        show:
          - { type: text, color: blue, text: "無性生殖：○ 相手不要で速く増える　× 全員同じ弱点を持つ" }
      - say: 実際に、バナナの多くの品種は、さし木のように増やしたクローンなので、ひとつの病気が広がると、一気に全滅の危機におちいったことがあります。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "例：クローンで増やしたバナナが、病気で大きな被害を受けた" }
      - say: 有性生殖は、相手が必要で、増えるのも遅くなります。でも、一人ひとり遺伝子がちがうので、環境が変わっても、生き残る個体が出てきやすいのです。
        show:
          - { type: text, color: pink, text: "有性生殖：× 相手が必要で増えにくい　○ 多様性があり環境の変化に強い" }
      - say: いろいろな個体がいることが、種全体を守ることにつながる。これが、オスとメスがいる大きな理由のひとつと考えられています。
        show:
          - { type: box, color: yellow, w: 1000, text: "多様性 ＝ 種全体の保険" }
