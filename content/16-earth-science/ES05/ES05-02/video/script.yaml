title: 潮汐（潮の満ち引き）
scenes:
  - board: whiteboard
    steps:
      - say: 「潮汐」、潮の満ち引きです。海面は、決まったリズムで、高くなったり、低くなったりします。これを潮汐といい、およそ6時間ごとに、満潮と干潮をくり返します。
        show:
          - { type: title, text: 潮汐 }
          - { type: text, text: "**潮汐**：約6時間ごとに **満潮** と **干潮** をくり返す" }
      - say: 主な原因は、月の引力です。
        show:
          - { type: image, src: 1000002992.webp, at: [80, 200], w: 500 }
      - say: 月に近い側の海水は、月に引っぱられて、もり上がります。そして反対側も、地球のほうが月に引っぱられて、海水が取り残される形で、もり上がります。この2か所が、満潮です。
        show:
          - { type: text, at: [640, 230], w: 580, color: blue, text: "月に近い側と、その反対側がもり上がる ＝ **満潮**" }
      - say: その間の、月の方向から90度ずれた両側は、海水が少なくなって、干潮になります。地球は1日に1回まわるので、満潮と干潮は、1日に2回ずつやってくるのです。
        show:
          - { type: text, at: [640, 360], w: 580, color: yellow, text: "90度ずれた両側 ＝ **干潮**。1日に2回ずつくり返す" }

  - board: whiteboard
    steps:
      - say: 太陽の引力も、潮汐に影響します。
        show:
          - { type: title, text: 大潮 }
          - { type: image, src: 1000003158.webp, at: [80, 130], w: 900 }
      - say: 太陽、月、地球が、一直線にならぶとき、つまり、新月や満月のころには、月と太陽の引力が重なって、満潮と干潮の差が、最も大きくなります。これを、大潮といいます。
        show:
          - { type: box, at: [80, 440], w: 1100, color: yellow, text: "太陽・月・地球が一直線（新月・満月のころ）→ 引力が重なり差が最大 ＝ **大潮**" }
      - say: 潮干狩りに行くなら、大潮の日の干潮の時間がねらい目です。いつもより、ずっと遠くまで、海の底が顔を出します。
        added: true
        show:
          - { type: text, at: [80, 580], size: s, color: gray, text: "潮干狩りは「大潮の日の干潮」がねらい目" }
