title: 海流と気候への影響
scenes:
  - board: slide
    steps:
      - say: 第5章、「海洋」です。
        show:
          - { type: title, text: 第5章　海洋 }
      - say: 地球の表面の、およそ7割は海です。海の流れと、潮の満ち引きについて学びます。
        show:
          - type: list
            items: ["海流と気候への影響", "潮汐（潮の満ち引き）"]
      - say: 海は、気候や、魚のとれる場所、潮干狩りの時期まで、私たちの暮らしに深く関わっています。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "海の流れと潮の動きが、気候や暮らしに与える影響を知る" }

  - board: whiteboard
    steps:
      - say: 日本の近くには、いくつかの海流があります。
        show:
          - { type: title, text: 日本付近の海流 }
          - { type: image, src: 1000002930.webp, at: [80, 120], w: 560 }
      - say: 黒潮、日本海流は、太平洋を南から北へ流れる、暖流です。
        show:
          - { type: text, at: [690, 160], w: 540, color: pink, text: "**黒潮（日本海流）**：南から北へ流れる暖流" }
      - say: 親潮、千島海流は、北から南へ流れる、寒流です。栄養をたっぷりふくんでいて、プランクトンが多く、魚がたくさんいます。
        show:
          - { type: text, at: [690, 250], w: 540, color: blue, text: "**親潮（千島海流）**：北から南へ流れる寒流。栄養たっぷりで魚が多い" }
      - say: 暖流と寒流がぶつかる所を、潮目といいます。魚が集まる、よい漁場になります。三陸沖は、黒潮と親潮がぶつかる、世界有数の漁場です。
        show:
          - { type: box, at: [690, 400], w: 540, color: yellow, text: "暖流 × 寒流 ＝ **潮目** → よい漁場（三陸沖）" }

  - board: whiteboard
    steps:
      - say: 海流は、気候にも大きな影響をあたえます。有名なのが、ヨーロッパを暖める、北大西洋海流です。
        show:
          - { type: title, text: 海流と気候 }
          - { type: image, src: 1000002929.webp, at: [80, 130], w: 700 }
      - say: イギリスのロンドンは、北海道よりも北にあります。それなのに、冬でも比較的あたたかいのは、暖流の、北大西洋海流のおかげです。
        show:
          - { type: box, at: [820, 150], w: 400, color: pink, text: "ロンドンは北海道より北なのに、冬も比較的あたたかい ← 暖流のおかげ" }
      - say: 海は、地球全体の熱を運ぶ、巨大なベルトコンベアのような役割をしているのです。
        added: true
        show:
          - { type: text, at: [820, 400], w: 400, size: s, color: gray, text: "海流 ＝ 地球の熱を運ぶベルトコンベア" }
