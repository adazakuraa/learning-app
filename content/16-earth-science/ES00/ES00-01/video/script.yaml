title: 地学とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、地学がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 地学とは
      - say: 地学では、地球の構造と歴史、火山と地震、岩石と地形、大気と天気、海洋、宇宙と太陽系、地球環境を学びます。
        show:
          - type: box
            w: 1100
            text: 地学では、地球の構造と歴史、火山と地震、岩石と地形、大気と天気、海洋、宇宙と太陽系、地球環境を学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で7章です。第1章は地球の構造と歴史、第2章は火山と地震、第3章は岩石と地形、第4章は大気と天気、第5章は海洋、第6章は宇宙と太陽系、第7章は地球環境と人間。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　地球の構造と歴史
              - 第2章　火山と地震
              - 第3章　岩石と地形
              - 第4章　大気と天気
              - 第5章　海洋
              - 第6章　宇宙と太陽系
              - 第7章　地球環境と人間
            at:
              - 80
              - 150
  - board: whiteboard
    steps:
      - say: では、地学を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、災害から身を守れる。日本は地震、火山、台風、大雨の多い国です。仕組みを知ることが、正しく備える第一歩です。
        show:
          - type: box
            w: 1100
            text: |-
              **災害から身を守れる**
              日本は地震、火山、台風、大雨の多い国です。仕組みを知ることが、正しく備える第一歩です。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、天気予報が使いこなせる。前線、気圧、季節風。天気図が読めると、予報を自分の行動に生かせます。
        show:
          - type: box
            w: 1100
            text: |-
              **天気予報が使いこなせる**
              前線、気圧、季節風。天気図が読めると、予報を自分の行動に生かせます。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、地球と宇宙のスケールを感じられる。46億年の地球の歴史や、宇宙の広さを知ると、ものの見方が大きく広がります。
        show:
          - type: box
            w: 1100
            text: |-
              **地球と宇宙のスケールを感じられる**
              46億年の地球の歴史や、宇宙の広さを知ると、ものの見方が大きく広がります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、地震や台風の情報を見て行動を決めるとき、ハザードマップを確認するとき、星空や旅先の地形を楽しむとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 地震や台風の情報を見て行動を決めるとき
              - ハザードマップを確認するとき
              - 星空や旅先の地形を楽しむとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、身近な地形や天気と結びつける。そして、図やイメージで、仕組みを流れとしてとらえる。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・**身近な地形や天気**と結びつける
              ・図やイメージで、仕組みを流れとしてとらえる
            color: pink
            at:
              - 80
              - 420
