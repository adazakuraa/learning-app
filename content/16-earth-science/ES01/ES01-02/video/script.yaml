title: プレートテクトニクス
scenes:
  - board: whiteboard
    steps:
      - say: 「プレートテクトニクス」です。地球の表面は、十数枚の、かたい岩の板でおおわれています。これを、プレートといいます。
        show:
          - { type: title, text: プレート }
          - { type: image, src: 1000003152.webp, at: [80, 130], w: 820 }
      - say: プレートは、その下のマントルの、ゆっくりした流れに乗って、1年に数センチほど動いています。ちょうど、つめがのびるくらいの速さです。この考え方を、プレートテクトニクスといいます。
        show:
          - { type: text, at: [80, 600], text: "マントルの流れに乗って、年に数cm 動く ＝ **プレートテクトニクス**" }

  - board: whiteboard
    steps:
      - say: プレートとプレートの境目では、特徴的なことが起こります。
        show:
          - { type: title, text: プレートの境目 }
      - say: プレートどうしが離れていく場所では、下からマントルがわき上がって、新しい海底がつくられます。これを、海嶺といいます。
        show:
          - { type: box, color: green, w: 1100, title: 海嶺（かいれい）, text: "プレートが離れる場所。マントルがわき上がり、新しい海底ができる" }
      - say: 反対に、プレートがぶつかる場所では、重い海のプレートが、陸のプレートの下にもぐりこみます。ここにできる深い溝が、海溝です。
        show:
          - { type: box, color: blue, w: 1100, title: 海溝, text: "プレートがぶつかる場所。海のプレートが陸のプレートの下にもぐりこむ" }

  - board: whiteboard
    steps:
      - say: このもぐりこみが、火山や地震を生み出します。そして日本列島は、まさに、このもぐりこむ場所にあるのです。
        show:
          - { type: title, text: 日本はもぐりこみの場所 }
          - { type: image, src: 1000003153.webp, at: [80, 140], w: 1000 }
          - { type: box, at: [80, 580], color: yellow, w: 1000, text: "もぐりこみ → 火山・地震・海溝。日本はまさにこの場所" }

  - board: whiteboard
    steps:
      - say: 大陸も、プレートに乗って動いてきました。およそ2億5千万年前には、すべての大陸がひとつにまとまった、パンゲアという、超大陸がありました。
        show:
          - { type: title, text: 超大陸パンゲア }
          - { type: image, src: 1000003154.webp, at: [80, 130], w: 540 }
          - { type: text, at: [680, 160], w: 540, text: "約2億5千万年前：すべての大陸がひとつ ＝ **パンゲア**" }
      - say: これが分かれて、今の大陸の配置になりました。アフリカの西の海岸と、南アメリカの東の海岸は、ジグソーパズルのように、ぴったり合いそうな形をしています。もともと、くっついていたのですから、当然ですね。
        show:
          - { type: box, at: [680, 330], w: 540, color: yellow, text: "アフリカ西岸と南米東岸がパズルのように合う ＝ もとはひとつ" }
