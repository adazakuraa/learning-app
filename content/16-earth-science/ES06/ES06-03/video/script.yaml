title: 月と地球の関係
scenes:
  - board: whiteboard
    steps:
      - say: 「月と地球の関係」です。月は、地球のただひとつの衛星です。直径は、地球のおよそ4分の1です。
        show:
          - { type: title, text: 月 }
          - { type: text, text: "地球ただひとつの **衛星**。直径は地球の約1/4" }

  - board: whiteboard
    steps:
      - say: 月の満ち欠けは、月が地球のまわりを回る、公転のあいだに、太陽、地球、月の位置関係が変わることで起こります。
        show:
          - { type: title, text: 月の満ち欠け }
          - { type: image, src: 1000002993.webp, at: [60, 120], w: 500 }
      - say: 月は、いつも半分が、太陽に照らされています。その照らされた部分が、地球からどれくらい見えるかで、形が変わって見えるのです。
        show:
          - { type: text, at: [600, 140], w: 640, text: "月はいつも半分が照らされている → 地球からの見え方で形が変わる" }
      - say: 月が、太陽の反対側にあるときが、満月です。だから、満月は、夜にしか見えません。新月は、太陽と同じ方向、昼の空にありますが、照らされた面が地球の反対側を向いているので、ふつうは見えません。
        show:
          - { type: text, at: [600, 270], w: 640, color: yellow, text: "**満月**：太陽の反対側 → 夜に見える" }
          - { type: text, at: [600, 340], w: 640, color: gray, text: "**新月**：太陽と同じ方向。照らされた面が見えない" }
      - say: 月齢は、新月を0として、何日目の月かを表したものです。月齢3の月が三日月、月齢15ごろが満月で、その夜を、十五夜とよびます。満ち欠けは、およそ29.5日で一周します。
        show:
          - { type: text, at: [600, 450], w: 640, color: blue, text: "**月齢**：新月 ＝ 0。月齢3 ＝ 三日月、約15 ＝ 満月（十五夜）" }

  - board: whiteboard
    steps:
      - say: 日食は、月が、太陽をかくす現象です。太陽、月、地球が、この順に一直線にならんだときに起こります。
        show:
          - { type: title, text: 日食 }
          - { type: image, src: 1000002994.webp, at: [80, 130], w: 700 }
          - { type: image, src: 1000003168.webp, at: [820, 130], w: 400 }
      - say: 太陽を完全にかくすのが皆既日食。一部をかくすのが部分日食。月が少し遠くて、太陽のふちが、指輪のように見えるのが、金環日食です。
        show:
          - { type: text, at: [80, 400], color: yellow, text: "**皆既日食**（完全にかくす）・部分日食・**金環日食**（ふちが指輪のように残る）" }
      - say: 太陽は月のおよそ400倍大きく、そして、およそ400倍遠くにあります。だから、空では、ほぼ同じ大きさに見えて、ぴったりかくれるのです。すごい偶然ですね。
        added: true
        show:
          - { type: text, at: [80, 480], size: s, color: gray, text: "太陽は月の約400倍大きく、約400倍遠い → 空でほぼ同じ大きさに見える" }

  - board: whiteboard
    steps:
      - say: 月食は、地球のかげに、月が入る現象です。太陽、地球、月の順に、一直線にならんだときに起こります。
        show:
          - { type: title, text: 月食 }
          - { type: image, src: 1000002995.webp, at: [80, 130], w: 640 }
          - { type: image, src: 1000003169.webp, at: [760, 130], w: 460 }
      - say: 皆既月食でも、月は真っ暗にはならず、赤っぽく見えます。地球の空気を通りぬけた、赤い光が、月をうっすら照らすからです。夕焼けが赤いのと、同じしくみです。
        show:
          - { type: box, at: [80, 450], w: 1100, color: pink, text: "月食でも真っ暗にならず赤く見える（地球の空気を通った赤い光 ＝ 夕焼けと同じしくみ）" }
