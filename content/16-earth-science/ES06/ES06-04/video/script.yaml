title: 恒星と銀河
scenes:
  - board: whiteboard
    steps:
      - say: 「恒星と銀河」です。夜空にかがやく星は、惑星などをのぞけば、みな、太陽と同じ恒星です。
        show:
          - { type: title, text: 恒星の一生 }
          - { type: text, text: "夜空の星の多く ＝ 太陽と同じ **恒星**" }
      - say: 太陽の8倍以上の重さを持つ星は、一生の最後に、超新星爆発という、大爆発を起こします。残った中心部は、ブラックホールになることがあります。
        show:
          - type: svg
            w: 1100
            h: 180
            markup: |
              <circle cx="90" cy="90" r="60" stroke="#f3d77a" fill="#f3d77a" fill-opacity="0.2"/>
              <path d="M170 90 H300 M285 78 L300 90 L285 102 M640 90 H770 M755 78 L770 90 L755 102" stroke="#9aa3ad"/>
              <path d="M470 20 L490 70 L540 50 L505 90 L550 130 L495 115 L470 165 L450 115 L395 130 L440 90 L400 50 L450 70 Z" stroke="#f4a3b8" fill="#f4a3b8" fill-opacity="0.2"/>
              <circle cx="880" cy="90" r="40" fill="#000" stroke="#c9a7f0"/>
              <g stroke="none" font-size="22" text-anchor="middle"><text x="90" y="175" fill="#f3d77a">重い星（太陽の8倍以上）</text><text x="470" y="178" fill="#f4a3b8">超新星爆発</text><text x="880" y="165" fill="#c9a7f0">ブラックホール</text></g>

  - board: whiteboard
    steps:
      - say: 星の中では、核融合によって、炭素や酸素などの元素がつくられます。さらに、金や銀、ウランのような、鉄より重い元素は、超新星爆発や、中性子星どうしの合体でつくられたと考えられています。
        show:
          - { type: title, text: 私たちは星のかけら }
          - { type: text, text: "星の中：炭素・酸素などがつくられる" }
          - { type: text, text: "鉄より重い元素（金・銀・ウラン）：**超新星爆発** や中性子星の合体で" }
      - say: そうしてできた元素が、宇宙にまき散らされ、やがて、太陽や地球、そして私たちの体の材料になりました。私たちの体は、かつての星のかけらでできているのです。
        show:
          - { type: box, color: yellow, w: 1000, text: "私たちの体の元素 ＝ かつての星がつくり、まき散らしたもの" }

  - board: whiteboard
    steps:
      - say: 私たちの太陽をふくむ、星の集まりが、天の川銀河です。およそ2000億個の恒星が集まった、直径およそ10万光年の、うずまきの形をしています。
        show:
          - { type: title, text: 天の川銀河 }
          - { type: image, src: 1000002996.webp, at: [80, 130], w: 520 }
          - { type: text, at: [650, 160], w: 570, text: "**天の川銀河**：約2000億個の恒星、直径約10万光年のうずまき" }
      - say: 1光年は、光が1年かかって進む距離です。光は1秒で地球を7周半もするので、1光年は、およそ9兆4600億キロメートルにもなります。
        show:
          - { type: text, at: [650, 320], w: 570, color: blue, text: "**1光年** ＝ 光が1年で進む距離（約9兆4600億km）" }
      - say: 太陽系は、銀河の中心から離れた、うでの部分にあります。夜空に見える天の川は、この銀河を、内側からながめた姿なのです。
        added: true
        show:
          - { type: text, at: [650, 450], w: 570, size: s, color: gray, text: "夜空の天の川 ＝ 自分のいる銀河を内側からながめた姿" }
