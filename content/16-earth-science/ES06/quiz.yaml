questions:
  - q: 太陽系で最も大きい惑星は何でしょう？
    a: [木星]
  - q: 明け方や夕方に明るく見え、「明けの明星」「宵の明星」と呼ばれる惑星は何でしょう？
    a: [金星]
    r: [きんせい]
  - q: 太陽がエネルギーを生み出している反応を何というでしょう？
    a: [核融合, 核融合反応]
    show: 核融合（反応）
  - q: 月が太陽をかくす現象を何というでしょう？
    a: [日食]
  - q: 太陽をふくむ、約2000億個の恒星が集まった銀河を何というでしょう？
    a: [天の川銀河, 銀河系]
    show: 天の川銀河（銀河系）
