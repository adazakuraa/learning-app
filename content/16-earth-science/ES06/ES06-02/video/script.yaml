title: 太陽の構造と活動
scenes:
  - board: whiteboard
    steps:
      - say: 「太陽」です。太陽は、自分で光を出す天体、恒星です。重さは、地球のおよそ33万倍もあります。
        show:
          - { type: title, text: 太陽 ＝ 恒星 }
          - { type: text, text: "**恒星** ＝ 自分で光を出す天体。太陽の重さは地球の約33万倍" }
      - say: 月や金星は、太陽の光を反射して、明るく見えているだけなので、恒星ではありません。
        show:
          - { type: text, color: gray, text: "月・金星：太陽の光を反射しているだけ（恒星ではない）" }
      - say: 太陽は、東からのぼり、南の空でいちばん高くなって、西にしずみます。南の空でいちばん高くなることを、南中といいます。
        show:
          - { type: text, color: yellow, text: "東からのぼり → 南で最も高く（**南中**）→ 西にしずむ" }

  - board: whiteboard
    steps:
      - say: 太陽のエネルギーのもとは、中心で起きている、核融合反応です。水素の原子どうしがくっついて、ヘリウムに変わるときに、ばく大なエネルギーが生まれます。
        show:
          - { type: title, text: 核融合反応 }
          - { type: box, color: yellow, w: 1000, text: "水素 ＋ 水素 → ヘリウム ＋ ばく大なエネルギー ＝ **核融合**" }
      - say: 物理の章で学んだ、原子力発電の核分裂とは、逆の反応ですね。地球に届く光と熱のほとんどは、ここから来ています。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "原子力発電の「核分裂」とは逆の反応（物理）" }

  - board: whiteboard
    steps:
      - say: 太陽の表面に見える黒い点を、黒点といいます。
        show:
          - { type: title, text: 黒点と太陽フレア }
          - { type: image, src: 1000003167.webp, at: [80, 130], w: 520 }
      - say: 黒点は、磁場が強く、まわりより温度が低いので、暗く見えるのです。
        show:
          - { type: text, at: [650, 160], w: 570, text: "**黒点**：磁場が強く、まわりより温度が低いので暗く見える" }
      - say: 太陽フレアは、太陽の表面で起こる、大規模な爆発です。たくさんの粒子が地球にとどいて、通信障害や停電を起こしたり、オーロラを増やしたりします。
        show:
          - { type: box, at: [650, 320], w: 570, color: pink, title: 太陽フレア, text: "表面の大爆発 → 通信障害・停電・オーロラの増加" }
