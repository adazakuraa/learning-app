title: 津波
scenes:
  - board: whiteboard
    steps:
      - say: 「津波」です。海底で大きな地震が起きると、海底が持ち上がったり、下がったりして、その上の海水全体が動きます。これが、津波です。
        added: true
        show:
          - { type: title, text: 津波とは }
          - { type: text, text: "海底が動く → 上の海水全体が動く ＝ **津波**" }
      - say: ふつうの波は、海の表面だけが動きますが、津波は、海の底から表面まで、海水のかたまりごと押しよせます。だから、ひざくらいの高さでも、人は立っていられません。
        added: true
        show:
          - { type: box, color: blue, w: 1100, text: "ふつうの波：表面だけ　津波：海水のかたまりごと押しよせる" }

  - board: whiteboard
    steps:
      - say: 地震のとき、津波の前に、海の水が大きく引く、ということが起こる場合があります。
        show:
          - { type: title, text: 引き波に注意 }
          - { type: text, text: "津波の前に、海水が大きく引くことがある" }
      - say: このとき、めずらしいからと見に行くと、そのあとに来る、第二波、第三波に巻きこまれる危険があります。そして、津波は、最初の波がいちばん大きいとは、限りません。
        show:
          - { type: box, color: pink, w: 1100, text: "「めずらしい」と見に行く → 第二波・第三波に巻きこまれる" }
      - say: 海の近くで強い揺れを感じたら、すぐに高いところへ逃げる。そして、警報が解除されるまで、もどらない。これが、命を守る鉄則です。
        added: true
        show:
          - { type: box, color: yellow, w: 1100, title: 命を守る鉄則, text: "強い揺れ → すぐ高い所へ。警報が解除されるまでもどらない" }
