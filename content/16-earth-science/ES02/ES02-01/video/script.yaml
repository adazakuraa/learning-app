title: 火山の仕組みと種類
scenes:
  - board: slide
    steps:
      - say: 第2章、「火山と地震」です。
        show:
          - { type: title, text: 第2章　火山と地震 }
      - say: 火山の噴火や地震、津波が、なぜ起こるのか。そのしくみと、身を守るための知識を学びます。
        show:
          - type: list
            items: ["火山の仕組みと種類", "地震の仕組み", "地震波と地球内部", "津波"]
      - say: 日本は、世界でも有数の、火山と地震の国です。しくみを知ることが、いざというとき、自分と大切な人の命を守ることにつながります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "火山・地震・津波のしくみを知り、命を守る行動につなげる" }

  - board: whiteboard
    steps:
      - say: 火山は、地下のマグマが、地上にふき出してできます。マグマが生まれる場所は、主に2つあります。
        show:
          - { type: title, text: マグマが生まれる場所 }
      - say: ひとつは、プレートの境目です。前の章で学んだ、プレートが沈みこむ場所や、海嶺のように、プレートが離れていく場所です。日本の火山は、沈みこみでできたものです。
        show:
          - { type: box, color: blue, w: 1100, title: ① プレートの境目, text: "沈みこむ場所（日本の火山）、離れていく場所（海嶺）" }
      - say: もうひとつは、ホットスポットです。プレートとは関係なく、マントルが、ずっと下からわき上がってくる場所です。ハワイや、アイスランドが有名です。
        show:
          - { type: box, color: pink, w: 1100, title: ② ホットスポット, text: "プレートと関係なくマントルがわき上がる（ハワイ・アイスランド）" }

  - board: whiteboard
    steps:
      - say: 火山の形は、マグマのねばり気、ねばりけによって変わります。
        show:
          - { type: title, text: マグマのねばりけと火山の形 }
          - { type: image, src: 1000002979.webp, at: [80, 125], w: 900 }
      - say: ねばりけが小さい、さらさらのマグマは、遠くまで流れるので、ハワイのキラウエアのような、平べったい盾状火山になります。噴火はおだやかです。
        show:
          - { type: text, at: [80, 555], color: blue, text: "さらさら → 平たい盾状火山（キラウエア）。噴火はおだやか" }
      - say: ねばりけが大きいマグマは、流れにくく、もり上がって、雲仙普賢岳のような溶岩ドームになります。ガスがぬけにくいので、噴火ははげしくなります。富士山は、その中間の成層火山です。
        show:
          - { type: text, at: [80, 605], color: pink, text: "ねばねば → 溶岩ドーム（雲仙普賢岳）。噴火ははげしい" }
          - { type: text, at: [80, 655], color: yellow, text: "中間 → 成層火山（富士山）" }
      - say: はちみつと水を、お皿にたらしてみると、水はうすく広がり、はちみつはもり上がりますね。それと同じです。
        added: true
        show:
          - { type: text, at: [1000, 300], w: 240, size: s, color: gray, text: "水はうすく広がり、はちみつはもり上がる のと同じ" }

  - board: whiteboard
    steps:
      - say: 火山の災害で、もっとも危険なのが、火砕流です。
        show:
          - { type: title, text: 火砕流 }
      - say: 火砕流は、高温の火山ガスと、火山灰、岩がまざりあって、時速100キロメートル以上の速さで、山の斜面を流れ下る現象です。車でも逃げきれない速さです。
        show:
          - { type: box, color: pink, w: 1100, text: "**火砕流**：高温のガス・火山灰・岩が、時速100km以上で斜面を流れ下る" }
      - say: 1991年の、雲仙普賢岳の噴火では、火砕流によって、43人が亡くなりました。火砕流は、見てから逃げるのでは間に合いません。避難の呼びかけが出たら、すぐに従うことが大切です。
        show:
          - { type: text, text: "1991年 雲仙普賢岳：火砕流で43人が死亡" }
          - { type: text, color: yellow, text: "見てからでは間に合わない → 避難の呼びかけにすぐ従う" }
