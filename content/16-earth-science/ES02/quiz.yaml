questions:
  - q: 地震が放出するエネルギーの大きさを表す尺度を何というでしょう？
    a: [マグニチュード, M]
    show: マグニチュード（M）
  - q: 地震波のうち、速く伝わり最初の小さな揺れ（初期微動）をもたらす波を何というでしょう？
    a: [P波]
  - q: P波は約6km/s、S波は約3.5km/sで伝わる。震源から42km離れた場所で、P波が届いてからS波が届くまで何秒かかるでしょう？
    a: ['5', 5秒]
    show: 5秒
    explain: S波は42÷3.5＝12秒、P波は42÷6＝7秒。差は5秒。
  - q: 高温の火山ガスと火山灰・岩が混ざって、時速100km以上で流れ下る現象を何というでしょう？
    a: [火砕流]
