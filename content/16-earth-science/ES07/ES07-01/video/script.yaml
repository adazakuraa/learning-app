title: 自然災害と防災
scenes:
  - board: slide
    steps:
      - say: 地学の最後の章、「地球環境と人間」です。
        show:
          - { type: title, text: 第7章　地球環境と人間 }
      - say: これまで学んだ地球のしくみを、災害から身を守ること、そして、資源やエネルギーの使い方に、つなげて考えます。
        show:
          - type: list
            items: ["自然災害と防災", "地球資源とエネルギー"]
      - say: 地球のしくみを知ることは、知識で終わらず、命と暮らしを守る力になります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "地球の知識を、防災と資源・エネルギーの問題につなげる" }

  - board: whiteboard
    steps:
      - say: 1923年の関東大震災では、死者と行方不明者が、およそ10万5千人にのぼりました。その多くは、地震の揺れそのものではなく、そのあとに起きた火災によるものでした。
        show:
          - { type: title, text: 関東大震災から学ぶ }
          - { type: text, text: "1923年 **関東大震災**：死者・行方不明者 約10万5千人。多くは **火災** による" }
      - say: ちょうどお昼どきで、多くの家が、火を使って料理をしていました。木造の家が密集していたため、火が次々と燃え広がったのです。
        added: true
        show:
          - { type: text, color: gray, text: "昼食の準備で火を使っていた ＋ 木造の家が密集 → 燃え広がった" }

  - board: whiteboard
    steps:
      - say: 過去の大地震の教訓から、建物の基準は、少しずつ強化されてきました。
        show:
          - { type: title, text: 建物の耐震基準 }
      - say: 1981年に、新耐震基準ができ、2000年には、さらに強化されました。1995年の阪神・淡路大震災では、1981年より前の古い基準で建てられた建物に、大きな被害が集中しました。
        show:
          - { type: text, color: yellow, text: "**1981年 新耐震基準** → **2000年基準** でさらに強化" }
          - { type: text, size: s, color: gray, text: "阪神・淡路大震災（1995年）では、古い基準の建物に被害が集中" }
      - say: 住まいを選ぶときは、いつの基準で建てられたかを確かめることが、防災の第一歩になります。そして、家具を固定する、避難場所を確認しておく、といった、ふだんの備えも大切です。
        added: true
        show:
          - { type: box, color: blue, w: 1100, title: ふだんの備え, text: "建物の基準を確かめる・家具を固定する・避難場所を確認する" }
