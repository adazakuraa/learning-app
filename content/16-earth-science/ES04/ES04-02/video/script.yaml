title: 気圧と風
scenes:
  - board: whiteboard
    steps:
      - say: 「気圧と風」です。気圧とは、空気が、ものを押す力のことです。ふつうの気圧は、1013ヘクトパスカル。1平方センチメートルを、およそ1キログラムの重さで押す力です。
        show:
          - { type: title, text: 気圧 }
          - { type: text, text: "**気圧** ＝ 空気が押す力。ふつうは **1013hPa**（1cm² あたり約1kg）" }
      - say: 1平方メートルなら、およそ10トン。私たちは、いつも、ものすごい力で押されています。でも、体の内側からも同じ力で押し返しているので、感じないのです。
        show:
          - { type: box, color: yellow, w: 1000, text: "1m² あたり約10トン！ でも体の内側からも押し返しているので感じない" }
      - say: 山の上で、お菓子の袋がぱんぱんにふくらむのは、外の気圧が低くなって、袋の中の空気が、押し返す力のほうが強くなるからです。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "山の上でお菓子の袋がふくらむ ＝ 外の気圧が低いから" }

  - board: whiteboard
    steps:
      - say: 高気圧と、低気圧を見てみましょう。
        show:
          - { type: title, text: 高気圧と低気圧 }
          - { type: image, src: 1000002953.webp, at: [80, 130], w: 640 }
      - say: 高気圧は、まわりより気圧が高い所です。空気が上から下りてくるので、雲が消えて、晴れになります。
        show:
          - { type: box, at: [760, 140], w: 460, color: blue, title: 高気圧, text: "下降気流 → 雲が消えて **晴れ**" }
      - say: 低気圧は、まわりから中心に向かって風が吹きこみ、空気が上にのぼっていきます。のぼった空気が冷えて雲ができるので、天気が悪くなります。
        show:
          - { type: box, at: [760, 320], w: 460, color: pink, title: 低気圧, text: "上昇気流 → 雲ができて **雨・くもり**" }
      - say: 風は、気圧の高い所から、低い所へ吹きます。空気が、混んでいる所から、すいている所へ流れていくイメージです。
        show:
          - { type: text, at: [760, 510], w: 460, color: yellow, text: "風は 気圧の高い所 → 低い所 へ吹く" }

  - board: whiteboard
    steps:
      - say: 偏西風は、日本のある中緯度で、西から東へ、いつも吹いている強い風です。
        show:
          - { type: title, text: 偏西風 }
          - { type: image, src: 1000003157.webp, at: [80, 130], w: 600 }
          - { type: text, at: [720, 160], w: 500, text: "**偏西風**：中緯度で、西 → 東 にいつも吹く風" }
      - say: 日本の天気が、西から東へ変わっていくのは、このためです。天気予報で、「明日は西から雨雲が近づく」というのは、雲が偏西風に乗って、移動してくるからなのです。
        show:
          - { type: box, at: [720, 300], w: 500, color: yellow, text: "天気は西から変わる（雲が偏西風に乗って移動）" }
      - say: だから、九州が雨なら、次の日は関東も雨かもしれない、と予想できるのです。
        added: true
        show:
          - { type: text, at: [720, 470], w: 500, size: s, color: gray, text: "九州が雨 → 次は関東かも" }
