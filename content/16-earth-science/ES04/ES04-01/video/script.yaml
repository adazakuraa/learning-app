title: 大気の構造
scenes:
  - board: slide
    steps:
      - say: 第4章、「大気と天気」です。
        show:
          - { type: title, text: 第4章　大気と天気 }
      - say: 地球をつつむ空気のつくりから、風が吹くしくみ、天気が変わるしくみ、そして日本の季節の特徴までを学びます。
        show:
          - type: list
            items: ["大気の構造", "気圧と風", "前線と天気の変化", "日本の気候と季節風"]
      - say: 天気予報の「低気圧が近づいています」「寒冷前線が通過します」という言葉の意味がわかると、予報を、自分の行動に生かせるようになります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "天気が変わるしくみを知り、天気予報を読みとけるようにする" }

  - board: whiteboard
    steps:
      - say: 地球をつつむ大気は、高さによって、いくつかの層に分けられます。
        show:
          - { type: title, text: 大気の層 }
          - { type: image, src: 1000003156.webp, at: [80, 130], w: 640 }
      - say: いちばん下が、私たちが暮らす、対流圏です。大気全体の重さの、およそ80パーセントが、ここに集まっています。雲ができたり、雨がふったり、天気に関わる現象は、すべてこの層で起こります。
        show:
          - { type: box, at: [760, 140], w: 460, color: blue, title: 対流圏（〜約10km）, text: "大気の約80％。天気の現象はすべてここ" }
      - say: その上が、成層圏です。ここには、オゾン層があります。オゾン層は、太陽からの有害な紫外線を吸収して、地上の生き物を守っています。
        show:
          - { type: box, at: [760, 330], w: 460, color: green, title: 成層圏, text: "**オゾン層**：有害な紫外線を吸収して生き物を守る" }

  - board: whiteboard
    steps:
      - say: 1980年代、このオゾン層に、穴があいたように薄くなる、オゾンホールが見つかり、大きな環境問題になりました。
        show:
          - { type: title, text: オゾンホール }
          - { type: text, text: "1980年代：オゾン層がうすくなる **オゾンホール** が見つかる" }
      - say: 原因は、スプレーや冷蔵庫に使われていた、フロンというガスでした。世界中でフロンの使用を規制した結果、オゾン層は、少しずつ回復に向かっています。世界が協力して、環境問題を解決に向かわせた、成功例のひとつです。
        added: true
        show:
          - { type: box, color: yellow, w: 1100, text: "原因：フロン（スプレー・冷蔵庫）→ 世界で規制 → 回復に向かう（国際協力の成功例）" }
