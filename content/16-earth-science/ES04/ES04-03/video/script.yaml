title: 前線と天気の変化
scenes:
  - board: whiteboard
    steps:
      - say: 「前線と天気の変化」です。気団とは、大きな空気のかたまりのことです。日本のまわりには、性質のちがう気団があります。
        show:
          - { type: title, text: 日本のまわりの気団 }
          - { type: image, src: 1000002988.webp, at: [80, 120], w: 520 }
      - say: 冷たく乾いた、シベリア気団。冷たくしめった、オホーツク海気団。そして、暖かくしめった、小笠原気団です。
        show:
          - { type: text, at: [650, 170], w: 570, color: blue, text: "**シベリア気団**：冷たい・乾燥" }
          - { type: text, at: [650, 250], w: 570, color: green, text: "**オホーツク海気団**：冷たい・しめった" }
          - { type: text, at: [650, 350], w: 570, color: pink, text: "**小笠原気団**：暖かい・しめった" }
      - say: 冬に力を強めるのがシベリア気団、夏に力を強めるのが小笠原気団です。陸の上でできた気団は乾いていて、海の上でできた気団は、しめっています。
        show:
          - { type: box, at: [650, 440], w: 570, color: yellow, text: "冬：シベリア気団　夏：小笠原気団" }
          - { type: text, at: [650, 560], w: 570, size: s, color: gray, text: "陸でできた気団は乾燥、海でできた気団はしめっている" }

  - board: whiteboard
    steps:
      - say: 性質のちがう気団がぶつかる境目を、前線といいます。
        show:
          - { type: title, text: 前線 }
          - { type: image, src: 1000002989.webp, at: [80, 130], w: 1100 }
      - say: 寒冷前線は、冷たい空気が、暖かい空気の下に、いきおいよくもぐりこむ前線です。暖かい空気が急に押し上げられるので、背の高い雲ができ、強い雨や雷、突風が、短い時間に起こります。
        show:
          - { type: box, at: [80, 500], w: 540, color: blue, title: 寒冷前線（左）, text: "冷たい空気がもぐりこむ → 短時間の強い雨・雷・突風" }
      - say: 温暖前線は、暖かい空気が、冷たい空気の上に、ゆっくりはい上がる前線です。おだやかな雨が、長い時間続きます。天気予報で、「明日から雨が続く」というときは、温暖前線が近づいていることが多いです。
        show:
          - { type: box, at: [660, 500], w: 540, color: pink, title: 温暖前線（右）, text: "暖かい空気がはい上がる → おだやかな雨が長く続く" }

  - board: whiteboard
    steps:
      - say: 梅雨前線は、オホーツク海気団と、小笠原気団がぶつかってできる、停滞前線です。6月から7月に、日本の近くにとどまります。
        show:
          - { type: title, text: 梅雨前線 }
          - { type: image, src: 1000002956.webp, at: [80, 130], w: 600 }
          - { type: text, at: [720, 160], w: 500, text: "オホーツク海気団 × 小笠原気団 ＝ **停滞前線**（6〜7月）" }
      - say: 両方の気団の力が、ちょうどつり合っているので、前線が動かず、長雨になるのです。綱引きで、両チームの力が同じだと、綱が動かないのと同じですね。
        show:
          - { type: box, at: [720, 320], w: 500, color: yellow, text: "力がつり合って動かない → 長雨（綱引きが動かないのと同じ）" }
      - say: やがて小笠原気団が勝って、前線を北へ押し上げると、梅雨明け。夏がやってきます。
        added: true
        show:
          - { type: text, at: [720, 500], w: 500, size: s, color: gray, text: "小笠原気団が勝つ → 梅雨明け、夏へ" }
