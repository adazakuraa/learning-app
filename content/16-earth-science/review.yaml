  - {u: ES06-04, p: 40, q: "太陽の8倍以上の重さの星が、寿命の最後に起こす大爆発を何というでしょう？", a: [超新星爆発, 超新星]}
  - {u: ES07-01, p: 40, q: "死者・行方不明者が約10万5千人にのぼり、その多くが火災によるものだった、1923年の大地震を何というでしょう？", a: [関東大震災]}
  - {u: ES07-02, p: 45, q: "石油・石炭・天然ガスのように、古代の生物からできた燃料を何というでしょう？", a: [化石燃料]}
