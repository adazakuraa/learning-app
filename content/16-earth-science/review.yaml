  - {u: ES02-04, p: 50, q: "海底の地震などで海面が持ち上げられて起こる、大きな波を何というでしょう？", a: [津波]}
  - {u: ES03-01, p: 40, q: "マグマがゆっくり冷えて固まり、墓石や建築材によく使われる白っぽい岩石は何でしょう？", a: [花崗岩, 御影石]}
  - {u: ES03-02, p: 40, q: "川が長い年月をかけて削った、深さ約1600mの峡谷で有名なアメリカの国立公園は何でしょう？", a: [グランドキャニオン]}
  - {u: ES03-03, p: 40, q: "飛騨・木曽・赤石山脈をまとめた、3000m級の山々が連なる山地を何というでしょう？", a: [日本アルプス]}
  - {u: ES04-01, p: 45, q: "雲ができたり雨が降ったりする、私たちが暮らす一番下の大気の層を何というでしょう？", a: [対流圏]}
  - {u: ES04-02, p: 40, q: "標準的な気圧で、1013という数値で表される単位は何でしょう？", a: [ヘクトパスカル, hPa]}
  - {u: ES04-03, p: 40, q: "暖かい空気が冷たい空気の上にゆっくりはい上がっていく前線を何というでしょう？", a: [温暖前線]}
  - {u: ES04-04, p: 45, q: "最大風速が約17m/s以上になった、熱帯の海で発生した低気圧を何というでしょう？", a: [台風]}
  - {u: ES05-01, p: 45, q: "暖流の黒潮と寒流の親潮がぶつかり、世界有数の漁場となっている東北の沖合を何というでしょう？", a: [三陸沖, 三陸]}
  - {u: ES05-02, p: 40, q: "太陽・月・地球が一直線に並ぶ新月や満月のころ、潮の満ち引きの差が大きくなることを何というでしょう？", a: [大潮]}
  - {u: ES06-01, p: 45, q: "2006年に惑星から「準惑星」に分類が変わった天体は何でしょう？", a: [冥王星]}
  - {u: ES06-02, p: 40, q: "太陽の表面で、周りより温度が低いため暗く見える部分を何というでしょう？", a: [黒点]}
