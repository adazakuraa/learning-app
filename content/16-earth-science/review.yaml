questions:
  - {u: ES01-01, p: 45, q: "地球の内部で、地殻と核の間にある岩石の層を何というでしょう？", a: [マントル]}
  - {u: ES01-02, p: 45, q: "プレートが生まれる、海底の大山脈を何というでしょう？", a: [海嶺]}
  - {u: ES01-03, p: 45, q: "三葉虫やアノマロカリスが栄えた、5.4億年前から2.5億年前の時代を何というでしょう？", a: [古生代]}
  - {u: ES02-01, p: 40, q: "ハワイのように、プレートの境界と関係なくマントルからマグマが上がってくる場所を何というでしょう？", a: [ホットスポット]}
  - {u: ES02-02, p: 45, q: "地下の岩盤がずれて地震を起こす、そのずれた面を何というでしょう？", a: [断層]}
