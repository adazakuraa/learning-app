title: 日本の地形の特徴
scenes:
  - board: whiteboard
    steps:
      - say: 「日本の地形の特徴」です。日本は、プレートどうしがぶつかって、大地が押し上げられているので、山がちな地形をしています。国土のおよそ4分の3が、山地や丘陵です。
        show:
          - { type: title, text: 山がちな日本 }
          - { type: text, text: "プレートの衝突で押し上げられる → 山がち（国土の約3/4 が山地・丘陵）" }
      - say: 中部地方の、飛騨山脈、木曽山脈、赤石山脈は、まとめて日本アルプスとよばれ、3000メートル級の山々が連なっています。
        show:
          - { type: image, src: 1000002951.webp, at: [80, 250], w: 640 }
          - { type: text, at: [760, 290], w: 460, color: yellow, text: "**日本アルプス**：飛騨・木曽・赤石山脈。3000m 級" }

  - board: whiteboard
    steps:
      - say: フォッサマグナは、本州を東西に分ける、大きな溝です。ラテン語で、大きな溝、という意味です。図のオレンジ色の部分です。
        show:
          - { type: title, text: フォッサマグナ }
          - { type: image, src: 1000002987.webp, at: [80, 120], w: 520 }
          - { type: text, at: [660, 160], w: 560, text: "**フォッサマグナ** ＝ 本州を東西に分ける大きな溝（図のオレンジ色）" }
      - say: その西の端は、新潟県の糸魚川から、静岡につながる線です。この線をさかいに、東日本と西日本では、大地のなりたちが、まったくちがっています。
        show:
          - { type: box, at: [660, 330], w: 560, color: yellow, text: "西の端：糸魚川〜静岡の線。東日本と西日本で大地のなりたちがちがう" }
      - say: 大地のつくりのちがいは、文化にも影響しています。日本の地形を知ると、日本の歴史や暮らしも、より深く見えてきます。
        added: true
        show:
          - { type: text, at: [660, 520], w: 560, size: s, color: gray, text: "地形を知ると、歴史や暮らしも見えてくる" }
