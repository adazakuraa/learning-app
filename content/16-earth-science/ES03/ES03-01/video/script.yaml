title: 岩石の三種類
scenes:
  - board: slide
    steps:
      - say: 第3章、「岩石と地形」です。
        show:
          - { type: title, text: 第3章　岩石と地形 }
      - say: 石がどうやってできるのか、そして、山や谷、海岸の形が、どうやってつくられるのかを学びます。
        show:
          - type: list
            items: ["岩石の三種類", "侵食・運搬・堆積", "日本の地形の特徴"]
      - say: 旅行先の景色や、墓石、建物の石。身近な風景の、なりたちがわかるようになります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "岩石と地形のなりたちを知り、身近な風景を読みとけるようにする" }

  - board: whiteboard
    steps:
      - say: 地球の岩石は、どうやってできたかによって、3つの種類に分けられます。
        show:
          - { type: title, text: 岩石の三種類 }
      - say: 火成岩は、マグマが冷えて固まった岩石です。玄武岩や、花崗岩が有名です。花崗岩は、墓石や建物の材料によく使われます。
        show:
          - { type: box, at: [80, 140], w: 560, color: pink, title: 火成岩, text: "マグマが冷えて固まる。玄武岩・花崗岩（墓石・建材）" }
          - { type: image, src: 1000002980.webp, at: [700, 130], w: 420 }
      - say: 堆積岩は、砂や、生き物の死がいなどが、積もって固まった岩石です。石灰岩などがあります。
        show:
          - { type: box, at: [80, 340], w: 560, color: blue, title: 堆積岩, text: "砂や生き物の死がいが積もって固まる。石灰岩など" }
      - say: 変成岩は、もとからあった岩石が、高い温度や圧力で、性質が変わった岩石です。石灰岩が変化した、大理石などがあります。
        show:
          - { type: box, at: [80, 520], w: 560, color: yellow, title: 変成岩, text: "岩石が高温・高圧で変化。大理石（石灰岩から）" }

  - board: whiteboard
    steps:
      - say: 石灰岩について、もう少し見てみましょう。石灰岩は、サンゴや貝殻などの、炭酸カルシウムが積もってできたものです。つまり、もとは海の中でできたのです。
        show:
          - { type: title, text: 石灰岩とカルスト地形 }
          - { type: text, text: "石灰岩 ＝ サンゴ・貝殻（炭酸カルシウム）が積もったもの → もとは **海**" }
      - say: その海の底が、持ち上がって山になることがあります。山口県の秋吉台は、そうしてできた、石灰岩の台地、カルスト地形です。石灰岩は雨水にとけやすいので、地下には、鍾乳洞がつくられます。
        show:
          - { type: image, src: 1000002981.webp, at: [80, 220], w: 600 }
          - { type: text, at: [730, 260], w: 500, color: green, text: "秋吉台（山口県）＝ **カルスト地形**" }
          - { type: text, at: [730, 360], w: 500, color: blue, text: "雨水でとけて地下に **鍾乳洞**" }
      - say: 山の上で、サンゴや貝の化石が見つかることもあります。大地が、長い時間をかけて、大きく動いてきた証拠です。
        added: true
        show:
          - { type: text, at: [730, 480], w: 500, size: s, color: gray, text: "山の上で海の生き物の化石 ＝ 大地が動いた証拠" }
