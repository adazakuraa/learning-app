title: 医学とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、医学がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 医学とは
      - say: 医学では、症状ごとに「すぐ救急車か、急いで受診か、様子を見てよいか」の判断のしかたと、応急手当、予防や検査の基本を学びます。
        show:
          - type: box
            w: 1100
            text: 医学では、症状ごとに「すぐ救急車か、急いで受診か、様子を見てよいか」の判断のしかたと、応急手当、予防や検査の基本を学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で13章です。第1章は受診判断の基本、第2章は頭・神経の症状、第3章は胸・呼吸・循環の症状、第4章はおなか・消化器の症状、第5章は発熱・感染症、第6章は皮膚・アレルギー・外傷、第7章は目・耳・鼻・口の症状、第8章は泌尿器・女性・妊娠の症状、第9章は子どもの症状、第10章は高齢者の症状、第11章は心の症状、第12章は救急の応急手当、第13章は医療リテラシー：予防・検査・ワクチン。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　受診判断の基本
              - 第2章　頭・神経の症状
              - 第3章　胸・呼吸・循環の症状
              - 第4章　おなか・消化器の症状
              - 第5章　発熱・感染症
              - 第6章　皮膚・アレルギー・外傷
              - 第7章　目・耳・鼻・口の症状
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第8章　泌尿器・女性・妊娠の症状
              - 第9章　子どもの症状
              - 第10章　高齢者の症状
              - 第11章　心の症状
              - 第12章　救急の応急手当
              - 第13章　医療リテラシー：予防・検査・ワクチン
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、医学を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、いざというとき迷わない。急な体調の変化で、救急車を呼ぶべきか迷うことはよくあります。危ないサインを知っていれば、判断が早くなります。
        show:
          - type: box
            w: 1100
            text: |-
              **いざというとき迷わない**
              急な体調の変化で、救急車を呼ぶべきか迷うことはよくあります。危ないサインを知っていれば、判断が早くなります。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、家族を守れる。子どもや高齢の家族の症状、心停止のときの応急手当。知っていることで救える命があります。
        show:
          - type: box
            w: 1100
            text: |-
              **家族を守れる**
              子どもや高齢の家族の症状、心停止のときの応急手当。知っていることで救える命があります。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、医療を上手に使える。受診の目安、検診、ワクチン、医療費の制度。医療と賢く付き合う知識が身につきます。
        show:
          - type: box
            w: 1100
            text: |-
              **医療を上手に使える**
              受診の目安、検診、ワクチン、医療費の制度。医療と賢く付き合う知識が身につきます。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、自分や家族の体調が急に悪くなったとき、救急車を呼ぶか迷ったとき（#7119）、検診やワクチンを受けるか考えるとき、などに役立ちます。
        read: たとえば、自分や家族の体調が急に悪くなったとき、救急車を呼ぶか迷ったとき（シャープ、ななないちいちきゅう）、検診やワクチンを受けるか考えるとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 自分や家族の体調が急に悪くなったとき
              - 救急車を呼ぶか迷ったとき（#7119）
              - 検診やワクチンを受けるか考えるとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、各単元の「まず覚えること」を優先して覚える。そして、迷ったら急ぐ方を選ぶ、が基本。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・各単元の「**まず覚えること**」を優先して覚える
              ・迷ったら急ぐ方を選ぶ、が基本
            color: pink
            at:
              - 80
              - 420
