title: 胸の痛み
scenes:
  - board: slide
    steps:
      - say: 第3章、「胸・呼吸・循環の症状」です。
        show:
          - type: title
            text: 第3章　胸・呼吸・循環の症状
      - say: この章では、胸の痛み、動悸・脈の乱れ、息苦しさ、咳・痰、むくみと血圧を学びます。
        show:
          - type: list
            items:
              - 胸の痛み
              - 動悸・脈の乱れ
              - 息苦しさ
              - 咳・痰
              - むくみと血圧
  - board: whiteboard
    steps:
      - say: 「胸の痛み」です。心筋梗塞・大動脈解離・肺塞栓は命にかかわります。「圧迫感」「冷や汗」「突然の引き裂かれる痛み」は119
        show:
          - type: title
            text: 胸の痛み
        read: 「胸の痛み」です。心筋梗塞・大動脈解離・肺塞栓は命にかかわります。「圧迫感」「冷や汗」「突然の引き裂かれる痛み」はいちいちきゅう
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 胸がしめつけられる・押される痛みが数分以上続き、冷や汗や吐き気があればすぐ119、心筋梗塞。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **胸がしめつけられる・押される痛みが数分以上**続き、冷や汗や吐き気があれば**すぐ119**（心筋梗塞）。
        read: 胸がしめつけられる・押される痛みが数分以上続き、冷や汗や吐き気があればすぐいちいちきゅう、心筋梗塞。
      - say: 突然の、背中に抜ける引き裂かれるような痛みは大動脈解離を考えて119。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **突然の、背中に抜ける引き裂かれるような痛み**は大動脈解離を考えて119。
        read: 突然の、背中に抜ける引き裂かれるような痛みは大動脈解離を考えていちいちきゅう。
      - say: 指で押して痛い・体をひねると痛い・数秒で終わるチクッとした痛みは、筋肉や神経のことが多い。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 指で押して痛い・体をひねると痛い・数秒で終わるチクッとした痛みは、筋肉や神経のことが多い。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。胸の圧迫感・しめつけが数分以上、あご・左腕・背中に広がることも。胸痛と冷や汗、吐き気、息苦しさ、失神。突然の激しい胸や背中の痛み、引き裂かれる、移動する。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 胸の**圧迫感・しめつけ**が数分以上（あご・左腕・背中に広がることも）
              - 胸痛＋**冷や汗、吐き気、息苦しさ、失神**
              - "**突然**の激しい胸や背中の痛み（引き裂かれる、移動する）"
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。胸の圧迫感・しめつけが数分以上、あご・左腕・背中に広がることも。胸痛と冷や汗、吐き気、息苦しさ、失神。突然の激しい胸や背中の痛み、引き裂かれる、移動する。
      - say: 胸痛と急な息苦しさ、長時間座った後や、片足が腫れている。
        show:
          - type: list
            items:
              - 胸痛＋**急な息苦しさ**（長時間座った後や、片足が腫れている）
      - say: 高齢者・糖尿病・女性は、胸痛がはっきりせず「息苦しい」「だるい」「胃のあたりが変」だけのことがあります。
        show:
          - type: text
            text: "**高齢者・糖尿病・女性**は、胸痛がはっきりせず「息苦しい」「だるい」「胃のあたりが変」だけのことがあります。"
            w: 1100
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。階段や坂道で胸が苦しくなり、休むと治まる、狭心症。発熱を伴う胸痛、深呼吸で痛い。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 階段や坂道で胸が苦しくなり、休むと治まる（**狭心症**）
              - 発熱を伴う胸痛、深呼吸で痛い
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。心筋梗塞。心臓の血管が詰まる。1分でも早く治療、カテーテル。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**心筋梗塞**"
            text: 心臓の血管が詰まる。1分でも早く治療（カテーテル）
      - say: 狭心症。心臓の血管が狭い。運動で痛み、休むと治まる。心筋梗塞の前段階。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**狭心症**"
            text: 心臓の血管が狭い。運動で痛み、休むと治まる。心筋梗塞の前段階
      - say: 大動脈解離。大動脈の壁が裂ける。突然の激痛。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**大動脈解離**"
            text: 大動脈の壁が裂ける。突然の激痛
  - board: whiteboard
    steps:
      - say: 肺塞栓、エコノミークラス症候群。足の血の塊が肺に詰まる。急な息苦しさ。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**肺塞栓（エコノミークラス症候群）**"
            text: 足の血の塊が肺に詰まる。急な息苦しさ
      - say: 気胸。肺に穴があき縮む。やせた若い男性に多い。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**気胸**"
            text: 肺に穴があき縮む。やせた若い男性に多い
      - say: 肋間神経痛・筋肉痛・逆流性食道炎。危険は少ないが、自己判断せず一度は受診を。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**肋間神経痛・筋肉痛・逆流性食道炎**"
            text: 危険は少ないが、自己判断せず一度は受診を
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **胸がしめつけられる・押される痛みが数分以上**続き、冷や汗や吐き気があれば**すぐ119**（心筋梗塞）。
              - ② **突然の、背中に抜ける引き裂かれるような痛み**は大動脈解離を考えて119。
              - ③ 指で押して痛い・体をひねると痛い・数秒で終わるチクッとした痛みは、筋肉や神経のことが多い。
      - say: 胸がしめつけられる・押される痛みが数分以上続き、冷や汗や吐き気があればすぐ119、心筋梗塞。突然の、背中に抜ける引き裂かれるような痛みは大動脈解離を考えて119。指で押して痛い・体をひねると痛い・数秒で終わるチクッとした痛みは、筋肉や神経のことが多い。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 胸がしめつけられる・押される痛みが数分以上続き、冷や汗や吐き気があればすぐいちいちきゅう、心筋梗塞。突然の、背中に抜ける引き裂かれるような痛みは大動脈解離を考えていちいちきゅう。指で押して痛い・体をひねると痛い・数秒で終わるチクッとした痛みは、筋肉や神経のことが多い。迷ったときは、ためらわずに、相談や受診をしてください。
