title: 息苦しさ
scenes:
  - board: whiteboard
    steps:
      - say: 「息苦しさ」です。息苦しさは、肺・心臓・アレルギーなど命にかかわる病気のサインのことがあります
        show:
          - type: title
            text: 息苦しさ
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 話せないほど苦しい、唇が紫、ゼーゼーがひどいなら119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **話せないほど苦しい、唇が紫、ゼーゼーがひどい**なら119。
        read: 話せないほど苦しい、唇が紫、ゼーゼーがひどいならいちいちきゅう。
      - say: 横になると苦しく、座ると楽、足のむくみがあれば心不全を疑う。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **横になると苦しく、座ると楽**、足のむくみがあれば心不全を疑う。
      - say: 酸素の値、パルスオキシメーター、が93%以下なら急いで受診。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 酸素の値（パルスオキシメーター）が**93%以下**なら急いで受診。
        read: 酸素の値、パルスオキシメーター、が93パーセント以下なら急いで受診。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。息苦しくて文が言えない、肩で息をする。唇や顔が紫・青白い、冷や汗、意識がぼんやり。急な息苦しさと胸の痛み。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 息苦しくて**文が言えない**、肩で息をする
              - 唇や顔が紫・青白い、冷や汗、意識がぼんやり
              - 急な息苦しさ＋**胸の痛み**
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。息苦しくて文が言えない、肩で息をする。唇や顔が紫・青白い、冷や汗、意識がぼんやり。急な息苦しさと胸の痛み。
      - say: 食べ物の後・虫刺されの後の息苦しさ・顔の腫れ、アナフィラキシー、第6章。喉に物が詰まった、窒息、第12章。
        show:
          - type: list
            items:
              - 食べ物の後・虫刺されの後の息苦しさ・顔の腫れ（**アナフィラキシー**、第6章）
              - 喉に物が詰まった（**窒息**、第12章）
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。発熱と息苦しさ、肺炎。喘息の発作で、いつもの吸入が効かない。夜、横になると苦しくて目が覚める、心不全。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 発熱＋息苦しさ（肺炎）
              - 喘息の発作で、いつもの吸入が効かない
              - 夜、横になると苦しくて目が覚める（心不全）
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。喘息。気道が狭くなる。ゼーゼー、夜や明け方に悪化。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**喘息**"
            text: 気道が狭くなる。ゼーゼー、夜や明け方に悪化
      - say: COPD。主にたばこが原因。少しの動作で息切れ。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**COPD**"
            text: 主にたばこが原因。少しの動作で息切れ
      - say: 肺炎。発熱、咳、息苦しさ。高齢者は熱が出ないことも。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**肺炎**"
            text: 発熱、咳、息苦しさ。高齢者は熱が出ないことも
  - board: whiteboard
    steps:
      - say: 心不全。心臓のポンプが弱る。むくみ、横になると苦しい。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**心不全**"
            text: 心臓のポンプが弱る。むくみ、横になると苦しい
      - say: 過換気。不安などで呼吸が速くなる。手足のしびれ。体の病気を否定してから。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**過換気**"
            text: 不安などで呼吸が速くなる。手足のしびれ。体の病気を否定してから
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **話せないほど苦しい、唇が紫、ゼーゼーがひどい**なら119。
              - ② **横になると苦しく、座ると楽**、足のむくみがあれば心不全を疑う。
              - ③ 酸素の値（パルスオキシメーター）が**93%以下**なら急いで受診。
      - say: 話せないほど苦しい、唇が紫、ゼーゼーがひどいなら119。横になると苦しく、座ると楽、足のむくみがあれば心不全を疑う。酸素の値、パルスオキシメーター、が93%以下なら急いで受診。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 話せないほど苦しい、唇が紫、ゼーゼーがひどいならいちいちきゅう。横になると苦しく、座ると楽、足のむくみがあれば心不全を疑う。酸素の値、パルスオキシメーター、が93パーセント以下なら急いで受診。迷ったときは、ためらわずに、相談や受診をしてください。
