questions:
  - q: 胸がしめつけられる痛みが数分以上続き、冷や汗がある。まず疑うべき心臓の病気は何か。
    a: [心筋梗塞]
  - q: 脈がバラバラになり、脳梗塞の原因にもなる不整脈を何というか。
    a: [心房細動]
    r: [しんぼうさいどう]
  - q: パルスオキシメーターで測る血液中の酸素の値が、何%以下なら急いで受診すべきか。
    a: ['93', 93%]
    show: 93%
  - q: 家庭で測る血圧で、高血圧とされる目安はいくつ以上か。「（　）／85」
    a: ['135', 135/85]
    show: 135/85 mmHg
  - q: 片足だけが急に腫れて痛いとき、疑われる「エコノミークラス症候群」の原因は何か。
    a: [血栓, 血の塊]
    r: [ちのかたまり]
    show: 血栓（血の塊）
