title: 動悸・脈の乱れ
scenes:
  - board: whiteboard
    steps:
      - say: 「動悸・脈の乱れ」です。多くは心配ない動悸ですが、失神や胸痛を伴う動悸、心房細動には注意が必要です
        show:
          - type: title
            text: 動悸・脈の乱れ
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 動悸と失神・胸痛・息苦しさ・冷や汗は119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 動悸＋**失神・胸痛・息苦しさ・冷や汗**は119。
        read: 動悸と失神・胸痛・息苦しさ・冷や汗はいちいちきゅう。
      - say: 脈がバラバラなら心房細動の可能性。脳梗塞の原因になるので受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **脈がバラバラ**なら心房細動の可能性。脳梗塞の原因になるので受診。
      - say: 一瞬ドキッとする・脈が飛ぶだけで、ほかに症状がなければ多くは心配ない、期外収縮。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 一瞬ドキッとする・脈が飛ぶだけで、ほかに症状がなければ多くは心配ない（期外収縮）。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。動悸と失神、胸の痛み、息苦しさ、顔色が悪い。脈がとても速い、1分150以上、のが続く、またはとても遅い、40未満、でふらつく。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 動悸＋**失神**、**胸の痛み**、**息苦しさ**、顔色が悪い
              - 脈が**とても速い（1分150以上）**のが続く、または**とても遅い（40未満）**でふらつく
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。動悸と失神、胸の痛み、息苦しさ、顔色が悪い。脈がとても速い、1分150以上、のが続く、またはとても遅い、40未満、でふらつく。
  - board: whiteboard
    steps:
      - say: 次のようなときは、数日以内に受診しましょう。脈が不規則、リズムがバラバラ。動悸をくり返す、だんだん増えている。汗が多い・体重が減る・手がふるえる、甲状腺の病気。
        show:
          - type: title
            text: 数日以内に受診
          - type: tag
            text: 緊急度：中
            color: blue
            at:
              - 1010
              - 52
          - type: list
            items:
              - 脈が**不規則**（リズムがバラバラ）
              - 動悸をくり返す、だんだん増えている
              - 汗が多い・体重が減る・手がふるえる（**甲状腺**の病気）
  - board: whiteboard
    steps:
      - say: 次は、脈の測り方です。手首の親指側に指2本を当て、30秒数えて2倍。リズムが規則正しいかも確認します。
        show:
          - type: title
            text: 脈の測り方
          - type: text
            text: 手首の親指側に指2本を当て、**30秒数えて2倍**。リズムが**規則正しいか**も確認します。
            w: 1100
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。期外収縮。脈が一瞬飛ぶ。多くは心配ない。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**期外収縮**"
            text: 脈が一瞬飛ぶ。多くは心配ない
      - say: 心房細動。脈が不規則になる。心臓で血の塊ができ脳梗塞の原因に。高齢者に多い。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**心房細動**"
            text: 脈が不規則になる。心臓で血の塊ができ**脳梗塞**の原因に。高齢者に多い
      - say: 甲状腺機能亢進症。動悸・汗・体重減少。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**甲状腺機能亢進症**"
            text: 動悸・汗・体重減少
  - board: whiteboard
    steps:
      - say: 不安・パニック。体の病気を否定してから考える。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**不安・パニック**"
            text: 体の病気を否定してから考える
      - say: カフェイン、アルコール、睡眠不足、脱水も動悸の原因になります。
        show:
          - type: text
            text: カフェイン、アルコール、睡眠不足、脱水も動悸の原因になります。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 動悸＋**失神・胸痛・息苦しさ・冷や汗**は119。
              - ② **脈がバラバラ**なら心房細動の可能性。脳梗塞の原因になるので受診。
              - ③ 一瞬ドキッとする・脈が飛ぶだけで、ほかに症状がなければ多くは心配ない（期外収縮）。
      - say: 動悸と失神・胸痛・息苦しさ・冷や汗は119。脈がバラバラなら心房細動の可能性。脳梗塞の原因になるので受診。一瞬ドキッとする・脈が飛ぶだけで、ほかに症状がなければ多くは心配ない、期外収縮。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 動悸と失神・胸痛・息苦しさ・冷や汗はいちいちきゅう。脈がバラバラなら心房細動の可能性。脳梗塞の原因になるので受診。一瞬ドキッとする・脈が飛ぶだけで、ほかに症状がなければ多くは心配ない、期外収縮。迷ったときは、ためらわずに、相談や受診をしてください。
