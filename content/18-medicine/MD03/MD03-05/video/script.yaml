title: むくみと血圧
scenes:
  - board: whiteboard
    steps:
      - say: 「むくみと血圧」です。むくみの多くは心配ありませんが、片足だけのむくみや息苦しさを伴うむくみは要注意です。高血圧は症状がないまま進みます
        show:
          - type: title
            text: むくみと血圧
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 片足だけ急に腫れて痛い、血栓、エコノミークラス症候群、を考え受診。息苦しさがあれば119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **片足だけ**急に腫れて痛い → 血栓（エコノミークラス症候群）を考え受診。息苦しさがあれば119。
        read: 片足だけ急に腫れて痛い、血栓、エコノミークラス症候群、を考え受診。息苦しさがあればいちいちきゅう。
      - say: むくみと息苦しさ・体重の急増は心不全のことがある。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② むくみ＋**息苦しさ・体重の急増**は心不全のことがある。
      - say: 高血圧は自覚症状がない。家庭で測り、135/85以上なら受診して相談。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 高血圧は**自覚症状がない**。家庭で測り、**135/85以上**なら受診して相談。
        read: 高血圧は自覚症状がない。家庭で測り、135の85以上なら受診して相談。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。片足のむくみと急な息苦しさ・胸の痛み、肺塞栓。顔や唇の急な腫れと息苦しさ、アナフィラキシー。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 片足のむくみ＋**急な息苦しさ・胸の痛み**（肺塞栓）
              - 顔や唇の急な腫れ＋息苦しさ（アナフィラキシー）
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。片足のむくみと急な息苦しさ・胸の痛み、肺塞栓。顔や唇の急な腫れと息苦しさ、アナフィラキシー。
  - board: whiteboard
    steps:
      - say: 次のようなときは、数日以内に受診しましょう。片足だけの腫れと痛み。両足のむくみと息切れ・体重の急な増加、心不全。顔やまぶたのむくみと尿の泡・量の変化、腎臓病。
        show:
          - type: title
            text: 数日以内に受診
          - type: tag
            text: 緊急度：中
            color: blue
            at:
              - 1010
              - 52
          - type: list
            items:
              - 片足だけの腫れと痛み
              - 両足のむくみ＋息切れ・体重の急な増加（心不全）
              - 顔やまぶたのむくみ＋尿の泡・量の変化（腎臓病）
      - say: 夕方に足がむくみ、朝には治っている、ほかに症状がない、多くは心配ありません。
        show:
          - type: text
            text: 夕方に足がむくみ、朝には治っている、ほかに症状がない → 多くは心配ありません。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、血圧です。正常。115/75未満。
        show:
          - type: title
            text: 血圧
          - type: box
            color: yellow
            w: 1100
            title: 正常
            text: 115/75未満
        read: 次は、血圧です。正常。115の75未満。
      - say: 高血圧。135/85以上。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**高血圧**"
            text: "**135/85以上**"
        read: 高血圧。135の85以上。
  - board: whiteboard
    steps:
      - say: 高血圧は、脳卒中・心臓病・腎臓病の最大の原因の一つです。朝と夜に座って測り、記録して受診時に見せます。対策、減塩、運動、体重を減らす、節酒、禁煙。薬が必要なら続ける。
        show:
          - type: title
            text: 血圧（つづき）
          - type: list
            items:
              - 高血圧は、**脳卒中・心臓病・腎臓病**の最大の原因の一つです。
              - "**朝と夜**に座って測り、記録して受診時に見せます。"
              - 対策：**減塩**、運動、体重を減らす、節酒、禁煙。薬が必要なら続ける。
      - say: 血圧が180/120以上で、頭痛・胸痛・息苦しさ・まひなどがあれば119です。
        show:
          - type: text
            text: "**血圧が180/120以上**で、頭痛・胸痛・息苦しさ・まひなどがあれば119です。"
            w: 1100
        read: 血圧が180の120以上で、頭痛・胸痛・息苦しさ・まひなどがあればいちいちきゅうです。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **片足だけ**急に腫れて痛い → 血栓（エコノミークラス症候群）を考え受診。息苦しさがあれば119。
              - ② むくみ＋**息苦しさ・体重の急増**は心不全のことがある。
              - ③ 高血圧は**自覚症状がない**。家庭で測り、**135/85以上**なら受診して相談。
      - say: 片足だけ急に腫れて痛い、血栓、エコノミークラス症候群、を考え受診。息苦しさがあれば119。むくみと息苦しさ・体重の急増は心不全のことがある。高血圧は自覚症状がない。家庭で測り、135/85以上なら受診して相談。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 片足だけ急に腫れて痛い、血栓、エコノミークラス症候群、を考え受診。息苦しさがあればいちいちきゅう。むくみと息苦しさ・体重の急増は心不全のことがある。高血圧は自覚症状がない。家庭で測り、135の85以上なら受診して相談。迷ったときは、ためらわずに、相談や受診をしてください。
