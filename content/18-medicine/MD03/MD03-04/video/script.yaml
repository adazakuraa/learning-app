title: 咳・痰
scenes:
  - board: whiteboard
    steps:
      - say: 「咳・痰」です。かぜの咳は多くが自然に治ります。長引く咳と、血の混じる痰には注意します
        show:
          - type: title
            text: 咳・痰
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 咳と息苦しさ、高熱、胸の痛みなら受診、肺炎など。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 咳＋**息苦しさ、高熱、胸の痛み**なら受診（肺炎など）。
      - say: 3週間以上続く咳は、結核・喘息・肺がんなどを調べてもらう。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **3週間以上続く咳**は、結核・喘息・肺がんなどを調べてもらう。
      - say: 血を吐く・血の混じった痰は受診。量が多ければ119。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **血を吐く・血の混じった痰**は受診。量が多ければ119。
        read: 血を吐く・血の混じった痰は受診。量が多ければいちいちきゅう。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。大量の血を咳とともに吐く。息苦しさが強い、唇が紫。突然むせて咳が止まらない、異物の誤嚥。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 大量の血を咳とともに吐く
              - 息苦しさが強い、唇が紫
              - 突然むせて咳が止まらない（異物の誤嚥）
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。大量の血を咳とともに吐く。息苦しさが強い、唇が紫。突然むせて咳が止まらない、異物の誤嚥。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。高熱が続く、黄色や緑の痰が増える、息苦しい、肺炎。血の混じった痰。3週間以上続く咳、特に体重減少・寝汗があれば結核も。
        show:
          - type: title
            text: 今日中〜数日以内に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 高熱が続く、黄色や緑の痰が増える、息苦しい（肺炎）
              - 血の混じった痰
              - "**3週間以上**続く咳（特に体重減少・寝汗があれば結核も）"
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。かぜ。数日〜2週間で自然に治る。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**かぜ**"
            text: 数日〜2週間で自然に治る
        read: ここで、知っておきたい病気を、かんたんに紹介します。かぜ。数日から2週間で自然に治る。
      - say: 肺炎。発熱、息苦しさ。高齢者は重くなりやすい。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**肺炎**"
            text: 発熱、息苦しさ。高齢者は重くなりやすい
      - say: 咳喘息・喘息。夜や明け方の長引く咳。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**咳喘息・喘息**"
            text: 夜や明け方の長引く咳
  - board: whiteboard
    steps:
      - say: 百日咳。大人は長引く咳。乳児は重症になる。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**百日咳**"
            text: 大人は長引く咳。乳児は重症になる
      - say: 結核。2週間以上の咳、微熱、体重減少。今も年に約1万人が発症。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**結核**"
            text: 2週間以上の咳、微熱、体重減少。今も年に約1万人が発症
      - say: 肺がん。たばこを吸う人の長引く咳・血痰。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**肺がん**"
            text: たばこを吸う人の長引く咳・血痰
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 咳＋**息苦しさ、高熱、胸の痛み**なら受診（肺炎など）。
              - ② **3週間以上続く咳**は、結核・喘息・肺がんなどを調べてもらう。
              - ③ **血を吐く・血の混じった痰**は受診。量が多ければ119。
      - say: 咳と息苦しさ、高熱、胸の痛みなら受診、肺炎など。3週間以上続く咳は、結核・喘息・肺がんなどを調べてもらう。血を吐く・血の混じった痰は受診。量が多ければ119。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 咳と息苦しさ、高熱、胸の痛みなら受診、肺炎など。3週間以上続く咳は、結核・喘息・肺がんなどを調べてもらう。血を吐く・血の混じった痰は受診。量が多ければいちいちきゅう。迷ったときは、ためらわずに、相談や受診をしてください。
