title: 重症感染症のサイン：敗血症・髄膜炎
scenes:
  - board: whiteboard
    steps:
      - say: 「重症感染症のサイン：敗血症・髄膜炎」です。感染症が全身に広がる「敗血症」は、早く治療しないと命にかかわります
        show:
          - type: title
            text: 重症感染症のサイン：敗血症・髄膜炎
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 感染症と意識がおかしい、呼吸が速い、血圧が低い、ぐったり・冷たい手足、は敗血症を疑い119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 感染症＋**意識がおかしい、呼吸が速い、血圧が低い（ぐったり・冷たい手足）**は敗血症を疑い119。
        read: 感染症と意識がおかしい、呼吸が速い、血圧が低い、ぐったり・冷たい手足、は敗血症を疑いいちいちきゅう。
      - say: 発熱と激しい頭痛・首が硬い・意識障害は髄膜炎を疑い119。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 発熱＋**激しい頭痛・首が硬い・意識障害**は髄膜炎を疑い119。
        read: 発熱と激しい頭痛・首が硬い・意識障害は髄膜炎を疑いいちいちきゅう。
      - say: 「いつもと様子が違う」が最初のサインのことが多い。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **「いつもと様子が違う」**が最初のサインのことが多い。
  - board: whiteboard
    steps:
      - say: 次は、敗血症です。感染症によって全身の臓器がうまく働かなくなる状態です。肺炎、尿路感染症、皮膚の感染などから起こります。
        show:
          - type: title
            text: 敗血症
          - type: text
            text: "**感染症によって全身の臓器がうまく働かなくなる状態**です。肺炎、尿路感染症、皮膚の感染などから起こります。"
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、サインです。意識がぼんやり、話がおかしい。呼吸が速い、1分22回以上。手足が冷たい、皮膚がまだら、尿が少ない。
        show:
          - type: title
            text: サイン
          - type: list
            items:
              - 意識がぼんやり、話がおかしい
              - 呼吸が速い（1分22回以上）
              - 手足が冷たい、皮膚がまだら、尿が少ない
      - say: 「今までで一番つらい」と本人が言う。
        show:
          - type: list
            items:
              - 「今までで一番つらい」と本人が言う
      - say: 高齢者、乳幼児、持病のある人、抗がん剤などで免疫が弱い人は起こしやすいです。
        show:
          - type: text
            text: "**高齢者、乳幼児、持病のある人、抗がん剤などで免疫が弱い人**は起こしやすいです。"
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、髄膜炎です。脳と脊髄を包む膜の感染です。
        show:
          - type: title
            text: 髄膜炎
          - type: text
            text: 脳と脊髄を包む膜の感染です。
            w: 1100
      - say: 発熱、激しい頭痛、首が硬い、吐き気。意識障害、けいれん。押しても消えない紫の斑点、髄膜炎菌、は特に急ぐ。
        show:
          - type: list
            items:
              - 発熱、**激しい頭痛**、**首が硬い**、吐き気
              - 意識障害、けいれん
              - "**押しても消えない紫の斑点**（髄膜炎菌）は特に急ぐ"
      - say: ワクチン、ヒブ・肺炎球菌・髄膜炎菌、で予防できるものもあります。
        show:
          - type: text
            text: ワクチン（ヒブ・肺炎球菌・髄膜炎菌）で予防できるものもあります。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 感染症＋**意識がおかしい、呼吸が速い、血圧が低い（ぐったり・冷たい手足）**は敗血症を疑い119。
              - ② 発熱＋**激しい頭痛・首が硬い・意識障害**は髄膜炎を疑い119。
              - ③ **「いつもと様子が違う」**が最初のサインのことが多い。
      - say: 感染症と意識がおかしい、呼吸が速い、血圧が低い、ぐったり・冷たい手足、は敗血症を疑い119。発熱と激しい頭痛・首が硬い・意識障害は髄膜炎を疑い119。「いつもと様子が違う」が最初のサインのことが多い。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 感染症と意識がおかしい、呼吸が速い、血圧が低い、ぐったり・冷たい手足、は敗血症を疑いいちいちきゅう。発熱と激しい頭痛・首が硬い・意識障害は髄膜炎を疑いいちいちきゅう。「いつもと様子が違う」が最初のサインのことが多い。迷ったときは、ためらわずに、相談や受診をしてください。
