title: かぜ・インフルエンザ・新型コロナ
scenes:
  - board: whiteboard
    steps:
      - say: 「かぜ・インフルエンザ・新型コロナ」です。多くは自然に治りますが、重症化しやすい人と危険なサインを知っておきます
        show:
          - type: title
            text: かぜ・インフルエンザ・新型コロナ
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: かぜに抗菌薬、抗生物質、は効かない。休養・水分・睡眠が治療。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① かぜに**抗菌薬（抗生物質）は効かない**。休養・水分・睡眠が治療。
      - say: インフルエンザ・コロナは、重症化しやすい人、高齢者・持病・妊婦、は早めに受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② インフルエンザ・コロナは、**重症化しやすい人**（高齢者・持病・妊婦）は早めに受診。
      - say: 息苦しい、胸が痛い、意識がおかしい、水分がとれないなら急いで受診・119。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **息苦しい、胸が痛い、意識がおかしい、水分がとれない**なら急いで受診・119。
        read: 息苦しい、胸が痛い、意識がおかしい、水分がとれないなら急いで受診・いちいちきゅう。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。息苦しい、唇が紫、胸の痛み。意識がおかしい、けいれん、異常な行動、子どものインフルエンザ。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 息苦しい、唇が紫、胸の痛み
              - 意識がおかしい、けいれん、異常な行動（子どものインフルエンザ）
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。息苦しい、唇が紫、胸の痛み。意識がおかしい、けいれん、異常な行動、子どものインフルエンザ。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。高齢者、妊婦、心臓・肺・腎臓の病気、糖尿病、免疫の低下がある人。高熱が続いてぐったり、水分がとれない。いったん良くなったのに、また熱が上がる・咳が悪化、肺炎の合併。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 高齢者、妊婦、心臓・肺・腎臓の病気、糖尿病、免疫の低下がある人
              - 高熱が続いてぐったり、水分がとれない
              - いったん良くなったのに、また熱が上がる・咳が悪化（肺炎の合併）
  - board: whiteboard
    steps:
      - say: 次は、3つの違い（目安）です。始まり。かぜは、ゆっくり、インフルエンザは、急な高熱、新型コロナは、さまざま。
        show:
          - type: title
            text: 3つの違い（目安）
          - type: box
            color: yellow
            w: 1100
            title: 始まり
            text: かぜ：ゆっくり　インフルエンザ：**急な高熱**　新型コロナ：さまざま
      - say: 主な症状。かぜは、鼻・喉、インフルエンザは、高熱、関節痛、だるさ、新型コロナは、喉の痛み、咳、熱、味やにおいの異常。
        show:
          - type: box
            color: pink
            w: 1100
            title: 主な症状
            text: かぜ：鼻・喉　インフルエンザ：高熱、関節痛、だるさ　新型コロナ：喉の痛み、咳、熱、味やにおいの異常
      - say: 薬。かぜは、対症療法、インフルエンザは、抗ウイルス薬、早期、新型コロナは、重症化リスクのある人に抗ウイルス薬。
        show:
          - type: box
            color: blue
            w: 1100
            title: 薬
            text: かぜ：対症療法　インフルエンザ：抗ウイルス薬（早期）　新型コロナ：重症化リスクのある人に抗ウイルス薬
  - board: whiteboard
    steps:
      - say: 症状だけでは区別できません。必要なら検査を受けます。
        show:
          - type: title
            text: 3つの違い（目安）（つづき）
          - type: text
            text: 症状だけでは区別できません。必要なら検査を受けます。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、予防です。手洗い、換気、症状があるときのマスク、ワクチン、重症化を減らす、十分な睡眠。
        show:
          - type: title
            text: 予防
          - type: text
            text: 手洗い、換気、症状があるときのマスク、**ワクチン**（重症化を減らす）、十分な睡眠。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① かぜに**抗菌薬（抗生物質）は効かない**。休養・水分・睡眠が治療。
              - ② インフルエンザ・コロナは、**重症化しやすい人**（高齢者・持病・妊婦）は早めに受診。
              - ③ **息苦しい、胸が痛い、意識がおかしい、水分がとれない**なら急いで受診・119。
      - say: かぜに抗菌薬、抗生物質、は効かない。休養・水分・睡眠が治療。インフルエンザ・コロナは、重症化しやすい人、高齢者・持病・妊婦、は早めに受診。息苦しい、胸が痛い、意識がおかしい、水分がとれないなら急いで受診・119。迷ったときは、ためらわずに、相談や受診をしてください。
        read: かぜに抗菌薬、抗生物質、は効かない。休養・水分・睡眠が治療。インフルエンザ・コロナは、重症化しやすい人、高齢者・持病・妊婦、は早めに受診。息苦しい、胸が痛い、意識がおかしい、水分がとれないなら急いで受診・いちいちきゅう。迷ったときは、ためらわずに、相談や受診をしてください。
