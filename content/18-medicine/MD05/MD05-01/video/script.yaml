title: 発熱
scenes:
  - board: slide
    steps:
      - say: 第5章、「発熱・感染症」です。
        show:
          - type: title
            text: 第5章　発熱・感染症
      - say: この章では、発熱、かぜ・インフルエンザ・新型コロナ、喉の痛み、重症感染症のサイン、いろいろな感染症を学びます。
        show:
          - type: list
            items:
              - 発熱
              - かぜ・インフルエンザ・新型コロナ
              - 喉の痛み
              - 重症感染症のサイン：敗血症・髄膜炎
              - いろいろな感染症
  - board: whiteboard
    steps:
      - say: 「発熱」です。熱の高さより「全身の状態」が大切です。熱そのものは体が戦っているしるしです
        show:
          - type: title
            text: 発熱
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 熱の高さよりぐったり・意識・呼吸・水分がとれるかを見る。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 熱の高さより**ぐったり・意識・呼吸・水分がとれるか**を見る。
      - say: 発熱と意識がおかしい、首が硬い、息苦しい、皮膚にまだら・紫の斑点は119。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 発熱＋**意識がおかしい、首が硬い、息苦しい、皮膚にまだら・紫の斑点**は119。
        read: 発熱と意識がおかしい、首が硬い、息苦しい、皮膚にまだら・紫の斑点はいちいちきゅう。
      - say: 解熱剤はつらさを和らげるため。熱を下げても病気は治らない。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 解熱剤は**つらさを和らげるため**。熱を下げても病気は治らない。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。意識がぼんやり、話がおかしい、けいれん。首が硬いと激しい頭痛。息苦しい、呼吸が速い。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 意識がぼんやり、話がおかしい、けいれん
              - 首が硬い＋激しい頭痛
              - 息苦しい、呼吸が速い
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。意識がぼんやり、話がおかしい、けいれん。首が硬いと激しい頭痛。息苦しい、呼吸が速い。
      - say: 皮膚がまだら・冷たい、押しても消えない紫の斑点。生後3か月未満の38℃以上、すぐ受診。
        show:
          - type: list
            items:
              - 皮膚がまだら・冷たい、**押しても消えない紫の斑点**
              - "**生後3か月未満**の38℃以上（すぐ受診）"
        read: 皮膚がまだら・冷たい、押しても消えない紫の斑点。生後3か月未満の38度以上、すぐ受診。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。水分がとれない、尿が少ない。高齢者、持病のある人、免疫を下げる薬を使っている人。海外旅行から帰ってきた後の発熱、マラリアなど。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 水分がとれない、尿が少ない
              - 高齢者、持病のある人、免疫を下げる薬を使っている人
              - 海外旅行から帰ってきた後の発熱（マラリアなど）
      - say: 抗がん剤治療中の発熱。
        show:
          - type: list
            items:
              - 抗がん剤治療中の発熱
  - board: whiteboard
    steps:
      - say: 次のようなときは、数日以内に受診しましょう。3日以上続く発熱。原因のわからない微熱が続く、体重が減る。
        show:
          - type: title
            text: 数日以内に受診
          - type: tag
            text: 緊急度：中
            color: blue
            at:
              - 1010
              - 52
          - type: list
            items:
              - "**3日以上**続く発熱"
              - 原因のわからない微熱が続く、体重が減る
  - board: whiteboard
    steps:
      - say: 自分でできることも、覚えておきましょう。水分をこまめに。暑ければ薄着、寒気があれば温める。解熱剤はアセトアミノフェンが比較的安全。用量を守り、総合感冒薬と成分が重ならないよう注意。
        show:
          - type: title
            text: 自分でできること
          - type: list
            items:
              - "**水分**をこまめに。"
              - 暑ければ薄着、寒気があれば温める。
              - 解熱剤は**アセトアミノフェン**が比較的安全。用量を守り、総合感冒薬と成分が重ならないよう注意。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 熱の高さより**ぐったり・意識・呼吸・水分がとれるか**を見る。
              - ② 発熱＋**意識がおかしい、首が硬い、息苦しい、皮膚にまだら・紫の斑点**は119。
              - ③ 解熱剤は**つらさを和らげるため**。熱を下げても病気は治らない。
      - say: 熱の高さよりぐったり・意識・呼吸・水分がとれるかを見る。発熱と意識がおかしい、首が硬い、息苦しい、皮膚にまだら・紫の斑点は119。解熱剤はつらさを和らげるため。熱を下げても病気は治らない。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 熱の高さよりぐったり・意識・呼吸・水分がとれるかを見る。発熱と意識がおかしい、首が硬い、息苦しい、皮膚にまだら・紫の斑点はいちいちきゅう。解熱剤はつらさを和らげるため。熱を下げても病気は治らない。迷ったときは、ためらわずに、相談や受診をしてください。
