questions:
  - q: 生後何か月未満の赤ちゃんの38℃以上の発熱は、すぐ受診すべきでしょう？
    a: ['3', 3か月, 3ヶ月]
    show: 3か月未満
  - q: かぜの原因のウイルスには効かない、細菌をやっつける薬を何というでしょう？（抗生物質ともいいます）
    a: [抗菌薬, 抗生物質]
    show: 抗菌薬（抗生物質）
  - q: 感染症が全身に広がり、意識の異常や血圧の低下などを起こす危険な状態を何というでしょう？
    a: [敗血症]
  - q: 体の片側に、帯状にピリピリした痛みと水ぶくれが出る病気は何でしょう？
    a: [帯状疱疹]
