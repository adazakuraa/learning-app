title: 喉の痛み
scenes:
  - board: whiteboard
    steps:
      - say: 「喉の痛み」です。多くはかぜですが、息苦しさや飲み込めないほどの痛みは、命にかかわる病気のことがあります
        show:
          - type: title
            text: 喉の痛み
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 唾液も飲み込めない、声がこもる、息苦しいなら119、急性喉頭蓋炎など。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **唾液も飲み込めない、声がこもる、息苦しい**なら119（急性喉頭蓋炎など）。
        read: 唾液も飲み込めない、声がこもる、息苦しいならいちいちきゅう、急性喉頭蓋炎など。
      - say: 高熱と喉の強い痛みと咳がない、は溶連菌のことがあり受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 高熱＋喉の強い痛み＋咳がない、は**溶連菌**のことがあり受診。
      - say: ほとんどは数日〜1週間で自然に治る。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ ほとんどは数日〜1週間で自然に治る。
        read: ほとんどは数日から1週間で自然に治る。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。息苦しい、ヒューヒューという音。唾液も飲み込めず、よだれが出る。口が開かない、首が腫れる。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 息苦しい、ヒューヒューという音
              - 唾液も飲み込めず、よだれが出る
              - 口が開かない、首が腫れる
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。息苦しい、ヒューヒューという音。唾液も飲み込めず、よだれが出る。口が開かない、首が腫れる。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。高熱と強い喉の痛み、首のリンパ節の腫れ、溶連菌・扁桃炎。片側だけの強い痛み、口が開けにくい、扁桃周囲膿瘍。2週間以上続く喉の違和感、声のかすれ、喫煙者は喉頭がんも。
        show:
          - type: title
            text: 今日中〜数日以内に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 高熱と強い喉の痛み、首のリンパ節の腫れ（溶連菌・扁桃炎）
              - 片側だけの強い痛み、口が開けにくい（扁桃周囲膿瘍）
              - "**2週間以上**続く喉の違和感、声のかすれ（喫煙者は喉頭がんも）"
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。ウイルス性咽頭炎。かぜ。最も多い。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**ウイルス性咽頭炎**"
            text: かぜ。最も多い
      - say: 溶連菌感染症。抗菌薬で治療。子どもに多い。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**溶連菌感染症**"
            text: 抗菌薬で治療。子どもに多い
      - say: 急性喉頭蓋炎。喉の奥のふたが腫れて気道をふさぐ。急変する。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**急性喉頭蓋炎**"
            text: 喉の奥のふたが腫れて気道をふさぐ。急変する
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **唾液も飲み込めない、声がこもる、息苦しい**なら119（急性喉頭蓋炎など）。
              - ② 高熱＋喉の強い痛み＋咳がない、は**溶連菌**のことがあり受診。
              - ③ ほとんどは数日〜1週間で自然に治る。
      - say: 唾液も飲み込めない、声がこもる、息苦しいなら119、急性喉頭蓋炎など。高熱と喉の強い痛みと咳がない、は溶連菌のことがあり受診。ほとんどは数日〜1週間で自然に治る。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 唾液も飲み込めない、声がこもる、息苦しいならいちいちきゅう、急性喉頭蓋炎など。高熱と喉の強い痛みと咳がない、は溶連菌のことがあり受診。ほとんどは数日から1週間で自然に治る。迷ったときは、ためらわずに、相談や受診をしてください。
