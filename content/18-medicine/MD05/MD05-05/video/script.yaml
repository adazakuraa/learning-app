title: いろいろな感染症
scenes:
  - board: whiteboard
    steps:
      - say: 「いろいろな感染症」です。尿路感染、皮膚の感染、帯状疱疹、マダニ、海外帰り、性感染症の要点です
        show:
          - type: title
            text: いろいろな感染症
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 膀胱炎に発熱・背中の痛みが加わったら腎盂腎炎。今日中に受診。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **膀胱炎に発熱・背中の痛み**が加わったら腎盂腎炎。今日中に受診。
      - say: 体の片側に帯状のピリピリした痛みと水ぶくれは帯状疱疹。早めに受診、3日以内の治療が効果的。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **体の片側に帯状のピリピリした痛みと水ぶくれ**は帯状疱疹。早めに受診（3日以内の治療が効果的）。
      - say: 海外からの帰国後の発熱は、渡航先を伝えて受診。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 海外からの帰国後の発熱は、**渡航先を伝えて**受診。
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。膀胱炎。特徴は、排尿時の痛み、頻尿。女性に多い、目安は、数日以内。
        show:
          - type: title
            text: 主な感染症と受診の目安
          - type: box
            color: yellow
            w: 1100
            title: "**膀胱炎**"
            text: 特徴：排尿時の痛み、頻尿。女性に多い　目安：数日以内
      - say: 腎盂腎炎。特徴は、膀胱炎と発熱・背中の痛み、目安は、今日中。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**腎盂腎炎**"
            text: 特徴：膀胱炎＋発熱・背中の痛み　目安：今日中
      - say: 蜂窩織炎。特徴は、皮膚が赤く腫れ、熱を持ち広がる、目安は、今日中。急速に広がり水ぶくれ・黒くなるなら119。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**蜂窩織炎**"
            text: 特徴：皮膚が赤く腫れ、熱を持ち広がる　目安：今日中。急速に広がり水ぶくれ・黒くなるなら119
        read: 蜂窩織炎。特徴は、皮膚が赤く腫れ、熱を持ち広がる、目安は、今日中。急速に広がり水ぶくれ・黒くなるならいちいちきゅう。
  - board: whiteboard
    steps:
      - say: 帯状疱疹。特徴は、片側の帯状の痛み・発疹、目安は、早めに、3日以内。目の周りは急ぐ。
        show:
          - type: title
            text: 主な感染症と受診の目安（つづき）
          - type: box
            color: green
            w: 1100
            title: "**帯状疱疹**"
            text: 特徴：片側の帯状の痛み・発疹　目安：早めに（3日以内）。目の周りは急ぐ
      - say: マダニ媒介感染症。特徴は、山や草むらの後の発熱・発疹、目安は、受診。マダニは自分で無理に取らない。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**マダニ媒介感染症**"
            text: 特徴：山や草むらの後の発熱・発疹　目安：受診。マダニは**自分で無理に取らない**
      - say: 輸入感染症、マラリア・デング熱など。特徴は、帰国後の発熱、目安は、今日中。渡航先を伝える。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**輸入感染症（マラリア・デング熱など）**"
            text: 特徴：帰国後の発熱　目安：今日中。渡航先を伝える
  - board: whiteboard
    steps:
      - say: 性感染症、梅毒・クラミジアなど。特徴は、発疹、排尿時痛、おりもの、目安は、受診。パートナーも検査。保健所で匿名検査も。
        show:
          - type: title
            text: 主な感染症と受診の目安（つづき）
          - type: box
            color: blue
            w: 1100
            title: "**性感染症（梅毒・クラミジアなど）**"
            text: 特徴：発疹、排尿時痛、おりもの　目安：受診。パートナーも検査。保健所で匿名検査も
  - board: whiteboard
    steps:
      - say: 次は、予防です。帯状疱疹は50歳以上でワクチンがある。マダニ、長袖・長ズボン、虫よけ。性感染症、コンドーム、定期的な検査。梅毒は近年大きく増えている。
        show:
          - type: title
            text: 予防
          - type: list
            items:
              - 帯状疱疹は**50歳以上でワクチン**がある。
              - マダニ：長袖・長ズボン、虫よけ。
              - 性感染症：コンドーム、定期的な検査。**梅毒は近年大きく増えている**。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **膀胱炎に発熱・背中の痛み**が加わったら腎盂腎炎。今日中に受診。
              - ② **体の片側に帯状のピリピリした痛みと水ぶくれ**は帯状疱疹。早めに受診（3日以内の治療が効果的）。
              - ③ 海外からの帰国後の発熱は、**渡航先を伝えて**受診。
      - say: 膀胱炎に発熱・背中の痛みが加わったら腎盂腎炎。今日中に受診。体の片側に帯状のピリピリした痛みと水ぶくれは帯状疱疹。早めに受診、3日以内の治療が効果的。海外からの帰国後の発熱は、渡航先を伝えて受診。迷ったときは、ためらわずに、相談や受診をしてください。
