title: 吐血・血便・黒い便
scenes:
  - board: whiteboard
    steps:
      - say: 「吐血・血便・黒い便」です。消化管からの出血は、量が多いと命にかかわります。黒い便は胃や十二指腸からの出血のサインです
        show:
          - type: title
            text: 吐血・血便・黒い便
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 血を吐いた、真っ黒でベタベタの便、タール便、大量の血便で、ふらつきがあれば119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **血を吐いた、真っ黒でベタベタの便（タール便）、大量の血便**で、ふらつきがあれば119。
        read: 血を吐いた、真っ黒でベタベタの便、タール便、大量の血便で、ふらつきがあればいちいちきゅう。
      - say: 少量の鮮やかな血が紙につく程度は痔が多いが、自己判断せず一度は受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 少量の鮮やかな血が紙につく程度は**痔**が多いが、自己判断せず一度は受診。
      - say: 鉄剤や一部の食べ物でも便は黒くなる。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **鉄剤や一部の食べ物**でも便は黒くなる。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。血やコーヒーかすのようなものを吐いた。タール便、黒くてベタベタ、においが強い、とふらつき・冷や汗・顔色が悪い。大量の血便、立ちくらみ。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 血や**コーヒーかすのようなもの**を吐いた
              - "**タール便**（黒くてベタベタ、においが強い）＋ふらつき・冷や汗・顔色が悪い"
              - "**大量の血便**、立ちくらみ"
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。血やコーヒーかすのようなものを吐いた。タール便、黒くてベタベタ、においが強い、とふらつき・冷や汗・顔色が悪い。大量の血便、立ちくらみ。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。少量でも血便がくり返す。黒い便が出たが、元気。血便と便通の変化・体重減少。
        show:
          - type: title
            text: 今日中〜数日以内に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 少量でも血便がくり返す
              - 黒い便が出たが、元気
              - 血便＋便通の変化・体重減少
  - board: whiteboard
    steps:
      - say: 次は、出血の場所と便の色です。黒、タール便。胃・十二指腸、血が胃酸で黒くなる。
        show:
          - type: title
            text: 出血の場所と便の色
          - type: box
            color: yellow
            w: 1100
            title: "**黒（タール便）**"
            text: 胃・十二指腸（血が胃酸で黒くなる）
      - say: 赤黒い。大腸の奥。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**赤黒い**"
            text: 大腸の奥
      - say: 鮮やかな赤。肛門に近い所、痔、直腸。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**鮮やかな赤**"
            text: 肛門に近い所（痔、直腸）
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。胃潰瘍・十二指腸潰瘍。ピロリ菌、痛み止め、NSAIDs、が原因。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**胃潰瘍・十二指腸潰瘍**"
            text: ピロリ菌、痛み止め（NSAIDs）が原因
      - say: 痔。排便時の鮮血。最も多い。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**痔**"
            text: 排便時の鮮血。最も多い
      - say: 大腸憩室出血。高齢者の突然の大量血便。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**大腸憩室出血**"
            text: 高齢者の突然の大量血便
  - board: whiteboard
    steps:
      - say: 大腸がん・胃がん。少量の出血が続く、貧血。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**大腸がん・胃がん**"
            text: 少量の出血が続く、貧血
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **血を吐いた、真っ黒でベタベタの便（タール便）、大量の血便**で、ふらつきがあれば119。
              - ② 少量の鮮やかな血が紙につく程度は**痔**が多いが、自己判断せず一度は受診。
              - ③ **鉄剤や一部の食べ物**でも便は黒くなる。
      - say: 血を吐いた、真っ黒でベタベタの便、タール便、大量の血便で、ふらつきがあれば119。少量の鮮やかな血が紙につく程度は痔が多いが、自己判断せず一度は受診。鉄剤や一部の食べ物でも便は黒くなる。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 血を吐いた、真っ黒でベタベタの便、タール便、大量の血便で、ふらつきがあればいちいちきゅう。少量の鮮やかな血が紙につく程度は痔が多いが、自己判断せず一度は受診。鉄剤や一部の食べ物でも便は黒くなる。迷ったときは、ためらわずに、相談や受診をしてください。
