title: 胸やけ・飲み込みにくさ・黄疸
scenes:
  - board: whiteboard
    steps:
      - say: 「胸やけ・飲み込みにくさ・黄疸」です。逆流性食道炎はよくある病気です。飲み込みにくさと黄疸は、一度は検査が必要なサインです
        show:
          - type: title
            text: 胸やけ・飲み込みにくさ・黄疸
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 胸やけ・すっぱいものが上がるのは逆流性食道炎が多い。生活の工夫と薬で改善する。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **胸やけ・すっぱいものが上がる**のは逆流性食道炎が多い。生活の工夫と薬で改善する。
      - say: 飲み込みにくさが続く、体重が減るのは食道がんなども考え、数日以内に受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **飲み込みにくさが続く、体重が減る**のは食道がんなども考え、数日以内に受診。
      - say: 白目や皮膚が黄色い、黄疸、尿が濃い茶色、便が白っぽいときは受診。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **白目や皮膚が黄色い（黄疸）**、尿が濃い茶色、便が白っぽいときは受診。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。黄疸と発熱・右上腹部の痛み、胆管炎、急ぐなら119。食べ物が喉や胸に詰まって、唾液も飲み込めない。胸やけと思ったが冷や汗・息苦しさがある、心筋梗塞のことがある。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 黄疸＋**発熱・右上腹部の痛み**（胆管炎：急ぐなら119）
              - 食べ物が喉や胸に詰まって、唾液も飲み込めない
              - 胸やけと思ったが冷や汗・息苦しさがある（心筋梗塞のことがある）
        read: 次のようなときは、夜間や休日でも、今日中に受診しましょう。黄疸と発熱・右上腹部の痛み、胆管炎、急ぐならいちいちきゅう。食べ物が喉や胸に詰まって、唾液も飲み込めない。胸やけと思ったが冷や汗・息苦しさがある、心筋梗塞のことがある。
  - board: whiteboard
    steps:
      - say: 次のようなときは、数日以内に受診しましょう。飲み込みにくさ、つかえ感が続く、体重減少。黄疸、痛みがなくても。胸やけが市販薬で治らない、くり返す。
        show:
          - type: title
            text: 数日以内に受診
          - type: tag
            text: 緊急度：中
            color: blue
            at:
              - 1010
              - 52
          - type: list
            items:
              - 飲み込みにくさ、つかえ感が続く、体重減少
              - 黄疸（痛みがなくても）
              - 胸やけが市販薬で治らない、くり返す
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。逆流性食道炎。胃酸が食道へ逆流。食後すぐ横になる、肥満、食べ過ぎで悪化。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**逆流性食道炎**"
            text: 胃酸が食道へ逆流。食後すぐ横になる、肥満、食べ過ぎで悪化
      - say: 食道がん。飲み込みにくさ。喫煙・飲酒が危険因子。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**食道がん**"
            text: 飲み込みにくさ。喫煙・飲酒が危険因子
      - say: 肝炎・肝硬変。黄疸、だるさ。ウイルス、B型・C型、や飲酒。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**肝炎・肝硬変**"
            text: 黄疸、だるさ。ウイルス（B型・C型）や飲酒
  - board: whiteboard
    steps:
      - say: 胆石・胆管の詰まり、膵臓がん。黄疸、尿が濃い、便が白い。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**胆石・胆管の詰まり、膵臓がん**"
            text: 黄疸、尿が濃い、便が白い
  - board: whiteboard
    steps:
      - say: 次は、胸やけの対策です。食後2〜3時間は横にならない、寝るとき上半身を少し高く、食べ過ぎ・脂っこい物・飲酒を控える。
        show:
          - type: title
            text: 胸やけの対策
          - type: text
            text: 食後2〜3時間は横にならない、寝るとき上半身を少し高く、食べ過ぎ・脂っこい物・飲酒を控える。
            w: 1100
        read: 次は、胸やけの対策です。食後2から3時間は横にならない、寝るとき上半身を少し高く、食べ過ぎ・脂っこい物・飲酒を控える。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **胸やけ・すっぱいものが上がる**のは逆流性食道炎が多い。生活の工夫と薬で改善する。
              - ② **飲み込みにくさが続く、体重が減る**のは食道がんなども考え、数日以内に受診。
              - ③ **白目や皮膚が黄色い（黄疸）**、尿が濃い茶色、便が白っぽいときは受診。
      - say: 胸やけ・すっぱいものが上がるのは逆流性食道炎が多い。生活の工夫と薬で改善する。飲み込みにくさが続く、体重が減るのは食道がんなども考え、数日以内に受診。白目や皮膚が黄色い、黄疸、尿が濃い茶色、便が白っぽいときは受診。迷ったときは、ためらわずに、相談や受診をしてください。
