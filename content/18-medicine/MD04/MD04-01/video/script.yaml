title: 腹痛
scenes:
  - board: slide
    steps:
      - say: 第4章、「おなか・消化器の症状」です。
        show:
          - type: title
            text: 第4章　おなか・消化器の症状
      - say: この章では、腹痛、吐き気・嘔吐、下痢・便秘、吐血・血便・黒い便、胸やけ・飲み込みにくさ・黄疸、食中毒と脱水を学びます。
        show:
          - type: list
            items:
              - 腹痛
              - 吐き気・嘔吐
              - 下痢・便秘
              - 吐血・血便・黒い便
              - 胸やけ・飲み込みにくさ・黄疸
              - 食中毒と脱水
  - board: whiteboard
    steps:
      - say: 「腹痛」です。腹痛の原因はさまざまです。「突然の激痛」「おなかが板のように硬い」「どんどん強くなる」は急ぎます
        show:
          - type: title
            text: 腹痛
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 突然の激痛、冷や汗、おなかが硬く押すと激痛なら119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **突然の激痛、冷や汗、おなかが硬く押すと激痛**なら119。
        read: 突然の激痛、冷や汗、おなかが硬く押すと激痛ならいちいちきゅう。
      - say: 右下腹部の痛み、へその周りから移動、は虫垂炎を疑い、今日中に受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **右下腹部の痛み**（へその周りから移動）は虫垂炎を疑い、今日中に受診。
      - say: 妊娠の可能性がある人の腹痛・出血は子宮外妊娠も考えて急ぐ。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 妊娠の可能性がある人の腹痛・出血は**子宮外妊娠**も考えて急ぐ。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。突然の激しい痛み、冷や汗、顔色が悪い、ぐったり。おなかが板のように硬い、少しの振動でも響く。血を吐く、黒い便・大量の血便。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 突然の激しい痛み、冷や汗、顔色が悪い、ぐったり
              - おなかが**板のように硬い**、少しの振動でも響く
              - 血を吐く、黒い便・大量の血便
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。突然の激しい痛み、冷や汗、顔色が悪い、ぐったり。おなかが板のように硬い、少しの振動でも響く。血を吐く、黒い便・大量の血便。
      - say: 高齢者の突然の激しい腹痛、腹部の血管の病気。
        show:
          - type: list
            items:
              - 高齢者の突然の激しい腹痛（腹部の血管の病気）
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。痛みがだんだん強くなる、数時間たっても治まらない。右下腹部の痛み、歩くと響く、虫垂炎。腹痛と発熱、吐くのが止まらない、便もガスも出ない、腸閉塞。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 痛みが**だんだん強くなる**、数時間たっても治まらない
              - "**右下腹部**の痛み、歩くと響く（虫垂炎）"
              - 腹痛＋**発熱**、**吐くのが止まらない**、**便もガスも出ない**（腸閉塞）
      - say: 背中や脇腹の波のある激痛、尿管結石。
        show:
          - type: list
            items:
              - "**背中や脇腹**の波のある激痛（尿管結石）"
  - board: whiteboard
    steps:
      - say: 一方で、次のような場合は、家で様子を見てよいことが多いです。痛みが軽い、食べ過ぎや下痢に伴う、時間とともに楽になる。
        show:
          - type: title
            text: 様子見でよい目安
          - type: tag
            text: 緊急度：低
            color: green
            at:
              - 1010
              - 52
          - type: text
            text: 痛みが軽い、食べ過ぎや下痢に伴う、時間とともに楽になる。
            w: 1100
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。虫垂炎、盲腸。へその周り、右下腹部へ移る痛み。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**虫垂炎（盲腸）**"
            text: へその周り→右下腹部へ移る痛み
      - say: 胆石・胆のう炎。脂っこい食事の後の右上腹部の痛み。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**胆石・胆のう炎**"
            text: 脂っこい食事の後の右上腹部の痛み
      - say: 急性膵炎。みぞおち〜背中の激痛。飲酒・胆石が原因。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**急性膵炎**"
            text: みぞおち〜背中の激痛。飲酒・胆石が原因
        read: 急性膵炎。みぞおちから背中の激痛。飲酒・胆石が原因。
  - board: whiteboard
    steps:
      - say: 腸閉塞。便とガスが出ない、おなかが張る、吐く。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**腸閉塞**"
            text: 便とガスが出ない、おなかが張る、吐く
      - say: 胃腸炎。下痢・嘔吐を伴う。多くは数日で治る。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**胃腸炎**"
            text: 下痢・嘔吐を伴う。多くは数日で治る
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **突然の激痛、冷や汗、おなかが硬く押すと激痛**なら119。
              - ② **右下腹部の痛み**（へその周りから移動）は虫垂炎を疑い、今日中に受診。
              - ③ 妊娠の可能性がある人の腹痛・出血は**子宮外妊娠**も考えて急ぐ。
      - say: 突然の激痛、冷や汗、おなかが硬く押すと激痛なら119。右下腹部の痛み、へその周りから移動、は虫垂炎を疑い、今日中に受診。妊娠の可能性がある人の腹痛・出血は子宮外妊娠も考えて急ぐ。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 突然の激痛、冷や汗、おなかが硬く押すと激痛ならいちいちきゅう。右下腹部の痛み、へその周りから移動、は虫垂炎を疑い、今日中に受診。妊娠の可能性がある人の腹痛・出血は子宮外妊娠も考えて急ぐ。迷ったときは、ためらわずに、相談や受診をしてください。
