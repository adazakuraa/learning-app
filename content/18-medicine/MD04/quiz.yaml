questions:
  - q: へその周りから右下腹部に移っていく痛みで、疑われる病気は何でしょう？
    a: [虫垂炎, 盲腸]
    show: 虫垂炎（盲腸）
  - q: 胃や十二指腸からの出血のサインとされる、黒くてベタベタした便を何というでしょう？
    a: [タール便]
  - q: 吐き気があるとき、経口補水液はどのくらいずつ飲むのが基本でしょう？「スプーン1杯を（　）分ごと」
    a: ['5', 5分]
    show: スプーン1杯を5分ごと
  - q: 食中毒予防の3原則。「つけない・（　　）・やっつける」。（　　）に入る言葉を答えてください。
    a: [増やさない]
  - q: 生や加熱不足の鶏肉が原因になりやすい食中毒菌は何でしょう？
    a: [カンピロバクター]
