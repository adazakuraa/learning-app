title: 吐き気・嘔吐
scenes:
  - board: whiteboard
    steps:
      - say: 「吐き気・嘔吐」です。嘔吐は胃腸炎が多いですが、頭の病気や心臓、腸閉塞のサインのこともあります。脱水に注意します
        show:
          - type: title
            text: 吐き気・嘔吐
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 嘔吐と激しい頭痛・意識がおかしい、激しい腹痛、血を吐くなら119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 嘔吐＋**激しい頭痛・意識がおかしい**、**激しい腹痛**、**血を吐く**なら119。
        read: 嘔吐と激しい頭痛・意識がおかしい、激しい腹痛、血を吐くならいちいちきゅう。
      - say: 水分がとれない、尿が半日以上出ないのは脱水。今日中に受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **水分がとれない、尿が半日以上出ない**のは脱水。今日中に受診。
      - say: 少量ずつ、スプーン1杯を5分ごと、経口補水液を飲むのが基本。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 少量ずつ（**スプーン1杯を5分ごと**）経口補水液を飲むのが基本。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。嘔吐と激しい頭痛、まひ、意識がぼんやり、脳の病気。嘔吐と胸の痛み・冷や汗、心筋梗塞のことがある。血やコーヒーかすのようなものを吐く。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 嘔吐＋**激しい頭痛、まひ、意識がぼんやり**（脳の病気）
              - 嘔吐＋**胸の痛み・冷や汗**（心筋梗塞のことがある）
              - "**血**や**コーヒーかすのようなもの**を吐く"
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。嘔吐と激しい頭痛、まひ、意識がぼんやり、脳の病気。嘔吐と胸の痛み・冷や汗、心筋梗塞のことがある。血やコーヒーかすのようなものを吐く。
      - say: 激しい腹痛、おなかが張って便もガスも出ない。
        show:
          - type: list
            items:
              - 激しい腹痛、おなかが張って便もガスも出ない
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。水分がとれない、尿が少ない、ぐったり、脱水。頭を打った後に吐く。緑色、胆汁、のものを吐く。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 水分がとれない、尿が少ない、ぐったり（脱水）
              - 頭を打った後に吐く
              - 緑色（胆汁）のものを吐く
      - say: 妊娠中で何も食べられず体重が減る。
        show:
          - type: list
            items:
              - 妊娠中で何も食べられず体重が減る
  - board: whiteboard
    steps:
      - say: 自分でできることも、覚えておきましょう。吐いてから30分〜1時間は胃を休める。経口補水液を少量ずつ。飲めたら量を増やす。吐いたものの処理は、手袋・マスクをし、塩素系漂白剤で消毒、ノロウイルスはアルコールが効きにくい。
        show:
          - type: title
            text: 自分でできること
          - type: list
            items:
              - 吐いてから**30分〜1時間**は胃を休める。
              - "**経口補水液**を少量ずつ。飲めたら量を増やす。"
              - 吐いたものの処理は、手袋・マスクをし、**塩素系漂白剤**で消毒（ノロウイルスはアルコールが効きにくい）。
        read: 自分でできることも、覚えておきましょう。吐いてから30分から1時間は胃を休める。経口補水液を少量ずつ。飲めたら量を増やす。吐いたものの処理は、手袋・マスクをし、塩素系漂白剤で消毒、ノロウイルスはアルコールが効きにくい。
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。ウイルス性胃腸炎、ノロ・ロタ。嘔吐・下痢。1〜3日で治ることが多い。強い感染力。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**ウイルス性胃腸炎（ノロ・ロタ）**"
            text: 嘔吐・下痢。1〜3日で治ることが多い。強い感染力
        read: ここで、知っておきたい病気を、かんたんに紹介します。ウイルス性胃腸炎、ノロ・ロタ。嘔吐・下痢。1から3日で治ることが多い。強い感染力。
      - say: 食中毒。同じ物を食べた人が同時に発症、本章の6。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**食中毒**"
            text: 同じ物を食べた人が同時に発症（本章の6）
      - say: 腸閉塞。吐く、おなかが張る、便が出ない。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**腸閉塞**"
            text: 吐く、おなかが張る、便が出ない
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 嘔吐＋**激しい頭痛・意識がおかしい**、**激しい腹痛**、**血を吐く**なら119。
              - ② **水分がとれない、尿が半日以上出ない**のは脱水。今日中に受診。
              - ③ 少量ずつ（**スプーン1杯を5分ごと**）経口補水液を飲むのが基本。
      - say: 嘔吐と激しい頭痛・意識がおかしい、激しい腹痛、血を吐くなら119。水分がとれない、尿が半日以上出ないのは脱水。今日中に受診。少量ずつ、スプーン1杯を5分ごと、経口補水液を飲むのが基本。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 嘔吐と激しい頭痛・意識がおかしい、激しい腹痛、血を吐くならいちいちきゅう。水分がとれない、尿が半日以上出ないのは脱水。今日中に受診。少量ずつ、スプーン1杯を5分ごと、経口補水液を飲むのが基本。迷ったときは、ためらわずに、相談や受診をしてください。
