title: 下痢・便秘
scenes:
  - board: whiteboard
    steps:
      - say: 「下痢・便秘」です。多くは自然に治りますが、血便・脱水・長く続く変化は受診が必要です
        show:
          - type: title
            text: 下痢・便秘
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 下痢で脱水、尿が少ない・ぐったり、血便、高熱があれば受診。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 下痢で**脱水（尿が少ない・ぐったり）**、**血便**、**高熱**があれば受診。
      - say: 便通の変化が数週間続く、便が細くなった、体重が減る、大腸がんも考えて受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **便通の変化が数週間続く**、便が細くなった、体重が減る → 大腸がんも考えて受診。
      - say: 下痢のときは下痢止めより水分。発熱・血便があるときは自己判断で下痢止めを使わない。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 下痢のときは**下痢止めより水分**。発熱・血便があるときは自己判断で下痢止めを使わない。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。下痢と高熱、血便、強い腹痛。水分がとれない、尿が少ない、ぐったり。高齢者・乳幼児で回数が多い。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 下痢＋**高熱**、**血便**、強い腹痛
              - 水分がとれない、尿が少ない、ぐったり
              - 高齢者・乳幼児で回数が多い
      - say: 便秘とおなかが張って吐く、ガスも出ない、腸閉塞、急ぐなら119。
        show:
          - type: list
            items:
              - 便秘＋**おなかが張って吐く、ガスも出ない**（腸閉塞、急ぐなら119）
        read: 便秘とおなかが張って吐く、ガスも出ない、腸閉塞、急ぐならいちいちきゅう。
  - board: whiteboard
    steps:
      - say: 次のようなときは、数日以内に受診しましょう。下痢が1週間以上続く。便秘と下痢をくり返す、便が細くなった、体重が減った。50歳以上で便通が急に変わった。
        show:
          - type: title
            text: 数日以内に受診
          - type: tag
            text: 緊急度：中
            color: blue
            at:
              - 1010
              - 52
          - type: list
            items:
              - 下痢が**1週間以上**続く
              - 便秘と下痢をくり返す、便が細くなった、体重が減った
              - 50歳以上で便通が急に変わった
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。感染性胃腸炎。ウイルスや細菌。多くは数日で治る。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**感染性胃腸炎**"
            text: ウイルスや細菌。多くは数日で治る
      - say: 過敏性腸症候群。ストレスで腹痛と下痢・便秘。検査で異常はない。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**過敏性腸症候群**"
            text: ストレスで腹痛と下痢・便秘。検査で異常はない
      - say: 潰瘍性大腸炎・クローン病。長引く下痢・血便。若い人にも。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**潰瘍性大腸炎・クローン病**"
            text: 長引く下痢・血便。若い人にも
  - board: whiteboard
    steps:
      - say: 大腸がん。便通の変化・血便。便潜血検査、40歳以上、毎年、で早期発見。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**大腸がん**"
            text: 便通の変化・血便。**便潜血検査（40歳以上、毎年）**で早期発見
  - board: whiteboard
    steps:
      - say: 次は、便秘の対策です。水分・食物繊維・運動。数日出なくても苦しくなければ問題ないことも多いです。市販の刺激性下剤を長く使い続けるより、受診して相談を。
        show:
          - type: title
            text: 便秘の対策
          - type: text
            text: 水分・食物繊維・運動。数日出なくても苦しくなければ問題ないことも多いです。市販の刺激性下剤を長く使い続けるより、受診して相談を。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 下痢で**脱水（尿が少ない・ぐったり）**、**血便**、**高熱**があれば受診。
              - ② **便通の変化が数週間続く**、便が細くなった、体重が減る → 大腸がんも考えて受診。
              - ③ 下痢のときは**下痢止めより水分**。発熱・血便があるときは自己判断で下痢止めを使わない。
      - say: 下痢で脱水、尿が少ない・ぐったり、血便、高熱があれば受診。便通の変化が数週間続く、便が細くなった、体重が減る、大腸がんも考えて受診。下痢のときは下痢止めより水分。発熱・血便があるときは自己判断で下痢止めを使わない。迷ったときは、ためらわずに、相談や受診をしてください。
