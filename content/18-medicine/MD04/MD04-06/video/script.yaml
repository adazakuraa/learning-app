title: 食中毒と脱水
scenes:
  - board: whiteboard
    steps:
      - say: 「食中毒と脱水」です。食中毒の予防の3原則と、下痢・嘔吐のときの脱水の見分け方を学びます
        show:
          - type: title
            text: 食中毒と脱水
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 予防は「つけない・増やさない・やっつける」、洗う・冷やす・加熱する。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 予防は**「つけない・増やさない・やっつける」**（洗う・冷やす・加熱する）。
      - say: 脱水のサインは尿が少ない・口が乾く・ぐったり。少量ずつ経口補水液。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 脱水のサインは**尿が少ない・口が乾く・ぐったり**。少量ずつ**経口補水液**。
      - say: 血便、高熱、ぐったり、水分がとれない、乳幼児・高齢者は受診。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **血便、高熱、ぐったり、水分がとれない**、乳幼児・高齢者は受診。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。ぐったりして意識がぼんやり、水分がまったくとれない。食後にものが二重に見える、まぶたが下がる、飲み込めない、ボツリヌス。魚介類、フグ・貝、の後のしびれ。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - ぐったりして意識がぼんやり、水分がまったくとれない
              - 食後に**ものが二重に見える、まぶたが下がる、飲み込めない**（ボツリヌス）
              - 魚介類（フグ・貝）の後の**しびれ**
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。ぐったりして意識がぼんやり、水分がまったくとれない。食後にものが二重に見える、まぶたが下がる、飲み込めない、ボツリヌス。魚介類、フグ・貝、の後のしびれ。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。血便、高熱、強い腹痛。尿が半日以上出ない、乳幼児は6時間以上。下痢の後に尿が減る・顔色が悪い・むくむ、O157の合併症、溶血性尿毒症症候群。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 血便、高熱、強い腹痛
              - 尿が半日以上出ない（乳幼児は6時間以上）
              - 下痢の後に**尿が減る・顔色が悪い・むくむ**（O157の合併症：溶血性尿毒症症候群）
  - board: whiteboard
    steps:
      - say: 次は、よくある原因です。カンピロバクター。生や加熱不足の鶏肉。
        show:
          - type: title
            text: よくある原因
          - type: box
            color: yellow
            w: 1100
            title: "**カンピロバクター**"
            text: 生や加熱不足の**鶏肉**
      - say: ノロウイルス。二枚貝、人の手を介した食品。冬に多い。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**ノロウイルス**"
            text: 二枚貝、人の手を介した食品。冬に多い
      - say: 腸管出血性大腸菌、O157など。加熱不足の牛肉。血便。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**腸管出血性大腸菌（O157など）**"
            text: 加熱不足の牛肉。血便
  - board: whiteboard
    steps:
      - say: アニサキス。生の魚介。食後数時間の激しい胃痛。
        show:
          - type: title
            text: よくある原因（つづき）
          - type: box
            color: green
            w: 1100
            title: "**アニサキス**"
            text: 生の魚介。食後数時間の激しい胃痛
  - board: whiteboard
    steps:
      - say: 次は、脱水への対応です。経口補水液、OS-1など、を少量ずつ頻回に。スポーツドリンクは糖分が多く塩分が少なめ。お茶・水だけでは塩分が補えません。
        show:
          - type: title
            text: 脱水への対応
          - type: text
            text: "**経口補水液**（OS-1など）を少量ずつ頻回に。スポーツドリンクは糖分が多く塩分が少なめ。お茶・水だけでは塩分が補えません。"
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 予防は**「つけない・増やさない・やっつける」**（洗う・冷やす・加熱する）。
              - ② 脱水のサインは**尿が少ない・口が乾く・ぐったり**。少量ずつ**経口補水液**。
              - ③ **血便、高熱、ぐったり、水分がとれない**、乳幼児・高齢者は受診。
      - say: 予防は「つけない・増やさない・やっつける」、洗う・冷やす・加熱する。脱水のサインは尿が少ない・口が乾く・ぐったり。少量ずつ経口補水液。血便、高熱、ぐったり、水分がとれない、乳幼児・高齢者は受診。迷ったときは、ためらわずに、相談や受診をしてください。
