title: 中毒・薬の飲みすぎ・お酒
scenes:
  - board: whiteboard
    steps:
      - say: 「中毒・薬の飲みすぎ・お酒」です。薬の飲みすぎ、一酸化炭素、急性アルコール中毒への対応を学びます
        show:
          - type: title
            text: 中毒・薬の飲みすぎ・お酒
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 何かを飲み込んだら、無理に吐かせず、容器を持って受診か中毒110番に相談。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 何かを飲み込んだら、**無理に吐かせず**、容器を持って受診か**中毒110番**に相談。
        read: 何かを飲み込んだら、無理に吐かせず、容器を持って受診か中毒ひゃくとおばんに相談。
      - say: 頭痛・吐き気・ぼんやりが複数の人に同時に起きたら一酸化炭素中毒。すぐ換気して屋外へ、119。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **頭痛・吐き気・ぼんやりが複数の人に同時に**起きたら一酸化炭素中毒。すぐ換気して屋外へ、119。
        read: 頭痛・吐き気・ぼんやりが複数の人に同時に起きたら一酸化炭素中毒。すぐ換気して屋外へ、いちいちきゅう。
      - say: 酔いつぶれた人はひとりにせず横向きに。呼びかけに反応しない・呼吸がおかしいなら119。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 酔いつぶれた人は**ひとりにせず横向き**に。呼びかけに反応しない・呼吸がおかしいなら119。
        read: 酔いつぶれた人はひとりにせず横向きに。呼びかけに反応しない・呼吸がおかしいならいちいちきゅう。
  - board: whiteboard
    steps:
      - say: 次は、薬の飲みすぎです。アセトアミノフェンの大量服用は、数日後に肝臓が壊れることがある。症状がなくても受診、解毒薬がある。何を・どれだけ・いつ飲んだかを伝える。「死にたい」気持ちからの服用は、体の治療の後に心のケアも、第11章。
        show:
          - type: title
            text: 薬の飲みすぎ
          - type: list
            items:
              - "**アセトアミノフェン**の大量服用は、数日後に肝臓が壊れることがある。**症状がなくても受診**（解毒薬がある）。"
              - 何を・どれだけ・いつ飲んだかを伝える。
              - 「死にたい」気持ちからの服用は、体の治療の後に心のケアも（第11章）。
  - board: whiteboard
    steps:
      - say: 次は、一酸化炭素中毒です。ストーブ、車の排気、室内での炭火。色もにおいもない。頭痛・吐き気・眠気が、かぜと間違えやすい。窓を開けて屋外へ、119。予防は換気と警報器。
        show:
          - type: title
            text: 一酸化炭素中毒
          - type: list
            items:
              - ストーブ、車の排気、**室内での炭火**。色もにおいもない。
              - 頭痛・吐き気・眠気が、かぜと間違えやすい。
              - "**窓を開けて屋外へ**、119。予防は換気と警報器。"
        read: 次は、一酸化炭素中毒です。ストーブ、車の排気、室内での炭火。色もにおいもない。頭痛・吐き気・眠気が、かぜと間違えやすい。窓を開けて屋外へ、いちいちきゅう。予防は換気と警報器。
  - board: whiteboard
    steps:
      - say: 次は、急性アルコール中毒です。一人にしない、横向き、吐いた物で窒息しない、体を冷やさない。呼びかけに反応しない、呼吸がゆっくり・おかしい、体が冷たい、119。水を大量に飲ませる、冷水をかけるのは逆効果。
        show:
          - type: title
            text: 急性アルコール中毒
          - type: list
            items:
              - 一人にしない、**横向き**（吐いた物で窒息しない）、体を冷やさない。
              - 呼びかけに反応しない、呼吸がゆっくり・おかしい、体が冷たい → **119**。
              - 水を大量に飲ませる、冷水をかけるのは逆効果。
        read: 次は、急性アルコール中毒です。一人にしない、横向き、吐いた物で窒息しない、体を冷やさない。呼びかけに反応しない、呼吸がゆっくり・おかしい、体が冷たい、いちいちきゅう。水を大量に飲ませる、冷水をかけるのは逆効果。
  - board: whiteboard
    steps:
      - say: 次は、洗剤を混ぜないです。「まぜるな危険」の洗剤を混ぜると塩素ガスが出ます。吸ってしまったら換気し、気分が悪ければ受診。
        show:
          - type: title
            text: 洗剤を混ぜない
          - type: text
            text: 「まぜるな危険」の洗剤を混ぜると**塩素ガス**が出ます。吸ってしまったら換気し、気分が悪ければ受診。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 何かを飲み込んだら、**無理に吐かせず**、容器を持って受診か**中毒110番**に相談。
              - ② **頭痛・吐き気・ぼんやりが複数の人に同時に**起きたら一酸化炭素中毒。すぐ換気して屋外へ、119。
              - ③ 酔いつぶれた人は**ひとりにせず横向き**に。呼びかけに反応しない・呼吸がおかしいなら119。
      - say: 何かを飲み込んだら、無理に吐かせず、容器を持って受診か中毒110番に相談。頭痛・吐き気・ぼんやりが複数の人に同時に起きたら一酸化炭素中毒。すぐ換気して屋外へ、119。酔いつぶれた人はひとりにせず横向きに。呼びかけに反応しない・呼吸がおかしいなら119。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 何かを飲み込んだら、無理に吐かせず、容器を持って受診か中毒ひゃくとおばんに相談。頭痛・吐き気・ぼんやりが複数の人に同時に起きたら一酸化炭素中毒。すぐ換気して屋外へ、いちいちきゅう。酔いつぶれた人はひとりにせず横向きに。呼びかけに反応しない・呼吸がおかしいならいちいちきゅう。迷ったときは、ためらわずに、相談や受診をしてください。
