title: 窒息・溺水・熱中症
scenes:
  - board: whiteboard
    steps:
      - say: 「窒息・溺水・熱中症」です。窒息の解除、溺れた人への対応、熱中症の冷やし方を学びます
        show:
          - type: title
            text: 窒息・溺水・熱中症
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 窒息で声も咳も出ないなら、119と、背中を強く叩く・おなかを突き上げる。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 窒息で**声も咳も出ない**なら、**119**と、**背中を強く叩く・おなかを突き上げる**。
        read: 窒息で声も咳も出ないなら、いちいちきゅうと、背中を強く叩く・おなかを突き上げる。
      - say: 溺れた人は水から上げて、呼吸がなければ心肺蘇生。回復しても必ず受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 溺れた人は水から上げて、**呼吸がなければ心肺蘇生**。回復しても必ず受診。
      - say: 熱中症は涼しい所へ・首、わきの下、足の付け根を冷やす・水分と塩分。意識がおかしい、自分で飲めないなら119。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 熱中症は**涼しい所へ・首、わきの下、足の付け根を冷やす・水分と塩分**。**意識がおかしい、自分で飲めない**なら119。
        read: 熱中症は涼しい所へ・首、わきの下、足の付け根を冷やす・水分と塩分。意識がおかしい、自分で飲めないならいちいちきゅう。
  - board: whiteboard
    steps:
      - say: 次は、窒息です。サイン、喉をつかむ、声が出ない、顔色が悪くなる。咳ができるなら、咳を続けさせる。できなければ、背中、肩甲骨の間、を強く叩く、後ろから抱えてみぞおちの下を突き上げる、腹部突き上げ。
        show:
          - type: title
            text: 窒息
          - type: list
            items:
              - サイン：喉をつかむ、声が出ない、顔色が悪くなる
              - 咳ができるなら、咳を続けさせる
              - できなければ：**背中（肩甲骨の間）を強く叩く**、**後ろから抱えてみぞおちの下を突き上げる**（腹部突き上げ）
      - say: 乳児は、うつぶせで背中を叩く・仰向けで胸を押す。反応がなくなったら心肺蘇生。
        show:
          - type: list
            items:
              - 乳児は、うつぶせで背中を叩く・仰向けで胸を押す
              - 反応がなくなったら**心肺蘇生**
  - board: whiteboard
    steps:
      - say: 次は、溺水です。自分が溺れないよう、浮く物を投げる。引き上げたら呼吸を確認し、なければ心肺蘇生、人工呼吸ができればより良い。
        show:
          - type: title
            text: 溺水
          - type: text
            text: 自分が溺れないよう、浮く物を投げる。引き上げたら呼吸を確認し、なければ心肺蘇生（人工呼吸ができればより良い）。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、熱中症です。軽い。症状は、めまい、こむら返り、大量の汗、対応は、涼しい所で休む、水分と塩分。
        show:
          - type: title
            text: 熱中症
          - type: box
            color: yellow
            w: 1100
            title: 軽い
            text: 症状：めまい、こむら返り、大量の汗　対応：涼しい所で休む、水分と塩分
      - say: 中くらい。症状は、頭痛、吐き気、だるい、対応は、受診。
        show:
          - type: box
            color: pink
            w: 1100
            title: 中くらい
            text: 症状：頭痛、吐き気、だるい　対応：受診
      - say: 重い。症状は、意識がおかしい、けいれん、体がとても熱い、自分で飲めない、対応は、119、全身を冷やしながら待つ。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**重い**"
            text: 症状：**意識がおかしい、けいれん、体がとても熱い、自分で飲めない**　対応：**119**、全身を冷やしながら待つ
        read: 重い。症状は、意識がおかしい、けいれん、体がとても熱い、自分で飲めない、対応は、いちいちきゅう、全身を冷やしながら待つ。
  - board: whiteboard
    steps:
      - say: 予防、のどが渇く前に水分、暑い日はエアコン、車内に子どもを残さない。
        show:
          - type: title
            text: 熱中症（つづき）
          - type: text
            text: 予防：のどが渇く前に水分、暑い日はエアコン、**車内に子どもを残さない**。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 窒息で**声も咳も出ない**なら、**119**と、**背中を強く叩く・おなかを突き上げる**。
              - ② 溺れた人は水から上げて、**呼吸がなければ心肺蘇生**。回復しても必ず受診。
              - ③ 熱中症は**涼しい所へ・首、わきの下、足の付け根を冷やす・水分と塩分**。**意識がおかしい、自分で飲めない**なら119。
      - say: 窒息で声も咳も出ないなら、119と、背中を強く叩く・おなかを突き上げる。溺れた人は水から上げて、呼吸がなければ心肺蘇生。回復しても必ず受診。熱中症は涼しい所へ・首、わきの下、足の付け根を冷やす・水分と塩分。意識がおかしい、自分で飲めないなら119。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 窒息で声も咳も出ないなら、いちいちきゅうと、背中を強く叩く・おなかを突き上げる。溺れた人は水から上げて、呼吸がなければ心肺蘇生。回復しても必ず受診。熱中症は涼しい所へ・首、わきの下、足の付け根を冷やす・水分と塩分。意識がおかしい、自分で飲めないならいちいちきゅう。迷ったときは、ためらわずに、相談や受診をしてください。
