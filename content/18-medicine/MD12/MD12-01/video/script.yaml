title: 心肺蘇生とAED
scenes:
  - board: slide
    steps:
      - say: 第12章、「救急の応急手当」です。
        show:
          - type: title
            text: 第12章　救急の応急手当
      - say: この章では、心肺蘇生とAED、窒息・溺水・熱中症、中毒・薬の飲みすぎ・お酒を学びます。
        show:
          - type: list
            items:
              - 心肺蘇生とAED
              - 窒息・溺水・熱中症
              - 中毒・薬の飲みすぎ・お酒
        read: この章では、心肺蘇生とエーイーディー、窒息・溺水・熱中症、中毒・薬の飲みすぎ・お酒を学びます。
  - board: whiteboard
    steps:
      - say: 「心肺蘇生とAED」です。倒れた人を見たら「119・AED・胸骨圧迫」。そばにいる人の行動が命を救います
        show:
          - type: title
            text: 心肺蘇生とAED
        read: 「心肺蘇生とエーイーディー」です。倒れた人を見たら「いちいちきゅう・エーイーディー・胸骨圧迫」。そばにいる人の行動が命を救います
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 反応がなく普段どおりの呼吸がない、または迷う、なら、119・AEDを頼み、すぐ胸骨圧迫。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 反応がなく**普段どおりの呼吸がない**（または迷う）なら、**119・AEDを頼み、すぐ胸骨圧迫**。
        read: 反応がなく普段どおりの呼吸がない、または迷う、なら、いちいちきゅう・エーイーディーを頼み、すぐ胸骨圧迫。
      - say: 胸骨圧迫は胸の真ん中を、5cm沈むように、1分間に100〜120回。人工呼吸は自信がなければ省いてよい。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 胸骨圧迫は**胸の真ん中を、5cm沈むように、1分間に100〜120回**。人工呼吸は自信がなければ省いてよい。
        read: 胸骨圧迫は胸の真ん中を、5センチ沈むように、1分間に100から120回。人工呼吸は自信がなければ省いてよい。
      - say: AEDは音声に従うだけ。必要なときしか電気ショックは流れないので、ためらわず使う。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ AEDは**音声に従うだけ**。必要なときしか電気ショックは流れないので、ためらわず使う。
        read: エーイーディーは音声に従うだけ。必要なときしか電気ショックは流れないので、ためらわず使う。
  - board: whiteboard
    steps:
      - say: 次は、手順です。周りの安全を確認。肩を叩いて大声で呼びかける。反応がなければ「119番とAEDをお願いします」と周りに頼む。
        show:
          - type: title
            text: 手順
          - type: list
            items:
              - 周りの安全を確認
              - 肩を叩いて大声で呼びかける
              - 反応がなければ「**119番とAEDをお願いします**」と周りに頼む
        read: 次は、手順です。周りの安全を確認。肩を叩いて大声で呼びかける。反応がなければ「いちいちきゅう番とエーイーディーをお願いします」と周りに頼む。
      - say: 呼吸を10秒以内で見る、胸とおなかが動いているか。普段どおりの呼吸がない・わからない、胸骨圧迫を始める。AEDが来たら電源を入れ、音声に従う。
        show:
          - type: list
            items:
