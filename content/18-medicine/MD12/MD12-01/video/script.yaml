  - board: whiteboard
    steps:
      - say: 救急隊が来るまで続ける。
        show:
          - type: title
            text: 手順（つづき）
          - type: list
            items:
              - 救急隊が来るまで続ける
  - board: whiteboard
    steps:
      - say: 次は、胸骨圧迫のポイントです。場所、胸の真ん中、胸骨の下半分。深さ、約5cm。テンポ、1分間に100〜120回、「アンパンマンのマーチ」くらい。
        show:
          - type: title
            text: 胸骨圧迫のポイント
          - type: list
            items:
              - 場所：**胸の真ん中**（胸骨の下半分）
              - 深さ：**約5cm**
              - テンポ：**1分間に100〜120回**（「アンパンマンのマーチ」くらい）
        read: 次は、胸骨圧迫のポイントです。場所、胸の真ん中、胸骨の下半分。深さ、約5センチ。テンポ、1分間に100から120回、「アンパンマンのマーチ」くらい。
      - say: 押したら胸を元に戻す。中断は最小限に。疲れたら交代。
        show:
          - type: list
            items:
              - 押したら**胸を元に戻す**。中断は最小限に。疲れたら交代
      - say: しゃくりあげるような呼吸、死戦期呼吸、は「呼吸なし」と考えます。
