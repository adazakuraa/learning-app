title: じんま疹とアナフィラキシー
scenes:
  - board: whiteboard
    steps:
      - say: 「じんま疹とアナフィラキシー」です。アナフィラキシーは数分〜数十分で命にかかわります。エピペンは「迷ったら使う」
        show:
          - type: title
            text: じんま疹とアナフィラキシー
        read: 「じんま疹とアナフィラキシー」です。アナフィラキシーは数分から数十分で命にかかわります。エピペンは「迷ったら使う」
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: アレルギーの原因に触れた後、皮膚の症状と息苦しさ・ふらつき・腹痛や嘔吐が出たらアナフィラキシー。すぐ119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① アレルギーの原因に触れた後、**皮膚の症状＋息苦しさ・ふらつき・腹痛や嘔吐**が出たらアナフィラキシー。**すぐ119**。
        read: アレルギーの原因に触れた後、皮膚の症状と息苦しさ・ふらつき・腹痛や嘔吐が出たらアナフィラキシー。すぐいちいちきゅう。
      - say: エピペン、アドレナリン自己注射、を持っていれば迷わず太ももに打つ。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **エピペン（アドレナリン自己注射）**を持っていれば**迷わず太ももに打つ**。
      - say: 急に立たせない。ふらつけば仰向けで足を高く、息苦しければ座らせる。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **急に立たせない**。ふらつけば仰向けで足を高く、息苦しければ座らせる。
  - board: whiteboard
    steps:
      - say: 次は、じんま疹だけのときです。赤く盛り上がったかゆい発疹が、数時間以内に消えては出る。呼吸や意識に問題がなければ、抗ヒスタミン薬で様子を見てよいことが多い。ただし食べ物・薬・ハチの直後なら、悪化しないか30分〜1時間は注意して見る。
        show:
          - type: title
            text: じんま疹だけのとき
          - type: list
            items:
              - 赤く盛り上がったかゆい発疹が、数時間以内に消えては出る。
              - 呼吸や意識に問題がなければ、抗ヒスタミン薬で様子を見てよいことが多い。
              - ただし**食べ物・薬・ハチの直後**なら、悪化しないか30分〜1時間は注意して見る。
        read: 次は、じんま疹だけのときです。赤く盛り上がったかゆい発疹が、数時間以内に消えては出る。呼吸や意識に問題がなければ、抗ヒスタミン薬で様子を見てよいことが多い。ただし食べ物・薬・ハチの直後なら、悪化しないか30分から1時間は注意して見る。
  - board: whiteboard
    steps:
      - say: 次は、アナフィラキシーのサインです。皮膚、全身のじんま疹、顔や唇の腫れ。呼吸、咳、ゼーゼー、喉のしめつけ、声のかすれ。循環、ふらつき、冷や汗、意識がぼんやり。
        show:
          - type: title
            text: アナフィラキシーのサイン
          - type: list
            items:
              - 皮膚：全身のじんま疹、顔や唇の腫れ
              - 呼吸：咳、ゼーゼー、喉のしめつけ、声のかすれ
              - 循環：ふらつき、冷や汗、意識がぼんやり
      - say: おなか、腹痛、嘔吐。
        show:
          - type: list
            items:
              - おなか：腹痛、嘔吐
  - board: whiteboard
    steps:
      - say: 次は、することです。119。エピペンがあれば太ももの外側に打つ、服の上からでよい。姿勢、ふらつく、仰向けで足を上げる、息苦しい、座る、吐く、横向き。
        show:
          - type: title
            text: すること
          - type: list
            items:
              - "**119**"
              - エピペンがあれば**太ももの外側に打つ**（服の上からでよい）
              - 姿勢：ふらつく→**仰向けで足を上げる**／息苦しい→**座る**／吐く→**横向き**
        read: 次は、することです。いちいちきゅう。エピペンがあれば太ももの外側に打つ、服の上からでよい。姿勢、ふらつく、仰向けで足を上げる、息苦しい、座る、吐く、横向き。
      - say: 呼吸がなければ心肺蘇生、第12章。
        show:
          - type: list
            items:
              - 呼吸がなければ心肺蘇生（第12章）
      - say: エピペンの効果は15分ほどで切れ、症状がぶり返すことがあるので、使った後も必ず病院へ。
        show:
          - type: text
            text: エピペンの効果は**15分ほど**で切れ、症状がぶり返すことがあるので、使った後も必ず病院へ。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、よくある原因です。食物、小麦、卵、乳、そば、ピーナッツ、エビ・カニなど、ハチ、薬。原因がわかったら避け、医師に相談してエピペンを持つ。
        show:
          - type: title
            text: よくある原因
          - type: text
            text: 食物（小麦、卵、乳、そば、ピーナッツ、エビ・カニなど）、**ハチ**、**薬**。原因がわかったら避け、医師に相談してエピペンを持つ。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① アレルギーの原因に触れた後、**皮膚の症状＋息苦しさ・ふらつき・腹痛や嘔吐**が出たらアナフィラキシー。**すぐ119**。
              - ② **エピペン（アドレナリン自己注射）**を持っていれば**迷わず太ももに打つ**。
              - ③ **急に立たせない**。ふらつけば仰向けで足を高く、息苦しければ座らせる。
      - say: アレルギーの原因に触れた後、皮膚の症状と息苦しさ・ふらつき・腹痛や嘔吐が出たらアナフィラキシー。すぐ119。エピペン、アドレナリン自己注射、を持っていれば迷わず太ももに打つ。急に立たせない。ふらつけば仰向けで足を高く、息苦しければ座らせる。迷ったときは、ためらわずに、相談や受診をしてください。
        read: アレルギーの原因に触れた後、皮膚の症状と息苦しさ・ふらつき・腹痛や嘔吐が出たらアナフィラキシー。すぐいちいちきゅう。エピペン、アドレナリン自己注射、を持っていれば迷わず太ももに打つ。急に立たせない。ふらつけば仰向けで足を高く、息苦しければ座らせる。迷ったときは、ためらわずに、相談や受診をしてください。
