title: 骨折・ねんざ・腰痛
scenes:
  - board: whiteboard
    steps:
      - say: 「骨折・ねんざ・腰痛」です。けがの応急手当、冷やす・固定する、と、危険な腰痛のサインを学びます
        show:
          - type: title
            text: 骨折・ねんざ・腰痛
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 骨折を疑ったら動かさず固定して受診。変形・骨が見える・手足の先が冷たく青白いなら119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 骨折を疑ったら**動かさず固定**して受診。**変形・骨が見える・手足の先が冷たく青白い**なら119。
        read: 骨折を疑ったら動かさず固定して受診。変形・骨が見える・手足の先が冷たく青白いならいちいちきゅう。
      - say: ねんざ・打撲は冷やす・圧迫・高くする・安静、RICE。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② ねんざ・打撲は**冷やす・圧迫・高くする・安静**（RICE）。
      - say: 腰痛のほとんどは数週間で治る。足のまひ、尿や便が出ない・漏れる、発熱、激痛と冷や汗は急ぐ。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 腰痛のほとんどは数週間で治る。**足のまひ、尿や便が出ない・漏れる、発熱、激痛と冷や汗**は急ぐ。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。骨が見えている、ひどい変形。手足の先が冷たい・青白い・しびれる。首や背中のけがで手足がしびれる、首を動かさない。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 骨が見えている、ひどい変形
              - 手足の先が冷たい・青白い・しびれる
              - 首や背中のけがで手足がしびれる（**首を動かさない**）
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。骨が見えている、ひどい変形。手足の先が冷たい・青白い・しびれる。首や背中のけがで手足がしびれる、首を動かさない。
      - say: 太ももの付け根・骨盤のけがで動けない、高齢者の転倒。
        show:
          - type: list
            items:
              - 太ももの付け根・骨盤のけがで動けない（高齢者の転倒）
  - board: whiteboard
    steps:
      - say: 次は、応急手当です。骨折かもしれないときは、雑誌や段ボールで上下の関節ごと固定。ねんざ・打撲はRICE、Rest安静・Ice冷やす・Compression圧迫・Elevation高くする。体重をかけられない、強く腫れる、数日しても良くならない、整形外科。
        show:
          - type: title
            text: 応急手当
          - type: list
            items:
              - 骨折かもしれないときは、雑誌や段ボールで**上下の関節ごと固定**。
              - ねんざ・打撲は**RICE**（Rest 安静・Ice 冷やす・Compression 圧迫・Elevation 高くする）。
              - 体重をかけられない、強く腫れる、数日しても良くならない → 整形外科。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。足に力が入らない、しびれが強い。尿が出ない・漏れる、肛門の周りの感覚がない、神経の圧迫、緊急手術が必要なことも。発熱を伴う。
        show:
          - type: title
            text: 急いで受診（119も）
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 足に力が入らない、しびれが強い
              - "**尿が出ない・漏れる、肛門の周りの感覚がない**（神経の圧迫：緊急手術が必要なことも）"
              - 発熱を伴う
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。足に力が入らない、しびれが強い。尿が出ない・漏れる、肛門の周りの感覚がない、神経の圧迫、緊急手術が必要なことも。発熱を伴う。
      - say: 突然の激しい腰や背中の痛みと冷や汗、大動脈の病気。高齢者が転んだ後の痛み、圧迫骨折。
        show:
          - type: list
            items:
              - "**突然の激しい腰や背中の痛み＋冷や汗**（大動脈の病気）"
              - 高齢者が転んだ後の痛み（圧迫骨折）
  - board: whiteboard
    steps:
      - say: 次は、それ以外の腰痛です。安静にしすぎず、動ける範囲で普段どおり動くほうが早く治ります。
        show:
          - type: title
            text: それ以外の腰痛
          - type: text
            text: 安静にしすぎず、**動ける範囲で普段どおり動く**ほうが早く治ります。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、関節が急に赤く腫れて熱いです。痛風、足の親指の付け根に多い、や、関節の感染、発熱を伴う、急ぐ。受診します。
        show:
          - type: title
            text: 関節が急に赤く腫れて熱い
          - type: text
            text: "**痛風**（足の親指の付け根に多い）や、**関節の感染**（発熱を伴う：急ぐ）。受診します。"
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 骨折を疑ったら**動かさず固定**して受診。**変形・骨が見える・手足の先が冷たく青白い**なら119。
              - ② ねんざ・打撲は**冷やす・圧迫・高くする・安静**（RICE）。
              - ③ 腰痛のほとんどは数週間で治る。**足のまひ、尿や便が出ない・漏れる、発熱、激痛と冷や汗**は急ぐ。
      - say: 骨折を疑ったら動かさず固定して受診。変形・骨が見える・手足の先が冷たく青白いなら119。ねんざ・打撲は冷やす・圧迫・高くする・安静、RICE。腰痛のほとんどは数週間で治る。足のまひ、尿や便が出ない・漏れる、発熱、激痛と冷や汗は急ぐ。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 骨折を疑ったら動かさず固定して受診。変形・骨が見える・手足の先が冷たく青白いならいちいちきゅう。ねんざ・打撲は冷やす・圧迫・高くする・安静、RICE。腰痛のほとんどは数週間で治る。足のまひ、尿や便が出ない・漏れる、発熱、激痛と冷や汗は急ぐ。迷ったときは、ためらわずに、相談や受診をしてください。
