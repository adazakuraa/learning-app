questions:
  - q: アレルギーの原因に触れたあと、全身の発疹と息苦しさ・ふらつきなどが急に出る状態を何というでしょう？
    a: [アナフィラキシー]
  - q: アナフィラキシーに備えて処方される、アドレナリンの自己注射薬を何というでしょう？
    a: [エピペン]
  - q: 出血を止めるには、清潔な布で傷口を何分以上強く押さえ続けるでしょう？
    a: ['10', 10分]
    show: 10分以上
  - q: やけどをしたら、すぐ水道水で何分ほど冷やすでしょう？「（　）〜30分」
    a: ['15', 15分]
    show: 15〜30分
  - q: ねんざや打撲の手当て「RICE」の I（Ice）は何をすることでしょう？
    a: [冷やす, 冷却, アイシング]
    show: 冷やす
