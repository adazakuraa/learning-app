title: かまれた・刺された・異物
scenes:
  - board: whiteboard
    steps:
      - say: 「かまれた・刺された・異物」です。ハチ・ヘビ・動物にかまれた、目に物が入った、などの対応を学びます
        show:
          - type: title
            text: かまれた・刺された・異物
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: ハチに刺されて全身の症状、じんま疹・息苦しさ・ふらつき、が出たら119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① ハチに刺されて**全身の症状**（じんま疹・息苦しさ・ふらつき）が出たら119。
        read: ハチに刺されて全身の症状、じんま疹・息苦しさ・ふらつき、が出たらいちいちきゅう。
      - say: ヘビにかまれたら安静にしてすぐ119。傷口を吸う・切る・強く縛るはしない。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② ヘビにかまれたら**安静にしてすぐ119**。傷口を吸う・切る・強く縛るはしない。
        read: ヘビにかまれたら安静にしてすぐいちいちきゅう。傷口を吸う・切る・強く縛るはしない。
      - say: 目に薬品が入ったらすぐ流水で15分以上洗い、眼科へ。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 目に薬品が入ったら**すぐ流水で15分以上洗い**、眼科へ。
  - board: whiteboard
    steps:
      - say: 次は、かまれた・刺されたです。ハチ。その場を離れる。針が残れば払うように取る。冷やす。全身症状なら119。
        show:
          - type: title
            text: かまれた・刺された
          - type: box
            color: yellow
            w: 1100
            title: "**ハチ**"
            text: その場を離れる。針が残れば払うように取る。冷やす。全身症状なら119
        read: 次は、かまれた・刺されたです。ハチ。その場を離れる。針が残れば払うように取る。冷やす。全身症状ならいちいちきゅう。
      - say: ヘビ、マムシなど。動かず安静、すぐ119。写真を撮れれば撮る。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**ヘビ（マムシなど）**"
            text: 動かず安静、すぐ119。写真を撮れれば撮る
        read: ヘビ、マムシなど。動かず安静、すぐいちいちきゅう。写真を撮れれば撮る。
      - say: 犬・猫・人。よく洗って受診。猫の咬み傷は小さくても感染しやすい。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**犬・猫・人**"
            text: よく洗って受診。**猫の咬み傷**は小さくても感染しやすい
  - board: whiteboard
    steps:
      - say: クラゲ。こすらず海水で洗い流す。全身症状なら119。
        show:
          - type: title
            text: かまれた・刺された（つづき）
          - type: box
            color: green
            w: 1100
            title: "**クラゲ**"
            text: こすらず**海水**で洗い流す。全身症状なら119
        read: クラゲ。こすらず海水で洗い流す。全身症状ならいちいちきゅう。
      - say: マダニ。無理に取らず皮膚科へ。数週間は発熱に注意。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**マダニ**"
            text: 無理に取らず皮膚科へ。数週間は発熱に注意
  - board: whiteboard
    steps:
      - say: 次は、異物です。目。こすらず水で洗う。薬品は15分以上流水。取れなければ眼科。
        show:
          - type: title
            text: 異物
          - type: box
            color: yellow
            w: 1100
            title: "**目**"
            text: こすらず水で洗う。薬品は**15分以上**流水。取れなければ眼科
      - say: 耳・鼻、子ども。無理に取らず耳鼻咽喉科。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**耳・鼻（子ども）**"
            text: 無理に取らず耳鼻咽喉科
      - say: 刺さったもの、大きい。抜かずに固定して119。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**刺さったもの（大きい）**"
            text: 抜かずに固定して119
        read: 刺さったもの、大きい。抜かずに固定していちいちきゅう。
  - board: whiteboard
    steps:
      - say: 魚の骨。ご飯を丸のみしない。取れなければ耳鼻咽喉科。
        show:
          - type: title
            text: 異物（つづき）
          - type: box
            color: green
            w: 1100
            title: "**魚の骨**"
            text: ご飯を丸のみしない。取れなければ耳鼻咽喉科
      - say: 子どもの誤飲は第9章、窒息は第12章で扱います。
        show:
          - type: text
            text: 子どもの誤飲は第9章、窒息は第12章で扱います。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① ハチに刺されて**全身の症状**（じんま疹・息苦しさ・ふらつき）が出たら119。
              - ② ヘビにかまれたら**安静にしてすぐ119**。傷口を吸う・切る・強く縛るはしない。
              - ③ 目に薬品が入ったら**すぐ流水で15分以上洗い**、眼科へ。
      - say: ハチに刺されて全身の症状、じんま疹・息苦しさ・ふらつき、が出たら119。ヘビにかまれたら安静にしてすぐ119。傷口を吸う・切る・強く縛るはしない。目に薬品が入ったらすぐ流水で15分以上洗い、眼科へ。迷ったときは、ためらわずに、相談や受診をしてください。
        read: ハチに刺されて全身の症状、じんま疹・息苦しさ・ふらつき、が出たらいちいちきゅう。ヘビにかまれたら安静にしてすぐいちいちきゅう。傷口を吸う・切る・強く縛るはしない。目に薬品が入ったらすぐ流水で15分以上洗い、眼科へ。迷ったときは、ためらわずに、相談や受診をしてください。
