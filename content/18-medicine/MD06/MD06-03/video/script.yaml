title: 出血・切り傷・やけど
scenes:
  - board: whiteboard
    steps:
      - say: 「出血・切り傷・やけど」です。出血は「強く押さえ続ける」。やけどは「すぐ流水で冷やす」。この2つが基本です
        show:
          - type: title
            text: 出血・切り傷・やけど
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 出血は清潔な布で傷を直接、強く10分以上押さえる、途中で離さない。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 出血は**清潔な布で傷を直接、強く10分以上押さえる**（途中で離さない）。
      - say: やけどはすぐ水道水で15〜30分冷やす。服は脱がさずその上から。水ぶくれは破らない。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② やけどは**すぐ水道水で15〜30分冷やす**。服は脱がさずその上から。水ぶくれは破らない。
        read: やけどはすぐ水道水で15から30分冷やす。服は脱がさずその上から。水ぶくれは破らない。
      - say: 押さえても止まらない出血、広い範囲のやけど、手のひら10枚分以上、顔・手・関節のやけどは119か救急外来。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **押さえても止まらない出血**、**広い範囲のやけど（手のひら10枚分以上）**、**顔・手・関節のやけど**は119か救急外来。
        read: 押さえても止まらない出血、広い範囲のやけど、手のひら10枚分以上、顔・手・関節のやけどはいちいちきゅうか救急外来。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。押さえても止まらない、噴き出す。大量出血で顔色が悪い、ふらつく。刺さった物がある、抜かずに固定して119。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 押さえても止まらない、噴き出す
              - 大量出血で顔色が悪い、ふらつく
              - 刺さった物がある → **抜かずに**固定して119
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。押さえても止まらない、噴き出す。大量出血で顔色が悪い、ふらつく。刺さった物がある、抜かずに固定していちいちきゅう。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。深い、ぱっくり開いている、縫うならできれば6時間以内。指が動かない・しびれる。汚れが取れない、動物にかまれた。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 深い、ぱっくり開いている（縫うなら**できれば6時間以内**）
              - 指が動かない・しびれる
              - 汚れが取れない、動物にかまれた
      - say: 傷は水道水でよく洗うのが一番大切です。土で汚れた深い傷は、破傷風のワクチンが必要なことがあります。
        show:
          - type: text
            text: 傷は**水道水でよく洗う**のが一番大切です。土で汚れた深い傷は、**破傷風のワクチン**が必要なことがあります。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。広い範囲、大人で手のひら10枚分、子どもで5枚分以上。顔、手、足、陰部、関節。白くなって痛みがない、深いやけど。
        show:
          - type: title
            text: すぐ119か救急外来
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 広い範囲（大人で手のひら**10枚分**、子どもで**5枚分**以上）
              - 顔、手、足、陰部、関節
              - 白くなって痛みがない（深いやけど）
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。広い範囲、大人で手のひら10枚分、子どもで5枚分以上。顔、手、足、陰部、関節。白くなって痛みがない、深いやけど。
      - say: 煙を吸った、声がかすれる、鼻毛が焦げている。薬品のやけど、大量の水で長く洗う。
        show:
          - type: list
            items:
              - 煙を吸った（声がかすれる、鼻毛が焦げている）
              - 薬品のやけど（大量の水で長く洗う）
  - board: whiteboard
    steps:
      - say: 次は、注意です。氷を直接当てない、味噌やアロエなどは塗らない。カイロ・湯たんぽの低温やけどは見た目より深いので受診。
        show:
          - type: title
            text: 注意
          - type: list
            items:
              - "**氷を直接当てない**、味噌やアロエなどは塗らない。"
              - カイロ・湯たんぽの**低温やけど**は見た目より深いので受診。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
