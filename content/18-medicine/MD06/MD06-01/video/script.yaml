title: 発疹とかゆみ
scenes:
  - board: slide
    steps:
      - say: 第6章、「皮膚・アレルギー・外傷」です。
        show:
          - type: title
            text: 第6章　皮膚・アレルギー・外傷
      - say: この章では、発疹とかゆみ、じんま疹とアナフィラキシー、出血・切り傷・やけど、骨折・ねんざ・腰痛、かまれた・刺された・異物を学びます。
        show:
          - type: list
            items:
              - 発疹とかゆみ
              - じんま疹とアナフィラキシー
              - 出血・切り傷・やけど
              - 骨折・ねんざ・腰痛
              - かまれた・刺された・異物
  - board: whiteboard
    steps:
      - say: 「発疹とかゆみ」です。多くは湿疹やじんま疹ですが、全身の病気のサインになる発疹もあります
        show:
          - type: title
            text: 発疹とかゆみ
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 発疹と息苦しさ・顔の腫れ・ぐったりはアナフィラキシーで119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 発疹＋**息苦しさ・顔の腫れ・ぐったり**はアナフィラキシーで119。
        read: 発疹と息苦しさ・顔の腫れ・ぐったりはアナフィラキシーでいちいちきゅう。
      - say: 発熱と押しても消えない紫の斑点、口や目のただれと皮膚がむけるは119。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 発熱＋**押しても消えない紫の斑点**、**口や目のただれ＋皮膚がむける**は119。
        read: 発熱と押しても消えない紫の斑点、口や目のただれと皮膚がむけるはいちいちきゅう。
      - say: 新しい薬を飲み始めてからの発疹は、その薬について受診して相談。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **新しい薬を飲み始めてから**の発疹は、その薬について受診して相談。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。息苦しい、顔や唇が腫れる、ふらつく、アナフィラキシー。発熱と押しても消えない紫の斑点。口・目のただれ、皮膚がやけどのようにむける、高熱、重い薬疹。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 息苦しい、顔や唇が腫れる、ふらつく（アナフィラキシー）
              - 発熱＋押しても消えない紫の斑点
              - 口・目のただれ、皮膚がやけどのようにむける、高熱（重い薬疹）
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。息苦しい、顔や唇が腫れる、ふらつく、アナフィラキシー。発熱と押しても消えない紫の斑点。口・目のただれ、皮膚がやけどのようにむける、高熱、重い薬疹。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。発熱を伴う発疹、どんどん広がる。新しい薬を飲み始めた後の発疹。妊娠中の発疹、風疹などは胎児に影響。
        show:
          - type: title
            text: 今日中〜数日以内に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 発熱を伴う発疹、どんどん広がる
              - 新しい薬を飲み始めた後の発疹
              - "**妊娠中**の発疹（風疹などは胎児に影響）"
      - say: 片側の帯状の痛みと水ぶくれ、帯状疱疹。
        show:
          - type: list
            items:
              - 片側の帯状の痛みと水ぶくれ（帯状疱疹）
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。湿疹、皮膚炎。赤み、かゆみ、カサカサ。洗剤・金属などが原因のことも。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**湿疹（皮膚炎）**"
            text: 赤み、かゆみ、カサカサ。洗剤・金属などが原因のことも
      - say: じんま疹。盛り上がった発疹が数時間で消える。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**じんま疹**"
            text: 盛り上がった発疹が数時間で消える
      - say: 薬疹。薬の副作用。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**薬疹**"
            text: 薬の副作用
  - board: whiteboard
    steps:
      - say: 麻疹、はしか。高熱と全身の発疹。感染力が非常に強い。受診前に電話。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**麻疹（はしか）**"
            text: 高熱＋全身の発疹。感染力が非常に強い。**受診前に電話**
      - say: 風疹。妊娠初期にかかると胎児に影響。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**風疹**"
            text: 妊娠初期にかかると胎児に影響
  - board: whiteboard
    steps:
      - say: 自分でできることも、覚えておきましょう。掻かない、冷やす、保湿。写真を撮っておくと受診時に役立ちます、発疹は消えることがあるため。
        show:
          - type: title
            text: 自分でできること
          - type: text
            text: 掻かない、冷やす、保湿。写真を撮っておくと受診時に役立ちます（発疹は消えることがあるため）。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 発疹＋**息苦しさ・顔の腫れ・ぐったり**はアナフィラキシーで119。
              - ② 発熱＋**押しても消えない紫の斑点**、**口や目のただれ＋皮膚がむける**は119。
              - ③ **新しい薬を飲み始めてから**の発疹は、その薬について受診して相談。
      - say: 発疹と息苦しさ・顔の腫れ・ぐったりはアナフィラキシーで119。発熱と押しても消えない紫の斑点、口や目のただれと皮膚がむけるは119。新しい薬を飲み始めてからの発疹は、その薬について受診して相談。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 発疹と息苦しさ・顔の腫れ・ぐったりはアナフィラキシーでいちいちきゅう。発熱と押しても消えない紫の斑点、口や目のただれと皮膚がむけるはいちいちきゅう。新しい薬を飲み始めてからの発疹は、その薬について受診して相談。迷ったときは、ためらわずに、相談や受診をしてください。
