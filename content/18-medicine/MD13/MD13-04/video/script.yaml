title: ワクチン
scenes:
  - board: whiteboard
    steps:
      - say: 「ワクチン」です。ワクチンは、病気そのものや重症化を防ぐ、効果と安全性が確かめられた方法です
        show:
          - type: title
            text: ワクチン
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: ワクチンは免疫に予行演習をさせるしくみ。かかっても重症化を防ぐ効果も大きい。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① ワクチンは**免疫に予行演習をさせる**しくみ。かかっても**重症化を防ぐ**効果も大きい。
      - say: 大人が確認したいのは、麻疹・風疹の接種歴、破傷風、65歳以上の肺炎球菌・帯状疱疹・インフルエンザ。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 大人が確認したいのは、**麻疹・風疹**の接種歴、**破傷風**、**65歳以上の肺炎球菌・帯状疱疹・インフルエンザ**。
      - say: 副反応の多くは腫れや発熱が数日で治まる。重いアレルギーはまれ。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 副反応の多くは**腫れや発熱が数日で治まる**。重いアレルギーはまれ。
  - board: whiteboard
    steps:
      - say: 次は、大人が確認したいワクチンです。麻疹・風疹、MR。接種歴が不明なら抗体検査か接種。妊娠を考える人とその家族は特に。
        show:
          - type: title
            text: 大人が確認したいワクチン
          - type: box
            color: yellow
            w: 1100
            title: "**麻疹・風疹（MR）**"
            text: 接種歴が不明なら抗体検査か接種。**妊娠を考える人とその家族**は特に
      - say: 破傷風。けがの備え。約10年ごと。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**破傷風**"
            text: けがの備え。約10年ごと
      - say: インフルエンザ。毎年。高齢者・持病のある人・妊婦。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**インフルエンザ**"
            text: 毎年。高齢者・持病のある人・妊婦
  - board: whiteboard
    steps:
      - say: 肺炎球菌。65歳など対象年齢で。
        show:
          - type: title
            text: 大人が確認したいワクチン（つづき）
          - type: box
            color: green
            w: 1100
            title: "**肺炎球菌**"
            text: 65歳など対象年齢で
      - say: 帯状疱疹。50歳以上。65歳などは公費の対象、自治体で確認。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**帯状疱疹**"
            text: 50歳以上。65歳などは公費の対象（自治体で確認）
      - say: HPV。子宮頸がんを防ぐ。接種の機会を逃した世代にも機会がある。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**HPV**"
            text: 子宮頸がんを防ぐ。接種の機会を逃した世代にも機会がある
        read: エイチピーブイ。子宮頸がんを防ぐ。接種の機会を逃した世代にも機会がある。
  - board: whiteboard
    steps:
      - say: 新型コロナ。高齢者・持病のある人。
        show:
          - type: title
            text: 大人が確認したいワクチン（つづき）
          - type: box
            color: blue
            w: 1100
            title: "**新型コロナ**"
            text: 高齢者・持病のある人
      - say: 対象年齢や費用は変わるので、自治体や厚生労働省の最新情報を確認します。
        show:
          - type: text
            text: 対象年齢や費用は変わるので、**自治体や厚生労働省の最新情報**を確認します。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、子どもの定期接種です。母子手帳で確認し、決められた時期に。ヒブ・肺炎球菌・五種混合・BCG・MR・水痘・日本脳炎・B型肝炎など。
        show:
          - type: title
            text: 子どもの定期接種
          - type: text
            text: 母子手帳で確認し、**決められた時期に**。ヒブ・肺炎球菌・五種混合・BCG・MR・水痘・日本脳炎・B型肝炎など。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、安全性です。「ワクチンが自閉症の原因」という説は否定されています。定期接種で健康被害が起きたときは、国の救済制度があります。
        show:
          - type: title
            text: 安全性
          - type: list
            items:
              - 「ワクチンが自閉症の原因」という説は**否定されています**。
              - 定期接種で健康被害が起きたときは、**国の救済制度**があります。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① ワクチンは**免疫に予行演習をさせる**しくみ。かかっても**重症化を防ぐ**効果も大きい。
              - ② 大人が確認したいのは、**麻疹・風疹**の接種歴、**破傷風**、**65歳以上の肺炎球菌・帯状疱疹・インフルエンザ**。
              - ③ 副反応の多くは**腫れや発熱が数日で治まる**。重いアレルギーはまれ。
      - say: ワクチンは免疫に予行演習をさせるしくみ。かかっても重症化を防ぐ効果も大きい。大人が確認したいのは、麻疹・風疹の接種歴、破傷風、65歳以上の肺炎球菌・帯状疱疹・インフルエンザ。副反応の多くは腫れや発熱が数日で治まる。重いアレルギーはまれ。迷ったときは、ためらわずに、相談や受診をしてください。
