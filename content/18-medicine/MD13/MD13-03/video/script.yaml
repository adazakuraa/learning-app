title: がん検診と健康診断
scenes:
  - board: whiteboard
    steps:
      - say: 「がん検診と健康診断」です。国がすすめるがん検診は5つ。科学的に「受けると死亡が減る」とわかっているものです
        show:
          - type: title
            text: がん検診と健康診断
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 国がすすめる検診は胃・大腸・肺・乳・子宮頸の5つ。対象年齢になったら受ける。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 国がすすめる検診は**胃・大腸・肺・乳・子宮頸**の5つ。対象年齢になったら受ける。
      - say: 「要精密検査」は必ず受ける、がんと決まったわけではない。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **「要精密検査」**は必ず受ける（がんと決まったわけではない）。
      - say: 検診は多ければ良いわけではない。根拠の弱い検査、腫瘍マーカーなど、は過信しない。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 検診は**多ければ良いわけではない**。根拠の弱い検査（腫瘍マーカーなど）は過信しない。
  - board: whiteboard
    steps:
      - say: 次は、国がすすめるがん検診（2026年時点）です。胃。検査は、胃カメラまたはバリウム、対象は、50歳以上、間隔は、2年に1回。
        show:
          - type: title
            text: 国がすすめるがん検診（2026年時点）
          - type: box
            color: yellow
            w: 1100
            title: "**胃**"
            text: 検査：胃カメラまたはバリウム　対象：50歳以上　間隔：2年に1回
      - say: 大腸。検査は、便潜血検査、対象は、40歳以上、間隔は、毎年。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**大腸**"
            text: 検査：**便潜血検査**　対象：40歳以上　間隔：毎年
      - say: 肺。検査は、胸部X線、喫煙者は痰も、対象は、40歳以上、間隔は、毎年。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**肺**"
            text: 検査：胸部X線（喫煙者は痰も）　対象：40歳以上　間隔：毎年
  - board: whiteboard
    steps:
      - say: 乳。検査は、マンモグラフィ、対象は、40歳以上の女性、間隔は、2年に1回。
        show:
          - type: title
            text: 国がすすめるがん検診（2026年時点）（つづき）
          - type: box
            color: green
            w: 1100
            title: "**乳**"
            text: 検査：マンモグラフィ　対象：40歳以上の女性　間隔：2年に1回
      - say: 子宮頸。検査は、細胞診など、対象は、20歳以上の女性、間隔は、2年に1回。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**子宮頸**"
            text: 検査：細胞診など　対象：20歳以上の女性　間隔：2年に1回
      - say: 市区町村の検診は、無料か低い負担で受けられます。
        show:
          - type: text
            text: 市区町村の検診は、無料か低い負担で受けられます。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、健康診断（特定健診）です。40〜74歳は毎年。血圧・血糖・脂質・肝臓・腎臓など、症状のない病気を見つけます。結果は毎年の変化を見ることが大切です。
        show:
          - type: title
            text: 健康診断（特定健診）
          - type: text
            text: 40〜74歳は毎年。**血圧・血糖・脂質・肝臓・腎臓**など、症状のない病気を見つけます。結果は**毎年の変化**を見ることが大切です。
            w: 1100
        read: 次は、健康診断（特定健診）です。40から74歳は毎年。血圧・血糖・脂質・肝臓・腎臓など、症状のない病気を見つけます。結果は毎年の変化を見ることが大切です。
  - board: whiteboard
    steps:
      - say: 次は、そのほかです。肝炎ウイルス検査、一生に一度。B型・C型肝炎は治療で肝がんを防げる。緑内障の検査、40歳を過ぎたら一度。家族に若くしてがんになった人が多い場合は、医師に相談。
        show:
          - type: title
            text: そのほか
          - type: list
            items:
              - "**肝炎ウイルス検査**：一生に一度。B型・C型肝炎は治療で肝がんを防げる。"
              - "**緑内障の検査**：40歳を過ぎたら一度。"
              - 家族に若くしてがんになった人が多い場合は、医師に相談。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 国がすすめる検診は**胃・大腸・肺・乳・子宮頸**の5つ。対象年齢になったら受ける。
              - ② **「要精密検査」**は必ず受ける（がんと決まったわけではない）。
              - ③ 検診は**多ければ良いわけではない**。根拠の弱い検査（腫瘍マーカーなど）は過信しない。
      - say: 国がすすめる検診は胃・大腸・肺・乳・子宮頸の5つ。対象年齢になったら受ける。「要精密検査」は必ず受ける、がんと決まったわけではない。検診は多ければ良いわけではない。根拠の弱い検査、腫瘍マーカーなど、は過信しない。迷ったときは、ためらわずに、相談や受診をしてください。
