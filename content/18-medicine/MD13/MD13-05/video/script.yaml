title: 予防医学：生活習慣と健康情報の読み方
scenes:
  - board: whiteboard
    steps:
      - say: 「予防医学：生活習慣と健康情報の読み方」です。病気になる前に防ぐ。効果が確かな生活習慣と、健康情報を見分ける目を学びます
        show:
          - type: title
            text: 予防医学：生活習慣と健康情報の読み方
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: いちばん効果が大きい予防は禁煙。次に運動・食事・体重・節酒・睡眠。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① いちばん効果が大きい予防は**禁煙**。次に**運動・食事・体重・節酒・睡眠**。
      - say: 高血圧・糖尿病・脂質異常症は症状がないまま進み、脳卒中や心臓病の原因になる。健診で見つけて治療を続ける。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **高血圧・糖尿病・脂質異常症**は症状がないまま進み、脳卒中や心臓病の原因になる。健診で見つけて治療を続ける。
      - say: 「〜を食べる人は長生き」は相関であって因果とは限らない。体験談や広告は根拠が弱い。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 「〜を食べる人は長生き」は**相関であって因果とは限らない**。体験談や広告は根拠が弱い。
        read: 「からを食べる人は長生き」は相関であって因果とは限らない。体験談や広告は根拠が弱い。
  - board: whiteboard
    steps:
      - say: 次は、効果が確かな生活習慣です。禁煙。がん・心臓病・脳卒中すべてのリスクが下がる。禁煙外来は保険が使える。
        show:
          - type: title
            text: 効果が確かな生活習慣
          - type: box
            color: yellow
            w: 1100
            title: "**禁煙**"
            text: がん・心臓病・脳卒中すべてのリスクが下がる。禁煙外来は保険が使える
      - say: 運動。早歩きなどを週150分と筋トレ週2回。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**運動**"
            text: 早歩きなどを**週150分**＋筋トレ週2回
      - say: 食事。野菜・果物・魚・豆、減塩、甘い飲み物と加工肉を控える。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**食事**"
            text: 野菜・果物・魚・豆、**減塩**、甘い飲み物と加工肉を控える
  - board: whiteboard
    steps:
      - say: 体重。BMI18.5〜25未満。
        show:
          - type: title
            text: 効果が確かな生活習慣（つづき）
          - type: box
            color: green
            w: 1100
            title: "**体重**"
            text: BMI 18.5〜25未満
        read: 体重。ビーエムアイ18.5から25未満。
      - say: お酒。控えめに。飲まない人が健康のために飲む必要はない。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**お酒**"
            text: 控えめに。飲まない人が健康のために飲む必要はない
      - say: 睡眠。7時間前後。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**睡眠**"
            text: 7時間前後
  - board: whiteboard
    steps:
      - say: 次は、症状のない病気です。高血圧。家庭で135/85以上。
        show:
          - type: title
            text: 症状のない病気
          - type: box
            color: yellow
            w: 1100
            title: "**高血圧**"
            text: 家庭で135/85以上
        read: 次は、症状のない病気です。高血圧。家庭で135の85以上。
      - say: 糖尿病。HbA1c6.5%以上。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**糖尿病**"
            text: HbA1c 6.5%以上
        read: 糖尿病。ヘモグロビンエーワンシー6.5パーセント以上。
      - say: 脂質異常症。LDLコレステロールが高い。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**脂質異常症**"
            text: LDLコレステロールが高い
        read: 脂質異常症。エルディーエルコレステロールが高い。
  - board: whiteboard
    steps:
      - say: どれも動脈硬化を進め、脳卒中・心筋梗塞の原因になります。薬が必要なら自己判断でやめないこと。
        show:
          - type: title
            text: 症状のない病気（つづき）
          - type: text
            text: どれも**動脈硬化**を進め、**脳卒中・心筋梗塞**の原因になります。薬が必要なら自己判断でやめないこと。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、健康情報の見分け方です。根拠の強さ、複数の研究のまとめ＞くじ引きで分けた試験＞観察研究＞体験談。「リスク2倍」も、もとの確率が小さければ増える数はわずか。「これだけで治る」「医者が教えない」「奇跡の」は疑う。
        show:
          - type: title
            text: 健康情報の見分け方
          - type: list
            items:
              - 根拠の強さ：**複数の研究のまとめ ＞ くじ引きで分けた試験 ＞ 観察研究 ＞ 体験談**
              - 「リスク2倍」も、**もとの確率が小さければ増える数はわずか**。
              - 「これだけで治る」「医者が教えない」「奇跡の」は疑う。
      - say: この科目は、診断ではなく判断の助けです。迷ったら、ためらわずに相談・受診してください。
        show:
          - type: text
            text: "**この科目は、診断ではなく判断の助けです。迷ったら、ためらわずに相談・受診してください。**"
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① いちばん効果が大きい予防は**禁煙**。次に**運動・食事・体重・節酒・睡眠**。
              - ② **高血圧・糖尿病・脂質異常症**は症状がないまま進み、脳卒中や心臓病の原因になる。健診で見つけて治療を続ける。
              - ③ 「〜を食べる人は長生き」は**相関であって因果とは限らない**。体験談や広告は根拠が弱い。
      - say: いちばん効果が大きい予防は禁煙。次に運動・食事・体重・節酒・睡眠。高血圧・糖尿病・脂質異常症は症状がないまま進み、脳卒中や心臓病の原因になる。健診で見つけて治療を続ける。「〜を食べる人は長生き」は相関であって因果とは限らない。体験談や広告は根拠が弱い。迷ったときは、ためらわずに、相談や受診をしてください。
        read: いちばん効果が大きい予防は禁煙。次に運動・食事・体重・節酒・睡眠。高血圧・糖尿病・脂質異常症は症状がないまま進み、脳卒中や心臓病の原因になる。健診で見つけて治療を続ける。「からを食べる人は長生き」は相関であって因果とは限らない。体験談や広告は根拠が弱い。迷ったときは、ためらわずに、相談や受診をしてください。
