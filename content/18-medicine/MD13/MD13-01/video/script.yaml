title: 医療のかかり方とお金
scenes:
  - board: slide
    steps:
      - say: 第13章、「医療リテラシー：予防・検査・ワクチン」です。
        show:
          - type: title
            text: 第13章　医療リテラシー：予防・検査・ワクチン
      - say: この章では、医療のかかり方とお金、検査の基本、がん検診と健康診断、ワクチン、予防医学を学びます。
        show:
          - type: list
            items:
              - 医療のかかり方とお金
              - 検査の基本：血液・CT・MRIなど
              - がん検診と健康診断
              - ワクチン
              - 予防医学：生活習慣と健康情報の読み方
  - board: whiteboard
    steps:
      - say: 「医療のかかり方とお金」です。かかりつけ医、薬の基本、医療費の制度など、医療を上手に使うための基礎です
        show:
          - type: title
            text: 医療のかかり方とお金
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: かかりつけ医を持つと、相談しやすく、必要なときに専門医へ紹介してもらえる。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **かかりつけ医**を持つと、相談しやすく、必要なときに専門医へ紹介してもらえる。
      - say: 抗菌薬、抗生物質、はウイルス、かぜ、に効かない。処方された分は指示どおり飲む。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **抗菌薬（抗生物質）はウイルス（かぜ）に効かない**。処方された分は指示どおり飲む。
      - say: 医療費が高くなったら高額療養費制度で自己負担に上限がある。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 医療費が高くなったら**高額療養費制度**で自己負担に上限がある。
  - board: whiteboard
    steps:
      - say: 次は、医療の使い方です。まず診療所、かかりつけ医、必要なら大病院へ紹介。紹介状なしで大病院に行くと追加料金がかかることがある。聞いてよいこと、診断の理由、ほかの可能性、「どうなったら再受診か」。治療に迷ったらセカンドオピニオン、別の医師の意見、を求めてよい。
        show:
          - type: title
            text: 医療の使い方
          - type: list
            items:
              - まず**診療所（かかりつけ医）**、必要なら大病院へ紹介。紹介状なしで大病院に行くと追加料金がかかることがある。
              - 聞いてよいこと：診断の理由、ほかの可能性、**「どうなったら再受診か」**。
              - 治療に迷ったら**セカンドオピニオン**（別の医師の意見）を求めてよい。
  - board: whiteboard
    steps:
      - say: 次は、薬の基本です。お薬手帳は1冊にまとめる。市販薬やサプリも伝える。市販薬は同じ成分を重ねて飲まない、かぜ薬と痛み止めなど。ジェネリック医薬品は、有効成分が同じで安い。
        show:
          - type: title
            text: 薬の基本
          - type: list
            items:
              - "**お薬手帳は1冊に**まとめる。市販薬やサプリも伝える。"
              - 市販薬は**同じ成分を重ねて飲まない**（かぜ薬と痛み止めなど）。
              - "**ジェネリック医薬品**は、有効成分が同じで安い。"
  - board: whiteboard
    steps:
      - say: 次は、医療費の制度です。窓口負担。原則3割、子どもや高齢者は軽くなる。
        show:
          - type: title
            text: 医療費の制度
          - type: box
            color: yellow
            w: 1100
            title: "**窓口負担**"
            text: 原則3割（子どもや高齢者は軽くなる）
      - say: 高額療養費制度。1か月の自己負担に、所得に応じた上限がある。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**高額療養費制度**"
            text: 1か月の自己負担に、所得に応じた上限がある
      - say: 医療費控除。1年間の医療費が多いと、確定申告で税金が戻る。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**医療費控除**"
            text: 1年間の医療費が多いと、確定申告で税金が戻る
  - board: whiteboard
    steps:
      - say: 傷病手当金。会社員が病気で休んだとき、給料の約3分の2が出る。
        show:
          - type: title
            text: 医療費の制度（つづき）
          - type: box
            color: green
            w: 1100
            title: "**傷病手当金**"
            text: 会社員が病気で休んだとき、給料の約3分の2が出る
  - board: whiteboard
    steps:
      - say: 次は、健康情報の見分け方です。信頼できるのは、厚生労働省、国立がん研究センター、学会などの情報。「これだけで治る」「医者が隠す」という情報は疑う。
        show:
          - type: title
            text: 健康情報の見分け方
          - type: text
            text: 信頼できるのは、**厚生労働省、国立がん研究センター、学会**などの情報。「これだけで治る」「医者が隠す」という情報は疑う。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **かかりつけ医**を持つと、相談しやすく、必要なときに専門医へ紹介してもらえる。
              - ② **抗菌薬（抗生物質）はウイルス（かぜ）に効かない**。処方された分は指示どおり飲む。
              - ③ 医療費が高くなったら**高額療養費制度**で自己負担に上限がある。
      - say: かかりつけ医を持つと、相談しやすく、必要なときに専門医へ紹介してもらえる。抗菌薬、抗生物質、はウイルス、かぜ、に効かない。処方された分は指示どおり飲む。医療費が高くなったら高額療養費制度で自己負担に上限がある。迷ったときは、ためらわずに、相談や受診をしてください。
