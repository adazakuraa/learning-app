title: 検査の基本：血液・CT・MRIなど
scenes:
  - board: whiteboard
    steps:
      - say: 「検査の基本：血液・CT・MRIなど」です。有名な検査が何を見ているのか、ざっくり知っておきます
        show:
          - type: title
            text: 検査の基本：血液・CT・MRIなど
        read: 「検査の基本：血液・シーティー・エムアールアイなど」です。有名な検査が何を見ているのか、ざっくり知っておきます
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: CTはX線で短時間に体の断面を撮る。救急、出血・骨折、に強い。少し被ばくがある。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **CT**はX線で短時間に体の断面を撮る。**救急（出血・骨折）に強い**。少し被ばくがある。
        read: シーティーはX線で短時間に体の断面を撮る。救急、出血・骨折、に強い。少し被ばくがある。
      - say: MRIは磁石で撮る。脳・脊髄・関節に強く、被ばくはないが時間がかかり、金属に注意。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **MRI**は磁石で撮る。**脳・脊髄・関節に強く**、被ばくはないが時間がかかり、**金属に注意**。
        read: エムアールアイは磁石で撮る。脳・脊髄・関節に強く、被ばくはないが時間がかかり、金属に注意。
      - say: 超音波、エコー、は被ばくがなく、その場ですぐ見られる。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **超音波（エコー）**は被ばくがなく、その場ですぐ見られる。
  - board: whiteboard
    steps:
      - say: 次は、主な画像検査です。X線、レントゲン。しくみは、X線、得意なものは、骨、肺、注意は、被ばくはわずか。
        show:
          - type: title
            text: 主な画像検査
          - type: box
            color: yellow
            w: 1100
            title: "**X線（レントゲン）**"
            text: しくみ：X線　得意なもの：骨、肺　注意：被ばくはわずか
      - say: CT。しくみは、X線で断面、得意なものは、出血、骨折、肺、おなか、注意は、被ばくがある。妊娠の可能性を伝える。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**CT**"
            text: しくみ：X線で断面　得意なもの：出血、骨折、肺、おなか　注意：被ばくがある。妊娠の可能性を伝える
        read: シーティー。しくみは、X線で断面、得意なものは、出血、骨折、肺、おなか、注意は、被ばくがある。妊娠の可能性を伝える。
      - say: MRI。しくみは、磁石と電波、得意なものは、脳、脊髄、関節、注意は、30分前後かかる。ペースメーカーなど金属は必ず申告。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**MRI**"
            text: しくみ：磁石と電波　得意なもの：脳、脊髄、関節　注意：30分前後かかる。**ペースメーカーなど金属は必ず申告**
        read: エムアールアイ。しくみは、磁石と電波、得意なものは、脳、脊髄、関節、注意は、30分前後かかる。ペースメーカーなど金属は必ず申告。
  - board: whiteboard
    steps:
      - say: 超音波、エコー。しくみは、音波、得意なものは、心臓、おなか、胎児、注意は、被ばくなし。
        show:
          - type: title
            text: 主な画像検査（つづき）
          - type: box
            color: green
            w: 1100
            title: "**超音波（エコー）**"
            text: しくみ：音波　得意なもの：心臓、おなか、胎児　注意：被ばくなし
      - say: 内視鏡、胃カメラ・大腸カメラ。しくみは、カメラを入れる、得意なものは、胃・大腸のがん、ポリープ、注意は、ポリープはその場で取れる。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**内視鏡（胃カメラ・大腸カメラ）**"
            text: しくみ：カメラを入れる　得意なもの：胃・大腸のがん、ポリープ　注意：ポリープはその場で取れる
  - board: whiteboard
    steps:
      - say: 次は、血液検査で見るもの（代表例）です。白血球・CRP。炎症・感染。
        show:
          - type: title
            text: 血液検査で見るもの（代表例）
          - type: box
            color: yellow
            w: 1100
            title: 白血球・CRP
            text: 炎症・感染
      - say: ヘモグロビン。貧血。
        show:
          - type: box
            color: pink
            w: 1100
            title: ヘモグロビン
            text: 貧血
      - say: AST・ALT・γ-GTP。肝臓。
        show:
          - type: box
            color: blue
            w: 1100
            title: AST・ALT・γ-GTP
            text: 肝臓
  - board: whiteboard
    steps:
      - say: クレアチニン・eGFR。腎臓。
        show:
          - type: title
            text: 血液検査で見るもの（代表例）（つづき）
          - type: box
            color: green
            w: 1100
            title: クレアチニン・eGFR
            text: 腎臓
      - say: 血糖・HbA1c。糖尿病。
        show:
          - type: box
            color: yellow
            w: 1100
            title: 血糖・HbA1c
            text: 糖尿病
        read: 血糖・ヘモグロビンエーワンシー。糖尿病。
      - say: LDLコレステロール。動脈硬化のリスク。
        show:
          - type: box
            color: pink
            w: 1100
            title: LDLコレステロール
            text: 動脈硬化のリスク
        read: エルディーエルコレステロール。動脈硬化のリスク。
  - board: whiteboard
    steps:
      - say: 次は、検査の考え方です。検査は多ければ良いわけではない。異常がないのに「異常」と出ることも、偽陽性。基準値から少し外れても、すぐ病気とは限らない。前回との比較が大事。
        show:
          - type: title
            text: 検査の考え方
          - type: list
            items:
              - 検査は**多ければ良いわけではない**。異常がないのに「異常」と出ることも（偽陽性）。
              - 基準値から少し外れても、すぐ病気とは限らない。**前回との比較**が大事。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **CT**はX線で短時間に体の断面を撮る。**救急（出血・骨折）に強い**。少し被ばくがある。
              - ② **MRI**は磁石で撮る。**脳・脊髄・関節に強く**、被ばくはないが時間がかかり、**金属に注意**。
              - ③ **超音波（エコー）**は被ばくがなく、その場ですぐ見られる。
      - say: CTはX線で短時間に体の断面を撮る。救急、出血・骨折、に強い。少し被ばくがある。MRIは磁石で撮る。脳・脊髄・関節に強く、被ばくはないが時間がかかり、金属に注意。超音波、エコー、は被ばくがなく、その場ですぐ見られる。迷ったときは、ためらわずに、相談や受診をしてください。
        read: シーティーはX線で短時間に体の断面を撮る。救急、出血・骨折、に強い。少し被ばくがある。エムアールアイは磁石で撮る。脳・脊髄・関節に強く、被ばくはないが時間がかかり、金属に注意。超音波、エコー、は被ばくがなく、その場ですぐ見られる。迷ったときは、ためらわずに、相談や受診をしてください。
