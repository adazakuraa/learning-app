title: 高齢者の症状の特徴
scenes:
  - board: slide
    steps:
      - say: 第10章、「高齢者の症状」です。
        show:
          - type: title
            text: 第10章　高齢者の症状
      - say: この章では、高齢者の症状の特徴を学びます。
        show:
          - type: list
            items:
              - 高齢者の症状の特徴
  - board: whiteboard
    steps:
      - say: 「高齢者の症状の特徴」です。高齢者は典型的な症状が出にくく、「なんとなく元気がない」が重い病気のサインのことがあります
        show:
          - type: title
            text: 高齢者の症状の特徴
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 高齢者は熱が出ない肺炎、痛みのない心筋梗塞がある。「いつもと違う」を重視する。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 高齢者は**熱が出ない肺炎、痛みのない心筋梗塞**がある。**「いつもと違う」**を重視する。
      - say: 急に混乱する・ぼんやりする、せん妄、のは、体の病気のサイン。認知症の進行と決めつけず受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **急に混乱する・ぼんやりする（せん妄）**のは、体の病気のサイン。認知症の進行と決めつけず受診。
      - say: 転倒は寝たきりの入り口。転んで立てない、足の付け根が痛いなら受診。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **転倒**は寝たきりの入り口。転んで立てない、足の付け根が痛いなら受診。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。急に意識がぼんやり、話がつじつまが合わない。顔のゆがみ、片側のまひ、ろれつ、脳卒中。食べない・飲まない・おしっこが少ない状態が続く、脱水。
        show:
          - type: title
            text: 急いで受診・119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 急に意識がぼんやり、話がつじつまが合わない
              - 顔のゆがみ、片側のまひ、ろれつ（脳卒中）
              - 食べない・飲まない・おしっこが少ない状態が続く（脱水）
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。急に意識がぼんやり、話がつじつまが合わない。顔のゆがみ、片側のまひ、ろれつ、脳卒中。食べない・飲まない・おしっこが少ない状態が続く、脱水。
      - say: 転倒後に立てない、頭を打った、血をサラサラにする薬を飲んでいる人は特に。
        show:
          - type: list
            items:
              - 転倒後に立てない、頭を打った（**血をサラサラにする薬**を飲んでいる人は特に）
  - board: whiteboard
    steps:
      - say: 次は、せん妄です。急に起こる意識の混乱。昼はぼんやり、夜は興奮。原因、感染症、脱水、薬、入院・環境の変化、便秘など。原因を治せば良くなることが多い。
        show:
          - type: title
            text: せん妄
          - type: list
            items:
              - "**急に**起こる意識の混乱。昼はぼんやり、夜は興奮。"
              - 原因：**感染症、脱水、薬、入院・環境の変化、便秘**など。
              - 原因を治せば**良くなる**ことが多い。
  - board: whiteboard
    steps:
      - say: 次は、予防のポイントです。転倒。運動、段差・照明・手すり、ふらつく薬の見直し。
        show:
          - type: title
            text: 予防のポイント
          - type: box
            color: yellow
            w: 1100
            title: "**転倒**"
            text: 運動、段差・照明・手すり、ふらつく薬の見直し
      - say: 誤嚥性肺炎。歯みがき・入れ歯の手入れ、食事中は座って姿勢を起こす。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**誤嚥性肺炎**"
            text: 歯みがき・入れ歯の手入れ、食事中は座って姿勢を起こす
      - say: 脱水・熱中症。のどが渇く前に水分、夏は室内でもエアコン。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**脱水・熱中症**"
            text: のどが渇く前に水分、夏は室内でもエアコン
  - board: whiteboard
    steps:
      - say: 薬の飲みすぎ。お薬手帳を1冊に。定期的に薬を見直してもらう。
        show:
          - type: title
            text: 予防のポイント（つづき）
          - type: box
            color: green
            w: 1100
            title: "**薬の飲みすぎ**"
            text: お薬手帳を1冊に。定期的に薬を見直してもらう
  - board: whiteboard
    steps:
      - say: 次は、認知症かもと思ったらです。「歳のせい」とせず受診。治せる原因、甲状腺、薬、慢性硬膜下血腫など、もあります。相談先は地域包括支援センター。
        show:
          - type: title
            text: 認知症かもと思ったら
          - type: text
            text: 「歳のせい」とせず受診。**治せる原因**（甲状腺、薬、慢性硬膜下血腫など）もあります。相談先は**地域包括支援センター**。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 高齢者は**熱が出ない肺炎、痛みのない心筋梗塞**がある。**「いつもと違う」**を重視する。
              - ② **急に混乱する・ぼんやりする（せん妄）**のは、体の病気のサイン。認知症の進行と決めつけず受診。
              - ③ **転倒**は寝たきりの入り口。転んで立てない、足の付け根が痛いなら受診。
      - say: 高齢者は熱が出ない肺炎、痛みのない心筋梗塞がある。「いつもと違う」を重視する。急に混乱する・ぼんやりする、せん妄、のは、体の病気のサイン。認知症の進行と決めつけず受診。転倒は寝たきりの入り口。転んで立てない、足の付け根が痛いなら受診。迷ったときは、ためらわずに、相談や受診をしてください。
