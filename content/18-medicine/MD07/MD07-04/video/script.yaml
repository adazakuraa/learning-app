title: 口・歯・あごの症状
scenes:
  - board: whiteboard
    steps:
      - say: 「口・歯・あごの症状」です。歯の痛みは歯科へ。顔の腫れで息苦しいとき、治らない口内炎は要注意です
        show:
          - type: title
            text: 口・歯・あごの症状
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 歯の感染で顔や首が腫れ、口が開かない・飲み込めない・息苦しいなら救急。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 歯の感染で**顔や首が腫れ、口が開かない・飲み込めない・息苦しい**なら救急。
      - say: 2週間以上治らない口内炎・しこりは、口のがんも考えて受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **2週間以上治らない口内炎・しこり**は、口のがんも考えて受診。
      - say: 歯が抜けたら根に触らず、牛乳に入れて30分以内に歯科へ。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 歯が抜けたら**根に触らず、牛乳に入れて30分以内に歯科**へ。
  - board: whiteboard
    steps:
      - say: 次は、急いで受診です。顔や首の腫れと発熱・口が開かない・息苦しい、感染が広がっている。歯が抜けた・折れた、牛乳に浸して持参。あごの痛みが運動で出る、心臓の病気のことがある。
        show:
          - type: title
            text: 急いで受診
          - type: list
            items:
              - 顔や首の腫れ＋発熱・口が開かない・息苦しい（感染が広がっている）
              - 歯が抜けた・折れた（牛乳に浸して持参）
              - あごの痛みが運動で出る（心臓の病気のことがある）
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。むし歯。しみる、何もしなくても痛い、神経が死ぬ。早めに治療。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**むし歯**"
            text: しみる→何もしなくても痛い→神経が死ぬ。早めに治療
      - say: 歯周病。歯ぐきの腫れ・出血。歯を失う最大の原因。糖尿病などとも関係。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**歯周病**"
            text: 歯ぐきの腫れ・出血。**歯を失う最大の原因**。糖尿病などとも関係
      - say: 口内炎。多くは1〜2週間で治る。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**口内炎**"
            text: 多くは1〜2週間で治る
        read: 口内炎。多くは1から2週間で治る。
  - board: whiteboard
    steps:
      - say: 口腔がん。治らない口内炎、しこり、白や赤の斑点。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**口腔がん**"
            text: 治らない口内炎、しこり、白や赤の斑点
      - say: 顎関節症。口を開けると音がする・痛い。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**顎関節症**"
            text: 口を開けると音がする・痛い
  - board: whiteboard
    steps:
      - say: 次は、予防です。半年〜1年に1回の歯科検診、フッ素入り歯みがき剤、歯間ブラシ・フロス。
        show:
          - type: title
            text: 予防
          - type: text
            text: "**半年〜1年に1回の歯科検診**、フッ素入り歯みがき剤、歯間ブラシ・フロス。"
            w: 1100
        read: 次は、予防です。半年から1年に1回の歯科検診、フッ素入り歯みがき剤、歯間ブラシ・フロス。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 歯の感染で**顔や首が腫れ、口が開かない・飲み込めない・息苦しい**なら救急。
              - ② **2週間以上治らない口内炎・しこり**は、口のがんも考えて受診。
              - ③ 歯が抜けたら**根に触らず、牛乳に入れて30分以内に歯科**へ。
      - say: 歯の感染で顔や首が腫れ、口が開かない・飲み込めない・息苦しいなら救急。2週間以上治らない口内炎・しこりは、口のがんも考えて受診。歯が抜けたら根に触らず、牛乳に入れて30分以内に歯科へ。迷ったときは、ためらわずに、相談や受診をしてください。
