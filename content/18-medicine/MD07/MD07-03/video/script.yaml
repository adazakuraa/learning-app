title: 鼻血・鼻の症状
scenes:
  - board: whiteboard
    steps:
      - say: 「鼻血・鼻の症状」です。鼻血は正しく押さえればほとんど止まります。上を向かないのがポイントです
        show:
          - type: title
            text: 鼻血・鼻の症状
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 鼻血は少し前かがみで、小鼻を指で強くつまんで10分以上押さえる。上を向かない。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 鼻血は**少し前かがみで、小鼻を指で強くつまんで10分以上**押さえる。**上を向かない**。
      - say: 20分押さえても止まらない、大量、頭を打った後は受診、119も。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **20分押さえても止まらない、大量、頭を打った後**は受診（119も）。
        read: 20分押さえても止まらない、大量、頭を打った後は受診、いちいちきゅうも。
      - say: 色のついた鼻水が10日以上続く、顔の痛みがあれば副鼻腔炎のことがある。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 色のついた鼻水が**10日以上**続く、顔の痛みがあれば副鼻腔炎のことがある。
  - board: whiteboard
    steps:
      - say: 次は、鼻血の止め方です。座って少し前かがみ、上を向くと血が喉に流れて吐き気の原因に。小鼻、鼻の柔らかい部分、を親指と人差し指で強くつまむ。10分間離さない。喉に流れた血は飲まずに吐き出す。
        show:
          - type: title
            text: 鼻血の止め方
          - type: list
            items:
              - 座って**少し前かがみ**（上を向くと血が喉に流れて吐き気の原因に）
              - "**小鼻（鼻の柔らかい部分）**を親指と人差し指で強くつまむ"
              - "**10分間離さない**。喉に流れた血は飲まずに吐き出す"
  - board: whiteboard
    steps:
      - say: 次は、受診の目安です。20分押さえても止まらない、勢いよく出る、119も。頭や顔を強く打った後。血をサラサラにする薬を飲んでいる。
        show:
          - type: title
            text: 受診の目安
          - type: list
            items:
              - 20分押さえても止まらない、勢いよく出る（119も）
              - 頭や顔を強く打った後
              - 血をサラサラにする薬を飲んでいる
        read: 次は、受診の目安です。20分押さえても止まらない、勢いよく出る、いちいちきゅうも。頭や顔を強く打った後。血をサラサラにする薬を飲んでいる。
      - say: 何度もくり返す。
        show:
          - type: list
            items:
              - 何度もくり返す
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。アレルギー性鼻炎、花粉症。水っぽい鼻水、くしゃみ、目のかゆみ。
        show:
          - type: title
            text: 鼻のよくある病気
          - type: box
            color: yellow
            w: 1100
            title: "**アレルギー性鼻炎（花粉症）**"
            text: 水っぽい鼻水、くしゃみ、目のかゆみ
      - say: 副鼻腔炎。黄色い鼻水、頬や額の痛み、長引く。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**副鼻腔炎**"
            text: 黄色い鼻水、頬や額の痛み、長引く
      - say: においがしない状態が続くときも、一度受診して相談します。
        show:
          - type: text
            text: "**においがしない**状態が続くときも、一度受診して相談します。"
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 鼻血は**少し前かがみで、小鼻を指で強くつまんで10分以上**押さえる。**上を向かない**。
              - ② **20分押さえても止まらない、大量、頭を打った後**は受診（119も）。
              - ③ 色のついた鼻水が**10日以上**続く、顔の痛みがあれば副鼻腔炎のことがある。
      - say: 鼻血は少し前かがみで、小鼻を指で強くつまんで10分以上押さえる。上を向かない。20分押さえても止まらない、大量、頭を打った後は受診、119も。色のついた鼻水が10日以上続く、顔の痛みがあれば副鼻腔炎のことがある。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 鼻血は少し前かがみで、小鼻を指で強くつまんで10分以上押さえる。上を向かない。20分押さえても止まらない、大量、頭を打った後は受診、いちいちきゅうも。色のついた鼻水が10日以上続く、顔の痛みがあれば副鼻腔炎のことがある。迷ったときは、ためらわずに、相談や受診をしてください。
