title: 目の症状
scenes:
  - board: slide
    steps:
      - say: 第7章、「目・耳・鼻・口の症状」です。
        show:
          - type: title
            text: 第7章　目・耳・鼻・口の症状
      - say: この章では、目の症状、耳の症状、鼻血・鼻の症状、口・歯・あごの症状を学びます。
        show:
          - type: list
            items:
              - 目の症状
              - 耳の症状
              - 鼻血・鼻の症状
              - 口・歯・あごの症状
  - board: whiteboard
    steps:
      - say: 「目の症状」です。目は、時間がたつと視力が戻らない病気が多い臓器です。急な見え方の変化は急いで眼科へ
        show:
          - type: title
            text: 目の症状
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 急に見えなくなった・視野が欠けたは今すぐ受診、片目でも。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **急に見えなくなった・視野が欠けた**は今すぐ受診（片目でも）。
      - say: 黒い点や虫のようなものが急に増えた、光が走るは網膜剥離の前ぶれ。今日中に眼科。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **黒い点や虫のようなものが急に増えた、光が走る**は網膜剥離の前ぶれ。今日中に眼科。
      - say: 強い目の痛みと頭痛・吐き気・かすみは緑内障発作。急ぐ。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **強い目の痛み＋頭痛・吐き気・かすみ**は緑内障発作。急ぐ。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。急に見えない、視野が欠ける、脳卒中のこともある。薬品が目に入った、15分以上流水で洗いながら受診。目のけが、刺さった、強く当たった。
        show:
          - type: title
            text: 今すぐ受診・119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 急に見えない、視野が欠ける（脳卒中のこともある）
              - 薬品が目に入った → **15分以上流水で洗いながら**受診
              - 目のけが（刺さった、強く当たった）
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。急に見えない、視野が欠ける、脳卒中のこともある。薬品が目に入った、15分以上流水で洗いながら受診。目のけが、刺さった、強く当たった。
      - say: 急にものが二重に見えると頭痛・まひ。
        show:
          - type: list
            items:
              - 急にものが二重に見える＋頭痛・まひ
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。黒い点が急に増えた、光が走る、カーテンがかかったように見える、網膜剥離。強い目の痛み、充血、かすみ、緑内障発作。コンタクト使用中の強い痛み・充血、角膜の感染。
        show:
          - type: title
            text: 今日中に眼科
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 黒い点が急に増えた、光が走る、カーテンがかかったように見える（網膜剥離）
              - 強い目の痛み、充血、かすみ（緑内障発作）
              - コンタクト使用中の強い痛み・充血（角膜の感染）
  - board: whiteboard
    steps:
      - say: 次のようなときは、数日以内に受診しましょう。目やに、充血。結膜炎、ウイルス性はうつる。
        show:
          - type: title
            text: 数日以内でよいもの
          - type: tag
            text: 緊急度：中
            color: blue
            at:
              - 1010
              - 52
          - type: box
            color: yellow
            w: 1100
            title: 目やに、充血
            text: "**結膜炎**（ウイルス性はうつる）"
      - say: まぶたの腫れ。ものもらい。
        show:
          - type: box
            color: pink
            w: 1100
            title: まぶたの腫れ
            text: "**ものもらい**"
      - say: 白目が真っ赤、痛みなし。結膜下出血。多くは自然に治る。
        show:
          - type: box
            color: blue
            w: 1100
            title: 白目が真っ赤（痛みなし）
            text: "**結膜下出血**。多くは自然に治る"
  - board: whiteboard
    steps:
      - say: 次は、知っておきたいことです。緑内障は、日本の失明原因の第1位。初期は自覚症状がないので、40歳を過ぎたら一度眼科で検査を。
        show:
          - type: title
            text: 知っておきたいこと
          - type: text
            text: "**緑内障**は、日本の失明原因の第1位。初期は自覚症状がないので、**40歳を過ぎたら一度眼科で検査**を。"
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **急に見えなくなった・視野が欠けた**は今すぐ受診（片目でも）。
              - ② **黒い点や虫のようなものが急に増えた、光が走る**は網膜剥離の前ぶれ。今日中に眼科。
              - ③ **強い目の痛み＋頭痛・吐き気・かすみ**は緑内障発作。急ぐ。
      - say: 急に見えなくなった・視野が欠けたは今すぐ受診、片目でも。黒い点や虫のようなものが急に増えた、光が走るは網膜剥離の前ぶれ。今日中に眼科。強い目の痛みと頭痛・吐き気・かすみは緑内障発作。急ぐ。迷ったときは、ためらわずに、相談や受診をしてください。
