title: 耳の症状
scenes:
  - board: whiteboard
    steps:
      - say: 「耳の症状」です。急に片耳が聞こえなくなる「突発性難聴」は、早く治療を始めるほど回復しやすい病気です
        show:
          - type: title
            text: 耳の症状
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 急に片耳が聞こえにくい、突発性難聴。できるだけ早く耳鼻咽喉科へ、数日以内の治療が大切。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **急に片耳が聞こえにくい**→ 突発性難聴。**できるだけ早く**耳鼻咽喉科へ（数日以内の治療が大切）。
      - say: 聞こえにくさとめまい・ろれつ・まひは脳卒中を考えて119。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 聞こえにくさ＋**めまい・ろれつ・まひ**は脳卒中を考えて119。
        read: 聞こえにくさとめまい・ろれつ・まひは脳卒中を考えていちいちきゅう。
      - say: 耳の痛みと発熱は中耳炎・外耳炎が多い。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 耳の痛みと発熱は中耳炎・外耳炎が多い。
  - board: whiteboard
    steps:
      - say: 次は、急いで受診です。急な片耳の聞こえにくさ、耳が詰まった感じ、突発性難聴。聞こえにくさとめまい・神経の症状、119。耳の後ろが赤く腫れて痛い、高熱。
        show:
          - type: title
            text: 急いで受診
          - type: list
            items:
              - 急な片耳の聞こえにくさ、耳が詰まった感じ（突発性難聴）
              - 聞こえにくさ＋めまい・神経の症状（119）
              - 耳の後ろが赤く腫れて痛い、高熱
        read: 次は、急いで受診です。急な片耳の聞こえにくさ、耳が詰まった感じ、突発性難聴。聞こえにくさとめまい・神経の症状、いちいちきゅう。耳の後ろが赤く腫れて痛い、高熱。
      - say: けがの後、耳から血や透明な液。
        show:
          - type: list
            items:
              - けがの後、耳から血や透明な液
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。突発性難聴。片耳が急に聞こえない。早期治療で回復しやすい。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**突発性難聴**"
            text: 片耳が急に聞こえない。早期治療で回復しやすい
      - say: 中耳炎。子どもに多い。耳の痛み、発熱。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**中耳炎**"
            text: 子どもに多い。耳の痛み、発熱
      - say: 耳垢が詰まる。耳鼻科で取ってもらう。綿棒で奥へ押し込まない。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**耳垢が詰まる**"
            text: 耳鼻科で取ってもらう。綿棒で奥へ押し込まない
  - board: whiteboard
    steps:
      - say: 加齢性難聴。高い音から聞こえにくくなる。補聴器の相談を。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**加齢性難聴**"
            text: 高い音から聞こえにくくなる。**補聴器**の相談を
      - say: 耳鳴りが片側だけ、または脈と同じリズムなら受診して相談します。
        show:
          - type: text
            text: 耳鳴りが**片側だけ**、または**脈と同じリズム**なら受診して相談します。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **急に片耳が聞こえにくい**→ 突発性難聴。**できるだけ早く**耳鼻咽喉科へ（数日以内の治療が大切）。
              - ② 聞こえにくさ＋**めまい・ろれつ・まひ**は脳卒中を考えて119。
              - ③ 耳の痛みと発熱は中耳炎・外耳炎が多い。
      - say: 急に片耳が聞こえにくい、突発性難聴。できるだけ早く耳鼻咽喉科へ、数日以内の治療が大切。聞こえにくさとめまい・ろれつ・まひは脳卒中を考えて119。耳の痛みと発熱は中耳炎・外耳炎が多い。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 急に片耳が聞こえにくい、突発性難聴。できるだけ早く耳鼻咽喉科へ、数日以内の治療が大切。聞こえにくさとめまい・ろれつ・まひは脳卒中を考えていちいちきゅう。耳の痛みと発熱は中耳炎・外耳炎が多い。迷ったときは、ためらわずに、相談や受診をしてください。
