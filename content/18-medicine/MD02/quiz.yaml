questions:
  - q: 「突然の、今までで最悪の頭痛」で、まず疑うべき病気は何か。
    a: [くも膜下出血]
  - q: 脳卒中のサイン「FAST」。F（顔）、A（腕）、S（言葉）。最後の T は何を表すか。
    a: [時間, Time, 発症時刻]
    show: Time（時間）。すぐ119、発症時刻を確認
  - q: けいれんが何分以上続いたら119を呼ぶか。
    a: ['5', 5分]
    show: 5分
  - q: 頭を打った人は、打ったあと何時間は一人にしないほうがよいか。
    a: ['24', 24時間]
    show: 24時間
