title: 頭を打ったとき
scenes:
  - board: whiteboard
    steps:
      - say: 「頭を打ったとき」です。頭のけがは、打った直後だけでなく数時間〜数週間後に悪化することがあります
        show:
          - type: title
            text: 頭を打ったとき
        read: 「頭を打ったとき」です。頭のけがは、打った直後だけでなく数時間から数週間後に悪化することがあります
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 頭を打って意識を失った、吐くのをくり返す、ぼんやりする、けいれんなら119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 頭を打って**意識を失った、吐くのをくり返す、ぼんやりする、けいれん**なら119。
        read: 頭を打って意識を失った、吐くのをくり返す、ぼんやりする、けいれんならいちいちきゅう。
      - say: 血をサラサラにする薬を飲んでいる人・高齢者は、軽く打っただけでも受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **血をサラサラにする薬**を飲んでいる人・高齢者は、軽く打っただけでも受診。
      - say: 打った後24時間は一人にしない。高齢者は数週間後の物忘れ・歩きにくさ、慢性硬膜下血腫、にも注意。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 打った後**24時間は一人にしない**。高齢者は**数週間後の物忘れ・歩きにくさ**（慢性硬膜下血腫）にも注意。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。意識を失った、呼びかけへの反応が悪い。何度も吐く、どんどん強くなる頭痛。けいれん、手足のまひ。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 意識を失った、呼びかけへの反応が悪い
              - "**何度も吐く**、どんどん強くなる頭痛"
              - けいれん、手足のまひ
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。意識を失った、呼びかけへの反応が悪い。何度も吐く、どんどん強くなる頭痛。けいれん、手足のまひ。
      - say: 耳や鼻から透明な液や血が出る。首の痛み・手足のしびれ、首のけがの可能性、首を動かさない。
        show:
          - type: list
            items:
              - 耳や鼻から**透明な液や血**が出る
              - 首の痛み・手足のしびれ（首のけがの可能性：**首を動かさない**）
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。抗凝固薬・抗血小板薬を飲んでいる、65歳以上。打ったときのことを覚えていない。高い所からの転落、交通事故など強い衝撃。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 抗凝固薬・抗血小板薬を飲んでいる、65歳以上
              - 打ったときのことを覚えていない
              - 高い所からの転落、交通事故など強い衝撃
  - board: whiteboard
    steps:
      - say: 一方で、次のような場合は、家で様子を見てよいことが多いです。すぐ泣いた・すぐ普段どおりに戻った、吐かない、こぶだけ。24時間は様子を見て、上のサインが出たら受診。
        show:
          - type: title
            text: 様子見でよい目安
          - type: tag
            text: 緊急度：低
            color: green
            at:
              - 1010
              - 52
          - type: text
            text: すぐ泣いた・すぐ普段どおりに戻った、吐かない、こぶだけ。**24時間は様子を見て**、上のサインが出たら受診。
            w: 1100
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。急性硬膜下血腫・硬膜外血腫。頭の中に出血。数時間で意識が悪くなる。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**急性硬膜下血腫・硬膜外血腫**"
            text: 頭の中に出血。数時間で意識が悪くなる
      - say: 脳しんとう。一時的な脳の機能障害。頭痛・ぼんやり。スポーツは回復まで休む。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**脳しんとう**"
            text: 一時的な脳の機能障害。頭痛・ぼんやり。スポーツは回復まで休む
      - say: 慢性硬膜下血腫。高齢者で数週間後に、物忘れ・歩きにくさ・片側の力が弱い。手術で治る。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**慢性硬膜下血腫**"
            text: 高齢者で数週間後に、物忘れ・歩きにくさ・片側の力が弱い。手術で治る
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 頭を打って**意識を失った、吐くのをくり返す、ぼんやりする、けいれん**なら119。
              - ② **血をサラサラにする薬**を飲んでいる人・高齢者は、軽く打っただけでも受診。
              - ③ 打った後**24時間は一人にしない**。高齢者は**数週間後の物忘れ・歩きにくさ**（慢性硬膜下血腫）にも注意。
      - say: 頭を打って意識を失った、吐くのをくり返す、ぼんやりする、けいれんなら119。血をサラサラにする薬を飲んでいる人・高齢者は、軽く打っただけでも受診。打った後24時間は一人にしない。高齢者は数週間後の物忘れ・歩きにくさ、慢性硬膜下血腫、にも注意。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 頭を打って意識を失った、吐くのをくり返す、ぼんやりする、けいれんならいちいちきゅう。血をサラサラにする薬を飲んでいる人・高齢者は、軽く打っただけでも受診。打った後24時間は一人にしない。高齢者は数週間後の物忘れ・歩きにくさ、慢性硬膜下血腫、にも注意。迷ったときは、ためらわずに、相談や受診をしてください。
