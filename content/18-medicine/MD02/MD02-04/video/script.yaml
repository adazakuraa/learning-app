title: 意識がおかしい・失神・けいれん
scenes:
  - board: whiteboard
    steps:
      - say: 「意識がおかしい・失神・けいれん」です。反応が鈍い・倒れた・けいれんしたときの対応と、119の目安を学びます
        show:
          - type: title
            text: 意識がおかしい・失神・けいれん
        read: 「意識がおかしい・失神・けいれん」です。反応が鈍い・倒れた・けいれんしたときの対応と、いちいちきゅうの目安を学びます
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 呼びかけに反応しない、または呼吸がおかしいなら119と心肺蘇生、第12章。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **呼びかけに反応しない、または呼吸がおかしい**なら119と心肺蘇生（第12章）。
        read: 呼びかけに反応しない、または呼吸がおかしいならいちいちきゅうと心肺蘇生、第12章。
      - say: 失神はすぐ意識が戻っても、運動中・胸痛・動悸を伴うなら心臓を疑い受診。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 失神は**すぐ意識が戻っても**、運動中・胸痛・動悸を伴うなら心臓を疑い受診。
      - say: けいれんは口に物を入れず、横向きにして時間を測る。5分以上続けば119。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ けいれんは**口に物を入れず、横向き**にして時間を測る。**5分以上**続けば119。
        read: けいれんは口に物を入れず、横向きにして時間を測る。5分以上続けばいちいちきゅう。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。呼びかけに反応しない、反応が鈍い、話がおかしい。失神と胸の痛み・動悸・息苦しさ、運動中に倒れた、横になっていて失神。けいれんが5分以上続く、くり返す、初めてのけいれん。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 呼びかけに反応しない、反応が鈍い、話がおかしい
              - 失神＋**胸の痛み・動悸・息苦しさ**、**運動中に倒れた**、**横になっていて失神**
              - けいれんが**5分以上**続く、くり返す、初めてのけいれん
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。呼びかけに反応しない、反応が鈍い、話がおかしい。失神と胸の痛み・動悸・息苦しさ、運動中に倒れた、横になっていて失神。けいれんが5分以上続く、くり返す、初めてのけいれん。
      - say: 糖尿病の薬を使っている人の意識障害、低血糖。
        show:
          - type: list
            items:
              - 糖尿病の薬を使っている人の意識障害（低血糖）
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。一瞬の失神で、すぐ元に戻ったが原因がはっきりしない。てんかんの持病がある人の、いつもと違う発作。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 一瞬の失神で、すぐ元に戻ったが原因がはっきりしない
              - てんかんの持病がある人の、いつもと違う発作
  - board: whiteboard
    steps:
      - say: 一方で、次のような場合は、家で様子を見てよいことが多いです。長く立っていた・痛み・恐怖などの後に、前ぶれ、気持ち悪い、目の前が暗い、があって倒れ、すぐ元に戻った若い人、血管迷走神経反射。それでも初めてなら一度受診を。
        show:
          - type: title
            text: 様子見でよいことが多いもの
          - type: tag
            text: 緊急度：低
            color: green
            at:
              - 1010
              - 52
          - type: text
            text: 長く立っていた・痛み・恐怖などの後に、**前ぶれ（気持ち悪い、目の前が暗い）**があって倒れ、すぐ元に戻った若い人（**血管迷走神経反射**）。それでも初めてなら一度受診を。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、けいれんのときにすることです。周りの危ない物をどけ、時間を測る。口に物を入れない、押さえつけない。止まったら横向き、回復体位、にして呼吸を確認。
        show:
          - type: title
            text: けいれんのときにすること
          - type: list
            items:
              - 周りの危ない物をどけ、**時間を測る**。
              - "**口に物を入れない**、押さえつけない。"
              - 止まったら**横向き**（回復体位）にして呼吸を確認。
      - say: 動画を撮っておくと診察に役立つ。
        show:
          - type: list
            items:
              - 動画を撮っておくと診察に役立つ。
  - board: whiteboard
    steps:
      - say: 次は、低血糖を疑ったらです。糖尿病の治療中で、冷や汗・ふるえ・ぼんやり、意識があればブドウ糖や砂糖入りジュース。意識がなければ口に入れず119。
        show:
          - type: title
            text: 低血糖を疑ったら
          - type: text
            text: 糖尿病の治療中で、冷や汗・ふるえ・ぼんやり → **意識があれば**ブドウ糖や砂糖入りジュース。意識がなければ口に入れず119。
            w: 1100
        read: 次は、低血糖を疑ったらです。糖尿病の治療中で、冷や汗・ふるえ・ぼんやり、意識があればブドウ糖や砂糖入りジュース。意識がなければ口に入れずいちいちきゅう。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **呼びかけに反応しない、または呼吸がおかしい**なら119と心肺蘇生（第12章）。
              - ② 失神は**すぐ意識が戻っても**、運動中・胸痛・動悸を伴うなら心臓を疑い受診。
              - ③ けいれんは**口に物を入れず、横向き**にして時間を測る。**5分以上**続けば119。
      - say: 呼びかけに反応しない、または呼吸がおかしいなら119と心肺蘇生、第12章。失神はすぐ意識が戻っても、運動中・胸痛・動悸を伴うなら心臓を疑い受診。けいれんは口に物を入れず、横向きにして時間を測る。5分以上続けば119。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 呼びかけに反応しない、または呼吸がおかしいならいちいちきゅうと心肺蘇生、第12章。失神はすぐ意識が戻っても、運動中・胸痛・動悸を伴うなら心臓を疑い受診。けいれんは口に物を入れず、横向きにして時間を測る。5分以上続けばいちいちきゅう。迷ったときは、ためらわずに、相談や受診をしてください。
