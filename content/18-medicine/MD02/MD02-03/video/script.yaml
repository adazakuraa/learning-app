title: 脳卒中
scenes:
  - board: whiteboard
    steps:
      - say: 「脳卒中」です。脳卒中は時間との勝負です。「BE-FAST」で疑い、発症時刻を確認してすぐ119
        show:
          - type: title
            text: 脳卒中
        read: 「脳卒中」です。脳卒中は時間との勝負です。「BE-FAST」で疑い、発症時刻を確認してすぐいちいちきゅう
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 顔のゆがみ・片腕が上がらない・ろれつのどれか1つでも出たらすぐ119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **顔のゆがみ・片腕が上がらない・ろれつ**のどれか1つでも出たら**すぐ119**。
        read: 顔のゆがみ・片腕が上がらない・ろれつのどれか1つでも出たらすぐいちいちきゅう。
      - say: 発症した時刻、最後に普段どおりだった時刻、を必ず伝える。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **発症した時刻**（最後に普段どおりだった時刻）を必ず伝える。
      - say: 症状が数分で消えても受診が必要、脳梗塞の前ぶれ。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 症状が数分で消えても**受診が必要**（脳梗塞の前ぶれ）。
  - board: whiteboard
    steps:
      - say: 次は、脳卒中を疑う「FAST」です。Face、顔。「イー」と笑うと片側が下がる。
        show:
          - type: title
            text: 脳卒中を疑う「FAST」
          - type: box
            color: yellow
            w: 1100
            title: "**F**ace（顔）"
            text: 「イー」と笑うと片側が下がる
      - say: Arm、腕。両腕を前に上げると片方が下がる。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**A**rm（腕）"
            text: 両腕を前に上げると片方が下がる
      - say: Speech、言葉。ろれつが回らない、言葉が出ない。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**S**peech（言葉）"
            text: ろれつが回らない、言葉が出ない
  - board: whiteboard
    steps:
      - say: Time、時間。すぐ119、発症時刻を確認。
        show:
          - type: title
            text: 脳卒中を疑う「FAST」（つづき）
          - type: box
            color: green
            w: 1100
            title: "**T**ime（時間）"
            text: すぐ119、発症時刻を確認
        read: Time、時間。すぐいちいちきゅう、発症時刻を確認。
      - say: ほかに、急に片目が見えない・ものが二重、急にまっすぐ歩けないも脳卒中のサインです。
        show:
          - type: text
            text: ほかに、**急に片目が見えない・ものが二重**、**急にまっすぐ歩けない**も脳卒中のサインです。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、なぜ急ぐのかです。脳梗塞は、発症から数時間以内なら、血の塊を溶かす薬やカテーテルで詰まりを取る治療ができ、後遺症を減らせます。時間がたつほど脳が死んでいきます。
        show:
          - type: title
            text: なぜ急ぐのか
          - type: text
            text: 脳梗塞は、発症から**数時間以内**なら、血の塊を溶かす薬やカテーテルで詰まりを取る治療ができ、後遺症を減らせます。時間がたつほど脳が死んでいきます。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、脳卒中の種類です。脳梗塞。脳の血管が詰まる。最も多い。
        show:
          - type: title
            text: 脳卒中の種類
          - type: box
            color: yellow
            w: 1100
            title: "**脳梗塞**"
            text: 脳の血管が詰まる。最も多い
      - say: 脳出血。脳の中の血管が破れる。高血圧が大きな原因。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**脳出血**"
            text: 脳の中の血管が破れる。高血圧が大きな原因
      - say: くも膜下出血。脳の表面の血管のこぶが破れる。突然の激しい頭痛。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**くも膜下出血**"
            text: 脳の表面の血管のこぶが破れる。突然の激しい頭痛
  - board: whiteboard
    steps:
      - say: 一過性脳虚血発作、TIA。症状が数分〜24時間以内に消える。脳梗塞の前ぶれ。
        show:
          - type: title
            text: 脳卒中の種類（つづき）
          - type: box
            color: green
            w: 1100
            title: "**一過性脳虚血発作（TIA）**"
            text: 症状が数分〜24時間以内に消える。脳梗塞の前ぶれ
        read: 一過性脳虚血発作、TIA。症状が数分から24時間以内に消える。脳梗塞の前ぶれ。
  - board: whiteboard
    steps:
      - say: 次は、予防です。高血圧の治療、禁煙、糖尿病・脂質異常症の管理、心房細動、不整脈、の治療。
        show:
          - type: title
            text: 予防
          - type: text
            text: "**高血圧の治療**、禁煙、糖尿病・脂質異常症の管理、**心房細動**（不整脈）の治療。"
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **顔のゆがみ・片腕が上がらない・ろれつ**のどれか1つでも出たら**すぐ119**。
              - ② **発症した時刻**（最後に普段どおりだった時刻）を必ず伝える。
              - ③ 症状が数分で消えても**受診が必要**（脳梗塞の前ぶれ）。
      - say: 顔のゆがみ・片腕が上がらない・ろれつのどれか1つでも出たらすぐ119。発症した時刻、最後に普段どおりだった時刻、を必ず伝える。症状が数分で消えても受診が必要、脳梗塞の前ぶれ。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 顔のゆがみ・片腕が上がらない・ろれつのどれか1つでも出たらすぐいちいちきゅう。発症した時刻、最後に普段どおりだった時刻、を必ず伝える。症状が数分で消えても受診が必要、脳梗塞の前ぶれ。迷ったときは、ためらわずに、相談や受診をしてください。
