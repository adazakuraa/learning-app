title: めまい
scenes:
  - board: whiteboard
    steps:
      - say: 「めまい」です。多くは耳のトラブルですが、脳卒中のめまいを見逃さないことが大切です
        show:
          - type: title
            text: めまい
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: めまいとろれつ・まひ・ものが二重・まっすぐ歩けないは脳卒中を考えて119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① めまい＋**ろれつ・まひ・ものが二重・まっすぐ歩けない**は脳卒中を考えて119。
        read: めまいとろれつ・まひ・ものが二重・まっすぐ歩けないは脳卒中を考えていちいちきゅう。
      - say: 頭を動かしたときだけ数十秒ぐるぐる回るのは、耳の病気、良性発作性頭位めまい症、が多い。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 頭を動かしたときだけ数十秒ぐるぐる回るのは、耳の病気（良性発作性頭位めまい症）が多い。
      - say: 立ちくらみ・気が遠くなる感じは、脱水・貧血・心臓のこともある。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 立ちくらみ・気が遠くなる感じは、脱水・貧血・心臓のこともある。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。めまいとろれつが回らない、手足のまひ・しびれ、顔のゆがみ、ものが二重。まっすぐ座れない・立てないほどのふらつき。めまいと激しい頭痛、胸の痛み・動悸、失神。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - めまい＋**ろれつが回らない、手足のまひ・しびれ、顔のゆがみ、ものが二重**
              - "**まっすぐ座れない・立てない**ほどのふらつき"
              - めまい＋**激しい頭痛**、**胸の痛み・動悸**、**失神**
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。めまいとろれつが回らない、手足のまひ・しびれ、顔のゆがみ、ものが二重。まっすぐ座れない・立てないほどのふらつき。めまいと激しい頭痛、胸の痛み・動悸、失神。
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。初めての強い回転性めまいで、吐いて動けない。急な片耳の聞こえにくさを伴う、突発性難聴は早めの治療が必要。高齢者、血管の病気の持病がある人。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 初めての強い回転性めまいで、吐いて動けない
              - 急な**片耳の聞こえにくさ**を伴う（突発性難聴は早めの治療が必要）
              - 高齢者、血管の病気の持病がある人
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。良性発作性頭位めまい症。寝返りや起き上がりで数十秒ぐるぐる。最も多い。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**良性発作性頭位めまい症**"
            text: 寝返りや起き上がりで数十秒ぐるぐる。最も多い
      - say: メニエール病。めまいと耳鳴り・聞こえにくさをくり返す。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**メニエール病**"
            text: めまい＋耳鳴り・聞こえにくさをくり返す
      - say: 脳卒中、小脳・脳幹。ふらつきが強く歩けない。ほかの神経症状。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**脳卒中（小脳・脳幹）**"
            text: ふらつきが強く歩けない。ほかの神経症状
  - board: whiteboard
    steps:
      - say: 起立性低血圧。立ち上がったときのくらっと感。脱水・薬。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**起立性低血圧**"
            text: 立ち上がったときのくらっと感。脱水・薬
  - board: whiteboard
    steps:
      - say: 自分でできることも、覚えておきましょう。安全な場所で横になり、転倒を防ぐ。水分をとる。車の運転はしない。
        show:
          - type: title
            text: 自分でできること
          - type: text
            text: 安全な場所で横になり、転倒を防ぐ。水分をとる。車の運転はしない。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① めまい＋**ろれつ・まひ・ものが二重・まっすぐ歩けない**は脳卒中を考えて119。
              - ② 頭を動かしたときだけ数十秒ぐるぐる回るのは、耳の病気（良性発作性頭位めまい症）が多い。
              - ③ 立ちくらみ・気が遠くなる感じは、脱水・貧血・心臓のこともある。
      - say: めまいとろれつ・まひ・ものが二重・まっすぐ歩けないは脳卒中を考えて119。頭を動かしたときだけ数十秒ぐるぐる回るのは、耳の病気、良性発作性頭位めまい症、が多い。立ちくらみ・気が遠くなる感じは、脱水・貧血・心臓のこともある。迷ったときは、ためらわずに、相談や受診をしてください。
        read: めまいとろれつ・まひ・ものが二重・まっすぐ歩けないは脳卒中を考えていちいちきゅう。頭を動かしたときだけ数十秒ぐるぐる回るのは、耳の病気、良性発作性頭位めまい症、が多い。立ちくらみ・気が遠くなる感じは、脱水・貧血・心臓のこともある。迷ったときは、ためらわずに、相談や受診をしてください。
