title: 頭痛
scenes:
  - board: slide
    steps:
      - say: 第2章、「頭・神経の症状」です。
        show:
          - type: title
            text: 第2章　頭・神経の症状
      - say: この章では、頭痛、めまい、脳卒中、意識がおかしい・失神・けいれん、頭を打ったときを学びます。
        show:
          - type: list
            items:
              - 頭痛
              - めまい
              - 脳卒中
              - 意識がおかしい・失神・けいれん
              - 頭を打ったとき
  - board: whiteboard
    steps:
      - say: 「頭痛」です。ほとんどの頭痛は心配ありませんが、くも膜下出血などの危険な頭痛は「突然」「最悪」が特徴です
        show:
          - type: title
            text: 頭痛
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 突然の、今までで最悪の頭痛は、くも膜下出血を考えてすぐ119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **突然の、今までで最悪の頭痛**は、くも膜下出血を考えて**すぐ119**。
        read: 突然の、今までで最悪の頭痛は、くも膜下出血を考えてすぐいちいちきゅう。
      - say: 頭痛に発熱と首が硬い、手足のまひ・ろれつが加わったら119。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 頭痛に**発熱＋首が硬い**、**手足のまひ・ろれつ**が加わったら119。
        read: 頭痛に発熱と首が硬い、手足のまひ・ろれつが加わったらいちいちきゅう。
      - say: いつもと同じパターンの頭痛、片頭痛・緊張型、なら様子見でよい。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ いつもと同じパターンの頭痛（片頭痛・緊張型）なら様子見でよい。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。突然始まった、今までで最悪の頭痛、バットで殴られたような。頭痛と手足のまひ・しびれ、ろれつが回らない、ものが二重に見える。頭痛と意識がぼんやり、けいれん。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - "**突然**始まった、**今までで最悪**の頭痛（バットで殴られたような）"
              - 頭痛＋**手足のまひ・しびれ、ろれつが回らない、ものが二重に見える**
              - 頭痛＋**意識がぼんやり、けいれん**
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。突然始まった、今までで最悪の頭痛、バットで殴られたような。頭痛と手足のまひ・しびれ、ろれつが回らない、ものが二重に見える。頭痛と意識がぼんやり、けいれん。
      - say: 頭痛と高熱と首が硬い、あごを胸につけられない。
        show:
          - type: list
            items:
              - 頭痛＋**高熱＋首が硬い**（あごを胸につけられない）
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。数日〜数週間でだんだん強くなる頭痛、朝に吐く。50歳以上で初めての頭痛。頭を打った後の頭痛、第2章の5。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 数日〜数週間で**だんだん強くなる**頭痛、朝に吐く
              - "**50歳以上で初めて**の頭痛"
              - "**頭を打った後**の頭痛（第2章の5）"
        read: 次のようなときは、夜間や休日でも、今日中に受診しましょう。数日から数週間でだんだん強くなる頭痛、朝に吐く。50歳以上で初めての頭痛。頭を打った後の頭痛、第2章の5。
      - say: 目が痛く、かすむ、緑内障発作。
        show:
          - type: list
            items:
              - 目が痛く、かすむ（緑内障発作）
  - board: whiteboard
    steps:
      - say: 一方で、次のような場合は、家で様子を見てよいことが多いです。いつもの頭痛と同じパターンで、痛み止めで和らぎ、ほかの症状がない。
        show:
          - type: title
            text: 様子見でよい目安
          - type: tag
            text: 緊急度：低
            color: green
            at:
              - 1010
              - 52
          - type: text
            text: いつもの頭痛と同じパターンで、痛み止めで和らぎ、ほかの症状がない。
            w: 1100
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。片頭痛。ズキンズキン、吐き気、光や音がつらい。動くと悪化。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**片頭痛**"
            text: ズキンズキン、吐き気、光や音がつらい。動くと悪化
      - say: 緊張型頭痛。頭全体をしめつける。肩こり・ストレス。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**緊張型頭痛**"
            text: 頭全体をしめつける。肩こり・ストレス
      - say: くも膜下出血。脳の血管のこぶが破れる。突然の激痛。命にかかわる。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**くも膜下出血**"
            text: 脳の血管のこぶが破れる。突然の激痛。命にかかわる
  - board: whiteboard
    steps:
      - say: 髄膜炎。脳を包む膜の感染。発熱・頭痛・首の硬さ。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**髄膜炎**"
            text: 脳を包む膜の感染。発熱・頭痛・首の硬さ
      - say: 痛み止めを月に10日以上使うと、かえって頭痛が増えることがあります、薬の飲みすぎによる頭痛。
        show:
          - type: text
            text: 痛み止めを**月に10日以上**使うと、かえって頭痛が増えることがあります（薬の飲みすぎによる頭痛）。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **突然の、今までで最悪の頭痛**は、くも膜下出血を考えて**すぐ119**。
              - ② 頭痛に**発熱＋首が硬い**、**手足のまひ・ろれつ**が加わったら119。
              - ③ いつもと同じパターンの頭痛（片頭痛・緊張型）なら様子見でよい。
      - say: 突然の、今までで最悪の頭痛は、くも膜下出血を考えてすぐ119。頭痛に発熱と首が硬い、手足のまひ・ろれつが加わったら119。いつもと同じパターンの頭痛、片頭痛・緊張型、なら様子見でよい。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 突然の、今までで最悪の頭痛は、くも膜下出血を考えてすぐいちいちきゅう。頭痛に発熱と首が硬い、手足のまひ・ろれつが加わったらいちいちきゅう。いつもと同じパターンの頭痛、片頭痛・緊張型、なら様子見でよい。迷ったときは、ためらわずに、相談や受診をしてください。
