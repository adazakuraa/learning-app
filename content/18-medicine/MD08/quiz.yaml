questions:
  - q: 思春期の男子などで、陰嚢（睾丸）に突然の激痛が出たとき疑われる、6時間以内の手術が必要な病気は何か。
    a: [精巣捻転]
  - q: 妊娠の可能性がある人の下腹部痛と出血で、注意すべき病気は何か。
    a: [子宮外妊娠]
  - q: 妊娠中の強い頭痛・目のチカチカ・急なむくみは、何という病気のサインか。
    a: [妊娠高血圧症候群]
    r: [にんしんこうけつあつしょうこうぐん]
  - q: 産後うつは、およそ何人に1人に起こるとされるか。
    a: ['10', 10人, 約10人]
    show: 約10人に1人
