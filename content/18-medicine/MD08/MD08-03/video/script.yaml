title: 妊娠中・産後の症状
scenes:
  - board: whiteboard
    steps:
      - say: 「妊娠中・産後の症状」です。妊娠中は「迷ったら、かかりつけの産科に電話」が基本です。産後うつは誰にでも起こりえます
        show:
          - type: title
            text: 妊娠中・産後の症状
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 妊娠中の出血・破水・規則的なおなかの張り・胎動が減ったは、すぐ産科に電話。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 妊娠中の**出血・破水・規則的なおなかの張り・胎動が減った**は、すぐ産科に電話。
      - say: 強い頭痛・目がチカチカ・上腹部の痛み・急なむくみは妊娠高血圧症候群のサイン。急ぐ。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **強い頭痛・目がチカチカ・上腹部の痛み・急なむくみ**は妊娠高血圧症候群のサイン。急ぐ。
      - say: 産後の気分の落ち込みが2週間以上続くときは、恥ずかしがらず相談、産後うつは約10人に1人。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 産後の**気分の落ち込みが2週間以上**続くときは、恥ずかしがらず相談（産後うつは約10人に1人）。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。出血、破水、水のようなものが流れる。規則的なおなかの張りや痛み、37週未満は早産のおそれ。赤ちゃんの動きが明らかに少ない。
        show:
          - type: title
            text: すぐ産科に電話（119も）
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 出血、破水（水のようなものが流れる）
              - 規則的なおなかの張りや痛み（37週未満は早産のおそれ）
              - 赤ちゃんの動きが明らかに少ない
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。出血、破水、水のようなものが流れる。規則的なおなかの張りや痛み、37週未満は早産のおそれ。赤ちゃんの動きが明らかに少ない。
      - say: 強い頭痛、目のチカチカ、上腹部の痛み、けいれん。持続する強い腹痛。
        show:
          - type: list
            items:
              - 強い頭痛、目のチカチカ、上腹部の痛み、けいれん
              - 持続する強い腹痛
  - board: whiteboard
    steps:
      - say: 次は、妊娠中の注意です。市販薬は医師・薬剤師に相談してから。生肉、加熱不足の食品、ナチュラルチーズは避ける。お酒とたばこはやめる。
        show:
          - type: title
            text: 妊娠中の注意
          - type: list
            items:
              - 市販薬は医師・薬剤師に相談してから。
              - 生肉、加熱不足の食品、ナチュラルチーズは避ける。
              - お酒とたばこはやめる。
  - board: whiteboard
    steps:
      - say: 次は、産後です。大量の出血、発熱、片足の腫れ・息苦しさ、受診。産後うつ、気分の落ち込み、眠れない、赤ちゃんをかわいく思えない、自分を責める。治療で良くなります。産科・保健師・心療内科に相談。
        show:
          - type: title
            text: 産後
          - type: list
            items:
              - 大量の出血、発熱、片足の腫れ・息苦しさ → 受診。
              - "**産後うつ**：気分の落ち込み、眠れない、赤ちゃんをかわいく思えない、自分を責める。**治療で良くなります**。産科・保健師・心療内科に相談。"
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 妊娠中の**出血・破水・規則的なおなかの張り・胎動が減った**は、すぐ産科に電話。
              - ② **強い頭痛・目がチカチカ・上腹部の痛み・急なむくみ**は妊娠高血圧症候群のサイン。急ぐ。
              - ③ 産後の**気分の落ち込みが2週間以上**続くときは、恥ずかしがらず相談（産後うつは約10人に1人）。
      - say: 妊娠中の出血・破水・規則的なおなかの張り・胎動が減ったは、すぐ産科に電話。強い頭痛・目がチカチカ・上腹部の痛み・急なむくみは妊娠高血圧症候群のサイン。急ぐ。産後の気分の落ち込みが2週間以上続くときは、恥ずかしがらず相談、産後うつは約10人に1人。迷ったときは、ためらわずに、相談や受診をしてください。
