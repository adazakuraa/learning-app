title: 排尿の症状
scenes:
  - board: slide
    steps:
      - say: 第8章、「泌尿器・女性・妊娠の症状」です。
        show:
          - type: title
            text: 第8章　泌尿器・女性・妊娠の症状
      - say: この章では、排尿の症状、女性の症状、妊娠中・産後の症状を学びます。
        show:
          - type: list
            items:
              - 排尿の症状
              - 女性の症状：月経・不正出血・下腹部痛
              - 妊娠中・産後の症状
  - board: whiteboard
    steps:
      - say: 「排尿の症状」です。尿が出ない・血尿・陰嚢の激痛など、泌尿器の急ぐサインを学びます
        show:
          - type: title
            text: 排尿の症状
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 尿がまったく出ず、下腹部がパンパンなら今日中、つらければ119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **尿がまったく出ず、下腹部がパンパン**なら今日中（つらければ119）。
        read: 尿がまったく出ず、下腹部がパンパンなら今日中、つらければいちいちきゅう。
      - say: 陰嚢、睾丸、の突然の激痛は精巣捻転。6時間以内の手術が必要なので119。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **陰嚢（睾丸）の突然の激痛**は精巣捻転。**6時間以内**の手術が必要なので119。
        read: 陰嚢、睾丸、の突然の激痛は精巣捻転。6時間以内の手術が必要なのでいちいちきゅう。
      - say: 痛みのない血尿も、膀胱がん・腎臓がんのことがあるので必ず受診。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **痛みのない血尿**も、膀胱がん・腎臓がんのことがあるので必ず受診。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。尿が出ない、下腹部が張って痛い、尿閉。陰嚢の突然の激痛、特に思春期の男子。発熱・寒気と背中や脇腹の痛み、腎盂腎炎。
        show:
          - type: title
            text: すぐ119・今日中に受診
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 尿が出ない、下腹部が張って痛い（尿閉）
              - 陰嚢の突然の激痛（特に思春期の男子）
              - 発熱・寒気＋背中や脇腹の痛み（腎盂腎炎）
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。尿が出ない、下腹部が張って痛い、尿閉。陰嚢の突然の激痛、特に思春期の男子。発熱・寒気と背中や脇腹の痛み、腎盂腎炎。
      - say: 脇腹から下腹部への波のある激痛、尿管結石。
        show:
          - type: list
            items:
              - 脇腹から下腹部への波のある激痛（尿管結石）
  - board: whiteboard
    steps:
      - say: 次のようなときは、数日以内に受診しましょう。血尿、痛みがなくても。排尿時の痛み、残尿感、膀胱炎。尿の勢いが弱い、夜何度もトイレに起きる、前立腺肥大。
        show:
          - type: title
            text: 数日以内に受診
          - type: tag
            text: 緊急度：中
            color: blue
            at:
              - 1010
              - 52
          - type: list
            items:
              - 血尿（痛みがなくても）
              - 排尿時の痛み、残尿感（膀胱炎）
              - 尿の勢いが弱い、夜何度もトイレに起きる（前立腺肥大）
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。膀胱炎。女性に多い。排尿時の痛み。水分をとり受診。
        show:
          - type: title
            text: 知っておきたい病気
          - type: box
            color: yellow
            w: 1100
            title: "**膀胱炎**"
            text: 女性に多い。排尿時の痛み。水分をとり受診
      - say: 尿管結石。激痛と血尿。自然に出ることも多い。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**尿管結石**"
            text: 激痛と血尿。自然に出ることも多い
      - say: 前立腺肥大症。中高年男性。尿が出にくい。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**前立腺肥大症**"
            text: 中高年男性。尿が出にくい
  - board: whiteboard
    steps:
      - say: 精巣捻転。精巣がねじれる。時間との勝負。
        show:
          - type: title
            text: 知っておきたい病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**精巣捻転**"
            text: 精巣がねじれる。時間との勝負
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① **尿がまったく出ず、下腹部がパンパン**なら今日中（つらければ119）。
              - ② **陰嚢（睾丸）の突然の激痛**は精巣捻転。**6時間以内**の手術が必要なので119。
              - ③ **痛みのない血尿**も、膀胱がん・腎臓がんのことがあるので必ず受診。
      - say: 尿がまったく出ず、下腹部がパンパンなら今日中、つらければ119。陰嚢、睾丸、の突然の激痛は精巣捻転。6時間以内の手術が必要なので119。痛みのない血尿も、膀胱がん・腎臓がんのことがあるので必ず受診。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 尿がまったく出ず、下腹部がパンパンなら今日中、つらければいちいちきゅう。陰嚢、睾丸、の突然の激痛は精巣捻転。6時間以内の手術が必要なのでいちいちきゅう。痛みのない血尿も、膀胱がん・腎臓がんのことがあるので必ず受診。迷ったときは、ためらわずに、相談や受診をしてください。
