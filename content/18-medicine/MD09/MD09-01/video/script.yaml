title: 子どもの診かたの基本
scenes:
  - board: slide
    steps:
      - say: 第9章、「子どもの症状」です。
        show:
          - type: title
            text: 第9章　子どもの症状
      - say: この章では、子どもの診かたの基本、子どもの発熱・けいれん・咳、子どもの事故を学びます。
        show:
          - type: list
            items:
              - 子どもの診かたの基本
              - 子どもの発熱・けいれん・咳
              - 子どもの事故：誤飲・窒息・転落・溺水
  - board: whiteboard
    steps:
      - say: 「子どもの診かたの基本」です。子どもは悪化が早く、言葉で伝えられません。「機嫌・顔色・水分・尿」を見ます
        show:
          - type: title
            text: 子どもの診かたの基本
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 熱の高さより機嫌・顔色・飲めているか・おしっこが出ているかを見る。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 熱の高さより**機嫌・顔色・飲めているか・おしっこが出ているか**を見る。
      - say: ぐったり、呼吸が苦しそう、けいれん、顔色が悪いなら119。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **ぐったり、呼吸が苦しそう、けいれん、顔色が悪い**なら119。
        read: ぐったり、呼吸が苦しそう、けいれん、顔色が悪いならいちいちきゅう。
      - say: 迷ったら#8000、小児救急電話相談。生後3か月未満の38℃以上はすぐ受診。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 迷ったら**#8000**（小児救急電話相談）。**生後3か月未満の38℃以上**はすぐ受診。
        read: 迷ったらシャープ、はっせん、小児救急電話相談。生後3か月未満の38度以上はすぐ受診。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。ぐったりして反応が鈍い、目が合わない。呼吸が苦しそう、肋骨の間がへこむ、ゼーゼー、唇が紫。けいれんが5分以上、くり返す。
        show:
          - type: title
            text: すぐ119
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - ぐったりして反応が鈍い、目が合わない
              - 呼吸が苦しそう（肋骨の間がへこむ、ゼーゼー、唇が紫）
              - けいれんが5分以上、くり返す
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。ぐったりして反応が鈍い、目が合わない。呼吸が苦しそう、肋骨の間がへこむ、ゼーゼー、唇が紫。けいれんが5分以上、くり返す。
      - say: 顔色が悪い、皮膚がまだら。何かを飲み込んだ・詰まらせた、本章の3。
        show:
          - type: list
            items:
              - 顔色が悪い、皮膚がまだら
              - 何かを飲み込んだ・詰まらせた（本章の3）
  - board: whiteboard
    steps:
      - say: 次のようなときは、夜間や休日でも、今日中に受診しましょう。生後3か月未満の38℃以上。水分がとれない、半日以上おしっこが出ない。嘔吐をくり返す、泣き止まない。
        show:
          - type: title
            text: 今日中に受診
          - type: tag
            text: 緊急度：高
            color: yellow
            at:
              - 1010
              - 52
          - type: list
            items:
              - 生後3か月未満の38℃以上
              - 水分がとれない、半日以上おしっこが出ない
              - 嘔吐をくり返す、泣き止まない
        read: 次のようなときは、夜間や休日でも、今日中に受診しましょう。生後3か月未満の38度以上。水分がとれない、半日以上おしっこが出ない。嘔吐をくり返す、泣き止まない。
  - board: whiteboard
    steps:
      - say: 一方で、次のような場合は、家で様子を見てよいことが多いです。熱があっても、遊べる・飲める・眠れる・おしっこが出る。
        show:
          - type: title
            text: 様子見でよい目安
          - type: tag
            text: 緊急度：低
            color: green
            at:
              - 1010
              - 52
          - type: text
            text: 熱があっても、**遊べる・飲める・眠れる・おしっこが出る**。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、薬の注意です。子どもの解熱剤はアセトアミノフェンが基本。量は体重で決まる。大人用の解熱剤、アスピリン・ロキソプロフェンなど、は使わない。
        show:
          - type: title
            text: 薬の注意
          - type: list
            items:
              - 子どもの解熱剤は**アセトアミノフェン**が基本。量は体重で決まる。
              - "**大人用の解熱剤（アスピリン・ロキソプロフェンなど）は使わない**。"
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 熱の高さより**機嫌・顔色・飲めているか・おしっこが出ているか**を見る。
              - ② **ぐったり、呼吸が苦しそう、けいれん、顔色が悪い**なら119。
              - ③ 迷ったら**#8000**（小児救急電話相談）。**生後3か月未満の38℃以上**はすぐ受診。
      - say: 熱の高さより機嫌・顔色・飲めているか・おしっこが出ているかを見る。ぐったり、呼吸が苦しそう、けいれん、顔色が悪いなら119。迷ったら#8000、小児救急電話相談。生後3か月未満の38℃以上はすぐ受診。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 熱の高さより機嫌・顔色・飲めているか・おしっこが出ているかを見る。ぐったり、呼吸が苦しそう、けいれん、顔色が悪いならいちいちきゅう。迷ったらシャープ、はっせん、小児救急電話相談。生後3か月未満の38度以上はすぐ受診。迷ったときは、ためらわずに、相談や受診をしてください。
