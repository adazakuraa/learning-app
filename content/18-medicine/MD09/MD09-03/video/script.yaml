          - type: title
            text: 子どもの事故：誤飲・窒息・転落・溺水
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: ボタン電池・磁石・薬・強い洗剤・たばこを飲み込んだら、無理に吐かせずすぐ受診、119も。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① **ボタン電池・磁石・薬・強い洗剤・たばこ**を飲み込んだら、無理に吐かせずすぐ受診（119も）。
        read: ボタン電池・磁石・薬・強い洗剤・たばこを飲み込んだら、無理に吐かせずすぐ受診、いちいちきゅうも。
      - say: 迷ったら中毒110番、大阪072-727-2499、24時間。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 迷ったら**中毒110番**（大阪 072-727-2499、24時間）。
        read: 迷ったら中毒ひゃくとお番、大阪ゼロナナニー、ナナニーナナ、ニーヨンキュウキュウ、24時間。
      - say: ぶどう・ミニトマトは4つ切り、ピーナッツは4歳まで与えない。浴槽に水を残さない。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **ぶどう・ミニトマトは4つ切り、ピーナッツは4歳まで与えない**。浴槽に水を残さない。
  - board: whiteboard
    steps:
      - say: 次は、誤飲です。ボタン電池。数時間で食道に穴があく。すぐ受診。
        show:
          - type: title
            text: 誤飲
          - type: box
            color: yellow
            w: 1100
            title: "**ボタン電池**"
            text: 数時間で食道に穴があく。**すぐ受診**
      - say: 磁石、2個以上。腸をはさんで穴があく。すぐ受診。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**磁石（2個以上）**"
            text: 腸をはさんで穴があく。すぐ受診
      - say: 大人の薬、たばこ。吐かせず受診・中毒110番。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**大人の薬、たばこ**"
            text: 吐かせず受診・中毒110番
        read: 大人の薬、たばこ。吐かせず受診・中毒ひゃくとお番。
  - board: whiteboard
    steps:
      - say: 洗剤・漂白剤・灯油。吐かせず受診。
        show:
          - type: title
            text: 誤飲（つづき）
          - type: box
            color: green
            w: 1100
            title: "**洗剤・漂白剤・灯油**"
            text: 吐かせず受診
      - say: 少量の石けん・クレヨンなど。多くは心配ない。相談を。
        show:
          - type: box
            color: yellow
            w: 1100
            title: 少量の石けん・クレヨンなど
            text: 多くは心配ない。相談を
      - say: 容器や残りを持って受診します。
        show:
          - type: text
            text: 容器や残りを持って受診します。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、窒息です。声が出ない、咳もできない、119と、背中を強く叩く・胸やおなかを突き上げる、方法は第12章。予防、小さく切る、食べながら走らせない、直径4cm未満の物を手の届く所に置かない。
        show:
          - type: title
            text: 窒息
          - type: list
            items:
              - 声が出ない、咳もできない → **119**と、背中を強く叩く・胸やおなかを突き上げる（方法は第12章）。
              - 予防：小さく切る、食べながら走らせない、直径4cm未満の物を手の届く所に置かない。
        read: 次は、窒息です。声が出ない、咳もできない、いちいちきゅうと、背中を強く叩く・胸やおなかを突き上げる、方法は第12章。予防、小さく切る、食べながら走らせない、直径4センチ未満の物を手の届く所に置かない。
