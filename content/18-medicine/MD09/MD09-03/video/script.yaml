title: 子どもの事故：誤飲・窒息・転落・溺水
scenes:
  - board: whiteboard
    steps:
      - say: 「子どもの事故：誤飲・窒息・転落・溺水」です。子どもの事故は、予防が一番の対策です。起きたときの対応も覚えておきます
