title: 子どもの発熱・けいれん・咳
scenes:
  - board: whiteboard
    steps:
      - say: 「子どもの発熱・けいれん・咳」です。熱性けいれん、クループ、川崎病など、子どもに多い病気の要点です
        show:
          - type: title
            text: 子どもの発熱・けいれん・咳
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 熱性けいれんは多くが5分以内に止まり、後遺症を残さない。5分以上・くり返す・初めてなら119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 熱性けいれんは多くが**5分以内に止まり**、後遺症を残さない。**5分以上・くり返す・初めて**なら119。
        read: 熱性けいれんは多くが5分以内に止まり、後遺症を残さない。5分以上・くり返す・初めてならいちいちきゅう。
      - say: 犬が吠えるような咳と息を吸うときヒューヒューはクループ。苦しそうなら救急。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **犬が吠えるような咳＋息を吸うときヒューヒュー**はクループ。苦しそうなら救急。
      - say: 5日以上続く発熱と目の充血・唇の赤み・発疹は川崎病の可能性。受診。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **5日以上続く発熱＋目の充血・唇の赤み・発疹**は川崎病の可能性。受診。
  - board: whiteboard
    steps:
      - say: 次は、熱性けいれんです。6か月〜5歳の子どもの、発熱時のけいれん。約10人に1人が経験する。すること、時間を測る、横向きにする、口に物を入れない、揺さぶらない。119、5分以上続く、くり返す、意識が戻らない、体の片側だけ。
        show:
          - type: title
            text: 熱性けいれん
          - type: list
            items:
              - 6か月〜5歳の子どもの、発熱時のけいれん。約10人に1人が経験する。
              - "**すること**：時間を測る、横向きにする、**口に物を入れない**、揺さぶらない。"
              - 119：5分以上続く、くり返す、意識が戻らない、体の片側だけ。
        read: 次は、熱性けいれんです。6か月から5歳の子どもの、発熱時のけいれん。約10人に1人が経験する。すること、時間を測る、横向きにする、口に物を入れない、揺さぶらない。いちいちきゅう、5分以上続く、くり返す、意識が戻らない、体の片側だけ。
  - board: whiteboard
    steps:
      - say: ここで、知っておきたい病気を、かんたんに紹介します。RSウイルス・細気管支炎。ひとことは、乳児の咳、ゼーゼー、急ぐサインは、呼吸が速い、飲めない。
        show:
          - type: title
            text: 子どもに多い病気
          - type: box
            color: yellow
            w: 1100
            title: "**RSウイルス・細気管支炎**"
            text: ひとこと：乳児の咳、ゼーゼー　急ぐサイン：呼吸が速い、飲めない
      - say: クループ。ひとことは、犬が吠えるような咳、声がかれる、急ぐサインは、安静でもヒューヒュー。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**クループ**"
            text: ひとこと：犬が吠えるような咳、声がかれる　急ぐサイン：安静でもヒューヒュー
      - say: 胃腸炎。ひとことは、嘔吐・下痢、急ぐサインは、おしっこが出ない、ぐったり。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**胃腸炎**"
            text: ひとこと：嘔吐・下痢　急ぐサイン：おしっこが出ない、ぐったり
  - board: whiteboard
    steps:
      - say: 腸重積。ひとことは、乳幼児が数分おきに激しく泣き、いちごジャムのような便、急ぐサインは、すぐ受診。
        show:
          - type: title
            text: 子どもに多い病気（つづき）
          - type: box
            color: green
            w: 1100
            title: "**腸重積**"
            text: ひとこと：乳幼児が数分おきに激しく泣き、いちごジャムのような便　急ぐサイン：すぐ受診
      - say: 川崎病。ひとことは、5日以上の発熱、目の充血、唇の赤み、発疹、急ぐサインは、早期治療が必要。
        show:
          - type: box
            color: yellow
            w: 1100
            title: "**川崎病**"
            text: ひとこと：5日以上の発熱、目の充血、唇の赤み、発疹　急ぐサイン：早期治療が必要
      - say: 中耳炎。ひとことは、耳を触る、機嫌が悪い、急ぐサインは、高熱が続く。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**中耳炎**"
            text: ひとこと：耳を触る、機嫌が悪い　急ぐサイン：高熱が続く
  - board: whiteboard
    steps:
      - say: 次は、脱水を防ぐです。経口補水液をスプーンで少しずつ、数分おきに。一気に飲ませると吐きます。
        show:
          - type: title
            text: 脱水を防ぐ
          - type: text
            text: 経口補水液を**スプーンで少しずつ、数分おき**に。一気に飲ませると吐きます。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 熱性けいれんは多くが**5分以内に止まり**、後遺症を残さない。**5分以上・くり返す・初めて**なら119。
              - ② **犬が吠えるような咳＋息を吸うときヒューヒュー**はクループ。苦しそうなら救急。
              - ③ **5日以上続く発熱＋目の充血・唇の赤み・発疹**は川崎病の可能性。受診。
      - say: 熱性けいれんは多くが5分以内に止まり、後遺症を残さない。5分以上・くり返す・初めてなら119。犬が吠えるような咳と息を吸うときヒューヒューはクループ。苦しそうなら救急。5日以上続く発熱と目の充血・唇の赤み・発疹は川崎病の可能性。受診。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 熱性けいれんは多くが5分以内に止まり、後遺症を残さない。5分以上・くり返す・初めてならいちいちきゅう。犬が吠えるような咳と息を吸うときヒューヒューはクループ。苦しそうなら救急。5日以上続く発熱と目の充血・唇の赤み・発疹は川崎病の可能性。受診。迷ったときは、ためらわずに、相談や受診をしてください。
