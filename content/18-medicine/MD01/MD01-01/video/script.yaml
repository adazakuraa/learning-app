title: この科目の目的と限界
scenes:
  - board: slide
    steps:
      - say: 第1章、「受診判断の基本」です。
        show:
          - type: title
            text: 第1章　受診判断の基本
      - say: この章では、この科目の目的と限界、緊急度の見分け方、どこに相談する？119・#7119・診療科、119番のかけ方と症状の伝え方を学びます。
        show:
          - type: list
            items:
              - この科目の目的と限界
              - 緊急度の見分け方
              - どこに相談する？119・#7119・診療科
              - 119番のかけ方と症状の伝え方
        read: この章では、この科目の目的と限界、緊急度の見分け方、どこに相談する？いちいちきゅう・シャープ、ななないちいちきゅう・診療科、いちいちきゅう番のかけ方と症状の伝え方を学びます。
  - board: whiteboard
    steps:
      - say: 「この科目の目的と限界」です。病名を当てるのではなく「どれくらい急ぐか」を判断する。この科目の考え方と使い方を学びます
        show:
          - type: title
            text: この科目の目的と限界
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 目的は病名当てではなく、「119、今日中に受診、数日以内、様子見」のどれかを決めること。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 目的は病名当てではなく、**「119／今日中に受診／数日以内／様子見」のどれか**を決めること。
        read: 目的は病名当てではなく、「いちいちきゅう、今日中に受診、数日以内、様子見」のどれかを決めること。
      - say: 迷ったら急ぐほうを選ぶ。受診して何もなかったのは「失敗」ではなく「いちばん良い結果」。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 迷ったら**急ぐほうを選ぶ**。受診して何もなかったのは「失敗」ではなく「いちばん良い結果」。
      - say: 高齢者・乳幼児・妊娠中・持病のある人は症状が出にくいので、一段階急ぐ。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ **高齢者・乳幼児・妊娠中・持病のある人**は症状が出にくいので、一段階急ぐ。
  - board: whiteboard
    steps:
      - say: 次は、4つの段階です。今すぐ119。命にかかわるかもしれない。
        show:
          - type: title
            text: 4つの段階
          - type: box
            color: yellow
            w: 1100
            title: "**今すぐ119**"
            text: 命にかかわるかもしれない
        read: 次は、4つの段階です。今すぐいちいちきゅう。命にかかわるかもしれない。
      - say: 今日中に受診。夜間・休日でも今日中に診てもらう。
        show:
          - type: box
            color: pink
            w: 1100
            title: "**今日中に受診**"
            text: 夜間・休日でも今日中に診てもらう
      - say: 数日以内に受診。予約して受診してよい。
        show:
          - type: box
            color: blue
            w: 1100
            title: "**数日以内に受診**"
            text: 予約して受診してよい
  - board: whiteboard
    steps:
      - say: 自宅で様子見。ただし「悪くなったらどうするか」を決めておく。
        show:
          - type: title
            text: 4つの段階（つづき）
          - type: box
            color: green
            w: 1100
            title: "**自宅で様子見**"
            text: ただし「悪くなったらどうするか」を決めておく
  - board: whiteboard
    steps:
      - say: 次は、考え方のコツです。医療の現場では、いちばん危ない病気を先に除外してから軽い病気を考えます。この科目も、各症状で危険なサインを先に書いています。症状が出たら、まず「すぐ119」の項目だけ確認し、当てはまらなければ次へ進んでください。細かい病名や治療は、必要になったときに調べれば十分です。
        show:
          - type: title
            text: 考え方のコツ
          - type: list
            items:
              - 医療の現場では、**いちばん危ない病気を先に除外**してから軽い病気を考えます。この科目も、各症状で**危険なサインを先に**書いています。
              - 症状が出たら、まず「すぐ119」の項目だけ確認し、当てはまらなければ次へ進んでください。
              - 細かい病名や治療は、必要になったときに調べれば十分です。
        read: 次は、考え方のコツです。医療の現場では、いちばん危ない病気を先に除外してから軽い病気を考えます。この科目も、各症状で危険なサインを先に書いています。症状が出たら、まず「すぐいちいちきゅう」の項目だけ確認し、当てはまらなければ次へ進んでください。細かい病名や治療は、必要になったときに調べれば十分です。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 目的は病名当てではなく、**「119／今日中に受診／数日以内／様子見」のどれか**を決めること。
              - ② 迷ったら**急ぐほうを選ぶ**。受診して何もなかったのは「失敗」ではなく「いちばん良い結果」。
              - ③ **高齢者・乳幼児・妊娠中・持病のある人**は症状が出にくいので、一段階急ぐ。
      - say: 目的は病名当てではなく、「119、今日中に受診、数日以内、様子見」のどれかを決めること。迷ったら急ぐほうを選ぶ。受診して何もなかったのは「失敗」ではなく「いちばん良い結果」。高齢者・乳幼児・妊娠中・持病のある人は症状が出にくいので、一段階急ぐ。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 目的は病名当てではなく、「いちいちきゅう、今日中に受診、数日以内、様子見」のどれかを決めること。迷ったら急ぐほうを選ぶ。受診して何もなかったのは「失敗」ではなく「いちばん良い結果」。高齢者・乳幼児・妊娠中・持病のある人は症状が出にくいので、一段階急ぐ。迷ったときは、ためらわずに、相談や受診をしてください。
