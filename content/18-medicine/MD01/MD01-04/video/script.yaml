title: 119番のかけ方と症状の伝え方
scenes:
  - board: whiteboard
    steps:
      - say: 「119番のかけ方と症状の伝え方」です。119番通報の流れと、受診のときに医師に伝えるべきことを学びます
        show:
          - type: title
            text: 119番のかけ方と症状の伝え方
        read: 「いちいちきゅう番のかけ方と症状の伝え方」です。いちいちきゅう番通報の流れと、受診のときに医師に伝えるべきことを学びます
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 119では最初に「救急です」、次に場所。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 119では最初に**「救急です」**、次に**場所**。
        read: いちいちきゅうでは最初に「救急です」、次に場所。
      - say: 電話は切らず、指示に従う、心肺蘇生の方法も教えてくれる。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 電話は切らず、**指示に従う**（心肺蘇生の方法も教えてくれる）。
      - say: 医師には「いつから・どこが・どんなふうに・どう変わったか」と、持病・飲んでいる薬・アレルギーを伝える。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 医師には**「いつから・どこが・どんなふうに・どう変わったか」**と、**持病・飲んでいる薬・アレルギー**を伝える。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。「救急です」。場所、住所、目印。誰が、どうなったか、年齢、意識・呼吸の様子。
        show:
          - type: title
            text: 119番の流れ
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - 「**救急です**」
              - "**場所**（住所、目印）"
              - "**誰が、どうなったか**（年齢、意識・呼吸の様子）"
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。「救急です」。場所、住所、目印。誰が、どうなったか、年齢、意識・呼吸の様子。
      - say: 自分の名前と電話番号。指示を聞く。玄関の鍵を開け、可能なら外で救急車を誘導する。
        show:
          - type: list
            items:
              - 自分の名前と電話番号
              - 指示を聞く。玄関の鍵を開け、可能なら外で救急車を誘導する
  - board: whiteboard
    steps:
      - say: 次は、持っていくものです。お薬手帳、またはスマホで薬の写真。保険証、マイナ保険証。持病・アレルギーのメモ。
        show:
          - type: title
            text: 持っていくもの
          - type: list
            items:
              - "**お薬手帳**（またはスマホで薬の写真）"
              - 保険証（マイナ保険証）
              - 持病・アレルギーのメモ
  - board: whiteboard
    steps:
      - say: 次は、症状の伝え方です。いつから、突然か、だんだんか。どこが、どんなふうに、痛みの強さを10段階で。変化、良くなっている、悪くなっている。
        show:
          - type: title
            text: 症状の伝え方
          - type: list
            items:
              - "**いつから**（突然か、だんだんか）"
              - "**どこが、どんなふうに**（痛みの強さを10段階で）"
              - "**変化**（良くなっている／悪くなっている）"
      - say: 一緒に出ている症状、熱、吐き気など。発疹やけいれんは写真や動画を撮っておくと役立つ。
        show:
          - type: list
            items:
              - "**一緒に出ている症状**（熱、吐き気など）"
              - 発疹やけいれんは**写真や動画**を撮っておくと役立つ
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 119では最初に**「救急です」**、次に**場所**。
              - ② 電話は切らず、**指示に従う**（心肺蘇生の方法も教えてくれる）。
              - ③ 医師には**「いつから・どこが・どんなふうに・どう変わったか」**と、**持病・飲んでいる薬・アレルギー**を伝える。
      - say: 119では最初に「救急です」、次に場所。電話は切らず、指示に従う、心肺蘇生の方法も教えてくれる。医師には「いつから・どこが・どんなふうに・どう変わったか」と、持病・飲んでいる薬・アレルギーを伝える。迷ったときは、ためらわずに、相談や受診をしてください。
        read: いちいちきゅうでは最初に「救急です」、次に場所。電話は切らず、指示に従う、心肺蘇生の方法も教えてくれる。医師には「いつから・どこが・どんなふうに・どう変わったか」と、持病・飲んでいる薬・アレルギーを伝える。迷ったときは、ためらわずに、相談や受診をしてください。
