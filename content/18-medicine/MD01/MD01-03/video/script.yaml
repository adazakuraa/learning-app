title: どこに相談する？119・#7119・診療科
scenes:
  - board: whiteboard
    steps:
      - say: 「どこに相談する？119・#7119・診療科」です。迷ったときの電話相談と、どの診療科に行けばいいかを学びます
        show:
          - type: title
            text: どこに相談する？119・#7119・診療科
        read: 「どこに相談する？いちいちきゅう・シャープ、ななないちいちきゅう・診療科」です。迷ったときの電話相談と、どの診療科に行けばいいかを学びます
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 迷ったら#7119、救急相談。子どもは#8000。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 迷ったら**#7119**（救急相談）。子どもは**#8000**。
        read: 迷ったらシャープ、ななないちいちきゅう、救急相談。子どもはシャープ、はっせん。
      - say: 命にかかわりそうなら迷わず119。救急車を呼んで軽症でも責められない。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② 命にかかわりそうなら迷わず**119**。救急車を呼んで軽症でも責められない。
        read: 命にかかわりそうなら迷わずいちいちきゅう。救急車を呼んで軽症でも責められない。
      - say: 診療科がわからなければ内科か、病院に電話で聞く。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 診療科がわからなければ**内科**か、**病院に電話で聞く**。
  - board: whiteboard
    steps:
      - say: 次は、電話の使い分けです。119。命にかかわりそうなとき。
        show:
          - type: title
            text: 電話の使い分け
          - type: box
            color: yellow
            w: 1100
            title: "**119**"
            text: 命にかかわりそうなとき
        read: 次は、電話の使い分けです。いちいちきゅう。命にかかわりそうなとき。
      - say: "#7119。救急車を呼ぶか、今すぐ受診すべきか迷うとき、実施していない地域もある。"
        show:
          - type: box
            color: pink
            w: 1100
            title: "**#7119**"
            text: 救急車を呼ぶか、今すぐ受診すべきか迷うとき（実施していない地域もある）
        read: シャープ、ななないちいちきゅう。救急車を呼ぶか、今すぐ受診すべきか迷うとき、実施していない地域もある。
      - say: "#8000。子どもの症状で迷うとき、夜間・休日。"
        show:
          - type: box
            color: blue
            w: 1100
            title: "**#8000**"
            text: 子どもの症状で迷うとき（夜間・休日）
        read: シャープ、はっせん。子どもの症状で迷うとき、夜間・休日。
  - board: whiteboard
    steps:
      - say: 中毒110番。何かを飲み込んだとき、大阪072-727-2499、24時間。
        show:
          - type: title
            text: 電話の使い分け（つづき）
          - type: box
            color: green
            w: 1100
            title: "**中毒110番**"
            text: 何かを飲み込んだとき（大阪 072-727-2499、24時間）
        read: 中毒ひゃくとお番。何かを飲み込んだとき、大阪ゼロナナニー、ナナニーナナ、ニーヨンキュウキュウ、24時間。
      - say: 総務省消防庁のアプリ「Q助」でも緊急度を調べられます。
        show:
          - type: text
            text: 総務省消防庁のアプリ「**Q助**」でも緊急度を調べられます。
            w: 1100
  - board: whiteboard
    steps:
      - say: 次は、迷ったときの診療科です。よくわからない・全身の症状。内科。
        show:
          - type: title
            text: 迷ったときの診療科
          - type: box
            color: yellow
            w: 1100
            title: よくわからない・全身の症状
            text: 内科
      - say: けが・骨・腰。整形外科。
        show:
          - type: box
            color: pink
            w: 1100
            title: けが・骨・腰
            text: 整形外科
      - say: 皮膚。皮膚科。
        show:
          - type: box
            color: blue
            w: 1100
            title: 皮膚
            text: 皮膚科
  - board: whiteboard
    steps:
      - say: 目・耳鼻のど。眼科・耳鼻咽喉科。
        show:
          - type: title
            text: 迷ったときの診療科（つづき）
          - type: box
            color: green
            w: 1100
            title: 目・耳鼻のど
            text: 眼科・耳鼻咽喉科
      - say: 子ども。小児科。
        show:
          - type: box
            color: yellow
            w: 1100
            title: 子ども
            text: 小児科
      - say: 心の不調。心療内科・精神科。
        show:
          - type: box
            color: pink
            w: 1100
            title: 心の不調
            text: 心療内科・精神科
      - say: 夜間・休日は、地域の休日夜間急患センターや救急病院へ。
        show:
          - type: text
            text: 夜間・休日は、地域の**休日夜間急患センター**や救急病院へ。
            w: 1100
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 迷ったら**#7119**（救急相談）。子どもは**#8000**。
              - ② 命にかかわりそうなら迷わず**119**。救急車を呼んで軽症でも責められない。
              - ③ 診療科がわからなければ**内科**か、**病院に電話で聞く**。
      - say: 迷ったら#7119、救急相談。子どもは#8000。命にかかわりそうなら迷わず119。救急車を呼んで軽症でも責められない。診療科がわからなければ内科か、病院に電話で聞く。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 迷ったらシャープ、ななないちいちきゅう、救急相談。子どもはシャープ、はっせん。命にかかわりそうなら迷わずいちいちきゅう。救急車を呼んで軽症でも責められない。診療科がわからなければ内科か、病院に電話で聞く。迷ったときは、ためらわずに、相談や受診をしてください。
