title: 緊急度の見分け方
scenes:
  - board: whiteboard
    steps:
      - say: 「緊急度の見分け方」です。意識・呼吸・顔色の3つと「いつもと違う」が、緊急度を見分ける最大の手がかりです
        show:
          - type: title
            text: 緊急度の見分け方
      - say: この単元で、まず覚えてほしいことは、3つです。
      - say: 見るのは意識・呼吸・顔色、皮膚、の3つ。どれかがおかしければ119。
        show:
          - type: box
            color: yellow
            w: 1100
            text: ① 見るのは**意識・呼吸・顔色（皮膚）**の3つ。どれかがおかしければ119。
        read: 見るのは意識・呼吸・顔色、皮膚、の3つ。どれかがおかしければいちいちきゅう。
      - say: 「突然」「今までで最悪」「どんどん悪くなる」は危険のサイン。
        show:
          - type: box
            color: pink
            w: 1100
            text: ② **「突然」「今までで最悪」「どんどん悪くなる」**は危険のサイン。
      - say: 数字より「いつもと違う」という家族の感覚が大事。
        show:
          - type: box
            color: blue
            w: 1100
            text: ③ 数字より**「いつもと違う」**という家族の感覚が大事。
  - board: whiteboard
    steps:
      - say: 次のようなときは、すぐに119番に電話します。意識、呼びかけへの反応が鈍い、話がおかしい、けいれん。呼吸、息苦しくて話せない、ゼーゼー、唇が紫。顔色・皮膚、真っ青、冷や汗、ぐったり。
        show:
          - type: title
            text: すぐ119を考えるサイン（どの症状でも共通）
          - type: tag
            text: 緊急度：最高
            color: pink
            at:
              - 1010
              - 52
          - type: list
            items:
              - "**意識**：呼びかけへの反応が鈍い、話がおかしい、けいれん"
              - "**呼吸**：息苦しくて話せない、ゼーゼー、唇が紫"
              - "**顔色・皮膚**：真っ青、冷や汗、ぐったり"
        read: 次のようなときは、すぐにいちいちきゅう番に電話します。意識、呼びかけへの反応が鈍い、話がおかしい、けいれん。呼吸、息苦しくて話せない、ゼーゼー、唇が紫。顔色・皮膚、真っ青、冷や汗、ぐったり。
      - say: 突然の激しい痛み、頭・胸・背中・おなか。大量の出血。
        show:
          - type: list
            items:
              - "**突然の激しい痛み**（頭・胸・背中・おなか）"
              - "**大量の出血**"
  - board: whiteboard
    steps:
      - say: 次は、注意したい言葉です。突然、「何時何分に始まった」と言えるほど急な始まりは、血管が破れる・詰まる病気に多い。今までで最悪、経験したことのない強さ。悪くなっていく、最初は軽くても、時間とともに悪化するなら急ぐ。
        show:
          - type: title
            text: 注意したい言葉
          - type: list
            items:
              - "**突然**：「何時何分に始まった」と言えるほど急な始まりは、血管が破れる・詰まる病気に多い。"
              - "**今までで最悪**：経験したことのない強さ。"
              - "**悪くなっていく**：最初は軽くても、時間とともに悪化するなら急ぐ。"
  - board: whiteboard
    steps:
      - say: 次は、測れるなら測るです。体温、脈拍、あれば、血圧や血液中の酸素、パルスオキシメーター。酸素が93〜94%以下、脈が1分120以上や50未満は受診を急ぐ目安です。ただし数字が正常でも、様子がおかしければそちらを優先します。
        show:
          - type: title
            text: 測れるなら測る
          - type: text
            text: 体温、脈拍、（あれば）血圧や血液中の酸素（パルスオキシメーター）。**酸素が93〜94%以下**、**脈が1分120以上や50未満**は受診を急ぐ目安です。ただし数字が正常でも、様子がおかしければそちらを優先します。
            w: 1100
        read: 次は、測れるなら測るです。体温、脈拍、あれば、血圧や血液中の酸素、パルスオキシメーター。酸素が93から94パーセント以下、脈が1分120以上や50未満は受診を急ぐ目安です。ただし数字が正常でも、様子がおかしければそちらを優先します。
  - board: whiteboard
    steps:
      - say: 最後に、この単元で覚えることを、もう一度確認しましょう。
        show:
          - type: title
            text: まとめ
          - type: list
            items:
              - ① 見るのは**意識・呼吸・顔色（皮膚）**の3つ。どれかがおかしければ119。
              - ② **「突然」「今までで最悪」「どんどん悪くなる」**は危険のサイン。
              - ③ 数字より**「いつもと違う」**という家族の感覚が大事。
      - say: 見るのは意識・呼吸・顔色、皮膚、の3つ。どれかがおかしければ119。「突然」「今までで最悪」「どんどん悪くなる」は危険のサイン。数字より「いつもと違う」という家族の感覚が大事。迷ったときは、ためらわずに、相談や受診をしてください。
        read: 見るのは意識・呼吸・顔色、皮膚、の3つ。どれかがおかしければいちいちきゅう。「突然」「今までで最悪」「どんどん悪くなる」は危険のサイン。数字より「いつもと違う」という家族の感覚が大事。迷ったときは、ためらわずに、相談や受診をしてください。
