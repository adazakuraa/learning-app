title: 単位と測定
scenes:
  - board: whiteboard
    steps:
      - say: 「単位と測定」です。
        show:
          - { type: title, text: 単位と測定 }
      - say: 物理では、数字だけでなく、「単位」が必ずセットで必要です。
        show:
          - { type: text, size: l, text: "数値 ＋ **単位** で、はじめて意味をもつ" }
      - say: 「速さが10」と言われても、意味がわかりません。時速10キロなら自転車くらい。でも、秒速10メートルなら、時速36キロで、原付バイクくらいの速さです。単位によって、まったくちがう意味になるのです。
        show:
          - { type: text, color: blue, text: "時速10km … 自転車くらい" }
          - { type: text, color: pink, text: "秒速10m（＝時速36km）… 原付バイクくらい" }

  - board: whiteboard
    steps:
      - say: 世界で統一された単位のしくみを、SI単位系といい、7つの基本単位があります。
        show:
          - { type: title, text: SI単位系の7つの基本単位 }
      - say: 時間は秒、長さはメートル、質量はキログラム、電流はアンペア、温度はケルビン、明るさはカンデラ、物質の量はモルです。
        show:
          - type: list
            items: ["時間：秒 [s]", "長さ：メートル [m]", "質量：キログラム [kg]", "電流：アンペア [A]", "温度：ケルビン [K]", "光度：カンデラ [cd]", "物質量：モル [mol]"]

  - board: whiteboard
    steps:
      - say: この7つを組み合わせると、あらゆる単位が作れます。
        show:
          - { type: title, text: 組み合わせて単位をつくる }
      - say: 速さは、メートル毎秒。力は、キログラム・メートル毎秒毎秒で、これをニュートン、Nと呼びます。エネルギーは、ジュール、Jと呼びます。
        show:
          - { type: text, text: "速さ ＝ m/s（メートル毎秒）" }
          - { type: text, text: "力 ＝ kg·m/s² ＝ **N（ニュートン）**" }
          - { type: text, text: "エネルギー ＝ kg·m²/s² ＝ **J（ジュール）**" }
      - say: 単位を見るだけで、その量の正体がわかります。キロメートル毎時、km/hは、距離を時間で割ったもの。だから、「距離÷時間」、つまり速さだとわかるのです。
        show:
          - { type: box, color: yellow, w: 1000, text: "km/h ＝ km（距離）÷ h（時間）→ 速さ！単位が正体を教えてくれる" }

  - board: whiteboard
    steps:
      - say: 単位の前につく「接頭辞」も大切です。数学の指数の単元でも出てきましたね。
        show:
          - { type: title, text: 接頭辞 }
      - say: キロは1000倍、メガは100万倍。ミリは1000分の1、マイクロは100万分の1です。
        show:
          - { type: text, text: "k（キロ）＝ 1000倍　　M（メガ）＝ 100万倍" }
          - { type: text, text: "m（ミリ）＝ 1/1000　　μ（マイクロ）＝ 1/100万" }
      - say: 1キロメートルは1000メートル。1ミリ秒は、0.001秒、というように使います。
        show:
          - { type: text, color: yellow, text: "1km ＝ 1000m　　1ms（ミリ秒）＝ 0.001秒" }
