questions:
  - q: 1秒間に振動する回数を振動数という。その単位（Hz）を何というでしょう？
    a: [ヘルツ, Hz]
    show: ヘルツ（Hz）
  - q: 音の高さを決めるのは、振幅と振動数のどちらでしょう？
    a: [振動数, 周波数]
    show: 振動数
  - q: 空気中の音の速さは約何m/sでしょう？（気温15℃）
    a: ['340', 340m/s, 約340]
    show: 約340m/s
  - q: 雷が光ってから5秒後に音が聞こえた。雷までの距離は約何mでしょう？音速を340m/sとして計算してください。
    a: ['1700', 1700m, 約1700m, 1.7km]
    show: 約1700m
    explain: 光はほぼ一瞬で届くので、340×5＝1700m。
  - q: 中央が厚く、光を1点（焦点）に集めるレンズを何というでしょう？
    a: [凸レンズ]
