title: 音の正体と性質
scenes:
  - board: whiteboard
    steps:
      - say: 「音の正体と性質」です。
        show:
          - { type: title, text: 音の正体と性質 }
      - say: 音は、空気や水、固体のふるえが、波として伝わる現象です。
        show:
          - { type: text, size: l, text: "**音** ＝ 空気（や水・固体）のふるえが伝わる波" }
      - say: 空気のない宇宙では、ふるえを伝えるものがないので、音は伝わりません。
        added: true
        show:
          - { type: text, size: s, color: gray, text: "空気のない宇宙では、音は伝わらない" }

  - board: whiteboard
    steps:
      - say: 音の高い・低いは、振動数で決まります。振動数が大きいほど、高い音になります。
        show:
          - { type: title, text: 音の高さと大きさ }
          - type: svg
            w: 1100
            h: 200
            markup: |
              <path d="M20 100 C60 40 100 40 140 100 C180 160 220 160 260 100 C300 40 340 40 380 100 C420 160 460 160 500 100" stroke="#8fc4ff"/>
              <path d="M600 100 C620 40 640 40 660 100 C680 160 700 160 720 100 C740 40 760 40 780 100 C800 160 820 160 840 100 C860 40 880 40 900 100 C920 160 940 160 960 100 C980 40 1000 40 1020 100" stroke="#f4a3b8"/>
              <g stroke="none" font-size="26"><text x="160" y="195" fill="#8fc4ff">振動数 小 → 低い音</text><text x="680" y="195" fill="#f4a3b8">振動数 大 → 高い音</text></g>
      - say: 人間が聞こえるのは、およそ20ヘルツから2万ヘルツまで。2万ヘルツより高い音を、超音波といいます。イルカやコウモリは、超音波を使っています。
        show:
          - { type: text, text: "人が聞こえる範囲：約 20Hz 〜 20000Hz" }
          - { type: text, color: yellow, text: "20000Hz より高い音 ＝ **超音波**" }
      - say: 音の大きさは、振幅で決まります。単位は、デシベルで表します。数学の対数の章で出てきた単位ですね。
        show:
          - { type: text, text: "音の大きさ ＝ 振幅　単位：dB（デシベル）" }

  - board: whiteboard
    steps:
      - say: 音の速さは、気温15度のとき、秒速およそ340メートル。光の速さ、秒速およそ30万キロメートルに比べると、ずっと遅いのです。
        show:
          - { type: title, text: 音速と光速 }
          - { type: text, color: blue, text: "音速 ≒ 340 m/s（気温15℃）" }
          - { type: text, color: yellow, text: "光速 ≒ 30万 km/s（音の約90万倍）" }
      - say: だから、雷は、光ってから少し遅れて、ゴロゴロと音が聞こえます。光ってから音までが3秒なら、雷までの距離は、340×3で、およそ1キロメートルです。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, text: "雷：光ってから音まで3秒 → 340 × 3 ≒ 約1km 先" }
