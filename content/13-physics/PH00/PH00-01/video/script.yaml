title: 物理とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、物理がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 物理とは
      - say: 物理では、力と運動、エネルギー、波・音・光、電気と磁気、原子と放射線など、自然のふるまいを決めている基本的なルールを学びます。
        show:
          - type: box
            w: 1100
            text: 物理では、力と運動、エネルギー、波・音・光、電気と磁気、原子と放射線など、自然のふるまいを決めている基本的なルールを学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で6章です。第1章は物理とは、第2章は力と運動、第3章は仕事とエネルギー、第4章は波・音・光、第5章は電気と磁気、第6章は原子と放射線。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　物理とは
              - 第2章　力と運動
              - 第3章　仕事とエネルギー
              - 第4章　波・音・光
              - 第5章　電気と磁気
              - 第6章　原子と放射線
            at:
              - 80
              - 150
  - board: whiteboard
    steps:
      - say: では、物理を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、身の回りの仕組みがわかる。電車が止まるときに体が傾く理由、電子レンジが温まる理由。物理を知ると、身近な現象の「なぜ」がわかります。
        show:
          - type: box
            w: 1100
            text: |-
              **身の回りの仕組みがわかる**
              電車が止まるときに体が傾く理由、電子レンジが温まる理由。物理を知ると、身近な現象の「なぜ」がわかります。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、技術を理解できる。スマホ、発電、医療機器。現代の技術は、物理の法則の上に成り立っています。
        show:
          - type: box
            w: 1100
            text: |-
              **技術を理解できる**
              スマホ、発電、医療機器。現代の技術は、物理の法則の上に成り立っています。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、安全に役立つ。電気、熱、放射線。正しく知ることで、必要以上に怖がらず、必要な注意ができます。
        show:
          - type: box
            w: 1100
            text: |-
              **安全に役立つ**
              電気、熱、放射線。正しく知ることで、必要以上に怖がらず、必要な注意ができます。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、家電や電気料金について考えるとき、エネルギーや原子力のニュースを見るとき、車や自転車の安全を考えるとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 家電や電気料金について考えるとき
              - エネルギーや原子力のニュースを見るとき
              - 車や自転車の安全を考えるとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、公式の前に、どんな現象かをイメージする。そして、単位に注目する。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・公式の前に、**どんな現象か**をイメージする
              ・単位に注目する
            color: pink
            at:
              - 80
              - 420
