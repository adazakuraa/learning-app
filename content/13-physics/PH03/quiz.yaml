questions:
  - q: 高さ5mの場所から、50gのボールを落下させる。地面に着く寸前のボールの速さは何m/sか。ただし、重力加速度は10m/s²とする。
    a: ['10', 10m/s]
    show: 10m/s
    explain: 'エネルギー保存則を使う。落ちる前の位置エネルギー mgh と、地面に着く寸前の運動エネルギー mv²/2 が等しいので、mgh＝mv²/2 より v²＝2gh＝2×10×5＝100、v＝10m/s。（質量は両辺で消えるので、答えに関係しない）'
  - q: 10Nの力で、物体を力の向きに3m動かした。このときの仕事は何Jか。
    a: ['30', 30J]
    show: 30J
    explain: 仕事＝力×動かした距離＝10×3＝30J。
  - q: 「エネルギーは形を変えても、全体の量は変わらない」という法則を何というか。
    a: [エネルギー保存の法則, エネルギー保存則]
    show: エネルギー保存の法則
  - q: 熱の伝わり方のうち、太陽の熱が真空の宇宙を通って地球に届くような伝わり方を何というか。
    a: [放射, 熱放射, ふく射]
    show: 放射
