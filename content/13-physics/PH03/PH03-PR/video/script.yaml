title: 練習問題 仕事とエネルギー
scenes:
  - board: slide
    steps:
      - say: 「仕事とエネルギー」の章の練習問題です。エネルギー保存の法則を使って、速さを求めます。
        show:
          - { type: title, text: 練習問題　仕事とエネルギー }
          - { type: formula, tex: '\text{位置エネルギー}\; mgh \qquad \text{運動エネルギー}\; \tfrac{1}{2}mv^2' }

  - board: whiteboard
    steps:
      - say: 問題1。高さ5メートルの場所から、50グラムのボールを落とします。地面に着く直前の、ボールの速さは？重力加速度は、10メートル毎秒毎秒とします。
        show:
          - { type: title, text: "問題 ①" }
          - type: svg
            at: [80, 160]
            w: 400
            h: 420
            markup: |
              <path d="M40 400 H360" stroke="#9aa3ad"/>
              <circle cx="200" cy="40" r="20" stroke="#f3d77a"/>
              <path d="M200 70 V380" stroke="#f3d77a" stroke-dasharray="8 10"/>
              <path d="M300 40 V400" stroke="#8fc4ff"/>
              <text x="310" y="230" font-size="28" fill="#8fc4ff" stroke="none">5m</text>
          - { type: text, at: [560, 180], w: 660, text: "質量 50g、高さ 5m、g ＝ 10m/s²\n地面に着く直前の速さは？" }
        pause: 4
      - say: エネルギー保存の法則を使います。落とす前は、位置エネルギーだけ。地面に着く直前は、高さがゼロなので、運動エネルギーだけ。この2つが等しくなります。
        show:
          - { type: formula, at: [560, 320], color: yellow, tex: 'mgh = \frac{1}{2}mv^2' }
      - say: 両辺にあるmは、消すことができます。10×5＝v²÷2なので、v²は100。vは、秒速10メートルです。
        show:
          - { type: formula, at: [560, 420], tex: '10 \times 5 = \frac{v^2}{2} \;\rightarrow\; v^2 = 100' }
          - { type: formula, at: [560, 520], size: l, color: green, tex: 'v = 10\ \text{m/s}' }
      - say: 質量が消えたということは、ボールの重さに関係なく、同じ速さになる、ということ。「重いものも軽いものも、同じ速さで落ちる」という、前の章の話とつながりましたね。
        added: true
        show:
          - { type: text, at: [80, 640], size: s, color: gray, text: "m が消える → 重さに関係なく同じ速さ（第2章「自由落下」とつながる）" }

  - board: whiteboard
    steps:
      - say: おつかれさまでした。テキストの解説でも、計算の流れを確認しておきましょう。
        show:
          - { type: title, text: おつかれさまでした }
          - { type: text, text: "エネルギー保存で、速さや高さが求められる" }
