questions:
  - q: 電流の単位を何というか。
    a: [アンペア, A]
    show: アンペア（A）
  - q: 抵抗 10Ω の電熱線に 2A の電流が流れている。電圧は何Vか。（オームの法則 V＝IR）
    a: ['20', 20V]
    show: 20V
  - q: 抵抗 5Ω に 3A の電流が流れているとき、消費電力は何Wか。（P＝RI²）
    a: ['45', 45W]
    show: 45W
    explain: P＝5×3²＝45W。
  - q: コイルの近くで磁石を動かすと電流が流れる現象を何というか。
    a: [電磁誘導]
  - q: 家庭のコンセントに来ている、電流の向きが周期的に変わる電気を何というか。
    a: [交流, AC]
    show: 交流（AC）
