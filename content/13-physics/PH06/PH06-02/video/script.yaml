title: 放射線の種類と性質
scenes:
  - board: whiteboard
    steps:
      - say: 「放射線の種類と性質」です。放射性同位体が崩壊するときに出てくる、粒の流れや電磁波を、放射線といいます。
        show:
          - { type: title, text: 放射線の種類と性質 }
          - { type: text, text: "**放射線** ＝ 崩壊のときに出る、粒の流れや電磁波" }
      - say: 放射線には、粒の流れであるアルファ線、ベータ線、中性子線と、電磁波であるガンマ線、エックス線があります。体への影響は、浴びる量、時間、種類によってちがいます。
        show:
          - type: list
            items: ["α線：ヘリウムの原子核（粒）", "β線：電子（粒）", "γ線・X線：電磁波", "中性子線：中性子（粒）"]

  - board: whiteboard
    steps:
      - say: 放射線は、種類によって、ものを通り抜ける力がちがいます。
        show:
          - { type: title, text: 通り抜ける力のちがい }
          - type: svg
            at: [80, 150]
            w: 1100
            h: 420
            markup: |
              <path d="M260 20 V380" stroke="#eef0ea" stroke-width="3"/><path d="M500 20 V380" stroke="#9aa3ad" stroke-width="10"/>
              <rect x="720" y="20" width="60" height="360" fill="#9aa3ad" fill-opacity="0.4" stroke="none"/><rect x="940" y="20" width="80" height="360" fill="#8fc4ff" fill-opacity="0.3" stroke="none"/>
              <path d="M20 70 H250" stroke="#f4a3b8"/><path d="M20 160 H490" stroke="#8fc4ff"/>
              <path d="M20 250 Q40 230 60 250 T100 250 T140 250 T180 250 T220 250 T260 250 T300 250 T340 250 T380 250 T420 250 T460 250 T500 250 T540 250 T580 250 T620 250 T660 250 T710 250" stroke="#f3d77a"/>
              <path d="M20 340 H930" stroke="#9be0b0"/>
              <g stroke="none" font-size="24"><text x="20" y="55" fill="#f4a3b8">α線</text><text x="20" y="145" fill="#8fc4ff">β線</text><text x="20" y="235" fill="#f3d77a">γ線・X線</text><text x="20" y="325" fill="#9be0b0">中性子線</text></g>
              <g stroke="none" font-size="22" text-anchor="middle" fill="#9aa3ad"><text x="260" y="410">紙1枚</text><text x="500" y="410">アルミ板</text><text x="750" y="410">鉛の厚い板</text><text x="980" y="410">水・コンクリート</text></g>
      - say: アルファ線は紙1枚で止まり、ベータ線はアルミなどの薄い金属板で止まります。ガンマ線やエックス線は、鉛の厚い板で止まり、中性子線は、水やコンクリートで止まります。
        show:
          - { type: text, at: [80, 610], size: s, color: gray, text: "α：紙　β：アルミ板　γ・X：鉛の厚い板　中性子：水・コンクリート" }

  - board: whiteboard
    steps:
      - say: 放射線は、自然界にもあります。宇宙から降ってくる宇宙線、地面から出るラドンガス、食べ物にふくまれる放射性のカリウム。私たちは、いつも、ごくわずかな放射線を浴びて暮らしています。
        show:
          - { type: title, text: 身のまわりの放射線 }
          - type: list
            items: ["宇宙線（宇宙から）", "ラドンガス（地面から）", "放射性カリウム（食べ物の中）"]
          - { type: text, size: s, color: gray, text: "私たちは、いつもごくわずかな放射線を浴びている" }
      - say: 放射線は、医療でも大切です。レントゲンやCTは、放射線が体を通り抜ける性質を使って、体の中を写します。また、放射線でがん細胞をこわす、放射線治療もあります。
        show:
          - { type: box, color: blue, w: 1000, text: "医療：レントゲン・CT（体の中を写す）、放射線治療（がん細胞をこわす）" }
