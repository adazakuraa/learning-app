questions:
  - q: 「外から力が加わらない限り、静止している物体は静止し続け、動いている物体は等速で動き続ける」という法則を何というか。
    a: [慣性の法則]
  - q: 質量 2kg の物体を 3m/s² で加速させるのに必要な力は何Nか。（F＝ma）
    a: ['6', 6N]
    show: 6N
    explain: F＝ma＝2×3＝6N。
  - q: 地上で物体が落ちるとき、1秒ごとに秒速何mずつ速くなるか。（重力加速度）
    a: ['9.8', 9.8m/s, 約9.8, 秒速9.8m]
    show: 約9.8m/s（9.8m/s²）
  - q: 「質量」と「重さ」のうち、月に行くと約6分の1になるのはどちらか。
    a: [重さ]
    explain: 質量は場所によって変わらない。重さは重力の大きさなので、場所で変わる。
  - q: 静止摩擦力と動摩擦力では、一般にどちらが大きいか。
    a: [静止摩擦力, 静止摩擦]
    show: 静止摩擦力
