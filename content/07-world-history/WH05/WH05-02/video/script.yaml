title: レパントの海戦とウィーン包囲
scenes:
  - board: whiteboard
    steps:
      - say: コンスタンティノープル陥落のあとも、オスマン帝国は広がり続けます。最盛期を作ったのが、スレイマン1世です。
        show:
          - { type: title, text: スレイマン1世とウィーン包囲 }
          - { type: text, at: [80, 140], w: 1120, text: "最盛期の君主 **スレイマン1世**" }
      - say: ハンガリー、北アフリカ、アラビア半島を次々とおさえ、1529年には、ハプスブルク家の本拠地、ウィーンを取り囲みました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, title: 1529年　第1次ウィーン包囲, text: "ハプスブルク家の本拠地をオスマン軍が包囲" }
      - say: ウィーンが落ちれば、ヨーロッパの心臓部に届く、という状況でした。しかし、補給の道が長すぎたことと、冬が近づいたことで、撤退します。
        show:
          - { type: text, at: [80, 400], w: 1120, text: "補給線が長すぎる＋冬の到来 → 撤退" }

  - board: whiteboard
    steps:
      - say: 地中海での対決が、1571年のレパントの海戦です。スペイン、ヴェネツィア、ローマ教皇の連合艦隊が、オスマン海軍を破りました。
        show:
          - { type: title, text: 1571年　レパントの海戦 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 連合艦隊, text: "スペイン・ヴェネツィア\nローマ教皇" }
          - { type: box, at: [660, 140], w: 540, color: gray, title: オスマン海軍, text: "敗北" }
      - say: オスマンは無敵ではない。そのことを、初めてヨーロッパに示した戦いでした。
        show:
          - { type: text, at: [80, 340], w: 1120, size: l, text: "「オスマンは **無敵ではない**」" }

  - board: whiteboard
    steps:
      - say: この海戦にスペインから参加して、腕に大けがを負ったのが、のちに『ドン・キホーテ』を書いた、セルバンテスです。
        show:
          - { type: title, text: セルバンテスの波乱の人生 }
          - type: list
            at: [80, 140]
            items: ["レパントの海戦で腕に大けが", "海賊につかまり **5年間** 捕らわれの身に", "のちに『ドン・キホーテ』を書く"]
      - say: そのあと海賊につかまり、5年間、捕らわれの身として過ごしました。波乱の人生経験が、世界的な名作を生んだのかもしれません。
        show: []
