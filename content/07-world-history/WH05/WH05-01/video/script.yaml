title: オスマン帝国の台頭とコンスタンティノープル陥落
scenes:
  - board: slide
    steps:
      - say: 第5章、「オスマン帝国とヨーロッパの対立」です。
        show:
          - { type: title, text: 第5章　オスマン帝国とヨーロッパの対立 }
      - say: 今のトルコから生まれたオスマン帝国が、ビザンツ帝国をほろぼし、ヨーロッパをおびやかします。そして、やがておとろえていくまでを見ていきます。
        show:
          - type: list
            items: ["オスマン帝国の台頭とコンスタンティノープル陥落", "レパントの海戦とウィーン包囲", "オスマン帝国の繁栄と衰退"]
      - say: 中東やバルカン半島の、今の国境や紛争の多くは、このオスマン帝国の広がりと崩壊に、そのルーツがあります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "600年続いたイスラムの大帝国の興亡と、ヨーロッパとの関係をつかむ" }

  - board: whiteboard
    steps:
      - say: 13世紀の終わり、ビザンツ帝国は、十字軍による首都の占領などで弱っていました。そのなかで、今のトルコで、イスラム教徒のオスマン家が小さな国を建てます。これがオスマン帝国の始まりです。
        show:
          - { type: title, text: オスマン帝国の誕生 }
          - { type: text, at: [80, 140], w: 1120, text: "13世紀末　今の **トルコ** でオスマン家が小国を建てる" }
      - say: 14世紀には、ヨーロッパ側のバルカン半島にも進出し、少しずつビザンツ帝国を取り囲んでいきました。
        show:
          - { type: text, at: [80, 230], w: 1120, text: "14世紀　**バルカン半島** へ進出 → ビザンツ帝国を包囲" }

  - board: whiteboard
    steps:
      - say: そして1453年、21歳のスルタン、メフメト2世が、1000年以上、難攻不落とされてきた、コンスタンティノープルを攻め落としました。
        show:
          - { type: title, text: 1453年　コンスタンティノープル陥落 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: メフメト2世（21歳のスルタン）, text: "難攻不落の都を攻め落とす → ビザンツ帝国滅亡" }
      - say: 町は、イスタンブールと呼ばれるようになり、オスマン帝国の首都になります。
        added: true
        show:
          - { type: text, at: [80, 320], w: 1120, text: "コンスタンティノープル → **イスタンブール**（オスマン帝国の首都）" }
      - say: この陥落は、ヨーロッパ中に衝撃を与えました。1000年続いたキリスト教の帝国がほろびたこと、そして、オスマン帝国がさらにヨーロッパに攻めてくるのでは、という恐怖です。
        show:
          - { type: text, at: [80, 410], w: 1120, color: pink, text: "ヨーロッパに衝撃と恐怖" }

  - board: whiteboard
    steps:
      - say: このとき、ビザンツの学者たちは、ギリシャ語の本を持って、イタリアへ逃げました。これが、ルネサンスを加速させた一因とも言われています。
        show:
          - { type: title, text: 歴史の皮肉 }
          - type: svg
            at: [80, 150]
            w: 1120
            h: 130
            anim: draw
            markup: |
              <rect x="10" y="30" width="300" height="70" rx="12" stroke="#f4a3b8"/>
              <rect x="410" y="30" width="300" height="70" rx="12" stroke="#9fc7ff"/>
              <rect x="810" y="30" width="300" height="70" rx="12" stroke="#f3d77a"/>
              <path d="M320 65 L400 65"/><path d="M382 53 L402 65 L382 77"/>
              <path d="M720 65 L800 65"/><path d="M782 53 L802 65 L782 77"/>
              <g stroke="none" font-size="24" fill="#e8eef5" text-anchor="middle"><text x="160" y="73">ビザンツ滅亡</text><text x="560" y="73">学者がイタリアへ</text><text x="960" y="73">ルネサンス加速</text></g>
      - say: 東のローマの終わりが、西の文化の再生をうながした。歴史の皮肉です。
        show:
          - { type: text, at: [80, 330], w: 1120, size: l, text: "東の終わりが、西の再生をうながした" }
