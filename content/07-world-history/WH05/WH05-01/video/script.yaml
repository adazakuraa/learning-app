  - board: whiteboard
    steps:
      - say: そして1453年、21歳のスルタン、メフメト2世が、1000年以上、難攻不落とされてきた、コンスタンティノープルを攻め落としました。
        show:
          - { type: title, text: 1453年　コンスタンティノープル陥落 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: yellow, title: メフメト2世（21歳のスルタン）, text: "難攻不落の都を攻め落とす → ビザンツ帝国滅亡" }
      - say: 町は、イスタンブールと呼ばれるようになり、オスマン帝国の首都になります。
        added: true
        show:
          - { type: text, at: [ 80, 320 ], w: 1120, text: "コンスタンティノープル → **イスタンブール**（オスマン帝国の首都）" }
      - say: この陥落は、ヨーロッパ中に衝撃を与えました。1000年続いたキリスト教の帝国がほろびたこと、そして、オスマン帝国がさらにヨーロッパに攻めてくるのでは、という恐怖です。
        show:
          - { type: text, at: [ 80, 410 ], w: 1120, color: pink, text: "ヨーロッパに衝撃と恐怖" }

  - board: whiteboard
    steps:
      - say: このとき、ビザンツの学者たちは、ギリシャ語の本を持って、イタリアへ逃げました。これが、ルネサンスを加速させた一因とも言われています。
        show:
          - { type: title, text: 歴史の皮肉 }
          - type: svg
            at: [ 80, 150 ]
            w: 1120
            h: 130
            anim: draw
            markup: |
              <rect x="10" y="30" width="300" height="70" rx="12" stroke="#f4a3b8"/>
              <rect x="410" y="30" width="300" height="70" rx="12" stroke="#9fc7ff"/>
