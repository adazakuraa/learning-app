title: オスマン帝国の繁栄と衰退
scenes:
  - board: whiteboard
    steps:
      - say: スレイマン1世の時代のオスマン帝国は、ただの軍事国家ではありませんでした。法律の整備、建築、詩、音楽が栄えた、文明の国でもありました。
        show:
          - { type: title, text: 繁栄の時代 }
          - type: list
            at: [80, 140]
            items: ["法律の整備（スレイマンは「立法者」と呼ばれた）", "壮大なモスクの建築", "詩・音楽"]
      - say: さまざまな民族や宗教の人々が、税を納めれば、自分の信仰を守って暮らすことができました。多くの民族をまとめる、ゆるやかなしくみが、長い繁栄を支えたのです。
        added: true
        show:
          - { type: box, at: [80, 380], w: 1120, color: green, text: "多民族・多宗教をゆるやかにまとめる → 長い繁栄" }

  - board: whiteboard
    steps:
      - say: しかし17世紀以降、しだいに西ヨーロッパとの差が開き始めます。18世紀の後半に、ヨーロッパで産業革命が始まると、経済と軍事の力の差は決定的になりました。
        show:
          - { type: title, text: ヨーロッパの病人 }
          - { type: text, at: [80, 140], w: 1120, text: "17世紀〜 差が開き始める → 18世紀後半 産業革命で差が決定的に" }
      - say: 19世紀には、ヨーロッパの病人、と呼ばれるほど、おとろえていきます。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, text: "19世紀　「**ヨーロッパの病人**」と呼ばれる" }

  - board: whiteboard
    steps:
      - say: 19世紀には、ギリシャやセルビアなど、支配されていた民族が次々と独立運動を起こし、領土は縮み続けます。
        show:
          - { type: title, text: 帝国の終わり }
          - type: list
            at: [80, 140]
            items: ["19世紀　ギリシャ・セルビアなどが独立", "第一次世界大戦で敗北 → 帝国は解体", "1923年　**トルコ共和国** の建国"]
      - say: そして第一次世界大戦で敗れて、帝国は解体され、1923年、そのあとを継ぐ国として、今のトルコ共和国が建てられました。600年以上続いた帝国の終わりです。
        show: []
      - say: 帝国がばらばらになったあとの中東やバルカン半島には、民族や宗教が入り混じったまま国境が引かれ、今も続く紛争の原因の一つになっています。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "帝国の解体 → 中東・バルカン半島の紛争の一因に" }
