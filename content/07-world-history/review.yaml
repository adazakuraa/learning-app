questions:
  - {u: WH01-01, p: 45, q: "ホモ・サピエンスがアフリカを出て世界に広がる途中で出会い、一部は交配したとされる、ほかの人類を何というでしょう？", a: [ネアンデルタール人]}
  - {u: WH01-02, p: 50, q: "粘土板に葦のペンで押しつけて書いた、メソポタミアで生まれた最古の文字を何というでしょう？", a: [楔形文字, くさび形文字]}
  - {u: WH01-02, p: 55, q: "「目には目を、歯には歯を」の同害報復の原則で知られる、バビロニアの法典を何というでしょう？", a: [ハンムラビ法典]}
  - {u: WH01-03, p: 50, q: "古代エジプトで神そのものとして崇められ、ピラミッドに葬られた王を何というでしょう？", a: [ファラオ]}
  - {u: WH01-04, p: 40, q: "碁盤の目状の街路や上下水道を持つ、インダス文明の計画都市は何でしょう？", a: [モヘンジョ・ダロ, モヘンジョダロ]}
  - {u: WH01-05, p: 40, q: "地中海で交易し、アルファベットのもとになった文字をつくった海の民は何人でしょう？", a: [フェニキア人, フェニキア]}
  - {u: WH02-01, p: 45, q: "ペルシャ戦争の戦いで、勝利を伝えるために兵士が走ったという伝説がマラソンの由来となった戦いを何というでしょう？", a: [マラトンの戦い]}
  - {u: WH02-02, p: 50, q: "アレクサンドロス大王の遠征で生まれた、ギリシャ文化とオリエント文化が融合した文化を何というでしょう？", a: [ヘレニズム文化, ヘレニズム]}
  - {u: WH02-03, p: 45, q: "プラトンの弟子で、論理学から生物学・政治学まであらゆる学問を体系化し、「万学の祖」と呼ばれるのは誰でしょう？", a: [アリストテレス]}
  - {u: WH02-04, p: 55, q: "ルビコン川を渡って権力を握り、終身独裁官となったが暗殺された古代ローマの政治家は誰でしょう？", a: [カエサル, シーザー]}
  - {u: WH02-05, p: 45, q: "最後の五賢帝で、『自省録』を書いた哲人皇帝は誰でしょう？", a: [マルクス・アウレリウス, マルクスアウレリウス]}
  - {u: WH02-06, p: 40, q: "もとはキリスト教徒を迫害していたが回心し、異邦人への布教で大きな役割を果たした使徒は誰でしょう？", a: [パウロ]}
  - {u: WH02-07, p: 45, q: "フン族に追われたゲルマン人がローマ帝国に流れ込んだできごとを何というでしょう？", a: [ゲルマン民族の大移動, ゲルマン人の大移動]}
  - {u: WH03-01, p: 45, q: "ビザンツ帝国の都で、現在のイスタンブールにあたる都市を何というでしょう？", a: [コンスタンティノープル]}
  - {u: WH03-02, p: 45, q: "800年に教皇から西ローマ皇帝の冠を受けた、フランク王国の王は誰でしょう？", a: [カール大帝, シャルルマーニュ]}
  - {u: WH03-03, p: 45, q: "中世ヨーロッパの封建制度で、馬に乗り甲冑をまとって戦った軍事の担い手を何というでしょう？", a: [騎士]}
  - {u: WH03-04, p: 40, q: "1077年、破門された神聖ローマ皇帝ハインリヒ4世が雪の中で教皇に許しを請うた事件を何というでしょう？", a: [カノッサの屈辱]}
  - {u: WH03-05, p: 45, q: "イスラム暦の始まりとされる、622年にムハンマドがメッカからメディナへ移ったことを何というでしょう？", a: [ヒジュラ, 聖遷]}
  - {u: WH03-06, p: 40, q: "人口100万人を超え、「知恵の館」が置かれた、アッバース朝の都はどこでしょう？", a: [バグダード, バグダッド]}
  - {u: WH03-07, p: 45, q: "十字軍からエルサレムを奪い返し、その寛大さでも知られるイスラムの英雄は誰でしょう？", a: [サラディン]}
  - {u: WH03-08, p: 55, q: "モンゴルの部族を統一し、ユーラシアにまたがる帝国を築いた人物は誰でしょう？", a: [チンギス・ハン, チンギスハン]}
  - {u: WH03-09, p: 50, q: "1347年からヨーロッパで大流行し、人口の約3分の1を奪った感染症を何というでしょう？", a: [ペスト, 黒死病], r: [こくしびょう]}
  - {u: WH03-10, p: 45, q: "百年戦争の末期に「神の声」を聞いたとしてオルレアンを解放したフランスの少女は誰でしょう？", a: [ジャンヌ・ダルク, ジャンヌダルク]}
  - {u: WH04-01, p: 45, q: "農民出身から身を起こし、漢を建てた初代皇帝は誰でしょう？", a: [劉邦]}
  - {u: WH04-02, p: 40, q: "大運河の建設などで民衆を追い詰め、隋をわずか2代で滅ぼした皇帝は誰でしょう？", a: [煬帝]}
  - {u: WH04-03, p: 40, q: "征服戦争の惨状を悔いて仏教に帰依した、マウリヤ朝の王は誰でしょう？", a: [アショーカ王, アショカ王, アショーカ]}
  - {u: WH04-04, p: 50, q: "元の中国を旅し、『東方見聞録』で日本を「ジパング」と紹介したのは誰でしょう？", a: [マルコ・ポーロ, マルコポーロ]}
  - {u: WH05-01, p: 40, q: "1453年、21歳でコンスタンティノープルを攻め落としたオスマン帝国のスルタンは誰でしょう？", a: [メフメト2世]}
  - {u: WH05-02, p: 40, q: "レパントの海戦で腕に大けがを負い、のちに『ドン・キホーテ』を書いた作家は誰でしょう？", a: [セルバンテス]}
  - {u: WH05-02, p: 40, q: "オスマン帝国の最盛期を築き、ウィーンを包囲したスルタンは誰でしょう？", a: [スレイマン1世, スレイマン]}
  - {u: WH06-01, p: 55, q: "「モナ・リザ」を描き、解剖学や航空工学まで研究した万能の天才は誰でしょう？", a: [レオナルド・ダ・ヴィンチ, ダ・ヴィンチ, ダヴィンチ]}
  - {u: WH06-02, p: 45, q: "艦隊が人類初の世界一周を成し遂げたが、自らは途中で命を落とした航海者は誰でしょう？", a: [マゼラン]}
  - {u: WH06-03, p: 40, q: "わずかな兵でインカ帝国を征服した、スペインの征服者は誰でしょう？", a: [ピサロ]}
  - {u: WH06-04, p: 45, q: "ヨーロッパの武器、アフリカの奴隷、アメリカの砂糖などが大西洋を回った貿易を何というでしょう？", a: [三角貿易]}
  - {u: WH06-05, p: 45, q: "ルターが批判した、「買えば罪が赦される」としてカトリック教会が売ったものを何というでしょう？", a: [免罪符, 贖宥状]}
  - {u: WH06-06, p: 45, q: "望遠鏡で地動説の証拠を集めたが、宗教裁判にかけられたイタリアの科学者は誰でしょう？", a: [ガリレオ, ガリレオ・ガリレイ]}
  - {u: WH07-01, p: 35, q: "1555年、「各領主が自分の領地の宗教を決めてよい」とした妥協の取り決めを何というでしょう？", a: [アウクスブルクの和議]}
  - {u: WH07-02, p: 45, q: "1588年、イングランドを攻めて敗れた、スペインの「無敵艦隊」を何というでしょう？", a: [アルマダ]}
  - {u: WH07-03, p: 40, q: "フランスのアンリ4世が1598年に出し、プロテスタントに信仰の自由を認めた勅令を何というでしょう？", a: [ナントの勅令]}
  - {u: WH07-04, p: 45, q: "ピューリタン革命で国王チャールズ1世を処刑し、共和政を打ち立てた人物は誰でしょう？", a: [クロムウェル]}
  - {u: WH07-05, p: 50, q: "「太陽王」ルイ14世が建て、多くの貴族を住まわせた宮殿を何というでしょう？", a: [ヴェルサイユ宮殿, ベルサイユ宮殿]}
  - {u: WH07-06, p: 45, q: "1620年にメイフラワー号で北アメリカに渡った、ピューリタンの移民たちを何というでしょう？", a: [ピルグリム・ファーザーズ, ピルグリムファーザーズ]}
  - {u: WH07-07, p: 50, q: "ムガル帝国の皇帝シャー・ジャハーンが亡き妻のために建てた、白大理石の霊廟は何でしょう？", a: [タージ・マハル, タージマハル]}
  - {u: WH07-08, p: 40, q: "オーストリア継承戦争で、プロイセンにシュレジエンを奪われたハプスブルク家の女帝は誰でしょう？", a: [マリア・テレジア, マリアテレジア]}
  - {u: WH08-01, p: 45, q: "「すべての人間は平等に作られている」と記したアメリカ独立宣言を起草したのは誰でしょう？", a: [ジェファーソン, トマス・ジェファーソン]}
  - {u: WH08-02, p: 40, q: "フランス革命の恐怖政治の中心人物で、最後は自らも処刑された革命家は誰でしょう？", a: [ロベスピエール]}
  - {u: WH08-03, p: 50, q: "1815年、ナポレオンが最後に敗れた、ベルギーでの戦いを何というでしょう？", a: [ワーテルローの戦い, ワーテルロー]}
  - {u: WH08-04, p: 35, q: "ナポレオン後の秩序を話し合ったが、舞踏会ばかりで「会議は踊る、されど進まず」と皮肉られた会議を何というでしょう？", a: [ウィーン会議]}
  - {u: WH08-05, p: 50, q: "蒸気機関の効率を大幅に高めた改良者として知られる、イギリスの技術者は誰でしょう？", a: [ワット, ジェームズ・ワット]}
  - {u: WH08-06, p: 40, q: "貧しい生活を送ったマルクスを経済的に支え、『資本論』の完成を助けた盟友は誰でしょう？", a: [エンゲルス]}
  - {u: WH08-07, p: 45, q: "「鉄と血」によってドイツ統一を進めた「鉄血宰相」は誰でしょう？", a: [ビスマルク]}
  - {u: WH08-08, p: 40, q: "アフリカ人が一切参加しないまま、ヨーロッパ列強がアフリカの分割を取り決めた1884年からの会議を何というでしょう？", a: [ベルリン会議]}
  - {u: WH08-09, p: 40, q: "クリミア戦争で看護師として活躍し、近代看護の基礎を築いた女性は誰でしょう？", a: [ナイチンゲール]}
  - {u: WH09-01, p: 45, q: "第一次世界大戦前、ドイツ・オーストリア・イタリアの三国同盟に対抗した、イギリス・フランス・ロシアの関係を何というでしょう？", a: [三国協商]}
  - {u: WH09-02, p: 40, q: "レーニンの死後に権力を握り、粛清や強制収容所で数百万人を犠牲にしたソ連の指導者は誰でしょう？", a: [スターリン]}
  - {u: WH09-03, p: 40, q: "イタリアでファシスト党を率いて独裁体制を築いた人物は誰でしょう？", a: [ムッソリーニ]}
  - {u: WH09-04, p: 50, q: "ヒトラーが率いた、正式には国家社会主義ドイツ労働者党という政党を何というでしょう？", a: [ナチス, ナチ党, ナチ]}
  - {u: WH09-05, p: 45, q: "1944年、連合国軍がフランス北部に上陸し、西からドイツに迫った作戦を何というでしょう？", a: [ノルマンディー上陸作戦, ノルマンディー]}
  - {u: WH09-06, p: 40, q: "1942年、日本海軍が大敗し、太平洋戦争の転換点となった海戦を何というでしょう？", a: [ミッドウェー海戦]}
  - {u: WH09-07, p: 40, q: "アイヒマン裁判を傍聴し、「悪の凡庸さ」を指摘した哲学者は誰でしょう？", a: [ハンナ・アーレント, アーレント]}
  - {u: WH10-01, p: 45, q: "1957年に世界初の人工衛星を打ち上げ、宇宙開発競争でアメリカに衝撃を与えた国はどこでしょう？", a: [ソ連, ソビエト連邦]}
  - {u: WH10-02, p: 40, q: "一国が共産化すると周りも次々と共産化する、とアメリカがベトナム介入の根拠にした考えを何というでしょう？", a: [ドミノ理論]}
  - {u: WH10-03, p: 45, q: "キューバ危機のときのアメリカ大統領は誰でしょう？", a: [ケネディ, ジョン・F・ケネディ]}
  - {u: WH10-04, p: 40, q: "毛沢東が始め、旧文化の破壊を掲げて知識人を迫害し社会を大混乱させた運動を何というでしょう？", a: [文化大革命, 文革]}
  - {u: WH10-05, p: 45, q: "17のアフリカの国が独立した、1960年のことを何と呼ぶでしょう？", a: [アフリカの年]}
  - {u: WH10-06, p: 45, q: "1973年の第四次中東戦争のとき、産油国が原油価格を引き上げて起きた世界的な混乱を何というでしょう？", a: [オイルショック, 石油危機]}
  - {u: WH10-07, p: 45, q: "1990年、イラクが隣国クウェートに侵攻したことから起きた戦争を何というでしょう？", a: [湾岸戦争]}
  - {u: WH10-08, p: 45, q: "情報公開を意味する「グラスノスチ」と、立て直しを意味する「ペレストロイカ」を進めたソ連の指導者は誰でしょう？", a: [ゴルバチョフ]}
  - {u: WH11-01, p: 45, q: "9.11テロを起こしたアルカイダを率いていた人物は誰でしょう？", a: [ビン・ラディン, ビンラディン, ウサマ・ビン・ラディン]}
  - {u: WH11-02, p: 40, q: "1978年に改革開放政策を始め、中国の経済成長の道を開いた指導者は誰でしょう？", a: [鄧小平]}
  - {u: WH11-03, p: 45, q: "エリートと普通の市民という単純な対立で人々の不満をすくい上げる政治の手法を何というでしょう？", a: [ポピュリズム]}
