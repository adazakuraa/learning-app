title: ギリシャのポリスと民主政
scenes:
  - board: slide
    steps:
      - say: 第2章、「古代ギリシャ・ローマ」です。
        show:
          - { type: title, text: 第2章　古代ギリシャ・ローマ }
      - say: 民主政を生んだギリシャ、アレクサンドロス大王、哲学者たち。そして、地中海をまとめたローマ帝国と、キリスト教の誕生を見ていきます。
        show:
          - type: list
            items: ["ギリシャのポリスと民主政", "アレクサンドロス大王", "ソクラテス・プラトン・アリストテレス", "ローマとカエサル", "ローマ帝国の繁栄", "キリスト教の誕生と拡大", "ローマ帝国の分裂と滅亡"]
      - say: 民主主義、哲学、法律、カレンダー、道路。今のヨーロッパ、そして世界の考え方の土台が、この時代にできました。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "民主政・哲学・法・キリスト教という「西洋の土台」の誕生をつかむ" }

  - board: whiteboard
    steps:
      - say: 古代ギリシャは、一つの国ではなく、ポリスと呼ばれる都市国家の集まりでした。アテネ、スパルタなど、数百のポリスが、それぞれ独自の政治や軍隊を持っていました。
        show:
          - { type: title, text: ポリスとペルシャ戦争 }
          - { type: text, at: [80, 140], w: 1120, text: "ギリシャ ＝ 数百の **ポリス**（都市国家）の集まり" }
      - say: 紀元前5世紀、東の大国ペルシャが攻めてきます。ペルシャ戦争です。ふだんはばらばらのポリスが、めずらしく手を組んで戦い、奇跡的に勝利しました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: blue, title: ペルシャ戦争（前490〜前479年）, text: "大国ペルシャ vs ポリスの連合 → ギリシャの勝利" }
      - say: マラトンの戦いで、勝利を伝えるために走り続けた兵士の話が、マラソンという言葉の由来です。
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "マラトンの戦い → 「マラソン」の語源" }

  - board: whiteboard
    steps:
      - say: 戦争のあと、アテネが栄え、パルテノン神殿が作られます。そしてアテネが世界に残した最大の贈り物が、民主政です。
        show:
          - { type: title, text: アテネの民主政 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 直接民主政, text: "市民が全員で集まって、直接政治を決める" }
      - say: 市民が全員で集まり、直接、政治を決める。今の、代表を選ぶ間接民主主義とはちがいますが、市民が政治を決める、という原則はここから始まりました。
        show:
          - { type: text, at: [80, 310], w: 1120, text: "今の民主主義（代表を選ぶ）とはちがうが、原則のはじまり" }
      - say: ただし、アテネの市民とは、大人の男性だけで、女性、奴隷、外国人は入っていませんでした。
        show:
          - { type: text, at: [80, 400], w: 1120, color: pink, text: "「市民」は成人男性だけ（女性・奴隷・外国人は除外）" }

  - board: whiteboard
    steps:
      - say: 一方のスパルタは、正反対の軍国主義の国でした。男子は7歳から、国が管理する軍事教育を受け、厳しい訓練で最強の戦士に育てられます。スパルタ教育という言葉の由来です。
        show:
          - { type: title, text: アテネ vs スパルタ }
          - { type: box, at: [80, 140], w: 540, color: blue, title: アテネ, text: "民主政・文化" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: スパルタ, text: "軍国主義\n7歳から軍事教育" }
      - say: ペルシャ戦争でともに戦った両者でしたが、そのあとは主導権をめぐって対立し、ペロポネソス戦争でぶつかります。長い戦いでアテネは敗れ、ギリシャ全体が疲れ果てていきました。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "ペロポネソス戦争（前431〜前404年）→ アテネ敗北・ギリシャ全体が疲弊" }
      - say: 共通の敵がいなくなると、仲間同士で争い始める。歴史で何度もくり返されるパターンです。
        added: true
        show:
          - { type: text, at: [80, 480], w: 1120, color: gray, text: "共通の敵が消えると、仲間同士で争い始める" }
