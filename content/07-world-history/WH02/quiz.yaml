questions:
  - q: 古代ギリシャの、アテネやスパルタのような都市国家を何というか。
    a: [ポリス]
  - q: ギリシャからインド北西部まで遠征し、ギリシャ文化と東方の文化が混ざった「ヘレニズム文化」を広めたマケドニアの王は誰か。
    a: [アレクサンドロス大王, アレクサンドロス, アレクサンダー大王]
    show: アレクサンドロス大王
  - q: ローマの初代皇帝となり、共和政から帝政への転換をもたらした人物は誰か。
    a: [アウグストゥス, オクタウィアヌス, オクタヴィアヌス]
    show: アウグストゥス（オクタウィアヌス）
  - q: 約200年間続いた、ローマ帝国の安定と繁栄の時代を何というか。
    a: [パクス・ロマーナ, パクスロマーナ, ローマの平和]
    show: パクス・ロマーナ
  - q: 380年、キリスト教はローマ帝国で何になったか。
    a: [国教]
