title: ローマ帝国の繁栄
scenes:
  - board: whiteboard
    steps:
      - say: カエサルの暗殺後、ローマはふたたび内乱になります。カエサルの後継者、オクタウィアヌスと、カエサルの部下アントニウス、そしてエジプトのクレオパトラがからむ争いの末、オクタウィアヌスが勝ちました。
        show:
          - { type: title, text: 共和政から帝政へ }
          - { type: box, at: [80, 140], w: 540, color: green, title: オクタウィアヌス, text: "カエサルの後継者\n→ 勝利" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: アントニウス＋クレオパトラ, text: "敗北" }
      - say: 彼は、初代皇帝アウグストゥスとなります。共和政のローマから、皇帝が治める帝政のローマへの転換です。
        show:
          - { type: text, at: [80, 360], w: 1120, size: l, text: "初代皇帝 **アウグストゥス** → 帝政ローマへ" }
      - say: ちなみに、英語の8月、オーガストは、このアウグストゥスの名前から来ています。7月のカエサルと並んでいるのです。
        read: ちなみに、英語の8月、オーガストは、このアウグストゥスの名前から来ています。7月のカエサルと並んでいるのです。
        added: true
        show:
          - { type: text, at: [80, 460], w: 1120, color: gray, text: "8月 August ← アウグストゥス" }

  - board: whiteboard
    steps:
      - say: そこから、およそ200年間、パクス・ロマーナ、ローマの平和と呼ばれる、安定と繁栄の時代が続きました。
        show:
          - { type: title, text: パクス・ロマーナ }
          - { type: image, src: 1000002907.webp, at: [700, 120], w: 500, caption: ローマ帝国の最大領土 }
          - { type: text, at: [80, 140], w: 580, text: "約200年の **ローマの平和**" }
      - say: すべての道はローマに通ず、と言われた道路網、水道橋による上下水道、統一された法律。どれも、今のインフラの原型と言えるものです。
        show:
          - type: list
            at: [80, 220]
            w: 580
            items: ["道路網「すべての道はローマに通ず」", "水道橋・上下水道", "統一された法律（ローマ法）"]
      - say: 地図を見ると、地中海をぐるりと囲む、巨大な帝国だったことがわかります。
        show:
          - { type: text, at: [80, 480], w: 580, color: gray, text: "地中海をぐるりと囲む大帝国" }

  - board: whiteboard
    steps:
      - say: 五賢帝と呼ばれる、すぐれた皇帝が続いた時代が最盛期です。最後の五賢帝、マルクス・アウレリウスは、哲学者の皇帝として知られ、戦場で書き続けた日記、『自省録』を残しています。
        show:
          - { type: title, text: 哲人皇帝の日記 }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: マルクス・アウレリウス『自省録』, text: "戦場で書き続けた、自分を見つめる日記" }
      - say: 今日もいやな人間に会った。でも、わたしが怒るかどうかは、わたしが決められる。そんな内容が続くこの日記は、今でも自己啓発の本として読まれています。
        show:
          - { type: box, at: [80, 300], w: 1120, color: yellow, text: "「いやな人に会っても、怒るかどうかは自分で決められる」" }
      - say: 2000年前の皇帝も、今のわたしたちと同じことで悩んでいたのです。
        show:
          - { type: text, at: [80, 460], w: 1120, color: gray, text: "2000年前の皇帝も、今の人と同じことで悩んでいた" }
