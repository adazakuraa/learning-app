title: アレクサンドロス大王
scenes:
  - board: whiteboard
    steps:
      - say: 戦争で疲れたギリシャのポリスを、北の新しい国、マケドニアがおさえます。その王の息子が、アレクサンドロス3世、のちに大王と呼ばれる人物です。
        show:
          - { type: title, text: アレクサンドロス大王 }
          - { type: text, at: [80, 140], w: 1120, text: "疲れたギリシャ → 北の **マケドニア** が支配" }
      - say: 家庭教師は、あの哲学者、アリストテレスでした。20歳で王になると、東方遠征を始め、ペルシャ帝国、エジプト、中央アジア、インドの北西部まで征服します。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: 東方遠征, text: "ペルシャ・エジプト・中央アジア・インド北西部まで" }
      - say: 亡くなったのは32歳。わずか10年あまりの遠征で、これほどの帝国を作った人物は、ほかにいません。
        show:
          - { type: text, at: [80, 400], w: 1120, size: l, text: "20歳で即位 → **10年あまり** で大帝国 → 32歳で死去" }

  - board: whiteboard
    steps:
      - say: 大王の人柄を伝える話が、いくつも残っています。
        show:
          - { type: title, text: 大王の人柄 }
      - say: 日なたぼっこをしていた哲学者ディオゲネスに、大王が、何か望みはあるか、とたずねると、日なたをふさがないでくれ、と答えました。大王は笑って、もし私がアレクサンドロスでなければ、ディオゲネスになりたかった、と言ったそうです。
        show:
          - { type: box, at: [80, 140], w: 1120, color: blue, title: ディオゲネスとの会話, text: "「何か望みは？」→「日なたをふさがないでくれ」" }
      - say: 砂漠の行軍中、部下が差し出した水を、全員に行きわたらないなら、一人では飲まない、と断った話もあります。
        show:
          - { type: box, at: [80, 300], w: 1120, color: green, title: 部下への思いやり, text: "「全員に行きわたらないなら、一人では飲まない」" }
      - say: しかし晩年は酒におぼれ、酔った勢いで友人を殺してしまい、激しく後悔したといいます。偉大な功績と、人間らしいあやまち。その両方を持った人物でした。
        show:
          - { type: text, at: [80, 460], w: 1120, color: pink, text: "晩年：酒におぼれ、友人を殺してしまう → 激しく後悔" }

  - board: whiteboard
    steps:
      - say: 大王の死後、帝国は部下たちによって分けられました。でも、ギリシャの文化が、東の世界にまで広がったことは、大きな遺産です。これをヘレニズム文化と呼びます。
        show:
          - { type: title, text: ヘレニズム文化 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: ヘレニズム文化, text: "ギリシャ文化 ＋ 東方の文化 が混ざり合う" }
      - say: その影響は、インドを通って、遠く日本にも届いています。仏像が、人の姿で表されるようになったのは、ギリシャ彫刻の影響とも言われているのです。
        added: true
        show:
          - { type: text, at: [80, 320], w: 1120, color: gray, text: "人の姿の仏像 ← ギリシャ彫刻の影響とも" }
