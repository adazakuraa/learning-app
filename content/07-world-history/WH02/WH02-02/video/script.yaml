title: アレクサンドロス大王
scenes:
  - board: whiteboard
    steps:
      - say: 戦争で疲れたギリシャのポリスを、北の新しい国、マケドニアがおさえます。その王の息子が、アレクサンドロス3世、のちに大王と呼ばれる人物です。
        show:
          - { type: title, text: アレクサンドロス大王 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "疲れたギリシャ → 北の **マケドニア** が支配" }
      - say: 家庭教師は、あの哲学者、アリストテレスでした。20歳で王になると、東方遠征を始め、ペルシャ帝国、エジプト、中央アジア、インドの北西部まで征服します。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: yellow, title: 東方遠征, text: "ペルシャ・エジプト・中央アジア・インド北西部まで" }
      - say: 亡くなったのは32歳。わずか10年あまりの遠征で、これほどの帝国を作った人物は、ほかにいません。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, size: l, text: "20歳で即位 → **10年あまり** で大帝国 → 32歳で死去" }
  - gen: map
    board: whiteboard
    steps:
      - say: 大王の遠征を、地図でたどってみましょう。ギリシャの北、マケドニアを出発した大王は、小アジアを通り、エジプトに入って、アレクサンドリアという町をつくりました。
        show:
          - { type: title, text: アレクサンドロス大王の遠征 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M186.2,235.8L184.3,241.2L162.5,242.8L162.6,239.7L144.1,236.1L147,228.2L155.3,234.5L167.1,233.4L178.3,234.8L178,238ZM135.6,119L146.9,119.6L159,114.1L169.7,121.1L183.4,119.2L183.6,109.1L190.9,114.5L186.3,127.1L182.7,129.4L173.4,128.8L165.5,126.9L147.2,132.1L157.7,143.3L150,146.5L141.6,146.6L133.6,136.3L130.7,140.7L134.1,152.5L141.7,161.7L136,166L144.4,174.9L151.9,180.5L152.1,191.4L138.1,186.3L142.6,196.1L133,198.1L138.7,214.8L128.7,215L116.2,206.8L110.5,191.6L107.9,178.8L102,169.9L94.2,158.7L93.2,153.2L100.2,143.6L101.1,137.1L106.1,134.3L106.3,129L116.3,127.2L122.1,122.8L130.2,123.2L132.7,119.7Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <path d="M128.8 129.9 L189.4 141.8 L287.9 194.3 L336.4 219 L318.2 277.9 L257.6 313.6" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M277.5 312 L257.6 313.6 L268.7 297" stroke="#f4a3b8" stroke-width="5"/>
              <circle cx="128.8" cy="129.9" r="9" fill="#f3d77a" stroke="#0b1c2c" stroke-width="2.5"/>
              <circle cx="240.9" cy="310.1" r="9" fill="#f4a3b8" stroke="#0b1c2c" stroke-width="2.5"/>
            id: mo0
          - { type: text, text: マケドニア, at: [ 209, 228 ], size: s, color: yellow, anim: fade, id: ml0_0 }
          - { type: text, text: アレクサンドリア, at: [ 281, 464 ], size: s, color: pink, anim: fade, id: ml0_1 }
        added: true
      - say: さらに、ペルシャ帝国をたおして、東へ進み、インダス川のほとりにまで達しました。わずか10年ほどで、ギリシャからインドにまたがる、大帝国ができたのです。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M257.6 313.6 L340.9 259.7 L439.4 222.7 L460.6 286.9 L589.4 333 L727.3 313.6 L833.3 250.5 L878.8 295.8" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M872.2 277 L878.8 295.8 L859.9 289.3" stroke="#f4a3b8" stroke-width="5"/>
              <circle cx="589.4" cy="333" r="9" fill="#f4a3b8" stroke="#0b1c2c" stroke-width="2.5"/>
              <circle cx="878.8" cy="295.8" r="9" fill="#f4a3b8" stroke="#0b1c2c" stroke-width="2.5"/>
            id: mo1
          - { type: text, text: ペルシャ（ペルセポリス）, at: [ 669, 489 ], size: s, color: pink, anim: fade, id: ml1_0 }
          - { type: text, text: インダス川, at: [ 999, 392 ], size: s, color: pink, anim: fade, id: ml1_1 }
        added: true

  - board: whiteboard
    steps:
      - say: 大王の人柄を伝える話が、いくつも残っています。
        show:
          - { type: title, text: 大王の人柄 }
      - say: 日なたぼっこをしていた哲学者ディオゲネスに、大王が、何か望みはあるか、とたずねると、日なたをふさがないでくれ、と答えました。大王は笑って、もし私がアレクサンドロスでなければ、ディオゲネスになりたかった、と言ったそうです。
        show:
          - { type: box, at: [ 80, 140 ], w: 1120, color: blue, title: ディオゲネスとの会話, text: "「何か望みは？」→「日なたをふさがないでくれ」" }
      - say: 砂漠の行軍中、部下が差し出した水を、全員に行きわたらないなら、一人では飲まない、と断った話もあります。
        show:
          - { type: box, at: [ 80, 300 ], w: 1120, color: green, title: 部下への思いやり, text: "「全員に行きわたらないなら、一人では飲まない」" }
      - say: しかし晩年は酒におぼれ、酔った勢いで友人を殺してしまい、激しく後悔したといいます。偉大な功績と、人間らしいあやまち。その両方を持った人物でした。
        show:
          - { type: text, at: [ 80, 460 ], w: 1120, color: pink, text: "晩年：酒におぼれ、友人を殺してしまう → 激しく後悔" }

  - board: whiteboard
    steps:
      - say: 大王の死後、帝国は部下たちによって分けられました。でも、ギリシャの文化が、東の世界にまで広がったことは、大きな遺産です。これをヘレニズム文化と呼びます。
        show:
          - { type: title, text: ヘレニズム文化 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: yellow, title: ヘレニズム文化, text: "ギリシャ文化 ＋ 東方の文化 が混ざり合う" }
      - say: その影響は、インドを通って、遠く日本にも届いています。仏像が、人の姿で表されるようになったのは、ギリシャ彫刻の影響とも言われているのです。
        added: true
        show:
          - { type: text, at: [ 80, 320 ], w: 1120, color: gray, text: "人の姿の仏像 ← ギリシャ彫刻の影響とも" }
