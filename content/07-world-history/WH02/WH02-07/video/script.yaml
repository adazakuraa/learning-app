title: ローマ帝国の分裂と滅亡
scenes:
  - board: whiteboard
    steps:
      - say: マルクス・アウレリウスの死後、ローマ帝国は、3世紀の危機と呼ばれる、激しく揺れる時代を迎えます。
        show:
          - { type: title, text: 3世紀の危機 }
      - say: およそ50年の間に、20人以上の皇帝が立っては倒れ、伝染病、経済の混乱、外敵の侵入が重なりました。
        show:
          - type: list
            at: [80, 140]
            items: ["約50年で **20人以上** の皇帝が交代", "伝染病", "経済の混乱", "外敵の侵入"]
      - say: 映画グラディエーターは、その直前、マルクス・アウレリウスの死の前後を舞台にしています。
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "映画「グラディエーター」はその直前の時代が舞台" }

  - board: whiteboard
    steps:
      - say: 395年、帝国は東と西に分かれます。
        show:
          - { type: title, text: 東西分裂と西ローマの滅亡 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 西ローマ帝国, text: "ゲルマン民族の大移動で弱体化\n**476年** 滅亡" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: 東ローマ帝国（ビザンツ帝国）, text: "その後も約1000年続く\n**1453年** オスマン帝国に滅ぼされる" }
      - say: 西ローマ帝国は、北からのゲルマン民族の大移動のなかで急速に弱まり、476年にほろびました。ゲルマン民族とは、今のドイツ人やイギリス人、北欧の人々の祖先です。
        show:
          - { type: text, at: [80, 370], w: 1120, text: "ゲルマン民族 ＝ 今のドイツ・イギリス・北欧の人々の祖先" }
      - say: これが、西洋での古代の終わりと、中世の始まりとされています。
        show:
          - { type: text, at: [80, 450], w: 1120, size: l, text: "476年 ＝ 古代の終わり・**中世** の始まり" }
      - say: 一方、東ローマ帝国、またの名をビザンツ帝国は、西がほろびたあとも、およそ1000年続き、1453年に、オスマン帝国によってほろぼされるまで生きのびました。
        show: []
