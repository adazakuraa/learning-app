title: ソクラテス・プラトン・アリストテレス
scenes:
  - board: whiteboard
    steps:
      - say: アテネでは、のちの世界に大きな影響を与えた、三人の哲学者が活躍しました。ソクラテス、プラトン、アリストテレス。先生と弟子、三代の流れです。
        show:
          - { type: title, text: 西洋哲学の三代 }
          - type: svg
            at: [80, 150]
            w: 1120
            h: 120
            anim: draw
            markup: |
              <rect x="10" y="20" width="300" height="80" rx="12" stroke="#f3d77a"/>
              <rect x="410" y="20" width="300" height="80" rx="12" stroke="#9fc7ff"/>
              <rect x="810" y="20" width="300" height="80" rx="12" stroke="#9be0b0"/>
              <path d="M320 60 L400 60"/><path d="M382 48 L402 60 L382 72"/>
              <path d="M720 60 L800 60"/><path d="M782 48 L802 60 L782 72"/>
              <g stroke="none" font-size="28" fill="#e8eef5" text-anchor="middle"><text x="160" y="70">ソクラテス</text><text x="560" y="70">プラトン</text><text x="960" y="70">アリストテレス</text></g>
      - say: 哲学の授業でも学びましたね。ここでは、歴史の中の人物として見てみましょう。
        added: true
        show: []

  - board: whiteboard
    steps:
      - say: ソクラテスは、町かどで人々に、正義とは何か、と問い続け、わかっているつもりの人の矛盾を明らかにしていきました。無知の知です。
        show:
          - { type: title, text: ソクラテス }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 無知の知, text: "「自分は知らない」と自覚することが、知のはじまり" }
      - say: これをうとましく思った人々に訴えられ、若者を堕落させた、として死刑の判決を受けます。
        show:
          - { type: text, at: [80, 310], w: 1120, text: "「神を冒涜し、若者を堕落させた」として死刑判決" }
      - say: 脱獄のチャンスがあったのに、法に従わない者が法を語る資格はない、として、毒を飲んで死を受け入れました。泣く弟子たちを、逆になぐさめながら、だったといいます。
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "脱獄を拒み、毒を飲んで死を受け入れる" }

  - board: whiteboard
    steps:
      - say: 弟子のプラトンは、師の死に深く衝撃を受け、なぜ正しい人が不正な裁判で死ななければならないのか、と問い続けました。その答えが、哲学者が政治をするべきだ、という、哲人政治の考えです。
        show:
          - { type: title, text: プラトンとアリストテレス }
          - { type: box, at: [80, 140], w: 540, color: blue, title: プラトン, text: "師の死に衝撃\n→「哲学者が政治をすべき」\n（哲人政治）" }
      - say: その弟子のアリストテレスは、論理学、生物学、物理学、倫理学、政治学など、あらゆる学問に業績を残した、万学の祖です。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: アリストテレス, text: "あらゆる学問を研究\n「万学の祖」\n大王の家庭教師" }
      - say: そして、アレクサンドロス大王の家庭教師でもありました。大王に、未知の土地の動物や植物を集めて送ってくれ、と頼み、遠征軍は、征服と同時に、師へ標本を送り続けたとされています。世界最大の哲学者と、世界最大の征服者の、ぜいたくな師弟関係です。
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "遠征軍は、征服しながら師に動植物の標本を送り続けた" }
