          - { type: text, text: ガリア（今のフランス）, at: [ 467, 358 ], size: s, color: green, anim: fade, id: ml1_0 }
        added: true

  - board: whiteboard
    steps:
      - say: しかし、急な拡大は、社会のゆがみも大きくしました。征服地から大量の奴隷が流れこみ、小さな農家が没落して、格差が広がります。共和政のローマは、内乱の時代に入りました。
        show:
          - { type: title, text: カエサルの登場 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "大量の奴隷 → 中小農民が没落 → 格差拡大 → **内乱**" }
      - say: この混乱のなかで現れたのが、カエサルです。すぐれた軍事の才能を示し、民衆から絶大な支持を集めました。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: yellow, title: カエサル（前100〜前44年）, text: "軍事の天才・民衆の絶大な支持" }
      - say: 若いころ海賊につかまったとき、身代金が安すぎる、もっと高くしろ、と要求し、解放されたら必ず戻ってつかまえる、と予告しました。そして本当に軍を集めて、海賊を全員つかまえたのです。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, color: gray, text: "海賊に「身代金が安すぎる」→ 解放後、本当に全員つかまえた" }

  - board: whiteboard
    steps:
      - say: 独裁の権力を握ったカエサルは、終身の独裁官になりますが、共和政を守ろうとする議員たちに暗殺されます。
        show:
          - { type: title, text: 暗殺とカレンダー }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "終身独裁官 → 共和政を守ろうとする議員たちに **暗殺**（前44年）" }
      - say: 味方だと思っていたブルータスをふくむ、60人以上が加わり、23か所の刺し傷が死因だったとされます。ブルータス、お前もか、という言葉が有名ですが、本当に言ったかはわかっていません。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: pink, text: "「ブルータス、お前もか」（本当に言ったかは不明）" }
      - say: カエサルはカレンダーも改革し、今の暦のもとになった、ユリウス暦を作りました。英語の7月、ジュライは、カエサルの名前、ユリウスから来ています。
        read: カエサルはカレンダーも改革し、今の暦のもとになった、ユリウス暦を作りました。英語の7月、ジュライは、カエサルの名前、ユリウスから来ています。
        show:
          - { type: box, at: [ 80, 390 ], w: 1120, color: green, title: ユリウス暦, text: "今の暦のもと　7月 July ← ユリウス（Julius）" }
