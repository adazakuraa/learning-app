title: ローマとカエサル
scenes:
  - board: whiteboard
    steps:
      - say: ギリシャが文化で輝いていたころ、イタリア半島では、ローマが力をつけていました。数百年かけてイタリア半島をまとめ、地中海全体へと広がっていきます。
        show:
          - { type: title, text: ローマの強さ }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "イタリア半島を統一 → **地中海全体** へ" }
      - say: ローマの強さは、負かした相手を取りこむのがうまかったことです。征服した人々にも、ローマの市民権を与えて仲間にする。この柔軟さが、拡大を支えました。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: green, title: 敗者を取りこむ, text: "征服した人々にもローマ市民権を与え、仲間にする" }
      - say: ローマはギリシャを武力で征服しましたが、その文化や哲学を熱心に取り入れました。ギリシャはローマに征服されたが、ローマはギリシャ文化に征服された、と言われます。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, color: gray, text: "「ギリシャはローマに征服され、ローマはギリシャ文化に征服された」" }
  - gen: map
    board: whiteboard
    steps:
      - say: ローマは、イタリア半島の、まんなかあたりの都市です。ここから、まずイタリア半島を統一し、地中海へと広がっていきました。
        show:
          - { type: title, text: ローマとガリア }
