title: キリスト教の誕生と拡大
scenes:
  - board: whiteboard
    steps:
      - say: ローマの平和の時代、帝国の東、ユダヤ地方で、イエス・キリストが生まれました。
        show:
          - { type: title, text: イエスの教え }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "ローマ帝国の東・**ユダヤ地方** でイエスが生まれる" }
      - say: 30歳ごろから教えを広め始め、神の国が来ること、愛と許しを説きました。民衆には支持されましたが、ユダヤ教の指導者たちとぶつかり、ローマによって十字架にかけられて処刑されます。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: yellow, title: イエスの教え, text: "神の国の到来・**愛と許し**" }
          - { type: text, at: [ 80, 400 ], w: 1120, text: "ユダヤ教の指導者と対立 → ローマにより **十字架刑**" }
  - gen: map
    board: whiteboard
    steps:
      - say: イエスが生まれたユダヤ地方は、今のイスラエルやパレスチナのあたり、ローマ帝国の、東のはしです。
        show:
          - { type: title, text: キリスト教が広がった道 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M801.1,376.4L800.6,378.4L800.2,379.8L800.2,381.5L800.8,382.4L801.6,384.3L802.1,386.2L801.1,387.8L801.2,389.4L801.5,390.7L802.3,392.3L800.8,395.2L799.2,397.9L798.8,399.4L797.4,399.6L793.9,401.2L793.5,401.6L792.9,402.5L792.8,403.2L792.3,410.6L790.4,410.4L788.1,408.8L787.7,407.4L787,406.9L785.4,406.8L782.3,406L778.8,408.5L777.3,412.4L776.9,414.3L775.7,418.3L776.2,420.7L776.4,423.8L776.7,426.4L776.4,427.9L775.7,428.7L775.9,429.3L776.5,429.5L778.4,428.9L780.5,429.5L782.5,430.8L782.6,431.7L781.2,432.2L777.9,434.2L775.6,436.5L775,438.6L773.4,443.2L773.6,444.1L774.4,444.7L779.8,444.2L784.6,442.3L788.3,440.4L789.5,440.5L788.7,445.5L788.1,448.5L788.3,449.1L789.2,451.7L787.6,456.6L785.9,460.6L785.2,462.4L783.5,466.5L781.8,471.3L780.9,474.7L781.1,475.9L780.6,481.9L780.9,483.7L778.9,488.9L778.4,491.5L777.6,495L776.2,502.4L774.3,504.8L773.3,502.1L771.2,494.2L769.7,488.8L767.6,482L764,473.9L763.7,471.9L762.9,469.1L760.4,461.6L758.4,456.2L756.1,449.3L759,446.6L759,444.3L763.9,439L763.8,438.5L762.5,437L762.7,436.8L768.1,426.9L771.5,417.1L774.8,403.4L777.1,396.4L779.1,391.8L780,387.9L783.2,387.6L785.5,388L788.4,388.2L790.7,386.7L791.8,382.4L793.1,381.7L793.7,382.8L794.4,381.6L797.4,379.7L798.8,378.4L800.3,376.9Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <path d="M762.5,437L763.8,438.5L763.9,439L759,444.3L759,446.6L756.1,449.3L755.2,446.6L754.8,445.6L760,440.4ZM792.3,410.6L792.9,415.7L791.8,420.2L791.7,424L792.5,431.2L790.8,434.2L789.9,437.8L789.5,440.5L788.3,440.4L784.6,442.3L779.8,444.2L774.4,444.7L773.6,444.1L773.4,443.2L775,438.6L775.6,436.5L777.9,434.2L781.2,432.2L782.6,431.7L782.5,430.8L780.5,429.5L778.4,428.9L776.5,429.5L775.9,429.3L775.7,428.7L776.4,427.9L776.7,426.4L776.4,423.8L776.2,420.7L775.7,418.3L776.9,414.3L777.3,412.4L778.8,408.5L782.3,406L785.4,406.8L787,406.9L787.7,407.4L788.1,408.8L790.4,410.4Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <circle cx="783.1" cy="430.7" r="9" fill="#f3d77a" stroke="#0b1c2c" stroke-width="2.5"/>
            id: mo0
          - { type: text, text: エルサレム, at: [ 939, 571 ], size: s, color: yellow, anim: fade, id: ml0_0 }
        added: true
      - say: イエスの死後、使徒パウロたちは、小アジアやギリシャの町をめぐって布教し、ついに、帝国の都、ローマにまで、教えを伝えました。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M783.1 430.7 L809.1 283 L693.9 227.5 L564.8 222.6 L441.8 224 L306.1 185.1 L153.8 79.5" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M163.6 96.9 L153.8 79.5 L173.5 82.6" stroke="#f4a3b8" stroke-width="5"/>
              <circle cx="153.8" cy="79.5" r="9" fill="#f4a3b8" stroke="#0b1c2c" stroke-width="2.5"/>
            id: mo1
          - { type: text, text: ローマ, at: [ 274, 175 ], size: s, color: pink, anim: fade, id: ml1_0 }
          - { type: text, text: 小アジア, at: [ 806, 332 ], size: s, color: pink, anim: fade, id: ml1_1 }
          - { type: text, text: ギリシャ, at: [ 478, 409 ], size: s, color: pink, anim: fade, id: ml1_2 }
        added: true

  - board: whiteboard
    steps:
      - say: 弟子たちは、イエスは死んだあと、よみがえった、と信じ、それがキリスト教の中心になりました。
        show:
          - { type: title, text: パウロと世界宗教への道 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "弟子たち「イエスは **復活** した」→ キリスト教の核心" }
      - say: 特に大切なのが、パウロです。もとはキリスト教徒を迫害する側にいましたが、ある日、天の光に打たれてイエスの声を聞いた、という体験をして、もっとも熱心な伝道者になりました。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: blue, title: パウロ, text: "迫害する側 → 劇的な回心 → いちばん熱心な伝道者" }
      - say: パウロが地中海の各地に教会を作ったことで、キリスト教は、ユダヤ人だけの宗教から、世界の宗教へと成長しました。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, size: l, text: "ユダヤ人の宗教 → **世界宗教** へ" }

  - board: whiteboard
    steps:
      - say: はじめのキリスト教は、ローマ帝国で激しく迫害されました。でも、迫害はかえって信者の結びつきを強め、信者は増えていきます。
        show:
          - { type: title, text: 迫害から国教へ }
          - type: svg
            at: [ 80, 150 ]
            w: 1120
            h: 140
            anim: draw
            markup: |
              <rect x="10" y="30" width="300" height="80" rx="12" stroke="#f4a3b8"/>
              <rect x="410" y="30" width="300" height="80" rx="12" stroke="#9fc7ff"/>
              <rect x="810" y="30" width="300" height="80" rx="12" stroke="#f3d77a"/>
              <path d="M320 70 L400 70"/><path d="M382 58 L402 70 L382 82"/>
              <path d="M720 70 L800 70"/><path d="M782 58 L802 70 L782 82"/>
              <g stroke="none" font-size="26" fill="#e8eef5" text-anchor="middle"><text x="160" y="79">迫害</text><text x="560" y="79">313年 公認</text><text x="960" y="79">380年 国教</text></g>
      - say: そして313年、コンスタンティヌス帝がキリスト教を認め、380年には、ついにローマ帝国の国の宗教、国教にまでなりました。
        show:
          - { type: text, at: [ 80, 330 ], w: 1120, text: "コンスタンティヌス帝が公認（313年）→ ローマ帝国の **国教**（380年）" }
      - say: 迫害されていた小さな集団が、300年ほどで、帝国の宗教になる。おさえつけるほど、かえって強くなることがある、という例です。
        added: true
        show:
          - { type: text, at: [ 80, 420 ], w: 1120, color: gray, text: "おさえつけるほど、かえって強くなることがある" }
