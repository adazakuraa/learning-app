title: キリスト教の誕生と拡大
scenes:
  - board: whiteboard
    steps:
      - say: ローマの平和の時代、帝国の東、ユダヤ地方で、イエス・キリストが生まれました。
        show:
          - { type: title, text: イエスの教え }
          - { type: text, at: [80, 140], w: 1120, text: "ローマ帝国の東・**ユダヤ地方** でイエスが生まれる" }
      - say: 30歳ごろから教えを広め始め、神の国が来ること、愛と許しを説きました。民衆には支持されましたが、ユダヤ教の指導者たちとぶつかり、ローマによって十字架にかけられて処刑されます。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: イエスの教え, text: "神の国の到来・**愛と許し**" }
          - { type: text, at: [80, 400], w: 1120, text: "ユダヤ教の指導者と対立 → ローマにより **十字架刑**" }

  - board: whiteboard
    steps:
      - say: 弟子たちは、イエスは死んだあと、よみがえった、と信じ、それがキリスト教の中心になりました。
        show:
          - { type: title, text: パウロと世界宗教への道 }
          - { type: text, at: [80, 140], w: 1120, text: "弟子たち「イエスは **復活** した」→ キリスト教の核心" }
      - say: 特に大切なのが、パウロです。もとはキリスト教徒を迫害する側にいましたが、ある日、天の光に打たれてイエスの声を聞いた、という体験をして、もっとも熱心な伝道者になりました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: blue, title: パウロ, text: "迫害する側 → 劇的な回心 → いちばん熱心な伝道者" }
      - say: パウロが地中海の各地に教会を作ったことで、キリスト教は、ユダヤ人だけの宗教から、世界の宗教へと成長しました。
        show:
          - { type: text, at: [80, 400], w: 1120, size: l, text: "ユダヤ人の宗教 → **世界宗教** へ" }

  - board: whiteboard
    steps:
      - say: はじめのキリスト教は、ローマ帝国で激しく迫害されました。でも、迫害はかえって信者の結びつきを強め、信者は増えていきます。
        show:
          - { type: title, text: 迫害から国教へ }
          - type: svg
            at: [80, 150]
            w: 1120
            h: 140
            anim: draw
            markup: |
              <rect x="10" y="30" width="300" height="80" rx="12" stroke="#f4a3b8"/>
              <rect x="410" y="30" width="300" height="80" rx="12" stroke="#9fc7ff"/>
              <rect x="810" y="30" width="300" height="80" rx="12" stroke="#f3d77a"/>
              <path d="M320 70 L400 70"/><path d="M382 58 L402 70 L382 82"/>
              <path d="M720 70 L800 70"/><path d="M782 58 L802 70 L782 82"/>
              <g stroke="none" font-size="26" fill="#e8eef5" text-anchor="middle"><text x="160" y="79">迫害</text><text x="560" y="79">313年 公認</text><text x="960" y="79">380年 国教</text></g>
      - say: そして313年、コンスタンティヌス帝がキリスト教を認め、380年には、ついにローマ帝国の国の宗教、国教にまでなりました。
        show:
          - { type: text, at: [80, 330], w: 1120, text: "コンスタンティヌス帝が公認（313年）→ ローマ帝国の **国教**（380年）" }
      - say: 迫害されていた小さな集団が、300年ほどで、帝国の宗教になる。おさえつけるほど、かえって強くなることがある、という例です。
        added: true
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "おさえつけるほど、かえって強くなることがある" }
