title: 世界史とは・学ぶ意味
scenes:
  - board: slide
    steps:
      - say: 第0章、「この科目について」です。この動画では、世界史がどんな科目なのか、そして、学ぶとどんな良いことがあるのかを紹介します。
        show:
          - type: title
            text: 世界史とは
      - say: 世界史では、古代文明から現代まで、世界の国々や地域がどのように関わり合い、今の世界ができてきたかを学びます。
        show:
          - type: box
            w: 1100
            text: 世界史では、古代文明から現代まで、世界の国々や地域がどのように関わり合い、今の世界ができてきたかを学びます。
            color: yellow
            at:
              - 80
              - 200
  - board: slide
    steps:
      - say: この科目は、全部で11章です。第1章は人類の誕生と古代文明、第2章は古代ギリシャ・ローマ、第3章は中世ヨーロッパとイスラム世界、第4章はアジアの諸文明、第5章はオスマン帝国とヨーロッパの対立、第6章は大航海時代と宗教改革、第7章はヨーロッパの覇権争い、第8章は革命の時代、第9章は二つの世界大戦、第10章は冷戦と脱植民地化、第11章は現代世界の課題。
        show:
          - type: title
            text: この科目で学ぶこと
          - type: list
            items:
              - 第1章　人類の誕生と古代文明
              - 第2章　古代ギリシャ・ローマ
              - 第3章　中世ヨーロッパとイスラム世界
              - 第4章　アジアの諸文明
              - 第5章　オスマン帝国とヨーロッパの対立
              - 第6章　大航海時代と宗教改革
            at:
              - 60
              - 150
            w: 580
          - type: list
            items:
              - 第7章　ヨーロッパの覇権争い
              - 第8章　革命の時代
              - 第9章　二つの世界大戦
              - 第10章　冷戦と脱植民地化
              - 第11章　現代世界の課題
            at:
              - 660
              - 150
            w: 580
  - board: whiteboard
    steps:
      - say: では、世界史を学ぶ意味を、3つ紹介します。
        show:
          - type: title
            text: 学ぶ意味
      - say: ひとつ目は、国際ニュースの背景がわかる。中東やウクライナ、アジアの国際関係。今の対立や協力の多くには、長い歴史の背景があります。
        show:
          - type: box
            w: 1100
            text: |-
              **国際ニュースの背景がわかる**
              中東やウクライナ、アジアの国際関係。今の対立や協力の多くには、長い歴史の背景があります。
            color: yellow
            at:
              - 80
              - 140
      - say: ふたつ目は、ものの見方が広がる。同じ出来事でも、立場によって見え方が違います。いろいろな地域の歴史を知ると、ひとつの見方にとらわれなくなります。
        show:
          - type: box
            w: 1100
            text: |-
              **ものの見方が広がる**
              同じ出来事でも、立場によって見え方が違います。いろいろな地域の歴史を知ると、ひとつの見方にとらわれなくなります。
            color: green
            at:
              - 80
              - 305
      - say: みっつ目は、文化や芸術を深く楽しめる。美術、音楽、映画、旅行先の建物。歴史を知ると、作品や場所の意味がよくわかります。
        show:
          - type: box
            w: 1100
            text: |-
              **文化や芸術を深く楽しめる**
              美術、音楽、映画、旅行先の建物。歴史を知ると、作品や場所の意味がよくわかります。
            color: blue
            at:
              - 80
              - 470
  - board: whiteboard
    steps:
      - say: たとえば、国際ニュースを見るとき、海外旅行や美術館に行くとき、映画や小説の時代背景を知りたいとき、などに役立ちます。
        show:
          - type: title
            text: こんなときに役立つ
          - type: list
            items:
              - 国際ニュースを見るとき
              - 海外旅行や美術館に行くとき
              - 映画や小説の時代背景を知りたいとき
            at:
              - 80
              - 160
      - say: 学び方のコツは、地図と一緒に流れを追う。そして、「原因 → 出来事 → 結果」でつなげて覚える。それでは、第1章から始めましょう。
        show:
          - type: box
            w: 1100
            text: |-
              **学び方のコツ**
              ・**地図と一緒に**流れを追う
              ・「原因 → 出来事 → 結果」でつなげて覚える
            color: pink
            at:
              - 80
              - 420
