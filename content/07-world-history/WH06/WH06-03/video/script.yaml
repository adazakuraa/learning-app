title: アステカ・インカ帝国の滅亡
scenes:
  - board: whiteboard
    steps:
      - say: 新大陸にやってきた、スペインの征服者、コンキスタドールたちは、少ない人数で、アメリカ大陸の巨大な帝国をほろぼしました。
        show:
          - { type: title, text: 少数で大帝国を倒す }
          - { type: box, at: [80, 140], w: 540, color: pink, title: アステカ帝国（メキシコ）, text: "コルテス 約500人\n人口 数百万の帝国を征服" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: インカ帝国（南米）, text: "ピサロ 168人\nで征服" }
      - say: コルテスは、わずか500人ほどで、人口数百万のアステカ帝国を征服しました。ピサロは、168人で、南米のインカ帝国を征服します。
        show: []

  - board: whiteboard
    steps:
      - say: なぜ、こんなことができたのでしょうか。
        show:
          - { type: title, text: なぜ勝てたのか }
      - say: 天然痘で先住民が大量に亡くなったこと。アステカに敵対していた周りの民族が、スペイン側に協力したこと。そして、白い神が東からやってくる、という予言と重なって、混乱したことが重なりました。
        show:
          - type: list
            at: [80, 140]
            items: ["**天然痘** で先住民が大量に死亡", "アステカに敵対する民族がスペインに協力", "「白い神が東から来る」という予言と重なる混乱", "鉄の武器・馬・鉄砲"]
      - say: ピサロは、インカの皇帝アタワルパに、部屋いっぱいの金銀を差し出せば解放する、と約束しておきながら、受け取ったあとで処刑するという、裏切りをしています。
        show:
          - { type: box, at: [80, 420], w: 1120, color: pink, text: "部屋いっぱいの金銀を受け取ったあと、皇帝を処刑" }

  - board: whiteboard
    steps:
      - say: 征服のあと、ポトシ銀山、今のボリビアや、メキシコから、大量の銀がヨーロッパに流れこみます。その結果、ヨーロッパ全体の物価が急に上がる、価格革命が起こりました。
        show:
          - { type: title, text: 価格革命とスペインの皮肉 }
          - { type: text, at: [80, 140], w: 1120, text: "大量の銀が流入 → 物価が急上昇（**価格革命**）" }
      - say: お金の量が急に増えると、お金の価値が下がり、ものの値段が上がる。今のインフレと同じしくみです。
        added: true
        show:
          - { type: box, at: [80, 230], w: 1120, color: blue, text: "お金が増える → お金の価値が下がる → 物価が上がる（＝ インフレ）" }
      - say: 豊かになったスペインは、一時ヨーロッパ最強の国になります。でも、その富にたよりすぎて、自分の国の産業が育たず、長い目で見ておとろえていく、という皮肉な結果になりました。
        show:
          - { type: text, at: [80, 400], w: 1120, text: "銀にたよりすぎ → 国内産業が育たず → 長期的な衰退" }
