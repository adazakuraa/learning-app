        added: true
      - say: そして、ボリビアのポトシ銀山から、大量の銀が、スペインへ運ばれていきました。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M576.1 417.2 L544.6 404.8 L470.3 328.5 L470.3 209.2 L618.9 156.1 L767.4 76.9 L826.9 35.1" stroke="#f4a3b8" stroke-width="5" stroke-dasharray="12 9"/>
              <path d="M807.1 38.3 L826.9 35.1 L817.2 52.5" stroke="#f4a3b8" stroke-width="5"/>
              <circle cx="576.1" cy="417.2" r="9" fill="#f4a3b8" stroke="#0b1c2c" stroke-width="2.5"/><rect x="586" y="412" width="142" height="38" rx="8" fill="#0d1a24" fill-opacity="0.72" stroke="none"/><rect x="717" y="36" width="183" height="38" rx="8" fill="#0d1a24" fill-opacity="0.72" stroke="none"/>
            id: mo2
          - { type: text, text: ポトシ銀山, at: [ 732, 551 ], size: s, color: pink, anim: fade, id: ml2_0 }
          - { type: text, text: スペインへ →, at: [ 863, 175 ], size: s, color: pink, anim: fade, id: ml2_1 }
        added: true

  - board: whiteboard
    steps:
      - say: なぜ、こんなことができたのでしょうか。
        show:
          - { type: title, text: なぜ勝てたのか }
      - say: 天然痘で先住民が大量に亡くなったこと。アステカに敵対していた周りの民族が、スペイン側に協力したこと。そして、白い神が東からやってくる、という予言と重なって、混乱したことが重なりました。
        show:
          - type: list
            at: [ 80, 140 ]
            items: [ "**天然痘** で先住民が大量に死亡", "アステカに敵対する民族がスペインに協力", "「白い神が東から来る」という予言と重なる混乱", "鉄の武器・馬・鉄砲" ]
      - say: ピサロは、インカの皇帝アタワルパに、部屋いっぱいの金銀を差し出せば解放する、と約束しておきながら、受け取ったあとで処刑するという、裏切りをしています。
        show:
          - { type: box, at: [ 80, 420 ], w: 1120, color: pink, text: "部屋いっぱいの金銀を受け取ったあと、皇帝を処刑" }

  - board: whiteboard
    steps:
      - say: 征服のあと、ポトシ銀山、今のボリビアや、メキシコから、大量の銀がヨーロッパに流れこみます。その結果、ヨーロッパ全体の物価が急に上がる、価格革命が起こりました。
        show:
          - { type: title, text: 価格革命とスペインの皮肉 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "大量の銀が流入 → 物価が急上昇（**価格革命**）" }
      - say: お金の量が急に増えると、お金の価値が下がり、ものの値段が上がる。今のインフレと同じしくみです。
        added: true
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: blue, text: "お金が増える → お金の価値が下がる → 物価が上がる（＝ インフレ）" }
      - say: 豊かになったスペインは、一時ヨーロッパ最強の国になります。でも、その富にたよりすぎて、自分の国の産業が育たず、長い目で見ておとろえていく、という皮肉な結果になりました。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, text: "銀にたよりすぎ → 国内産業が育たず → 長期的な衰退" }
