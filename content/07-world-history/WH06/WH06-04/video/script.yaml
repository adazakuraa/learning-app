title: 大西洋奴隷貿易と植民地
scenes:
  - board: whiteboard
    steps:
      - say: スペインやポルトガル、のちにはイギリス、フランス、オランダなども、アメリカ大陸の植民地に、大農園、プランテーションを作りました。砂糖、タバコ、綿花を作るためです。
        show:
          - { type: title, text: プランテーションと奴隷 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: yellow, title: プランテーション（大農園）, text: "砂糖・タバコ・綿花を大量に作る" }
      - say: その働き手として、16世紀から19世紀に、推計で1000万から1300万人ものアフリカの人々が、奴隷として連れ去られました。
        show:
          - { type: text, at: [ 80, 320 ], w: 1120, size: l, text: "推計 **1000万〜1300万人** のアフリカの人々が連れ去られる" }
  - gen: map
    board: whiteboard
    steps:
      - say: 三角貿易を、地図で見てみましょう。ヨーロッパと、西アフリカ、そしてアメリカ大陸が、大西洋をはさんで、三角形で結ばれていました。
        show:
          - { type: title, text: 大西洋の三角貿易 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
