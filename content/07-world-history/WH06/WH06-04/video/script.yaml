      - say: ヨーロッパから、武器やお酒が西アフリカへ。西アフリカから、奴隷にされた人々がアメリカ大陸へ。そしてアメリカ大陸から、砂糖や綿花が、ヨーロッパへと運ばれました。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M638.2 115 L596.8 202.7 L606 282.5" stroke="#8fc4ff" stroke-width="5"/>
              <path d="M612.5 263.6 L606 282.5 L595.3 265.6" stroke="#8fc4ff" stroke-width="5"/>
              <path d="M596.8 301.3 L453.9 292 L329.5 263.3" stroke="#f3d77a" stroke-width="5"/>
              <path d="M345.1 275.8 L329.5 263.3 L349 258.9" stroke="#f3d77a" stroke-width="5"/>
              <path d="M338.7 228.6 L453.9 146.3 L606 101.7" stroke="#9be0b0" stroke-width="5"/>
              <path d="M586.2 98.4 L606 101.7 L591.1 115.1" stroke="#9be0b0" stroke-width="5"/><rect x="535" y="214" width="116" height="38" rx="8" fill="#0d1a24" fill-opacity="0.72" stroke="none"/><rect x="425" y="335" width="220" height="38" rx="8" fill="#0d1a24" fill-opacity="0.72" stroke="none"/><rect x="402" y="116" width="142" height="38" rx="8" fill="#0d1a24" fill-opacity="0.72" stroke="none"/>
