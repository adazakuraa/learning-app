            id: mo0
          - { type: text, text: ヨーロッパ, at: [ 801, 166 ], size: s, color: blue, anim: fade, id: ml0_0 }
          - { type: text, text: 西アフリカ, at: [ 764, 403 ], size: s, color: yellow, anim: fade, id: ml0_1 }
          - { type: text, text: アメリカ大陸・カリブ海, at: [ 345, 337 ], size: s, color: green, anim: fade, id: ml0_2 }
          - { type: text, text: 大西洋, at: [ 594, 315 ], size: s, color: gray, anim: fade, id: ml0_3 }
