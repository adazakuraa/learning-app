title: 科学革命
scenes:
  - board: whiteboard
    steps:
      - say: 中世の世界観では、地球が宇宙の中心で、太陽が地球のまわりを回る、天動説が常識でした。人間は神の創造の中心、というキリスト教の考えとも、ぴったり合っていたのです。
        show:
          - { type: title, text: 天動説から地動説へ }
          - { type: box, at: [80, 140], w: 540, color: gray, title: 天動説（中世の常識）, text: "地球が中心\n太陽が地球を回る" }
          - { type: arrow, from: [628, 210], to: [652, 210] }
          - { type: box, at: [660, 140], w: 540, color: yellow, title: 地動説, text: "太陽が中心\n地球が太陽を回る" }
      - say: ポーランドの天文学者コペルニクスは、地球が太陽のまわりを回る、地動説を考えましたが、批判をおそれて、死の直前まで発表をひかえました。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "**コペルニクス**：地動説を唱える（批判を恐れ、死の直前に発表）" }
      - say: ガリレオは、望遠鏡で地動説の証拠を積み上げましたが、宗教裁判にかけられ、地動説を捨てるよう強制されます。それでも地球は動く、という言葉は、のちの創作とされますが、彼の気持ちをよく表しています。
        show:
          - { type: text, at: [80, 440], w: 1120, text: "**ガリレオ**：望遠鏡で証拠 → 宗教裁判で撤回を強制" }
          - { type: text, at: [80, 520], w: 1120, color: gray, text: "「それでも地球は動く」（のちの創作とされる）" }

  - board: whiteboard
    steps:
      - say: 科学革命が大切なのは、権威を疑い、観察と実験で確かめる、という、近代科学の方法を確立したことです。
        show:
          - { type: title, text: 科学革命の意味 }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: 近代科学の方法, text: "権威を疑い、**観察と実験** で確かめる" }
      - say: ルネサンスが、人間を肯定する文化の変化だとすれば、科学革命は、人間の理性で世界を解き明かせる、という知の変化です。
        show:
          - { type: box, at: [80, 300], w: 540, color: green, title: ルネサンス, text: "人間を肯定する" }
          - { type: box, at: [660, 300], w: 540, color: yellow, title: 科学革命, text: "理性で世界を解き明かす" }
      - say: この精神が、ニュートンの万有引力の発見へとつながり、さらには産業革命、そして今の科学技術の土台になっていきます。スマートフォンも、宇宙ロケットも、この、疑って確かめる姿勢から生まれたのです。
        show:
          - { type: text, at: [80, 480], w: 1120, text: "→ ニュートン → 産業革命 → 今の科学技術" }
