title: ルターと宗教改革
scenes:
  - board: whiteboard
    steps:
      - say: 中世のカトリック教会は、内部の腐敗が深刻でした。決定的だったのが、免罪符の販売です。これを買えば罪が許される、と言って、人々に売りつけていたのです。
        read: 中世のカトリック教会は、内部の腐敗が深刻でした。決定的だったのが、めんざいふの販売です。これを買えば罪が許される、と言って、人々に売りつけていたのです。
        show:
          - { type: title, text: 免罪符 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: pink, title: 免罪符, text: "「これを買えば罪が許される」と言って売る" }
      - say: お金で救いが買える。そんなことがあっていいのか、という疑問が広がります。
        added: true
        show:
          - { type: text, at: [ 80, 320 ], w: 1120, size: l, text: "お金で救いが買える？" }

  - board: whiteboard
    steps:
      - say: 1517年、ドイツの神学者、マルティン・ルターが、これを公然と批判しました。
        show:
          - { type: title, text: 1517年　ルターの宗教改革 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "ドイツの神学者 **ルター** が免罪符を批判" }
      - say: 活版印刷のおかげで、ルターの批判は、またたく間にドイツ中に広まりました。今でいえば、SNSで一気に拡散したようなものです。
        read: 活版印刷のおかげで、ルターの批判は、またたく間にドイツ中に広まりました。今でいえば、エスエヌエスで一気に拡散したようなものです。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: blue, text: "**活版印刷** で一気に拡散（今でいうSNS）" }
      - say: 教皇から破門され、皇帝の前で取り消せと迫られても、わたしはここに立つ、これ以外にできない、と拒みました。
        show:
          - { type: box, at: [ 80, 380 ], w: 1120, color: yellow, text: "「わたしはここに立つ。これ以外にできない」" }
      - say: ルターは聖書をドイツ語に訳し、誰でも自分で聖書を読めるようにしました。聖書を解釈できるのは教会だけ、というひとりじめを、くずしたのです。
        show:
          - { type: text, at: [ 80, 520 ], w: 1120, color: gray, text: "聖書をドイツ語に翻訳 → 誰でも自分で読める" }
  - gen: map
    board: whiteboard
    steps:
      - say: ルターが活動したのは、ドイツの町、ヴィッテンベルクです。
        show:
          - { type: title, text: 宗教改革の地図 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
