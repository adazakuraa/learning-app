questions:
  - q: 14〜16世紀のイタリアで起きた、神中心から人間中心の世界観への転換を何というか。
    a: [ルネサンス]
  - q: スペインの支援で大西洋を西に進み、アメリカ大陸に到達した人物は誰か。
    a: [コロンブス]
  - q: 1517年、免罪符の販売を批判して宗教改革を始めたドイツの神学者は誰か。
    a: [ルター, マルティン・ルター]
    show: ルター
  - q: 「地球が太陽のまわりを回る」という説を何というか。
    a: [地動説]
  - q: ヨーロッパからアフリカへ武器、アフリカからアメリカへ奴隷、アメリカからヨーロッパへ砂糖などが運ばれた貿易を何というか。
    a: [三角貿易]
