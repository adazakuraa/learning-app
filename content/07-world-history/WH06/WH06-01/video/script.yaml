title: ルネサンスと人文主義
scenes:
  - board: slide
    steps:
      - say: 第6章、「大航海時代と宗教改革」です。
        show:
          - { type: title, text: 第6章　大航海時代と宗教改革 }
      - say: ルネサンス、大航海時代、アメリカ大陸の征服と奴隷貿易、宗教改革、そして科学革命。ヨーロッパが、中世から近代へと大きく変わっていく時代です。
        show:
          - type: list
            items: ["ルネサンスと人文主義", "コロンブスと大航海時代", "アステカ・インカ帝国の滅亡", "大西洋奴隷貿易と植民地", "ルターと宗教改革", "科学革命"]
      - say: 神中心から人間中心へ。そしてヨーロッパが世界へ。今の世界の、豊かさと格差の両方の出発点が、ここにあります。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "ヨーロッパが「神中心」から「人間中心」へ変わり、世界へ広がる流れをつかむ" }

  - board: whiteboard
    steps:
      - say: 14世紀から16世紀に、イタリアで起きたルネサンスは、神中心の世界観から、人間中心の世界観への転換を意味します。ルネサンスとは、再生、という意味です。
        show:
          - { type: title, text: ルネサンス }
          - { type: box, at: [80, 140], w: 540, color: gray, title: 中世, text: "神中心\n芸術も学問も「神のため」" }
          - { type: arrow, from: [628, 210], to: [652, 210] }
          - { type: box, at: [660, 140], w: 540, color: yellow, title: ルネサンス（再生）, text: "**人間中心**\n人間の美しさ・能力を肯定" }
      - say: 中世では、教会が文化と思想を厳しく管理していました。そこに、古代ギリシャやローマの文化を再発見し、人間そのものの美しさや能力を認めよう、という動きが生まれたのです。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "古代ギリシャ・ローマの文化を **再発見**" }
      - say: ペストで教会の権威が揺らぎ、ビザンツから学者と古い本がやってきた。これまで学んだ流れが、ここで一つになります。
        added: true
        show:
          - { type: text, at: [80, 440], w: 1120, color: gray, text: "ペスト（教会への不信）＋ ビザンツの学者 → ルネサンス" }

  - board: whiteboard
    steps:
      - say: レオナルド・ダ・ヴィンチは、絵画、解剖学、飛行機の研究まで、あらゆる分野の天才で、7000ページ以上のノートを残しました。完成した作品が少ないのは、次々と新しい興味がわいて、前の作業を続けられなかったから、とも言われます。
        show:
          - { type: title, text: ルネサンスの天才たち }
          - { type: box, at: [80, 140], w: 540, color: blue, title: レオナルド・ダ・ヴィンチ, text: "絵画・解剖学・航空工学\n7000ページ以上のノート\n完成作は少ない" }
      - say: ミケランジェロは、システィーナ礼拝堂の天井画を、わたしは彫刻家であって画家ではない、と断りましたが、押し切られて、4年間、あおむけで描き続けました。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: ミケランジェロ, text: "システィーナ礼拝堂の天井画\n4年間あおむけで描き続ける" }
      - say: なぜ人物に金色を使わないのか、と聞かれ、彼らは貧しい人々ですから、と答えたといいます。権力者にも、信念を曲げない姿勢です。
        show:
          - { type: text, at: [80, 380], w: 1120, color: gray, text: "「なぜ金色を使わない？」→「彼らは貧しい人々ですから」" }
