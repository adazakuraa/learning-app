title: コロンブスと大航海時代
scenes:
  - board: whiteboard
    steps:
      - say: 15世紀の後半、ヨーロッパは、アジアへの新しい航路を求めて、海へ乗り出します。大航海時代の始まりです。
        show:
          - { type: title, text: なぜ海へ？ }
      - say: 理由は二つあります。一つは、オスマン帝国が強くなり、アジアへの陸の道が不安定になったこと。もう一つは、羅針盤や、遠くの海を走れる船など、技術が進歩したことです。
        show:
          - { type: box, at: [80, 140], w: 540, color: pink, title: ①陸の道が不安定, text: "オスマン帝国の台頭" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: ②技術の進歩, text: "羅針盤・遠洋航海の船" }
      - say: 目当ては、香辛料でした。こしょうなどの香辛料は、肉の保存や味つけに欠かせず、同じ重さの金と取り引きされたこともあるほど、高価だったのです。
        added: true
        show:
          - { type: box, at: [80, 320], w: 1120, color: yellow, title: 目当ては香辛料, text: "こしょうなど ＝ 金と同じくらい高価なことも" }

  - board: whiteboard
    steps:
      - say: ポルトガルは、アフリカの海岸を南へ下る作戦をとり、1498年、ヴァスコ・ダ・ガマが、インドへの航路を開きました。
        show:
          - { type: title, text: 3つの航海 }
          - { type: image, src: 1000002911.webp, at: [540, 120], w: 660, caption: 大航海時代のおもな航路 }
          - { type: box, at: [80, 130], w: 420, color: pink, title: 1498年 ガマ, text: "アフリカを回ってインドへ" }
      - say: 一方スペインは、コロンブスを西へ送り出しました。地球は丸いから、西に進めばアジアに着く、という考えを実行したコロンブスは、1492年、カリブ海の島に着きました。
        show:
          - { type: box, at: [80, 300], w: 420, color: blue, title: 1492年 コロンブス, text: "西へ → カリブ海の島へ" }
      - say: そして1522年、スペインが送り出したマゼランの艦隊が、人類初の世界一周を成しとげます。マゼラン自身は、途中のフィリピンで戦死しました。
        show:
          - { type: box, at: [80, 470], w: 420, color: green, title: 1522年 マゼラン艦隊, text: "初の世界一周" }

  - board: whiteboard
    steps:
      - say: コロンブスは死ぬまで、ここはアジア、インドだ、と信じ続けました。新しい大陸に着きながら、気づかなかったのです。アメリカの先住民が、インディアンと呼ばれたのは、この誤解のなごりです。
        show:
          - { type: title, text: コロンブスの交換 }
          - { type: text, at: [80, 140], w: 1120, text: "コロンブス「ここは **インド** だ」→ 先住民を「インディアン」と呼ぶ" }
      - say: この航海がもたらした、コロンブスの交換は、世界を大きく変えました。トマト、じゃがいも、とうもろこしがヨーロッパへ。小麦、馬、そして天然痘が、アメリカへと渡ります。
        show:
          - { type: box, at: [80, 230], w: 540, color: green, title: アメリカ → ヨーロッパ, text: "トマト・じゃがいも\nとうもろこし・唐辛子" }
          - { type: box, at: [660, 230], w: 540, color: pink, title: ヨーロッパ → アメリカ, text: "小麦・馬\n**天然痘**" }
      - say: イタリア料理のトマトも、ドイツのじゃがいもも、もとはアメリカ大陸のものです。一方、免疫のなかった先住民にとって、天然痘は、大きな悲劇をもたらしました。
        show:
          - { type: text, at: [80, 440], w: 1120, color: gray, text: "イタリアのトマト・ドイツのじゃがいも ＝ もとはアメリカ大陸" }
