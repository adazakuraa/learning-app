questions:
  - q: 第二次世界大戦後の、アメリカとソ連が直接戦わずに対立した状態を何というでしょう？
    a: [冷戦]
  - q: 1962年、ソ連がキューバに核ミサイル基地をつくり、核戦争の一歩手前まで緊張が高まったできごとを何というでしょう？
    a: [キューバ危機]
  - q: 1949年、毛沢東が建国した国の名前は何でしょう？
    a: [中華人民共和国]
  - q: 南アフリカで行われた人種隔離政策を何というでしょう？
    a: [アパルトヘイト]
  - q: 1989年に崩され、冷戦の終わりを象徴した壁を何というでしょう？
    a: [ベルリンの壁]
