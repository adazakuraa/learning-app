title: キューバ危機
scenes:
  - board: whiteboard
    steps:
      - say: 1959年、カリブ海のキューバで、カストロによる革命が起き、アメリカのフロリダ半島から、わずか150キロメートルの場所に、ソ連寄りの社会主義の政権が生まれました。
        show:
          - { type: title, text: キューバ革命 }
          - { type: text, at: [80, 140], w: 1120, text: "1959年 **カストロ** の革命 → アメリカのすぐそばに社会主義政権" }
      - say: 150キロメートルは、東京から静岡くらいの距離です。アメリカにとっては、目と鼻の先の脅威でした。
        added: true
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, text: "フロリダから約150km ≒ 東京〜静岡くらいの距離" }

  - board: whiteboard
    steps:
      - say: 1962年、アメリカの偵察機が、キューバに、ソ連の核ミサイル基地が作られているのを発見します。
        show:
          - { type: title, text: 1962年　核戦争の一歩手前 }
          - { type: text, at: [80, 140], w: 1120, text: "キューバにソ連の **核ミサイル基地** を発見" }
      - say: アメリカのケネディ大統領は、キューバのまわりの海を封鎖するよう命じ、ソ連のフルシチョフは、ミサイルを積んだ船を送り続けました。世界は、核戦争の一歩手前に立ちました。
        show:
          - { type: box, at: [80, 230], w: 540, color: blue, title: ケネディ（アメリカ）, text: "キューバを海上封鎖" }
          - { type: box, at: [660, 230], w: 540, color: pink, title: フルシチョフ（ソ連）, text: "ミサイルを積んだ船を送る" }
      - say: 最後は、ソ連がキューバからミサイルを撤去し、アメリカが、トルコに置いていたミサイルを、ひそかに撤去する、という取引で決着しました。
        show:
          - { type: box, at: [80, 420], w: 1120, color: green, title: 決着, text: "ソ連はキューバから、アメリカはトルコから、ミサイルを撤去" }
      - say: このあと、米ソの首脳を直接つなぐ、ホットラインが作られました。ぎりぎりの危機が、対話のしくみを生んだのです。
        added: true
        show:
          - { type: text, at: [80, 580], w: 1120, color: gray, text: "→ 米ソ首脳を結ぶ「ホットライン」が作られる" }
