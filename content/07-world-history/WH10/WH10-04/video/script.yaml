title: 戦後アジアの独立と紛争
scenes:
  - board: whiteboard
    steps:
      - say: 第二次世界大戦で、日本の植民地支配が終わり、ヨーロッパの大国も戦争で疲れ果てたことで、アジアの植民地が次々と独立しました。
        show:
          - { type: title, text: アジアの独立 }
          - { type: text, at: [80, 140], w: 1120, text: "日本の敗戦 ＋ ヨーロッパの疲弊 → アジアの植民地が次々と独立" }

  - board: whiteboard
    steps:
      - say: インドは1947年、イギリスから独立しましたが、ヒンドゥー教徒が多いインドと、イスラム教徒が多いパキスタンに、分かれての独立となりました。
        show:
          - { type: title, text: インドとパキスタン }
          - { type: box, at: [80, 140], w: 540, color: yellow, title: インド, text: "ヒンドゥー教徒が多数" }
          - { type: box, at: [660, 140], w: 540, color: green, title: パキスタン, text: "イスラム教徒が多数" }
      - say: 宗教の対立による暴動で、数十万から100万人以上が亡くなったと推計されています。
        show:
          - { type: text, at: [80, 330], w: 1120, text: "宗教対立の暴動で **数十万〜100万人以上** が死亡" }
      - say: 独立運動を、暴力を使わない方法で率いたガンジーは、翌年、ヒンドゥー教の過激派に暗殺されました。両国の対立は、今も続いており、どちらも核兵器を持っています。
        show:
          - { type: box, at: [80, 420], w: 1120, color: pink, text: "非暴力の **ガンジー** は1948年に暗殺 → 両国の対立は今も（どちらも核保有）" }

  - board: whiteboard
    steps:
      - say: 中国では、日本の降伏後、国民党の蒋介石と、共産党の毛沢東の内戦が再び始まり、1949年、毛沢東の、中華人民共和国が建国されました。
        read: 中国では、日本の降伏後、国民党のしょうかいせきと、共産党のもうたくとうの内戦が再び始まり、1949年、もうたくとうの、中華人民共和国が建国されました。
        show:
          - { type: title, text: 毛沢東の中国 }
          - { type: text, at: [80, 140], w: 1120, text: "1949年 **中華人民共和国** 建国（毛沢東）" }
      - say: しかし毛沢東は、建国後、二つの大きな失政をおかします。
        show: []
      - say: 一つは、大躍進政策。無理な農業と工業の計画で、数千万人規模の大ききんを招きました。もう一つは、文化大革命。古い文化を壊せ、とかかげて、知識人を迫害し、社会を大混乱におとしいれました。
        show:
          - { type: box, at: [80, 230], w: 540, color: pink, title: 大躍進政策, text: "無理な計画\n→ 数千万人規模の大ききん" }
          - { type: box, at: [660, 230], w: 540, color: pink, title: 文化大革命, text: "知識人を迫害\n→ 社会が大混乱" }
