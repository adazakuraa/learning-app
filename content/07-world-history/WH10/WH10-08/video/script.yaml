title: ソ連崩壊と冷戦の終結
scenes:
  - board: whiteboard
    steps:
      - say: 1985年、ソ連の指導者になったゴルバチョフは、停滞するソ連の経済と、かたい政治を変えるため、グラスノスチ、つまり情報公開と、ペレストロイカ、立て直しを進めました。
        show:
          - { type: title, text: ゴルバチョフの改革 }
          - { type: box, at: [ 80, 140 ], w: 540, color: blue, title: グラスノスチ, text: "情報公開" }
          - { type: box, at: [ 660, 140 ], w: 540, color: green, title: ペレストロイカ, text: "立て直し（改革）" }
      - say: しかし、情報が公開されると、人々は、ソ連の現実のひどさを知ってしまいます。改革は、思いもよらない連鎖を引き起こしました。
        show:
          - { type: text, at: [ 80, 330 ], w: 1120, text: "情報公開 → 人々がソ連の現実を知る → 予想外の連鎖へ" }

  - board: whiteboard
    steps:
      - say: 1989年、東西冷戦の象徴だった、ベルリンの壁が、人々の手で打ちこわされます。西側の西ベルリンと、ソ連側の東ドイツを分けていた壁です。
        show:
          - { type: title, text: ベルリンの壁の崩壊とソ連解体 }
          - type: list
            at: [ 80, 140 ]
            items: [ "1989年　**ベルリンの壁** 崩壊", "東ヨーロッパで次々と共産党政権が倒れる", "1990年　東西ドイツ統一", "1991年　**ソ連解体**" ]
      - say: ソ連の強い影響下にあった、東ヨーロッパの国々でも、次々と共産党の政権が倒れ、1990年には東西ドイツが統一。そして1991年、ソ連は正式に解体されました。
        show: []
      - say: 半世紀近く続いた冷戦は、こうして終わりました。でも、ソ連から分かれた国々の間の問題は、今のロシアとウクライナの戦争にもつながっています。
        added: true
        show:
          - { type: box, at: [ 80, 420 ], w: 1120, color: yellow, text: "冷戦の終わり → でも旧ソ連の国々の問題は、今のロシア・ウクライナ戦争へ" }
  - gen: map
    board: whiteboard
