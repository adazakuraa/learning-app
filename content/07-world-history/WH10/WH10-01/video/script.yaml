title: 冷戦の構造とアメリカ・ソ連
scenes:
  - board: slide
    steps:
      - say: 第10章、「冷戦と脱植民地化」です。
        show:
          - { type: title, text: 第10章　冷戦と脱植民地化 }
      - say: アメリカとソ連の冷戦、朝鮮戦争とベトナム戦争、キューバ危機、アジアとアフリカの独立、中東の問題、そしてソ連の崩壊までを見ていきます。
        show:
          - type: list
            at: [80, 130]
            w: 540
            size: s
            items: ["冷戦の構造とアメリカ・ソ連", "朝鮮戦争とベトナム戦争", "キューバ危機", "戦後アジアの独立と紛争"]
          - type: list
            at: [660, 130]
            w: 540
            size: s
            items: ["アフリカの独立とその後", "中東戦争とパレスチナ問題", "湾岸戦争", "ソ連崩壊と冷戦の終結"]
      - say: 朝鮮半島の分断、中東の紛争、核兵器。今もニュースで見る問題の多くは、この時代に形づくられました。
        added: true
        show:
          - { type: box, at: [80, 440], color: yellow, w: 1120, title: この章の目的, text: "冷戦と植民地の独立が、今の世界の対立や紛争をどう生んだかをつかむ" }

  - board: whiteboard
    steps:
      - say: 第二次世界大戦が終わると、ナチス・ドイツという共通の敵がいなくなったアメリカとソ連は、急速に対立を深めます。
        show:
          - { type: title, text: 冷戦 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: アメリカ（西側）, text: "資本主義\n自由民主主義" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: ソ連（東側）, text: "社会主義\n共産党の一党独裁" }
      - say: 資本主義と自由民主主義のアメリカ。社会主義と一党独裁のソ連。この二つが、直接は戦わずに、世界中で争った対立を、冷戦と呼びます。直接戦う熱い戦争に対して、冷たい戦争、というわけです。
        show:
          - { type: text, at: [80, 360], w: 1120, size: l, text: "直接は戦わない ＝「**冷たい** 戦争」" }

  - board: whiteboard
    steps:
      - say: 両国が核兵器を持ったことで、直接戦えば、両方が確実に滅びる、というつり合いが生まれました。皮肉にも、これが、大国どうしの直接の戦争を防ぎました。
        show:
          - { type: title, text: 核の均衡と代理戦争 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 核抑止, text: "直接戦えば両方が滅びる → 大国どうしの直接戦争が起きない" }
      - say: しかし、両国は、アジア、アフリカ、中南米で、ほかの国を使った、代理戦争をくり広げました。
        show:
          - { type: box, at: [80, 300], w: 540, color: pink, title: 代理戦争, text: "アジア・アフリカ・中南米で" }
      - say: 宇宙開発の競争でも、技術の力を競い合います。ソ連は世界で初めて人工衛星を打ち上げ、アメリカは、人類で初めて月に降り立ちました。
        show:
          - { type: box, at: [660, 300], w: 540, color: green, title: 宇宙開発競争, text: "ソ連：初の人工衛星（1957）\nアメリカ：月面着陸（1969）" }
      - say: インターネットやGPSも、もとはこの時代の、軍事技術の研究から生まれたものです。
        read: インターネットやジーピーエスも、もとはこの時代の、軍事技術の研究から生まれたものです。
        added: true
        show:
          - { type: text, at: [80, 520], w: 1120, color: gray, text: "インターネット・GPS ← 冷戦期の軍事研究から" }
