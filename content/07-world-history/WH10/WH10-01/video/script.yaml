title: 冷戦の構造とアメリカ・ソ連
scenes:
  - board: slide
    steps:
      - say: 第10章、「冷戦と脱植民地化」です。
        show:
          - { type: title, text: 第10章　冷戦と脱植民地化 }
      - say: アメリカとソ連の冷戦、朝鮮戦争とベトナム戦争、キューバ危機、アジアとアフリカの独立、中東の問題、そしてソ連の崩壊までを見ていきます。
        show:
          - type: list
            at: [ 80, 130 ]
            w: 540
            size: s
            items: [ "冷戦の構造とアメリカ・ソ連", "朝鮮戦争とベトナム戦争", "キューバ危機", "戦後アジアの独立と紛争" ]
          - type: list
            at: [ 660, 130 ]
            w: 540
            size: s
            items: [ "アフリカの独立とその後", "中東戦争とパレスチナ問題", "湾岸戦争", "ソ連崩壊と冷戦の終結" ]
      - say: 朝鮮半島の分断、中東の紛争、核兵器。今もニュースで見る問題の多くは、この時代に形づくられました。
        added: true
        show:
          - { type: box, at: [ 80, 440 ], color: yellow, w: 1120, title: この章の目的, text: "冷戦と植民地の独立が、今の世界の対立や紛争をどう生んだかをつかむ" }

  - board: whiteboard
    steps:
      - say: 第二次世界大戦が終わると、ナチス・ドイツという共通の敵がいなくなったアメリカとソ連は、急速に対立を深めます。
        show:
          - { type: title, text: 冷戦 }
          - { type: box, at: [ 80, 140 ], w: 540, color: blue, title: アメリカ（西側）, text: "資本主義\n自由民主主義" }
          - { type: box, at: [ 660, 140 ], w: 540, color: pink, title: ソ連（東側）, text: "社会主義\n共産党の一党独裁" }
      - say: 資本主義と自由民主主義のアメリカ。社会主義と一党独裁のソ連。この二つが、直接は戦わずに、世界中で争った対立を、冷戦と呼びます。直接戦う熱い戦争に対して、冷たい戦争、というわけです。
        show:
          - { type: text, at: [ 80, 360 ], w: 1120, size: l, text: "直接は戦わない ＝「**冷たい** 戦争」" }
  - gen: map
    board: whiteboard
    steps:
      - say: 冷戦のヨーロッパを、地図で見てみましょう。西側のアメリカ陣営と、東側のソ連陣営に分かれ、そのさかいは、鉄のカーテンと呼ばれました。
        show:
          - { type: title, text: 東西に分かれたヨーロッパ }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
