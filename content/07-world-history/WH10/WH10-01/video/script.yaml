  - board: whiteboard
    steps:
      - say: 両国が核兵器を持ったことで、直接戦えば、両方が確実に滅びる、というつり合いが生まれました。皮肉にも、これが、大国どうしの直接の戦争を防ぎました。
        show:
          - { type: title, text: 核の均衡と代理戦争 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: yellow, title: 核抑止, text: "直接戦えば両方が滅びる → 大国どうしの直接戦争が起きない" }
      - say: しかし、両国は、アジア、アフリカ、中南米で、ほかの国を使った、代理戦争をくり広げました。
        show:
          - { type: box, at: [ 80, 300 ], w: 540, color: pink, title: 代理戦争, text: "アジア・アフリカ・中南米で" }
      - say: 宇宙開発の競争でも、技術の力を競い合います。ソ連は世界で初めて人工衛星を打ち上げ、アメリカは、人類で初めて月に降り立ちました。
        show:
          - { type: box, at: [ 660, 300 ], w: 540, color: green, title: 宇宙開発競争, text: "ソ連：初の人工衛星（1957）\nアメリカ：月面着陸（1969）" }
      - say: インターネットやGPSも、もとはこの時代の、軍事技術の研究から生まれたものです。
        read: インターネットやジーピーエスも、もとはこの時代の、軍事技術の研究から生まれたものです。
        added: true
        show:
          - { type: text, at: [ 80, 520 ], w: 1120, color: gray, text: "インターネット・GPS ← 冷戦期の軍事研究から" }
