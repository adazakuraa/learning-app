title: 中東戦争とイスラエル・パレスチナ問題
scenes:
  - board: whiteboard
    steps:
      - say: 第一次世界大戦の最中、イギリスは、アラブ人、ユダヤ人、そしてフランスの三者に、互いに矛盾する約束をしていました。
        show:
          - { type: title, text: イギリスの三枚舌外交 }
          - { type: box, at: [80, 140], w: 360, color: green, title: アラブ人へ, text: "独立国家を\n約束" }
          - { type: box, at: [460, 140], w: 360, color: blue, title: ユダヤ人へ, text: "パレスチナに\n「民族の郷土」" }
          - { type: box, at: [840, 140], w: 360, color: yellow, title: フランスへ, text: "中東を分割して\n支配しよう" }
      - say: エルサレムがあるパレスチナを含む地域について、アラブ人には独立国家を、ユダヤ人には民族の郷土を、フランスには分割支配を約束したのです。この三枚舌外交が、中東問題の出発点です。
        show:
          - { type: text, at: [80, 360], w: 1120, size: l, text: "互いに矛盾する約束 ＝ **中東問題の出発点**" }

  - board: whiteboard
    steps:
      - say: 1948年、ユダヤ人がイスラエルを建国すると、その翌日から、周りのアラブの国々との戦争が始まり、1973年まで、4回にわたる中東戦争が起きました。
        show:
          - { type: title, text: イスラエル建国と中東戦争 }
          - { type: image, src: 1000002916.webp, at: [800, 120], w: 400, caption: 橙＝イスラエル　緑＝パレスチナ自治区 }
          - { type: text, at: [80, 140], w: 680, text: "1948年 **イスラエル建国** → 4回の中東戦争" }
      - say: 第3次中東戦争で、イスラエルは、ヨルダン川西岸、ガザ地区などを占領し、故郷を追われたパレスチナの人々の、難民問題が深刻になります。地図の緑の部分が、今のパレスチナ自治区です。
        show:
          - { type: box, at: [80, 230], w: 680, color: pink, title: 第3次中東戦争（1967年）, text: "ヨルダン川西岸・ガザ地区などを占領\n→ パレスチナ難民の問題が深刻に" }
      - say: 第4次中東戦争では、アラブの産油国が石油の輸出を制限し、オイルショックが起きました。日本でも、トイレットペーパーの買い占め騒ぎが起きるほど、世界経済に衝撃を与えました。
        show:
          - { type: box, at: [80, 430], w: 680, color: yellow, title: 第4次中東戦争（1973年）, text: "オイルショック\n→ 日本でトイレットペーパー騒ぎ" }

  - board: whiteboard
    steps:
      - say: ここは誰の土地か。この問いは、今も解決していません。
        show:
          - { type: title, text: 今も続く問題 }
          - { type: text, at: [80, 140], w: 1120, size: l, text: "「ここは誰の土地か」は、今も未解決" }
      - say: 2023年の、ハマスによるイスラエルへの攻撃と、ガザへの報復攻撃は、この問題が、今まさに続いていることを、あらためて示しました。
        show:
          - { type: box, at: [80, 260], w: 1120, color: pink, text: "2023年 ハマスのイスラエル攻撃 → ガザへの報復攻撃" }
      - say: 100年以上前の、大国の都合による約束が、今も多くの命に影響している。歴史を知ることは、ニュースの背景を理解することでもあるのです。
        added: true
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "100年前の約束が、今の命に影響している" }
