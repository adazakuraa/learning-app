title: 朝鮮戦争とベトナム戦争
scenes:
  - board: whiteboard
    steps:
      - say: 朝鮮半島は、第二次世界大戦のあと、北緯38度線で、ソ連が支える北朝鮮と、アメリカが支える韓国に分けられました。
        show:
          - { type: title, text: 朝鮮戦争 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 北朝鮮, text: "ソ連・中国が支援" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: 韓国, text: "アメリカが支援" }
          - { type: text, at: [80, 320], w: 1120, text: "北緯38度線で分断" }
      - say: 1950年、北朝鮮が韓国に攻めこんで朝鮮戦争が起き、およそ300万人の死者を出したあと、休戦しました。
        show:
          - { type: text, at: [80, 400], w: 1120, text: "1950年 北朝鮮が侵攻 → 約300万人が死亡 → 1953年 **休戦**" }
      - say: 正式な平和条約は今もなく、朝鮮半島は、法的には、まだ戦争中なのです。日本史で学んだ、朝鮮特需は、この戦争によるものでした。
        show:
          - { type: text, at: [80, 480], w: 1120, color: pink, text: "平和条約はなく、法的には今も戦争中" }

  - board: whiteboard
    steps:
      - say: ベトナム戦争は、アメリカがもっとも深く傷ついた代理戦争です。
        show:
          - { type: title, text: ベトナム戦争（1955〜1975年） }
      - say: 一つの国が共産主義になると、周りの国も、ドミノ倒しのように共産主義になる。このドミノ理論を信じたアメリカは、共産主義の北ベトナムに対抗して、南ベトナムを支えましたが、ジャングルでのゲリラ戦に苦しみ続けました。
        show:
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: ドミノ理論, text: "一国が共産化すると、周りもドミノ倒しのように共産化する" }
          - { type: text, at: [80, 300], w: 1120, text: "アメリカが南ベトナムを支援 → ジャングルのゲリラ戦に苦戦" }
      - say: テレビの中継で、戦争のむごさが、初めてお茶の間に届いたことで、アメリカ国内で反戦運動が高まります。アメリカは1973年に撤退し、1975年、南ベトナムは崩壊しました。
        show:
          - { type: text, at: [80, 380], w: 1120, text: "テレビ中継 → 反戦運動 → 1973年 米軍撤退 → 1975年 南ベトナム崩壊" }
      - say: 超大国アメリカが、小国ベトナムに負けた、という衝撃は、その後のアメリカの外交と軍事に、長く影を落とすことになります。
        show:
          - { type: box, at: [80, 470], w: 1120, color: pink, text: "超大国が小国に「負けた」衝撃 → アメリカ外交に長く影" }
