  - board: whiteboard
    steps:
      - say: 湾岸戦争は、テレビで、ミサイルの映像が、まるでゲームのように中継された、初めての戦争とも言われます。
        added: true
        show:
          - { type: title, text: 日本への影響 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "ミサイルの映像がテレビで中継された戦争" }
      - say: 日本は、憲法9条のもとで兵を送らず、130億ドルという多額のお金を出しました。しかし、お金だけ出して、人は出さない、と国際的に批判されます。これが、のちに自衛隊を国連の平和維持活動、PKOに送る、きっかけになりました。
        read: 日本は、憲法9条のもとで兵を送らず、130億ドルという多額のお金を出しました。しかし、お金だけ出して、人は出さない、と国際的に批判されます。これが、のちに自衛隊を国連の平和維持活動、ピーケーオーに送る、きっかけになりました。
        added: true
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: yellow, title: 日本の対応, text: "兵は送らず、約130億ドルを負担 →「お金だけ」と批判される" }
          - { type: text, at: [ 80, 410 ], w: 1120, text: "→ 1992年 自衛隊の **PKO**（国連平和維持活動）参加へ" }
