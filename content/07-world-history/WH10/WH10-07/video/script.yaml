title: 湾岸戦争
scenes:
  - board: whiteboard
    steps:
      - say: 1990年、イランとの長い戦争で、多額の借金をかかえていたイラクは、となりの国、クウェートに攻めこみました。
        show:
          - { type: title, text: 湾岸戦争 }
          - type: list
            at: [ 80, 140 ]
            items: [ "1980〜88年　イラン・イラク戦争 → イラクは多額の借金", "1990年　イラクが **クウェート** に侵攻", "1991年　アメリカ中心の多国籍軍が攻撃 → クウェート解放" ]
      - say: クウェートは、石油の豊かな国です。石油と、借金の帳消しをねらった侵攻だった、とも言われます。
        added: true
        show: []
      - say: これに対し、アメリカを中心とする多国籍軍が、1991年に武力を使ってイラク軍を追い出し、クウェートを解放しました。これが、湾岸戦争です。
        show: []
  - gen: map
    board: whiteboard
    steps:
      - say: イラクが攻めこんだクウェートは、ペルシャ湾の奥にある、小さな、石油の豊かな国です。アメリカを中心とする多国籍軍は、となりのサウジアラビアを拠点に、イラク軍と戦いました。
        show:
          - { type: title, text: 湾岸戦争の舞台 }
