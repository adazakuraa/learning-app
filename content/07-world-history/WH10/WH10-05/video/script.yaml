title: アフリカの独立とその後
scenes:
  - board: whiteboard
    steps:
      - say: 1960年は、アフリカの年と呼ばれ、この1年だけで、17の国が独立しました。
        show:
          - { type: title, text: 1960年　アフリカの年 }
          - { type: text, at: [80, 140], w: 1120, size: l, text: "この1年で **17か国** が独立" }
      - say: しかし、第8章で学んだように、植民地の時代に、民族や文化を無視して引かれた、まっすぐな国境が、そのまま独立国の国境になりました。そのため、独立のあとも、各地で内戦や虐殺が起きます。
        show:
          - { type: box, at: [80, 260], w: 1120, color: pink, text: "植民地時代の「まっすぐな国境」がそのまま国境に → 独立後も内戦・虐殺" }

  - board: whiteboard
    steps:
      - say: 1994年のルワンダ虐殺では、およそ100日のあいだに、主にツチ族を中心に、推計80万人ともいわれる人々が殺されるという、むごたらしいできごとが起きました。
        show:
          - { type: title, text: ルワンダ虐殺（1994年） }
          - { type: box, at: [80, 140], w: 1120, color: pink, text: "約100日間で、主にツチ族を中心に推計 **80万人** ともいわれる人々が殺される" }
      - say: ラジオで、相手の民族への憎しみをあおる放送が、くり返し流されていました。言葉が、人を殺す道具になりうることを示した事件です。
        added: true
        show:
          - { type: text, at: [80, 320], w: 1120, color: gray, text: "ラジオが憎しみをあおった ＝ 言葉が暴力を生む" }

  - board: whiteboard
    steps:
      - say: 南アフリカでは、白人と黒人を分けて差別する、アパルトヘイトという政策がとられていました。
        show:
          - { type: title, text: ネルソン・マンデラ }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: アパルトヘイト, text: "白人と黒人を分けて差別する、人種隔離政策" }
      - say: これに抵抗したネルソン・マンデラは、27年間を刑務所で過ごしたのち、1994年に大統領になります。そして、仕返しではなく、和解を選びました。
        show:
          - { type: text, at: [80, 300], w: 1120, text: "27年間の獄中生活 → 1994年 大統領に → 報復ではなく **和解**" }
      - say: 人は、生まれながらに、ほかの人種を憎むようには生まれない。憎むことを学ぶのなら、愛することも教えられる。マンデラのこの言葉は、歴史の教訓として、今も語りつがれています。
        show:
          - { type: box, at: [80, 400], w: 1120, color: green, text: "「憎むことを学べるなら、愛することも教えられる」" }
