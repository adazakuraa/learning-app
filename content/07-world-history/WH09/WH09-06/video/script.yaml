title: 第二次世界大戦と日本・中国の関わり
scenes:
  - board: whiteboard
    steps:
      - say: 日本史で学んだ流れを、世界史の目で見てみましょう。
        show:
          - { type: title, text: 世界の中の日本 }
      - say: 日本では20世紀に入り、軍部が政治への影響力を強めていきました。1931年の満州事変で、アジアへの進出を本格化させ、1937年の盧溝橋事件をきっかけに、中国との全面戦争に入ります。
        read: 日本では20世紀に入り、軍部が政治への影響力を強めていきました。1931年の満州事変で、アジアへの進出を本格化させ、1937年のろこうきょう事件をきっかけに、中国との全面戦争に入ります。
        show:
          - type: list
            at: [80, 140]
            items: ["1931年　**満州事変**（軍が独断で起こす）", "1937年　盧溝橋事件 → **日中戦争**", "1941年　真珠湾攻撃 → **太平洋戦争**"]

  - board: whiteboard
    steps:
      - say: 1941年、日本は真珠湾を奇襲してアメリカと戦争を始め、はじめは東南アジアの各地をおさえました。地図の赤い部分が、1942年ごろの日本の勢力範囲です。
        show:
          - { type: title, text: 日本の勢力範囲（1942年ごろ） }
          - { type: image, src: 1000002915.webp, at: [560, 130], w: 640, caption: 1942年ごろの日本の勢力範囲 }
          - { type: text, at: [80, 140], w: 440, text: "はじめは東南アジア\n各地をおさえる" }
      - say: しかし、1942年のミッドウェー海戦で敗れてからは、守りに回ります。
        show:
          - { type: box, at: [80, 280], w: 440, color: pink, title: 1942年 ミッドウェー海戦, text: "敗北 → 守勢へ" }
      - say: そして1945年8月、広島と長崎への原爆投下と、ソ連の参戦が重なり、日本は降伏しました。
        show:
          - { type: box, at: [80, 460], w: 440, color: gray, title: 1945年8月, text: "原爆投下・ソ連参戦\n→ 降伏" }

  - board: whiteboard
    steps:
      - say: 中国では、日本と戦いながら、蒋介石の国民党と、毛沢東の共産党が、内側で対立し続けていました。
        read: 中国では、日本と戦いながら、しょうかいせきの国民党と、もうたくとうの共産党が、内側で対立し続けていました。
        show:
          - { type: title, text: 中国の二つの勢力 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 国民党, text: "蒋介石" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: 共産党, text: "毛沢東" }
      - say: 日本が降伏すると、この対立は内戦となり、1949年、共産党の中華人民共和国が生まれ、国民党は台湾へ逃れます。今の、中国と台湾の問題の始まりです。
        added: true
        show:
          - { type: text, at: [80, 340], w: 1120, text: "日本の降伏後に内戦 → 1949年 中華人民共和国 → 国民党は **台湾** へ" }
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "→ 今の中国・台湾問題の始まり" }
