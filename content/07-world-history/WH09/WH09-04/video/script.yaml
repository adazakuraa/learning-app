title: ヒトラーとナチス・ドイツ
scenes:
  - board: whiteboard
    steps:
      - say: アドルフ・ヒトラーは、オーストリアの出身です。美術学校の試験に二度落ち、ホームレスに近い生活を送った時期もある青年でした。
        show:
          - { type: title, text: ヒトラーの若いころ }
          - type: list
            at: [80, 140]
            items: ["オーストリア出身", "美術学校に二度不合格", "ホームレス同然の生活も"]
      - say: 第一次世界大戦に兵士として加わり、ドイツが負けた屈辱が、のちの政治活動の原動力になりました。
        show:
          - { type: box, at: [80, 380], w: 1120, color: yellow, text: "第一次大戦の従軍とドイツ敗戦の **屈辱** → 政治活動の原動力" }

  - board: whiteboard
    steps:
      - say: ヴェルサイユ体制への不満と、世界恐慌の苦しさにあえぐドイツで、ナチス党は選挙で票をのばし、合法的に政権を手に入れます。
        show:
          - { type: title, text: 民主主義から生まれた独裁 }
          - { type: box, at: [80, 140], w: 1120, color: pink, text: "ヴェルサイユ体制への不満 ＋ 世界恐慌 → ナチスが **選挙で** 政権獲得（1933年）" }
      - say: クーデターではなく、選挙で選ばれた、という点が重要です。民主主義のしくみの中から、独裁者が生まれたのです。
        show:
          - { type: text, at: [80, 320], w: 1120, size: l, text: "独裁者は **選挙** から生まれた" }
      - say: ヒトラーは、ユダヤ人と共産主義者を、ドイツが苦しむ原因だ、と名指しし、わかりやすい敵を示すことで、人々の不満を吸い上げました。
        show:
          - { type: box, at: [80, 420], w: 1120, color: yellow, title: 手法, text: "わかりやすい「敵」を示し、人々の不満を吸い上げる" }
      - say: 複雑な問題を、誰かのせいにして単純に説明する。この手法は、今の政治でも、形を変えて現れることがあります。気をつけて見る目が大切です。
        added: true
        show:
          - { type: text, at: [80, 580], w: 1120, color: gray, text: "複雑な問題を「誰かのせい」にする説明には注意" }
