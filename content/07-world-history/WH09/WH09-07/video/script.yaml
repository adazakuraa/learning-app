title: ホロコーストとニュルンベルク裁判
scenes:
  - board: whiteboard
    steps:
      - say: ナチス・ドイツは、ユダヤ人を、劣った人種だとして、組織的に絶滅させようとしました。アウシュビッツなどの絶滅収容所で、およそ600万人のユダヤ人が殺されました。ホロコーストです。
        show:
          - { type: title, text: ホロコースト }
          - { type: box, at: [80, 140], w: 1120, color: pink, title: ホロコースト, text: "アウシュビッツなどの絶滅収容所で、約 **600万人** のユダヤ人を殺害" }
      - say: おそろしいのは、これが、狂った一人の人間ではなく、役所の組織と、事務的な手続きによって、実行されたことです。
        show:
          - { type: text, at: [80, 320], w: 1120, size: l, text: "狂気の個人ではなく、**組織と手続き** によって実行された" }

  - board: whiteboard
    steps:
      - say: 哲学者のハンナ・アーレントは、1961年、ユダヤ人の移送の責任者だった、アイヒマンの裁判を見て、悪の陳腐さ、という考え方を示しました。
        show:
          - { type: title, text: 悪の凡庸さ }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: ハンナ・アーレント「悪の陳腐さ」, text: "アイヒマン裁判（1961年）を傍聴して" }
      - say: 被告は、怪物ではありませんでした。命令に従って、書類を処理していた、普通の役人だったのです。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "被告は怪物ではなく、命令に従う **普通の役人** だった" }
      - say: 自分で考えることをやめた普通の人が、組織のなかで、とてつもない悪に加わってしまう。これは、会社や学校など、今のわたしたちの組織にも通じる警告です。
        show:
          - { type: box, at: [80, 410], w: 1120, color: blue, text: "自分で考えるのをやめた普通の人が、組織の中で巨大な悪に加担しうる" }

  - board: whiteboard
    steps:
      - say: 戦後のニュルンベルク裁判は、国の指導者が、国際法によって裁かれる、という先例を作りました。命令に従っただけ、という言いわけでは、責任をまぬがれない、という原則が確立されます。
        show:
          - { type: title, text: ニュルンベルク裁判 }
          - { type: box, at: [80, 140], w: 1120, color: green, text: "国の指導者も国際法で裁かれる・「命令に従っただけ」では責任をまぬがれない" }
      - say: これが、のちの国際刑事裁判所の土台になっています。日本でも東京裁判が行われましたが、勝った側が負けた側を裁く、勝者の裁きだ、という批判も、当時から根強くありました。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "→ 国際刑事裁判所の土台" }
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "日本の東京裁判には「勝者の裁き」という批判も" }
