title: ホロコーストとニュルンベルク裁判
scenes:
  - board: whiteboard
    steps:
      - say: ナチス・ドイツは、ユダヤ人を、劣った人種だとして、組織的に絶滅させようとしました。アウシュビッツなどの絶滅収容所で、およそ600万人のユダヤ人が殺されました。ホロコーストです。
        show:
          - { type: title, text: ホロコースト }
          - { type: box, at: [ 80, 140 ], w: 1120, color: pink, title: ホロコースト, text: "アウシュビッツなどの絶滅収容所で、約 **600万人** のユダヤ人を殺害" }
      - say: おそろしいのは、これが、狂った一人の人間ではなく、役所の組織と、事務的な手続きによって、実行されたことです。
        show:
          - { type: text, at: [ 80, 320 ], w: 1120, size: l, text: "狂気の個人ではなく、**組織と手続き** によって実行された" }
  - gen: map
    board: whiteboard
    steps:
      - say: 最大の強制収容所、アウシュビッツは、ドイツが占領した、今のポーランドの南部にありました。戦後の裁判が開かれたニュルンベルクは、ドイツ南部の町で、ナチス党の大会が開かれていた場所でした。
        show:
          - { type: title, text: アウシュビッツとニュルンベルク }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
          - type: svg
            at: *a1
            w: 1000
            h: 520
