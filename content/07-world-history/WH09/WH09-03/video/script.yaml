title: ヴェルサイユ体制と全体主義の台頭
scenes:
  - board: whiteboard
    steps:
      - say: 1918年、戦争はドイツ側の敗北で終わり、1919年のヴェルサイユ条約は、ドイツに、領土の割譲、軍備の制限、そして膨大な賠償金という、屈辱的な条件を突きつけました。
        show:
          - { type: title, text: ヴェルサイユ条約（1919年） }
          - type: list
            at: [80, 140]
            items: ["領土の割譲", "軍備の制限", "**膨大な賠償金**"]
      - say: 賠償金の額は、ドイツが払い終えたのが、なんと2010年だったほどです。負けた国を追いつめすぎると、恨みが残り、次の争いの種になる。これが、第二次世界大戦への伏線になります。
        added: true
        show:
          - { type: box, at: [80, 380], w: 1120, color: pink, text: "追いつめすぎた敗戦国 → 恨み → **次の戦争の種**" }

  - board: whiteboard
    steps:
      - say: さらに1929年、アメリカで始まった世界恐慌で、ドイツの経済は、壊滅的な打撃を受けます。失業者が町にあふれ、民主主義への失望が高まるなかで、強いリーダーを求める声が大きくなりました。
        show:
          - { type: title, text: 世界恐慌と各国の対応 }
          - { type: text, at: [80, 140], w: 1120, text: "1929年 世界恐慌 → 失業者があふれ、強いリーダーを求める声" }
      - say: アメリカは、ニューディール政策で、公共事業によって仕事を作り、イギリスやフランスは、植民地との貿易を優先する、ブロック経済に移りました。
        show:
          - { type: box, at: [80, 230], w: 360, color: blue, title: アメリカ, text: "ニューディール政策" }
          - { type: box, at: [460, 230], w: 360, color: green, title: イギリス・フランス, text: "ブロック経済" }
      - say: 一方、植民地の少ない日本、ドイツ、イタリアは、経済の行きづまりを、軍事の力で切り開こうとする方向へ進んでいきます。
        show:
          - { type: box, at: [840, 230], w: 360, color: pink, title: 日本・ドイツ・イタリア, text: "軍事で切り開く" }

  - board: whiteboard
    steps:
      - say: ファシズム、全体主義とは、国家や民族の団結と強さを何よりも優先し、個人の自由を犠牲にすることをいとわない考え方です。
        show:
          - { type: title, text: 全体主義（ファシズム） }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 全体主義, text: "国家・民族の強さが最優先 → 個人の自由は犠牲にしてよい" }
      - say: イタリアでは、すでに1922年に、ムッソリーニがファシスト党を率いて、権力をにぎっていました。同じような流れが、ドイツではナチス、日本では軍部の台頭という形で現れます。
        show:
          - { type: box, at: [80, 300], w: 360, color: pink, title: イタリア, text: "ムッソリーニ\n（1922年〜）" }
          - { type: box, at: [460, 300], w: 360, color: pink, title: ドイツ, text: "ヒトラーとナチス" }
          - { type: box, at: [840, 300], w: 360, color: pink, title: 日本, text: "軍部の台頭" }
