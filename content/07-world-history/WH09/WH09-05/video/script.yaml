title: 第二次世界大戦
scenes:
  - board: whiteboard
    steps:
      - say: 1939年、ドイツがポーランドに攻めこみ、イギリスとフランスがドイツに宣戦布告して、第二次世界大戦が始まります。
        show:
          - { type: title, text: 1939年　第二次世界大戦 }
          - { type: text, at: [80, 140], w: 1120, text: "ドイツがポーランドに侵攻 → イギリス・フランスが宣戦布告" }
      - say: ドイツは、戦車と飛行機を組み合わせた、すばやい作戦で、ポーランドやフランスを次々とおさえましたが、イギリスは屈しませんでした。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, text: "ドイツの電撃戦 → ポーランド・フランスを制圧" }
      - say: イギリスの首相チャーチルの、我々は浜辺で戦う、決して降伏しない、という演説が、国民の気持ちを支えました。
        show:
          - { type: box, at: [80, 380], w: 1120, color: blue, title: チャーチル（イギリス首相）, text: "「我々は浜辺で戦う。決して降伏しない」" }

  - board: whiteboard
    steps:
      - say: 1941年、ドイツがソ連に攻めこみます。そして、ドイツと同盟を結んでいた日本が、真珠湾を攻撃し、アメリカが参戦したことで、戦争は本当の世界大戦になりました。
        show:
          - { type: title, text: 本当の世界大戦へ }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 枢軸国, text: "ドイツ・イタリア・日本" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: 連合国, text: "イギリス・アメリカ\nソ連・中国 など" }
      - say: 連合国の軍は、東からソ連軍、西からはノルマンディー上陸作戦で、ドイツをはさみうちにし、1945年、ドイツと日本を降伏させました。
        show:
          - type: list
            at: [80, 360]
            items: ["1941年　ドイツがソ連に侵攻・日本が真珠湾攻撃", "1944年　**ノルマンディー上陸作戦**", "1945年5月 ドイツ降伏　8月 日本降伏"]
      - say: 犠牲者は、世界全体で、5000万人とも、8000万人とも言われます。人類の歴史で、最大の戦争でした。
        added: true
        show:
          - { type: text, at: [80, 560], w: 1120, color: gray, text: "犠牲者は世界で5000万〜8000万人とも" }
