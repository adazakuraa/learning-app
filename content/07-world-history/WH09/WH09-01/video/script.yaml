title: 第一次世界大戦の原因と経緯
scenes:
  - board: slide
    steps:
      - say: 第9章、「二つの世界大戦」です。
        show:
          - { type: title, text: 第9章　二つの世界大戦 }
      - say: 第一次世界大戦、ロシア革命、全体主義の台頭、ヒトラー、第二次世界大戦、そしてホロコーストと戦後の裁判までを見ていきます。
        show:
          - type: list
            items: ["第一次世界大戦の原因と経緯", "ロシア革命とソ連の成立", "ヴェルサイユ体制と全体主義の台頭", "ヒトラーとナチス・ドイツ", "第二次世界大戦", "第二次世界大戦と日本・中国", "ホロコーストとニュルンベルク裁判"]
      - say: わずか30年の間に、二度の世界大戦が起き、何千万もの命が失われました。なぜくり返されたのか。日本史の昭和の章と、合わせて考えてみてください。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "世界大戦がなぜ起き、なぜくり返されたのかを、原因の連鎖としてつかむ" }

  - board: whiteboard
    steps:
      - say: ビスマルクが統一したドイツが、急速に力をつけたことで、20世紀はじめのヨーロッパは、複雑な同盟関係と、軍備の拡大競争で、火薬庫のような状態になっていました。
        show:
          - { type: title, text: 二つの陣営 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 三国同盟, text: "ドイツ・オーストリア\nイタリア" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: 三国協商, text: "イギリス・フランス\nロシア" }
      - say: ドイツ、オーストリア、イタリアの三国同盟と、イギリス、フランス、ロシアの三国協商。どこかで争いが起きると、全員が、芋づる式に引きずりこまれるしくみになっていたのです。
        show:
          - { type: text, at: [80, 360], w: 1120, size: l, text: "どこかで争いが起きると、**芋づる式** に全員が参戦" }
      - say: ただしイタリアは、実際の大戦では、のちに協商の側について戦いました。
        added: true
        show:
          - { type: text, at: [80, 450], w: 1120, color: gray, text: "※ イタリアは実際には途中から協商（連合国）側で参戦" }

  - board: whiteboard
    steps:
      - say: 1914年、オーストリアの皇太子が、サラエボで、セルビア人の青年に暗殺されました。サラエボ事件です。
        show:
          - { type: title, text: 1914年　第一次世界大戦 }
          - { type: text, at: [80, 140], w: 1120, text: "サラエボ事件：オーストリア皇太子がセルビア人青年に暗殺される" }
      - say: この一発の銃弾が、同盟の連鎖を引き起こし、わずか数週間で、ヨーロッパ全体が戦争に突入しました。クリスマスまでには終わる、と誰もが思っていた戦争は、4年以上も続きます。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, text: "一発の銃弾 → 数週間で全ヨーロッパが参戦 →「クリスマスまでに終わる」はずが **4年以上**" }
      - say: 機関銃、毒ガス、戦車という新しい兵器が登場し、わずか数百メートルの土地をめぐって、何十万もの命が失われました。
        show:
          - type: list
            at: [80, 400]
            items: ["機関銃・毒ガス・戦車・飛行機", "塹壕戦：数百mの土地に何十万もの命"]
