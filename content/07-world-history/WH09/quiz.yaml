questions:
  - q: 1914年、オーストリアの皇太子が暗殺され、第一次世界大戦のきっかけとなった事件を何というか。
    a: [サラエボ事件]
  - q: 1917年、ロシア革命を率いて社会主義政権をつくった人物は誰か。
    a: [レーニン]
  - q: 第一次世界大戦後、ドイツに領土の割譲や巨額の賠償金を課した条約を何というか。
    a: [ヴェルサイユ条約, ベルサイユ条約]
    show: ヴェルサイユ条約
  - q: ナチス・ドイツが、アウシュビッツなどの収容所で約600万人のユダヤ人を殺害したことを何というか。
    a: [ホロコースト]
