title: ロシア革命とソ連の成立
scenes:
  - board: whiteboard
    steps:
      - say: 第一次世界大戦のさなか、食料不足と、戦争への疲れが積み重なったロシアで、二つの革命が起きます。
        show:
          - { type: title, text: 1917年　ロシア革命 }
          - { type: text, at: [80, 140], w: 1120, text: "食料不足・戦争への疲れ → 2つの革命" }
      - say: 1917年3月の革命で、300年続いたロマノフ王朝がたおれます。続いて11月、レーニンが率いる社会主義のボリシェヴィキ、のちの共産党が、権力をにぎりました。
        show:
          - { type: box, at: [80, 230], w: 540, color: gray, title: 3月革命, text: "ロマノフ王朝（約300年）が崩壊" }
          - { type: box, at: [660, 230], w: 540, color: pink, title: 11月革命, text: "**レーニン** のボリシェヴィキ\n（のちの共産党）が権力を握る" }
      - say: 今すぐ戦争をやめ、土地を農民に、工場を労働者に。このわかりやすい呼びかけが、疲れきった人々の心をつかんだのです。そして1922年、世界で初めての社会主義の国、ソビエト連邦が生まれました。
        show:
          - { type: box, at: [80, 430], w: 1120, color: yellow, text: "「戦争をやめ、土地を農民に、工場を労働者に」→ 1922年 **ソ連** 成立" }

  - board: whiteboard
    steps:
      - say: レーニンの死後、後継者争いに勝ったスターリンは、反対派の粛清、強制収容所、そして農業の集団化による大ききんで、数百万から数千万人もの、自分の国の人々を死に追いやりました。
        show:
          - { type: title, text: スターリンの独裁 }
          - type: list
            at: [80, 140]
            items: ["反対派の **粛清**", "強制収容所", "農業の集団化 → 大ききん", "数百万〜数千万人が犠牲に"]
      - say: マルクスが夢見た、理想の社会主義とはかけ離れた、もとの王の時代以上に人々をおさえつける国が、生まれてしまったのです。
        show:
          - { type: box, at: [80, 400], w: 1120, color: pink, text: "理想の社会主義とはかけ離れた、旧体制以上の **抑圧国家**" }
      - say: 平等な社会を目指したはずの革命が、独裁を生む。理想が正しくても、権力をおさえるしくみがなければ、暴走してしまう、という教訓です。
        added: true
        show:
          - { type: text, at: [80, 540], w: 1120, color: gray, text: "理想が正しくても、権力をおさえるしくみがないと暴走する" }
