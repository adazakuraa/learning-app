  - board: whiteboard
    steps:
      - say: ドイツは、ビスマルクのもとで、急速に工業化と軍備の強化を進め、イギリスやフランスに挑戦する国になっていきます。
        show:
          - { type: title, text: 新興国ドイツ }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "急速な工業化・軍備強化 → イギリス・フランスに挑戦" }
      - say: この、新しい大国ドイツの台頭こそが、ヨーロッパを不安定にし、第一次世界大戦の遠い原因になっていきます。
        show:
          - { type: box, at: [ 80, 240 ], w: 1120, color: pink, text: "新しい大国の台頭 → ヨーロッパの不安定化 → **第一次世界大戦** の遠因" }
      - say: 新しい大国が台頭すると、もとの大国との間に緊張が生まれる。今のアメリカと中国の関係にも、重ねて見ることができます。
        added: true
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, color: gray, text: "新しい大国 vs もとの大国 ← 今の米中関係にも通じる" }
