title: ナショナリズム
scenes:
  - board: whiteboard
    steps:
      - say: フランス革命とナポレオンの時代が生み出した、もっとも重要な考え方の一つが、ナショナリズムです。
        show:
          - { type: title, text: ナショナリズム }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: ナショナリズム, text: "同じ言葉・文化・歴史を持つ人々が、一つの国を作るべきだ" }
      - say: 同じ言葉、文化、歴史を持つ人々が、一つの国を作るべきだ。わたしたちが当たり前と思う、国民の国、という考え方は、実はこの時代に生まれた、新しいものなのです。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "「国民の国」という考え方は、実は **200年ほど前** に生まれた" }

  - board: whiteboard
    steps:
      - say: ばらばらだったイタリアを統一した英雄、ガリバルディは、1000人の義勇兵で南イタリアを征服したあと、その土地を、国王に差し出しました。権力よりも、統一という理想を優先したのです。
        show:
          - { type: title, text: イタリアとドイツの統一 }
          - { type: box, at: [80, 140], w: 540, color: green, title: ガリバルディ（イタリア）, text: "1000人で南イタリアを征服\nその土地を国王に献上" }
      - say: ドイツの統一を進めた、鉄血宰相ビスマルクは、今の大問題は、鉄、つまり武器と、血、つまり犠牲によって解決される、と宣言した、強硬な政治家でした。
        show:
          - { type: box, at: [660, 140], w: 540, color: blue, title: ビスマルク（ドイツ）, text: "鉄血宰相\n「問題は鉄と血で解決される」" }
      - say: 一方で、ドイツで最初の社会保険制度を作った人物でもあります。労働者の不満を、社会主義に向かわせないための、アメという面もありましたが、今の社会保障制度の先がけとなりました。
        show:
          - { type: box, at: [80, 360], w: 1120, color: yellow, text: "ビスマルクの社会保険 → 今の **社会保障制度** の先がけ（日本の健康保険も）" }

  - board: whiteboard
    steps:
      - say: ドイツは、ビスマルクのもとで、急速に工業化と軍備の強化を進め、イギリスやフランスに挑戦する国になっていきます。
        show:
          - { type: title, text: 新興国ドイツ }
          - { type: text, at: [80, 140], w: 1120, text: "急速な工業化・軍備強化 → イギリス・フランスに挑戦" }
      - say: この、新しい大国ドイツの台頭こそが、ヨーロッパを不安定にし、第一次世界大戦の遠い原因になっていきます。
        show:
          - { type: box, at: [80, 240], w: 1120, color: pink, text: "新しい大国の台頭 → ヨーロッパの不安定化 → **第一次世界大戦** の遠因" }
      - say: 新しい大国が台頭すると、もとの大国との間に緊張が生まれる。今のアメリカと中国の関係にも、重ねて見ることができます。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "新しい大国 vs もとの大国 ← 今の米中関係にも通じる" }
