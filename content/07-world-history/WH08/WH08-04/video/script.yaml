title: ウィーン体制とその動揺
scenes:
  - board: whiteboard
    steps:
      - say: ナポレオンが敗れたあとの1815年、ヨーロッパの大国は、ウィーン会議を開いて、ナポレオン以前の秩序を取り戻そうとしました。
        show:
          - { type: title, text: ウィーン体制 }
          - { type: text, at: [80, 140], w: 1120, text: "1815年 **ウィーン会議** → ナポレオン以前の秩序に戻そう" }
      - say: 革命の前の王家の権威を取り戻す、正統主義。そして、特定の国だけが強くなりすぎないようにする、勢力均衡。この二つを原則とする、ウィーン体制ができあがります。
        show:
          - { type: box, at: [80, 230], w: 540, color: blue, title: 正統主義, text: "革命前の王家の権威を回復" }
          - { type: box, at: [660, 230], w: 540, color: green, title: 勢力均衡, text: "一つの国が突出しないように" }
      - say: 会議は、舞踏会ばかりで中身が進まず、会議は踊る、されど進まず、と皮肉られました。
        added: true
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "「会議は踊る、されど進まず」" }

  - board: whiteboard
    steps:
      - say: しかし、フランス革命とナポレオンがまいた、自由、平等、国民が主人公、そしてナショナリズムの種は、消えませんでした。
        show:
          - { type: title, text: 消えなかった革命の種 }
          - type: list
            at: [80, 140]
            items: ["自由・平等", "国民が主人公（国民主権）", "ナショナリズム"]
      - say: 1830年、1848年と、ヨーロッパ各地で、革命や反乱が次々と起こります。特に1848年の、諸国民の春と呼ばれた革命の嵐は、ウィーン体制を、事実上くずしました。
        show:
          - { type: box, at: [80, 360], w: 1120, color: yellow, title: 1848年　諸国民の春, text: "ヨーロッパ各地で革命 → ウィーン体制は事実上崩壊" }
      - say: 一度広まった考え方は、力でおさえこんでも、なかなか消えないのです。
        show:
          - { type: text, at: [80, 520], w: 1120, color: gray, text: "一度広まった考えは、力でおさえても消えない" }
