title: 産業革命とその影響
scenes:
  - board: whiteboard
    steps:
      - say: 18世紀の後半、イギリスで、蒸気機関という新しい動力によって、ものの作り方が、根本から変わりました。産業革命です。
        show:
          - { type: title, text: 産業革命 }
          - { type: text, at: [80, 140], w: 1120, text: "18世紀後半 **イギリス**　蒸気機関 → ものの作り方が根本から変わる" }
      - say: ジェームズ・ワットは、蒸気機関の発明者ではなく、改良者です。修理を頼まれた、古い蒸気機関を、実際に使えるものに作り変えました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: blue, title: ジェームズ・ワット, text: "発明者ではなく **改良者**（既存の蒸気機関を実用的に）" }
      - say: 電力の単位、ワットは、彼の名前から来ています。手作業から機械へ。人や馬の力から、石炭の力へ。人類の生産力は、何倍にも跳ね上がりました。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, text: "手作業 → **機械**　人や馬の力 → **石炭の力**" }
          - { type: text, at: [80, 480], w: 1120, color: gray, text: "電力の単位「ワット」は彼の名前から" }

  - board: whiteboard
    steps:
      - say: 産業革命は、社会を大きく変えました。農村から都市へ人が移り、工場で働く労働者という、新しい階級が生まれます。
        show:
          - { type: title, text: 豊かさと悲惨さ }
          - { type: box, at: [80, 140], w: 540, color: green, title: 豊かさ, text: "生産力が大きく向上\nものが安く大量に" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: 悲惨さ, text: "1日14時間労働\n子どもの工場労働\nスラム（貧民街）" }
      - say: しかし、1日14時間の労働、子どもの工場労働、貧しい人々が集まるスラム。豊かさと悲惨さが、同時に生まれた時代でした。
        show: []
      - say: 労働時間の上限や、子どもの労働の禁止など、今の労働のルールは、この時代の悲惨な経験から、少しずつ作られていったのです。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, text: "→ 今の労働のルール（労働時間の上限・児童労働の禁止）の出発点" }
