title: 帝国主義と植民地支配
scenes:
  - board: whiteboard
    steps:
      - say: 産業革命で、圧倒的な経済力と軍事力を持ったヨーロッパの大国は、19世紀の後半、アジアやアフリカを、競うように植民地にしました。
        show:
          - { type: title, text: 帝国主義 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "19世紀後半　ヨーロッパの大国がアジア・アフリカを競って植民地に" }
      - say: 工場で作った製品を売る市場と、原料を手に入れる場所が必要だったからです。
        show:
          - { type: box, at: [ 80, 230 ], w: 540, color: blue, title: 経済の理由, text: "製品を売る市場\n原料の供給地" }
      - say: さらに、進んだ西洋の文明には、遅れた民族を文明化する使命がある、という理屈が、支配を正当化するために使われました。
        show:
          - { type: box, at: [ 660, 230 ], w: 540, color: pink, title: 正当化の理屈, text: "「遅れた民族を\n文明化する使命」" }

  - board: whiteboard
    steps:
      - say: 1884年から1885年の、ベルリン会議では、アフリカの人々がまったく参加しないまま、ヨーロッパの大国が、地図の上に定規で線を引くように、アフリカを分け合いました。
        show:
          - { type: title, text: 定規で引かれた国境 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: pink, title: ベルリン会議（1884〜85年）, text: "アフリカの人々は不参加のまま、ヨーロッパがアフリカを分割" }
      - say: 民族や言葉、文化を無視した、まっすぐな国境は、今も続くアフリカの紛争の、大きな原因の一つになっています。地図でアフリカを見ると、まっすぐな国境が多いことに気づくはずです。
        show:
          - { type: text, at: [ 80, 320 ], w: 1120, size: l, text: "まっすぐな国境 → 今も続く **紛争の原因** の一つ" }
  - gen: map
    board: whiteboard
    steps:
      - say: ベルリン会議のあと、アフリカは、20世紀のはじめまでに、エチオピアとリベリアをのぞいて、ほぼすべてが、ヨーロッパの国々に分けられてしまいました。
        show:
          - { type: title, text: アフリカ分割 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
