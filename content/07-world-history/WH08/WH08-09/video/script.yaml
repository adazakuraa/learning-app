title: ネルチンスク条約とロシアの拡大
scenes:
  - board: whiteboard
    steps:
      - say: ロシアは17世紀から、東へ東へと広がり続け、シベリアを横切って、太平洋にまで達しました。
        show:
          - { type: title, text: 東へ広がるロシア }
          - { type: text, at: [80, 140], w: 1120, text: "17世紀〜 シベリアを横断して **太平洋** へ" }
      - say: 中国の清との国境を決めた、1689年のネルチンスク条約は、清が外国と結んだ、初めての対等な条約とされています。
        show:
          - { type: box, at: [80, 230], w: 1120, color: blue, title: 1689年　ネルチンスク条約, text: "ロシアと清の国境を決める（清が外国と結んだ初の対等な条約）" }

  - board: whiteboard
    steps:
      - say: しかし、ロシアの本当の願いは、暖かい海への出口、凍らない港を手に入れることでした。北の海は冬に凍ってしまい、1年中は使えないからです。
        show:
          - { type: title, text: 不凍港を求めて }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 不凍港, text: "冬でも凍らない港 → 1年中、船が出せる" }
      - say: そこで、南へ勢力を広げようとする、南下政策をとるようになります。
        show:
          - { type: text, at: [80, 300], w: 1120, size: l, text: "→ **南下政策**" }
      - say: 黒海につき出たクリミア半島をめぐって、イギリス、フランス、オスマン帝国とぶつかり、1853年、クリミア戦争が起きました。ロシアは敗れ、近代化の必要を痛感します。
        show:
          - { type: box, at: [80, 380], w: 1120, color: pink, title: 1853年　クリミア戦争, text: "ロシア vs イギリス・フランス・オスマン帝国 → ロシア敗北" }

  - board: whiteboard
    steps:
      - say: ちなみに、この戦争で看護師として活躍した、フローレンス・ナイチンゲールが、近代の看護の基礎を作ったのも、この戦争の副産物の一つです。
        show:
          - { type: title, text: 今につながるクリミア }
          - { type: box, at: [80, 140], w: 1120, color: green, title: ナイチンゲール, text: "クリミア戦争で看護 → 近代看護の基礎を作る" }
      - say: 日露戦争も、このロシアの南下政策が原因の一つでした。そして、ロシアの不凍港へのこだわりは、今のウクライナの問題にもつながる、長い歴史の線の上にあります。2014年にロシアが併合を宣言したのも、このクリミア半島です。
        show:
          - type: list
            at: [80, 320]
            items: ["日露戦争（1904年）← 南下政策", "2014年　ロシアがクリミア併合を宣言", "今のウクライナ問題"]
