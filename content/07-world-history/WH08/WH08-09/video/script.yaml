title: ネルチンスク条約とロシアの拡大
scenes:
  - board: whiteboard
    steps:
      - say: ロシアは17世紀から、東へ東へと広がり続け、シベリアを横切って、太平洋にまで達しました。
        show:
          - { type: title, text: 東へ広がるロシア }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "17世紀〜 シベリアを横断して **太平洋** へ" }
      - say: 中国の清との国境を決めた、1689年のネルチンスク条約は、清が外国と結んだ、初めての対等な条約とされています。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: blue, title: 1689年　ネルチンスク条約, text: "ロシアと清の国境を決める（清が外国と結んだ初の対等な条約）" }
  - gen: map
    board: whiteboard
    steps:
      - say: ロシアの広がりを、地図で見てみましょう。モスクワを中心とした国が、17世紀のうちに、シベリアを東へ横切り、太平洋にまで達しました。
        show:
          - { type: title, text: ロシアの拡大 }
