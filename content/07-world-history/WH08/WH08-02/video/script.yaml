title: フランス革命とマリー・アントワネット
scenes:
  - board: whiteboard
    steps:
      - say: アメリカ独立の成功は、民衆が立ち上がれば、王の政治を倒せる、という希望を、フランスの人々に与えました。
        show:
          - { type: title, text: 旧体制（アンシャン・レジーム） }
          - type: svg
            at: [80, 140]
            w: 700
            h: 360
            anim: draw
            markup: |
              <path d="M350 10 L680 340 L20 340 Z" stroke="#f3d77a"/>
              <path d="M250 110 L450 110 M150 210 L550 210" stroke="#9aa3ad"/>
              <g stroke="none" font-size="24" fill="#e8eef5" text-anchor="middle"><text x="350" y="92">聖職者</text><text x="350" y="175">貴族</text><text x="350" y="290">平民（人口の約98%）</text></g>
          - { type: box, at: [820, 150], w: 380, color: green, title: 聖職者・貴族, text: "税を免除" }
          - { type: box, at: [820, 340], w: 380, color: pink, title: 平民, text: "税の負担をほぼ一手に" }
      - say: 当時のフランスは、アンシャン・レジーム、旧体制と呼ばれる、不平等な身分制度のもとにありました。聖職者と貴族は税を免除され、平民が、税の負担をほぼ一手に背負っていたのです。
        show: []

  - board: whiteboard
    steps:
      - say: 1789年、民衆がバスティーユ牢獄をおそったことで、フランス革命が始まりました。
        show:
          - { type: title, text: 1789年　フランス革命 }
          - { type: text, at: [80, 140], w: 1120, text: "バスティーユ牢獄の襲撃 → 革命の始まり" }
      - say: 同じ年に出された人権宣言は、人は生まれながらに自由で平等である、とうたい、今の憲法や人権の考え方の土台になっています。
        added: true
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: 人権宣言（1789年）, text: "人は生まれながらに自由で平等 → 今の人権思想の土台" }
      - say: しかし、革命はどんどん過激になり、革命に反対する者は人民の敵だ、として、次々とギロチンで処刑する、恐怖政治になりました。指導者のロベスピエール自身も、最後は処刑されます。
        show:
          - { type: box, at: [80, 400], w: 1120, color: pink, title: 恐怖政治, text: "反対者を次々とギロチンで処刑 → ロベスピエール自身も処刑" }

  - board: whiteboard
    steps:
      - say: マリー・アントワネットは、ハプスブルク家の皇女として、14歳でフランスに嫁いできました。オーストリアとフランスの同盟の、象徴として送りこまれたのです。
        show:
          - { type: title, text: マリー・アントワネット }
          - { type: text, at: [80, 140], w: 1120, text: "マリア・テレジアの娘 → 14歳でフランス王家へ" }
      - say: ファッションや舞踏会へのむだづかいで、赤字夫人と呼ばれ、民衆の不満の的になりました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, text: "浪費で「**赤字夫人**」と呼ばれる" }
      - say: パンがなければケーキを食べればいい、という言葉は、実際には彼女の発言ではないとされています。民衆の反感が生んだ言葉なのです。
        show:
          - { type: text, at: [80, 380], w: 1120, color: gray, text: "「パンがなければケーキを」← 実は彼女の言葉ではない" }
      - say: 処刑台に上がるとき、うっかり処刑人の足を踏んで、ごめんなさい、わざとではありません、と謝ったといいます。37歳でした。
        show:
          - { type: text, at: [80, 460], w: 1120, text: "処刑人の足を踏み「ごめんなさい」と謝った最期（37歳）" }
