questions:
  - q: 1789年、民衆がバスティーユ牢獄を襲撃して始まった革命を何というでしょう？
    a: [フランス革命]
  - q: アメリカ独立のとき、植民地の人々がかかげた「代表なくして（　　）なし」。（　　）に入る言葉を答えてください。
    a: [課税]
  - q: ワットが改良し、産業革命の動力となった機関を何というでしょう？
    a: [蒸気機関]
  - q: 『資本論』を書き、資本主義を批判して社会主義の理論を築いた人物は誰でしょう？
    a: [マルクス, カール・マルクス]
    show: マルクス
  - q: ヨーロッパの大国が、軍事力と経済力でアジア・アフリカを植民地にしていった政策を何というでしょう？
    a: [帝国主義]
