title: ナポレオンの台頭と没落
scenes:
  - board: whiteboard
    steps:
      - say: 恐怖政治のあと、フランスでは、混乱した政治が続きます。そのなかから、すい星のように現れたのが、ナポレオン・ボナパルトです。
        show:
          - { type: title, text: ナポレオンの台頭 }
          - { type: image, src: 1000002913.webp, at: [760, 120], w: 440, caption: ナポレオン時代の最大領域 }
          - type: list
            at: [80, 140]
            w: 640
            items: ["1799年　クーデターで権力をにぎる", "1804年　**皇帝** に", "ヨーロッパ各国を征服"]
      - say: 1799年のクーデターで権力をにぎり、1804年には皇帝になって、各国を次々と征服しました。革命の子でありながら、皇帝になる、という矛盾を、気にしなかったのです。
        show:
          - { type: text, at: [80, 380], w: 640, color: gray, text: "「革命の子」が「皇帝」に" }
      - say: 一方で、ナポレオン法典を作り、法の前の平等や、財産を持つ権利を定めました。この法律は、今も多くの国の民法のお手本になっています。
        added: true
        show:
          - { type: box, at: [80, 450], w: 640, color: green, title: ナポレオン法典, text: "法の前の平等 → 各国の民法のお手本" }

  - board: whiteboard
    steps:
      - say: しかし、1812年のロシア遠征では、焼き払われた土地と、冬の寒さの前に、60万の大軍のうち、帰ってこられたのは10万にも満たなかったといいます。
        show:
          - { type: title, text: ナポレオンの没落 }
          - type: svg
            at: [80, 140]
            w: 1000
            h: 120
            markup: |
              <g stroke="none"><rect x="40" y="30" width="150" height="60" fill="#9be0b0" fill-opacity="0.7"/><rect x="190" y="30" width="770" height="60" fill="#f4a3b8" fill-opacity="0.45"/></g>
              <g stroke="none" font-size="22"><text x="50" y="68" fill="#1b2a24">帰還 10万弱</text><text x="460" y="68" fill="#e8eef5">失われた兵（60万の大軍）</text></g>
      - say: そして1815年、ワーテルローの戦いで、イギリスなどの連合軍に敗れ、大西洋の孤島、セントヘレナ島に流されて、そこで亡くなりました。
        show:
          - { type: text, at: [80, 300], w: 1120, text: "1815年 **ワーテルローの戦い** で敗北 → セントヘレナ島へ流刑" }

  - board: whiteboard
    steps:
      - say: ナポレオンに支配された国々の人々は、自分たちはフランス人ではない、という意識に目覚め始めます。
        show:
          - { type: title, text: ナショナリズムの目覚め }
          - { type: box, at: [80, 140], w: 1120, color: yellow, text: "支配された人々「自分たちは **フランス人ではない**」" }
      - say: これが、のちのイタリアやドイツの統一運動の伏線になります。外から支配されることで、自分たちが何者かを意識する。日本で、仏教が来て神道が意識されたのと、似た構造です。
        show:
          - { type: text, at: [80, 300], w: 1120, text: "→ イタリア・ドイツの **統一運動** の伏線" }
