title: 社会主義の誕生
scenes:
  - board: whiteboard
    steps:
      - say: 産業革命がもたらした、労働者の悲惨な状況を分析したのが、カール・マルクスです。各地を転々としながら、人生の大半を貧しさのなかで過ごしました。
        show:
          - { type: title, text: カール・マルクス }
          - { type: text, at: [80, 140], w: 1120, text: "各地を転々・貧しい生活 → 友人 **エンゲルス** の支援で『**資本論**』" }
      - say: 友人のエンゲルスの経済的な支えを受けて、『資本論』を書きました。
        show: []
      - say: その中心は、資本家は、労働者が生み出した価値よりも低い給料しか払わず、その差額を、自分のものにしている、という主張です。
        show:
          - type: svg
            at: [80, 240]
            w: 1120
            h: 150
            markup: |
              <g stroke="none"><rect x="40" y="40" width="600" height="60" fill="#9be0b0" fill-opacity="0.6"/><rect x="640" y="40" width="400" height="60" fill="#f4a3b8" fill-opacity="0.6"/></g>
              <g stroke="none" font-size="24"><text x="60" y="80" fill="#1b2a24">労働者の給料</text><text x="660" y="80" fill="#1b2a24">資本家のもの（剰余価値）</text><text x="40" y="28" fill="#e8eef5">労働者が生み出した価値</text></g>

  - board: whiteboard
    steps:
      - say: 社会主義とは、工場や土地などの、ものを生み出す手段を、社会全体で共有しよう、という考え方です。資本家がそれを持ち、利益をひとりじめする資本主義への、対抗の思想として生まれました。
        show:
          - { type: title, text: 資本主義と社会主義 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 資本主義, text: "工場や土地は **個人（資本家）** のもの" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: 社会主義, text: "工場や土地は **社会全体** で共有" }
      - say: マルクスの思想は、のちのロシア革命、中国革命、キューバ革命など、多くの国の革命に影響を与えます。
        show:
          - { type: text, at: [80, 340], w: 1120, text: "→ ロシア革命・中国革命・キューバ革命などに影響" }
      - say: ただし、実際に作られた社会主義の国々は、マルクスの理想とはかなり違う、自由をおさえつけるものになりました。
        show:
          - { type: text, at: [80, 420], w: 1120, color: gray, text: "実際の社会主義国家は、理想とは違う抑圧的な国に" }
      - say: 一方、資本主義の国々も、社会主義の批判を受けて、労働者を守る法律や、社会保障を整えていきました。対立する考えが、お互いを変えていったのです。
        added: true
        show:
          - { type: text, at: [80, 500], w: 1120, text: "資本主義の国も、労働者保護・社会保障を整えていく" }
