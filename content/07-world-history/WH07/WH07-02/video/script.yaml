  - board: whiteboard
    steps:
      - say: 母を、父である王に処刑され、異母姉の時代には閉じこめられる、という波乱の少女時代を経て、女王になりました。
        show:
          - { type: title, text: 結婚しない女王 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "母は父王に処刑・姉の時代に幽閉 → 女王に" }
      - say: エリザベスは、生涯結婚しない、と宣言しました。結婚すれば、外国の夫に、国の実権が移ってしまうかもしれない、という政治的な判断です。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: yellow, text: "「生涯結婚しない」← 外国の夫に実権が移るのを防ぐ" }

  - board: whiteboard
    steps:
      - say: エリザベスは、ドレークなどの私掠船を使って、スペインの船をおそわせ、経済的に弱らせました。私掠船とは、女王が非公式に支援した、公認の海賊です。
        show:
          - { type: title, text: 無敵艦隊の撃破 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: pink, title: 私掠船（公認の海賊）, text: "ドレークなどがスペインの船をおそう" }
      - say: そして1588年、ついに無敵艦隊を打ち破ります。イングランドが、海の大国への道を歩み始めた瞬間です。
        show:
          - { type: text, at: [ 80, 310 ], w: 1120, size: l, text: "1588年　スペインの **無敵艦隊を撃破**" }
      - say: シェイクスピアが活躍したのも、この時代です。エリザベス朝文化と呼ばれる、黄金期でした。
        show:
          - { type: text, at: [ 80, 410 ], w: 1120, color: gray, text: "シェイクスピアの活躍 ＝ エリザベス朝文化の黄金期" }
