title: ムガル帝国とアジアの植民地化
scenes:
  - board: whiteboard
    steps:
      - say: インドでは、16世紀から17世紀にかけて、ムガル帝国が、ほぼ全体を支配していました。イスラム教の王朝でありながら、ヒンドゥー教徒と共存するしくみを作った大国です。
        show:
          - { type: title, text: ムガル帝国 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: green, title: ムガル帝国（16〜17世紀に最盛期）, text: "イスラム教の王朝 ＋ ヒンドゥー教徒との共存" }
      - say: 有名なタージ・マハルは、皇帝シャー・ジャハーンが、亡くなった妻のために建てた、白い大理石のお墓です。
        show:
          - { type: box, at: [ 80, 300 ], w: 1120, color: yellow, title: タージ・マハル, text: "皇帝が亡き妻のために建てた、白大理石の霊廟" }
  - gen: map
    board: whiteboard
    steps:
      - say: ムガル帝国は、インドの北部、デリーやアグラを中心に、インドのほぼ全体を支配しました。タージ・マハルがあるのは、アグラです。
        show:
          - { type: title, text: ムガル帝国とヨーロッパの拠点 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
