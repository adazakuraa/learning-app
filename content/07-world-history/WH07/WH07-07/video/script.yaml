  - board: whiteboard
    steps:
      - say: ムガル帝国がおとろえると、そのすきに、イギリスの東インド会社が進出し、地元の政治に口を出しながら、支配を広げていきました。
        show:
          - { type: title, text: 会社が国を支配する }
          - { type: box, at: [ 80, 140 ], w: 1120, color: pink, title: イギリス東インド会社, text: "貿易会社なのに、**軍隊** と **行政の力** を持つ" }
      - say: 東インド会社は、貿易の会社なのに、軍隊と、政治を行う力を持つ、とても変わった組織でした。会社が、国を支配したのです。
        show:
          - { type: text, at: [ 80, 300 ], w: 1120, size: l, text: "「会社」がインドを支配した" }
      - say: 一方、オランダは、今のインドネシアに進出し、香辛料の貿易をひとりじめして、大きな利益を得ました。17世紀から18世紀のアジアは、ヨーロッパの国々の、植民地の奪い合いの舞台になっていきます。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, text: "オランダ → インドネシア（香辛料を独占）" }
          - { type: text, at: [ 80, 480 ], w: 1120, color: gray, text: "日本の鎖国でも、オランダだけが貿易を許された" }
