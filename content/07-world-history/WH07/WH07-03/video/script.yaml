          - { type: text, text: プラハ（1618年 開戦）, at: [ 754, 394 ], size: s, color: pink, anim: fade, id: ml0_0 }
        added: true
      - say: ドイツの国土は荒れ果て、人口の、3分の1ほどが失われた地域もあったといわれます。終わりに結ばれたのが、ドイツの町の名をとった、ウェストファリア条約です。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: <circle cx="447.2" cy="193.5" r="9" fill="#9be0b0" stroke="#0b1c2c" stroke-width="2.5"/><rect x="51" y="185" width="428" height="38" rx="8" fill="#0d1a24" fill-opacity="0.72" stroke="none"/>
            id: mo1
