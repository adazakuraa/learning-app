title: 三十年戦争とナントの勅令
scenes:
  - board: whiteboard
    steps:
      - say: アウクスブルクの和議は、一時的な妥協にすぎず、カトリックとプロテスタントの対立は続いていました。それが爆発したのが、1618年に始まる、三十年戦争です。
        show:
          - { type: title, text: 三十年戦争（1618〜1648年） }
          - { type: text, at: [80, 140], w: 1120, text: "きっかけ：ボヘミア（チェコ）のプロテスタント貴族の反乱" }
      - say: きっかけは、今のチェコ、ボヘミアの、プロテスタントの貴族の反乱でした。これに、フランスやスウェーデンなどの国々が介入し、ヨーロッパ全体の覇権争いに広がります。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, text: "フランス・スウェーデンなどが介入 → ヨーロッパ全体の **覇権争い** に" }
      - say: 特に、カトリックの国フランスが、ハプスブルク家をおさえるために、プロテスタント側を助けたことで、これはもう宗教戦争ではなく、国と国の力の争いだ、という性格がはっきりしました。
        show:
          - { type: text, at: [80, 380], w: 1120, text: "カトリックのフランスがプロテスタント側を支援 → 宗教より **国の利益**" }
      - say: 30年の戦争で、ドイツは人口の3分の1を失ったとも言われ、農村は壊滅しました。
        show:
          - { type: text, at: [80, 460], w: 1120, color: pink, text: "ドイツは人口の約3分の1を失ったとも" }

  - board: whiteboard
    steps:
      - say: 戦争を終わらせたウェストファリア条約は、ほかの国の内側の政治に口を出してはいけない、という原則を確立しました。
        show:
          - { type: title, text: ウェストファリア条約（1648年） }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: 主権国家体制, text: "国どうしはお互いの主権を尊重し、内政に干渉しない" }
      - say: これが、今の国際社会の基礎となる、主権国家体制の誕生とされています。国連で、どの国も一票を持つ、という考え方のルーツです。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "→ 今の国際社会の基礎（国連の「1国1票」のルーツ）" }

  - board: whiteboard
    steps:
      - say: フランスでは、三十年戦争の少し前に、アンリ4世が、ナントの勅令を出して、プロテスタントの信仰の自由を認めていました。
        show:
          - { type: title, text: ナントの勅令とその廃止 }
          - { type: box, at: [80, 140], w: 540, color: green, title: 1598年 ナントの勅令, text: "アンリ4世\nプロテスタントの信仰を認める" }
      - say: しかし、のちのルイ14世がこれを廃止すると、およそ20万人の、腕のよい職人、商人、知識人が国外へ出ていき、フランスは大きな経済的損失を受けました。
        show:
          - { type: box, at: [660, 140], w: 540, color: pink, title: 1685年 廃止, text: "ルイ14世\n約20万人の人材が国外へ流出" }
      - say: 多様な人を受け入れない国からは、才能が逃げていく。今の移民や人材の問題にも通じる教訓です。
        added: true
        show:
          - { type: text, at: [80, 360], w: 1120, color: gray, text: "多様性を拒むと、才能が逃げていく" }
