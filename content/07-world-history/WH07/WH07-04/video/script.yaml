title: ピューリタン革命と名誉革命
scenes:
  - board: whiteboard
    steps:
      - say: 三十年戦争でヨーロッパ大陸が疲れていたころ、イングランドの王、チャールズ1世は、王の権力は神から授かったもの、という王権神授説を信じ、議会を無視して、税をかけ、戦争をくり返しました。
        show:
          - { type: title, text: ピューリタン革命 }
          - { type: box, at: [80, 140], w: 1120, color: pink, title: チャールズ1世, text: "「王の権力は神から授かったもの」（王権神授説）→ 議会を無視" }
      - say: これに対して、ピューリタンを中心とする議会の側が内戦を起こします。ピューリタン革命です。クロムウェルが王を処刑し、王のいない共和政を打ち立てました。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "議会派（ピューリタン中心）の勝利 → **クロムウェル** が王を処刑 → 共和政" }
      - say: しかし、クロムウェル自身が、お酒や演劇を禁じるなど、厳しい道徳を押しつける独裁者になってしまいます。
        show:
          - { type: text, at: [80, 470], w: 1120, color: gray, text: "皮肉：クロムウェル自身が独裁者に（禁酒・演劇禁止）" }

  - board: whiteboard
    steps:
      - say: クロムウェルの死後、王の政治が復活します。しかし1688年、ふたたび起きた革命で議会が主導権をにぎり、議会の同意なしに、税をかけたり、法律を作ったりできない、という立憲君主制が確立されました。
        show:
          - { type: title, text: 1688年　名誉革命 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 立憲君主制, text: "王はいるが、**議会の同意なし** に税・法律を決められない" }
      - say: ほとんど血を流さずに実現したため、名誉革命と呼ばれます。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "ほとんど流血なし → 「**名誉革命**」" }
      - say: 王はいるけれど、政治は議会が行う。今の日本の天皇と国会の関係や、イギリスの王室と議会の関係も、この考え方の流れにあります。マグナカルタから、およそ470年かけて、ここまで来たのです。
        added: true
        show:
          - type: svg
            at: [80, 400]
            w: 1120
            h: 120
            anim: draw
            markup: |
              <rect x="10" y="20" width="300" height="70" rx="12" stroke="#9aa3ad"/>
              <rect x="410" y="20" width="300" height="70" rx="12" stroke="#f4a3b8"/>
              <rect x="810" y="20" width="300" height="70" rx="12" stroke="#f3d77a"/>
              <path d="M320 55 L400 55"/><path d="M382 43 L402 55 L382 67"/>
              <path d="M720 55 L800 55"/><path d="M782 43 L802 55 L782 67"/>
              <g stroke="none" font-size="24" fill="#e8eef5" text-anchor="middle"><text x="160" y="63">1215 マグナカルタ</text><text x="560" y="63">1649 王の処刑</text><text x="960" y="63">1688 名誉革命</text></g>
