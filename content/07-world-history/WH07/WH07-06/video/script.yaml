title: ピルグリムファーザーズと北米植民地
scenes:
  - board: whiteboard
    steps:
      - say: 宗教改革による対立は、ヨーロッパの人々を、新しい大陸へと向かわせる理由にもなりました。
        show:
          - { type: title, text: メイフラワー号 }
      - say: 1620年、イギリス国教会の厳しい統制をきらったピューリタンの一団が、メイフラワー号で北アメリカに渡ります。彼らは、ピルグリムファーザーズと呼ばれます。
        show:
          - { type: box, at: [80, 140], w: 1120, color: blue, title: 1620年　ピルグリムファーザーズ, text: "イギリス国教会をきらったピューリタンが、メイフラワー号で北アメリカへ" }
      - say: 厳しい冬を、先住民の助けで乗りこえ、翌年の収穫を感謝して開いた宴が、アメリカの感謝祭、サンクスギビングの始まりとされています。
        show:
          - { type: box, at: [80, 320], w: 1120, color: yellow, title: 感謝祭（サンクスギビング）, text: "先住民の助けで冬を越え、収穫に感謝した宴が起源" }
      - say: 宗教の自由を求めて渡った人々。この精神が、のちのアメリカという国の考え方の、土台の一つになりました。
        added: true
        show:
          - { type: text, at: [80, 480], w: 1120, color: gray, text: "宗教の自由を求めた移住 → アメリカの精神の土台" }

  - board: whiteboard
    steps:
      - say: 17世紀からは、北アメリカで、イギリス、フランス、スペインが、植民地をめぐって争い続けます。この対立は、本国での戦争とも連動していきました。
        show:
          - { type: title, text: 世界に広がる植民地争い }
          - { type: box, at: [80, 140], w: 540, color: blue, title: 北アメリカ, text: "イギリス・フランス・スペインが争う" }
      - say: インドでも、進出してきたイギリスとフランスが争い、1757年のプラッシーの戦いで、イギリスが勝って、インドを支配する道を開きました。
        show:
          - { type: box, at: [660, 140], w: 540, color: green, title: インド, text: "1757年 プラッシーの戦い\n→ イギリスが勝利" }
      - say: ヨーロッパの国どうしの争いが、世界中を舞台にするようになっていったのです。
        show:
          - { type: text, at: [80, 360], w: 1120, size: l, text: "ヨーロッパの争いが **世界中** に広がる" }
