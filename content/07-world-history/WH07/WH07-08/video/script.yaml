  - board: whiteboard
    steps:
      - say: シュレジエンを取り戻したいオーストリアと、プロイセンの対立は、七年戦争へと発展します。
        show:
          - { type: title, text: 七年戦争（1756〜1763年） }
          - { type: image, src: 1000002912.webp, at: [ 640, 145 ], w: 560, caption: イギリスの統治を受けた国・地域 }
          - { type: text, at: [ 80, 140 ], w: 520, text: "オーストリア vs プロイセン" }
      - say: この戦争は、北アメリカ、インド、カリブ海にまで広がった、世界初の世界大戦とも呼べる規模でした。
        show:
          - { type: box, at: [ 80, 230 ], w: 520, color: blue, text: "北米・インド・カリブ海へ拡大\n＝「世界初の世界大戦」" }
      - say: 結果、イギリスが、カナダとインドでフランスを破り、世界最大の植民地帝国への道を確実にしました。地図の赤い部分が、のちにイギリスの統治を受けた国や地域です。
        show:
          - { type: box, at: [ 80, 410 ], w: 520, color: yellow, text: "イギリスがフランスに勝利\n→ 世界最大の植民地帝国へ" }
      - say: 今も世界中で英語が話され、サッカーやラグビーが盛んなのは、この大英帝国の広がりのなごりです。
        added: true
        show:
          - { type: text, at: [ 80, 580 ], w: 1120, color: gray, text: "世界に広がる英語・サッカー ← 大英帝国のなごり" }
