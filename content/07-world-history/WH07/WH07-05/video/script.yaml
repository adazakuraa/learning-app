title: ルイ14世と絶対王政
scenes:
  - board: whiteboard
    steps:
      - say: イングランドが、王の力を制限する方向に進んだのとは正反対に、フランスでは、王の力が極限まで強められた、絶対王政が花開きました。
        show:
          - { type: title, text: 太陽王ルイ14世 }
          - { type: box, at: [80, 140], w: 540, color: blue, title: イングランド, text: "王の力を **制限**\n（議会が中心）" }
          - { type: box, at: [660, 140], w: 540, color: yellow, title: フランス, text: "王の力を **極限まで強化**\n（絶対王政）" }
      - say: 太陽王、ルイ14世のヴェルサイユ宮殿には、1万人以上の貴族や使用人が住み、毎日のように、はなやかな儀式と舞踏会が開かれました。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "**ヴェルサイユ宮殿**：1万人以上が暮らし、毎日が儀式と舞踏会" }

  - board: whiteboard
    steps:
      - say: これは、ただのぜいたくではありませんでした。有力な貴族を宮殿に集めて見張り、地方で反乱を起こさせないための、政治のしかけでもあったのです。
        show:
          - { type: title, text: ぜいたくの裏の狙い }
          - { type: box, at: [80, 140], w: 1120, color: green, text: "有力貴族を宮殿に集めて **見張る** → 地方で反乱を起こさせない" }
      - say: 日本の江戸幕府の、参勤交代と、よく似た発想ですね。
        added: true
        show:
          - { type: text, at: [80, 300], w: 1120, color: gray, text: "≒ 江戸幕府の参勤交代" }
      - say: しかし、この壮大なしくみを保つための費用が、国の財政を圧迫し続け、およそ100年後の、フランス革命の遠い原因になっていきます。太陽王の輝きは、後の世代への、重いつけでもありました。
        show:
          - { type: box, at: [80, 380], w: 1120, color: pink, text: "莫大な費用 → 財政難 → 約100年後の **フランス革命** の遠因" }
