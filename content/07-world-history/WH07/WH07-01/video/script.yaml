title: カール5世とハプスブルク帝国の絶頂
scenes:
  - board: slide
    steps:
      - say: 第7章、「ヨーロッパの覇権争い」です。
        show:
          - { type: title, text: 第7章　ヨーロッパの覇権争い }
      - say: ハプスブルク家、スペイン、イギリス、フランス。ヨーロッパの国々が、宗教と覇権をめぐって争い、やがて世界中に植民地を広げていきます。
        show:
          - type: list
            at: [80, 130]
            w: 540
            size: s
            items: ["カール5世とハプスブルク帝国", "エリザベス1世とイングランド", "三十年戦争とナントの勅令", "ピューリタン革命と名誉革命"]
          - type: list
            at: [660, 130]
            w: 540
            size: s
            items: ["ルイ14世と絶対王政", "ピルグリムファーザーズと北米", "ムガル帝国とアジアの植民地化", "オーストリア継承戦争と七年戦争"]
      - say: 主権国家、議会、そしてイギリスが世界の中心になっていく流れ。今の国際社会のルールの多くが、この時代に生まれました。
        added: true
        show:
          - { type: box, at: [80, 440], color: yellow, w: 1120, title: この章の目的, text: "主権国家・議会政治の誕生と、イギリスが覇権を握るまでの流れをつかむ" }

  - board: whiteboard
    steps:
      - say: 第3章で触れたハプスブルク家は、16世紀、カール5世の時代に絶頂を迎えます。歴史上もっとも広い領土を一人で支配した君主の一人ですが、二つの大きな脅威に直面しました。
        show:
          - { type: title, text: カール5世の二つの脅威 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: ①東から, text: "オスマン帝国の西進\n（1529年 ウィーン包囲）" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: ②内から, text: "ルターの宗教改革\n帝国内の宗教の分裂" }
      - say: カトリックの守り手として、皇帝はルターをおさえようとしましたが、プロテスタントを支持する領主も多く、1555年、アウクスブルクの和議で妥協します。それぞれの領主が、自分の領地の宗教を決めてよい、という内容で、事実上、プロテスタントを認めたことになります。
        show:
          - { type: box, at: [80, 360], w: 1120, color: yellow, title: 1555年　アウクスブルクの和議, text: "各領主が自分の領地の宗教を決めてよい → プロテスタントを事実上公認" }

  - board: whiteboard
    steps:
      - say: 晩年のカール5世は、大帝国を治めることに疲れ果て、帝国をスペインと、神聖ローマ帝国に分けて、修道院に引退しました。
        show:
          - { type: title, text: 修道院に消えた皇帝 }
          - { type: box, at: [80, 140], w: 540, color: green, title: スペイン, text: "息子 フェリペ2世へ" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: 神聖ローマ帝国, text: "弟 フェルディナント1世へ" }
      - say: 世界を支配した皇帝が、修道院で余生を送る。権力のむなしさを感じさせる結末です。
        show:
          - { type: text, at: [80, 340], w: 1120, size: l, text: "世界を支配した皇帝が、修道院で余生を送る" }
