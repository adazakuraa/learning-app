title: ビザンツ帝国
scenes:
  - board: slide
    steps:
      - say: 第3章、「中世ヨーロッパとイスラム世界」です。
        show:
          - { type: title, text: 第3章　中世ヨーロッパとイスラム世界 }
      - say: ローマ帝国のあと、ヨーロッパではキリスト教会が大きな力を持ちます。一方、アラビア半島ではイスラム教が生まれ、巨大な文明が花開きます。十字軍、モンゴル帝国、ペストまでを見ていきます。
        show:
          - type: list
            at: [ 80, 130 ]
            w: 540
            size: s
            items: [ "ビザンツ帝国", "フランク王国とカール大帝", "封建制度と中世の社会", "カトリック教会と教皇権", "ムハンマドとイスラム教" ]
          - type: list
            at: [ 660, 130 ]
            w: 540
            size: s
            items: [ "イスラム帝国の繁栄", "十字軍", "モンゴル帝国", "ペストと中世の終わり", "教皇権の衰退・百年戦争" ]
      - say: キリスト教の世界とイスラム教の世界。今も続く、二つの文明の出会いと衝突の原点が、ここにあります。
        added: true
        show:
          - { type: box, at: [ 80, 440 ], color: yellow, w: 1120, title: この章の目的, text: "キリスト教世界とイスラム世界、二つの文明の関係の原点をつかむ" }

  - board: whiteboard
    steps:
      - say: 西ローマ帝国がほろびたあとも、東ローマ帝国、ビザンツ帝国は、およそ1000年続きました。
        show:
          - { type: title, text: ビザンツ帝国 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "東ローマ帝国（ビザンツ帝国）　約 **1000年** 続く" }
      - say: 首都は、コンスタンティノープル、今のトルコのイスタンブールです。ヨーロッパとアジアの境目にある、交易の要所でした。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: blue, title: 首都コンスタンティノープル, text: "今のイスタンブール（トルコ）＝ ヨーロッパとアジアの境目" }
      - say: ギリシャ語を公用語とし、正教会、ギリシャ正教を国の宗教にしました。そして古代ローマの遺産を守り、東ヨーロッパやロシアの文化に、深い影響を与えました。
        show:
          - type: list
            at: [ 80, 400 ]
            items: [ "公用語：ギリシャ語", "国教：**正教会**（ギリシャ正教）", "→ 東ヨーロッパ・**ロシア** の文化に影響" ]
      - say: 今もロシアやギリシャ、東ヨーロッパに正教会の信者が多いのは、このビザンツの流れをくんでいるからです。
        added: true
        show: []
  - gen: map
    board: whiteboard
    steps:
      - say: ビザンツ帝国の都、コンスタンティノープルは、今のトルコのイスタンブールです。ヨーロッパとアジアの境目、黒海と地中海を結ぶ海峡にあり、交易と守りの、かなめの場所でした。
        show:
          - { type: title, text: ビザンツ帝国の都 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
