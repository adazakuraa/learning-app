questions:
  - q: 西ローマ帝国の滅亡後も約1000年続いた、東ローマ帝国の別名を何というでしょう？
    a: [ビザンツ帝国, ビザンティン帝国]
    show: ビザンツ帝国
  - q: 王が貴族に土地を与え、貴族が見返りに軍事奉仕をする中世の仕組みを何というでしょう？
    a: [封建制度, 封建制]
    show: 封建制度
  - q: 聖地エルサレムの奪回をめざして、ヨーロッパのキリスト教徒が送った遠征軍を何というでしょう？
    a: [十字軍]
  - q: 14世紀にヨーロッパの人口の約3分の1を奪った感染症を何というでしょう？
    a: [ペスト, 黒死病]
    r: [こくしびょう]
    show: ペスト（黒死病）
  - q: 1215年、イングランドの貴族がジョン王に認めさせた、王の権力を制限する文書を何というでしょう？
    a: [マグナカルタ, 大憲章]
    r: [だいけんしょう]
    show: マグナカルタ（大憲章）
