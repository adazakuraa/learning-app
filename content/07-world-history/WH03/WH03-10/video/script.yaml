title: 教皇権の衰退・マグナカルタ・百年戦争
scenes:
  - board: whiteboard
    steps:
      - say: 中世ヨーロッパを長く支配してきた教会の権威は、13世紀から14世紀にかけて、大きく揺らぎます。その象徴が、アナーニ事件です。
        show:
          - { type: title, text: アナーニ事件（1303年） }
      - say: フランス王フィリップ4世は、聖職者への課税をめぐって、教皇ボニファティウス8世と対立し、ついに教皇を、イタリアのアナーニで捕らえました。教皇はすぐに解放されましたが、この屈辱から体調をくずし、まもなく亡くなります。
        show:
          - { type: box, at: [80, 140], w: 1120, color: pink, text: "フランス王が教皇を捕らえる → 教皇は屈辱のなか死去" }
      - say: カノッサでは、皇帝が教皇に許しを求めました。今度は逆に、王が教皇を捕らえたのです。教皇でも、もう王には勝てない、という時代の変化をはっきり示しました。
        show:
          - { type: box, at: [80, 300], w: 540, color: gray, title: 1077年 カノッサの屈辱, text: "皇帝 ＜ 教皇" }
          - { type: box, at: [660, 300], w: 540, color: yellow, title: 1303年 アナーニ事件, text: "王 ＞ 教皇" }

  - board: whiteboard
    steps:
      - say: 一方、イングランドでは、王の力を制限する動きが、早くから進んでいました。勝手なふるまいの多かったジョン王に対して、貴族たちが反乱を起こし、1215年、マグナカルタを認めさせます。
        show:
          - { type: title, text: 1215年　マグナカルタ }
          - { type: text, at: [80, 140], w: 1120, text: "横暴なジョン王に、貴族たちが認めさせる" }
      - say: 王国の会議の同意なしに、税をかけてはいけない。法による裁判なしに、人を捕まえてはいけない。王の力を、文書で初めて制限したものとして、のちの民主主義と、法の支配の原点とされています。
        show:
          - type: list
            at: [80, 230]
            items: ["会議の同意なしに **課税できない**", "法による裁判なしに **逮捕できない**"]
          - { type: box, at: [80, 420], w: 1120, color: green, text: "王の力を文書で制限 → 民主主義・**法の支配** の原点" }

  - board: whiteboard
    steps:
      - say: イングランドの王家は、もともとフランス系の流れで、フランスの中に広い領土を持っていました。王位をめぐる問題もからみ、1337年、イングランドとフランスの百年戦争が始まります。
        show:
          - { type: title, text: 百年戦争とジャンヌ・ダルク }
          - { type: text, at: [80, 140], w: 1120, text: "1337〜1453年　イングランド vs フランス" }
      - say: その終わりごろに現れた英雄が、ジャンヌ・ダルクです。農村出身の少女で、神の声を聞いた、として立ち上がり、追いつめられていたフランス軍に加わって、オルレアンを解放しました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: ジャンヌ・ダルク, text: "農村の少女「神の声を聞いた」→ オルレアンを解放" }
      - say: しかし敵側にとらえられ、宗教裁判にかけられて、19歳で火あぶりの刑にされます。戦争は最終的に、フランスが、カレー以外のイングランド領をすべて取り戻して、1453年に終わりました。
        show:
          - { type: text, at: [80, 400], w: 1120, text: "19歳で火刑 → 1453年 フランスの勝利で終結" }

  - board: whiteboard
    steps:
      - say: このころ、結婚によって領土を広げたことで知られるのが、オーストリアのハプスブルク家です。神聖ローマ帝国の皇帝の位をほぼひとりじめしながら、結婚によって、スペイン、オランダ、ハンガリーなどを、次々と手に入れました。
        show:
          - { type: title, text: ハプスブルク家 }
          - { type: image, src: 1000002910.webp, at: [560, 130], w: 640, caption: カール5世の時代の最大領土 }
          - { type: box, at: [80, 140], w: 440, color: blue, title: 結婚で広げる, text: "戦争は他国にまかせ\nオーストリアよ、結婚せよ" }
      - say: 最盛期のカール5世は、スペイン王と神聖ローマ皇帝などをかねて、アメリカ大陸の植民地まで支配しました。どこかの領土では、いつも太陽が出ている、日の沈まない帝国です。
        show:
          - { type: box, at: [80, 480], w: 1120, color: yellow, text: "カール5世（在位1519〜1556年）＝「**日の沈まない帝国**」" }
