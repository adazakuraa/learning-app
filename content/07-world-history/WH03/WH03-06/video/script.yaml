title: イスラム帝国の繁栄
scenes:
  - board: whiteboard
    steps:
      - say: 8世紀から13世紀の、アッバース朝の時代は、イスラム文明の黄金期でした。
        show:
          - { type: title, text: イスラム文明の黄金期 }
          - { type: text, at: [80, 140], w: 1120, text: "アッバース朝（8〜13世紀）首都 **バグダード**" }
      - say: 首都バグダードは、人口100万人をこえる、世界最大級の都市でした。知恵の館という研究所では、ギリシャ、インド、ペルシャの知識が、アラビア語に翻訳され、さらに発展させられました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: 知恵の館, text: "ギリシャ・インド・ペルシャの知識をアラビア語に翻訳・発展" }

  - board: whiteboard
    steps:
      - say: この時代のイスラムの学者たちの業績は、驚くべきものです。
        show:
          - { type: title, text: イスラム世界からの贈り物 }
      - say: 例えば、数学の代数学、アルジェブラ、化学のアルコールやアルカリ、といった言葉は、アラビア語から来ています。インドで生まれた数字も、イスラム世界を通ってヨーロッパに伝わったので、アラビア数字と呼ばれるのです。
        read: 例えば、数学の代数学、アルジェブラ、化学のアルコールやアルカリ、といった言葉は、アラビア語から来ています。インドで生まれた数字も、イスラム世界を通ってヨーロッパに伝わったので、アラビア数字と呼ばれるのです。
        added: true
        show:
          - type: list
            at: [80, 140]
            items: ["代数学（algebra）", "アルコール・アルカリ", "アラビア数字（0〜9）← もとはインド"]
      - say: そして、のちのヨーロッパのルネサンスは、このイスラム世界を通ってヨーロッパに戻ってきた、古代ギリシャの知識が、一つの源になっています。
        show:
          - type: svg
            at: [80, 360]
            w: 1120
            h: 120
            anim: draw
            markup: |
              <rect x="10" y="20" width="300" height="70" rx="12" stroke="#9fc7ff"/>
              <rect x="410" y="20" width="300" height="70" rx="12" stroke="#9be0b0"/>
              <rect x="810" y="20" width="300" height="70" rx="12" stroke="#f3d77a"/>
              <path d="M320 55 L400 55"/><path d="M382 43 L402 55 L382 67"/>
              <path d="M720 55 L800 55"/><path d="M782 43 L802 55 L782 67"/>
              <g stroke="none" font-size="26" fill="#e8eef5" text-anchor="middle"><text x="160" y="64">古代ギリシャ</text><text x="560" y="64">イスラム世界</text><text x="960" y="64">ルネサンス</text></g>

  - board: whiteboard
    steps:
      - say: しかし1258年、モンゴル軍がバグダードを攻め落とし、アッバース朝はほろびました。
        show:
          - { type: title, text: 1258年　バグダード陥落 }
          - { type: text, at: [80, 140], w: 1120, text: "**モンゴル軍** がバグダードを攻め落とす → アッバース朝滅亡" }
      - say: 中世のヨーロッパが、教会のもとで停滞していたころ、イスラム世界は、科学と学問の最先端でした。イスラムを遅れた世界と思うのは、大きな誤解なのです。
        added: true
        show:
          - { type: box, at: [80, 240], w: 1120, color: green, text: "中世のイスラム世界 ＝ 科学と学問の **最先端**" }
