title: モンゴル帝国とチンギス・ハン
scenes:
  - board: whiteboard
    steps:
      - say: チンギス・ハンの一生は、まさにドラマです。
        show:
          - { type: title, text: チンギス・ハンの生い立ち }
      - say: モンゴル高原の、小さな部族の長の子として生まれましたが、幼いころに父を毒殺され、部族はばらばらになります。ライバルの部族につかまり、首かせをはめられたこともありました。
        show:
          - type: list
            at: [80, 140]
            items: ["1162年ごろ　小さな部族の長の子として誕生", "幼いころ父が毒殺され、部族は離散", "ライバル部族につかまり首かせをはめられる"]
      - say: そんな少年が、のちに、歴史上最大の、陸の帝国を作ることになります。
        show:
          - { type: text, at: [80, 380], w: 1120, size: l, text: "→ 史上最大の **陸の帝国** を築く" }
      - say: 若いころ、妻がさらわれたときには、命がけで取り戻しに行きました。手に入れた戦利品も、部下に気前よく分けたため、強い人望を集めました。
        show:
          - { type: text, at: [80, 470], w: 1120, color: gray, text: "妻を命がけで取り戻す・戦利品を気前よく分ける → 強い人望" }

  - board: whiteboard
    steps:
      - say: モンゴルの部族をまとめたあと、21年かけて、東は中国から、西は中央アジア、イランにいたる大帝国を作りました。
        show:
          - { type: title, text: モンゴル帝国 }
          - { type: image, src: 1000002909.webp, at: [620, 120], w: 580, caption: モンゴル帝国の最大領土（孫の代まで） }
          - { type: text, at: [80, 140], w: 500, text: "21年で中国から\nイランまで" }
      - say: 戦い方の特徴は、降伏した町には寛大に、抵抗した町は徹底的に破壊する、というメリハリのある支配です。そのため、多くの町は、戦わずに門を開きました。
        show:
          - { type: box, at: [80, 260], w: 500, color: yellow, title: メリハリの支配, text: "降伏 → 寛大\n抵抗 → 徹底的に破壊" }
      - say: また、民族や生まれに関係なく、能力のある人を取り立てる、実力主義を徹底しました。
        show:
          - { type: box, at: [80, 450], w: 500, color: green, title: 実力主義, text: "民族・出身に関係なく登用" }

  - board: whiteboard
    steps:
      - say: 一方で、征服した土地での虐殺や略奪は、すさまじいものでした。
        show:
          - { type: title, text: 英雄か、破壊者か }
          - { type: box, at: [80, 140], w: 540, color: green, title: 英雄, text: "最大の帝国を作った\n東西の交流をさかんに" }
          - { type: box, at: [660, 140], w: 540, color: pink, title: 破壊者, text: "征服地での虐殺・略奪" }
      - say: 最大の帝国を作った英雄と、最悪の破壊者。チンギス・ハンは、歴史上もっとも評価が分かれる人物の一人です。モンゴルでは今も国の英雄ですが、攻められた側の国々では、まったく違う見方をされています。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "立場によって、評価が正反対に分かれる" }
