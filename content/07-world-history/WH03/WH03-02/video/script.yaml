title: フランク王国とカール大帝
scenes:
  - board: whiteboard
    steps:
      - say: 西ローマ帝国がほろんだあと、そのあとには、ゲルマン人の王国がいくつも乱立します。その中から力をつけたのが、フランク王国です。
        show:
          - { type: title, text: カール大帝 }
          - { type: text, at: [80, 140], w: 1120, text: "ゲルマン人の王国が乱立 → **フランク王国** が台頭" }
      - say: フランク王国は、カール大帝の時代に最盛期を迎えます。今のフランス、ドイツ、イタリア北部などを支配する、西ローマ帝国以来の大帝国を作りました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: カール大帝（742〜814年）, text: "今のフランス・ドイツ・イタリア北部などを支配" }
      - say: そして800年、ローマ教皇から、ローマ皇帝の冠を授けられます。キリスト教会と、ゲルマン人の王が手を結んだ瞬間です。
        show:
          - { type: text, at: [80, 400], w: 1120, size: l, text: "800年　教皇から **ローマ皇帝の冠**" }

  - board: whiteboard
    steps:
      - say: カール大帝は、文字が読めませんでした。当時の王族では、めずらしくなかったのです。
        show:
          - { type: title, text: 読めないからこそ }
          - { type: box, at: [80, 140], w: 540, color: green, title: 教育への熱意, text: "修道院に学校を作る\n古い本を保存・複製" }
      - say: でも教育には深い関心を持ち、修道院に学校を作り、ラテン語の本の保存と書き写しに力を入れました。寝るときも、まくらもとに書き板を置いて、文字の練習をしていたといいます。
        show:
          - { type: text, at: [80, 360], w: 540, color: gray, text: "まくらもとに書き板を置いて練習" }
      - say: 一方で、洗礼を拒むザクセン人を大量に殺し、むりやり改宗させました。あたたかさと残酷さを、あわせ持った人物でした。
        show:
          - { type: box, at: [660, 140], w: 540, color: pink, title: 残酷な面, text: "洗礼を拒むザクセン人を\n大量虐殺・強制改宗" }

  - board: whiteboard
    steps:
      - say: カール大帝の死後、帝国は三人の孫によって、東、中、西に分けられます。
        show:
          - { type: title, text: 3つに分かれた帝国 }
          - { type: box, at: [80, 140], w: 360, color: blue, title: 西フランク, text: "→ フランス" }
          - { type: box, at: [460, 140], w: 360, color: green, title: 中部フランク, text: "→ イタリア" }
          - { type: box, at: [840, 140], w: 360, color: yellow, title: 東フランク, text: "→ ドイツ" }
      - say: この分け方が、今のフランス、イタリア、ドイツのもとになりました。ヨーロッパの国の形は、1200年前の相続から始まっていたのです。
        show:
          - { type: text, at: [80, 340], w: 1120, size: l, text: "今のフランス・イタリア・ドイツの **原型**" }
