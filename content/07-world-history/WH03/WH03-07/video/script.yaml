title: 十字軍
scenes:
  - board: whiteboard
    steps:
      - say: 1095年、教皇ウルバヌス2世は、イスラムの勢力が支配していた聖地エルサレムを取り戻そう、と呼びかけました。
        show:
          - { type: title, text: 十字軍のはじまり }
          - { type: text, at: [80, 140], w: 1120, text: "1095年　教皇ウルバヌス2世「聖地 **エルサレム** を取り戻せ」" }
      - say: エルサレムは、ユダヤ教、キリスト教、イスラム教の、三つの宗教すべてにとっての聖地です。だからこそ、奪い合いになったのです。
        added: true
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, title: エルサレム, text: "ユダヤ教・キリスト教・イスラム教の **共通の聖地**" }
      - say: 騎士や農民、聖職者たちが、こぞって中東へ向かいます。十字軍は、およそ200年のあいだに、主なものだけで7回から8回送られました。
        show:
          - { type: text, at: [80, 400], w: 1120, text: "約200年で主なものだけで **7〜8回**" }

  - board: whiteboard
    steps:
      - say: 第1回の十字軍は、例外的に成功し、エルサレムを占領しました。しかしそのとき、すさまじい虐殺が行われます。神のための戦いと、大虐殺が、同時に起きたのです。
        show:
          - { type: title, text: 成功と失敗 }
          - { type: box, at: [80, 140], w: 540, color: pink, title: 第1回, text: "エルサレム占領\nでも凄惨な虐殺" }
      - say: そのあとの十字軍は、ほぼ失敗続きで、イスラム側の英雄、サラディンに撃退されます。
        show:
          - { type: box, at: [660, 140], w: 540, color: gray, title: その後, text: "ほぼ失敗続き\n英雄 **サラディン** に撃退される" }

  - board: whiteboard
    steps:
      - say: サラディンは、軍事の才能だけでなく、寛大さでも知られました。エルサレムを取り戻したとき、住民の虐殺を禁じ、敵であるキリスト教徒からも称賛されました。
        show:
          - { type: title, text: サラディンと獅子心王 }
          - { type: box, at: [80, 140], w: 540, color: green, title: サラディン（イスラム側）, text: "エルサレム奪還時に\n住民の虐殺を禁じる" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: リチャード1世（イングランド）, text: "「獅子心王」\n第3回十字軍" }
      - say: 第3回十字軍では、イングランドの獅子心王、リチャード1世と戦いました。リチャードが病に倒れたとき、サラディンが雪と果物を見舞いに送った、という話が残っています。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "病のリチャードに、サラディンが **雪と果物** を送ったという逸話" }
      - say: 敵同士でも、相手を尊重する。戦争のなかにも、人間らしさがあったことを伝える話です。
        show:
          - { type: text, at: [80, 450], w: 1120, color: gray, text: "敵同士でも、相手を尊重する" }
