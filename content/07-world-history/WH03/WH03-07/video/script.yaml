title: 十字軍
scenes:
  - board: whiteboard
    steps:
      - say: 1095年、教皇ウルバヌス2世は、イスラムの勢力が支配していた聖地エルサレムを取り戻そう、と呼びかけました。
        show:
          - { type: title, text: 十字軍のはじまり }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "1095年　教皇ウルバヌス2世「聖地 **エルサレム** を取り戻せ」" }
      - say: エルサレムは、ユダヤ教、キリスト教、イスラム教の、三つの宗教すべてにとっての聖地です。だからこそ、奪い合いになったのです。
        added: true
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: yellow, title: エルサレム, text: "ユダヤ教・キリスト教・イスラム教の **共通の聖地**" }
      - say: 騎士や農民、聖職者たちが、こぞって中東へ向かいます。十字軍は、およそ200年のあいだに、主なものだけで7回から8回送られました。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, text: "約200年で主なものだけで **7〜8回**" }
  - gen: map
    board: whiteboard
    steps:
      - say: 十字軍の道を、地図で見てみましょう。フランスやドイツなどから出発した騎士たちは、コンスタンティノープルを通り、小アジアをこえて、聖地エルサレムを目指しました。
        show:
          - { type: title, text: 十字軍の道 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M761.6,439.4L759,444.9L753.7,442.5L750.6,454.1L754.3,456.1L750.5,458.4L749.9,463L756.8,460.7L757.2,467.4L749.8,494.7L748.4,490.3L740.1,465.3L744.4,459.6L743.4,458.6L747.3,450.5L750.3,437.3L752.4,432.9L752.8,432.7L757.8,432.7L759.1,429.6L763.1,429.4L763.3,436.6L761.3,439.3Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <path d="M756.8,460.7L749.9,463L750.5,458.4L754.3,456.1L750.6,454.1L753.7,442.5L759,444.9L759,455.6Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <path d="M268.2 123.2 L367.1 141 L485.2 162.9 L544.3 215.8 L662.1 286 L714.1 343.6 L768.7 376.9 L756.9 425.5 L753.9 453.5" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M764.4 436.5 L753.9 453.5 L747.1 434.7" stroke="#f4a3b8" stroke-width="5"/>
              <circle cx="662.1" cy="286" r="9" fill="#9aa3ad" stroke="#0b1c2c" stroke-width="2.5"/>
              <circle cx="754.2" cy="455.6" r="9" fill="#f3d77a" stroke="#0b1c2c" stroke-width="2.5"/>
            id: mo0
          - { type: text, text: コンスタンティノープル, at: [ 682, 376 ], size: s, color: gray, anim: fade, id: ml0_0 }
          - { type: text, text: エルサレム, at: [ 854, 612 ], size: s, color: yellow, anim: fade, id: ml0_1 }
          - { type: text, text: フランス・ドイツ, at: [ 360, 213 ], size: s, color: pink, anim: fade, id: ml0_2 }
        added: true

  - board: whiteboard
    steps:
      - say: 第1回の十字軍は、例外的に成功し、エルサレムを占領しました。しかしそのとき、すさまじい虐殺が行われます。神のための戦いと、大虐殺が、同時に起きたのです。
        show:
          - { type: title, text: 成功と失敗 }
          - { type: box, at: [ 80, 140 ], w: 540, color: pink, title: 第1回, text: "エルサレム占領\nでも凄惨な虐殺" }
      - say: そのあとの十字軍は、ほぼ失敗続きで、イスラム側の英雄、サラディンに撃退されます。
        show:
          - { type: box, at: [ 660, 140 ], w: 540, color: gray, title: その後, text: "ほぼ失敗続き\n英雄 **サラディン** に撃退される" }

  - board: whiteboard
    steps:
      - say: サラディンは、軍事の才能だけでなく、寛大さでも知られました。エルサレムを取り戻したとき、住民の虐殺を禁じ、敵であるキリスト教徒からも称賛されました。
        show:
          - { type: title, text: サラディンと獅子心王 }
          - { type: box, at: [ 80, 140 ], w: 540, color: green, title: サラディン（イスラム側）, text: "エルサレム奪還時に\n住民の虐殺を禁じる" }
          - { type: box, at: [ 660, 140 ], w: 540, color: blue, title: リチャード1世（イングランド）, text: "「獅子心王」\n第3回十字軍" }
      - say: 第3回十字軍では、イングランドの獅子心王、リチャード1世と戦いました。リチャードが病に倒れたとき、サラディンが雪と果物を見舞いに送った、という話が残っています。
        show:
          - { type: text, at: [ 80, 360 ], w: 1120, text: "病のリチャードに、サラディンが **雪と果物** を送ったという逸話" }
      - say: 敵同士でも、相手を尊重する。戦争のなかにも、人間らしさがあったことを伝える話です。
        show:
          - { type: text, at: [ 80, 450 ], w: 1120, color: gray, text: "敵同士でも、相手を尊重する" }
