title: カトリック教会と教皇権
scenes:
  - board: whiteboard
    steps:
      - say: 中世ヨーロッパで、カトリック教会が持っていた力は、今では想像しにくいほど大きなものでした。
        show:
          - { type: title, text: 教会の大きな力 }
      - say: 政治、教育、文化、道徳。そのすべてを教会が見張っていて、教会から追放される、破門をされた人は、社会的に死んだも同然でした。
        show:
          - type: list
            at: [80, 140]
            items: ["政治", "教育", "文化", "道徳"]
          - { type: box, at: [500, 140], w: 700, color: pink, title: 破門, text: "教会から追放 ＝ 社会的に死んだも同然" }

  - board: whiteboard
    steps:
      - say: その力を象徴するのが、教皇グレゴリウス7世と、ドイツ王ハインリヒ4世の争い、叙任権闘争です。お坊さんにあたる聖職者を、誰が任命するのか、をめぐる争いでした。
        show:
          - { type: title, text: カノッサの屈辱（1077年） }
          - { type: box, at: [80, 140], w: 540, color: yellow, title: 教皇グレゴリウス7世, text: "聖職者の任命は教会が" }
          - { type: box, at: [660, 140], w: 540, color: blue, title: ドイツ王ハインリヒ4世, text: "任命権は王にある" }
      - say: 破門されたハインリヒ4世は、真冬に、カノッサ城の外で三日間、はだしで立ち続け、教皇に許しを求めました。これが、カノッサの屈辱です。皇帝が教皇にひざをついた、教会の力の絶頂を示すできごとでした。
        show:
          - { type: text, at: [80, 340], w: 1120, size: l, text: "真冬に3日間はだしで立ち、許しを求める" }
      - say: ただし、ハインリヒ4世は、のちにこの教皇を追い落とし、別の教皇を立てています。許しを求めたのも、一種の政治的な計算だったのです。
        show:
          - { type: text, at: [80, 440], w: 1120, color: gray, text: "のちに教皇を追い落とす → 謝罪も「政治的な計算」" }

  - board: whiteboard
    steps:
      - say: しかし、教会の内部では、腐敗も深刻でした。聖職の売り買い、聖職者の結婚、ぜいたくな生活。
        show:
          - { type: title, text: 教会の腐敗 }
          - type: list
            at: [80, 140]
            items: ["聖職の売り買い", "聖職者の結婚", "ぜいたくな生活"]
      - say: こうした問題への批判が、のちの宗教改革への伏線になっていきます。力が大きくなりすぎた組織は、内側から腐りやすいのです。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "→ のちの **宗教改革** への伏線" }
