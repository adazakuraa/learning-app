title: ペストと中世の終わり
scenes:
  - board: whiteboard
    steps:
      - say: 1347年、黒海のクリミア半島から、ジェノバの商船に乗って、ペストがヨーロッパに上陸しました。黒死病とも呼ばれます。
        show:
          - { type: title, text: 1347年　ペスト（黒死病） }
          - { type: text, at: [80, 140], w: 1120, text: "クリミア半島 → ジェノバの商船 → ヨーロッパへ" }
      - say: わずか5年ほどで、ヨーロッパの人口の、およそ3分の1、2000万人から3000万人が亡くなりました。人類の歴史で、最悪の伝染病の一つです。
        show:
          - type: svg
            at: [80, 230]
            w: 1000
            h: 120
            markup: |
              <g stroke="none"><rect x="40" y="30" width="307" height="60" fill="#f4a3b8" fill-opacity="0.7"/><rect x="347" y="30" width="613" height="60" fill="#9aa3ad" fill-opacity="0.3"/></g>
              <g stroke="none" font-size="22"><text x="60" y="68" fill="#1b2a24">死者 約3分の1</text><text x="560" y="68" fill="#e8eef5">ヨーロッパの人口</text></g>

  - board: whiteboard
    steps:
      - say: 当時の人々には、原因がまったくわかりませんでした。神の怒りだ、ユダヤ人が井戸に毒を入れた、といううわさが飛びかい、各地でユダヤ人が虐殺されました。
        show:
          - { type: title, text: 疫病とスケープゴート }
          - { type: box, at: [80, 140], w: 1120, color: pink, title: デマ, text: "「ユダヤ人が井戸に毒を入れた」→ 各地でユダヤ人虐殺" }
      - say: 日本史の関東大震災でも、同じようなデマで、罪のない人々が殺されました。不安な時代に、誰かを悪者にする、という構造は、今のパンデミックでもくり返されています。
        added: true
        show:
          - { type: text, at: [80, 320], w: 1120, text: "関東大震災のデマ・コロナ禍の差別 ← 同じ構造" }

  - board: whiteboard
    steps:
      - say: ペストは、中世の社会を大きく変えました。
        show:
          - { type: title, text: ペストが中世を終わらせた }
      - say: 働き手が大きく減ったため、農奴の立場が強くなり、封建制度がくずれ始めます。
        show:
          - { type: box, at: [80, 140], w: 540, color: blue, title: 社会の変化, text: "働き手が激減\n→ 農奴の立場が強まる\n→ 封建制度がくずれる" }
      - say: また、教会が人々を救えなかったことで、教会への不信が広がります。これだけ人が死ぬのに、神は何をしているのか、という問いが、中世の世界観をこわしていきました。
        show:
          - { type: box, at: [660, 140], w: 540, color: yellow, title: 心の変化, text: "教会は救えなかった\n→「神は何をしている？」\n→ 教会の権威がゆらぐ" }
      - say: これらが重なって、ルネサンス、宗教改革、そして近代への転換が、加速していきます。
        show:
          - { type: text, at: [80, 400], w: 1120, size: l, text: "→ ルネサンス・宗教改革・**近代** へ" }
