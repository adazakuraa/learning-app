title: ムハンマドとイスラム教の誕生
scenes:
  - board: whiteboard
    steps:
      - say: ムハンマドは、570年ごろ、アラビア半島のメッカで生まれた商人でした。誠実な人柄で知られ、信頼できる人、という意味の、アミーンというあだ名で呼ばれていたといいます。
        show:
          - { type: title, text: ムハンマド }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "570年ごろ　**メッカ**（アラビア半島）の商人" }
          - { type: box, at: [ 80, 230 ], w: 1120, color: green, text: "あだ名は「アミーン」＝ 信頼できる人" }
      - say: 40歳ごろ、洞窟で瞑想していたとき、天使から神の言葉を受けたとされます。そして、唯一の神、アッラーに身をゆだねるよう、説き始めました。
        show:
          - { type: box, at: [ 80, 380 ], w: 1120, color: yellow, title: イスラム, text: "唯一の神 **アッラー** に身をゆだねる（イスラム ＝ 身をゆだねること）" }
  - gen: map
    board: whiteboard
    steps:
      - say: メッカは、アラビア半島の西側、紅海に近い町です。隊商が行き交う、交易の中心でした。
        show:
