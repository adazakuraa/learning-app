      - say: 622年、迫害されたムハンマドは、北のメディナへと移ります。これを、ヒジュラ、聖遷と呼び、イスラム暦の始まりの年になっています。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M388.5 307.5 L377 270.7 L383.5 236.1" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M371.6 252.2 L383.5 236.1 L388.7 255.4" stroke="#f4a3b8" stroke-width="5"/>
              <circle cx="383.7" cy="236.1" r="9" fill="#f4a3b8" stroke="#0b1c2c" stroke-width="2.5"/>
            id: mo1
          - { type: text, text: メディナ, at: [ 542, 356 ], size: s, color: pink, anim: fade, id: ml1_0 }
          - { type: text, text: 622年 ヒジュラ, at: [ 553, 420 ], size: s, color: pink, anim: fade, id: ml1_1 }
        added: true

  - board: whiteboard
    steps:
      - say: たくさんの神々を信じるのが普通だったメッカでは迫害され、622年、信者たちとメディナへ移ります。これを、ヒジュラと呼びます。この年が、イスラム暦の始まり、元年です。
        show:
          - { type: title, text: ヒジュラとメッカ征服 }
          - type: svg
            at: [ 80, 150 ]
            w: 1120
            h: 140
            anim: draw
            markup: |
              <rect x="10" y="30" width="300" height="80" rx="12" stroke="#f4a3b8"/>
              <rect x="410" y="30" width="300" height="80" rx="12" stroke="#9fc7ff"/>
              <rect x="810" y="30" width="300" height="80" rx="12" stroke="#f3d77a"/>
              <path d="M320 70 L400 70"/><path d="M382 58 L402 70 L382 82"/>
              <path d="M720 70 L800 70"/><path d="M782 58 L802 70 L782 82"/>
              <g stroke="none" font-size="24" fill="#e8eef5" text-anchor="middle"><text x="160" y="78">メッカで迫害</text><text x="560" y="78">622年 メディナへ</text><text x="960" y="78">630年 メッカ無血征服</text></g>
      - say: メディナでは、宗教、政治、軍事のすべてのリーダーとして、共同体を率い、630年には、メッカを戦わずに征服しました。
        show:
          - { type: text, at: [ 80, 330 ], w: 1120, text: "宗教・政治・軍事のすべてのリーダー" }

  - board: whiteboard
    steps:
      - say: ムハンマドの死後、後継者のカリフたちがイスラムの共同体を率い、驚くほどの速さで広がっていきます。
        show:
          - { type: title, text: 100年で大帝国へ }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "後継者 ＝ **カリフ**" }
      - say: シリア、エジプト、ペルシャ、北アフリカ、そしてスペインまで。わずか100年で、巨大なイスラム帝国ができあがりました。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: yellow, text: "シリア → エジプト → ペルシャ → 北アフリカ → スペイン（約100年）" }
      - say: これほど早く広まったのは、信仰の熱意だけでなく、征服した土地で税を軽くしたり、奴隷を解放したりする政策が、支配される側にも歓迎されたからでもありました。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, text: "信仰の熱意 ＋ 税の軽減・奴隷解放などが **歓迎された**" }
