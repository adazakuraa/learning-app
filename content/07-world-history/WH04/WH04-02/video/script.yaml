title: 分裂と再統一（隋・唐・宋）
scenes:
  - board: whiteboard
    steps:
      - say: 漢が220年にほろびると、中国は、ふたたび長い分裂の時代に入ります。この間に、仏教が中国に広まりました。
        show:
          - { type: title, text: 隋の統一 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "220年 漢の滅亡 → 長い分裂時代（この間に **仏教** が広まる）" }
      - say: 589年、隋がようやく中国をまとめます。しかし、大運河の建設や、朝鮮半島の高句麗への大遠征など、巨大な事業を次々と進めた煬帝が、人々を追いつめ、わずか2代でほろびました。
        read: 589年、ずいがようやく中国をまとめます。しかし、大運河の建設や、朝鮮半島のこうくりへの大遠征など、巨大な事業を次々と進めたようだいが、人々を追いつめ、わずか2代でほろびました。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: pink, title: 隋（589年〜）, text: "煬帝の大事業（大運河・高句麗遠征）→ 人々を追いつめ、2代で滅亡" }
      - say: 秦と同じパターンですね。歴史は、同じあやまちを、しばしばくり返します。聖徳太子が、遣隋使を送った相手が、この隋です。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, text: "秦と同じパターン（急ぎすぎた大事業 → 短命）" }
          - { type: text, at: [ 80, 480 ], w: 1120, color: gray, text: "日本の遣隋使（小野妹子）の相手" }
  - gen: map
    board: whiteboard
    steps:
      - say: 隋がつくった大運河は、米のとれる南と、政治の中心の北を結ぶ、大動脈になりました。唐の都、長安は、人口100万人ともいわれる、国際都市でした。
        show:
          - { type: title, text: 大運河と唐・宋の都 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
