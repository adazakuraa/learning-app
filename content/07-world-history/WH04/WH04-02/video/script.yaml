title: 分裂と再統一（隋・唐・宋）
scenes:
  - board: whiteboard
    steps:
      - say: 漢が220年にほろびると、中国は、ふたたび長い分裂の時代に入ります。この間に、仏教が中国に広まりました。
        show:
          - { type: title, text: 隋の統一 }
          - { type: text, at: [80, 140], w: 1120, text: "220年 漢の滅亡 → 長い分裂時代（この間に **仏教** が広まる）" }
      - say: 589年、隋がようやく中国をまとめます。しかし、大運河の建設や、朝鮮半島の高句麗への大遠征など、巨大な事業を次々と進めた煬帝が、人々を追いつめ、わずか2代でほろびました。
        read: 589年、ずいがようやく中国をまとめます。しかし、大運河の建設や、朝鮮半島のこうくりへの大遠征など、巨大な事業を次々と進めたようだいが、人々を追いつめ、わずか2代でほろびました。
        show:
          - { type: box, at: [80, 230], w: 1120, color: pink, title: 隋（589年〜）, text: "煬帝の大事業（大運河・高句麗遠征）→ 人々を追いつめ、2代で滅亡" }
      - say: 秦と同じパターンですね。歴史は、同じあやまちを、しばしばくり返します。聖徳太子が、遣隋使を送った相手が、この隋です。
        show:
          - { type: text, at: [80, 400], w: 1120, text: "秦と同じパターン（急ぎすぎた大事業 → 短命）" }
          - { type: text, at: [80, 480], w: 1120, color: gray, text: "日本の遣隋使（小野妹子）の相手" }

  - board: whiteboard
    steps:
      - say: そのあとの唐は、シルクロード交易の中心として、国際色ゆたかな文明を花開かせました。
        read: そのあとのとうは、シルクロード交易の中心として、国際色ゆたかな文明を花開かせました。
        show:
          - { type: title, text: 唐と長安 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, title: 首都・長安（今の西安）, text: "日本の遣唐使・ペルシャ人・アラブ人が行き交う、当時の世界最大級の都市" }
      - say: 首都の長安、今の西安には、日本の遣唐使、ペルシャ人、アラブ人など、世界中の人々が行き交いました。奈良の平城京や、京都の平安京は、この長安をお手本にした都です。
        read: 首都の長安、今のせいあんには、日本の遣唐使、ペルシャ人、アラブ人など、世界中の人々が行き交いました。奈良の平城京や、京都の平安京は、この長安をお手本にした都です。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "→ 平城京・平安京のお手本" }
      - say: この唐の時代に、中国の歴史でただ一人の女性皇帝、則天武后が登場します。有能な人を積極的に取り立てる一方で、反対する者は容赦なく粛清しました。女性が皇帝になどなれない、という時代の常識を、力でくつがえした人物です。
        read: この唐の時代に、中国の歴史でただ一人の女性皇帝、そくてんぶこうが登場します。有能な人を積極的に取り立てる一方で、反対する者は容赦なく粛清しました。女性が皇帝になどなれない、という時代の常識を、力でくつがえした人物です。
        show:
          - { type: box, at: [80, 400], w: 1120, color: pink, title: 則天武后, text: "中国史上ただ一人の女性皇帝　有能な人材の登用と、容赦ない粛清" }

  - board: whiteboard
    steps:
      - say: 唐のあとの混乱を経て、960年に宋ができます。
        read: 唐のあとの混乱を経て、960年にそうができます。
        show:
          - { type: title, text: 宋の技術 }
      - say: 宋では、火薬、羅針盤、活版印刷の実用化が進み、世界で最初の紙幣も使われるなど、今の文明の土台となる技術が、次々と発達しました。民間の商売もさかんになります。
        show:
          - { type: box, at: [80, 140], w: 270, color: pink, title: 火薬, text: "" }
          - { type: box, at: [370, 140], w: 270, color: blue, title: 羅針盤, text: "" }
          - { type: box, at: [660, 140], w: 270, color: green, title: 活版印刷, text: "" }
          - { type: box, at: [950, 140], w: 250, color: yellow, title: 紙幣, text: "" }
      - say: 宋は、最後は13世紀にモンゴル帝国に征服され、フビライ・ハンによって、元が建てられます。日本に攻めてきた、あの元寇の元です。
        read: 宋は、最後は13世紀にモンゴル帝国に征服され、フビライ・ハンによって、げんが建てられます。日本に攻めてきた、あのげん寇のげんです。
        show:
          - { type: text, at: [80, 300], w: 1120, text: "13世紀 モンゴルに征服 → フビライ・ハンの **元**（→ 日本の元寇）" }
