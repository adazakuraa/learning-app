questions:
  - q: 中国を初めて統一し、文字や貨幣、度量衡を統一した皇帝は誰か。
    a: [始皇帝, 秦の始皇帝]
    r: [しこうてい]
    show: 始皇帝
  - q: ユーラシア大陸を横断し、中国とローマを結んだ交易路を何というか。
    a: [シルクロード, 絹の道]
    r: [きぬのみち]
    show: シルクロード
  - q: 唐の都で、日本の遣唐使も訪れた国際都市を何というか。
    a: [長安]
    r: [ちょうあん]
  - q: 仏教を開いた人物（ガウタマ・シッダールタ）を、日本では一般に何と呼ぶか。
    a: [釈迦, ブッダ, お釈迦様]
    show: 釈迦（ブッダ）
