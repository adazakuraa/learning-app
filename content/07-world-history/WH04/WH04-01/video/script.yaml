title: 中国の統一王朝（秦・漢）
scenes:
  - board: slide
    steps:
      - say: 第4章、「アジアの諸文明」です。
        show:
          - { type: title, text: 第4章　アジアの諸文明 }
      - say: 中国の統一王朝の移り変わり、インドで生まれた仏教とヒンドゥー教、そして東と西を結んだシルクロードを見ていきます。
        show:
          - type: list
            items: [ "中国の統一王朝（秦・漢）", "分裂と再統一（隋・唐・宋）", "インドの王朝と仏教・ヒンドゥー教", "シルクロードと東西交流" ]
      - say: 漢字、仏教、律令、お茶。日本の文化の多くは、この中国やインドから伝わったものです。日本史とのつながりを意識して見てください。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "日本に大きな影響を与えたアジアの文明の流れをつかむ" }

  - board: whiteboard
    steps:
      - say: 紀元前の中国は、春秋・戦国時代と呼ばれる、およそ500年の争いの時代が続いていました。これを制して、紀元前221年、中国を初めて統一したのが、秦の始皇帝です。
        read: 紀元前の中国は、春秋・戦国時代と呼ばれる、およそ500年の争いの時代が続いていました。これを制して、紀元前221年、中国を初めて統一したのが、しんのしこうていです。
        show:
          - { type: title, text: 秦の始皇帝 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "紀元前221年　**秦の始皇帝** が中国を初めて統一" }
      - say: 始皇帝は、それまでばらばらだった、文字、お金、長さや重さの単位を統一しました。国によって文字やお金がちがったら、商売も政治も大変ですからね。
        show:
          - type: list
            at: [ 80, 230 ]
            items: [ "文字を統一", "お金を統一", "長さ・重さの単位（度量衡）を統一", "**万里の長城** の建設を命じる" ]
      - say: さらに、北の遊牧民、匈奴の侵入を防ぐため、万里の長城の建設を命じました。
        read: さらに、北の遊牧民、きょうどの侵入を防ぐため、万里の長城の建設を命じました。
        show: []
  - gen: map
    board: whiteboard
    steps:
      - say: 始皇帝が統一した、秦の都、咸陽は、今の西安の近く。中国の、内陸の西寄りにあります。北には、遊牧民の侵入を防ぐために、長城を築きました。
        show:
          - { type: title, text: 秦・漢の中国 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
