              <circle cx="483.6" cy="237" r="9" fill="#f4a3b8" stroke="#0b1c2c" stroke-width="2.5"/>
            id: mo0
          - { type: text, text: 咸陽（今の西安の近く）, at: [ 364, 387 ], size: s, color: pink, anim: fade, id: ml0_0 }
          - { type: text, text: 万里の長城（のちの姿）, at: [ 532, 194 ], size: s, color: white, anim: fade, id: ml0_1 }
        added: true

  - board: whiteboard
    steps:
      - say: しかし始皇帝は、不老不死に異常にこだわり、水銀を薬として飲み続けた結果、50歳ほどで亡くなったとされます。
        show:
          - { type: title, text: 不老不死の皮肉 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: pink, text: "不老不死を求めて **水銀** を飲み続け、50歳ほどで死去" }
      - say: 天下を統一した英雄が、死の恐怖にとらわれて早死にする。そして秦は、その死後、わずか数年でほろびました。急ぎすぎた改革と、厳しすぎる支配に、人々がついてこられなかったのです。
        show:
          - { type: text, at: [ 80, 300 ], w: 1120, text: "死後わずか数年で秦は滅亡（厳しすぎる支配への反発）" }

  - board: whiteboard
    steps:
      - say: そのあとの漢は、およそ400年続いた、安定した帝国です。同じころの西のローマ帝国と並ぶ、東西の二大帝国でした。シルクロードを通じた東西の交流も、この時代に始まります。
        read: そのあとのかんは、およそ400年続いた、安定した帝国です。同じころの西のローマ帝国と並ぶ、東西の二大帝国でした。シルクロードを通じた東西の交流も、この時代に始まります。
        show:
          - { type: title, text: 漢と劉邦 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: blue, title: 漢（約400年）, text: "西のローマ帝国と並ぶ二大帝国　シルクロードの交流が始まる" }
      - say: 漢を建てた劉邦は、農民の出身でした。彼はこう言ったといいます。わたしは、戦略では張良に、国を治めることでは蕭何に、戦いでは韓信にかなわない。しかし、わたしは、この三人を使いこなせた。
        read: 漢を建てたりゅうほうは、農民の出身でした。彼はこう言ったといいます。わたしは、戦略ではちょうりょうに、国を治めることではしょうかに、戦いではかんしんにかなわない。しかし、わたしは、この三人を使いこなせた。
        show:
          - { type: box, at: [ 80, 300 ], w: 360, color: green, title: 張良, text: "戦略" }
          - { type: box, at: [ 460, 300 ], w: 360, color: green, title: 蕭何, text: "内政" }
          - { type: box, at: [ 840, 300 ], w: 360, color: green, title: 韓信, text: "戦い" }
      - say: 自分より優れた人を使いこなす力。今のリーダーにも通じる考え方です。漢字、漢文という言葉も、この漢の名前から来ています。
        show:
          - { type: text, at: [ 80, 470 ], w: 1120, size: l, text: "自分より優れた人を **使いこなす** 力" }
