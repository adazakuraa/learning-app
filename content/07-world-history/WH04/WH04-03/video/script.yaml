title: インドの王朝と仏教・ヒンドゥー教
scenes:
  - board: whiteboard
    steps:
      - say: インドを理解するうえで欠かせないのが、カースト制度です。古代インドでは、生まれによって四つの身分が決まり、身分を移ることは、原則として認められませんでした。
        show:
          - { type: title, text: カースト制度 }
          - type: svg
            at: [ 80, 140 ]
            w: 640
            h: 380
            anim: draw
            markup: |
              <path d="M320 10 L630 360 L10 360 Z" stroke="#f3d77a"/>
              <path d="M231 110 L409 110 M143 210 L497 210 M54 300 L586 300" stroke="#9aa3ad"/>
              <g stroke="none" font-size="22" fill="#e8eef5" text-anchor="middle"><text x="320" y="88">バラモン</text><text x="320" y="170">クシャトリア</text><text x="320" y="262">ヴァイシャ</text><text x="320" y="340">シュードラ</text></g>
          - { type: text, at: [ 760, 192 ], w: 440, text: "← 聖職者" }
          - { type: text, at: [ 760, 274 ], w: 440, text: "← 戦士・王族" }
          - { type: text, at: [ 760, 364 ], w: 440, text: "← 商人・農民" }
          - { type: text, at: [ 760, 444 ], w: 440, text: "← 仕える人々" }
      - say: バラモンは聖職者、クシャトリアは戦士や王族、ヴァイシャは商人や農民、シュードラは、それに仕える人々です。
        show: []

  - board: whiteboard
    steps:
      - say: この厳しい身分制度を問い直すように、紀元前5世紀ごろ、仏教が生まれます。釈迦、ガウタマ・シッダールタは、王族の子でありながら出家し、悟りを開きました。
        read: この厳しい身分制度を問い直すように、紀元前5世紀ごろ、仏教が生まれます。しゃか、ガウタマ・シッダールタは、王族の子でありながら出家し、悟りを開きました。
        show:
          - { type: title, text: 仏教の誕生 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "紀元前5世紀ごろ　**釈迦**（王族の子）が出家し、悟りを開く" }
      - say: 苦しみは欲から生まれる。欲をなくせば、苦しみから解放される。生まれに関係なく、誰でも修行で悟りに近づける、という教えは、カースト制度を否定する、新しいものでした。
        show:
          - {
              type: box,
              at: [ 80, 230 ],
              w: 1120,
              color: yellow,
              text: "苦しみは欲から生まれる → 欲をなくせば解放される

                **生まれに関係なく** 誰でも悟りに近づける"
            }
  - gen: map
    board: whiteboard
    steps:
      - say: 仏教が生まれたのは、インドの北東部、ガンジス川の流域です。
        show:
          - { type: title, text: 仏教が広がった道 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M458,182.3L458.6,185.8L455.7,187.5L456.4,193.1L450.6,191.5L440.1,197.8L440.3,202.9L435.9,210.5L435.4,214.9L431.8,222.2L425.5,220.2L425.2,229.4L423.3,232.4L424.2,236.1L420.2,238.2L415.9,224.2L413.7,224.2L412.3,229.9L407.9,225.3L410.4,220.2L414,219.7L417.8,212.2L413.1,210.6L405.6,210.8L397.8,209.5L397.1,203.3L393.2,202.8L386.8,198.9L383.9,205L389.8,209.8L384.7,213.2L382.9,216.4L387.9,218.8L386.5,224.2L389.3,230.8L390.6,238L389.4,241.2L383.9,241.1L373.9,242.9L374.4,249.5L370,254.6L358.3,260.4L349.2,270.5L343.1,275.9L335.1,281.5L335,285.4L331,287.5L323.6,290.5L319.9,291L317.4,297.4L319.1,308.3L319.6,315.2L316.1,323.1L316.1,337.2L311.9,337.6L308.2,343.9L310.6,346.6L303.2,348.9L300.5,354.5L297.2,356.9L289.5,349.2L285.8,337.7L282.7,329.3L279.8,325.4L275.5,317.4L273.5,307L272.1,301.8L264.7,290.2L261.3,273.7L258.9,262.8L258.9,252.3L257.4,244.2L245.5,249.4L239.8,248.3L229.2,237.8L233.1,234.6L230.7,231.1L221.2,223.6L226.6,217.7L244.5,217.7L242.8,210L238.3,205.5L237.4,198.5L232.1,194.4L241,184.8L250.5,185.5L258.9,175.8L264,166.4L271.9,156.9L271.8,150.1L278.7,144.6L272.1,139.8L269.3,133.3L266.4,124.7L270.5,120.4L282.8,122.8L291.8,121.4L299.7,113L308.4,124.6L307.6,132.6L310.8,137.6L310.5,142.5L304.7,141.2L307,151.8L315,157.8L326.3,164.4L321.1,168.7L317.9,177.4L325.8,180.9L333.5,185.4L344.1,190.6L355.2,191.7L359.9,196.4L366.2,197.2L375.9,199.4L382.7,199.2L383.6,195.6L382.6,189.8L383.2,185.8L388.2,183.9L388.8,191.1L389,193L396.4,196.4L401.5,195L408.3,195.6L415,195.4L415.6,189.7L412.3,186.8L418.8,185.7L426.2,178.8L435.6,172.9L442.4,175.2L448.2,171.3L452,177L449.2,180.9Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <circle cx="357.8" cy="214.6" r="9" fill="#f3d77a" stroke="#0b1c2c" stroke-width="2.5"/>
            id: mo0
          - { type: text, text: ブッダガヤ（悟りの地）, at: [ 228, 369 ], size: s, color: yellow, anim: fade, id: ml0_0 }
        added: true
      - say: 仏教は、のちに、南は、スリランカや東南アジアへ。北は、中央アジアを通って、中国、朝鮮、そして日本へと伝わりました。一方、インドでは、しだいにおとろえ、ヒンドゥー教が広まっていきます。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M357.8 214.6 L325.4 315.3 L322.9 356.6" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M332.7 339.1 L322.9 356.6 L315.3 338.1" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M357.8 214.6 L414.7 247.3 L463.4 290.1 L495.9 315.3" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M487 297.4 L495.9 315.3 L476.4 311.1" stroke="#f4a3b8" stroke-width="5"/>
              <path d="M357.8 214.6 L276.6 156.7 L236 108 L284.7 66.7 L414.7 56 L512.2 108 L585.3 118 L699 92.8 L768.1 120.9" stroke="#9be0b0" stroke-width="5"/>
              <path d="M754.7 106.1 L768.1 120.9 L748.1 122.2" stroke="#9be0b0" stroke-width="5"/>
            id: mo1
          - { type: text, text: 東南アジアへ, at: [ 636, 488 ], size: s, color: pink, anim: fade, id: ml1_0 }
          - { type: text, text: 中国・朝鮮・日本へ, at: [ 701, 185 ], size: s, color: green, anim: fade, id: ml1_1 }
          - { type: text, text: スリランカ, at: [ 483, 513 ], size: s, color: pink, anim: fade, id: ml1_2 }
        added: true

  - board: whiteboard
    steps:
      - say: マウリヤ朝のアショーカ王は、征服の戦争で多くの人が死ぬのを見て深く後悔し、仏教に帰依して、暴力を使わず、慈悲で国を治めることにしました。
        show:
          - { type: title, text: アショーカ王と仏教の広がり }
          - { type: box, at: [ 80, 140 ], w: 1120, color: blue, title: アショーカ王, text: "戦争を後悔 → 仏教に帰依し、非暴力・慈悲の政治" }
      - say: この王の後押しで、仏教は、スリランカ、東南アジア、中央アジア、中国へと広がっていきます。日本に仏教が伝わったのも、この流れの延長です。
        show:
          - { type: text, at: [ 80, 320 ], w: 1120, text: "インド → スリランカ・東南アジア・中央アジア・中国 → 朝鮮 → **日本**" }

  - board: whiteboard
    steps:
      - say: 4世紀から5世紀、インドでは仏教がおとろえ始め、グプタ朝では、インド古来の宗教、ヒンドゥー教が国に後押しされて、黄金期を迎えました。今もインドの人口の約8割は、ヒンドゥー教徒です。
        show:
          - { type: title, text: グプタ朝と「ゼロ」 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: pink, title: グプタ朝, text: "ヒンドゥー教の黄金期（今もインドの約8割がヒンドゥー教徒）" }
      - say: この時代のインドで、ゼロの考え方と、十進法が生まれました。インドの数字は、アラビア数字として、世界中の数学の基礎になっています。わたしたちが毎日使う、0から9の数字のふるさとは、インドなのです。
        show:
          - { type: text, at: [ 80, 320 ], w: 1120, size: l, text: "「**0**」と十進法 → アラビア数字として世界へ" }
