title: インドの王朝と仏教・ヒンドゥー教
scenes:
  - board: whiteboard
    steps:
      - say: インドを理解するうえで欠かせないのが、カースト制度です。古代インドでは、生まれによって四つの身分が決まり、身分を移ることは、原則として認められませんでした。
        show:
          - { type: title, text: カースト制度 }
          - type: svg
            at: [80, 140]
            w: 640
            h: 380
            anim: draw
            markup: |
              <path d="M320 10 L630 360 L10 360 Z" stroke="#f3d77a"/>
              <path d="M231 110 L409 110 M143 210 L497 210 M54 300 L586 300" stroke="#9aa3ad"/>
              <g stroke="none" font-size="22" fill="#e8eef5" text-anchor="middle"><text x="320" y="88">バラモン</text><text x="320" y="170">クシャトリア</text><text x="320" y="262">ヴァイシャ</text><text x="320" y="340">シュードラ</text></g>
          - { type: text, at: [760, 192], w: 440, text: "← 聖職者" }
          - { type: text, at: [760, 274], w: 440, text: "← 戦士・王族" }
          - { type: text, at: [760, 364], w: 440, text: "← 商人・農民" }
          - { type: text, at: [760, 444], w: 440, text: "← 仕える人々" }
      - say: バラモンは聖職者、クシャトリアは戦士や王族、ヴァイシャは商人や農民、シュードラは、それに仕える人々です。
        show: []

  - board: whiteboard
    steps:
      - say: この厳しい身分制度を問い直すように、紀元前5世紀ごろ、仏教が生まれます。釈迦、ガウタマ・シッダールタは、王族の子でありながら出家し、悟りを開きました。
        read: この厳しい身分制度を問い直すように、紀元前5世紀ごろ、仏教が生まれます。しゃか、ガウタマ・シッダールタは、王族の子でありながら出家し、悟りを開きました。
        show:
          - { type: title, text: 仏教の誕生 }
          - { type: text, at: [80, 140], w: 1120, text: "紀元前5世紀ごろ　**釈迦**（王族の子）が出家し、悟りを開く" }
      - say: 苦しみは欲から生まれる。欲をなくせば、苦しみから解放される。生まれに関係なく、誰でも修行で悟りに近づける、という教えは、カースト制度を否定する、新しいものでした。
        show:
          - { type: box, at: [80, 230], w: 1120, color: yellow, text: "苦しみは欲から生まれる → 欲をなくせば解放される\n**生まれに関係なく** 誰でも悟りに近づける" }

  - board: whiteboard
    steps:
      - say: マウリヤ朝のアショーカ王は、征服の戦争で多くの人が死ぬのを見て深く後悔し、仏教に帰依して、暴力を使わず、慈悲で国を治めることにしました。
        show:
          - { type: title, text: アショーカ王と仏教の広がり }
          - { type: box, at: [80, 140], w: 1120, color: blue, title: アショーカ王, text: "戦争を後悔 → 仏教に帰依し、非暴力・慈悲の政治" }
      - say: この王の後押しで、仏教は、スリランカ、東南アジア、中央アジア、中国へと広がっていきます。日本に仏教が伝わったのも、この流れの延長です。
        show:
          - { type: text, at: [80, 320], w: 1120, text: "インド → スリランカ・東南アジア・中央アジア・中国 → 朝鮮 → **日本**" }

  - board: whiteboard
    steps:
      - say: 4世紀から5世紀、インドでは仏教がおとろえ始め、グプタ朝では、インド古来の宗教、ヒンドゥー教が国に後押しされて、黄金期を迎えました。今もインドの人口の約8割は、ヒンドゥー教徒です。
        show:
          - { type: title, text: グプタ朝と「ゼロ」 }
          - { type: box, at: [80, 140], w: 1120, color: pink, title: グプタ朝, text: "ヒンドゥー教の黄金期（今もインドの約8割がヒンドゥー教徒）" }
      - say: この時代のインドで、ゼロの考え方と、十進法が生まれました。インドの数字は、アラビア数字として、世界中の数学の基礎になっています。わたしたちが毎日使う、0から9の数字のふるさとは、インドなのです。
        show:
          - { type: text, at: [80, 320], w: 1120, size: l, text: "「**0**」と十進法 → アラビア数字として世界へ" }
