title: メソポタミア文明
scenes:
  - board: whiteboard
    steps:
      - say: 文明の発祥の地として、もっともよく知られるのが、今のイラクにあたる、メソポタミアです。
        show:
          - { type: title, text: メソポタミア文明 }
          - { type: image, src: 1000002905.webp, at: [720, 120], w: 480, caption: 2つの川と「肥沃な三日月地帯」 }
          - { type: text, at: [80, 140], w: 600, text: "今の **イラク** あたり" }
      - say: メソポタミアとは、川のあいだの土地、という意味です。ティグリス川とユーフラテス川という、2つの大きな川にはさまれたこの地域で、紀元前3500年ごろ、世界最初の都市文明が生まれました。
        show:
          - { type: box, at: [80, 220], w: 600, color: blue, title: 「川のあいだの土地」, text: "ティグリス川 と ユーフラテス川" }
          - { type: text, at: [80, 400], w: 600, text: "紀元前3500年ごろ\n**世界最初の都市文明**" }
      - say: 大きな川は、水と、肥えた土を運んできます。農業がさかんになり、たくさんの人が集まって住めるようになったのです。
        added: true
        show:
          - { type: text, at: [80, 540], w: 600, color: gray, text: "川 → 水と肥えた土 → 農業 → 都市" }

  - board: whiteboard
    steps:
      - say: シュメール人が作った都市国家では、神殿を中心とした社会ができました。都市国家とは、一つの町が、一つの国になっているものです。
        show:
          - { type: title, text: 楔形文字 }
          - { type: image, src: 1000002906.webp, at: [640, 130], w: 560, caption: 粘土板に刻まれた楔形文字 }
          - { type: box, at: [80, 140], w: 520, color: green, title: 都市国家, text: "一つの町が一つの国\n神殿が中心" }
      - say: もっとも大切な発明の一つが、楔形文字です。粘土の板に、葦のペンを押しつけて書いた、もっとも古い文字の一つです。
        read: もっとも大切な発明の一つが、くさびがた文字です。粘土の板に、葦のペンを押しつけて書いた、もっとも古い文字の一つです。
        show:
          - { type: box, at: [80, 340], w: 520, color: yellow, title: 楔形文字, text: "粘土板に葦のペンで\n押しつけて書く" }
      - say: 文字ができると、税や取引を記録できます。文字は、大勢の人をまとめて国を動かすための、道具だったのです。
        added: true
        show:
          - { type: text, at: [80, 570], w: 1120, color: gray, text: "文字 ＝ 税や取引を記録し、国を動かす道具" }

  - board: whiteboard
    steps:
      - say: バビロニアのハンムラビ王が定めた、ハンムラビ法典は、目には目を、歯には歯を、という言葉で知られます。
        show:
          - { type: title, text: ハンムラビ法典 }
          - { type: box, at: [80, 140], w: 1120, color: yellow, text: "「目には目を、歯には歯を」" }
      - say: これは、やられたら同じだけやり返してよい、という意味というより、それ以上の仕返しは禁止する、という意味がありました。やりすぎの復讐に、ブレーキをかけるルールです。世界で最も古い法律の一つです。
        show:
          - { type: box, at: [80, 300], w: 540, color: gray, title: よくある誤解, text: "やられたら、やり返せ" }
          - { type: box, at: [660, 300], w: 540, color: green, title: 本当の意味, text: "**それ以上** の仕返しは禁止" }

  - board: whiteboard
    steps:
      - say: メソポタミアには、大洪水の物語も残っています。ノアの箱舟によく似た物語が、ギルガメシュ叙事詩に書かれているのです。
        show:
          - { type: title, text: 洪水の神話 }
          - { type: text, at: [80, 140], w: 1120, text: "『**ギルガメシュ叙事詩**』の洪水物語 ≒ ノアの箱舟" }
      - say: これは、旧約聖書よりも古い時代のものです。旧約聖書が、この物語をもとにしたのでは、という可能性も議論されています。
        show:
          - { type: text, at: [80, 230], w: 1120, text: "旧約聖書（ユダヤ教・キリスト教の聖典）より **古い**" }
      - say: 大きな川のそばに住む人々にとって、洪水は恵みであり、恐怖でもありました。その記憶が、各地で似た神話を生んだのかもしれません。
        show:
          - { type: text, at: [80, 330], w: 1120, color: gray, text: "洪水 ＝ 川の恵みと恐怖 → 各地に似た神話" }
