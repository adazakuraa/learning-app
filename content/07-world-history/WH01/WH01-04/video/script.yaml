title: インダス・中国文明
scenes:
  - board: whiteboard
    steps:
      - say: 今のパキスタンからインド西部、インダス川の流域では、紀元前2600年ごろ、インダス文明が栄えました。
        show:
          - { type: title, text: インダス文明 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "紀元前2600年ごろ　**インダス川** 流域（パキスタン・インド西部）" }
      - say: モヘンジョ・ダロなどの計画都市には、碁盤の目のような道、上下水道、公衆浴場までありました。4500年前に、下水道があったのです。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: blue, title: モヘンジョ・ダロ, text: "碁盤の目の道路・上下水道・公衆浴場" }
      - say: しかし、インダス文字は今もまだ読み解かれておらず、どんな言葉を話していたのかは謎です。なぜおとろえたのかもわからず、気候の変化で農業がうまくいかなくなった、という説が有力です。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, text: "文字は **未解読**・おとろえた理由も謎（気候変動説が有力）" }

  - board: whiteboard
    steps:
      - say: 中国文明は、黄河の流域に生まれ、紀元前1600年ごろ、殷という王朝ができます。
        read: 中国文明は、黄河の流域に生まれ、紀元前1600年ごろ、いんという王朝ができます。
        show:
          - { type: title, text: 中国文明 }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "**黄河** 流域　紀元前1600年ごろ **殷**（いん）王朝" }
      - say: 殷では、亀の甲羅や、動物の骨に刻んだ、甲骨文字が使われていました。これが、漢字のはじまりです。
        read: いんでは、かめの甲羅や、動物の骨に刻んだ、こうこつ文字が使われていました。これが、漢字のはじまりです。
        show:
          - { type: box, at: [ 80, 230 ], w: 1120, color: yellow, title: 甲骨文字, text: "亀の甲羅や骨に刻んだ文字 → **漢字のはじまり**" }
      - say: その多くは、占いの結果を記録したものです。当時の王は、大事なことを決めるとき、必ず占いに頼っていたことがわかります。今わたしたちが使っている漢字は、3000年以上前の、占いの記録から来ているのです。
        show:
          - { type: text, at: [ 80, 400 ], w: 1120, color: gray, text: "王は大事な決断をすべて占いで決めていた" }
  - gen: map
    board: whiteboard
    steps:
      - say: 二つの文明の場所を、地図で見てみましょう。西にあるのが、インダス川の流域に生まれた、インダス文明。モヘンジョ・ダロなどの都市がありました。
        show:
          - { type: title, text: インダス文明と中国文明 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: |-
              <path d="M283.4,203.7L269.6,218.4L253.7,221L232,216.7L225,224.2L230.1,239.3L235,250.8L246.5,259.2L234.4,268.9L234.6,280.8L220.7,297.5L211.8,314.1L196.8,331.2L180.2,329.9L164.5,346.8L173.9,354L175.5,366.2L183.5,374.3L186.4,387.8L154.9,387.7L145.4,398.2L134.9,394.2L130.7,383L119.6,370.9L93.3,373.9L70.1,374.2L50,376.4L55.4,358L75.9,349.8L74.8,342.4L67.9,339.8L67.6,325.6L53.9,318.4L48.1,308.5L41.1,299.9L65,308.3L79.3,305.8L87.8,307.9L90.7,304.3L100.7,305.8L119.2,298.9L119.8,284.8L127.7,275.4L138.3,275.5L139.9,270.7L150.8,268.6L156.1,270.1L161.7,265.4L160.9,255.3L167,245L176.1,240.7L170.4,229.3L184,229.9L188,223.6L187.3,217L194.5,209.7L192.8,200.9L189.4,193.5L197.8,185.7L213.2,182L229.6,180L236.8,176.7L245.1,174.6L255.7,183L259.9,196.6Z" fill="#f3d77a" fill-opacity="0.55" stroke="#f3d77a" stroke-width="1.5"/>
              <path d="M321.4 272.2 L271.4 221 L235.7 205.4 L207.1 233.1 L192.9 280.5 L164.3 321.6 L147.1 353.9 L137.1 390.2" stroke="#8fc4ff" stroke-width="6"/>
              <circle cx="144.9" cy="340.6" r="9" fill="#f3d77a" stroke="#0b1c2c" stroke-width="2.5"/>
            id: mo0
          - { type: text, text: モヘンジョ・ダロ, at: [ 55, 471 ], size: s, color: yellow, anim: fade, id: ml0_0 }
          - { type: text, text: インダス川, at: [ 361, 429 ], size: s, color: blue, anim: fade, id: ml0_1 }
        added: true
      - say: 東にあるのが、黄河の流域に生まれた中国文明です。黄河は、大きく曲がりながら、東の海へと流れています。
        show:
          - type: svg
            at: *a1
            w: 1000
            h: 520
            anim: fade
            markup: <path d="M542.9 212.3 L614.3 194.8 L657.1 168.1 L692.9 122.2 L750 111 L757.1 177 L750 217.6 L792.9 215.8 L835.7 194.8 L868.6 164.4" stroke="#8fc4ff" stroke-width="6"/>
            id: mo1
          - { type: text, text: 黄河, at: [ 925, 290 ], size: s, color: blue, anim: fade, id: ml1_0 }
          - { type: text, text: 中国文明, at: [ 854, 437 ], size: s, color: yellow, anim: fade, id: ml1_1 }
        added: true

  - board: whiteboard
    steps:
      - say: そのあとの周の時代は長く続きますが、後半は、各地の有力者が争う、春秋・戦国時代という乱世になります。
        read: そのあとのしゅうの時代は長く続きますが、後半は、各地の有力者が争う、しゅんじゅう・戦国時代という乱世になります。
        show:
          - { type: title, text: 乱世が思想を生む }
          - { type: text, at: [ 80, 140 ], w: 1120, text: "周の後半 → **春秋・戦国時代**（各地の諸侯が争う乱世）" }
      - say: この混乱のなかで、孔子、孟子、老子、孫子など、のちの東アジアの文化を形づくる思想家たちが、次々と現れました。
        read: この混乱のなかで、こうし、もうし、ろうし、そんしなど、のちの東アジアの文化を形づくる思想家たちが、次々と現れました。
        show:
          - { type: box, at: [ 80, 240 ], w: 270, color: green, title: 孔子, text: "儒教" }
          - { type: box, at: [ 370, 240 ], w: 270, color: green, title: 孟子, text: "性善説" }
          - { type: box, at: [ 660, 240 ], w: 270, color: blue, title: 老子, text: "道教" }
          - { type: box, at: [ 950, 240 ], w: 250, color: pink, title: 孫子, text: "兵法" }
      - say: 世の中が乱れると、どう生きるべきか、どう国を治めるべきかを、真剣に考える人が出てくる。乱世が思想を生む、という歴史のパターンです。
        show:
          - { type: text, at: [ 80, 440 ], w: 1120, size: l, text: "乱世が **思想** を生む" }
