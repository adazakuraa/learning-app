title: 人類の誕生とアフリカからの拡散
scenes:
  - board: slide
    steps:
      - say: 世界史の最初の章、「人類の誕生と古代文明」です。
        show:
          - { type: title, text: 第1章　人類の誕生と古代文明 }
      - say: アフリカで生まれた人類が世界に広がり、大きな川のほとりで、最初の文明を生み出すまでを見ていきます。
        show:
          - type: list
            items: ["人類の誕生とアフリカからの拡散", "メソポタミア文明", "エジプト文明とファラオ", "インダス・中国文明", "フェニキア・ヘブライと地中海"]
      - say: 文字、法律、宗教、アルファベット。今の世界の土台の多くは、数千年前のこの時代に生まれました。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "文明のはじまりを知り、今の世界の「土台」がどこから来たかをつかむ" }

  - board: whiteboard
    steps:
      - say: 今の人類、ホモ・サピエンスが生まれたのは、およそ30万年前のアフリカです。
        show:
          - { type: title, text: アフリカから始まった旅 }
          - { type: text, at: [80, 140], w: 1120, text: "約30万年前　アフリカで **ホモ・サピエンス** 誕生" }
      - say: そして、およそ6万年から7万年前ごろ、アフリカを出て、世界各地へ広がり始めました。
        show:
          - type: svg
            at: [80, 220]
            w: 1120
            h: 260
            anim: draw
            markup: |
              <ellipse cx="420" cy="170" rx="90" ry="70" stroke="#f3d77a"/>
              <path d="M470 120 L620 70"/><path d="M600 64 L622 69 L606 86"/>
              <path d="M620 70 L900 60"/><path d="M880 48 L902 60 L882 72"/>
              <path d="M620 70 L560 20"/><path d="M570 38 L558 18 L580 24"/>
              <path d="M900 60 L1040 200"/><path d="M1020 196 L1042 202 L1036 180"/>
              <g stroke="none" font-size="24" fill="#e8eef5" text-anchor="middle"><text x="420" y="178">アフリカ</text><text x="520" y="15">ヨーロッパ</text><text x="900" y="40">アジア</text><text x="960" y="240">オセアニア・アメリカへ</text></g>
      - say: わたしたち全員の祖先は、アフリカにいたのです。人類の歴史は、アフリカから始まった、壮大な旅の記録でもあります。
        show: []

  - board: whiteboard
    steps:
      - say: 広がっていく途中で、ホモ・サピエンスは、ネアンデルタール人など、ほかの人類と出会いました。
        show:
          - { type: title, text: ネアンデルタール人との出会い }
          - { type: text, at: [80, 140], w: 1120, text: "ほかの人類（**ネアンデルタール人** など）と出会う" }
      - say: その一部とは子どもも作っていたことが、遺伝子の研究でわかっています。今のヨーロッパやアジアの人のDNAには、ネアンデルタール人の遺伝子が、1から2%ほど含まれているのです。
        read: その一部とは子どもも作っていたことが、遺伝子の研究でわかっています。今のヨーロッパやアジアの人のディーエヌエーには、ネアンデルタール人の遺伝子が、いちからにパーセントほど含まれているのです。
        show:
          - { type: box, at: [80, 230], w: 1120, color: blue, text: "ヨーロッパ・アジアの人のDNAの **約1〜2%** はネアンデルタール人由来" }

  - board: whiteboard
    steps:
      - say: およそ1万年前、農業革命が起こります。狩りと採集の暮らしから、農業と牧畜の暮らしへの転換です。
        show:
          - { type: title, text: 約1万年前　農業革命 }
      - say: 農業を始めると、一つの場所に住み続けるようになり、人口が増え、仕事の分担が生まれます。やがて、貧富の差が生まれ、国ができていきました。
        show:
          - type: svg
            at: [80, 140]
            w: 1120
            h: 120
            anim: draw
            markup: |
              <g stroke="#9be0b0"><rect x="0" y="30" width="170" height="60" rx="10"/><rect x="190" y="30" width="170" height="60" rx="10"/><rect x="380" y="30" width="170" height="60" rx="10"/><rect x="570" y="30" width="170" height="60" rx="10"/><rect x="760" y="30" width="170" height="60" rx="10"/><rect x="950" y="30" width="170" height="60" rx="10" stroke="#f3d77a"/></g>
              <g stroke="none" font-size="24" fill="#e8eef5" text-anchor="middle"><text x="85" y="68">農業</text><text x="275" y="68">定住</text><text x="465" y="68">人口増加</text><text x="655" y="68">分業</text><text x="845" y="68">貧富の差</text><text x="1035" y="68">国家</text></g>
      - say: 日本史で学んだ、縄文から弥生への変化と、同じ流れですね。世界中で、同じことが起きていたのです。
        added: true
        show:
          - { type: text, at: [80, 300], w: 1120, color: gray, text: "日本の「縄文 → 弥生」と同じ流れが、世界中で起きた" }
      - say: ただし、農業で人類は本当に豊かになったのか、という問いには、むしろ労働時間が増え、健康が悪くなった、という研究もあります。農業革命を、手放しで進歩と呼べるかは、今も議論されています。
        show:
          - { type: box, at: [80, 380], w: 1120, color: pink, title: 農業は進歩だった？, text: "労働時間が増え、健康が悪化したという研究も" }
