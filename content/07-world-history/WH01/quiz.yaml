questions:
  - q: 今の人類（ホモ・サピエンス）が誕生したのは、約何万年前のどの大陸でしょう？「約（　）万年前の（　）」の形で答えてください。
    a: [30万年前のアフリカ, 約30万年前のアフリカ, 30アフリカ]
    show: 約30万年前のアフリカ
  - q: シュメール人が粘土板に押しつけて書いた、最古の文字体系を何というでしょう？
    a: [楔形文字, くさび形文字]
    show: 楔形文字
  - q: 「目には目を、歯には歯を」で知られる、バビロニアの法典を何というでしょう？
    a: [ハンムラビ法典]
  - q: ヘロドトスが「エジプトは（　　）の賜物」と言った。（　　）に入る川の名前は何でしょう？
    a: [ナイル, ナイル川]
    r: [ないるがわ]
    show: ナイル（川）
  - q: 中国の殷で使われた、亀の甲羅や獣の骨に刻まれた文字を何というでしょう？
    a: [甲骨文字]
