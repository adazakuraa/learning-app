title: エジプト文明とファラオ
scenes:
  - board: whiteboard
    steps:
      - say: ナイル川は、毎年あふれて、上流から肥えた土を運んできます。この贈り物の上に、エジプト文明は生まれました。
        show:
          - { type: title, text: ナイルの賜物 }
          - { type: text, at: [80, 140], w: 1120, text: "ナイル川が毎年あふれる → **肥えた土** が運ばれる → 農業" }
      - say: ギリシャの歴史家、ヘロドトスは、エジプトはナイルの賜物、と言いました。まさに、そのとおりの表現です。
        read: ギリシャの歴史家、ヘロドトスは、エジプトはナイルのたまもの、と言いました。まさに、そのとおりの表現です。
        show:
          - { type: box, at: [80, 240], w: 1120, color: yellow, text: "「エジプトはナイルの賜物」（ヘロドトス）" }
      - say: 洪水がいつ来るかを知るために、天文学や暦が発達しました。1年を365日とする暦も、エジプトで生まれています。
        added: true
        show:
          - { type: text, at: [80, 400], w: 1120, color: gray, text: "洪水の時期を知る → 天文学・暦（1年 ＝ 365日）" }

  - board: whiteboard
    steps:
      - say: エジプトの王、ファラオは、神そのものとしてあがめられました。
        show:
          - { type: title, text: ファラオとピラミッド }
          - { type: box, at: [80, 140], w: 540, color: yellow, title: ファラオ, text: "王 ＝ 神そのもの" }
      - say: 死んだあとも、来世で永遠に生きると信じられていたため、遺体はミイラとして保存され、巨大なお墓、ピラミッドが作られました。
        show:
          - { type: box, at: [660, 140], w: 540, color: blue, title: 来世を信じる, text: "遺体を **ミイラ** に\n巨大な墓 **ピラミッド**" }
      - say: どうやって作ったかは、まだすべてはわかっておらず、宇宙人が作った、という話まであります。でも最近の研究では、大勢の労働者が、計画的に作ったことが、ほぼ確かめられています。
        show:
          - { type: text, at: [80, 360], w: 1120, text: "宇宙人説？ → 実際は **大勢の労働者が計画的に** 建設" }

  - board: whiteboard
    steps:
      - say: クレオパトラは、エジプト最後の女性ファラオです。ローマのカエサルや、その部下だったアントニウスと、次々と恋愛関係を結んだことで有名です。
        show:
          - { type: title, text: クレオパトラ }
          - { type: text, at: [80, 140], w: 1120, text: "エジプト最後の女性ファラオ　カエサル・アントニウスと恋愛関係" }
      - say: 絶世の美女、というイメージがありますが、実際は、いくつもの言葉をあやつる、知性派の政治家でした。エジプトを、ローマの支配から守ろうとしたのです。
        show:
          - { type: box, at: [80, 230], w: 540, color: gray, title: イメージ, text: "絶世の美女" }
          - { type: box, at: [660, 230], w: 540, color: green, title: 実際, text: "多くの言語を話す\n**知性派の政治家**" }
      - say: 彼女と話すのは、楽器を聴くようだった、と記録されるほど、話術がたくみだったといいます。最後はローマに敗れ、毒蛇に自分をかませて、命を絶ったとされています。
        show:
          - { type: text, at: [80, 440], w: 1120, color: gray, text: "「彼女と話すのは楽器を聴くようだった」（プルタルコス）" }
