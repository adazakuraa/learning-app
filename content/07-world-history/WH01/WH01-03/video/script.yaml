          - { type: text, text: ナイル川, at: [ 628, 522 ], size: s, color: blue, anim: fade, id: ml0_0 }
          - { type: text, text: 地中海, at: [ 505, 144 ], size: s, color: gray, anim: fade, id: ml0_1 }
          - { type: text, text: エジプト, at: [ 486, 407 ], size: s, color: yellow, anim: fade, id: ml0_2 }
