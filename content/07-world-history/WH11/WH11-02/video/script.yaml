title: 中国の台頭とアメリカの相対的衰退
scenes:
  - board: whiteboard
    steps:
      - say: 冷戦が終わったあと、ただ一つの超大国として世界に君臨したアメリカに対し、21世紀に入って、中国が急速に台頭してきました。
        show:
          - { type: title, text: 中国の台頭 }
          - { type: text, at: [80, 140], w: 1120, text: "冷戦後：アメリカが唯一の超大国 → 21世紀：**中国** が急成長" }
      - say: 1978年に、鄧小平が始めた改革開放の政策で、経済成長を続けた中国は、2010年、日本を抜いて、GDP、つまり国の経済の大きさで、世界2位になりました。
        read: せんきゅうひゃくななじゅうはち年に、とうしょうへいが始めた改革開放の政策で、経済成長を続けた中国は、にせんじゅう年、日本を抜いて、ジーディーピー、つまり国の経済の大きさで、世界2位になりました。
        show:
          - type: list
            at: [80, 230]
            items: ["1978年　**鄧小平** の改革開放（市場経済を取り入れる）", "2010年　GDPで日本を抜き **世界2位**", "軍事・技術でもアメリカに迫る"]
      - say: 毛沢東の時代の失敗を反省し、共産党の政治は保ったまま、市場経済を取り入れる、という独自の道を選んだのです。
        added: true
        show:
          - { type: box, at: [80, 440], w: 1120, color: yellow, text: "共産党の一党支配 ＋ 市場経済 ＝ 中国独自のしくみ" }

  - board: whiteboard
    steps:
      - say: アメリカと中国の対立は、貿易、技術、軍事、人権と、さまざまな分野に広がり、新しい冷戦、新冷戦とも呼ばれます。
        show:
          - { type: title, text: 米中の「新冷戦」 }
          - { type: box, at: [80, 140], w: 270, color: blue, title: 貿易, text: "関税の応酬" }
          - { type: box, at: [370, 140], w: 270, color: green, title: 技術, text: "半導体" }
          - { type: box, at: [660, 140], w: 270, color: pink, title: 軍事, text: "台湾・南シナ海" }
          - { type: box, at: [950, 140], w: 250, color: yellow, title: 人権, text: "少数民族など" }
      - say: 台湾の問題、南シナ海の領有権の争い、半導体をめぐる技術の主導権争い。これらは、21世紀の世界の秩序を形づくる、もっとも重要なテーマです。
        show:
          - { type: text, at: [80, 340], w: 1120, text: "21世紀の世界秩序を決める最重要テーマ" }
      - say: 新しい大国の台頭が、もとの大国との緊張を生む。第8章で見た、ドイツとイギリスの関係を思い出してください。歴史を知ることは、この緊張を、どう戦争にしないか、を考える手がかりにもなります。
        added: true
        show:
          - { type: text, at: [80, 430], w: 1120, color: gray, text: "新興国 vs 既存の大国 ← 19世紀のドイツとイギリスにも似た構図" }
