title: 民主主義の危機とポピュリズム
scenes:
  - board: whiteboard
    steps:
      - say: 2016年、アメリカでトランプ氏が大統領選挙に勝ち、イギリスは国民投票でEUからの離脱、ブレグジットを決めました。世界は驚きました。
        read: にせんじゅうろく年、アメリカでトランプ氏が大統領選挙に勝ち、イギリスは国民投票でイーユーからの離脱、ブレグジットを決めました。世界は驚きました。
        show:
          - { type: title, text: ポピュリズムの波 }
          - { type: text, at: [80, 140], w: 1120, text: "2016年　トランプ氏の当選・イギリスのEU離脱（ブレグジット）" }
      - say: グローバル化による経済の格差、移民の問題、エリートへの不信。こうしたことを背景に、今の政治に怒る人々が、強いリーダーや、自分の国を優先する、と訴える政治家を支持する、ポピュリズムの波が、各国で高まっています。
        show:
          - type: list
            at: [80, 230]
            items: ["グローバル化による格差", "移民の問題", "エリートへの不信"]
          - { type: box, at: [600, 230], w: 600, color: yellow, title: ポピュリズム, text: "「エリート vs 普通の人々」\n複雑な問題を単純に語る" }

  - board: whiteboard
    steps:
      - say: ポピュリズムとは、エリートや今の権力者と、普通の市民、という単純な対立の形で支持を集め、複雑な問題を、単純にして語る政治のスタイルです。
        show:
          - { type: title, text: SNSと民主主義 }
          - { type: box, at: [80, 140], w: 1120, color: pink, text: "SNSでフェイクニュースが拡散 → 感情的な訴えが、理性的な議論を上回りやすい" }
      - say: SNSが広まって、フェイクニュースが拡散しやすくなった今、感情的な訴えが、理性的な議論を上回りやすくなっています。
        read: エスエヌエスが広まって、フェイクニュースが拡散しやすくなった今、感情的な訴えが、理性的な議論を上回りやすくなっています。
        show: []

  - board: whiteboard
    steps:
      - say: 民主主義が、独裁者を生んだ。ヒトラーの歴史が示すように、民主主義は、内側からくずれることがあります。
        show:
          - { type: title, text: 民主主義を支えるもの }
          - { type: text, at: [80, 140], w: 1120, size: l, text: "民主主義は **内側から** くずれることがある" }
      - say: 市民が、情報を見きわめる力を持ち、歴史を知り、政治に関心を持ち続けること。それが、民主主義を支える条件です。
        show:
          - type: list
            at: [80, 260]
            items: ["情報を見きわめる力（メディアリテラシー）", "**歴史を知る** こと", "政治に関心を持ち続けること"]
      - say: 人類の誕生から、今のわたしたちまで。世界史は、遠い国の昔話ではなく、今日のニュースの、長い長い前置きです。ここまで学んだ知識を、ぜひ、これからのニュースを見る目に生かしてください。
        added: true
        show:
          - { type: box, at: [80, 460], w: 1120, color: green, text: "世界史 ＝ 今日のニュースの、長い長い前置き" }
