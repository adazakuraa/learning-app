title: 9.11とテロリズム・中東の戦争
scenes:
  - board: slide
    steps:
      - say: 世界史の最後の章、「現代世界の課題」です。
        show:
          - { type: title, text: 第11章　現代世界の課題 }
      - say: テロとの戦い、中国の台頭、そして民主主義の危機。今まさに進んでいる、世界の大きな問題を見ていきます。
        show:
          - type: list
            items: [ "9.11とテロリズム・中東の戦争", "中国の台頭とアメリカの相対的衰退", "民主主義の危機とポピュリズム" ]
      - say: ここまで学んできた歴史は、すべて、今につながっています。過去を知ることで、今のニュースが、ちがって見えてくるはずです。
        added: true
        show:
          - { type: box, color: yellow, w: 1000, title: この章の目的, text: "これまでの歴史の流れから、今の世界の問題を読み解く" }

  - board: whiteboard
    steps:
      - say: 2001年9月11日、イスラム過激派の組織、アルカイダが、乗っ取った旅客機で、ニューヨークの世界貿易センタービルなどに突入し、およそ3000人が亡くなりました。
        show:
          - { type: title, text: 2001年9月11日 }
          - { type: box, at: [ 80, 140 ], w: 1120, color: pink, title: アメリカ同時多発テロ, text: "アルカイダが旅客機を乗っ取り、世界貿易センタービルなどに突入　約3000人が死亡" }
      - say: アルカイダを率いたのは、サウジアラビア出身の、オサマ・ビン・ラディンです。その組織は、冷戦の時代、ソ連のアフガニスタン侵攻に対抗するため、アメリカが支援した、イスラムの戦士たちの流れをくんでいました。
        show:
          - { type: text, at: [ 80, 320 ], w: 1120, text: "ビン・ラディンの組織 ← 冷戦期に **アメリカが支援した** 戦士たちの流れ" }
      - say: かつて味方として育てた勢力が、のちに自分に牙をむく。冷戦の代理戦争が残した、皮肉な結果です。
        show:
          - { type: text, at: [ 80, 410 ], w: 1120, color: gray, text: "冷戦の代理戦争が残した、皮肉な結果" }
  - gen: map
    board: whiteboard
    steps:
      - say: 事件が起きたのは、アメリカのニューヨークです。その後、アメリカは、遠く離れたアフガニスタン、そしてイラクで、戦争を始めました。
        show:
          - { type: title, text: 9.11とその後の戦争 }
          - { type: image, src: map-main.svg, at: &a1 [ 140, 140 ], w: 1000, anim: fade, id: mb }
          - type: svg
            at: *a1
            w: 1000
