genre: 遊び・ゲーム
questions:
  - {p: 85, q: "鬼が目をふさいで唱える間に近づき、振り向いたら止まる遊びで、唱える言葉は「だるまさんが〇〇〇〇」。〇に入る言葉は何でしょう？", a: [ころんだ, 転んだ]}
  - {p: 80, q: "百人一首は、何人の歌人の和歌を一首ずつ集めたものでしょう？", a: ['100', 100人]}
  - {p: 45, q: "将棋で、相手の王将を「詰ませる」ことを目指すゲームで、将棋盤のマス目は縦横何マスずつでしょう？", a: ['9', 9マス]}
  - {p: 30, q: "囲碁の碁盤は、縦横それぞれ何本の線が引かれているでしょう？", a: ['19', 19本]}
  - {p: 75, q: "白と黒の石をはさんでひっくり返し、最後に多い色が勝つボードゲームは何でしょう？", a: [オセロ, リバーシ]}
  - {p: 25, q: "麻雀で使う牌の、「萬子」「筒子」と並ぶもう一つの数牌は何でしょう？", a: [索子, ソーズ]}
  - {p: 80, q: "トランプで、ハート・ダイヤ・クラブと並ぶ、もう一つのマークは何でしょう？", a: [スペード]}
  - {p: 55, q: "サイコロの1の目の裏側は何の目でしょう？", a: ['6']}
  - {p: 35, q: "チェスで、斜めにだけ何マスでも動ける駒は何でしょう？", a: [ビショップ]}
  - {p: 60, q: "お正月の遊びで、羽子板で羽根をつき合う遊びを何というでしょう？", a: [羽根つき, 羽つき]}
  - {p: 40, q: "お正月の遊びで、「犬も歩けば棒に当たる」などの読み札を使うかるたを何というでしょう？", a: [いろはかるた, いろはがるた]}
  - {p: 40, q: "「人生ゲーム」の元となったボードゲームが生まれた国はどこでしょう？", a: [アメリカ, アメリカ合衆国]}
  - {p: 45, q: "将棋で、「歩」が敵陣に入って裏返ると何になるでしょう？", a: [と金, と]}
  - {p: 55, q: "1974年にハンガリーの建築学者が考案した、6面の色をそろえる立体パズルは何でしょう？", a: [ルービックキューブ]}
  - {p: 80, q: "紙を折って作る日本の伝統的な遊びで、鶴やかぶとなどを作るものを何というでしょう？", a: [折り紙, 折紙]}
  - {p: 25, q: "けん玉で、玉を大皿・小皿・中皿と移していく基本の技を何というでしょう？", a: [世界一周]}
  - {p: 55, q: "ブロックを積み上げて崩れないように1本ずつ抜いていくゲームは何でしょう？", a: [ジェンガ]}
  - {p: 60, q: "数字の書かれたカードを順に出し、手札が1枚になったら宣言するカードゲームは何でしょう？", a: [UNO, ウノ]}
  - {p: 55, q: "9×9のマスに、縦・横・3×3の枠で1〜9の数字が重ならないように埋めるパズルは何でしょう？", a: [数独, ナンプレ, ナンバープレース]}
  - {p: 45, q: "盤上で土地を買い集め、相手を破産させると勝ちになるボードゲームは何でしょう？", a: [モノポリー]}
