genre: 行事・風習
questions:
  - {p: 80, q: "豆をまいて鬼を追い払い、年の数だけ豆を食べる、立春の前日の行事は何でしょう？", a: [節分]}
  - {p: 70, q: "織姫と彦星が年に一度会えるとされ、笹に願いごとを書いた短冊を飾る、7月7日の行事は何でしょう？", a: [七夕]}
  - {p: 65, q: "3月3日の桃の節句に、女の子の成長を願って飾る人形を何というでしょう？", a: [ひな人形, 雛人形, おひなさま]}
  - {p: 60, q: "5月5日の端午の節句に、男の子の成長を願って空に泳がせる、魚をかたどったのぼりは何でしょう？", a: [こいのぼり, 鯉のぼり]}
  - {p: 55, q: "3歳・5歳・7歳の子どもの成長を祝って、11月15日ごろに神社にお参りする行事は何でしょう？", a: [七五三]}
  - {p: 50, q: "年越しそばを食べ、除夜の鐘が鳴る、12月31日の夜を何というでしょう？", a: [大晦日, 大みそか, おおみそか]}
  - {p: 45, q: "除夜の鐘は、人間の煩悩の数とされる何回つくでしょう？", a: ['108', 108回]}
  - {p: 55, q: "冬至の日に入ると風邪をひかないといわれる、柑橘類を浮かべたお風呂を何湯というでしょう？", a: [ゆず湯, 柚子湯]}
  - {p: 40, q: "1月7日の朝、せりやなずななどを入れて食べるおかゆを何というでしょう？", a: [七草がゆ, 七草粥]}
  - {p: 35, q: "正月に飾った門松などの正月飾りを焼く、1月15日ごろの火祭りを何というでしょう？", a: [どんど焼き, 左義長]}
  - {p: 50, q: "祖先の霊を迎えて供養する夏の行事で、きゅうりの馬やなすの牛を飾るものは何でしょう？", a: [お盆, 盂蘭盆, 盆]}
  - {p: 40, q: "春分の日と秋分の日を中日とする前後3日ずつの7日間を何というでしょう？", a: [彼岸, お彼岸]}
  - {p: 30, q: "立春から数えて88日目にあたり、茶摘みの歌にも歌われる日を何というでしょう？", a: [八十八夜]}
  - {p: 45, q: "夏の土用の丑の日に食べる習慣がある魚は何でしょう？", a: [ウナギ, うなぎ, 鰻]}
  - {p: 35, q: "京都の夏の風物詩で、毎年8月16日に山に「大」の字などの火をともす行事は何でしょう？", a: [五山送り火, 大文字焼き, 送り火]}
  - {p: 40, q: "京都・八坂神社の祭礼で、7月に山鉾巡行が行われる日本三大祭の一つは何でしょう？", a: [祇園祭]}
  - {p: 30, q: "青森の夏祭りで、巨大な灯籠の山車が街を練り歩くものは何でしょう？", a: [ねぶた, ねぶた祭, ねぶた祭り]}
  - {p: 25, q: "徳島県で毎年8月に行われ、「踊る阿呆に見る阿呆」の囃子言葉で知られる踊りは何でしょう？", a: [阿波踊り]}
  - {p: 45, q: "10月31日、仮装した子どもが「トリック・オア・トリート」と言って家を回る行事は何でしょう？", a: [ハロウィン, ハロウィーン]}
  - {p: 35, q: "結婚式などで新郎新婦に贈るお祝いの品のお返しを何というでしょう？", a: [引き出物, 引出物]}
  - {p: 30, q: "亡くなった人を送る儀式で、葬儀の前夜に親族や知人が集まる儀式を何というでしょう？", a: [通夜, お通夜]}
  - {p: 40, q: "お祝いの贈り物に付ける、紅白などの水引と折った紙飾りを何というでしょう？", a: [のし, 熨斗]}
