genre: 日本の名所
questions:
  - {p: 70, q: "京都市北区にある鹿苑寺の舎利殿で、金箔におおわれた建物は何でしょう？", a: [金閣, 金閣寺]}
  - {p: 60, q: "海の上に建つ朱塗りの大鳥居で知られる、広島県の宮島にある神社は何でしょう？", a: [厳島神社]}
  - {p: 55, q: "千本鳥居で知られ、全国の稲荷神社の総本宮である京都の神社は何でしょう？", a: [伏見稲荷大社, 伏見稲荷]}
  - {p: 50, q: "「見ざる・言わざる・聞かざる」の三猿の彫刻で知られる、徳川家康をまつる栃木県の神社は何でしょう？", a: [日光東照宮, 東照宮]}
  - {p: 45, q: "白い外観から「白鷺城」とも呼ばれ、世界遺産に登録されている兵庫県の城は何でしょう？", a: [姫路城]}
  - {p: 40, q: "「清水の舞台から飛び降りる」ということわざの由来となった、京都の寺は何でしょう？", a: [清水寺]}
  - {p: 45, q: "雷門の大きな提灯で知られる、東京都台東区の寺は何でしょう？", a: [浅草寺]}
  - {p: 35, q: "北海道の札幌で毎年2月に開かれ、大きな雪像が並ぶ祭りは何でしょう？", a: [さっぽろ雪まつり, 雪まつり, 札幌雪まつり]}
  - {p: 30, q: "合掌造りの集落で世界遺産に登録されている、岐阜県の村はどこでしょう？", a: [白川郷, 白川村]}
  - {p: 35, q: "日本三名園の一つで、石川県金沢市にある庭園は何でしょう？", a: [兼六園]}
  - {p: 25, q: "日本三名園は、金沢の兼六園、岡山の後楽園と、水戸の何でしょう？", a: [偕楽園]}
  - {p: 40, q: "長崎県にある、かつての炭鉱の島で、その形から「軍艦島」と呼ばれる島の正式名は何でしょう？", a: [端島]}
  - {p: 30, q: "鳥取県の日本海沿いに広がる、日本最大級の砂丘は何でしょう？", a: [鳥取砂丘]}
  - {p: 35, q: "沖縄県那覇市にあり、琉球王国の王城だった城は何でしょう？", a: [首里城]}
  - {p: 45, q: "大阪の道頓堀にある、両手を上げて走る人の大きな看板は、何という会社のものでしょう？", a: [グリコ, 江崎グリコ]}
  - {p: 25, q: "日本三大名瀑の一つで、栃木県日光市にある、中禅寺湖の水が落ちる滝は何でしょう？", a: [華厳の滝, 華厳滝]}
  - {p: 30, q: "群馬県の温泉地で、湯もみや湯畑で知られる温泉は何でしょう？", a: [草津温泉, 草津]}
  - {p: 40, q: "愛媛県松山市にあり、日本最古の温泉の一つとされる温泉は何でしょう？", a: [道後温泉, 道後]}
