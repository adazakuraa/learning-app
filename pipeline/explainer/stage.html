<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-jp/500.css" />
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-jp/700.css" />
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-jp/900.css" />
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; color: #22304a; }
  .scene { position: absolute; inset: 0; }
  .scene > svg { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: visible; }
  #sub { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; pointer-events: none; }
  #sub span { background: rgba(20, 28, 48, 0.8); color: #fff; font-weight: 700; font-size: 29px; line-height: 1.45; padding: 7px 22px 8px; border-radius: 14px; max-width: 1120px; text-align: center; }
</style>
</head>
<body>
<div id="stage"><div id="sub"><span></span></div></div>
<script type="module">
  import { createEngine } from './engine.js';
  let X = null;
  window.setup = async (tl, unitId, base) => {
    X = createEngine(document.getElementById('stage'), tl, base);
    const mod = await import(`./units/${unitId}.js`);
    mod.build(X, tl);
    X.finish();
  };
  window.seek = (t) => X.seek(t);
</script>
</body>
</html>
